name: XLite release

# Builds XLite (the light v2rayA replacement) and publishes it as the release "xlite" of this repo.
# On any OpenWrt 22.03+ router:  wget -O- https://github.com/<this repo>/releases/download/xlite/install.sh | sh
# Every file of the tool is inside this workflow: the repo needs nothing else.

on:
  # every day: XLite's ad lists only (the job "ads"); the tool is built only when started by hand
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      zero_copy:
        description: 'Core with the zero-copy download for VLESS over TCP (patch 900): tested on the runner first, left out by itself if a test fails'
        type: boolean
        default: true
      channel:
        description: 'Who gets this build: users (the release "xlite") or developers (the release "xlite-dev", opened in the tool with the developers code)'
        type: choice
        options: [ users, developers ]
        default: users

permissions:
  contents: write

# one run at a time per channel (two runs uploading to the same release mixed files of two builds); the daily ad
# lists have their own group, so a release never waits for them
concurrency:
  group: xlite-${{ github.event_name == 'schedule' && 'ads' || inputs.channel || 'users' }}
  cancel-in-progress: false

env:
  XRAY_VERSION: 25.1.30
  XRAY_HASH: 983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e
  GO_VERSION: 1.23.12
  RELEASE_TAG: ${{ inputs.channel == 'developers' && 'xlite-dev' || 'xlite' }}
  LIBUBOX_REV: da2d205a5cf3e877c45a2eec488218cbaf452e7d
  UCI_REV: 74f6277aabffc943d026f406df57c22595134c42
  UCODE_REV: 3f64c8089bf3ea4847c96b91df09fbfcaec19e1d   # the ucode of OpenWrt 24.10

jobs:
  # XLite's ad lists (medium, high): several public lists merged into one per level, names under a blocked one
  # dropped (the same blocking in fewer lines: less RAM on the router). Published as the release "xlite-ads",
  # which both update channels use
  ads:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Build the ad lists
        run: |
          mkdir -p ads
          cat > build_ads.py <<'XLITE_ADS_PY'
          # XLite's own ad lists: several public lists merged into one dnsmasq file per level.
          # build_ads.py OUTDIR [SRCDIR]   (SRCDIR: already downloaded sources, for tests; otherwise downloads them)
          # One "local=/name/" blocks the name and everything under it, so a name under one already blocked is dropped:
          # the same blocking in fewer lines (less RAM in dnsmasq).
          import os, re, sys, json, hashlib, urllib.request

          H = 'https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/dnsmasq/'
          SOURCES = {
              'hagezi-promini': H + 'pro.mini.txt',
              'hagezi-ultimate': H + 'ultimate.txt',
              'hagezi-popupads': H + 'popupads.txt',
              'hagezi-native-samsung': H + 'native.samsung.txt',
              'hagezi-native-xiaomi': H + 'native.xiaomi.txt',
              'hagezi-native-huawei': H + 'native.huawei.txt',
              'hagezi-native-tiktok': H + 'native.tiktok.txt',
              'hagezi-native-amazon': H + 'native.amazon.txt',
              'hagezi-native-winoffice': H + 'native.winoffice.txt',
              'hagezi-tif-mini': H + 'tif.mini.txt',
              'hagezi-nsfw': H + 'nsfw.txt',
              'hagezi-gambling-mini': H + 'gambling.mini.txt',
              'oisd-big': 'https://big.oisd.nl/dnsmasq2',
              'adguard-dns': 'https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt',
          }
          LEVELS = {
              # medium: the common ads and trackers, small
              'medium': { 'need': [ 'hagezi-promini' ], 'use': [ 'hagezi-promini', 'adguard-dns' ], 'min': 50000 },
              # high: every kind of ad, pop-up, tracker and phone/TV telemetry the lists know
              'high': { 'need': [ 'hagezi-ultimate' ], 'use': [ 'hagezi-ultimate', 'hagezi-popupads', 'oisd-big', 'adguard-dns',
                  'hagezi-native-samsung', 'hagezi-native-xiaomi', 'hagezi-native-huawei', 'hagezi-native-tiktok',
                  'hagezi-native-amazon', 'hagezi-native-winoffice' ], 'min': 200000 },
              # add-ons, on top of any level (the router joins the ones chosen)
              'add-security': { 'need': [ 'hagezi-tif-mini' ], 'use': [ 'hagezi-tif-mini' ], 'min': 20000 },
              'add-adult': { 'need': [ 'hagezi-nsfw' ], 'use': [ 'hagezi-nsfw' ], 'min': 10000 },
              'add-gambling': { 'need': [ 'hagezi-gambling-mini' ], 'use': [ 'hagezi-gambling-mini' ], 'min': 10000 },
          }
          # never blocked (XLite itself needs them: updates, line checks, the bot, the lists; and the big services that
          # would stop working whole): the name and every name above it
          KEEP = [ 'github.com', 'githubusercontent.com', 'objects.githubusercontent.com', 'raw.githubusercontent.com',
              'cdn.jsdelivr.net', 'jsdelivr.net', 'cp.cloudflare.com', 'cloudflare.com', 'one.one.one.one', 'dns.google',
              'www.google.com', 'google.com', 'gstatic.com', 'connectivitycheck.gstatic.com', 'api.telegram.org', 't.me',
              'telegram.org', 'whatsapp.net', 'whatsapp.com', 'instagram.com', 'cdninstagram.com', 'facebook.com', 'fbcdn.net',
              'youtube.com', 'googlevideo.com', 'ytimg.com', 'apple.com', 'icloud.com', 'microsoft.com', 'windowsupdate.com',
              'openwrt.org', 'downloads.openwrt.org', 'adguard-dns.io', 'speed.cloudflare.com', 'speedtest.net', 'ookla.com' ]

          # YouTube's own ad hosts (the router's core blocks the same ones): in every level, whatever the lists have
          YT_ADS = [ 'googleads.g.doubleclick.net', 'ad.doubleclick.net', 'static.doubleclick.net', 'pubads.g.doubleclick.net',
              'securepubads.g.doubleclick.net', 'stats.g.doubleclick.net', 'cm.g.doubleclick.net', 'www.googleadservices.com',
              'googleadservices.com', 'pagead2.googlesyndication.com', 'tpc.googlesyndication.com', 'adservice.google.com',
              's0.2mdn.net', 'imasdk.googleapis.com', 'ads.youtube.com' ]

          NAME = re.compile(r'^(?=.{1,253}$)([a-z0-9_]([a-z0-9_-]{0,61}[a-z0-9_])?\.)+[a-z][a-z0-9-]{0,62}$')

          # an exception rule (AdGuard "@@||name^": the name and everything under it are fine, a false positive the list
          # itself fixes): kept apart, so the other sources of the level do not block it either
          def allows(text):
              for raw in text.splitlines():
                  m = re.match(r'^@@\|\|([a-z0-9._-]+)\^(\$important)?\|?$', raw.strip().lower())
                  if m and NAME.match(m.group(1).strip('.')): yield m.group(1).strip('.')

          def names(text):
              for raw in text.splitlines():
                  l = raw.strip().lower()
                  if not l or l[0] in '#!;[' or l.startswith('@@'):
                      continue
                  d = None
                  m = re.match(r'^(?:local|address|server)=/([^/]+)/', l)
                  if m: d = m.group(1)
                  elif l.startswith('||'):
                      m = re.match(r'^\|\|([a-z0-9._-]+)\^(\$important)?$', l)   # a plain name rule only, no modifiers
                      if m: d = m.group(1)
                  else:
                      p = l.split('#')[0].split()
                      if len(p) == 2 and p[0] in ('0.0.0.0', '127.0.0.1', '::', '::1'): d = p[1]
                      elif len(p) == 1: d = p[0].lstrip('*.')
                  if d:
                      d = d.strip('.')
                      if NAME.match(d): yield d

          def compact(ds):
              # sorted by the name read backwards: a parent comes right before everything under it
              out, last = [], None
              for d in sorted(set(ds), key=lambda x: x.split('.')[::-1]):
                  if last and (d == last or d.endswith('.' + last)):
                      continue
                  out.append(d); last = d
              return out

          def kept(d, extra=()):
              # the name itself or a name above it (that one would block it too: one "local=/x/" covers all under x);
              # an exception frees the name and the names under it only (a parent stays blocked: dropping it would
              # unblock a whole ad network for one false positive)
              return any(d == k or k.endswith('.' + d) for k in KEEP) or any(d == a or d.endswith('.' + a) for a in extra)

          def main():
              outd = sys.argv[1]; srcd = sys.argv[2] if len(sys.argv) > 2 else None
              os.makedirs(outd, exist_ok=True)
              got, info, ok = {}, {}, {}
              for k, u in SOURCES.items():
                  try:
                      if srcd:
                          t = open(os.path.join(srcd, k)).read()
                      else:
                          req = urllib.request.Request(u, headers={ 'User-Agent': 'XLite-lists' })
                          t = urllib.request.urlopen(req, timeout=120).read().decode('utf-8', 'replace')
                      got[k] = list(names(t)); ok[k] = set(allows(t)); info[k] = len(got[k])
                  except Exception as e:
                      info[k] = 'failed: %s' % e
              stats = {}
              for lv, c in LEVELS.items():
                  for n in c['need']:
                      if not got.get(n): sys.exit('level %s: source %s missing' % (lv, n))
                  all_ = [ d for s in c['use'] for d in got.get(s, []) ] + (YT_ADS if lv in ('medium', 'high') else [])
                  # the protected names out first: dropped after the merge, the names under them would be gone with them
                  ex = set().union(*[ ok.get(s, set()) for s in c['use'] ])
                  ls = compact([ d for d in all_ if not kept(d, ex) ])
                  if len(ls) < int(os.environ.get('ADS_MIN', c['min'])): sys.exit('level %s: only %d names' % (lv, len(ls)))
                  body = ''.join('local=/%s/\n' % d for d in ls)
                  open(os.path.join(outd, 'xlite-ads-%s.txt' % lv), 'w').write(body)
                  stats[lv] = { 'names': len(ls), 'raw': len(all_), 'sha256': hashlib.sha256(body.encode()).hexdigest(),
                      'sources': [ s for s in c['use'] if got.get(s) ] }
              json.dump({ 'sources': info, 'levels': stats }, open(os.path.join(outd, 'xlite-ads.json'), 'w'), indent=1)
              with open(os.path.join(outd, 'xlite-ads.sha256'), 'w') as f:
                  for lv in LEVELS: f.write('%s  xlite-ads-%s.txt\n' % (stats[lv]['sha256'], lv))
              print(json.dumps(stats, indent=1))

          main()
          XLITE_ADS_PY
          python3 -I build_ads.py ads
          echo "## Ad lists" >> $GITHUB_STEP_SUMMARY
          python3 -c "import json;d=json.load(open('ads/xlite-ads.json'));[print('- **%s**: %d names (%d before merging)' % (k, v['names'], v['raw'])) for k, v in d['levels'].items()];[print('- source %s: %s' % (k, v)) for k, v in d['sources'].items()]" >> $GITHUB_STEP_SUMMARY
      - name: Publish the ad lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release view xlite-ads -R "$R" > /dev/null 2>&1 || gh release create xlite-ads -R "$R" --target "$GITHUB_SHA" --title "XLite ad lists" --notes "XLite's ad blocking lists, rebuilt every day." --prerelease --latest=false
          # the checksums last: a router never sees a new sum next to an old list for long
          gh release upload xlite-ads -R "$R" --clobber ads/xlite-ads-medium.txt ads/xlite-ads-high.txt ads/xlite-ads.json
          gh release upload xlite-ads -R "$R" --clobber ads/xlite-ads.sha256

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: "1. XLite files"
        run: |
          mkdir -p out
          echo "# XLite build $GITHUB_RUN_NUMBER" > out/summary.md
          # the package (src/), its installer and the tests (t/): one xz archive in base85 ('$' written as '.')
          python3 -c 'import sys,base64;sys.stdout.buffer.write(base64.b85decode("".join(sys.stdin.read().split()).replace(".","$")))' <<'XLITE_ALL' | xz -d | tar -x
