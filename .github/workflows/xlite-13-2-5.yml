          mkdir -p "$(dirname "install.sh.in")"
          cat > "install.sh.in" <<'XLITE_INSTALLER'
          #!/bin/sh
          # XLite installer / updater for OpenWrt 22.03+ (nftables)
          #   wget -O- https://github.com/@REPO@/releases/download/@TAG@/install.sh | sh
          # Installs the LuCI page (Services > XLite), the service and the xray core with the zero-copy download.
          # Settings and servers in /etc/config/xlite are kept on update. v2rayA is left alone until you
          # press "connect" in XLite (then it is stopped and disabled; "xlite uninstall" brings it back).
          REPO='@REPO@'
          TAG='@TAG@'
          VERSION='@VERSION@'
          BUILD='@BUILD@'
          BASE="https://github.com/$REPO/releases/download/$TAG"
          SHARE=/usr/share/xlite
          TMP=$(mktemp -d /tmp/xlite-inst.XXXXXX) || exit 1
          trap 'rm -rf "$TMP"' EXIT

          say() { echo "[XLite] $*"; }
          die() { echo "[XLite] خطأ: $*"; exit 1; }

          fetch() {   # url file
          	if command -v curl > /dev/null 2>&1; then curl -fsSL --retry 2 --connect-timeout 20 -o "$2" "$1"
          	else wget -q -T 30 -O "$2" "$1"; fi
          }

          [ -f /etc/openwrt_release ] || die "هذا مو OpenWrt"
          command -v nft > /dev/null 2>&1 || die "nftables مو موجود: XLite يحتاج OpenWrt 22.03 أو أحدث"
          command -v ucode > /dev/null 2>&1 || die "ucode مو موجود: XLite يحتاج OpenWrt 22.03 أو أحدث"

          if command -v opkg > /dev/null 2>&1; then PM=opkg
          elif command -v apk > /dev/null 2>&1; then PM=apk
          else die "ما لكيت opkg ولا apk"; fi

          have_pkg() {
          	if [ $PM = opkg ]; then opkg status "$1" 2>/dev/null | grep -q '^Status:.* installed'
          	else apk info -e "$1" > /dev/null 2>&1; fi
          }

          updated=0
          pkg_install() {
          	if [ $updated = 0 ]; then
          		say "تحديث قوائم الحزم..."
          		if [ $PM = opkg ]; then opkg update > "$TMP/pm.log" 2>&1; else apk update > "$TMP/pm.log" 2>&1; fi
          		updated=1
          	fi
          	if [ $PM = opkg ]; then opkg install "$@" >> "$TMP/pm.log" 2>&1; else apk add "$@" >> "$TMP/pm.log" 2>&1; fi
          }

          # what XLite needs (most of it is already there with LuCI and fw4)
          need=""
          for p in ucode-mod-fs ucode-mod-uci rpcd-mod-ucode kmod-nft-tproxy curl ca-bundle; do
          	have_pkg "$p" || need="$need $p"
          done
          ip -V 2>&1 | grep -q iproute2 || need="$need ip-full"
          missing=""
          if [ -n "$need" ]; then
          	say "تنصيب المتطلبات:$need"
          	for p in $need; do
          		pkg_install "$p" || missing="$missing $p"
          	done
          fi
          for p in ucode-mod-fs ucode-mod-uci rpcd-mod-ucode; do
          	case " $missing " in *" $p "*) die "ما انصب $p (شوف الإنترنت أو مستودع الحزم)";; esac
          done
          TPROXY=1
          case " $missing " in *" kmod-nft-tproxy "*)
          	TPROXY=0
          	say "تنبيه: kmod-nft-tproxy ما انصب، فالتحويل يكون redirect (TCP بس) لحد ما ينصب"
          	command -v mx2000-kmods > /dev/null 2>&1 && say "على MX2000: شغّل mx2000-kmods ثم opkg install kmod-nft-tproxy";;
          esac

          # the tool
          say "تنزيل XLite $VERSION..."
          fetch "$BASE/xlite.tar.gz" "$TMP/xlite.tar.gz" || die "التنزيل فشل (الإنترنت؟)"
          fetch "$BASE/sha256sums" "$TMP/sha256sums" || die "التنزيل فشل (sha256sums)"
          check() {   # file asset-name
          	command -v sha256sum > /dev/null 2>&1 || return 0
          	want=$(awk -v f="$2" '$2 == f || $2 == "*" f {print $1}' "$TMP/sha256sums")
          	[ -n "$want" ] && [ "$(sha256sum "$1" | cut -d' ' -f1)" = "$want" ]
          }
          check "$TMP/xlite.tar.gz" xlite.tar.gz || die "الملف المنزل تالف (sha256)"

          # the core: the zero-copy xray if the router already has one (the MX2000 firmware does), else ours for this CPU
          ARCH=""
          if [ $PM = opkg ]; then ARCH=$(opkg print-architecture 2>/dev/null | awk '$2 !~ /^(all|noarch)$/ {a = $2} END {print a}')
          else ARCH=$(apk --print-arch 2>/dev/null); fi
          [ -n "$ARCH" ] || ARCH=$(uname -m)
          case "$ARCH" in
          aarch64*|arm64*) CORE=arm64 ;;
          arm_arm1176*|armv6*) CORE=armv6 ;;
          arm_cortex-a*_neon*|arm_cortex-a*_vfp*|armv7*) CORE=armv7 ;;
          arm*) CORE=armv5 ;;
          mipsel_*|mipsle*) CORE=mipsle ;;
          mips64el_*) CORE=mips64le ;;
          mips64_*) CORE=mips64 ;;
          mips_*|mips) CORE=mips ;;
          x86_64*) CORE=amd64 ;;
          i386*|i486*|i586*|i686*|x86) CORE=386 ;;
          riscv64*) CORE=riscv64 ;;
          loongarch64*) CORE=loong64 ;;
          *) CORE="" ;;
          esac

          core_ok() { [ -x "$1" ] && grep -aq 'VLESS downlink splice' "$1"; }
          mkdir -p $SHARE/bin
          CORE_NOTE=""
          if core_ok /usr/bin/xray; then
          	rm -f $SHARE/bin/xray $SHARE/bin/xray.gz
          	CORE_NOTE="النواة المخففة الموجودة بالراوتر (/usr/bin/xray)"
          elif [ -n "$CORE" ] && [ -z "$XLITE_SKIP_CORE" ]; then
          	have=""
          	[ -f $SHARE/bin/core.sum ] && have=$(cat $SHARE/bin/core.sum)
          	want=$(awk -v f="xray-$CORE.gz" '$2 == f {print $1}' "$TMP/sha256sums")
          	if [ -n "$want" ] && [ "$have" = "$want" ] && { [ -x $SHARE/bin/xray ] || [ -s $SHARE/bin/xray.gz ]; }; then
          		CORE_NOTE="النواة المخففة ($CORE) بدون تغيير"
          	else
          		say "تنزيل النواة المخففة ($CORE)..."
          		fetch "$BASE/xray-$CORE.gz" "$TMP/xray.gz" || die "تنزيل النواة فشل"
          		check "$TMP/xray.gz" "xray-$CORE.gz" || die "النواة المنزلة تالفة (sha256)"
          		gz=$(($(wc -c < "$TMP/xray.gz") / 1024))
          		free=$(df -k $SHARE 2>/dev/null | awk 'NR == 2 {print $4}')
          		[ -f $SHARE/bin/xray ] && free=$((free + $(wc -c < $SHARE/bin/xray) / 1024))
          		[ -f $SHARE/bin/xray.gz ] && free=$((free + $(wc -c < $SHARE/bin/xray.gz) / 1024))
          		rm -f $SHARE/bin/xray $SHARE/bin/xray.gz
          		if [ "${free:-0}" -gt $((gz * 4 + 2048)) ]; then
          			gzip -dc "$TMP/xray.gz" > $SHARE/bin/xray && chmod 755 $SHARE/bin/xray || die "ما كدرت أفك النواة (المساحة؟)"
          			CORE_NOTE="النواة المخففة ($CORE) على الذاكرة"
          		elif [ "${free:-0}" -gt $((gz + 1024)) ]; then
          			# small flash: kept compressed, unpacked to RAM at each start
          			cp "$TMP/xray.gz" $SHARE/bin/xray.gz || die "ما كدرت أخزن النواة"
          			CORE_NOTE="النواة المخففة ($CORE) مضغوطة، تنفك على الرام وقت التشغيل (الذاكرة صغيرة)"
          		elif [ -x /usr/bin/xray ]; then
          			CORE_NOTE="ماكو مساحة للنواة المخففة: يستخدم /usr/bin/xray العادية (بدون zero-copy)"
          		else
          			die "ماكو مساحة للنواة (تحتاج تقريباً $((gz / 1024 + 1)) ميجا)"
          		fi
          		echo "$want" > $SHARE/bin/core.sum
          	fi
          elif [ -x /usr/bin/xray ]; then
          	CORE_NOTE="المعالج ($ARCH) ما عنده نواة مخففة: يستخدم /usr/bin/xray العادية"
          else
          	die "ماكو نواة xray لهذا المعالج ($ARCH): نصب xray-core أول"
          fi

          # files (the list is kept for "xlite uninstall")
          tar -tzf "$TMP/xlite.tar.gz" | grep -v '/$' | sed 's|^\./|/|; s|^\([^/]\)|/\1|' > "$TMP/files"
          # the page files carry the version in their name (browsers never keep an old page): drop the old ones
          rm -rf /www/luci-static/resources/view/xlite /www/luci-static/resources/xlite
          tar -xzf "$TMP/xlite.tar.gz" -C / || die "ما كدرت أنصب الملفات (المساحة؟)"
          cp "$TMP/files" $SHARE/files
          chmod 755 /usr/bin/xlite /etc/init.d/xlite
          printf 'REPO=%s\nTAG=%s\nVERSION=%s\nBUILD=%s\n' "$REPO" "$TAG" "$VERSION" "$BUILD" > $SHARE/release

          # settings: add what is missing, keep the rest
          [ -f /etc/config/xlite ] || : > /etc/config/xlite
          uci -q get xlite.main > /dev/null || uci -q set xlite.main=xlite
          while IFS='=' read -r k v; do
          	case "$k" in ''|\#*) continue ;; esac
          	uci -q get "xlite.main.$k" > /dev/null || uci -q set "xlite.main.$k=$v"
          done < $SHARE/defaults
          [ $TPROXY = 0 ] && uci -q set xlite.main.impl=redirect
          uci -q commit xlite

          # an old hand fix (v1.0) appended an export line to lib.uc; it breaks the new one: take it out, then
          # check that the backend compiles before LuCI uses it
          sed -i '/^export { parse_link, outbound, xray_config, nft_rules, nft_redirect };$/d' /usr/share/ucode/xlite/lib.uc
          ucode -L /usr/share/ucode -e "loadfile('/usr/share/rpcd/ucode/xlite.uc');" > /tmp/xlite-check.log 2>&1 || echo "تحذير: $(head -n 3 /tmp/xlite-check.log)"
          /etc/init.d/xlite enable
          rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
          /etc/init.d/rpcd restart > /dev/null 2>&1
          sleep 1

          if [ "$(uci -q get xlite.main.enabled)" = 1 ]; then
          	/etc/init.d/xlite restart
          	say "XLite اشتغل من جديد"
          fi
          say "تم: XLite $VERSION"
          say "$CORE_NOTE"
          if [ -z "$XLITE_UPDATE" ]; then
          	say "افتح LuCI: Services ← XLite، ضيف رابط السيرفر، ودوس الزر حتى يصير متصل."
          	[ -x /etc/init.d/v2raya ] && say "v2rayA يبقى شغال لحد ما تدوس متصل بـ XLite (ساعتها ينطفي وحده)."
          fi
          exit 0
          XLITE_INSTALLER
          find src -type f | sort

      - name: "2. Syntax checks"
        run: |
          set -e
          for f in src/usr/bin/xlite src/etc/init.d/xlite src/etc/hotplug.d/iface/90-xlite install.sh.in; do sh -n "$f"; bash -n "$f"; done
          for f in src/usr/share/rpcd/acl.d/luci-app-xlite.json src/usr/share/luci/menu.d/luci-app-xlite.json src/usr/share/xlite/data/apps.json; do python3 -m json.tool "$f" > /dev/null; done
          node -e "new Function('view','rpc','ui','poll','L','E', require('fs').readFileSync('src/www/luci-static/resources/view/xlite/app.js','utf8').replace(/^'require [a-z]+';$/mg,''))"
          node -e "new Function('baseclass','rpc','ui','poll','L','E', require('fs').readFileSync('src/www/luci-static/resources/xlite/ui_dev.js','utf8').replace(/^'require [a-z]+';$/mg,''))"
          for f in src/www/luci-static/resources/xlite/manifest.json; do python3 -m json.tool "$f" > /dev/null; done
          # the router's C library refuses a regex repeat over 255 (a page that never loads): none may slip in
          if grep -rnE '\{[0-9]*,?([3-9][0-9]{2}|2[6-9][0-9]|25[6-9]|[0-9]{4,})\}' --include=*.uc src; then echo "regex repeat over 255"; exit 1; fi
          echo "- syntax: shell, json, LuCI view ok" >> out/summary.md

      - name: "3. Test files"
        run: |
          mkdir -p "$(dirname "t/xray-900-vless-downlink-splice.patch")"
          cat > "t/xray-900-vless-downlink-splice.patch" <<'XLITE_PATCH'
          From: mx2000 build
          Subject: [PATCH] VLESS: zero-copy downlink for plain VLESS over RAW TCP

          A VLESS connection without flow on the RAW TCP transport without TLS/REALITY
          (optionally with the HTTP header camouflage) carries the target's bytes
          unchanged after the response header. When the inbound is dokodemo-door
          (tproxy/redirect), splice(2) the rest of the response from the server
          socket to the client socket inside the kernel. Everything else keeps the
          normal path. XRAY_VLESS_SPLICE=off disables it at run time.
          ---
          diff --git a/proxy/vless/outbound/outbound.go b/proxy/vless/outbound/outbound.go
          index e1a727e..43eb027 100644
          --- a/proxy/vless/outbound/outbound.go
          +++ b/proxy/vless/outbound/outbound.go
          @@ -258,6 +258,15 @@ func (h *Handler) Process(ctx context.Context, link *transport.Link, dialer inte
           			return errors.New("failed to decode response header").Base(err).AtInfo()
           		}
           
          +		if requestAddons.Flow == "" && responseAddons.Flow == "" && request.Command == protocol.RequestCommandTCP {
          +			if s := newDownlinkSplice(ctx, conn); s != nil {
          +				if err := s.run(ctx, clientWriter, timer); err != nil {
          +					return errors.New("failed to transfer response payload").Base(err).AtInfo()
          +				}
          +				return nil
          +			}
          +		}
          +
           		// default: serverReader := buf.NewReader(conn)
           		serverReader := encoding.DecodeBodyAddons(conn, request, responseAddons)
           		if requestAddons.Flow == vless.XRV {
          diff --git a/proxy/vless/outbound/splice_linux.go b/proxy/vless/outbound/splice_linux.go
          new file mode 100644
          index 0000000..1035429
          --- /dev/null
          +++ b/proxy/vless/outbound/splice_linux.go
          @@ -0,0 +1,224 @@
          +package outbound
          +
          +// Zero-copy downlink for plain VLESS.
          +//
          +// A VLESS connection without flow on the RAW TCP transport without TLS or
          +// REALITY (optionally wrapped in the HTTP header camouflage) carries the
          +// target's bytes unchanged after the response header. When the client side
          +// is a plain TCP socket that also passes bytes through unchanged
          +// (dokodemo-door, used by tproxy and redirect), the rest of the response can
          +// go from the server socket to the client socket inside the kernel with
          +// splice(2) instead of being read into Go buffers, handed through a pipe to
          +// another goroutine and written out again. Everything else (flows, TLS,
          +// REALITY, other transports, UDP, mux, proxy chains that change the bytes,
          +// other inbounds) keeps the normal path, and so does the uplink.
          +//
          +// XRAY_VLESS_SPLICE=off turns it off at run time.
          +
          +import (
          +	"context"
          +	"io"
          +	"syscall"
          +
          +	"github.com/xtls/xray-core/app/dispatcher"
          +	"github.com/xtls/xray-core/common/buf"
          +	"github.com/xtls/xray-core/common/errors"
          +	"github.com/xtls/xray-core/common/net"
          +	"github.com/xtls/xray-core/common/platform"
          +	"github.com/xtls/xray-core/common/session"
          +	"github.com/xtls/xray-core/common/signal"
          +	"github.com/xtls/xray-core/features/stats"
          +	httpheader "github.com/xtls/xray-core/transport/internet/headers/http"
          +	"github.com/xtls/xray-core/transport/internet/stat"
          +	"golang.org/x/sys/unix"
          +)
          +
          +// spliceRound caps one splice round, so that the idle timers and the traffic
          +// counters keep moving while a slow client drains a long transfer.
          +const spliceRound = 32 * 1024
          +
          +var downlinkSpliceEnabled = func() bool {
          +	switch platform.NewEnvFlag("xray.vless.splice").GetValue(func() string { return "" }) {
          +	case "0", "off", "no", "false", "disable", "disabled":
          +		return false
          +	}
          +	return true
          +}()
          +
          +type downlinkSplice struct {
          +	src        *net.TCPConn // socket to the VLESS server
          +	dst        *net.TCPConn // socket of the client
          +	pending    *buf.Buffer  // read past the HTTP header but not sent yet
          +	srcCounter stats.Counter
          +	dstCounter stats.Counter
          +	inTimer    *signal.ActivityTimer
          +}
          +
          +// newDownlinkSplice returns nil unless every byte the server sends from now
          +// on can go to the client socket unchanged. Call it right after the VLESS
          +// response header has been read, from the goroutine that reads conn.
          +func newDownlinkSplice(ctx context.Context, conn net.Conn) *downlinkSplice {
          +	if !downlinkSpliceEnabled {
          +		return nil
          +	}
          +	inbound := session.InboundFromContext(ctx)
          +	if inbound == nil || inbound.Conn == nil || inbound.CanSpliceCopy != 1 {
          +		return nil
          +	}
          +	outbounds := session.OutboundsFromContext(ctx)
          +	if len(outbounds) == 0 {
          +		return nil
          +	}
          +	for _, ob := range outbounds[:len(outbounds)-1] {
          +		if ob.CanSpliceCopy != 1 { // another proxy in the chain needs the bytes
          +			return nil
          +		}
          +	}
          +	s := &downlinkSplice{inTimer: inbound.Timer}
          +	var ok bool
          +	var c net.Conn = conn
          +	if sc, isCounter := c.(*stat.CounterConnection); isCounter {
          +		c, s.srcCounter = sc.Connection, sc.ReadCounter
          +	}
          +	header, _ := c.(*httpheader.Conn)
          +	if header != nil {
          +		c = header.Conn
          +	}
          +	if s.src, ok = c.(*net.TCPConn); !ok {
          +		return nil // TLS, REALITY, another transport or a dialer proxy
          +	}
          +	c = inbound.Conn
          +	if sc, isCounter := c.(*stat.CounterConnection); isCounter {
          +		c, s.dstCounter = sc.Connection, sc.WriteCounter
          +	}
          +	if s.dst, ok = c.(*net.TCPConn); !ok {
          +		return nil
          +	}
          +	if header != nil {
          +		if s.pending, ok = header.TakeReadBuffer(); !ok {
          +			return nil
          +		}
          +	}
          +	return s
          +}
          +
          +// run moves the rest of the response to the client. It returns nil once the
          +// server has finished sending, or the first error.
          +func (s *downlinkSplice) run(ctx context.Context, writer buf.Writer, timer *signal.ActivityTimer) error {
          +	statWriter, _ := writer.(*dispatcher.SizeStatWriter)
          +	count := func(n int64) {
          +		if n <= 0 {
          +			return
          +		}
          +		if s.srcCounter != nil {
          +			s.srcCounter.Add(n) // outbound stats
          +		}
          +		if s.dstCounter != nil {
          +			s.dstCounter.Add(n) // inbound stats
          +		}
          +		if statWriter != nil {
          +			statWriter.Counter.Add(n) // user stats
          +		}
          +		timer.Update()
          +		if s.inTimer != nil {
          +			s.inTimer.Update()
          +		}
          +	}
          +	if s.pending != nil {
          +		n, err := s.dst.Write(s.pending.Bytes())
          +		s.pending.Release()
          +		s.pending = nil
          +		count(int64(n))
          +		if err != nil {
          +			return err
          +		}
          +	}
          +	rc, err := s.src.SyscallConn()
          +	if err != nil {
          +		return err
          +	}
          +	errors.LogDebug(ctx, "VLESS downlink splice")
          +	// No data passes the copy loops that normally refresh the idle timers any
          +	// more; every round below refreshes them instead, so the timeouts keep
          +	// their meaning (a quiet connection still expires, a half-closed one
          +	// still ends once the data stops).
          +	lr := &io.LimitedReader{R: s.src}
          +	for {
          +		avail, err := waitData(rc)
          +		if err != nil {
          +			return err
          +		}
          +		if avail == 0 {
          +			return nil // the server has finished sending
          +		}
          +		if avail < 0 {
          +			// readable data the kernel does not count as queued (urgent
          +			// data): one round the plain way, which skips it like a read does
          +			b := buf.New()
          +			n, rerr := b.ReadFrom(s.src)
          +			if n > 0 {
          +				_, err = s.dst.Write(b.Bytes())
          +				count(n)
          +			}
          +			b.Release()
          +			if err != nil {
          +				return err
          +			}
          +			if rerr == io.EOF {
          +				return nil
          +			}
          +			if rerr != nil {
          +				return rerr
          +			}
          +			continue
          +		}
          +		if avail > spliceRound {
          +			avail = spliceRound
          +		}
          +		// exactly what is queued already: ReadFrom splices it through a pooled
          +		// pipe and returns without waiting, so a quiet connection holds no pipe
          +		lr.N = int64(avail)
          +		n, err := s.dst.ReadFrom(lr)
          +		count(n)
          +		if err != nil {
          +			return err
          +		}
          +		if lr.N > 0 {
          +			return nil // EOF came early
          +		}
          +	}
          +}
          +
          +// waitData waits until the socket has data or the peer has closed. It
          +// returns how many bytes are queued, 0 at EOF, or -1 for readable data that
          +// is not counted as queued.
