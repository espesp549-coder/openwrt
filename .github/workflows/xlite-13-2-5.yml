          R sh $W/xlite rules_down
          R nft list table inet xlite > /dev/null 2>&1 && bad "rules_down left the table" || ok "rules_down removed the table"
          R ip rule | grep -q 'fwmark 0x40/0xc0' && bad "rules_down left the ip rule" || ok "rules_down removed the ip rule"
          if C timeout 5 "$T" small -base $B -n 2 > $W/c7 2>&1; then bad "LAN reached the server without the proxy (test is not proving anything)"
          else ok "without the rules the LAN cannot reach the server (so the passes above went through the proxy)"; fi
          # rules_up twice in a row must not duplicate anything
          R sh $W/xlite rules_up; R sh $W/xlite rules_up
          [ "$(R ip rule | grep -c 'fwmark 0x40/0xc0')" = "$([ "${IMPL:-tproxy}" = redirect ] && echo 0 || echo 1)" ] && ok "rules_up is idempotent" || bad "duplicate ip rules"
          C timeout 120 "$T" small -base $B -n 20 > /dev/null 2>&1 && ok "works again after re-applying" || bad "re-apply"
          grep -E "panic|fatal" $W/*.log && bad "a core crashed"
          echo "RESULT fail=$fail logs=$W"
          [ $fail = 0 ] && rm -rf $W
          exit $fail
          XLITE_NSE2E
          chmod 755 "t/ns-e2e.sh"
          mkdir -p "$(dirname "t/ns-r2.sh")"
          cat > "t/ns-r2.sh" <<'XLITE_NSR2'
          #!/bin/bash
          # ns-r2.sh XRAY E2ETOOL SRCDIR UCODE_CMD
          #   XLite v1.1 on a router netns: two servers at once, Iraqi routing, fallback, DNS forward, isolation,
          #   device counters, and (when the kernel has it) the WireGuard fast path.
          #   srv netns: .2 = main VLESS, .4 = second VLESS, .3 = "foreign" site, .5 = "Iraqi" site, .6 = isolated app
          set -u
          X=$(readlink -f "$1"); T=$(readlink -f "$2"); S=$(readlink -f "$3"); UCODE=$4
          W=$(mktemp -d /tmp/xlr2.XXXX); RUN=$W/run; mkdir -p $RUN $W/conf $W/bin
          UUID=6a3c0e5e-6f1a-4d55-9d2a-8c1f0b2e7d41
          fail=0
          ok() { echo "PASS $*"; }
          bad() { echo "FAIL $*"; fail=1; }
          NS="r2-cli r2-rtr r2-srv"
          cleanup() {
          	for n in $NS; do ip netns pids $n 2>/dev/null | xargs -r kill 2>/dev/null; done
          	sleep 0.3
          	for n in $NS; do ip netns del $n 2>/dev/null; done
          }
          trap cleanup EXIT
          cleanup
          R() { ip netns exec r2-rtr "$@"; }
          C() { ip netns exec r2-cli "$@"; }
          V() { ip netns exec r2-srv "$@"; }
          for n in $NS; do ip netns add $n; ip -n $n link set lo up; done
          ip link add wan netns r2-rtr type veth peer name eth0 netns r2-srv
          ip link add br-lan netns r2-rtr type veth peer name eth0 netns r2-cli
          R ip addr add 45.33.0.1/24 dev wan; R ip link set wan up
          R ip addr add 192.168.77.1/24 dev br-lan; R ip link set br-lan up
          for a in 2 3 4 5 6; do V ip addr add 45.33.0.$a/24 dev eth0; done; V ip link set eth0 up
          C ip addr add 192.168.77.2/24 dev eth0; C ip link set eth0 up; C ip route add default via 192.168.77.1
          R sh -c 'echo 1 > /proc/sys/net/ipv4/ip_forward'
          # direct traffic (isolated apps) needs NAT like a real router
          R nft -f - <<'N'
          table ip testnat {
          	chain post {
          		type nat hook postrouting priority srcnat; policy accept;
          		oifname "wan" ip saddr 192.168.77.0/24 masquerade
          	}
          }
          N

          srv() {   # $1 = address, $2 = log
          	cat > $W/srv-$1.json <<J
          {"log":{"loglevel":"info","access":"$W/access-$1.log"},"inbounds":[{"listen":"$1","port":18443,"protocol":"vless","settings":{"clients":[{"id":"$UUID"}],"decryption":"none"},
           "streamSettings":{"network":"tcp","security":"none"}}],"outbounds":[{"protocol":"freedom"}]}
          J
          	ip netns exec r2-srv "$X" run -c $W/srv-$1.json > $W/srv-$1.log 2>&1 &
          	echo $!
          }
          P_MAIN=$(srv 45.33.0.2); P_SEC=$(srv 45.33.0.4)
          for a in 3 5 6; do V "$T" serve -http 45.33.0.$a:18080 -raw 45.33.0.$a:18090 > $W/tool-$a.log 2>&1 & done
          V python3 -c '
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(("45.33.0.3",53))
          while True:
              d,a=s.recvfrom(2048); s.sendto(b"dns:"+d,a)' > /dev/null 2>&1 &

          cat > $W/conf/xlite <<EOC
          config xlite 'main'
          	option enabled '1'
          	option transparent 'all'
          	option impl 'tproxy'
          	option dns 'proxy'
          	option sniffing 'off'
          	option splice '1'
          	option early_exit '1'
          	option tproxy_port '52345'
          	option socks_port '20170'
          	option http_port '0'
          	option ipv6 '0'
          	option loglevel 'info'
          	option server 'm'
          	option r2 '1'
          	option server2 's'
          	option r2_iq '0'
          	option r2_domains '45.33.0.5/32'
          	option r2_fallback 'main'
          	option r2_probe 'http://45.33.0.5:18080/'
          	option speedtest_main '0'
          	option antipollution 'forward'
          	option dns_upstream '45.33.0.3'

          config server 'm'
          	option name 'main'
          	option link 'vless://$UUID@45.33.0.2:18443?type=tcp&security=none#main'

          config server 's'
          	option name 'second'
          	option link 'vless://$UUID@45.33.0.4:18443?type=tcp&security=none#second'

          config app 'pubg'
          	option isolate '1'
          	list learned '45.33.0.6/32'
          EOC
          printf 'config zone\n\toption name lan\n\tlist network lan\nconfig zone\n\toption name wan\n\tlist network wan\n' > $W/conf/firewall
          : > $W/conf/network
          cat > $W/bin/ubus <<'U'
          #!/bin/sh
          case "$2" in network.interface.wan) echo '{"l3_device":"wan"}';; network.interface.lan) echo '{"l3_device":"br-lan"}';; *) exit 4;; esac
          U
          chmod +x $W/bin/ubus
          GEN="env PATH=$W/bin:$PATH XLITE_UCI_DIR=$W/conf XLITE_SHARE=$S/usr/share/xlite XLITE_WG_KERNEL=0 $UCODE $S/usr/share/xlite/gen.uc"
          R $GEN build $RUN || { bad "gen.uc build"; exit 1; }
          "$X" run -test -c $RUN/config.json > /dev/null 2>&1 && ok "core accepts the two-server config" || bad "xray -test"
          start_core() {
          	ip netns exec r2-rtr "$X" run -c $RUN/config.json >> $W/client.log 2>&1 &
          	CORE=$!
          	for i in $(seq 50); do R sh -c 'cat /proc/net/tcp' | grep -qi ":CC79 " && break; sleep 0.1; done
          }
          start_core
          sed "s|^RUN=.*|RUN=$RUN|; s|^TMPD=.*|TMPD=$W/tmp|" $S/usr/bin/xlite > $W/xlite
          R sh $W/xlite rules_up && ok "rules loaded" || bad "rules_up"
          sleep 2   # first observatory probe

          B3=http://45.33.0.3:18080; B5=http://45.33.0.5:18080; B6=http://45.33.0.6:18080
          C timeout 60 "$T" big -base $B3 -size $((32 << 20)) > $W/a 2>&1 && ok "foreign site works" || bad "foreign: $(tail -n1 $W/a)"
          C timeout 60 "$T" big -base $B5 -size $((32 << 20)) > $W/b 2>&1 && ok "Iraqi site works" || bad "iraqi: $(tail -n1 $W/b)"
          sleep 1
          grep -qF 'tcp:45.33.0.3:18080' $W/access-45.33.0.2.log && ok "foreign site went through the main server" || bad "foreign not on main"
          grep -qF 'tcp:45.33.0.5:18080' $W/access-45.33.0.4.log && ok "Iraqi site went through the second server" || bad "iraqi not on second"
          grep -qF 'tcp:45.33.0.5:18080' $W/access-45.33.0.2.log && bad "Iraqi site also on the main server" || ok "Iraqi site did not touch the main server"

          # isolated app: direct (neither server sees it)
          C timeout 60 "$T" small -base $B6 -n 20 > $W/c 2>&1 && ok "isolated app works (direct)" || bad "isolated: $(tail -n1 $W/c)"
          grep -qF 'tcp:45.33.0.6' $W/access-45.33.0.2.log $W/access-45.33.0.4.log && bad "isolated app went through a server" || ok "isolated app did not go through any server"
          R nft list chain inet xlite iso | grep -q 'counter packets [1-9]' && ok "isolation counter counts" || bad "isolation counter is zero"

          # device counters
          R nft list set inet xlite dev_up | grep -q '192.168.77.2 counter packets [1-9]' && ok "device upload counter" || bad "dev_up"
          R nft list set inet xlite dev_down | grep -q '192.168.77.2 counter packets [1-9]' && ok "device download counter" || bad "dev_down"

          # DNS forward: dnsmasq would send to 127.0.0.1:15353 -> core -> main server -> upstream
          D=$(R python3 -c '
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3)
          s.sendto(b"q1",("127.0.0.1",15353))
          try: print(s.recvfrom(100)[0].decode())
          except Exception: print("none")')
          [ "$D" = "dns:q1" ] && ok "Forward DNS Request answers through the proxy" || bad "dns forward: $D"
          sleep 0.5
          grep -qF '45.33.0.3:53' $W/access-45.33.0.2.log && ok "DNS went through the main server" || bad "DNS not via main"

          # second server down -> Iraqi traffic falls back to the main server
          kill $P_SEC; sleep 0.5
          n0=$(grep -cF 'tcp:45.33.0.5:18080' $W/access-45.33.0.2.log)
          # the observatory notices at its next probe (30 s); restart the core to probe now
          kill $CORE; sleep 0.3; start_core; sleep 3
          C timeout 60 "$T" small -base $B5 -n 5 > $W/d 2>&1 && ok "Iraqi site works with the second server down" || bad "fallback: $(tail -n1 $W/d)"
          sleep 1
          [ "$(grep -cF 'tcp:45.33.0.5:18080' $W/access-45.33.0.2.log)" -gt "$n0" ] && ok "fallback went through the main server" || bad "fallback not via main"

          # speedtest via main: port 8080 goes to main even for an Iraqi address
          P_SEC=$(srv 45.33.0.4)
          sed -i "s/option speedtest_main '0'/option speedtest_main '1'/" $W/conf/xlite
          R $GEN build $RUN > /dev/null && R sh $W/xlite rules_up
          kill $CORE; sleep 0.3; start_core; sleep 3
          V "$T" serve -http 45.33.0.5:8080 -raw 45.33.0.5:18091 > /dev/null 2>&1 &
          sleep 0.5
          C timeout 30 "$T" small -base http://45.33.0.5:8080 -n 3 > $W/e 2>&1 && ok "speedtest port works" || bad "8080: $(tail -n1 $W/e)"
          sleep 1
          grep -qF 'tcp:45.33.0.5:8080' $W/access-45.33.0.2.log && ok "speedtest port went through the main server" || bad "8080 not via main"

          # QUIC refused at once (apps fall back to TCP), calls of an isolated app stay on the VPN, kicked devices
          sed -i "/config xlite 'main'/a\\	option block_quic '1'" $W/conf/xlite
          for a in 6; do V python3 -c '
          import socket,sys
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(("45.33.0.6",int(sys.argv[1])))
          while True:
              d,a=s.recvfrom(2048); s.sendto(b"echo:"+d,a)' 5000 > /dev/null 2>&1 & done
          R $GEN build $RUN > /dev/null && R sh $W/xlite rules_up
          kill $CORE; sleep 0.3; start_core; sleep 2
          Q=$(C python3 -c '
          import socket,time
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.connect(("45.33.0.3",443))
          t=time.time(); s.send(b"quic")
          try: s.recv(100); print("answer")
          except ConnectionRefusedError: print("refused %.2f" % (time.time()-t))
          except Exception as e: print("other", e)')
          case "$Q" in refused*) ok "QUIC (UDP 443) refused at once: $Q s" ;; *) bad "QUIC: $Q" ;; esac
          U=$(C python3 -c '
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3); s.sendto(b"u1",("45.33.0.3",53))
          try: print(s.recvfrom(100)[0].decode())
          except Exception: print("none")')
          [ "$U" = "dns:u1" ] && ok "other UDP still works with QUIC refused" || bad "udp: $U"
          STUN=$(C python3 -c '
          import socket,os
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3)
          m=b"\x00\x01\x00\x00\x21\x12\xa4\x42"+os.urandom(12)
          s.sendto(m,("45.33.0.6",5000))
          try: print("ok" if s.recvfrom(100)[0].startswith(b"echo:") else "bad")
          except Exception: print("none")')
          sleep 1
          [ "$STUN" = ok ] && grep -qF 'udp:45.33.0.6:5000' $W/access-45.33.0.2.log && ok "a call (STUN) of an isolated app went through the VPN" || bad "stun: $STUN / not via main"
          MAC=$(C cat /sys/class/net/eth0/address)
          R nft add element inet xlite blocked "{ $MAC }"
          C timeout 4 "$T" small -base $B3 -n 1 > /dev/null 2>&1 && bad "kicked device still reaches the internet" || ok "kicked device is cut off"
          R nft delete element inet xlite blocked "{ $MAC }"
          C timeout 20 "$T" small -base $B3 -n 2 > /dev/null 2>&1 && ok "device works again after allow" || bad "after allow"

          # an Iraqi app (its learned address) goes through the second server; a device set to "direct" skips the VPN;
          # a device set to "warp" sends everything through the second server
          cat >> $W/conf/xlite <<EOC

          config r2app 'tapp'
          	option name 'test app'
          	option on '1'
          	list ip '45.33.0.3/32'
          EOC
          R $GEN build $RUN > /dev/null && R sh $W/xlite rules_up
          kill $CORE; sleep 0.3; start_core; sleep 2
          n4=$(grep -cF 'tcp:45.33.0.3:18080' $W/access-45.33.0.4.log)
          C timeout 30 "$T" small -base $B3 -n 3 > /dev/null 2>&1 && sleep 1 && [ "$(grep -cF 'tcp:45.33.0.3:18080' $W/access-45.33.0.4.log)" -gt "$n4" ] && ok "Iraqi app went through the second server" || bad "Iraqi app not via second"
          sed -i "s/option on '1'/option on '0'/" $W/conf/xlite
          printf "\nconfig device 'dev1'\n\toption id '$MAC'\n\toption route 'direct'\n" >> $W/conf/xlite
          R $GEN build $RUN > /dev/null && R sh $W/xlite rules_up
          kill $CORE; sleep 0.3; start_core; sleep 2
          n2=$(grep -cF 'tcp:45.33.0.3:18080' $W/access-45.33.0.2.log)
          C timeout 30 "$T" small -base $B3 -n 3 > /dev/null 2>&1 && ok "direct device works" || bad "direct device"
          sleep 1; [ "$(grep -cF 'tcp:45.33.0.3:18080' $W/access-45.33.0.2.log)" = "$n2" ] && ok "direct device skipped the VPN" || bad "direct device went through the VPN"
          sed -i "s/option route 'direct'/option route 'warp'/" $W/conf/xlite
          mkdir -p $W/fake; R sh -c "cat /proc/net/arp" > /dev/null
          R $GEN build $RUN > /dev/null && R sh $W/xlite rules_up
          kill $CORE; sleep 0.3; start_core; sleep 2
          n4=$(grep -cF 'tcp:45.33.0.3:18080' $W/access-45.33.0.4.log)
          C timeout 30 "$T" small -base $B3 -n 3 > /dev/null 2>&1 && sleep 1 && [ "$(grep -cF 'tcp:45.33.0.3:18080' $W/access-45.33.0.4.log)" -gt "$n4" ] && ok "warp device: foreign site through the second server" || bad "warp device not via second"
          sed -i "/config device 'dev1'/,+2d" $W/conf/xlite
          R $GEN build $RUN > /dev/null && R sh $W/xlite rules_up; kill $CORE; sleep 0.3; start_core; sleep 1

          # kernel WireGuard fast path (only where the kernel has wireguard: the GitHub runner)
          wgdiag() {
          	echo "--- router: wg"; R wg show xlwg; echo "--- router: ip rule"; R ip rule; echo "--- table 102"; R ip route show table 102
          	echo "--- router routes"; R ip route; echo "--- rp_filter all/xlwg/br-lan: $(R cat /proc/sys/net/ipv4/conf/all/rp_filter) $(R cat /proc/sys/net/ipv4/conf/xlwg/rp_filter) $(R cat /proc/sys/net/ipv4/conf/br-lan/rp_filter)"
          	echo "--- r2fast4"; R nft list set inet xlite r2fast4 | head -8; echo "--- tp_rule"; R nft list chain inet xlite tp_rule
          	echo "--- server: wg"; V wg show wgs; V ip addr; V ip route
          	echo "--- server listen"; V ss -ltnp | grep 18080; echo "--- router nat"; R nft list table ip testnat; R ip netns exec r2-srv true 2>/dev/null; V timeout 3 "$T" small -base http://45.33.9.5:18080 -n 1 && echo "server local fetch ok"
          }
          # WGGO=<wireguard-go binary>: the same test with userspace WireGuard where the kernel has none
          mkwg() { if [ -n "${WGGO:-}" ]; then (ip netns exec $1 "$WGGO" -f $2 > /dev/null 2>&1 &); sleep 1; else ip netns exec $1 ip link add $2 type wireguard; fi; }
          if [ -n "${WGGO:-}" ] || R ip link add xlwg type wireguard 2>/dev/null; then
          	R ip link del xlwg 2>/dev/null
          	mkwg r2-srv wgs
          	ks=$(wg genkey); kc=$(wg genkey)
          	V sh -c "echo $ks > $W/ks; wg set wgs listen-port 51820 private-key $W/ks peer $(echo $kc | wg pubkey) allowed-ips 10.66.0.2/32"
          	V ip addr add 10.66.0.1/24 dev wgs; V ip link set wgs up
          	V ip addr add 45.33.9.5/32 dev lo   # an "Iraqi" site only reachable through the tunnel
          	V "$T" serve -http 45.33.9.5:18080 -raw 45.33.9.5:18090 > /dev/null 2>&1 &
          	V ip route add 192.168.77.0/24 dev wgs 2>/dev/null; V ip route add 10.66.0.0/24 dev wgs 2>/dev/null
          	# what netifd does with the uci sections XLite writes (network.xlwg, xlwg_rule, xlwg_route)
          	mkwg r2-rtr xlwg
          	R sh -c "echo $kc > $W/kc; wg set xlwg fwmark 0x80 private-key $W/kc peer $(echo $ks | wg pubkey) endpoint 45.33.0.4:51820 allowed-ips 0.0.0.0/0 persistent-keepalive 5"
          	R ip addr add 10.66.0.2/24 dev xlwg; R ip link set xlwg up
          	R ip rule add fwmark 0x100/0x100 lookup 102 priority 90; R ip route add default dev xlwg table 102
          	# like a real router: a default route on the WAN, and loose reverse path filtering (Ubuntu's default)
          	R ip route add default via 45.33.0.2 dev wan
          	R sh -c 'echo 2 > /proc/sys/net/ipv4/conf/all/rp_filter'
          	V sh -c 'echo 1 > /proc/sys/net/ipv4/ip_forward'; V nft add table ip block9; V nft add chain ip block9 in '{ type filter hook input priority 0; }'
          	V nft add rule ip block9 in iifname eth0 ip daddr 45.33.9.5 drop   # the "Iraqi" site is only reachable through the tunnel
          	R nft add rule ip testnat post oifname "xlwg" masquerade
          	cat >> $W/conf/xlite <<EOC

          config server 'w'
          	option name 'warp'
          	option link 'wireguard://$(echo $kc | sed 's/+/%2B/g; s/\//%2F/g; s/=/%3D/g')@45.33.0.4:51820?publickey=$(echo $ks | wg pubkey | sed 's/+/%2B/g; s/\//%2F/g; s/=/%3D/g')&address=10.66.0.2%2F32#warp'
          EOC
          	sed -i "s/option server2 's'/option server2 'w'/; s|option r2_domains '45.33.0.5/32'|option r2_domains '45.33.9.5/32'|; s/option r2_iq '0'/option r2_iq '1'/" $W/conf/xlite
          	echo 45.33.9.0/24 > $W/iq4.txt
          	mkdir -p $W/share/data; cp $S/usr/share/xlite/data/apps.json $W/share/data/; cp $W/iq4.txt $W/share/data/iq4.txt; : > $W/share/data/iq6.txt
          	R env PATH=$W/bin:$PATH XLITE_UCI_DIR=$W/conf XLITE_SHARE=$W/share XLITE_WG_KERNEL=1 $UCODE $S/usr/share/xlite/gen.uc build $RUN > /dev/null || bad "build with kernel WireGuard"
          	grep -q '"kernel": true' $RUN/state.json && ok "second WireGuard server uses the kernel" || bad "kernel not chosen"
          	grep -q "xlwg_peer" $W/conf/network && grep -q "0x100/0x100" $W/conf/network && ok "uci network sections written for netifd" || bad "network sections"
          	R sh $W/xlite rules_up; kill $CORE; sleep 0.3; start_core; sleep 1
          	C timeout 30 "$T" big -base http://45.33.9.5:18080 -size $((16 << 20)) > $W/f 2>&1 && ok "Iraqi address through the kernel WireGuard fast path" || { bad "wg fast path: $(tail -n1 $W/f)"; wgdiag; }
          	grep -qaF 'tcp:45.33.9.5' $W/client.log && bad "fast path traffic went through the core" || ok "fast path did not touch the core"
          	R wg show xlwg transfer | awk '{ exit !($2 > 1000000) }' && ok "bytes counted on the tunnel" || bad "no tunnel bytes"
          	# the same server through the core's own WireGuard (no kernel module on the router): never "kernel TUN"
          	R ip link del xlwg
          	sed -i "s/option r2_kernel '1'//; /config xlite 'main'/a\\	option r2_kernel '0'" $W/conf/xlite
          	R env PATH=$W/bin:$PATH XLITE_UCI_DIR=$W/conf XLITE_SHARE=$W/share XLITE_WG_KERNEL=0 $UCODE $S/usr/share/xlite/gen.uc build $RUN > /dev/null || bad "build with core WireGuard"
          	R sh $W/xlite rules_up; kill $CORE; sleep 0.3; : > $W/client.log; start_core; sleep 2
          	C timeout 30 "$T" big -base http://45.33.9.5:18080 -size $((8 << 20)) > $W/g 2>&1 && ok "Iraqi address through the core's WireGuard" || bad "core wg: $(tail -n1 $W/g)"
          	grep -aq 'Using kernel TUN' $W/client.log && bad "the core used kernel TUN" || ok "the core's WireGuard does not use kernel TUN"
          else
          	echo "SKIP kernel WireGuard (no wireguard module here)"
          fi

          grep -E "panic|fatal" $W/*.log && bad "a core crashed"
          echo "RESULT fail=$fail logs=$W"
          [ $fail = 0 ] && rm -rf $W
          exit $fail
          XLITE_NSR2
          chmod 755 "t/ns-r2.sh"
          mkdir -p "$(dirname "t/modes.sh")"
          cat > "t/modes.sh" <<'XLITE_MODES'
          #!/bin/bash
          # modes.sh XRAY SRCDIR UCODE_CMD: every routing / DNS / special mode combination builds a config the core accepts
          # and nft rules nft accepts
          X=$(readlink -f "$1"); S=$(readlink -f "$2"); UCODE=$3
          W=$(mktemp -d /tmp/xlmodes.XXXX); mkdir -p $W/conf $W/bin $W/out
          printf '#!/bin/sh\nexit 4\n' > $W/bin/ubus; chmod +x $W/bin/ubus
          printf 'config zone\n\toption name lan\n\tlist network lan\nconfig zone\n\toption name wan\n\tlist network wan\n' > $W/conf/firewall; : > $W/conf/network
          mkdir -p /etc/xlite; [ -s /etc/xlite/gfw.txt ] || printf 'google.com\nyoutube.com\n' > /etc/xlite/gfw.txt
          [ -s /etc/xlite/cn4.txt ] || printf '1.0.1.0/24\n1.0.2.0/23\n' > /etc/xlite/cn4.txt
          fail=0; n=0
          for tm in off all except_cn gfwlist routinga same; do
          for rm in gfwlist except_cn routinga; do
          for dns in none hijack forward doh; do
          for sp in off supervisor fakedns; do
          for extra in "mux 0" "mux 1" "smart_mux 1" "block_quic 1"; do
          	set -- $extra
          	cat > $W/conf/xlite <<C
          config xlite 'main'
          	option enabled '1'
          	option transparent '$tm'
          	option rule_mode '$rm'
          	option antipollution '$dns'
          	option special '$sp'
          	option $1 '$2'
          	option socks_port '20170'
          	option http_port '20171'
          	option socks_rule_port '20172'
          	option http_rule_port '20173'
          	option ipv6 '0'
          	option routinga 'default: proxy
          domain(geosite:cn)->direct
          ip(geoip:private, 1.2.3.0/24)->direct
          domain(domain:example.com)->block
          port(8443)->proxy'
          	option server 's1'
          	option r2 '1'
          	option server2 's2'
          config server 's1'
          	option link 'vless://6a3c0e5e-6f1a-4d55-9d2a-8c1f0b2e7d41@45.33.0.2:80?type=tcp&headerType=http&host=a.com#a'
          config server 's2'
          	option link 'vless://6a3c0e5e-6f1a-4d55-9d2a-8c1f0b2e7d41@45.33.0.4:80?type=tcp#b'
          config app 'pubg'
          	option isolate '1'
          C
          	n=$((n+1))
          	if ! env PATH=$W/bin:$PATH XLITE_UCI_DIR=$W/conf XLITE_SHARE=$S/usr/share/xlite XLITE_WG_KERNEL=0 $UCODE $S/usr/share/xlite/gen.uc build $W/out > $W/gen.log 2>&1; then
          		echo "FAIL build $tm/$rm/$dns/$sp/$extra: $(tail -n1 $W/gen.log)"; fail=1; continue; fi
          	if ! "$X" run -test -c $W/out/config.json > $W/x.log 2>&1; then echo "FAIL core $tm/$rm/$dns/$sp/$extra: $(grep -m1 -i fail $W/x.log)"; fail=1; fi
          	if [ -s $W/out/rules.nft ] && ! nft -c -f $W/out/rules.nft > $W/n.log 2>&1; then echo "FAIL nft $tm/$rm/$dns/$sp/$extra: $(head -n1 $W/n.log)"; fail=1; fi
          done; done; done; done; done
          echo "RESULT $n combinations, fail=$fail"
          rm -rf $W
          exit $fail
          XLITE_MODES
          chmod 755 "t/modes.sh"
          mkdir -p "$(dirname "t/tool-src/go.mod")"
          cat > "t/tool-src/go.mod" <<'XLITE_GOMOD'
          module e2etool

          go 1.21
          XLITE_GOMOD
          mkdir -p "$(dirname "t/tool-src/main.go")"
          cat > "t/tool-src/main.go" <<'XLITE_MAINGO'
          // e2etool: test server and client for the VLESS splice end-to-end test.
          // Every payload is a deterministic pseudo-random stream, so the client checks
          // every byte it receives without storing anything.
          package main

          import (
          	"bufio"
          	"crypto/sha256"
          	"encoding/binary"
          	"encoding/hex"
          	"flag"
          	"fmt"
          	"io"
          	"math/rand"
          	"net"
          	"net/http"
          	"net/http/httptrace"
          	"os"
          	"strconv"
          	"strings"
          	"sync"
          	"sync/atomic"
          	"time"
          )

          // gen produces the stream for a seed: xorshift64*, 8 bytes per step.
          type gen struct {
          	x   uint64
          	buf [8]byte
          	pos int
          }

          func newGen(seed uint64) *gen { return &gen{x: seed*0x9E3779B97F4A7C15 + 0x1234567, pos: 8} }

          func (g *gen) Read(p []byte) (int, error) {
          	for i := range p {
          		if g.pos == 8 {
          			g.x ^= g.x >> 12
          			g.x ^= g.x << 25
          			g.x ^= g.x >> 27
          			binary.LittleEndian.PutUint64(g.buf[:], g.x*2685821657736338717)
          			g.pos = 0
          		}
          		p[i] = g.buf[g.pos]
          		g.pos++
          	}
          	return len(p), nil
          }

          // checker compares what it is given with the stream of a seed.
          type checker struct {
          	g    *gen
          	want []byte
          	n    int64
          }

          func newChecker(seed uint64) *checker { return &checker{g: newGen(seed), want: make([]byte, 64<<10)} }

          func (c *checker) Write(p []byte) (int, error) {
          	done := 0
          	for done < len(p) {
          		k := len(p) - done
          		if k > len(c.want) {
          			k = len(c.want)
          		}
          		c.g.Read(c.want[:k])
          		for i := 0; i < k; i++ {
          			if p[done+i] != c.want[i] {
          				return done + i, fmt.Errorf("byte %d differs", c.n+int64(done+i))
          			}
          		}
          		done += k
          	}
          	c.n += int64(len(p))
          	return len(p), nil
          }

          func qint(r *http.Request, k string, d int64) int64 {
          	if v := r.URL.Query().Get(k); v != "" {
          		n, err := strconv.ParseInt(v, 10, 64)
          		if err == nil {
          			return n
          		}
          	}
          	return d
          }

          func serve(httpAddr, rawAddr string) {
          	mux := http.NewServeMux()
          	mux.HandleFunc("/data", func(w http.ResponseWriter, r *http.Request) {
          		size, seed := qint(r, "size", 0), qint(r, "seed", 1)
          		w.Header().Set("Content-Length", strconv.FormatInt(size, 10))
          		io.CopyN(w, newGen(uint64(seed)), size)
          	})
          	mux.HandleFunc("/slow", func(w http.ResponseWriter, r *http.Request) {
          		size, seed := qint(r, "size", 0), qint(r, "seed", 1)
          		chunk, ms := qint(r, "chunk", 100), qint(r, "ms", 1000)
          		w.Header().Set("Content-Length", strconv.FormatInt(size, 10))
          		g := newGen(uint64(seed))
          		f, _ := w.(http.Flusher)
          		for size > 0 {
          			k := chunk
          			if k > size {
          				k = size
          			}
          			if _, err := io.CopyN(w, g, k); err != nil {
          				return
          			}
          			if f != nil {
          				f.Flush()
          			}
          			size -= k
          			if size > 0 {
          				time.Sleep(time.Duration(ms) * time.Millisecond)
          			}
          		}
          	})
          	mux.HandleFunc("/upload", func(w http.ResponseWriter, r *http.Request) {
          		h := sha256.New()
          		n, err := io.Copy(h, r.Body)
          		if err != nil {
          			http.Error(w, err.Error(), 500)
          			return
          		}
          		fmt.Fprintf(w, "%d %s", n, hex.EncodeToString(h.Sum(nil)))
          	})
          	go func() {
          		if err := http.ListenAndServe(httpAddr, mux); err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			os.Exit(1)
          		}
          	}()
          	// raw: the client sends "size seed chunk ms\n"; the reply is the stream,
          	// then the server closes. Whatever else the client sends is ignored.
          	ln, err := net.Listen("tcp", rawAddr)
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		os.Exit(1)
          	}
          	for {
          		c, err := ln.Accept()
          		if err != nil {
          			continue
          		}
          		go func(c net.Conn) {
          			defer c.Close()
          			br := bufio.NewReader(c)
          			line, err := br.ReadString('\n')
          			if err != nil {
          				return
          			}
          			if strings.HasPrefix(line, "echo ") {
          				// echo: send back the next n bytes as they come
          				var n int64
          				fmt.Sscan(line[5:], &n)
          				io.CopyN(c, br, n)
          				return
          			}
          			var size, seed, chunk, ms int64
          			fmt.Sscan(line, &size, &seed, &chunk, &ms)
          			g := newGen(uint64(seed))
          			if ms < 0 {
          				// send size bytes, then reset the connection instead of closing it
          				io.CopyN(c, g, size)
          				c.(*net.TCPConn).SetLinger(0)
          				return
          			}
          			if chunk <= 0 {
          				io.CopyN(c, g, size)
          				return
          			}
          			for size > 0 {
          				k := chunk
          				if k > size {
          					k = size
          				}
          				if _, err := io.CopyN(c, g, k); err != nil {
          					return
          				}
          				size -= k
          				if size > 0 {
          					time.Sleep(time.Duration(ms) * time.Millisecond)
          				}
          			}
          		}(c)
          	}
          }

          // every test ends within 2 minutes or fails: a lost byte must not hang the run
          const limit = 2 * time.Minute

          var client = &http.Client{Transport: &http.Transport{MaxIdleConnsPerHost: 64, DisableCompression: true}, Timeout: limit}

          func dial(addr string) net.Conn {
          	c, err := net.Dial("tcp", addr)
          	if err != nil {
          		fail("%s: %v", os.Args[1], err)
          	}
          	c.SetDeadline(time.Now().Add(limit))
          	return c
          }

          func get(base string, size int64, seed uint64) (int64, bool, error) {
          	reused := false
          	trace := &httptrace.ClientTrace{GotConn: func(i httptrace.GotConnInfo) { reused = i.Reused }}
          	req, _ := http.NewRequest("GET", fmt.Sprintf("%s/data?size=%d&seed=%d", base, size, seed), nil)
          	req = req.WithContext(httptrace.WithClientTrace(req.Context(), trace))
          	resp, err := client.Do(req)
          	if err != nil {
          		return 0, reused, err
          	}
          	defer resp.Body.Close()
          	n, err := io.Copy(newChecker(seed), resp.Body)
          	if err == nil && n != size {
          		err = fmt.Errorf("got %d of %d bytes", n, size)
          	}
          	return n, reused, err
          }

          func fail(f string, a ...interface{}) {
          	fmt.Printf("FAIL "+f+"\n", a...)
          	os.Exit(1)
          }

          func main() {
          	if len(os.Args) < 2 {
          		fmt.Println("usage: e2etool serve|big|small|keepalive|parallel|upload|halfclose|abort|trickle ...")
          		os.Exit(2)
          	}
          	fs := flag.NewFlagSet(os.Args[1], flag.ExitOnError)
          	httpAddr := fs.String("http", "127.0.0.1:18080", "")
          	rawAddr := fs.String("raw", "127.0.0.1:18090", "")
          	base := fs.String("base", "http://127.0.0.1:18080", "")
          	size := fs.Int64("size", 256<<20, "")
          	count := fs.Int("n", 100, "")
          	chunk := fs.Int64("chunk", 0, "")
          	ms := fs.Int64("ms", 0, "")
          	fs.Parse(os.Args[2:])
          	switch os.Args[1] {
          	case "serve":
          		serve(*httpAddr, *rawAddr)
          	case "big":
          		t := time.Now()
          		n, _, err := get(*base, *size, 7)
          		if err != nil {
          			fail("big: %v", err)
          		}
          		d := time.Since(t).Seconds()
          		fmt.Printf("ok big %d MB in %.2f s = %.0f Mbit/s\n", n>>20, d, float64(n)*8/d/1e6)
          	case "small":
          		r := rand.New(rand.NewSource(42))
          		var total int64
          		for i := 0; i < *count; i++ {
          			s := int64(r.Intn(3)) * int64(r.Intn(20000))
          			if i%10 == 0 {
          				s = int64(i % 7) // 0..6 bytes
          			}
          			client.CloseIdleConnections() // a new connection each time
          			n, _, err := get(*base, s, uint64(1000+i))
          			if err != nil {
          				fail("small #%d size %d: %v", i, s, err)
          			}
          			total += n
          		}
          		fmt.Printf("ok small %d downloads, %d bytes, new connection each\n", *count, total)
          	case "keepalive":
          		client.CloseIdleConnections()
          		r := rand.New(rand.NewSource(7))
          		reusedN := 0
          		for i := 0; i < *count; i++ {
          			s := int64(r.Intn(300000))
          			if i%5 == 0 {
          				s = int64(r.Intn(10))
          			}
          			_, reused, err := get(*base, s, uint64(5000+i))
          			if err != nil {
          				fail("keepalive #%d size %d: %v", i, s, err)
          			}
          			if reused {
          				reusedN++
          			}
          		}
          		if reusedN < *count-1 {
          			fail("keepalive: only %d of %d requests reused the connection", reusedN, *count)
          		}
          		fmt.Printf("ok keepalive %d requests, %d on the same connection\n", *count, reusedN)
          	case "parallel":
          		var wg sync.WaitGroup
          		var bad atomic.Value
          		var total int64
          		t := time.Now()
          		for i := 0; i < *count; i++ {
          			wg.Add(1)
          			go func(i int) {
          				defer wg.Done()
          				n, _, err := get(*base, *size, uint64(9000+i))
          				atomic.AddInt64(&total, n)
          				if err != nil {
          					bad.Store(fmt.Sprintf("#%d: %v", i, err))
          				}
          			}(i)
          		}
          		wg.Wait()
          		if v := bad.Load(); v != nil {
          			fail("parallel %s", v)
          		}
          		d := time.Since(t).Seconds()
          		fmt.Printf("ok parallel %d x %d MB in %.2f s = %.0f Mbit/s\n", *count, *size>>20, d, float64(total)*8/d/1e6)
          	case "upload":
          		h := sha256.New()
          		g := newGen(77)
          		pr, pw := io.Pipe()
          		go func() {
          			_, err := io.CopyN(io.MultiWriter(pw, h), g, *size)
          			pw.CloseWithError(err)
          		}()
          		resp, err := client.Post(*base+"/upload", "application/octet-stream", pr)
          		if err != nil {
          			fail("upload: %v", err)
          		}
          		body, _ := io.ReadAll(resp.Body)
          		resp.Body.Close()
          		want := fmt.Sprintf("%d %s", *size, hex.EncodeToString(h.Sum(nil)))
          		if strings.TrimSpace(string(body)) != want {
          			fail("upload: server saw %q, sent %q", body, want)
          		}
          		fmt.Printf("ok upload %d MB, server hash matches\n", *size>>20)
          	case "halfclose", "trickle":
          		// raw protocol through the second dokodemo port; halfclose shuts our
          		// sending side down right after the request line
          		c := dial(*rawAddr)
          		fmt.Fprintf(c, "%d %d %d %d\n", *size, 31, *chunk, *ms)
          		if os.Args[1] == "halfclose" {
          			c.(*net.TCPConn).CloseWrite()
          		}
          		t := time.Now()
          		n, err := io.Copy(newChecker(31), c)
          		c.Close()
          		if err != nil || n != *size {
          			fail("%s: got %d of %d bytes after %.1f s: %v", os.Args[1], n, *size, time.Since(t).Seconds(), err)
          		}
          		fmt.Printf("ok %s %d bytes in %.1f s (chunk %d every %d ms)\n", os.Args[1], n, time.Since(t).Seconds(), *chunk, *ms)
          	case "slowread":
          		// read at about -chunk bytes every -ms milliseconds
          		c := dial(*rawAddr)
          		fmt.Fprintf(c, "%d %d 0 0\n", *size, 31)
          		chk := newChecker(31)
          		t := time.Now()
          		var n int64
          		for n < *size {
          			k, err := io.CopyN(chk, c, *chunk)
          			n += k
          			if err != nil {
          				fail("slowread: got %d of %d bytes: %v", n, *size, err)
          			}
          			time.Sleep(time.Duration(*ms) * time.Millisecond)
          		}
          		c.Close()
          		fmt.Printf("ok slowread %d bytes in %.1f s\n", n, time.Since(t).Seconds())
          	case "echo":
          		// full duplex: send -size bytes and check the echo while still sending
          		c := dial(*rawAddr)
          		fmt.Fprintf(c, "echo %d\n", *size)
          		errc := make(chan error, 1)
          		go func() {
          			_, err := io.CopyN(c, newGen(55), *size)
          			errc <- err
          		}()
          		t := time.Now()
          		n, err := io.CopyN(newChecker(55), c, *size)
          		if err != nil {
          			fail("echo: got %d of %d bytes back: %v", n, *size, err)
          		}
          		if err := <-errc; err != nil {
          			fail("echo: sending: %v", err)
          		}
          		c.Close()
          		fmt.Printf("ok echo %d MB both ways at once in %.1f s\n", n>>20, time.Since(t).Seconds())
          	case "rst":
          		// the far end resets the connection after -size bytes: the client
          		// must get those bytes (or fewer) and an end, not hang
          		for i := 0; i < *count; i++ {
          			c := dial(*rawAddr)
          			c.SetDeadline(time.Now().Add(20 * time.Second))
          			fmt.Fprintf(c, "%d %d 0 -1\n", *size, 31)
          			n, err := io.Copy(newChecker(31), c)
          			c.Close()
          			if n > *size || (err != nil && strings.Contains(err.Error(), "differs")) {
          				fail("rst #%d: %d bytes: %v", i, n, err)
          			}
          			if err != nil && strings.Contains(err.Error(), "timeout") {
          				fail("rst #%d: hung after %d bytes", i, n)
          			}
          		}
          		fmt.Printf("ok rst %d connections reset by the far end\n", *count)
          	case "idle":
          		// -n keep-alive connections, each idle between two requests; meanwhile
          		// count the pipes the client xray holds (-pid)
          		pid := fs.Arg(0)
          		clients := make([]*http.Client, *count)
          		for i := range clients {
          			clients[i] = &http.Client{Transport: &http.Transport{MaxIdleConnsPerHost: 1, DisableCompression: true}, Timeout: limit}
          		}
          		round := func(r int) int {
          			reused := 0
          			for i, cl := range clients {
          				seed := uint64(70000 + 1000*r + i)
          				trace := &httptrace.ClientTrace{GotConn: func(ci httptrace.GotConnInfo) {
          					if ci.Reused {
          						reused++
          					}
          				}}
          				req, _ := http.NewRequest("GET", fmt.Sprintf("%s/data?size=%d&seed=%d", *base, 3000+i, seed), nil)
          				resp, err := cl.Do(req.WithContext(httptrace.WithClientTrace(req.Context(), trace)))
          				if err != nil {
          					fail("idle round %d #%d: %v", r, i, err)
          				}
          				n, err := io.Copy(newChecker(seed), resp.Body)
          				resp.Body.Close()
          				if err != nil || n != int64(3000+i) {
          					fail("idle round %d #%d: %d bytes: %v", r, i, n, err)
          				}
          			}
          			return reused
          		}
          		pipes := func() int {
          			n := 0
          			if ents, err := os.ReadDir("/proc/" + pid + "/fd"); err == nil {
          				for _, e := range ents {
          					if l, _ := os.Readlink("/proc/" + pid + "/fd/" + e.Name()); strings.HasPrefix(l, "pipe:") {
          						n++
          					}
          				}
          			}
          			return n / 2
          		}
          		before := pipes()
          		round(0)
          		time.Sleep(2 * time.Second)
          		during := pipes()
          		reused := round(1)
          		if reused != *count {
          			fail("idle: only %d of %d connections survived the pause", reused, *count)
          		}
          		if during > before+4 {
          			fail("idle: xray holds %d more pipes while %d connections are idle", during-before, *count)
          		}
          		fmt.Printf("ok idle %d connections paused and reused, xray pipes %d before, %d while idle\n", *count, before, during)
          	case "abort":
          		for i := 0; i < *count; i++ {
          			c := dial(*rawAddr)
          			fmt.Fprintf(c, "%d %d 0 0\n", int64(64<<20), 31)
          			k := int64(1+i*37%3000) * 1024
          			n, err := io.CopyN(newChecker(31), c, k)
          			if err != nil {
          				fail("abort #%d: got %d of the first %d bytes: %v", i, n, k, err)
          			}
          			if i%2 == 0 {
          				c.(*net.TCPConn).SetLinger(0) // RST
          			}
          			c.Close()
          		}
          		fmt.Printf("ok abort %d downloads cut short (half by RST)\n", *count)
          	default:
          		fmt.Println("unknown command")
          		os.Exit(2)
          	}
          }
          XLITE_MAINGO

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: "4. Xray source (the same tarball OpenWrt builds, hash checked) + patch 900"
        run: |
          set -e
          curl -sSfL --retry 3 -o xray-src.tar.gz "https://codeload.github.com/XTLS/Xray-core/tar.gz/v$XRAY_VERSION"
          echo "$XRAY_HASH  xray-src.tar.gz" | sha256sum -c -
          mkdir -p stock patched
          tar -xzf xray-src.tar.gz -C stock --strip-components=1
          tar -xzf xray-src.tar.gz -C patched --strip-components=1
          (cd patched && patch -p1 --fuzz=0 --no-backup-if-mismatch < ../t/xray-900-vless-downlink-splice.patch)
          (cd stock && go mod download) && (cd patched && go mod download)
          export CGO_ENABLED=0
          (cd stock && go build -trimpath -o ../xray-stock ./main)
          (cd patched && go build -trimpath -o ../xray-patched ./main)
          (cd t/tool-src && go build -o ../e2etool .)
          ./xray-patched version | head -n1

      - name: "5. Zero-copy core: end-to-end tests (VLESS server <- patched client <- test tool, every byte checked)"
        id: splice
        if: ${{ inputs.zero_copy }}
        run: |
          export TMPDIR=$PWD/tmp; mkdir -p $TMPDIR out/e2e
          ok=1
          e2e() { local n=$1; shift; if timeout 900 "$@" > out/e2e/$n.txt 2>&1 || timeout 900 "$@" > out/e2e/$n.txt 2>&1; then echo "- e2e $n: $(grep RESULT out/e2e/$n.txt | tail -n1)" >> out/summary.md; else ok=0; echo "- **FAIL** e2e $n: $(grep -m1 FAIL out/e2e/$n.txt)" >> out/summary.md; fi; }
          e2e http-full env EXPECT=yes E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched http full
          e2e none-full env EXPECT=yes E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched none full
          e2e tls-quick env EXPECT=no E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched tls quick
          e2e mux-quick env EXPECT=no E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched mux quick
          e2e switched-off env EXPECT=no XRAY_VLESS_SPLICE=off E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched http quick
          e2e urgent-data env EXPECT=yes E2ETOOL=$PWD/t/e2etool t/urg.sh ./xray-patched
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ $ok = 1 ] && echo "- **zero-copy core: all tests passed**" >> out/summary.md || echo "- **zero-copy left out: a test failed (the release gets the stock core)**" >> out/summary.md

      - name: "6. XLite end-to-end on the runner: client netns -> router netns (XLite config + nft tproxy) -> VLESS server netns"
        run: |
          set -e
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq libjson-c-dev nftables cmake pkg-config wireguard-tools > /dev/null
          P=$PWD/hostroot; export PKG_CONFIG_PATH=$P/lib/pkgconfig
          get() { mkdir -p "$1" && git -C "$1" init -q && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          get libubox https://github.com/openwrt/libubox.git $LIBUBOX_REV
          get uci https://github.com/openwrt/uci.git $UCI_REV
          get ucode https://github.com/jow-/ucode.git $UCODE_REV
          sed -i 's/^ADD_SUBDIRECTORY(lua)/#&/; s/^ADD_SUBDIRECTORY(examples)/#&/' libubox/CMakeLists.txt
          (cd libubox && cmake -S . -B b -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF -DUNIT_TESTING=OFF -DCMAKE_INSTALL_PREFIX=$P > /dev/null && make -C b -j"$(nproc)" install > /dev/null)
          (cd uci && cmake -S . -B b -DBUILD_LUA=OFF -DCMAKE_INSTALL_PREFIX=$P -DCMAKE_PREFIX_PATH=$P -DCMAKE_C_FLAGS="-I$P/include" -DCMAKE_EXE_LINKER_FLAGS="-L$P/lib" -DCMAKE_SHARED_LINKER_FLAGS="-L$P/lib" > /dev/null && make -C b -j"$(nproc)" install > /dev/null)
          (cd ucode && cmake -S . -B b -DCMAKE_INSTALL_PREFIX=$P -DCMAKE_PREFIX_PATH=$P -DCMAKE_C_FLAGS="-I$P/include" \
             -DCMAKE_EXE_LINKER_FLAGS="-L$P/lib -Wl,-rpath,$P/lib" -DCMAKE_SHARED_LINKER_FLAGS="-L$P/lib -Wl,-rpath,$P/lib" \
             -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DDEBUG_SUPPORT=OFF \
             -DLOG_SUPPORT=OFF -DDIGEST_SUPPORT=OFF -DUCI_SUPPORT=ON -DFS_SUPPORT=ON -DMATH_SUPPORT=ON > /dev/null && make -C b -j"$(nproc)" install > /dev/null)
          printf '#!/bin/sh\nLD_LIBRARY_PATH=%s/lib exec %s/bin/ucode -L %s/src/usr/share/ucode -L %s/lib/ucode "$@"\n' "$P" "$P" "$PWD" "$P" > uc.sh
          chmod 755 uc.sh
          # every ucode file must compile with the ucode of OpenWrt 24.10
          for f in src/usr/share/xlite/gen.uc src/usr/share/xlite/monitor.uc src/usr/share/xlite/bot.uc src/usr/share/rpcd/ucode/xlite.uc; do
            ./uc.sh -e "loadfile('$f'); print('compiled $f\\n');"
          done
          CORE=./xray-patched; [ "${{ steps.splice.outputs.ok }}" = 1 ] || CORE=./xray-stock
          for mode in tproxy redirect; do
            if sudo env IMPL=$mode DNS=$([ $mode = redirect ] && echo direct || echo proxy) TMPDIR=/tmp timeout 1200 t/ns-e2e.sh $CORE t/e2etool src ./uc.sh > out/ns-$mode.txt 2>&1; then
              echo "- XLite $mode end-to-end: $(grep -c ^PASS out/ns-$mode.txt) checks passed" >> out/summary.md
            else
              cat out/ns-$mode.txt
              echo "- **FAIL** XLite $mode end-to-end: $(grep -m1 ^FAIL out/ns-$mode.txt)" >> out/summary.md
              exit 1
            fi
          done
          # every v2rayA mode combination: the core and nft accept what XLite writes
          if sudo env TMPDIR=/tmp timeout 1800 t/modes.sh $CORE src ./uc.sh > out/modes.txt 2>&1; then
            echo "- modes: $(grep RESULT out/modes.txt)" >> out/summary.md
          else
            grep FAIL out/modes.txt | head -20; echo "- **FAIL** modes: $(grep -m1 FAIL out/modes.txt)" >> out/summary.md; exit 1
          fi
          # two servers at once, Iraqi routing, fallback, Forward DNS, isolation, device counters, kernel WireGuard
          if sudo env TMPDIR=/tmp timeout 900 t/ns-r2.sh $CORE t/e2etool src ./uc.sh > out/ns-r2.txt 2>&1; then
            echo "- XLite two servers end-to-end: $(grep -c ^PASS out/ns-r2.txt) checks passed $(grep -q ^SKIP out/ns-r2.txt && echo '(WireGuard skipped)')" >> out/summary.md
          else
            cat out/ns-r2.txt
            echo "- **FAIL** XLite two servers: $(grep -m1 ^FAIL out/ns-r2.txt)" >> out/summary.md
            exit 1
          fi
          [ "${{ steps.splice.outputs.ok }}" = 1 ] && ! grep -q 'zero-copy download used' out/ns-tproxy.txt && { echo "- **FAIL** zero-copy not used through XLite" >> out/summary.md; exit 1; }
          true

      - name: "7. Cores for every CPU (static, stripped, gzip)"
        run: |
          set -e
          D=stock; [ "${{ steps.splice.outputs.ok }}" = 1 ] && D=patched
          mkdir -p rel
          LD="-s -w -buildid= -X github.com/xtls/xray-core/core.build=XLite -X github.com/xtls/xray-core/core.version=$XRAY_VERSION"
          b() { local n=$1 a=$2; shift 2; (cd $D && env CGO_ENABLED=0 GOOS=linux GOARCH=$a "$@" go build -trimpath -buildvcs=false -ldflags "$LD" -o ../rel/xray-$n ./main); gzip -9nf rel/xray-$n; echo "- core $n: $(du -k rel/xray-$n.gz | cut -f1) KB" >> out/summary.md; }
          b arm64 arm64
          b armv7 arm GOARM=7
          b armv6 arm GOARM=6
          b armv5 arm GOARM=5
          b mipsle mipsle GOMIPS=softfloat
          b mips mips GOMIPS=softfloat
          b mips64le mips64le GOMIPS64=softfloat
          b mips64 mips64 GOMIPS64=softfloat
          b amd64 amd64
          b 386 386 GO386=softfloat
          b riscv64 riscv64
          b loong64 loong64
          if [ $D = patched ]; then
            for f in rel/xray-*.gz; do gzip -dc "$f" | grep -aq 'VLESS downlink splice' || { echo "$f has no zero-copy"; exit 1; }; done
          fi

      - name: "8. Tool package + installer"
        run: |
          set -e
          V="1.0.6"
          # the page carries the version in its file name, so browsers never show an old page
          mv src/www/luci-static/resources/xlite/ui_dev.js "src/www/luci-static/resources/xlite/ui_$(echo "$V" | tr -c '0-9A-Za-z\n' '_')_b${{ github.run_number }}.js"
          tar --owner=0 --group=0 -czf rel/xlite.tar.gz -C src .
          sed -e "s|@REPO@|${{ github.repository }}|g" -e "s|@TAG@|$RELEASE_TAG|g" -e "s|@VERSION@|$V|g" -e "s|@BUILD@|${{ github.run_number }}|g" install.sh.in > rel/install.sh
          sh -n rel/install.sh
          (cd rel && sha256sum xlite.tar.gz install.sh xray-*.gz > sha256sums)
          echo "$V" > rel/version
          cat rel/sha256sums
          echo "- package: XLite $V" >> out/summary.md

      - name: "9. Publish the release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          R="${{ github.repository }}"
          V=$(cat rel/version)
          Z=$([ "${{ steps.splice.outputs.ok }}" = 1 ] && echo "with the zero-copy download" || echo "stock core (zero-copy left out)")
          printf '%s\n' "XLite $V ($Z)" "" "Install or update on the router (SSH):" "" \
            "    wget -O- https://github.com/$R/releases/download/$RELEASE_TAG/install.sh | sh" "" \
            "Then LuCI: Services > XLite." > notes.txt
          if gh release view "$RELEASE_TAG" -R "$R" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" -R "$R" --title "XLite $V" --notes-file notes.txt --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" -R "$R" --target "$GITHUB_SHA" --title "XLite $V" --notes-file notes.txt --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" -R "$R" --clobber rel/install.sh rel/xlite.tar.gz rel/sha256sums rel/version rel/xray-*.gz
          echo "- **published** release $RELEASE_TAG: XLite $V" >> out/summary.md
          echo "" >> out/summary.md
          echo "Install: \`wget -O- https://github.com/$R/releases/download/$RELEASE_TAG/install.sh | sh\`" >> out/summary.md

      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xlite-logs-${{ github.run_number }}
          path: out/
