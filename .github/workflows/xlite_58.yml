          D0vmOyjTZWftKqfOUudOK11/Ruh2bjioqv6KHrLaTm5VNWykzbqrU/AGt+nnuYT2iSPpQzU0uERv
          L7WmLyMjd3COX/y4GdL88MPuk536q4ljGkfxH2XAqGJQAgAA
          XLITE_PGOP

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: "4. Xray source (the same tarball OpenWrt builds, hash checked) + patch 900"
        run: |
          set -e
          curl -sSfL --retry 3 -o xray-src.tar.gz "https://codeload.github.com/XTLS/Xray-core/tar.gz/v$XRAY_VERSION"
          echo "$XRAY_HASH  xray-src.tar.gz" | sha256sum -c -
          mkdir -p stock patched
          tar -xzf xray-src.tar.gz -C stock --strip-components=1
          tar -xzf xray-src.tar.gz -C patched --strip-components=1
          (cd patched && patch -p1 --fuzz=0 --no-backup-if-mismatch < ../t/xray-900-vless-downlink-splice.patch)
          (cd stock && go mod download) && (cd patched && go mod download)
          export CGO_ENABLED=0
          (cd stock && go build -trimpath -o ../xray-stock ./main)
          (cd patched && go build -trimpath -o ../xray-patched ./main)
          (cd t/tool-src && go build -o ../e2etool .)
          ./xray-patched version | head -n1

      - name: "5. Zero-copy core: end-to-end tests (VLESS server <- patched client <- test tool, every byte checked)"
        id: splice
        if: ${{ inputs.zero_copy }}
        run: |
          export TMPDIR=$PWD/tmp; mkdir -p $TMPDIR out/e2e
          ok=1
          e2e() { local n=$1; shift; if timeout 900 "$@" > out/e2e/$n.txt 2>&1 || timeout 900 "$@" > out/e2e/$n.txt 2>&1; then echo "- e2e $n: $(grep RESULT out/e2e/$n.txt | tail -n1)" >> out/summary.md; else ok=0; echo "- **FAIL** e2e $n: $(grep -m1 FAIL out/e2e/$n.txt)" >> out/summary.md; fi; }
          e2e http-full env EXPECT=yes E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched http full
          e2e none-full env EXPECT=yes E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched none full
          e2e tls-quick env EXPECT=no E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched tls quick
          e2e mux-quick env EXPECT=no E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched mux quick
          e2e switched-off env EXPECT=no XRAY_VLESS_SPLICE=off E2ETOOL=$PWD/t/e2etool t/run.sh ./xray-patched http quick
          e2e urgent-data env EXPECT=yes E2ETOOL=$PWD/t/e2etool t/urg.sh ./xray-patched
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ $ok = 1 ] && echo "- **zero-copy core: all tests passed**" >> out/summary.md || echo "- **zero-copy left out: a test failed (the release gets the stock core)**" >> out/summary.md

      - name: "6. XLite end-to-end on the runner: client netns -> router netns (XLite config + nft tproxy) -> VLESS server netns"
        run: |
          set -e
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq libjson-c-dev nftables cmake pkg-config wireguard-tools > /dev/null
          P=$PWD/hostroot; export PKG_CONFIG_PATH=$P/lib/pkgconfig
          get() { mkdir -p "$1" && git -C "$1" init -q && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          get libubox https://github.com/openwrt/libubox.git $LIBUBOX_REV
          get uci https://github.com/openwrt/uci.git $UCI_REV
          get ucode https://github.com/jow-/ucode.git $UCODE_REV
          sed -i 's/^ADD_SUBDIRECTORY(lua)/#&/; s/^ADD_SUBDIRECTORY(examples)/#&/' libubox/CMakeLists.txt
          (cd libubox && cmake -S . -B b -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF -DUNIT_TESTING=OFF -DCMAKE_INSTALL_PREFIX=$P > /dev/null && make -C b -j"$(nproc)" install > /dev/null)
          (cd uci && cmake -S . -B b -DBUILD_LUA=OFF -DCMAKE_INSTALL_PREFIX=$P -DCMAKE_PREFIX_PATH=$P -DCMAKE_C_FLAGS="-I$P/include" -DCMAKE_EXE_LINKER_FLAGS="-L$P/lib" -DCMAKE_SHARED_LINKER_FLAGS="-L$P/lib" > /dev/null && make -C b -j"$(nproc)" install > /dev/null)
          (cd ucode && cmake -S . -B b -DCMAKE_INSTALL_PREFIX=$P -DCMAKE_PREFIX_PATH=$P -DCMAKE_C_FLAGS="-I$P/include" \
             -DCMAKE_EXE_LINKER_FLAGS="-L$P/lib -Wl,-rpath,$P/lib" -DCMAKE_SHARED_LINKER_FLAGS="-L$P/lib -Wl,-rpath,$P/lib" \
             -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DDEBUG_SUPPORT=OFF \
             -DLOG_SUPPORT=OFF -DDIGEST_SUPPORT=OFF -DUCI_SUPPORT=ON -DFS_SUPPORT=ON -DMATH_SUPPORT=ON > /dev/null && make -C b -j"$(nproc)" install > /dev/null)
          printf '#!/bin/sh\nLD_LIBRARY_PATH=%s/lib exec %s/bin/ucode -L %s/src/usr/share/ucode -L %s/lib/ucode "$@"\n' "$P" "$P" "$PWD" "$P" > uc.sh
          chmod 755 uc.sh
          # every ucode file must compile with the ucode of OpenWrt 24.10
          for f in src/usr/share/xlite/gen.uc src/usr/share/xlite/monitor.uc src/usr/share/xlite/bot.uc src/usr/share/xlite/wifiguard.uc src/usr/share/rpcd/ucode/xlite.uc; do
            ./uc.sh -e "loadfile('$f'); print('compiled $f\\n');"
          done
          # device controls: the sleep hours over midnight and on the chosen days only
          ./uc.sh -e "import * as dev from 'xlite.dev';
          let x = { sleep: '22:00-07:00', sleep_days: '12345' };
          for (let c in [ [23,1,true], [3,2,true], [3,1,false], [21,1,false], [8,3,false], [0,6,true], [23,6,false] ])
            if (dev.asleep(x, { hour: c[0], min: 0, wday: c[1] }) != c[2]) die(sprintf('asleep %J wrong', c));
          print('device controls ok\\n');"
          # smart mode: the hops (where the delay comes from) out of a run's steps, and the fixes for each cause
          ./uc.sh -e "import * as b from 'xlite.brain';
          let h = b.hops({ steps: [ { id: 'gateway', ms: 3 }, { id: 'internet', ms: 40 }, { id: 'server', ms: 90 }, { id: 'tunnel', ms: 110 } ] });
          if (sprintf('%J', h) != sprintf('%J', { line: 3, isp: 37, far: 50, tun: 20 })) die(sprintf('hops %J', h));
          if (b.hops({ steps: [] }) != null || b.LADDER.tunnel[0] != 'core' || !b.FIX.dnsmasq.auto) die('brain tables wrong');
          print('smart brain ok\\n');"
          # the bonding shares: tenths -> copies of each line in the turn order (wrong copies = wrong speed split)
          ./uc.sh -e "import * as lib from 'xlite.lib';
          for (let c in [ [[5,3,2],[5,3,2]], [[5,5],[1,1]], [[8,3],[7,3]], [[10,10,10],[1,1,1]], [[7,1,1,1],[7,1,1,1]] ]) {
            let r = lib.bond_copies(c[0], length(c[0]));
            if (sprintf('%J', r) != sprintf('%J', c[1])) die(sprintf('bond_copies %J gave %J, want %J', c[0], r, c[1]));
          }
          print('bond_copies ok\\n');"
          # a line handed an address inside the router's own LAN never works: it must be told apart from a good one
          ./uc.sh -e "import * as lib from 'xlite.lib';
          let lan = [ { address: '192.168.1.1', mask: 24 } ], ln = (a, m) => ({ 'ipv4-address': [ { address: a, mask: m } ] });
          if (!lib.lan_clash(ln('192.168.1.50', 24), lan) || lib.lan_clash(ln('192.168.0.50', 24), lan) || !lib.lan_clash(ln('192.168.0.9', 16), lan) || lib.lan_clash({}, lan))
            die('lan_clash gave a wrong answer');
          print('lan_clash ok\\n');"
          CORE=./xray-patched; [ "${{ steps.splice.outputs.ok }}" = 1 ] || CORE=./xray-stock
          for mode in tproxy redirect; do
            if sudo env IMPL=$mode DNS=$([ $mode = redirect ] && echo direct || echo proxy) TMPDIR=/tmp timeout 1200 t/ns-e2e.sh $CORE t/e2etool src ./uc.sh > out/ns-$mode.txt 2>&1; then
              echo "- XLite $mode end-to-end: $(grep -c ^PASS out/ns-$mode.txt) checks passed" >> out/summary.md
            else
              cat out/ns-$mode.txt
              echo "- **FAIL** XLite $mode end-to-end: $(grep -m1 ^FAIL out/ns-$mode.txt)" >> out/summary.md
              exit 1
            fi
          done
          # every v2rayA mode combination: the core and nft accept what XLite writes
          if sudo env TMPDIR=/tmp timeout 1800 t/modes.sh $CORE src ./uc.sh > out/modes.txt 2>&1; then
            echo "- modes: $(grep RESULT out/modes.txt)" >> out/summary.md
          else
            grep FAIL out/modes.txt | head -20; echo "- **FAIL** modes: $(grep -m1 FAIL out/modes.txt)" >> out/summary.md; exit 1
          fi
          # two servers at once, Iraqi routing, fallback, Forward DNS, isolation, device counters, kernel WireGuard
          if sudo env TMPDIR=/tmp timeout 900 t/ns-r2.sh $CORE t/e2etool src ./uc.sh > out/ns-r2.txt 2>&1; then
            echo "- XLite two servers end-to-end: $(grep -c ^PASS out/ns-r2.txt) checks passed $(grep -q ^SKIP out/ns-r2.txt && echo '(WireGuard skipped)')" >> out/summary.md
          else
            cat out/ns-r2.txt
            echo "- **FAIL** XLite two servers: $(grep -m1 ^FAIL out/ns-r2.txt)" >> out/summary.md
            exit 1
          fi
          # line bonding: two lines from the router to the server, both carry tunnels, one down still works
          if sudo env TMPDIR=/tmp timeout 300 t/ns-bond.sh $CORE t/e2etool src ./uc.sh > out/ns-bond.txt 2>&1; then
            echo "- XLite line bonding end-to-end: $(grep -c ^PASS out/ns-bond.txt) checks passed" >> out/summary.md
          else
            cat out/ns-bond.txt
            echo "- **FAIL** XLite line bonding: $(grep -m1 ^FAIL out/ns-bond.txt)" >> out/summary.md
            exit 1
          fi
          [ "${{ steps.splice.outputs.ok }}" = 1 ] && ! grep -q 'zero-copy download used' out/ns-tproxy.txt && { echo "- **FAIL** zero-copy not used through XLite" >> out/summary.md; exit 1; }
          true

      - name: "7a. PGO: profile the core under a real load (WS+TLS, TLS, TCP), keep it only if it is faster"
        run: |
          set -e
          D=stock; [ "${{ steps.splice.outputs.ok }}" = 1 ] && D=patched
          mkdir -p pgo && cp t/pgo/zz_pgoprof.go $D/main/
          (cd $D && CGO_ENABLED=0 go build -trimpath -tags pgoprof -o ../pgo/xray-prof ./main)
          rm -f $D/main/zz_pgoprof.go
          for m in ws ws tls tcp; do MODE=$m bash t/pgo/bench.sh pgo/xray-prof ./xray-stock t/e2etool pgo/$m-$RANDOM.prof || true; done
          ls pgo/*.prof > /dev/null 2>&1 || { echo "- PGO: no profile, built without it" >> out/summary.md; exit 0; }
          go tool pprof -proto pgo/*.prof > pgo/default.pgo
          (cd $D && CGO_ENABLED=0 go build -trimpath -pgo=off -o ../pgo/x-base ./main)
          (cd $D && CGO_ENABLED=0 go build -trimpath -pgo=../pgo/default.pgo -o ../pgo/x-pgo ./main)
          sum() { local s=0 i v; for i in 1 2 3; do v=$(bash t/pgo/bench.sh $1 ./xray-stock t/e2etool | awk '{print $1}'); s=$((s + ${v:-999999})); done; echo $s; }
          a=$(sum pgo/x-base); b=$(sum pgo/x-pgo)
          if [ "$b" -lt "$a" ]; then
            cp pgo/default.pgo stock/main/default.pgo; cp pgo/default.pgo patched/main/default.pgo
            echo "- **PGO on**: CPU per load $a -> $b ticks ($(( (a - b) * 100 / a ))% lighter)" >> out/summary.md
          else
            echo "- PGO off: no gain ($a -> $b ticks)" >> out/summary.md
          fi

      - name: "7. Cores for every CPU (static, stripped, gzip)"
        run: |
          set -e
          D=stock; [ "${{ steps.splice.outputs.ok }}" = 1 ] && D=patched
          mkdir -p rel
          LD="-s -w -buildid= -X github.com/xtls/xray-core/core.build=XLite -X github.com/xtls/xray-core/core.version=$XRAY_VERSION"
          b() { local n=$1 a=$2; shift 2; (cd $D && env CGO_ENABLED=0 GOOS=linux GOARCH=$a "$@" go build -trimpath -buildvcs=false -ldflags "$LD" -o ../rel/xray-$n ./main); gzip -9nf rel/xray-$n; echo "- core $n: $(du -k rel/xray-$n.gz | cut -f1) KB" >> out/summary.md; }
          b arm64 arm64
          b armv7 arm GOARM=7
          b armv6 arm GOARM=6
          b armv5 arm GOARM=5
          b mipsle mipsle GOMIPS=softfloat
          b mips mips GOMIPS=softfloat
          b mips64le mips64le GOMIPS64=softfloat
          b mips64 mips64 GOMIPS64=softfloat
          b amd64 amd64
          b 386 386 GO386=softfloat
          b riscv64 riscv64
          b loong64 loong64
          if [ $D = patched ]; then
            for f in rel/xray-*.gz; do gzip -dc "$f" | grep -aq 'VLESS downlink splice' || { echo "$f has no zero-copy"; exit 1; }; done
          fi

      - name: "8. Tool package + installer"
        run: |
          set -e
          V="1.0.63"
          # the page carries the version in its file name, so browsers never show an old page
          mv src/www/luci-static/resources/xlite/ui_dev.js "src/www/luci-static/resources/xlite/ui_$(echo "$V" | tr -c '0-9A-Za-z\n' '_')_b${{ github.run_number }}.js"
          tar --owner=0 --group=0 -czf rel/xlite.tar.gz -C src .
          sed -e "s|@REPO@|${{ github.repository }}|g" -e "s|@TAG@|$RELEASE_TAG|g" -e "s|@VERSION@|$V|g" -e "s|@BUILD@|${{ github.run_number }}|g" install.sh.in > rel/install.sh
          sh -n rel/install.sh
          (cd rel && sha256sum xlite.tar.gz install.sh xray-*.gz > sha256sums)
          echo "$V.${{ github.run_number }}" > rel/version
          cat rel/sha256sums
          echo "- package: XLite $V" >> out/summary.md

      - name: "9. Publish the release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          R="${{ github.repository }}"
          V=$(cat rel/version)
          Z=$([ "${{ steps.splice.outputs.ok }}" = 1 ] && echo "with the zero-copy download" || echo "stock core (zero-copy left out)")
          printf '%s\n' "XLite $V ($Z)" "" "Install or update on the router (SSH):" "" \
            "    wget -O- https://github.com/$R/releases/download/$RELEASE_TAG/install.sh | sh" "" \
            "Then LuCI: Services > XLite." > notes.txt
          if gh release view "$RELEASE_TAG" -R "$R" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" -R "$R" --title "XLite $V${{ inputs.channel == 'developers' && ' (dev)' || '' }}" --notes-file notes.txt --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" -R "$R" --target "$GITHUB_SHA" --title "XLite $V${{ inputs.channel == 'developers' && ' (dev)' || '' }}" --notes-file notes.txt --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" -R "$R" --clobber rel/install.sh rel/xlite.tar.gz rel/sha256sums rel/version rel/xray-*.gz
          echo "- **published** release $RELEASE_TAG: XLite $V" >> out/summary.md
          echo "" >> out/summary.md
          echo "Install: \`wget -O- https://github.com/$R/releases/download/$RELEASE_TAG/install.sh | sh\`" >> out/summary.md

      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xlite-logs-${{ github.run_number }}
          path: out/
