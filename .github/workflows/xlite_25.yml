name: XLite release

# Builds XLite (the light v2rayA replacement) and publishes it as the release "xlite" of this repo.
# On any OpenWrt 22.03+ router:  wget -O- https://github.com/<this repo>/releases/download/xlite/install.sh | sh
# Every file of the tool is inside this workflow: the repo needs nothing else.

on:
  workflow_dispatch:
    inputs:
      zero_copy:
        description: 'Core with the zero-copy download for VLESS over TCP (patch 900): tested on the runner first, left out by itself if a test fails'
        type: boolean
        default: true

permissions:
  contents: write

env:
  XRAY_VERSION: 25.1.30
  XRAY_HASH: 983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e
  GO_VERSION: 1.23.12
  RELEASE_TAG: xlite
  LIBUBOX_REV: da2d205a5cf3e877c45a2eec488218cbaf452e7d
  UCI_REV: 74f6277aabffc943d026f406df57c22595134c42
  UCODE_REV: 3f64c8089bf3ea4847c96b91df09fbfcaec19e1d   # the ucode of OpenWrt 24.10

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: "1. XLite files"
        run: |
          mkdir -p out
          echo "# XLite build $GITHUB_RUN_NUMBER" > out/summary.md
          mkdir -p "$(dirname "src/etc/hotplug.d/iface/90-xlite")"
          cat > "src/etc/hotplug.d/iface/90-xlite" <<'XLITE_FILE_0'
          # XLite: keep the set of the router's own addresses current (they never go through the proxy),
          # and start XLite again when the line comes up after a boot or a drop (it may have started too early)
          case "$ACTION" in
          ifup|ifupdate)
          	[ -x /usr/bin/xlite ] || exit 0
          	/usr/bin/xlite refresh_ips
          	[ "$ACTION" = ifup ] || exit 0
          	[ "$(uci -q get xlite.main.enabled)" = 1 ] || exit 0
          	[ "$(uci -q get xlite.main.transparent)" = off ] && exit 0
          	if nft list table inet xlite > /dev/null 2>&1; then
          		# running: restart only when a bonded line came back (its route table is gone), or when IPv6
          		# came up after XLite was built without it ("auto"), else IPv6 would go out outside the VPN
          		b=; [ "$(uci -q get xlite.main.bond)" = 1 ] && b=" $(uci -q get xlite.main.bond_ifaces) "
          		# "wan" in the lines stands for the main line: on a 5G router that is the modem's interface
          		case "$b" in *" wan "*)
          			case "$INTERFACE" in xw_*|lan*|loopback|wan) ;; *)
          				ip -4 route show default 2>/dev/null | grep -q " dev $DEVICE" && b="$b$INTERFACE " ;;
          			esac ;;
          		esac
          		case "$b" in
          		*" $INTERFACE "*)
          			# a line the core already dials through: its route back is enough, nobody's connections drop
          			/usr/bin/xlite bond_route "$INTERFACE" && exit 0
          			;;
          		*)
          			[ "$(uci -q get xlite.main.ipv6)" = 0 ] && exit 0
          			[ "$(jsonfilter -i /var/etc/xlite/state.json -e '@.ipv6' 2>/dev/null)" = false ] || exit 0
          			[ -n "$(ip -6 route show default 2>/dev/null)" ] || exit 0
          			;;
          		esac
          	else
          		# still starting (the core can need a while at boot): rules_when_ready applies the rules itself
          		s=/tmp/xlite/starting
          		[ -f $s ] && [ $(( $(date +%s) - $(date -r $s +%s 2>/dev/null || echo 0) )) -lt 130 ] && exit 0
          	fi
          	# one restart per 30 s, whatever number of interfaces come up together
          	l=/tmp/xlite-hotplug.lock
          	[ -f $l ] && [ $(( $(date +%s) - $(date -r $l +%s 2>/dev/null || echo 0) )) -lt 30 ] && exit 0
          	touch $l
          	logger -t xlite "$INTERFACE is up and XLite was not routing: starting it again"
          	( /etc/init.d/xlite restart > /dev/null 2>&1 & )
          	;;
          esac
          XLITE_FILE_0
          mkdir -p "$(dirname "src/etc/init.d/xlite")"
          cat > "src/etc/init.d/xlite" <<'XLITE_FILE_1'
          #!/bin/sh /etc/rc.common
          # XLite: transparent proxy (xray core + nftables tproxy)
          START=99
          STOP=10
          USE_PROCD=1

          bot_instance() {
          	procd_open_instance bot
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/bot.uc
          	procd_set_param respawn 3600 15 0
          	procd_set_param stderr 1
          	procd_close_instance
          }

          # Wi-Fi as a line: the guard gives the router's own Wi-Fi back when the joined network goes away
          wifi_guard() {
          	uci -q show wireless 2>/dev/null | grep -q "^wireless\.xw_[A-Za-z0-9_]*\.mode='sta'" || return 0
          	procd_open_instance wifiguard
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/wifiguard.uc
          	procd_set_param respawn 3600 15 0
          	procd_set_param stderr 1
          	procd_close_instance
          }

          start_service() {
          	local enabled core kv
          	config_load xlite
          	config_get_bool enabled main enabled 0
          	config_get_bool bot main bot_enabled 0
          	if [ "$enabled" != 1 ]; then
          		/usr/bin/xlite rules_down
          		# the Telegram bot stays reachable while XLite is off (so /on works)
          		[ "$bot" = 1 ] && bot_instance
          		wifi_guard
          		return 0
          	fi
          	/usr/bin/xlite stop_v2raya
          	if ! /usr/bin/xlite prepare; then
          		logger -t xlite "not started: no valid server (add one in LuCI: Services > XLite)"
          		return 1
          	fi
          	if ! core=$(/usr/bin/xlite core); then
          		logger -t xlite "not started: the core (xray) is missing, run: xlite update"
          		return 1
          	fi
          	/usr/bin/xlite sysctl
          	procd_open_instance xray
          	procd_set_param command "$core" run -c /var/etc/xlite/config.json
          	# a reload restarts the core only when its config changed
          	procd_set_param file /var/etc/xlite/config.json /var/etc/xlite/env
          	procd_set_param env XRAY_LOCATION_ASSET=/usr/share/xray
          	for kv in $(cat /var/etc/xlite/env); do
          		[ -n "${kv#*=}" ] && procd_append_param env "$kv"
          	done
          	local nofile; config_get nofile main nofile 65535
          	procd_set_param limits nofile="$nofile $nofile"
          	procd_set_param respawn 3600 5 0
          	procd_set_param stdout 1
          	procd_set_param stderr 1
          	procd_close_instance
          	# device usage, WireGuard health, learning mode, subscription updates
          	procd_open_instance monitor
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/monitor.uc
          	procd_set_param respawn 3600 10 0
          	procd_set_param stderr 1
          	procd_close_instance
          	[ "$bot" = 1 ] && bot_instance
          	wifi_guard
          	( /usr/bin/xlite rules_when_ready > /dev/null 2>&1 & )
          }

          stop_service() {
          	/usr/bin/xlite rules_down
          	# keep today's device totals (the monitor writes them to flash every 30 minutes)
          	[ -s /tmp/xlite/usage.json ] && mkdir -p /etc/xlite && cp /tmp/xlite/usage.json /etc/xlite/usage.json
          }

          # a settings change: build again; procd restarts only the instances whose command or files changed
          reload_service() {
          	start
          }

          service_triggers() {
          	procd_add_reload_trigger "xlite"
          }
          XLITE_FILE_1
          chmod 755 "src/etc/init.d/xlite"
          mkdir -p "$(dirname "src/usr/bin/xlite")"
          cat > "src/usr/bin/xlite" <<'XLITE_FILE_2'
          #!/bin/sh
          # XLite: a light transparent proxy for OpenWrt (xray core + nftables tproxy), managed from LuCI.
          #   xlite start|stop|restart        the proxy (same as /etc/init.d/xlite ...)
          #   xlite status                    is it running, which server, which core
          #   xlite add                       share links on stdin (vless://, vmess://, trojan://, ss://)
          #   xlite ping <server-id>          TCP connect time to a server in ms (-1 = no answer)
          #   xlite sub <id|all>              update subscriptions
          #   xlite lists [gfw|cn]            download the GFWList / China address list
          #   xlite exitip [1|2]              the public address seen through the main (1) or second (2) server
          #   xlite update                    install the newest version (settings and servers are kept)
          #   xlite uninstall                 remove XLite (v2rayA is enabled again if it is installed)
          SHARE=/usr/share/xlite
          RUN=/var/etc/xlite
          UC="ucode -L /usr/share/ucode $SHARE/gen.uc"
          TABLE=100
          [ -f $SHARE/release ] && . $SHARE/release   # REPO=owner/name TAG=xlite VERSION=...

          log() { logger -t xlite "$*"; }

          core_path() {
          	local c
          	c=$(uci -q get xlite.main.core)
          	[ -n "$c" ] && [ -x "$c" ] && { echo "$c"; return 0; }
          	for c in $SHARE/bin/xray /usr/bin/xray /tmp/xlite-core/xray; do
          		[ -x "$c" ] && { echo "$c"; return 0; }
          	done
          	# small flash: the core is kept compressed and unpacked to RAM at start
          	if [ -s $SHARE/bin/xray.gz ]; then
          		mkdir -p /tmp/xlite-core && gzip -dc $SHARE/bin/xray.gz > /tmp/xlite-core/xray.new && chmod 755 /tmp/xlite-core/xray.new &&
          			mv /tmp/xlite-core/xray.new /tmp/xlite-core/xray && { echo /tmp/xlite-core/xray; return 0; }
          	fi
          	return 1
          }

          TMPD=/tmp/xlite
          DNS_PORT=15353
          SOCKS2_PORT=20179

          pkg_install() {
          	if command -v apk > /dev/null; then apk update > /dev/null 2>&1; apk add "$@"
          	else opkg update > /dev/null 2>&1; opkg install "$@"; fi
          }

          # dnsmasq asks the core (Forward DNS Request / DoH / FakeDNS). Only a runtime file: a reboot or a
          # stop of XLite gives the normal DNS back.
          dns_dirs() {
          	local d
          	for d in /tmp/dnsmasq.d /tmp/dnsmasq.*.d; do [ -d "$d" ] && echo "$d"; done
          }

          # the DNS cache size and the shortest keep time are dnsmasq settings that its own config already has
          # (cachesize 1000 by default): a second one stops dnsmasq, so they are changed in /etc/config/dhcp
          # (written only when the value changes; the old value is kept and comes back when the cache is turned off)
          dhcp_opt() {
          	local o=$1 v=$2 sec cur
          	sec=$(uci -q show dhcp | sed -n 's/^dhcp\.\([^.=]*\)=dnsmasq$/\1/p' | head -n 1); [ -n "$sec" ] || return 1
          	cur=$(uci -q get dhcp.$sec.$o)
          	if [ -n "$v" ]; then
          		[ "$cur" = "$v" ] && return 1
          		mkdir -p /etc/xlite; [ -f /etc/xlite/dhcp.$o ] || echo "${cur:--}" > /etc/xlite/dhcp.$o
          		uci set dhcp.$sec.$o="$v"
          	else
          		[ -f /etc/xlite/dhcp.$o ] || return 1
          		v=$(cat /etc/xlite/dhcp.$o); rm -f /etc/xlite/dhcp.$o
          		if [ "$v" = - ]; then uci -q delete dhcp.$sec.$o; else uci set dhcp.$sec.$o="$v"; fi
          	fi
          	uci commit dhcp
          	return 0
          }

          dns_cache_opts() {
          	local any=1
          	dhcp_opt cachesize "$(sed -n 's/^cache-size=//p' $RUN/dnsmasq.conf 2>/dev/null)" && any=0
          	dhcp_opt min_cache_ttl "$(sed -n 's/^min-cache-ttl=//p' $RUN/dnsmasq.conf 2>/dev/null)" && any=0
          	return $any
          }

          dns_on() {
          	local d f main line key changed=
          	dns_cache_opts && changed=1
          	[ -s $RUN/dnsmasq.conf ] || { dns_off; [ -n "$changed" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1; return 0; }
          	for d in $(dns_dirs); do
          		# dnsmasq stops (and DHCP with it) on a keyword it already has: leave out what its own config sets
          		main=$(ls /var/etc/dnsmasq.conf.* 2>/dev/null | head -n 1)
          		f=$TMPD/dnsmasq.try; : > $f
          		while IFS= read -r line; do
          			key=${line%%=*}
          			case "$key" in cache-size|min-cache-ttl) continue ;; server|conf-file) ;; *) [ -n "$main" ] && grep -q "^$key\(=\|\$\)" "$main" && continue ;; esac
          			echo "$line" >> $f
          		done < $RUN/dnsmasq.conf
          		# same lines and the ad list not newer than them: nothing to do (dnsmasq reads the list only at start)
          		cmp -s $f "$d/xlite.conf" && ! [ $TMPD/adblock.conf -nt "$d/xlite.conf" ] && continue
          		cp $f "$d/xlite.conf"; changed=1
          		# a last check: the whole dnsmasq config with ours must pass, else ours goes
          		if [ -n "$main" ] && ! dnsmasq --test -C "$main" > $TMPD/dnsmasq.test 2>&1; then
          			logger -t xlite "dnsmasq refused the XLite DNS lines ($(head -n 1 $TMPD/dnsmasq.test)): DNS left as it was"
          			rm -f "$d/xlite.conf"
          		fi
          	done
          	[ -n "$changed" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	return 0
          }

          dns_off() {
          	local d any=
          	for d in $(dns_dirs); do
          		[ -f "$d/xlite.conf" ] && { rm -f "$d/xlite.conf"; any=1; }
          	done
          	[ -n "$any" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	return 0
          }

          # local ad list (dnsmasq format), kept in RAM; size: small | medium | large
          adblock_list() {
          	local size url f
          	size=$(uci -q get xlite.main.adblock_size); size=${size:-small}
          	case "$size" in
          	large) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/pro.txt ;;
          	medium) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/multi.txt ;;
          	*) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/light.txt ;;
          	esac
          	mkdir -p $TMPD; f=$TMPD/adblock.new
          	fetch "$url" "$f" || { rm -f "$f"; echo "download failed"; return 1; }
          	# keep only "local=/name/" lines (the list must not be able to set anything else in dnsmasq)
          	grep -E '^local=/[A-Za-z0-9._-]+/$' "$f" > $TMPD/adblock.conf; rm -f "$f"
          	for w in $(uci -q get xlite.main.adblock_allow); do grep -vxF "local=/$w/" $TMPD/adblock.conf > $TMPD/adblock.tmp; mv $TMPD/adblock.tmp $TMPD/adblock.conf; done
          	echo "ads: $(wc -l < $TMPD/adblock.conf) domains"
          }

          state() { jsonfilter -i $RUN/state.json -e "$1" 2>/dev/null; }

          ipv6_rules() { grep -q 'tproxy ip6' $RUN/rules.nft 2>/dev/null; }

          rules_down() {
          	# "keepdns": the rules are applied again, the DNS lines stay (no dnsmasq restart, the cache stays)
          	[ "$1" = keepdns ] || dns_off
          	# full stop: the bonded lines' route tables too (the build sets them again)
          	if [ "$1" != keepdns ]; then
          		for i in 1 2 3 4 5 6 7 8 9; do ip rule del priority 85 2>/dev/null || break; done
          		for t in 110 111 112 113 114 115 116 117; do ip route flush table $t 2>/dev/null; done
          		for d in $(cat $TMPD/bond_tc 2>/dev/null); do tc qdisc del dev "$d" ingress 2>/dev/null; tc qdisc del dev "$d" root 2>/dev/null; done
          		rm -f $TMPD/bond_tc
          	fi
          	nft delete table inet xlite 2>/dev/null
          	nft delete table inet xlite_nat 2>/dev/null
          	while ip rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip route flush table $TABLE 2>/dev/null
          	while ip -6 rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip -6 route flush table $TABLE 2>/dev/null
          	return 0
          }

          rules_up() {
          	[ -s $RUN/rules.nft ] || return 0
          	rules_down keepdns
          	if ! nft -f $RUN/rules.nft; then
          		log "nft rules failed to load (see: nft -c -f $RUN/rules.nft)"
          		return 1
          	fi
          	if [ -s $RUN/redirect.nft ]; then
          		nft -f $RUN/redirect.nft || { log "redirect rules failed"; rules_down; return 1; }
          	else
          		ip rule add fwmark 0x40/0xc0 table $TABLE
          		ip route add local 0.0.0.0/0 dev lo table $TABLE
          		if ipv6_rules; then
          			ip -6 rule add fwmark 0x40/0xc0 table $TABLE
          			ip -6 route add local ::/0 dev lo table $TABLE
          		fi
          	fi
          	dns_on
          	return 0
          }

          # the kernel WireGuard of the second server needs kmod-wireguard (asked for once, from LuCI)
          wg_deps() {
          	[ -f /lib/netifd/proto/wireguard.sh ] && { [ -d /sys/module/wireguard ] || modprobe wireguard 2>/dev/null; } && [ -d /sys/module/wireguard ] && { echo ok; return 0; }
          	pkg_install kmod-wireguard wireguard-tools > /tmp/xlite-wg.log 2>&1
          	modprobe wireguard 2>/dev/null
          	[ -f /lib/netifd/proto/wireguard.sh ] && [ -d /sys/module/wireguard ] && { /etc/init.d/rpcd reload 2>/dev/null; echo ok; return 0; }
          	echo "failed (see /tmp/xlite-wg.log); the second server works anyway through the core"
          	return 1
          }

          # USB lines: a phone shares its internet over USB (Android: RNDIS or NCM, iPhone: ipheth + usbmuxd) or a USB
          # modem (CDC-Ethernet / NCM); without these drivers the router sees the device but makes no network of it
          usb_deps() {
          	local p fail=0
          	if command -v apk > /dev/null; then apk update > /dev/null 2>&1; else opkg update > /dev/null 2>&1; fi
          	for p in kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm kmod-usb-net-ipheth usbmuxd; do
          		if command -v apk > /dev/null; then apk add "$p" > /dev/null 2>&1; else opkg install "$p" > /dev/null 2>&1; fi \
          			&& echo "OK  $p" || { echo "--  $p"; fail=1; }
          	done
          	for p in rndis_host cdc_ether cdc_ncm ipheth; do modprobe "$p" 2> /dev/null; done
          	[ -x /etc/init.d/usbmuxd ] && { /etc/init.d/usbmuxd enable; /etc/init.d/usbmuxd start; } > /dev/null 2>&1
          	if [ ! -d /sys/bus/usb/drivers/rndis_host ] && [ ! -d /sys/bus/usb/drivers/cdc_ncm ]; then
          		# kernel modules come from the feed of the exact kernel: a firmware built elsewhere has none
          		echo "التعريفات ما اشتغلت: نسخة النواة بالراوتر ما تطابق مستودع الحزم (سوفتوير معدّل؟)"
          		return 1
          	fi
          	[ $fail = 1 ] && echo "بعض الحزم ما انصبت، بس تعريف الموبايل اشتغل"
          	echo "جاهز: شبّك الموبايل بالـ USB وشغّل عليه مشاركة الإنترنت عبر USB"
          	return 0
          }

          # bonding tools: ip-full (per-line route rules need "oif", busybox's ip has none), and for the speed caps
          # tc with the tbf scheduler and the policer
          bond_deps() {
          	local p need="" kver
          	kver=$(uname -r)
          	ip -V 2>&1 | grep -q iproute2 || need="$need ip-full"
          	command -v tc > /dev/null 2>&1 || need="$need tc-tiny"
          	[ -d /sys/module/sch_tbf ] || [ -f /lib/modules/$kver/sch_tbf.ko ] || need="$need kmod-sched-core"
          	[ -d /sys/module/act_police ] || [ -f /lib/modules/$kver/act_police.ko ] || need="$need kmod-sched-act-police"
          	[ -n "$need" ] || { echo "كل الأدوات موجودة"; return 0; }
          	if command -v apk > /dev/null; then apk update > /dev/null 2>&1; else opkg update > /dev/null 2>&1; fi
          	for p in $need; do
          		if command -v apk > /dev/null; then apk add "$p" > /dev/null 2>&1; else opkg install "$p" > /dev/null 2>&1; fi \
          			&& echo "OK  $p" || echo "--  $p"
          	done
          	modprobe sch_tbf 2> /dev/null; modprobe act_police 2> /dev/null
          	ip -V 2>&1 | grep -q iproute2 || { echo "ip-full ما انصب: شوف الإنترنت أو مستودع الحزم"; return 1; }
          	# the new tools are used from the next build of the rules
          	[ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart > /dev/null 2>&1
          	echo "جاهز"
          	return 0
          }

          # a bonded line came back (DHCP again, the modem reconnected): its route table back while the core keeps
          # running (it dials through the device by name, and its probe takes the line in again within 15 s), so the
          # other lines' connections never drop. Fails, and the caller restarts XLite, when the line was not in the
          # core's config, its device changed, or a speed cap sits on that device
          bond_route() {
          	local i="$1" n=0 x="" dev want gw t cap j
          	case "$i" in ''|*[!A-Za-z0-9_-]*) return 1 ;; esac
          	for x in $(state '@.bond_used[*]'); do
          		[ "$x" = "$i" ] && break
          		n=$((n + 1))
          	done
          	[ "$x" = "$i" ] || return 1
          	want=$(state "@.bond[@.iface='$i'].dev")
          	j=$(ubus call network.interface."$i" status 2>/dev/null) || return 1
          	dev=$(echo "$j" | jsonfilter -e '@.l3_device')
          	[ -n "$dev" ] && [ "$dev" = "$want" ] || return 1
          	cap=$(uci -q get xlite.main.bond_limits | tr ' ,' '\n\n' | sed -n "s/^$i:\([0-9]*\)$/\1/p")
          	[ -z "$cap" ] || [ "$cap" = 0 ] || return 1
          	gw=$(echo "$j" | jsonfilter -e "@.route[@.target='0.0.0.0'].nexthop" | grep -v '^0\.0\.0\.0$' | head -n 1)
          	t=$((110 + n))
          	ip route replace default ${gw:+via $gw }dev "$dev" table $t || return 1
          	ip rule show | grep -q "oif $dev lookup $t" || ip rule add oif "$dev" lookup $t priority 85 || return 1
          	[ -d /proc/sys/net/ipv4/conf/"$dev" ] && echo 2 > /proc/sys/net/ipv4/conf/"$dev"/rp_filter
          	log "bonded line $i is back: its route restored, the core kept running"
          	return 0
          }

          # public address through the main (1) or the second (2) server
          exit_ip() {
          	local ip url=https://api.ipify.org port
          	if [ "${1:-1}" = 2 ]; then
          		if [ "$(state '@.second.kernel')" = true ]; then
          			ip=$(curl -s --noproxy '*' --interface xlwg -m 8 $url 2>/dev/null)
          		else
          			ip=$(curl -s -m 8 --socks5-hostname 127.0.0.1:$SOCKS2_PORT $url 2>/dev/null)
          		fi
          	else
          		port=$(uci -q get xlite.main.socks_port)
          		if [ "${port:-0}" -gt 0 ] 2>/dev/null; then
          			ip=$(curl -s -m 8 --socks5-hostname 127.0.0.1:$port $url 2>/dev/null)
          		else
          			ip=$(curl -s -m 8 $url 2>/dev/null)
          		fi
          	fi
          	case "$ip" in *[!0-9a-fA-F.:]*|'') return 1 ;; esac
          	echo "$ip"
          }

          # subscriptions: plain or base64 lists of share links
          sub_one() {   # $1 = section id
          	local url f port rc
          	url=$(uci -q get xlite."$1".url) || return 1
          	f=$(mktemp /tmp/xlite-sub.XXXXXX)
          	port=$(uci -q get xlite.main.socks_port)
          	# direct first; through the proxy when the direct way is blocked
          	if ! curl -fsSL -m 30 -A 'v2rayA/2' -o "$f" "$url" 2>/dev/null || [ ! -s "$f" ]; then
          		[ "${port:-0}" -gt 0 ] 2>/dev/null && curl -fsSL -m 30 -A 'v2rayA/2' --socks5-hostname 127.0.0.1:$port -o "$f" "$url" 2>/dev/null
          	fi
          	if [ ! -s "$f" ]; then
          		rm -f "$f"; echo '{"ok":false,"error":"download"}'; return 1
          	fi
          	$UC sub_apply "$1" < "$f"; rc=$?
          	rm -f "$f"
          	return $rc
          }

          subs() {   # $1 = id or all
          	local s
          	if [ "$1" = all ]; then
          		for s in $(uci -q show xlite | sed -n "s/^xlite\.\([^.=]*\)=subscription$/\1/p"); do sub_one "$s"; done
          	else
          		sub_one "$1"
          	fi
          }

          # GFWList (for the "gfwlist" mode) and the China address list (for "except China")
          lists() {
          	local w=${1:-all} f
          	mkdir -p /etc/xlite
          	f=$(mktemp /tmp/xlite-list.XXXXXX)
          	if [ "$w" = gfw ] || [ "$w" = all ]; then
          		if fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/gfw.txt "$f" && [ -s "$f" ]; then
          			mv "$f" /etc/xlite/gfw.txt; echo "gfw: $(wc -l < /etc/xlite/gfw.txt)"
          		else echo "gfw: download failed"; fi
          	fi
          	if [ "$w" = cn ] || [ "$w" = all ]; then
          		if fetch https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt "$f" && [ -s "$f" ]; then
          			grep -v : "$f" > /etc/xlite/cn4.txt; echo "cn: $(wc -l < /etc/xlite/cn4.txt)"
          		else echo "cn: download failed"; fi
          	fi
          	rm -f "$f"
          }

          # wait until the core listens, then send the traffic to it
          rules_when_ready() {
          	local port i=0
          	port=$(uci -q get xlite.main.tproxy_port); port=${port:-52345}
          	mkdir -p $TMPD; touch $TMPD/starting
          	# at boot the router is busy: the core can need a while (seen: 16 s on the MX2000)
          	while [ $i -lt 480 ]; do
          		if netstat -ltn 2>/dev/null | grep -q "[:.]$port "; then
          			rules_up && log "running"
          			rm -f $TMPD/starting
          			return
          		fi
          		i=$((i + 1)); sleep 0.25
          	done
          	rm -f $TMPD/starting
          	log "the core did not start listening on port $port: rules not applied (logread -e xray)"
          }

          sysctl_apply() {
          	local cc fw
          	cc=$(uci -q get xlite.main.tcp_cc)
          	[ -n "$cc" ] && sysctl -q -w net.ipv4.tcp_congestion_control="$cc" > /dev/null 2>&1
          	fw=$(uci -q get xlite.main.ip_forward)
          	[ "$fw" = 1 ] && sysctl -q -w net.ipv4.ip_forward=1 > /dev/null 2>&1
          	return 0
          }

          stop_v2raya() {
          	[ -x /etc/init.d/v2raya ] || return 0
          	if /etc/init.d/v2raya enabled 2>/dev/null || pidof v2raya > /dev/null; then
          		/etc/init.d/v2raya disable 2>/dev/null
          		uci -q set v2raya.config.enabled=0 && uci -q commit v2raya
          		# its own stop can hang (seen on the MX2000): give it 3 s, then kill
          		( /etc/init.d/v2raya stop > /dev/null 2>&1 & ); sleep 3
          		killall -9 v2raya v2ray xray 2>/dev/null
          		nft delete table inet v2raya 2>/dev/null
          		log "v2rayA stopped and disabled (XLite replaces it)"
          	fi
          	return 0
          }

          ping_server() {   # $1 = server section id
          	local hp host port proto ip uip t
          	hp=$($UC server "$1" 2>/dev/null) || { echo -1; return 1; }
          	set -- $hp; host=$1; port=$2; proto=$3
          	ip=$($UC resolve "$host" 2>/dev/null | head -n 1)
          	[ -n "$ip" ] && [ -n "$port" ] || { echo -1; return 1; }
          	# the ping must not go through the proxy
          	case "$ip" in
          	*:*) nft add element inet xlite bypass6 "{ $ip }" 2>/dev/null; uip="[$ip]" ;;
          	*) nft add element inet xlite bypass4 "{ $ip }" 2>/dev/null; uip=$ip ;;
          	esac
          	if [ "$proto" = wireguard ] || nft list table inet v2raya > /dev/null 2>&1; then
          		# WireGuard is UDP (no TCP connect to time); v2rayA would catch a TCP ping
          		t=$(ping -c 1 -W 2 "$ip" 2>/dev/null | sed -n 's/.*time=\([0-9.]*\) *ms.*/\1/p' | head -n 1)
          		[ -n "$t" ] || { echo -1; return 1; }
          		awk -v t="$t" 'BEGIN { printf "%d\n", t + 0.5 }'
          		return 0
          	fi
          	t=$(curl -s --noproxy '*' -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' "http://$uip:$port/" 2>/dev/null)
          	case "$t" in ''|0|0.000|0.000000) echo -1; return 1 ;; esac
          	awk -v t="$t" 'BEGIN { printf "%d\n", t * 1000 + 0.5 }'
          }

          fetch() {   # $1 = url, $2 = file  (direct; through the core when "update_via" is proxy or direct fails)
          	local port via
          	port=$(uci -q get xlite.main.socks_port); via=$(uci -q get xlite.main.update_via)
          	if command -v curl > /dev/null; then
          		if [ "$via" != proxy ] && curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"; then return 0; fi
          		[ "${port:-0}" -gt 0 ] 2>/dev/null && pidof xray > /dev/null && curl -fsSL --retry 2 --connect-timeout 15 --socks5-hostname 127.0.0.1:$port -o "$2" "$1" && return 0
          		[ "$via" = proxy ] && curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"
          	else wget -q -O "$2" "$1"; fi
          }

          do_update() {
          	local tmp
          	[ -n "$REPO" ] || { echo "update source unknown (reinstall with the install command)"; return 1; }
          	tmp=$(mktemp -d /tmp/xlite-up.XXXXXX) || return 1
          	if ! fetch "https://github.com/$REPO/releases/download/${TAG:-xlite}/install.sh" "$tmp/install.sh"; then
          		rm -rf "$tmp"; echo "download failed (no internet?)"; return 1
          	fi
          	XLITE_UPDATE=1 sh "$tmp/install.sh"
          	local rc=$?
          	rm -rf "$tmp"
          	return $rc
          }

          do_uninstall() {
          	/etc/init.d/xlite stop 2>/dev/null
          	/etc/init.d/xlite disable 2>/dev/null
          	rules_down
          	# the DNS cache settings XLite changed in /etc/config/dhcp go back to what they were
          	r=1
          	dhcp_opt cachesize '' && r=0
          	dhcp_opt min_cache_ttl '' && r=0
          	[ $r = 0 ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	if uci -q get network.xlwg > /dev/null; then
          		for s in xlwg xlwg_peer xlwg_rule xlwg_rule6 xlwg_route xlwg_route6; do uci -q delete network.$s; done
          		uci -q delete firewall.xlwg_zone; uci -q delete firewall.xlwg_fwd
          		uci commit network; uci commit firewall
          		ubus call network reload; /etc/init.d/firewall reload > /dev/null 2>&1
          	fi
          	for f in $(cat $SHARE/files 2>/dev/null); do rm -f "$f"; done
          	rm -rf $SHARE /usr/share/ucode/xlite /www/luci-static/resources/view/xlite $RUN /tmp/xlite-core $TMPD
          	rm -f /etc/init.d/xlite /usr/bin/xlite /etc/hotplug.d/iface/90-xlite /usr/share/rpcd/ucode/xlite.uc \
          		/usr/share/rpcd/acl.d/luci-app-xlite.json /usr/share/luci/menu.d/luci-app-xlite.json
          	rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
          	/etc/init.d/rpcd reload 2>/dev/null
          	if [ -x /etc/init.d/v2raya ]; then
          		uci -q set v2raya.config.enabled=1 && uci -q commit v2raya
          		/etc/init.d/v2raya enable && /etc/init.d/v2raya start
          		echo "v2rayA is running again"
          	fi
          	echo "XLite removed (settings kept in /etc/config/xlite; delete it by hand if you want)"
          }

          case "$1" in
          prepare)
          	rm -rf $RUN && mkdir -p $RUN $TMPD
          	ad=$(uci -q get xlite.main.adblock)
          	if [ "$ad" = local ] || [ "$ad" = both ]; then [ -s $TMPD/adblock.conf ] || adblock_list > /dev/null 2>&1; fi
          	mode=$(uci -q get xlite.main.transparent)
          	rmode=$(uci -q get xlite.main.rule_mode); rmode=${rmode:-gfwlist}
          	[ "$mode" = same ] && mode=$rmode
          	rp="$(uci -q get xlite.main.socks_rule_port)$(uci -q get xlite.main.http_rule_port)"
          	case "$mode $rmode" in *gfwlist*) [ "$mode" = gfwlist ] || [ -n "${rp#0}" ] && [ ! -s /etc/xlite/gfw.txt ] && lists gfw > /dev/null 2>&1 ;; esac
          	case "$mode $rmode" in *except_cn*) [ "$mode" = except_cn ] || [ -n "${rp#0}" ] && [ ! -s /etc/xlite/cn4.txt ] && lists cn > /dev/null 2>&1 ;; esac
          	$UC build $RUN || exit 1
          	if [ "$(state '@.netchg')" = true ]; then
          		# the WireGuard interface of the second server was added, changed or removed
          		ubus call network reload 2>/dev/null
          		/etc/init.d/firewall reload > /dev/null 2>&1
          	elif [ "$(state '@.second.kernel')" = true ]; then
          		# only when it is down: an ifup of a running interface restarts it (and cuts the tunnel)
          		[ "$(ubus call network.interface.xlwg status 2>/dev/null | jsonfilter -e '@.up' 2>/dev/null)" = true ] || ifup xlwg 2>/dev/null
          	fi
          	exit 0
          	;;
          dns_on) dns_on ;;
          adblock) adblock_list ;;
          dns_off) dns_off ;;
          wg_deps) wg_deps ;;
          usb_deps) usb_deps ;;
          bond_deps) bond_deps ;;
          bond_route) bond_route "$2" ;;
          exitip) exit_ip "$2" ;;
          sub) subs "${2:-all}" ;;
          lists) lists "$2" ;;
          rules_up) rules_up ;;
          rules_when_ready) rules_when_ready ;;
          rules_down) rules_down ;;
          sysctl) sysctl_apply ;;
          stop_v2raya) stop_v2raya ;;
          core) core_path ;;
          refresh_ips)
          	# an interface got a new address: refresh the set of the router's own addresses
          	nft list table inet xlite > /dev/null 2>&1 || exit 0
          	nft flush set inet xlite local_ips 2>/dev/null
          	for a in $(ip -4 -o addr show | sed -n 's/.* inet \([0-9.]*\)\/.*/\1/p'); do nft add element inet xlite local_ips "{ $a }" 2>/dev/null; done
          	if nft list set inet xlite local_ips6 > /dev/null 2>&1; then
          		nft flush set inet xlite local_ips6
          		for a in $(ip -6 -o addr show | sed -n 's/.* inet6 \([0-9a-fA-F:]*\)\/.*/\1/p'); do nft add element inet xlite local_ips6 "{ $a }" 2>/dev/null; done
          	fi
          	;;
          start|stop|restart|reload|enable|disable) /etc/init.d/xlite "$1" ;;
          status)
          	echo "version: ${VERSION:-?}"
          	if pidof xray > /dev/null && nft list table inet xlite > /dev/null 2>&1; then echo "state:   running"; else echo "state:   stopped"; fi
          	[ -s $RUN/state.json ] && echo "server:  $(jsonfilter -i $RUN/state.json -e '@.name')"
          	[ -n "$(state '@.second.name')" ] && echo "second:  $(state '@.second.name') ($(state '@.second.protocol'), kernel: $(state '@.second.kernel'))"
          	echo "core:    $(core_path 2>/dev/null || echo missing)"
          	c=$(core_path 2>/dev/null) && grep -aq 'VLESS downlink splice' "$c" && echo "zero-copy: built in"
          	;;
          add) $UC add ;;
          ping) ping_server "$2" ;;
          update) do_update ;;
          uninstall) do_uninstall ;;
          *) sed -n '2,9p' "$0" | sed 's/^# \{0,1\}//'; exit 1 ;;
          esac
          XLITE_FILE_2
          chmod 755 "src/usr/bin/xlite"
          mkdir -p "$(dirname "src/usr/share/luci/menu.d/luci-app-xlite.json")"
          cat > "src/usr/share/luci/menu.d/luci-app-xlite.json" <<'XLITE_FILE_3'
          {
          	"admin/services/xlite": {
          		"title": "XLite",
          		"order": 5,
          		"action": { "type": "view", "path": "xlite/app" },
          		"depends": { "acl": [ "luci-app-xlite" ] }
          	}
          }
          XLITE_FILE_3
          mkdir -p "$(dirname "src/usr/share/rpcd/acl.d/luci-app-xlite.json")"
          cat > "src/usr/share/rpcd/acl.d/luci-app-xlite.json" <<'XLITE_FILE_4'
          {
          	"luci-app-xlite": {
          		"description": "XLite proxy",
          		"read": {
          			"ubus": {
          				"xlite": [
          					"status",
          					"servers",
          					"settings",
          					"ping",
          					"link",
          					"update_state",
          					"log",
          					"geo",
          					"exitip",
          					"task_state",
          					"lists_info",
          					"routinga_check",
          					"subs",
          					"devices",
          					"apps",
          					"lan_devices",
          					"ports",
          					"bond_status",
          					"bond_calibrate_result",
          					"wifi_radios",
          					"usb_status",
          					"wifi_scan",
          					"wifi_scan_result",
          					"bond_scan",
          					"bond_scan_result",
          					"diagnose",
          					"backup",
          					"r2apps"
          				]
          			},
          			"uci": [
          				"xlite"
          			]
          		},
          		"write": {
          			"ubus": {
          				"xlite": [
          					"add",
          					"remove",
          					"rename",
          					"edit",
          					"select",
          					"connect",
          					"set_settings",
          					"update",
          					"second",
          					"wg_deps",
          					"usb_deps",
          					"bond_deps",
          					"lists",
          					"sub_add",
          					"sub_update",
          					"sub_remove",
          					"device_name",
          					"usage_reset",
          					"iso_set",
          					"learn_start",
          					"learn_stop",
          					"learn_save",
          					"learn_clear",
          					"block_device",
          					"bot_test",
          					"adblock_update",
          					"restore",
          					"uninstall",
          					"r2app_set",
          					"device_route",
          					"port_wan",
          					"bond_set",
          					"bond_calibrate",
          					"wifi_connect",
          					"wifi_set",
          					"bond_test"
          				]
          			},
          			"uci": [
          				"xlite"
          			]
          		}
          	}
          }
          XLITE_FILE_4
          mkdir -p "$(dirname "src/usr/share/rpcd/ucode/xlite.uc")"
          cat > "src/usr/share/rpcd/ucode/xlite.uc" <<'XLITE_FILE_5'
          // XLite backend for LuCI (ubus object "xlite")
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';
          import * as lib from 'xlite.lib';

          const RUN = '/var/etc/xlite';
          const TMP = '/tmp/xlite';
          const KEEP = '/etc/xlite';
          const SHARE = getenv('XLITE_SHARE') ?? '/usr/share/xlite';
          const B = [ '0', '1' ];
          function num(lo, hi) { return [ 'num', lo, hi ]; }
          // every option LuCI may change, with what it may hold
          const SETTINGS = {
          	// v2rayA
          	transparent: [ 'off', 'all', 'gfwlist', 'except_cn', 'routinga', 'same' ], rule_mode: [ 'gfwlist', 'except_cn', 'routinga' ],
          	impl: [ 'tproxy', 'redirect' ], antipollution: [ 'none', 'hijack', 'forward', 'doh' ], special: [ 'off', 'supervisor', 'fakedns' ],
          	tfo: [ 'default', 'on', 'off' ], mux: B, mux_conc: num(1, 128), sniffing: [ 'off', 'http_tls', 'http_tls_quic' ],
          	sub_auto: B, sub_auto_mode: [ 'interval', 'boot' ], sub_interval: num(1, 168), gfw_auto: [ 'off', 'boot', 'daily', 'weekly' ],
          	update_via: [ 'direct', 'proxy' ], ip_forward: B, port_sharing: B, loglevel: [ 'warning', 'info', 'debug', 'error', 'none' ],
          	// ports
          	tproxy_port: num(1024, 65535), socks_port: num(0, 65535), http_port: num(0, 65535), socks_rule_port: num(0, 65535), http_rule_port: num(0, 65535),
          	// second server
          	r2: B, r2_iq: B, r2_fallback: [ 'main', 'direct', 'none' ], r2_kernel: B, speedtest_main: B, r2_probe_interval: num(10, 300),
          	r2_probe: /^https?:\/\/[A-Za-z0-9.:\/_?=&%-]{1,200}$/, r2_speed_ports: (v) => lib.ports_ok(v),
          	// DNS and speed
          	dns: [ 'proxy', 'direct' ], dns_cache: B, dns_cache_size: num(150, 50000),
          	dns_upstream: (v) => length(v) <= 120 && !length(filter(split(v, /[ ,]+/), (x) => x != '' && !lib.ip4_ok(x) && !lib.ip6_ok(x))),
          	dns_stale: B, dns_min_ttl: num(0, 3600), block_quic: B, smart_mux: B,
          	// line bonding
          	bond: B, bond_ifaces: /^[A-Za-z0-9_ -]{0,120}$/, bond_mode: [ 'rr', 'fast', 'backup' ], bond_auto: B, bond_alert: B, bond_autocal: B,
          	// ads
          	adblock: [ 'off', 'adguard', 'local', 'both' ], adblock_size: [ 'small', 'medium', 'large' ], adblock_allow: /^[A-Za-z0-9. -]*$/,
          	// isolation
          	iso_calls: B, iso_sniff: B, learn_minutes: num(1, 30),
          	// core
          	splice: B, gomaxprocs: num(0, 8), gogc: num(50, 1000), early_exit: B, tcp_cc: [ '', 'cubic', 'bbr' ], ipv6: [ 'auto', '0', '1' ], nofile: num(1024, 65535),
          	// devices
          	save_minutes: num(5, 240), billing_day: num(1, 28), hide_idle: B,
          	// Telegram
          	bot_enabled: B, bot_token: /^([0-9]{5,15}:[A-Za-z0-9_-]{20,60})?$/, bot_chat: /^-?[0-9]{0,20}$/, bot_alert_down: B, bot_alert_newdev: B,
          	bot_report_time: /^([01][0-9]|2[0-3]):[0-5][0-9]$/,
          	// tool and page
          	auto_update: B, ui_theme: [ 'dark', 'light', 'auto' ], ui_motion: [ 'full', 'light', 'off' ], ui_refresh: [ '1', '2', '5' ], ui_lang: [ 'ar', 'en' ]
          };
          // changing these needs no restart of the core (the page or the monitor reads them)
          const NO_RESTART = { ui_theme: 1, ui_motion: 1, ui_refresh: 1, ui_lang: 1, hide_idle: 1, save_minutes: 1, learn_minutes: 1, bot_alert_down: 1,
          	bot_alert_newdev: 1, bot_report_time: 1, auto_update: 1, gfw_auto: 1, sub_auto: 1, sub_auto_mode: 1, sub_interval: 1, update_via: 1, adblock_size: 1, adblock_allow: 1 };

          function valid(rule, val) {
          	if (type(rule) == 'function')
          		return !!rule(val);
          	if (type(rule) == 'array' && rule[0] == 'num')
          		return match(val, /^[0-9]{1,5}$/) && +val >= rule[1] && +val <= rule[2];
          	if (type(rule) == 'array')
          		return index(rule, val) >= 0;
          	return !!match(val, rule);
          }

          let splice_cache = {};
          let geo_saved = 0;

          // the page asks for status every 2 s: what it would learn by starting processes (ubus, nft, xlite core)
          // is remembered for a few seconds instead (restart_bg / stop_bg forget it at once)
          let sc = { pid: null, pid_t: -100, core: null, core_t: -100, rules: false, rules_t: -100 };

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function uci() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('xlite');
          	return c;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function writejson(path, v) {
          	fs.mkdir(TMP);
          	fs.writefile(path, sprintf('%J', v));
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          let apps_cache = null;

          function apps_data() {
          	let st = fs.stat(SHARE + '/data/apps.json'), key = st ? st.size + ':' + st.mtime : '';
          	if (!apps_cache || apps_cache.key != key)
          		apps_cache = { key, d: readjson(SHARE + '/data/apps.json') ?? { apps: [], iraq_domains: [] } };
          	return apps_cache.d;
          }

          // a settings change: a reload rebuilds the config, and only what changed restarts (see the init script)
          // line bonding: the router's ports and the bonded lines
          function net_cursor() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('network'); c.load('xlite');
          	return c;
          }

          function is_usb(dev) {
          	return index(fs.readlink('/sys/class/net/' + dev + '/device') ?? '', 'usb') >= 0;
          }

          function carrier(dev) {
          	return trim(fs.readfile('/sys/class/net/' + dev + '/carrier') ?? '0') == '1';
          }

          // LAN ports of br-lan (DSA), the WAN ports, and USB modems; "xw_<port>" = made a line here
          function port_list(c) {
          	let r = [], seen = {}, br = null, iface_of = {};
          	c.foreach('network', 'device', (s) => { if (s.name == 'br-lan') br = s; });
          	c.foreach('network', 'interface', (s) => { if (s.device && s['.name'] != 'loopback') iface_of[s.device] = s['.name']; });
          	for (let p in br?.ports ?? []) {
          		seen[p] = 1;
          		push(r, { port: p, kind: is_usb(p) ? 'usb' : 'lan', role: 'lan', up: carrier(p) });
          	}
          	for (let dev, i in iface_of) {
          		if (seen[dev] || i == 'lan')
          			continue;
          		// a USB line whose phone or modem is unplugged now: still shown (it comes back by itself when plugged in)
          		if (!fs.stat('/sys/class/net/' + dev)) {
          			if (match(i, /^xw_/) && match(dev, /^(usb|wwan|eth[2-9])/)) {
          				seen[dev] = 1;
          				push(r, { port: dev, kind: 'usb', role: 'wan', iface: i, line: i, mine: true, up: false, usb: true, gone: true });
          			}
          			continue;
          		}
          		let usb = is_usb(dev);
          		if (i == 'wan' || i == 'wwan' || match(i, /^xw_/) || usb) {
          			seen[dev] = 1;
          			push(r, { port: dev, kind: usb ? 'usb' : (match(i, /^xw_/) ? 'lan' : 'wan'), role: 'wan', iface: i, line: i, mine: !!match(i, /^xw_/), up: carrier(dev), usb });
          		}
          	}
          	// a device that already carries an interface of its own (a 5G/4G modem: its config names a sysfs path, not
          	// the device) is that line: never offered as a free port (a second, DHCP interface on it breaks the modem)
          	let dump = null;
          	try { dump = json(sh('ubus call network.interface dump 2>/dev/null') || 'null'); } catch (e) {}
          	for (let i in dump?.interface ?? []) {
          		let dev = i.l3_device;
          		if (!dev || seen[dev] || match(i.interface, /^(xw_|loopback$|lan)/) || !fs.stat('/sys/class/net/' + dev))
          			continue;
          		let dr = false;
          		for (let r in i.route ?? []) if (r.target == '0.0.0.0' && r.mask == 0) dr = true;
          		if (!dr && !match(i.proto ?? '', /^(qmi|mbim|modemmanager|ncm|3g|wwan|qcm)/))
          			continue;
          		seen[dev] = 1;
          		push(r, { port: dev, kind: 'wan', role: 'wan', iface: i.interface, line: i.interface, mine: false, up: !!i.up, modem: !!match(i.proto ?? '', /^(qmi|mbim|modemmanager|ncm|3g|wwan|qcm)/) });
          	}
          	// a USB modem nobody configured yet
          	for (let dev in fs.lsdir('/sys/class/net') ?? [])
          		if (!seen[dev] && is_usb(dev))
          			push(r, { port: dev, kind: 'usb', role: 'free', usb: true, up: carrier(dev) });
          	// the router has USB but nothing is a network on it yet (empty, or a phone with no driver): the slot is shown
          	// so the page can say what to plug in and install the drivers
          	let has_usb = false;
          	for (let e in fs.lsdir('/sys/bus/usb/devices') ?? []) if (match(e, /^usb[0-9]+$/)) has_usb = true;
          	if (has_usb && !length(filter(r, (x) => x.kind == 'usb')))
          		push(r, { port: 'USB', kind: 'usb', role: 'slot', usb: true, up: false });
          	return { ports: r, dsa: !!br };
          }

          function pairs(s) {
          	let r = {};
          	for (let w in split(s ?? '', /[ ,]+/)) { let m = match(w, /^([A-Za-z0-9_-]+):([0-9]+)$/); if (m) r[m[1]] = +m[2]; }
          	return r;
          }

          function words2(s) {
          	return filter(split(s ?? '', /[ ,]+/), (x) => x != '');
          }

          // a Wi-Fi line set by hand is not the guard's any more (see /usr/share/xlite/wifiguard.uc)
          // what bonding needs on the router: ip-full ("ip rule ... oif", busybox's ip has no oif), and for the speed
          // caps tc with the tbf scheduler and the policer. Looked up once a minute
          let bond_tools_c = { t: 0, v: null };
          function bond_tools() {
          	if (bond_tools_c.v && time() - bond_tools_c.t < 60)
          		return bond_tools_c.v;
          	let kver = trim(sh('uname -r 2>/dev/null'));
          	let kmod = (m) => !!fs.stat('/sys/module/' + m) || !!fs.stat('/lib/modules/' + kver + '/' + m + '.ko');
          	let log = fs.readfile(TMP + '/bonddeps.log');
          	let v = { ipfull: index(sh('ip -V 2>&1'), 'iproute2') >= 0, tc: !!(fs.stat('/usr/sbin/tc') || fs.stat('/sbin/tc') || fs.stat('/usr/bin/tc')),
          		tbf: kmod('sch_tbf'), police: kmod('act_police'), installing: log != null && !match(log, /rc=[0-9]/) };
          	bond_tools_c = { t: v.installing ? 0 : time(), v };
          	return v;
          }

          function parked_list() { return words2(fs.readfile('/etc/xlite/wifi_parked')); }
          function unpark(c, sec) {
          	let l = filter(parked_list(), (x) => x != sec);
          	if (length(l) == length(parked_list())) return;
          	if (length(l)) fs.writefile('/etc/xlite/wifi_parked', join(' ', l) + '\n');
          	else fs.unlink('/etc/xlite/wifi_parked');
          }

          function line_addr(m, i) {
          	for (let w in words2(m.bond_addr)) { let x = match(w, /^([A-Za-z0-9_-]+):([0-9.]+)$/); if (x && x[1] == i) return x[2]; }
          	return '';
          }

          // Cloudflare's edge ranges: a server behind it answers on any of them, and each line may reach some faster
          const CF_NETS = [ '104.16', '104.17', '104.18', '104.19', '104.20', '104.21', '104.24', '104.25', '104.26', '104.27', '172.64', '172.65', '172.66', '172.67', '162.159', '188.114.96', '188.114.97', '188.114.98', '188.114.99', '141.101.64', '108.162.192', '190.93.240', '198.41.192' ];
          function is_cf(ip) {
          	for (let n in CF_NETS) if (index(ip ?? '', n + '.') == 0) return true;
          	return false;
          }

          // the router's main line is not always "wan": a 5G/4G router (AW1000 and the like) gets its internet from a
          // modem interface ("5g", "wwan", "5g_4"...). The one holding the default route with the lowest metric is it.
          function main_line() {
          	let d = null, best = null;
          	try { d = json(sh('ubus call network.interface dump 2>/dev/null') || 'null'); } catch (e) {}
          	for (let i in d?.interface ?? []) {
          		if (!i.up || !i.l3_device || match(i.interface, /^(xw_|loopback$|lan)/))
          			continue;
          		for (let r in i.route ?? [])
          			if (r.target == '0.0.0.0' && r.mask == 0 && (!best || (i.metric ?? 0) < best.metric))
          				best = { iface: i.interface, dev: i.l3_device, metric: i.metric ?? 0, proto: i.proto };
          	}
          	return best;
          }

          // "wan" in the bonded lines means the main line: when the interface called wan is missing or down and the
          // internet comes from another one, that one takes its place
          function bond_ifaces_resolved(list, ml) {
          	let wj = null;
          	if (index(list, 'wan') < 0 || !ml || index(list, ml.iface) >= 0)
          		return list;
          	try { wj = json(sh('ubus call network.interface.wan status 2>/dev/null') || 'null'); } catch (e) {}
          	// wan up and holding a default route is the main line itself; up without one (a cable to another LAN while
          	// the internet comes from the modem) is not
          	let wr = false;
          	for (let r in wj?.route ?? []) if (r.target == '0.0.0.0' && r.mask == 0) wr = true;
          	if (wj?.up && wr)
          		return list;
          	return map(list, (x) => x == 'wan' ? ml.iface : x);
          }

          function line_label(iface, dev, kind, ml) {
          	if (iface == 'wan' || (ml && iface == ml.iface)) return 'الخط الأساسي';
          	if (kind == 'usb') return 'مودم USB';
          	if (kind == 'wifi') return 'واي فاي';
          	return 'خط منفذ ' + dev;
          }

          function restart_bg() {
          	sc.pid_t = -100; sc.rules_t = -100; sc.core_t = -100;
          	system('( /etc/init.d/xlite reload > /dev/null 2>&1 & )');
          }

          function stop_bg() {
          	sc.pid_t = -100; sc.rules_t = -100;
          	system('( /etc/init.d/xlite stop > /dev/null 2>&1 & )');
          }

          function core_pid() {
          	let j = null;
          	try { j = json(sh("ubus call service list '{\"name\":\"xlite\"}' 2>/dev/null")); } catch (e) {}
          	return j?.xlite?.instances?.xray?.running ? j.xlite.instances.xray.pid : null;
          }

          function core_pid_cached(now) {
          	if (sc.pid) {
          		let cl = fs.readfile('/proc/' + sc.pid + '/cmdline') ?? '';
          		if (index(cl, '/var/etc/xlite/config.json') >= 0)
          			return sc.pid;
          		sc.pid = null;
          	}
          	if (now - sc.pid_t < 3)
          		return null;
          	sc.pid_t = now;
          	sc.pid = core_pid();
          	return sc.pid;
          }

          function core_cached(now) {
          	if (sc.core != null && now - sc.core_t < (sc.core == '' ? 10 : 60) && (sc.core == '' || fs.stat(sc.core)))
          		return sc.core;
          	sc.core = trim(sh('/usr/bin/xlite core 2>/dev/null'));
          	sc.core_t = now;
          	return sc.core;
          }

          function rules_up(now) {
          	if (now - sc.rules_t < 5)
          		return sc.rules;
          	sc.rules = (system('nft -t list table inet xlite > /dev/null 2>&1') == 0 || system('nft list table inet xlite > /dev/null 2>&1') == 0);
          	sc.rules_t = now;
          	return sc.rules;
          }

          function first_num(s) {
          	let m = match(s ?? '', /([0-9]+)/);
          	return m ? +m[1] : null;
          }

          function cpu_counters() {
          	let r = [];
          	for (let l in split(fs.readfile('/proc/stat') ?? '', '\n')) {
          		let m = match(l, /^cpu([0-9]+) +(.*)$/);
          		if (!m)
          			continue;
          		let v = map(split(m[2], / +/), (x) => +x);
          		let idle = v[3] + (v[4] ?? 0), total = 0;
          		for (let x in v)
          			total += x;
          		push(r, [ total - idle, total ]);
          	}
          	return r;
          }

          function net_counters(dev) {
          	let base = '/sys/class/net/' + replace(dev ?? '', /[^A-Za-z0-9._@-]/g, '') + '/statistics/';
          	return { rx: +(trim(fs.readfile(base + 'rx_bytes') ?? '0')), tx: +(trim(fs.readfile(base + 'tx_bytes') ?? '0')) };
          }

          // the router's traffic to the internet: every line that carries it (the main line, a 5G modem, each bonded
          // line), by its own device only (pppoe-wan, not eth1 under it: that would count twice). The list is kept
          // for 10 s: one ubus call, not one per page refresh
          let idevs = { t: 0, devs: [] };
          function inet_devs(st) {
          	let now = time();
          	if (now - idevs.t < 10 && length(idevs.devs))
          		return idevs.devs;
          	let d = null, out = [], wz = st?.wan ?? [];
          	try { d = json(sh('ubus call network.interface dump 2>/dev/null') || 'null'); } catch (e) {}
          	for (let i in d?.interface ?? []) {
          		let dev = i.l3_device;
          		if (!i.up || !dev || index(out, dev) >= 0 || match(i.interface, /^(loopback$|lan)/) || i.proto == 'wireguard' || match(dev, /^(xlwg|br-lan|lo$)/))
          			continue;
          		let dr = false;
          		for (let r in i.route ?? []) if (r.target == '0.0.0.0' && r.mask == 0) dr = true;
          		if (dr || index(wz, dev) >= 0)
          			push(out, dev);
          	}
          	for (let l in st?.bond ?? []) if (l.dev && index(out, l.dev) < 0) push(out, l.dev);
          	if (!length(out)) out = [ wz[0] ?? 'wan' ];
          	idevs = { t: now, devs: out };
          	return out;
          }

          function net_sum(devs) {
          	let t = { rx: 0, tx: 0 };
          	for (let d in devs) { let c = net_counters(d); t.rx += c.rx; t.tx += c.tx; }
          	return t;
          }

          function splice_built(path) {
          	let st = fs.stat(path);
          	if (!st)
          		return false;
          	let key = path + ':' + st.size + ':' + st.mtime;
          	if (splice_cache[key] == null)
          		splice_cache[key] = (trim(sh("grep -aq 'VLESS downlink splice' '" + replace(path, /'/g, '') + "' && echo y")) == 'y');
          	return splice_cache[key];
          }

          function release() {
          	let r = {};
          	for (let l in split(fs.readfile('/usr/share/xlite/release') ?? '', '\n')) {
          		let m = match(l, /^([A-Z]+)=(.*)$/);
          		if (m)
          			r[lc(m[1])] = m[2];
          	}
          	return r;
          }

          function server_list(c, cur) {
          	let r = [], cur2 = c.get('xlite', 'main', 'server2'), r2 = c.get('xlite', 'main', 'r2') == '1';
          	c.foreach('xlite', 'server', (s) => {
          		let p = lib.parse_link(s.link);
          		push(r, {
          			id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '', valid: !p.error, error: p.error, current: s['.name'] == cur,
          			second: r2 && s['.name'] == cur2, host: p.address ?? '', port: p.port ?? '', sub: s.sub ?? ''
          		});
          	});
          	return r;
          }

          function status_server(c, cur) {
          	let r = null;
          	c.foreach('xlite', 'server', (s) => {
          		if (s['.name'] != cur)
          			return;
          		let p = lib.parse_link(s.link);
          		r = { id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '' };
          	});
          	return r;
          }

          function count_servers(c) {
          	let n = 0;
          	c.foreach('xlite', 'server', () => { n++; });
          	return n;
          }

          // country of an address (ip-api.com, cached: in RAM and in /etc/xlite/geo.json)
          function resolve1(host) {
          	if (match(host, /^[0-9.]+$/) || index(host, ':') >= 0)
          		return host;
          	for (let dns in [ '', ' 1.1.1.1' ]) {
          		let out = sh('{ command -v timeout > /dev/null 2>&1 && T="timeout 3"; $T nslookup ' + shq(host) + dns + ' 2>/dev/null; }'), seen = false;
          		for (let l in split(out, '\n')) {
          			if (match(l, /^Name:/)) seen = true;
          			else if (seen) {
          				let m = match(l, /([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          				// 198.18.0.0/15: a FakeDNS answer of the core, not the real address
          				if (m && !match(m[1], /^198\.1[89]\./)) return m[1];
          			}
          		}
          	}
          	return null;
          }

          function geo_lookup(hosts) {
          	let cache = readjson(TMP + '/geo.json') ?? readjson(KEEP + '/geo.json') ?? {};
          	// names are looked up again after a day (their address may have moved)
          	if (time() - (cache['@t'] ?? 0) > 86400) {
          		for (let k in keys(cache))
          			if (!match(k, /^[0-9.]+$/) && index(k, ':') < 0) delete cache[k];
          		cache['@t'] = time();
          	}
          	let r = {}, ask = [], ipof = {}, miss = readjson(TMP + '/geo-miss.json') ?? {}, missed = false;
          	for (let h in hosts) {
          		if (type(h) != 'string' || h == '' || length(h) > 255)
          			continue;
          		if (cache[h]) { r[h] = cache[h]; continue; }
          		if (miss[h] && time() - miss[h] < 1800) continue;
          		let ip = resolve1(h);
          		if (!ip) { miss[h] = time(); missed = true; continue; }
          		ipof[h] = ip;
          		if (cache[ip]) { r[h] = cache[ip]; cache[h] = cache[ip]; continue; }
          		push(ask, ip);
          	}
          	if (missed) writejson(TMP + '/geo-miss.json', miss);
          	if (length(ask)) {
          		let f = TMP + '/geo-q.json';
          		writejson(f, map(slice(ask, 0, 100), (ip) => ({ query: ip, fields: 'countryCode,query' })));
          		let port = +(uci().get('xlite', 'main', 'socks_port') ?? 0);
          		let via = (port > 0 && system('nft list table inet xlite > /dev/null 2>&1') == 0) ? ` --socks5-hostname 127.0.0.1:${port}` : '';
          		let out = sh(`curl -s -m 6${via} -X POST --data @${f} http://ip-api.com/batch 2>/dev/null`);
          		if (out == '' && via != '')
          			out = sh(`curl -s -m 6 -X POST --data @${f} http://ip-api.com/batch 2>/dev/null`);
          		let j = null;
          		try { j = json(out); } catch (e) {}
          		for (let x in (type(j) == 'array' ? j : []))
          			if (x?.query && match(x.countryCode ?? '', /^[A-Z]{2}$/))
          				cache[x.query] = x.countryCode;
          		for (let h, ip in ipof)
          			if (cache[ip]) { r[h] = cache[ip]; cache[h] = cache[ip]; }
          		writejson(TMP + '/geo.json', cache);
          		// flash: addresses only (the country of a name follows its address), at most once an hour
          		if (time() - geo_saved > 3600) {
          			geo_saved = time();
          			let keep = {};
          			for (let k, v in cache)
          				if (match(k, /^[0-9.]+$/) || index(k, ':') >= 0) keep[k] = v;
          			fs.mkdir(KEEP);
          			writejson(KEEP + '/geo.json', keep);
          		}
          	}
          	return r;
          }

          function bg(cmd, log) {
          	fs.mkdir(TMP);
          	system(`( ${cmd} > ${log} 2>&1; echo "rc=$?" >> ${log} ) > /dev/null 2>&1 &`);
          }

          function learn_log_off() {
          	let c = uci();
          	if (c.get('xlite', 'main', 'learn_log') == '1') {
          		c.set('xlite', 'main', 'learn_log', '0');
          		c.save('xlite'); c.commit('xlite');
          		if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          	}
          }

          function c_names() {
          	let r = {};
          	uci().foreach('xlite', 'device', (s) => { if (s.id) r[s.id] = s.name; });
          	return r;
          }

          const methods = {
          	status: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {};
          			let st = null;
          			try { st = json(fs.readfile(RUN + '/state.json') ?? 'null'); } catch (e) {}
          			let now0 = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          			let pid = core_pid_cached(now0), up = null, mem = null, core = core_cached(now0);
          			if (pid) {
          				let stat = fs.readfile('/proc/' + pid + '/stat') ?? '';
          				let f = split(substr(stat, rindex(stat, ')') + 2), ' ');
          				let uptime = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          				up = int(uptime - (+f[19]) / 100);
          				mem = first_num(match(fs.readfile('/proc/' + pid + '/status') ?? '', /VmRSS:[^\n]*/)?.[0]);
          			}
          			let rules = rules_up(now0);
          			let wan = st?.wan?.[0] ?? 'wan';
          			let srv = status_server(c, opt.server);
          			let mi = {};
          			for (let l in split(fs.readfile('/proc/meminfo') ?? '', '\n')) {
          				let m = match(l, /^(MemTotal|MemAvailable): +([0-9]+)/);
          				if (m) mi[m[1]] = +m[2];
          			}
          			return {
          				enabled: opt.enabled == '1', running: !!pid, rules, uptime: up, core_rss_kb: mem,
          				server: srv ? { id: srv.id, name: srv.name, protocol: srv.protocol, net: srv.net, header: srv.header, security: srv.security } : null,
          				core: core, core_splice: core ? splice_built(core) : false, splice_on: opt.splice != '0',
          				wan, net: net_sum(inet_devs(st)), net_devs: inet_devs(st), cpu: cpu_counters(), now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0],
          				mem_total_kb: mi.MemTotal, mem_avail_kb: mi.MemAvailable,
          				v2raya: !!fs.stat('/etc/init.d/v2raya'), release: release(), servers: count_servers(c),
          				ip: st?.ip, protocol: st?.protocol, second: st?.second, warnings: st?.warnings ?? [],
          				r2: opt.r2 == '1', mon: readjson(TMP + '/mon.json')
          			};
          		}
          	},

          	servers: {
          		call: function() {
          			let c = uci();
          			return { servers: server_list(c, c.get('xlite', 'main', 'server')) };
          		}
          	},

          	add: {
          		args: { links: '' },
          		call: function(req) {
          			let c = uci(), report = [], first = null;
          			for (let l in split(req.args?.links ?? '', /[\r\n ]+/)) {
          				l = trim(l);
          				if (l == '')
          					continue;
          				let p = lib.parse_link(l);
          				if (p.error) {
          					push(report, { ok: false, error: p.error });
          					continue;
          				}
          				let dup = null, key = replace(p.link, /#.*$/, '');
          				c.foreach('xlite', 'server', (s) => { if (replace(s.link ?? '', /#.*$/, '') == key) dup = s['.name']; });
          				if (dup) {
          					push(report, { ok: true, dup: true, name: p.name });
          					continue;
          				}
          				let id = c.add('xlite', 'server');
          				c.set('xlite', id, 'name', p.name);
          				c.set('xlite', id, 'link', p.link);
          				first ??= id;
          				push(report, { ok: true, name: p.name, id });
          			}
          			let restart = false;
          			if (first && !c.get('xlite', 'main', 'server')) {
          				c.set('xlite', 'main', 'server', first);
          				restart = (c.get('xlite', 'main', 'enabled') == '1');
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart)
          				restart_bg();
          			return { report };
          		}
          	},

          	remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.delete('xlite', id);
          			let cur = c.get('xlite', 'main', 'server'), restart = false;
          			if (cur == id) {
          				let next = null;
          				c.foreach('xlite', 'server', (s) => { next ??= s['.name']; });
          				if (next)
          					c.set('xlite', 'main', 'server', next);
          				else
          					c.delete('xlite', 'main', 'server');
          				restart = true;
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	rename: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, name = trim(req.args?.name ?? '');
          			if (c.get('xlite', id) != 'server' || name == '' || length(name) > 64)
          				return { ok: false };
          			c.set('xlite', id, 'name', name);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	link: {
          		args: { id: '' },
