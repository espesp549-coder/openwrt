          	},

          	// --- subscriptions --------------------------------------------------------------------
          	subs: {
          		call: function() {
          			let c = uci(), r = [];
          			c.foreach('xlite', 'subscription', (s) => push(r, { id: s['.name'], name: s.name ?? '', url: s.url ?? '',
          				updated: +(s.updated ?? 0), count: +(s.count ?? 0) }));
          			return { subs: r };
          		}
          	},

          	sub_add: {
          		args: { name: '', url: '' },
          		call: function(req) {
          			let url = trim(req.args?.url ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(url, /^https?:\/\/[^ '"]+$/) || length(url) > 2000)
          				return { ok: false, error: 'الرابط لازم يبدي بـ http:// أو https://' };
          			let c = uci(), id = c.add('xlite', 'subscription');
          			c.set('xlite', id, 'name', name != '' ? substr(name, 0, 64) : 'اشتراك');
          			c.set('xlite', id, 'url', url);
          			c.save('xlite');
          			c.commit('xlite');
          			bg('/usr/bin/xlite sub ' + id, TMP + '/sub.log');
          			return { ok: true, id };
          		}
          	},

          	sub_update: {
          		args: { id: 'all' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? 'all', /[^A-Za-z0-9_]/g, '');
          			bg('/usr/bin/xlite sub ' + (id || 'all'), TMP + '/sub.log');
          			return { ok: true };
          		}
          	},

          	sub_remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (c.get('xlite', id) != 'subscription')
          				return { ok: false };
          			let sel = c.get('xlite', 'main', 'server'), sel2 = c.get('xlite', 'main', 'server2'), kept = 0;
          			let del = [];
          			c.foreach('xlite', 'server', (s) => { if (s.sub == id) push(del, s['.name']); });
          			for (let s in del) {
          				if (s == sel || s == sel2) { c.delete('xlite', s, 'sub'); kept++; }
          				else c.delete('xlite', s);
          			}
          			c.delete('xlite', id);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true, kept };
          		}
          	},

          	// --- devices --------------------------------------------------------------------------
          	devices: {
          		call: function() {
          			let u = readjson(TMP + '/usage.json') ?? readjson(KEEP + '/usage.json') ?? { devs: {} };
          			let mon = readjson(TMP + '/mon.json') ?? {};
          			let rate = {};
          			for (let d in mon.devs ?? []) rate[d.id] = d.rate;
          			let r = [];
          			for (let k, d in u.devs ?? {})
          				push(r, { id: k, ip: d.ip, name: d.name, seen: d.seen, days: d.days ?? {}, months: d.months ?? {}, rate: rate[k] ?? [ 0, 0 ] });
          			let names = c_names(), routes = {};
          			uci().foreach('xlite', 'device', (s) => { if (s.id && s.route) routes[s.id] = s.route; });
          			for (let d in r) {
          				if (names[d.id]) d.alias = names[d.id];
          				d.route = routes[d.id] ?? 'vpn';
          			}
          			let blocked = filter(split(uci().get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '');
          			return { devices: r, running: !!mon.t && time() - mon.t < 30, blocked };
          		}
          	},

          	device_name: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(id, /^[0-9a-f:.]+$/))
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (name == '') c.delete('xlite', sid);
          			else {
          				c.set('xlite', sid, 'device');
          				c.set('xlite', sid, 'id', id);
          				c.set('xlite', sid, 'name', substr(name, 0, 40));
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	usage_reset: {
          		call: function() {
          			for (let f in [ TMP + '/usage.json', KEEP + '/usage.json' ])
          				fs.unlink(f);
          			// the monitor clears its totals at its next cycle (no restart, the internet stays up)
          			writejson(TMP + '/usage.reset', true);
          			return { ok: true };
          		}
          	},

          	// --- isolation ------------------------------------------------------------------------
          	apps: {
          		call: function() {
          			let c = uci(), d = apps_data(), mon = readjson(TMP + '/mon.json') ?? {}, u = readjson(TMP + '/usage.json') ?? {};
          			let st = readjson(RUN + '/state.json') ?? {};
          			let ln = readjson(TMP + '/learn.json');
          			let r = [];
          			for (let a in d.apps) {
          				let sec = c.get_all('xlite', a.id) ?? {};
          				let learned = sec.learned ?? [];
          				if (type(learned) != 'array') learned = split(learned, ' ');
          				push(r, { id: a.id, name: a.name, group: a.group, letter: a.letter, color: a.color, learn: a.learn,
          					isolate: sec.isolate == '1', active: index(st.iso ?? [], a.id) >= 0,
          					domains: length(a.domains), ips: length(a.ip4 ?? []) + length(a.ip6 ?? []), learned,
          					rate: mon.apps?.[a.id]?.rate ?? 0, days: u.apps?.[a.id]?.days ?? {},
          					learning: !!(ln && ln.app == a.id && !ln.done),
          					pct: (ln && ln.app == a.id) ? +(ln.pct ?? 0) : +(sec.learn_pct ?? (length(learned) ? 100 : 0)) });
          			}
          			return { apps: r, learn: readjson(TMP + '/learn.json') };
          		}
          	},

          	iso_set: {
          		args: { id: '', on: false },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (!length(filter(apps_data().apps, (a) => a.id == id)))
          				return { ok: false };
          			if (c.get('xlite', id) != 'app')
          				c.set('xlite', id, 'app');
          			c.set('xlite', id, 'isolate', req.args?.on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	learn_start: {
          		args: { app: '', ip: '', minutes: 5 },
          		call: function(req) {
          			let app = req.args?.app ?? '', ip = req.args?.ip ?? '';
          			let c0 = uci(), kind = (c0.get('xlite', app) == 'r2app') ? 'r2' : 'iso';
          			if ((kind == 'iso' && !length(filter(apps_data().apps, (a) => a.id == app))) || !match(ip, /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/))
          				return { ok: false };
          			// Iraqi apps are learned by name too: the core logs the sniffed names while learning
          			if (kind == 'r2') {
          				c0.set('xlite', 'main', 'learn_log', '1');
          				c0.save('xlite'); c0.commit('xlite');
          				if (c0.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			}
          			let m = +(req.args?.minutes ?? 0) || +(uci().get('xlite', 'main', 'learn_minutes') ?? 10);
          			if (m < 1 || m > 30) m = 10;
          			writejson(TMP + '/learn.json', { app, ip, kind, start: time(), until: time() + m * 60, nets: {}, names: {} });
          			return { ok: true };
          		}
          	},

          	learn_stop: {
          		call: function() {
          			let l = readjson(TMP + '/learn.json');
          			if (l) { l.until = time() - 1; l.done = true; writejson(TMP + '/learn.json', l); }
          			learn_log_off();
          			return { ok: true };
          		}
          	},

          	learn_save: {
          		args: { app: '', nets: [], names: [] },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) == 'r2app') {
          				let ips = c.get('xlite', app, 'ip') ?? [], doms = c.get('xlite', app, 'domain') ?? [];
          				if (type(ips) != 'array') ips = split(ips, ' ');
          				if (type(doms) != 'array') doms = split(doms, ' ');
          				for (let n in req.args?.nets ?? [])
          					if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(ips, n) < 0) push(ips, n);
          				for (let d in req.args?.names ?? [])
          					if (match(d, /^[a-z0-9.-]{3,200}$/) && index(doms, d) < 0) push(doms, d);
          				c.set('xlite', app, 'ip', ips);
          				c.set('xlite', app, 'domain', doms);
          				let ln = readjson(TMP + '/learn.json');
          				if (ln && ln.app == app) c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          				c.set('xlite', app, 'on', '1');
          				c.save('xlite'); c.commit('xlite');
          				fs.unlink(TMP + '/learn.json');
          				learn_log_off();
          				if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          				return { ok: true, count: length(ips) + length(doms) };
          			}
          			if (!length(filter(apps_data().apps, (a) => a.id == app)))
          				return { ok: false };
          			let cur = c.get('xlite', app, 'learned') ?? [];
          			if (type(cur) != 'array') cur = split(cur, ' ');
          			for (let n in req.args?.nets ?? [])
          				if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(cur, n) < 0)
          					push(cur, n);
          			if (c.get('xlite', app) != 'app')
          				c.set('xlite', app, 'app');
          			c.set('xlite', app, 'learned', cur);
          			let ln = readjson(TMP + '/learn.json');
          			if (ln && ln.app == app)
          				c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          			c.save('xlite');
          			c.commit('xlite');
          			fs.unlink(TMP + '/learn.json');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true, count: length(cur) };
          		}
          	},

          	learn_clear: {
          		args: { app: '' },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) != 'app')
          				return { ok: false };
          			c.delete('xlite', app, 'learned');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	// --- Iraqi apps (through the second server) and the route of each device -----------------
          	r2apps: {
          		call: function() {
          			let c = uci(), r = [], ln = readjson(TMP + '/learn.json');
          			let n = 0;
          			c.foreach('xlite', 'r2app', () => n++);
          			if (!n) {
          				// first look: the usual Iraqi apps, empty (they are learned on the phone)
          				for (let p in [ [ 'cinemana', 'سينمانا' ], [ 'ayniq', 'عين العراق' ], [ 'capp', 'تطبيق C' ] ]) {
          					c.set('xlite', p[0], 'r2app'); c.set('xlite', p[0], 'name', p[1]); c.set('xlite', p[0], 'on', '0');
          				}
          				c.save('xlite'); c.commit('xlite');
          			}
          			c.foreach('xlite', 'r2app', (a) => {
          				let d = a.domain ?? [], ip = a.ip ?? [];
          				if (type(d) != 'array') d = split(d, ' ');
          				if (type(ip) != 'array') ip = split(ip, ' ');
          				push(r, { id: a['.name'], name: a.name ?? a['.name'], on: a.on == '1', domains: d, ips: ip,
          					learning: !!(ln && ln.app == a['.name'] && !ln.done),
          					pct: (ln && ln.app == a['.name']) ? +(ln.pct ?? 0) : +(a.learn_pct ?? ((length(d) + length(ip)) ? 100 : 0)) });
          			});
          			return { apps: r, learn: (ln && ln.kind == 'r2') ? ln : null };
          		}
          	},

          	r2app_set: {
          		args: { id: '', on: false, name: '', remove: false, domains: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (id == '') {
          				let name = trim(req.args?.name ?? '');
          				if (name == '' || length(name) > 40) return { ok: false };
          				id = c.add('xlite', 'r2app');
          				c.set('xlite', id, 'name', name);
          				c.set('xlite', id, 'on', '0');
          			}
          			else if (c.get('xlite', id) != 'r2app')
          				return { ok: false };
          			else if (req.args?.remove)
          				c.delete('xlite', id);
          			else {
          				if (req.args?.on != null) c.set('xlite', id, 'on', req.args.on ? '1' : '0');
          				if (req.args?.domains != null && req.args.domains != '') {
          					let l = filter(split(lc(req.args.domains), /[\s,]+/), (x) => match(x, /^[a-z0-9.-]{3,200}$/));
          					c.set('xlite', id, 'domain', l);
          				}
          			}
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true, id };
          		}
          	},

          	device_route: {
          		args: { id: '', route: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), route = req.args?.route ?? 'vpn';
          			if (!match(id, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/) || index([ 'vpn', 'warp', 'direct' ], route) < 0)
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (c.get('xlite', sid) != 'device') { c.set('xlite', sid, 'device'); c.set('xlite', sid, 'id', id); }
          			if (route == 'vpn') c.delete('xlite', sid, 'route'); else c.set('xlite', sid, 'route', route);
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	block_device: {
          		args: { mac: '', on: false },
          		call: function(req) {
          			let c = uci(), mac = lc(req.args?.mac ?? ''), on = !!req.args?.on;
          			if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          				return { ok: false };
          			let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          			if (on) push(l, mac);
          			c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          			c.save('xlite');
          			c.commit('xlite');
          			system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          			return { ok: true, blocked: l };
          		}
          	},

          	bot_test: {
          		call: function() {
          			let c = uci(), tok = c.get('xlite', 'main', 'bot_token'), chat = c.get('xlite', 'main', 'bot_chat');
          			if (!tok || !chat)
          				return { ok: false, error: chat ? 'حط التوكن' : 'افتح البوت بتلجرام واكتب /start أول' };
          			let f = TMP + '/bot-test.json';
          			writejson(f, { chat_id: chat, text: '✅ رسالة تجربة من XLite' });
          			let socks = +(c.get('xlite', 'main', 'socks_port') ?? 0);
          			let url = "'https://api.telegram.org/bot" + replace(tok, /[^0-9A-Za-z:_-]/g, '') + "/sendMessage'";
          			let out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${socks > 0 ? '--socks5-hostname 127.0.0.1:' + socks : ''} ${url} 2>/dev/null`);
          			if (!match(out, /"ok":true/))
          				out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${url} 2>/dev/null`);
          			fs.unlink(f);
          			return { ok: !!match(out, /"ok":true/) };
          		}
          	},

          	adblock_update: {
          		call: function() {
          			bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			return { ok: true };
          		}
          	},

          	// backup: the whole /etc/config/xlite (servers, subscriptions, settings, apps, device names)
          	backup: {
          		call: function() {
          			return { name: 'xlite-backup.conf', text: fs.readfile(getenv('XLITE_UCI_DIR') ? getenv('XLITE_UCI_DIR') + '/xlite' : '/etc/config/xlite') ?? '' };
          		}
          	},

          	restore: {
          		args: { text: '' },
          		call: function(req) {
          			let t = req.args?.text ?? '';
          			// only an XLite config: uci syntax, a main section, nothing else on a line
          			if (length(t) > 512000 || !match(t, /config xlite 'main'/))
          				return { ok: false, error: 'هذا مو ملف نسخة احتياطية من XLite' };
          			for (let l in split(t, '\n'))
          				if (!match(l, /^(\s*|\s*(config|option|list) .*|\s*#.*)$/))
          					return { ok: false, error: 'الملف بيه أسطر غريبة' };
          			let tmp = '/tmp/xlite-restore.conf';
          			fs.writefile(tmp, t);
          			let chk = system('uci -q -c /tmp import xlite-check < ' + tmp + ' > /dev/null 2>&1');
          			fs.unlink('/tmp/xlite-check');
          			if (chk != 0) {
          				fs.unlink(tmp);
          				return { ok: false, error: 'الملف خربان' };
          			}
          			system('cp /etc/config/xlite /etc/xlite/config.before-restore 2>/dev/null; mkdir -p /etc/xlite; cp ' + tmp + ' /etc/config/xlite; rm -f ' + tmp);
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	uninstall: {
          		call: function() {
          			bg('sleep 2; /usr/bin/xlite uninstall', '/tmp/xlite-uninstall.log');
          			return { ok: true };
          		}
          	},

          	ports: {
          		call: function() {
          			return port_list(net_cursor());
          		}
          	},

          	// the bonding page: every bonded line (address, gateway, counters, ping through it) and the ports
          	bond_status: {
          		call: function() {
          			let c = net_cursor(), m = c.get_all('xlite', 'main') ?? {};
          			let paused = words2(m.bond_paused), limits = pairs(m.bond_limits), probe = readjson(TMP + '/bond.json') ?? {}, calib = {};
          			// the last line measurement (Mb/s each), for the expected speed test total on the page
          			for (let l in split(fs.readfile(TMP + '/calib.txt') ?? '', '\n')) { let x = match(trim(l), /^([A-Za-z0-9_-]+) ([0-9.]+)/); if (x) calib[x[1]] = int(+x[2] * 8 / 1e5) / 10; }
          			let lines = [];
          			let ml = main_line();
          			for (let i in bond_ifaces_resolved(words2(m.bond_ifaces), ml)) {
          				let j = null;
          				try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          				let dev = j?.l3_device ?? j?.device ?? c.get('network', i, 'device') ?? i, gw = null;
          				for (let r in j?.route ?? [])
          					if (r.target == '0.0.0.0' && r.mask == 0 && r.nexthop != '0.0.0.0') gw = r.nexthop;
          				let kind = (ml && i == ml.iface) ? 'wan' : is_usb(dev) ? 'usb' : fs.stat('/sys/class/net/' + dev + '/phy80211') ? 'wifi' : (match(i, /^xw_/) ? 'lan' : 'wan');
          				let base = '/sys/class/net/' + dev + '/statistics/', pr = probe[i];
          				let state = (index(paused, i) >= 0) ? 'paused' : (!j?.up || pr?.ok === false) ? 'down' : 'active';
          				push(lines, { iface: i, dev, kind, label: line_label(i, dev, kind, ml), state, ip: j?.['ipv4-address']?.[0]?.address ?? '', gw: gw ?? '',
          					ping: pr?.ok ? pr.ms : null, loss: pr?.loss, mbps: calib[i], weight: pairs(m.bond_weights)[i] ?? 1, addr: line_addr(m, i), rx: +trim(fs.readfile(base + 'rx_bytes') ?? '0'), tx: +trim(fs.readfile(base + 'tx_bytes') ?? '0'), limit: limits[i] ?? 0 });
          			}
          			let p = port_list(c);
          			let st0 = readjson(RUN + '/state.json') ?? {};
          			let lab = {}; for (let x in lines) lab[x.iface] = x.label;
          			let evs = map(readjson(TMP + '/bond_events.json') ?? [], (e) => ({ ...e, label: lab[e.iface] ?? e.iface }));
          			return { tools: bond_tools(), events: evs, cf: is_cf(st0.ip), server_ip: st0.ip ?? '', autocal: m.bond_autocal != '0', on: m.bond == '1', mode: m.bond_mode || 'rr', auto: m.bond_auto != '0', alert: m.bond_alert != '0', lines, ports: p.ports, dsa: p.dsa,
          				now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0] };
          		}
          	},

          	// one change from the bonding page: on/off, mode, a line paused, a line's speed cap, the switches
          	bond_set: {
          		args: { key: '', iface: '', value: '' },
          		call: function(req) {
          			let k = req.args?.key ?? '', i = req.args?.iface ?? '', v = '' + (req.args?.value ?? '');
          			let c = uci();
          			if (i != '' && !match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			if (k == 'on' || k == 'auto' || k == 'alert' || k == 'autocal') {
          				if (v != '0' && v != '1') return { ok: false };
          				c.set('xlite', 'main', k == 'on' ? 'bond' : 'bond_' + k, v);
          			}
          			else if (k == 'mode') {
          				if (index([ 'rr', 'fast', 'backup' ], v) < 0) return { ok: false };
          				c.set('xlite', 'main', 'bond_mode', v);
          			}
          			else if (k == 'pause') {
          				let l = filter(words2(c.get('xlite', 'main', 'bond_paused')), (x) => x != i);
          				if (v == '1') push(l, i);
          				c.set('xlite', 'main', 'bond_paused', join(' ', l));
          			}
          			else if (k == 'addr') {
          				if (v != '' && !match(v, /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/)) return { ok: false };
          				let l = {}, out = [];
          				for (let w in words2(c.get('xlite', 'main', 'bond_addr'))) { let mm = match(w, /^([A-Za-z0-9_-]+):(.+)$/); if (mm) l[mm[1]] = mm[2]; }
          				if (v == '') delete l[i]; else l[i] = v;
          				for (let n2, a in l) push(out, n2 + ':' + a);
          				c.set('xlite', 'main', 'bond_addr', join(' ', out));
          			}
          			else if (k == 'weights') {
          				let out = [];
          				for (let w in words2(v)) { let mm = match(w, /^([A-Za-z0-9_-]{1,15}):([1-8])$/); if (!mm) return { ok: false }; if (+mm[2] > 1) push(out, w); }
          				c.set('xlite', 'main', 'bond_weights', join(' ', out));
          			}
          			else if (k == 'weight') {
          				if (!match(v, /^[1-8]$/)) return { ok: false };
          				let l = pairs(c.get('xlite', 'main', 'bond_weights')), out = [];
          				l[i] = +v;
          				for (let n2, w in l) if (w > 1) push(out, n2 + ':' + w);
          				c.set('xlite', 'main', 'bond_weights', join(' ', out));
          			}
          			else if (k == 'limit') {
          				if (!match(v, /^[0-9]{1,4}$/)) return { ok: false };
          				let l = pairs(c.get('xlite', 'main', 'bond_limits')), out = [];
          				l[i] = +v;
          				for (let n, mb in l) if (mb > 0) push(out, n + ':' + mb);
          				c.set('xlite', 'main', 'bond_limits', join(' ', out));
          			}
          			else
          				return { ok: false };
          			c.save('xlite'); c.commit('xlite');
          			// the alert switch is read by the monitor; everything else rebuilds the core
          			if (k != 'alert' && k != 'autocal' && c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	// Wi-Fi as a line: the router's radio joins another network (client mode) and that becomes a bonded line
          	wifi_radios: {
          		call: function() {
          			let c = net_cursor(), st = null, r = [];
          			c.load('wireless');
          			try { st = json(sh('ubus call network.wireless status 2>/dev/null')); } catch (e) {}
          			c.foreach('wireless', 'wifi-device', (d) => {
          				let name = d['.name'], s = st?.[name] ?? {}, sta = c.get_all('wireless', 'xw_' + name);
          				let band = d.band ?? (match(d.hwmode ?? '', /a/) ? '5g' : '2g');
          				let ap = null;
          				for (let i in s.interfaces ?? []) if (i.config?.mode == 'ap' && i.ifname) { ap = i; break; }
          				let line = null;
          				if (sta) {
          					let j = null, dev = null;
          					for (let i in s.interfaces ?? []) if (i.section == 'xw_' + name) dev = i.ifname;
          					try { j = json(sh('ubus call network.interface.xw_' + name + ' status 2>/dev/null')); } catch (e) {}
          					// parked: the guard turned it off because the network is gone (it turns it on when the network is back)
          					let parked = index(parked_list(), 'xw_' + name) >= 0;
          					line = { ssid: sta.ssid, on: sta.disabled != '1' || parked, parked, up: !!j?.up, dev, ip: j?.['ipv4-address']?.[0]?.address ?? '' };
          				}
          				push(r, { radio: name, band, channel: d.channel ?? 'auto', up: !!s.up, ap: ap ? ap.config?.ssid : null, line });
          			});
          			return { radios: r };
          		}
          	},

          	// a scan can take 10 s or more, and rpcd answers one call at a time: it runs in the background (the whole
          	// page froze while it waited), the page asks for the result
          	wifi_scan: {
          		args: { radio: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/))
          				return { ok: false };
          			let st = null, ifn = null;
          			try { st = json(sh('ubus call network.wireless status 2>/dev/null')); } catch (e) {}
          			for (let i in st?.[rd]?.interfaces ?? []) if (i.ifname) { ifn = i.ifname; break; }
          			if (!ifn)
          				return { ok: false, error: 'الراديو مطفي أو ما بيه شبكة شغالة: شغّله من إعدادات الواي فاي أول' };
          			if (!match(ifn, /^[A-Za-z0-9._-]{1,15}$/))
          				return { ok: false };
          			let f = TMP + '/scan-' + rd + '.json';
          			fs.mkdir(TMP);
          			fs.unlink(f);
          			system(`( { command -v timeout > /dev/null 2>&1 && T="timeout 25"; $T ubus -t 25 call iwinfo scan '{"device":"${ifn}"}' > ${f}.tmp 2>/dev/null; } ; mv -f ${f}.tmp ${f} ) > /dev/null 2>&1 &`);
          			return { ok: true, pending: true };
          		}
          	},

          	wifi_scan_result: {
          		args: { radio: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/))
          				return { ok: false };
          			let t = fs.readfile(TMP + '/scan-' + rd + '.json');
          			if (t == null)
          				return { ok: true, pending: true };
          			let j = null;
          			try { j = json(t); } catch (e) {}
          			if (!j?.results)
          				return { ok: false, error: 'الراديو ما رجّع نتيجة: جرب مرة ثانية' };
          			let seen = {}, out = [];
          			for (let n in j.results) {
          				if (!n.ssid || seen[n.ssid] && seen[n.ssid].signal >= n.signal)
          					continue;
          				let e = n.encryption ?? {}, a = e.authentication ?? [], enc = 'none';
          				if (e.enabled) enc = (index(a, 'sae') >= 0) ? (index(a, 'psk') >= 0 ? 'sae-mixed' : 'sae') : (length(e.wpa ?? []) > 1 ? 'psk-mixed' : (index(e.wpa ?? [], 1) >= 0 && length(e.wpa) == 1 ? 'psk' : 'psk2'));
          				seen[n.ssid] = { ssid: n.ssid, bssid: n.bssid, signal: n.signal, quality: n.quality, max: n.quality_max, channel: n.channel, enc };
          			}
          			for (let k, v in seen) push(out, v);
          			out = sort(out, (x, y) => (y.signal ?? -100) - (x.signal ?? -100));
          			return { ok: true, nets: out };
          		}
          	},

          	wifi_connect: {
          		args: { radio: '', ssid: '', key: '', enc: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '', ssid = req.args?.ssid ?? '', key = req.args?.key ?? '', enc = req.args?.enc ?? 'psk2';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/) || length(ssid) < 1 || length(ssid) > 32 || index([ 'none', 'psk', 'psk2', 'psk-mixed', 'sae', 'sae-mixed' ], enc) < 0)
          				return { ok: false, error: 'بيانات غير صحيحة' };
          			if (enc != 'none' && (length(key) < 8 || length(key) > 63))
          				return { ok: false, error: 'الباسورد لازم من 8 إلى 63 حرف' };
          			let c = net_cursor(), iface = 'xw_' + rd, sec = 'xw_' + rd, wz = null;
          			c.load('wireless'); c.load('firewall');
          			if (c.get('wireless', rd) != 'wifi-device')
          				return { ok: false, error: 'ماكو هيج راديو' };
          			c.foreach('firewall', 'zone', (s) => { if (s.name == 'wan') wz = s['.name']; });
          			if (!wz)
          				return { ok: false, error: 'ماكو زون wan بالفايروول' };
          			c.set('wireless', sec, 'wifi-iface');
          			for (let k, v in { device: rd, mode: 'sta', network: iface, ssid, encryption: enc, disabled: '0' }) c.set('wireless', sec, k, v);
          			if (enc == 'none') c.delete('wireless', sec, 'key'); else c.set('wireless', sec, 'key', key);
          			c.set('network', iface, 'interface');
          			c.set('network', iface, 'proto', 'dhcp');
          			let n = 0;
          			c.foreach('network', 'interface', (s) => { if (match(s['.name'], /^xw_/)) n++; });
          			if (!c.get('network', iface, 'metric')) c.set('network', iface, 'metric', '' + (10 + n));
          			let nets = c.get('firewall', wz, 'network') ?? [];
          			if (type(nets) != 'array') nets = split(nets, ' ');
          			if (index(nets, iface) < 0) push(nets, iface);
          			c.set('firewall', wz, 'network', nets);
          			let bond = words2(c.get('xlite', 'main', 'bond_ifaces'));
          			if (!length(bond)) push(bond, main_line()?.iface ?? 'wan');
          			if (index(bond, iface) < 0) push(bond, iface);
          			c.set('xlite', 'main', 'bond_ifaces', join(' ', bond));
          			c.set('xlite', 'main', 'bond', '1');
          			unpark(c, sec);
          			for (let k in [ 'wireless', 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			// the service starts the Wi-Fi guard too (XLite on or off)
          			system('( sleep 1; /etc/init.d/network reload; wifi reload; /etc/init.d/firewall reload; if [ "$(uci -q get xlite.main.enabled)" = 1 ]; then /etc/init.d/xlite restart; else /etc/init.d/xlite start; fi ) > /dev/null 2>&1 &');
