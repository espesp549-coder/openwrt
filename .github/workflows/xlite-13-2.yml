name: XLite release

# Builds XLite (the light v2rayA replacement) and publishes it as the release "xlite" of this repo.
# On any OpenWrt 22.03+ router:  wget -O- https://github.com/<this repo>/releases/download/xlite/install.sh | sh
# Every file of the tool is inside this workflow: the repo needs nothing else.

on:
  workflow_dispatch:
    inputs:
      zero_copy:
        description: 'Core with the zero-copy download for VLESS over TCP (patch 900): tested on the runner first, left out by itself if a test fails'
        type: boolean
        default: true

permissions:
  contents: write

env:
  XRAY_VERSION: 25.1.30
  XRAY_HASH: 983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e
  GO_VERSION: 1.23.12
  RELEASE_TAG: xlite
  LIBUBOX_REV: da2d205a5cf3e877c45a2eec488218cbaf452e7d
  UCI_REV: 74f6277aabffc943d026f406df57c22595134c42
  UCODE_REV: 3f64c8089bf3ea4847c96b91df09fbfcaec19e1d   # the ucode of OpenWrt 24.10

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: "1. XLite files"
        run: |
          mkdir -p out
          echo "# XLite build $GITHUB_RUN_NUMBER" > out/summary.md
          mkdir -p "$(dirname "src/etc/hotplug.d/iface/90-xlite")"
          cat > "src/etc/hotplug.d/iface/90-xlite" <<'XLITE_FILE_0'
          # XLite: keep the set of the router's own addresses current (they never go through the proxy),
          # and start XLite again when the line comes up after a boot or a drop (it may have started too early)
          case "$ACTION" in
          ifup|ifupdate)
          	[ -x /usr/bin/xlite ] || exit 0
          	/usr/bin/xlite refresh_ips
          	[ "$ACTION" = ifup ] || exit 0
          	[ "$(uci -q get xlite.main.enabled)" = 1 ] || exit 0
          	[ "$(uci -q get xlite.main.transparent)" = off ] && exit 0
          	nft list table inet xlite > /dev/null 2>&1 && exit 0
          	# one restart per 30 s, whatever number of interfaces come up together
          	l=/tmp/xlite-hotplug.lock
          	[ -f $l ] && [ $(( $(date +%s) - $(date -r $l +%s 2>/dev/null || echo 0) )) -lt 30 ] && exit 0
          	touch $l
          	logger -t xlite "$INTERFACE is up and XLite was not routing: starting it again"
          	( /etc/init.d/xlite restart > /dev/null 2>&1 & )
          	;;
          esac
          XLITE_FILE_0
          mkdir -p "$(dirname "src/etc/init.d/xlite")"
          cat > "src/etc/init.d/xlite" <<'XLITE_FILE_1'
          #!/bin/sh /etc/rc.common
          # XLite: transparent proxy (xray core + nftables tproxy)
          START=99
          STOP=10
          USE_PROCD=1

          bot_instance() {
          	procd_open_instance bot
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/bot.uc
          	procd_set_param respawn 3600 15 0
          	procd_set_param stderr 1
          	procd_close_instance
          }

          start_service() {
          	local enabled core kv
          	config_load xlite
          	config_get_bool enabled main enabled 0
          	config_get_bool bot main bot_enabled 0
          	if [ "$enabled" != 1 ]; then
          		/usr/bin/xlite rules_down
          		# the Telegram bot stays reachable while XLite is off (so /on works)
          		[ "$bot" = 1 ] && bot_instance
          		return 0
          	fi
          	/usr/bin/xlite stop_v2raya
          	if ! /usr/bin/xlite prepare; then
          		logger -t xlite "not started: no valid server (add one in LuCI: Services > XLite)"
          		return 1
          	fi
          	if ! core=$(/usr/bin/xlite core); then
          		logger -t xlite "not started: the core (xray) is missing, run: xlite update"
          		return 1
          	fi
          	/usr/bin/xlite sysctl
          	procd_open_instance xray
          	procd_set_param command "$core" run -c /var/etc/xlite/config.json
          	procd_set_param env XRAY_LOCATION_ASSET=/usr/share/xray
          	for kv in $(cat /var/etc/xlite/env); do
          		[ -n "${kv#*=}" ] && procd_append_param env "$kv"
          	done
          	local nofile; config_get nofile main nofile 65535
          	procd_set_param limits nofile="$nofile $nofile"
          	procd_set_param respawn 3600 5 0
          	procd_set_param stdout 1
          	procd_set_param stderr 1
          	procd_close_instance
          	# device usage, WireGuard health, learning mode, subscription updates
          	procd_open_instance monitor
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/monitor.uc
          	procd_set_param respawn 3600 10 0
          	procd_set_param stderr 1
          	procd_close_instance
          	[ "$bot" = 1 ] && bot_instance
          	( /usr/bin/xlite rules_when_ready > /dev/null 2>&1 & )
          }

          stop_service() {
          	/usr/bin/xlite rules_down
          	# keep today's device totals (the monitor writes them to flash every 30 minutes)
          	[ -s /tmp/xlite/usage.json ] && mkdir -p /etc/xlite && cp /tmp/xlite/usage.json /etc/xlite/usage.json
          }

          reload_service() {
          	stop
          	start
          }

          service_triggers() {
          	procd_add_reload_trigger "xlite"
          }
          XLITE_FILE_1
          chmod 755 "src/etc/init.d/xlite"
          mkdir -p "$(dirname "src/usr/bin/xlite")"
          cat > "src/usr/bin/xlite" <<'XLITE_FILE_2'
          #!/bin/sh
          # XLite: a light transparent proxy for OpenWrt (xray core + nftables tproxy), managed from LuCI.
          #   xlite start|stop|restart        the proxy (same as /etc/init.d/xlite ...)
          #   xlite status                    is it running, which server, which core
          #   xlite add                       share links on stdin (vless://, vmess://, trojan://, ss://)
          #   xlite ping <server-id>          TCP connect time to a server in ms (-1 = no answer)
          #   xlite sub <id|all>              update subscriptions
          #   xlite lists [gfw|cn]            download the GFWList / China address list
          #   xlite exitip [1|2]              the public address seen through the main (1) or second (2) server
          #   xlite update                    install the newest version (settings and servers are kept)
          #   xlite uninstall                 remove XLite (v2rayA is enabled again if it is installed)
          SHARE=/usr/share/xlite
          RUN=/var/etc/xlite
          UC="ucode -L /usr/share/ucode $SHARE/gen.uc"
          TABLE=100
          [ -f $SHARE/release ] && . $SHARE/release   # REPO=owner/name TAG=xlite VERSION=...

          log() { logger -t xlite "$*"; }

          core_path() {
          	local c
          	c=$(uci -q get xlite.main.core)
          	[ -n "$c" ] && [ -x "$c" ] && { echo "$c"; return 0; }
          	for c in $SHARE/bin/xray /usr/bin/xray /tmp/xlite-core/xray; do
          		[ -x "$c" ] && { echo "$c"; return 0; }
          	done
          	# small flash: the core is kept compressed and unpacked to RAM at start
          	if [ -s $SHARE/bin/xray.gz ]; then
          		mkdir -p /tmp/xlite-core && gzip -dc $SHARE/bin/xray.gz > /tmp/xlite-core/xray.new && chmod 755 /tmp/xlite-core/xray.new &&
          			mv /tmp/xlite-core/xray.new /tmp/xlite-core/xray && { echo /tmp/xlite-core/xray; return 0; }
          	fi
          	return 1
          }

          TMPD=/tmp/xlite
          DNS_PORT=15353
          SOCKS2_PORT=20179

          pkg_install() {
          	if command -v apk > /dev/null; then apk update > /dev/null 2>&1; apk add "$@"
          	else opkg update > /dev/null 2>&1; opkg install "$@"; fi
          }

          # dnsmasq asks the core (Forward DNS Request / DoH / FakeDNS). Only a runtime file: a reboot or a
          # stop of XLite gives the normal DNS back.
          dns_dirs() {
          	local d
          	for d in /tmp/dnsmasq.d /tmp/dnsmasq.*.d; do [ -d "$d" ] && echo "$d"; done
          }

          dns_on() {
          	local d f main line key changed=
          	[ -s $RUN/dnsmasq.conf ] || { dns_off; return 0; }
          	for d in $(dns_dirs); do
          		# dnsmasq stops (and DHCP with it) on a keyword it already has: leave out what its own config sets
          		main=$(ls /var/etc/dnsmasq.conf.* 2>/dev/null | head -n 1)
          		f=$TMPD/dnsmasq.try; : > $f
          		while IFS= read -r line; do
          			key=${line%%=*}
          			case "$key" in server|conf-file) ;; *) [ -n "$main" ] && grep -q "^$key\(=\|\$\)" "$main" && continue ;; esac
          			echo "$line" >> $f
          		done < $RUN/dnsmasq.conf
          		cmp -s $f "$d/xlite.conf" && continue
          		cp $f "$d/xlite.conf"; changed=1
          		# a last check: the whole dnsmasq config with ours must pass, else ours goes
          		if [ -n "$main" ] && ! dnsmasq --test -C "$main" > $TMPD/dnsmasq.test 2>&1; then
          			logger -t xlite "dnsmasq refused the XLite DNS lines ($(head -n 1 $TMPD/dnsmasq.test)): DNS left as it was"
          			rm -f "$d/xlite.conf"
          		fi
          	done
          	[ -n "$changed" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	return 0
          }

          dns_off() {
          	local d any=
          	for d in $(dns_dirs); do
          		[ -f "$d/xlite.conf" ] && { rm -f "$d/xlite.conf"; any=1; }
          	done
          	[ -n "$any" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	return 0
          }

          # local ad list (dnsmasq format), kept in RAM; size: small | medium | large
          adblock_list() {
          	local size url f
          	size=$(uci -q get xlite.main.adblock_size); size=${size:-small}
          	case "$size" in
          	large) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/pro.txt ;;
          	medium) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/multi.txt ;;
          	*) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/light.txt ;;
          	esac
          	mkdir -p $TMPD; f=$TMPD/adblock.new
          	fetch "$url" "$f" || { rm -f "$f"; echo "download failed"; return 1; }
          	# keep only "local=/name/" lines (the list must not be able to set anything else in dnsmasq)
          	grep -E '^local=/[A-Za-z0-9._-]+/$' "$f" > $TMPD/adblock.conf; rm -f "$f"
          	for w in $(uci -q get xlite.main.adblock_allow); do sed -i "\|^local=/$w/\$|d" $TMPD/adblock.conf; done
          	echo "ads: $(wc -l < $TMPD/adblock.conf) domains"
          }

          state() { jsonfilter -i $RUN/state.json -e "$1" 2>/dev/null; }

          ipv6_rules() { grep -q 'tproxy ip6' $RUN/rules.nft 2>/dev/null; }

          rules_down() {
          	dns_off
          	nft delete table inet xlite 2>/dev/null
          	nft delete table inet xlite_nat 2>/dev/null
          	while ip rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip route flush table $TABLE 2>/dev/null
          	while ip -6 rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip -6 route flush table $TABLE 2>/dev/null
          	return 0
          }

          rules_up() {
          	[ -s $RUN/rules.nft ] || return 0
          	rules_down
          	if ! nft -f $RUN/rules.nft; then
          		log "nft rules failed to load (see: nft -c -f $RUN/rules.nft)"
          		return 1
          	fi
          	if [ -s $RUN/redirect.nft ]; then
          		nft -f $RUN/redirect.nft || { log "redirect rules failed"; rules_down; return 1; }
          	else
          		ip rule add fwmark 0x40/0xc0 table $TABLE
          		ip route add local 0.0.0.0/0 dev lo table $TABLE
          		if ipv6_rules; then
          			ip -6 rule add fwmark 0x40/0xc0 table $TABLE
          			ip -6 route add local ::/0 dev lo table $TABLE
          		fi
          	fi
          	dns_on
          	return 0
          }

          # the kernel WireGuard of the second server needs kmod-wireguard (asked for once, from LuCI)
          wg_deps() {
          	[ -f /lib/netifd/proto/wireguard.sh ] && { [ -d /sys/module/wireguard ] || modprobe wireguard 2>/dev/null; } && [ -d /sys/module/wireguard ] && { echo ok; return 0; }
          	pkg_install kmod-wireguard wireguard-tools > /tmp/xlite-wg.log 2>&1
          	modprobe wireguard 2>/dev/null
          	[ -f /lib/netifd/proto/wireguard.sh ] && [ -d /sys/module/wireguard ] && { /etc/init.d/rpcd reload 2>/dev/null; echo ok; return 0; }
          	echo "failed (see /tmp/xlite-wg.log); the second server works anyway through the core"
          	return 1
          }

          # public address through the main (1) or the second (2) server
          exit_ip() {
          	local ip url=https://api.ipify.org port
          	if [ "${1:-1}" = 2 ]; then
          		if [ "$(state '@.second.kernel')" = true ]; then
          			ip=$(curl -s --noproxy '*' --interface xlwg -m 8 $url 2>/dev/null)
          		else
          			ip=$(curl -s -m 8 --socks5-hostname 127.0.0.1:$SOCKS2_PORT $url 2>/dev/null)
          		fi
          	else
          		port=$(uci -q get xlite.main.socks_port)
          		if [ "${port:-0}" -gt 0 ] 2>/dev/null; then
          			ip=$(curl -s -m 8 --socks5-hostname 127.0.0.1:$port $url 2>/dev/null)
          		else
          			ip=$(curl -s -m 8 $url 2>/dev/null)
          		fi
          	fi
          	case "$ip" in *[!0-9a-fA-F.:]*|'') return 1 ;; esac
          	echo "$ip"
          }

          # subscriptions: plain or base64 lists of share links
          sub_one() {   # $1 = section id
          	local url f port rc
          	url=$(uci -q get xlite."$1".url) || return 1
          	f=$(mktemp /tmp/xlite-sub.XXXXXX)
          	port=$(uci -q get xlite.main.socks_port)
          	# direct first; through the proxy when the direct way is blocked
          	if ! curl -fsSL -m 30 -A 'v2rayA/2' -o "$f" "$url" 2>/dev/null || [ ! -s "$f" ]; then
          		[ "${port:-0}" -gt 0 ] 2>/dev/null && curl -fsSL -m 30 -A 'v2rayA/2' --socks5-hostname 127.0.0.1:$port -o "$f" "$url" 2>/dev/null
          	fi
          	if [ ! -s "$f" ]; then
          		rm -f "$f"; echo '{"ok":false,"error":"download"}'; return 1
          	fi
          	$UC sub_apply "$1" < "$f"; rc=$?
          	rm -f "$f"
          	return $rc
          }

          subs() {   # $1 = id or all
          	local s
          	if [ "$1" = all ]; then
          		for s in $(uci -q show xlite | sed -n "s/^xlite\.\([^.=]*\)=subscription$/\1/p"); do sub_one "$s"; done
          	else
          		sub_one "$1"
          	fi
          }

          # GFWList (for the "gfwlist" mode) and the China address list (for "except China")
          lists() {
          	local w=${1:-all} f
          	mkdir -p /etc/xlite
          	f=$(mktemp /tmp/xlite-list.XXXXXX)
          	if [ "$w" = gfw ] || [ "$w" = all ]; then
          		if fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/gfw.txt "$f" && [ -s "$f" ]; then
          			mv "$f" /etc/xlite/gfw.txt; echo "gfw: $(wc -l < /etc/xlite/gfw.txt)"
          		else echo "gfw: download failed"; fi
          	fi
          	if [ "$w" = cn ] || [ "$w" = all ]; then
          		if fetch https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt "$f" && [ -s "$f" ]; then
          			grep -v : "$f" > /etc/xlite/cn4.txt; echo "cn: $(wc -l < /etc/xlite/cn4.txt)"
          		else echo "cn: download failed"; fi
          	fi
          	rm -f "$f"
          }

          # wait until the core listens, then send the traffic to it
          rules_when_ready() {
          	local port i=0
          	port=$(uci -q get xlite.main.tproxy_port); port=${port:-52345}
          	# at boot the router is busy: the core can need a while (seen: 16 s on the MX2000)
          	while [ $i -lt 480 ]; do
          		if netstat -ltn 2>/dev/null | grep -q "[:.]$port "; then
          			rules_up && log "running"
          			return
          		fi
          		i=$((i + 1)); sleep 0.25
          	done
          	log "the core did not start listening on port $port: rules not applied (logread -e xray)"
          }

          sysctl_apply() {
          	local cc fw
          	cc=$(uci -q get xlite.main.tcp_cc)
          	[ -n "$cc" ] && sysctl -q -w net.ipv4.tcp_congestion_control="$cc" > /dev/null 2>&1
          	fw=$(uci -q get xlite.main.ip_forward)
          	[ "$fw" = 1 ] && sysctl -q -w net.ipv4.ip_forward=1 > /dev/null 2>&1
          	return 0
          }

          stop_v2raya() {
          	[ -x /etc/init.d/v2raya ] || return 0
          	if /etc/init.d/v2raya enabled 2>/dev/null || pidof v2raya > /dev/null; then
          		/etc/init.d/v2raya disable 2>/dev/null
          		uci -q set v2raya.config.enabled=0 && uci -q commit v2raya
          		# its own stop can hang (seen on the MX2000): give it 3 s, then kill
          		( /etc/init.d/v2raya stop > /dev/null 2>&1 & ); sleep 3
          		killall -9 v2raya v2ray xray 2>/dev/null
          		nft delete table inet v2raya 2>/dev/null
          		log "v2rayA stopped and disabled (XLite replaces it)"
          	fi
          	return 0
          }

          ping_server() {   # $1 = server section id
          	local hp host port proto ip uip t
          	hp=$($UC server "$1" 2>/dev/null) || { echo -1; return 1; }
          	set -- $hp; host=$1; port=$2; proto=$3
          	ip=$($UC resolve "$host" 2>/dev/null | head -n 1)
          	[ -n "$ip" ] && [ -n "$port" ] || { echo -1; return 1; }
          	# the ping must not go through the proxy
          	case "$ip" in
          	*:*) nft add element inet xlite bypass6 "{ $ip }" 2>/dev/null; uip="[$ip]" ;;
          	*) nft add element inet xlite bypass4 "{ $ip }" 2>/dev/null; uip=$ip ;;
          	esac
          	if [ "$proto" = wireguard ] || nft list table inet v2raya > /dev/null 2>&1; then
          		# WireGuard is UDP (no TCP connect to time); v2rayA would catch a TCP ping
          		t=$(ping -c 1 -W 2 "$ip" 2>/dev/null | sed -n 's/.*time=\([0-9.]*\) *ms.*/\1/p' | head -n 1)
          		[ -n "$t" ] || { echo -1; return 1; }
          		awk -v t="$t" 'BEGIN { printf "%d\n", t + 0.5 }'
          		return 0
          	fi
          	t=$(curl -s --noproxy '*' -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' "http://$uip:$port/" 2>/dev/null)
          	case "$t" in ''|0|0.000|0.000000) echo -1; return 1 ;; esac
          	awk -v t="$t" 'BEGIN { printf "%d\n", t * 1000 + 0.5 }'
          }

          fetch() {   # $1 = url, $2 = file  (direct; through the core when "update_via" is proxy or direct fails)
          	local port via
          	port=$(uci -q get xlite.main.socks_port); via=$(uci -q get xlite.main.update_via)
          	if command -v curl > /dev/null; then
          		if [ "$via" != proxy ] && curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"; then return 0; fi
          		[ "${port:-0}" -gt 0 ] 2>/dev/null && pidof xray > /dev/null && curl -fsSL --retry 2 --connect-timeout 15 --socks5-hostname 127.0.0.1:$port -o "$2" "$1" && return 0
          		[ "$via" = proxy ] && curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"
          	else wget -q -O "$2" "$1"; fi
          }

          do_update() {
          	local tmp
          	[ -n "$REPO" ] || { echo "update source unknown (reinstall with the install command)"; return 1; }
          	tmp=$(mktemp -d /tmp/xlite-up.XXXXXX) || return 1
          	if ! fetch "https://github.com/$REPO/releases/download/${TAG:-xlite}/install.sh" "$tmp/install.sh"; then
          		rm -rf "$tmp"; echo "download failed (no internet?)"; return 1
          	fi
          	XLITE_UPDATE=1 sh "$tmp/install.sh"
          	local rc=$?
          	rm -rf "$tmp"
          	return $rc
          }

          do_uninstall() {
          	/etc/init.d/xlite stop 2>/dev/null
          	/etc/init.d/xlite disable 2>/dev/null
          	rules_down
          	if uci -q get network.xlwg > /dev/null; then
          		for s in xlwg xlwg_peer xlwg_rule xlwg_rule6 xlwg_route xlwg_route6; do uci -q delete network.$s; done
          		uci -q delete firewall.xlwg_zone; uci -q delete firewall.xlwg_fwd
          		uci commit network; uci commit firewall
          		ubus call network reload; /etc/init.d/firewall reload > /dev/null 2>&1
          	fi
          	for f in $(cat $SHARE/files 2>/dev/null); do rm -f "$f"; done
          	rm -rf $SHARE /usr/share/ucode/xlite /www/luci-static/resources/view/xlite $RUN /tmp/xlite-core $TMPD
          	rm -f /etc/init.d/xlite /usr/bin/xlite /etc/hotplug.d/iface/90-xlite /usr/share/rpcd/ucode/xlite.uc \
          		/usr/share/rpcd/acl.d/luci-app-xlite.json /usr/share/luci/menu.d/luci-app-xlite.json
          	rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
          	/etc/init.d/rpcd reload 2>/dev/null
          	if [ -x /etc/init.d/v2raya ]; then
          		uci -q set v2raya.config.enabled=1 && uci -q commit v2raya
          		/etc/init.d/v2raya enable && /etc/init.d/v2raya start
          		echo "v2rayA is running again"
          	fi
          	echo "XLite removed (settings kept in /etc/config/xlite; delete it by hand if you want)"
          }

          case "$1" in
          prepare)
          	rm -rf $RUN && mkdir -p $RUN $TMPD
          	sed -i '/^export { parse_link, outbound, xray_config, nft_rules, nft_redirect };$/d' /usr/share/ucode/xlite/lib.uc 2>/dev/null
          	ad=$(uci -q get xlite.main.adblock)
          	if [ "$ad" = local ] || [ "$ad" = both ]; then [ -s $TMPD/adblock.conf ] || adblock_list > /dev/null 2>&1; fi
          	mode=$(uci -q get xlite.main.transparent)
          	rmode=$(uci -q get xlite.main.rule_mode); rmode=${rmode:-gfwlist}
          	[ "$mode" = same ] && mode=$rmode
          	rp="$(uci -q get xlite.main.socks_rule_port)$(uci -q get xlite.main.http_rule_port)"
          	case "$mode $rmode" in *gfwlist*) [ "$mode" = gfwlist ] || [ -n "${rp#0}" ] && [ ! -s /etc/xlite/gfw.txt ] && lists gfw > /dev/null 2>&1 ;; esac
          	case "$mode $rmode" in *except_cn*) [ "$mode" = except_cn ] || [ -n "${rp#0}" ] && [ ! -s /etc/xlite/cn4.txt ] && lists cn > /dev/null 2>&1 ;; esac
          	$UC build $RUN || exit 1
          	if [ "$(state '@.netchg')" = true ]; then
          		# the WireGuard interface of the second server was added, changed or removed
          		ubus call network reload 2>/dev/null
          		/etc/init.d/firewall reload > /dev/null 2>&1
          	elif [ "$(state '@.second.kernel')" = true ]; then
          		ifup xlwg 2>/dev/null
          	fi
          	exit 0
          	;;
          dns_on) dns_on ;;
          adblock) adblock_list ;;
          dns_off) dns_off ;;
          wg_deps) wg_deps ;;
          exitip) exit_ip "$2" ;;
          sub) subs "${2:-all}" ;;
          lists) lists "$2" ;;
          rules_up) rules_up ;;
          rules_when_ready) rules_when_ready ;;
          rules_down) rules_down ;;
          sysctl) sysctl_apply ;;
          stop_v2raya) stop_v2raya ;;
          core) core_path ;;
          refresh_ips)
          	# an interface got a new address: refresh the set of the router's own addresses
          	nft list table inet xlite > /dev/null 2>&1 || exit 0
          	nft flush set inet xlite local_ips 2>/dev/null
          	for a in $(ip -4 -o addr show | sed -n 's/.* inet \([0-9.]*\)\/.*/\1/p'); do nft add element inet xlite local_ips "{ $a }" 2>/dev/null; done
          	if nft list set inet xlite local_ips6 > /dev/null 2>&1; then
          		nft flush set inet xlite local_ips6
          		for a in $(ip -6 -o addr show | sed -n 's/.* inet6 \([0-9a-fA-F:]*\)\/.*/\1/p'); do nft add element inet xlite local_ips6 "{ $a }" 2>/dev/null; done
          	fi
          	;;
          start|stop|restart|reload|enable|disable) /etc/init.d/xlite "$1" ;;
          status)
          	echo "version: ${VERSION:-?}"
          	if pidof xray > /dev/null && nft list table inet xlite > /dev/null 2>&1; then echo "state:   running"; else echo "state:   stopped"; fi
          	[ -s $RUN/state.json ] && echo "server:  $(jsonfilter -i $RUN/state.json -e '@.name')"
          	[ -n "$(state '@.second.name')" ] && echo "second:  $(state '@.second.name') ($(state '@.second.protocol'), kernel: $(state '@.second.kernel'))"
          	echo "core:    $(core_path 2>/dev/null || echo missing)"
          	c=$(core_path 2>/dev/null) && grep -aq 'VLESS downlink splice' "$c" && echo "zero-copy: built in"
          	;;
          add) $UC add ;;
          ping) ping_server "$2" ;;
          update) do_update ;;
          uninstall) do_uninstall ;;
          *) sed -n '2,9p' "$0" | sed 's/^# \{0,1\}//'; exit 1 ;;
          esac
          XLITE_FILE_2
          chmod 755 "src/usr/bin/xlite"
          mkdir -p "$(dirname "src/usr/share/luci/menu.d/luci-app-xlite.json")"
          cat > "src/usr/share/luci/menu.d/luci-app-xlite.json" <<'XLITE_FILE_3'
          {
          	"admin/services/xlite": {
          		"title": "XLite",
