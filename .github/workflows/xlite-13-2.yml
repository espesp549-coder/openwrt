          return { xlite: methods };
          XLITE_FILE_5
          mkdir -p "$(dirname "src/usr/share/ucode/xlite/lib.uc")"
          cat > "src/usr/share/ucode/xlite/lib.uc" <<'XLITE_FILE_6'
          // XLite: share links -> xray outbounds, xray config and the nftables tproxy ruleset.
          'use strict';

          const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

          function b64decode(s) {
          	if (s == null)
          		return null;
          	s = replace(replace(trim('' + s), /-/g, '+'), /_/g, '/');
          	s = replace(s, /[^A-Za-z0-9+\/]/g, '');
          	if (type(b64dec) == 'function') {
          		let pad = s;
          		while (length(pad) % 4)
          			pad += '=';
          		let r = b64dec(pad);
          		if (r != null)
          			return r;
          	}
          	let out = '', bits = 0, nb = 0;
          	for (let i = 0; i < length(s); i++) {
          		let v = index(B64, substr(s, i, 1));
          		if (v < 0)
          			return null;
          		bits = ((bits << 6) | v) & 0xffffff;
          		nb += 6;
          		if (nb >= 8) {
          			nb -= 8;
          			out += chr((bits >> nb) & 0xff);
          		}
          	}
          	return out;
          }

          function urldecode(s) {
          	if (s == null)
          		return null;
          	return replace('' + s, /%([0-9A-Fa-f]{2})/g, (m, h) => chr(hex(h)));
          }

          function parse_query(q) {
          	let r = {};
          	for (let kv in split(q ?? '', '&')) {
          		if (kv == '')
          			continue;
          		let i = index(kv, '=');
          		let k = urldecode(i < 0 ? kv : substr(kv, 0, i));
          		r[k] = (i < 0) ? '' : urldecode(substr(kv, i + 1));
          	}
          	return r;
          }

          // scheme://userinfo@host:port?query#fragment  (host may be [v6])
          function parse_url(link) {
          	let m = match(link, /^([A-Za-z0-9+.-]+):\/\/([^#]*)(#(.*))?$/);
          	if (!m)
          		return null;
          	let rest = m[2], frag = urldecode(m[4] ?? '');
          	let q = '', qi = index(rest, '?');
          	if (qi >= 0) {
          		q = substr(rest, qi + 1);
          		rest = substr(rest, 0, qi);
          	}
          	rest = replace(rest, /\/+$/, '');
          	let user = null, at = rindex(rest, '@');
          	if (at >= 0) {
          		user = urldecode(substr(rest, 0, at));
          		rest = substr(rest, at + 1);
          	}
          	let host, port;
          	let hm = match(rest, /^\[([0-9A-Fa-f:.]+)\]:([0-9]+)$/) || match(rest, /^([^:]+):([0-9]+)$/);
          	if (hm) {
          		host = hm[1];
          		port = +hm[2];
          	}
          	else {
          		host = rest;
          		port = null;
          	}
          	return { scheme: lc(m[1]), user, host, port, query: parse_query(q), name: frag };
          }

          function csv(s) {
          	return filter(map(split(s ?? '', ','), (x) => trim(x)), (x) => x != '');
          }

          // One server = the fields of a share link, the same names v2rayA uses.
          function wg_obj(name, host, port, priv, pub, addr, reserved, mtu, psk) {
          	let res = filter(map(split(reserved ?? '', ','), (x) => trim(x)), (x) => x != '');
          	return {
          		protocol: 'wireguard', name: name ?? '', address: host, port: +port, secret: trim(priv), pubkey: trim(pub),
          		local: csv(addr), reserved: length(res) == 3 ? map(res, (x) => +x) : null, mtu: +(mtu || 0) || 1280,
          		psk: trim(psk ?? ''), net: 'udp', security: 'none'
          	};
          }

          // a wg-quick .conf pasted as is
          function wg_conf(text) {
          	let sec = '', i = {}, p = {};
          	for (let l in split(text, /\r?\n/)) {
          		l = trim(replace(l, /#.*$/, ''));
          		let m = match(l, /^\[(.+)\]$/);
          		if (m) { sec = lc(m[1]); continue; }
          		m = match(l, /^([A-Za-z]+) *= *(.+)$/);
          		if (!m) continue;
          		let k = lc(m[1]);
          		if (sec == 'interface') i[k] = (i[k] ? i[k] + ',' : '') + trim(m[2]);
          		else if (sec == 'peer' && p[k] == null) p[k] = trim(m[2]);
          	}
          	let ep = match(p.endpoint ?? '', /^\[(.*)\]:([0-9]+)$/) || match(p.endpoint ?? '', /^([^:]+):([0-9]+)$/);
          	if (!i.privatekey || !p.publickey || !ep)
          		return { error: 'ملف wireguard ناقص (PrivateKey و PublicKey و Endpoint)' };
          	return wg_obj('', ep[1], ep[2], i.privatekey, p.publickey, i.address, '', i.mtu, p.presharedkey);
          }

          function wg_link(s) {
          	let enc = (x) => replace(replace(replace(x, /%/g, '%25'), /\+/g, '%2B'), /\//g, '%2F');
          	let h = (index(s.address, ':') >= 0) ? '[' + s.address + ']' : s.address;
          	let q = 'publickey=' + enc(s.pubkey) + '&address=' + enc(join(',', s.local)) + '&mtu=' + s.mtu;
          	if (s.reserved) q += '&reserved=' + join(',', s.reserved);
          	if (s.psk) q += '&presharedkey=' + enc(s.psk);
          	return 'wireguard://' + enc(s.secret) + '@' + h + ':' + s.port + '?' + q + '#' + enc(s.name || s.address);
          }

          function parse_link(link) {
          	link = trim('' + (link ?? ''));
          	let scheme = lc(match(link, /^([A-Za-z0-9+.-]+):\/\//)?.[1] ?? '');
          	let s;

          	if (scheme == 'vmess') {
          		let j = null;
          		try { j = json(b64decode(substr(link, 8))); } catch (e) { j = null; }
          		if (type(j) != 'object')
          			return { error: 'رابط vmess غير صالح' };
          		s = {
          			protocol: 'vmess', name: j.ps ?? '', address: j.add ?? '', port: +(j.port ?? 0),
          			id: j.id ?? '', aid: +(j.aid ?? 0), scy: j.scy ?? 'auto', net: j.net || 'tcp',
          			type: j.type || 'none', host: j.host ?? '', path: j.path ?? '',
          			security: (j.tls == 'tls' || j.tls == 'reality') ? j.tls : 'none',
          			sni: j.sni ?? '', alpn: j.alpn ?? '', fp: j.fp ?? ''
          		};
          	}
          	else if (scheme == 'vless' || scheme == 'trojan') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'الرابط ناقص: لازم يكون ' + scheme + '://...@العنوان:البورت' };
          		let q = u.query;
          		s = {
          			protocol: scheme, name: u.name ?? '', address: u.host, port: u.port,
          			id: u.user ?? '', net: q.type || 'tcp', type: q.headerType || 'none',
          			host: q.host ?? '', path: q.path ?? '', security: q.security || (scheme == 'trojan' ? 'tls' : 'none'),
          			sni: q.sni ?? q.peer ?? '', alpn: q.alpn ?? '', fp: q.fp ?? '', pbk: q.pbk ?? '', sid: q.sid ?? '',
          			spx: q.spx ?? '', flow: q.flow ?? '', mode: q.mode ?? '', service: q.serviceName ?? '',
          			insecure: (q.allowInsecure == '1' || q.allowInsecure == 'true' || q.insecure == '1')
          		};
          		if (s.net == 'grpc' && s.service != '')
          			s.path = s.service;
          	}
          	else if (scheme == 'ss') {
          		let u = parse_url(link), method, pass, host, port;
          		if (u && u.user != null && u.port) {
          			let ui = u.user;
          			if (index(ui, ':') < 0)
          				ui = b64decode(ui) ?? '';
          			let c = index(ui, ':');
          			method = substr(ui, 0, c); pass = substr(ui, c + 1);
          			host = u.host; port = u.port;
          		}
          		else {
          			let m = match(link, /^ss:\/\/([^#@?]+)(#(.*))?$/);
          			let d = m ? b64decode(m[1]) : null;
          			let mm = d ? match(d, /^([^:]+):(.*)@([^@]+):([0-9]+)$/) : null;
          			if (!mm)
          				return { error: 'رابط shadowsocks غير صالح' };
          			method = mm[1]; pass = mm[2]; host = replace(mm[3], /^\[|\]$/g, ''); port = +mm[4];
          			u = { name: urldecode(m[3] ?? '') };
          		}
          		s = { protocol: 'shadowsocks', name: u.name ?? '', address: host, port, method, password: pass, net: 'tcp', security: 'none' };
          	}
          	else if (scheme == 'wireguard' || scheme == 'wg') {
          		let u = parse_url(link);
          		if (!u || !u.port || !u.user)
          			return { error: 'رابط wireguard ناقص' };
          		let q = u.query;
          		s = wg_obj(u.name, u.host, u.port, u.user, q.publickey ?? q.publicKey ?? q.peer_public_key ?? '',
          			q.address ?? q.ip ?? '', q.reserved ?? '', q.mtu ?? '', q.presharedkey ?? q.psk ?? '');
          	}
          	else if (scheme == 'socks' || scheme == 'socks5' || scheme == 'http' || scheme == 'https') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'رابط ' + scheme + ' ناقص' };
          		let user = u.user, pass = null;
          		if (user != null && index(user, ':') < 0 && scheme != 'http' && scheme != 'https') {
          			let d = b64decode(user);
          			if (d && index(d, ':') > 0)
          				user = d;
          		}
          		if (user != null && index(user, ':') >= 0) {
          			pass = substr(user, index(user, ':') + 1);
          			user = substr(user, 0, index(user, ':'));
          		}
          		s = { protocol: (scheme == 'socks5') ? 'socks' : (scheme == 'https' ? 'http' : scheme), name: u.name ?? '',
          			address: u.host, port: u.port, user, pass, net: 'tcp', security: (scheme == 'https') ? 'tls' : 'none' };
          	}
          	else if (index(link, '[Interface]') >= 0)
          		s = wg_conf(link);
          	else
          		return { error: 'نوع الرابط غير مدعوم (المدعوم: vless و vmess و trojan و ss و wireguard و socks و http)' };
          	if (s.error)
          		return s;

          	if (lc(s.net) == 'raw')
          		s.net = 'tcp';
          	if (!s.address || !(s.port > 0 && s.port < 65536))
          		return { error: 'الرابط ما بيه عنوان أو بورت صحيح' };
          	if (s.name == '')
          		s.name = s.address;
          	s.link = (s.protocol == 'wireguard' && index(link, '[Interface]') >= 0) ? wg_link(s) : link;
          	return s;
          }

          const UA = [
          	'Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.75 Safari/537.36',
          	'Mozilla/5.0 (iPhone; CPU iPhone OS 10_0_2 like Mac OS X) AppleWebKit/601.1 (KHTML, like Gecko) CriOS/53.0.2785.109 Mobile/14A456 Safari/601.1.46'
          ];

          function stream_settings(s, opt) {
          	let net = lc(s.net ?? 'tcp');
          	let ss = { network: net, security: s.security ?? 'none' };

          	if (net == 'tcp' && lc(s.type ?? '') == 'http') {
          		// the same request/response header v2rayA sends (the server checks the path)
          		let paths = map(csv(s.path), (p) => (substr(p, 0, 1) == '/') ? p : '/' + p);
          		ss.tcpSettings = { header: {
          			type: 'http',
          			request: {
          				version: '1.1', method: 'GET', path: length(paths) ? paths : [ '/' ],
          				headers: {
          					Host: csv(s.host),
          					'User-Agent': UA,
          					'Accept-Encoding': [ 'gzip, deflate' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			},
          			response: {
          				version: '1.1', status: '200', reason: 'OK',
          				headers: {
          					'Content-Type': [ 'application/octet-stream', 'video/mpeg' ],
          					'Transfer-Encoding': [ 'chunked' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			}
          		} };
          	}
          	else if (net == 'ws')
          		ss.wsSettings = { path: s.path || '/', headers: (s.host ? { Host: s.host } : {}) };
          	else if (net == 'grpc')
          		ss.grpcSettings = { serviceName: s.path || '', multiMode: (s.mode == 'multi') };
          	else if (net == 'httpupgrade')
          		ss.httpupgradeSettings = { path: s.path || '/', host: s.host ?? '' };
          	else if (net == 'xhttp' || net == 'splithttp')
          		ss.xhttpSettings = { path: s.path || '/', host: s.host ?? '', mode: s.mode || 'auto' };
          	else if (net == 'h2' || net == 'http')
          		ss.httpSettings = { path: s.path || '/', host: csv(s.host) };

          	if (ss.security == 'tls') {
          		ss.tlsSettings = { serverName: s.sni || s.host || s.domain || s.address, allowInsecure: !!s.insecure };
          		if (s.alpn)
          			ss.tlsSettings.alpn = csv(s.alpn);
          		if (s.fp)
          			ss.tlsSettings.fingerprint = s.fp;
          	}
          	else if (ss.security == 'reality')
          		ss.realitySettings = {
          			serverName: s.sni || s.domain || '', fingerprint: s.fp || 'chrome',
          			publicKey: s.pbk ?? '', shortId: s.sid ?? '', spiderX: s.spx ?? ''
          		};
          	else
          		ss.security = 'none';

          	ss.sockopt = { mark: 128 };
          	if (opt.tfo == 'on')
          		ss.sockopt.tcpFastOpen = true;
          	else if (opt.tfo == 'off')
          		ss.sockopt.tcpFastOpen = false;
          	return ss;
          }

          // s.ip: the address already resolved by the caller (a domain would need DNS, and DNS itself goes
          // through the proxy: the outbound always gets an IP)
          function outbound(s, opt, tag) {
          	opt ??= {};
          	let addr = s.ip || s.address;
          	let o = { tag: tag ?? 'proxy', protocol: s.protocol };
          	if (addr != s.address)
          		s = { ...s, domain: s.address };

          	if (s.protocol == 'vless')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, encryption: 'none', flow: s.flow ?? '' } ] } ] };
          	else if (s.protocol == 'vmess')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, alterId: +(s.aid ?? 0), security: s.scy || 'auto' } ] } ] };
          	else if (s.protocol == 'trojan')
          		o.settings = { servers: [ { address: addr, port: +s.port, password: s.id } ] };
          	else if (s.protocol == 'shadowsocks')
          		o.settings = { servers: [ { address: addr, port: +s.port, method: s.method, password: s.password } ] };
          	else if (s.protocol == 'socks' || s.protocol == 'http') {
          		let srv = { address: addr, port: +s.port };
          		if (s.user != null)
          			srv.users = [ { user: s.user, pass: s.pass ?? '' } ];
          		o.settings = { servers: [ srv ] };
          	}
          	else if (s.protocol == 'wireguard') {
          		o.settings = {
          			secretKey: s.secret, address: length(s.local) ? s.local : [ '10.0.0.2/32' ], mtu: +s.mtu || 1280,
          			peers: [ { publicKey: s.pubkey, endpoint: ((index(addr, ':') >= 0) ? '[' + addr + ']' : addr) + ':' + s.port,
          				allowedIPs: [ '0.0.0.0/0', '::/0' ] } ]
          		};
          		if (s.psk)
          			o.settings.peers[0].preSharedKey = s.psk;
          		if (s.reserved)
          			o.settings.reserved = s.reserved;
          		// the core's own WireGuard stack: "kernel TUN" makes a real interface that fights the router's rules
          		o.settings.noKernelTun = true;
          		o.settings.domainStrategy = 'ForceIP';
          		o.streamSettings = { sockopt: { mark: 128 } };
          		return o;
          	}

          	o.streamSettings = stream_settings(s, opt);
          	if (opt.mux && !s.flow && s.protocol != 'socks' && s.protocol != 'http')
          		o.mux = { enabled: true, concurrency: +(opt.mux_conc ?? 8) };
          	return o;
          }

          export const PRIVATE4 = [
          	'0.0.0.0/8', '10.0.0.0/8', '100.64.0.0/10', '127.0.0.0/8', '169.254.0.0/16', '172.16.0.0/12',
          	'192.0.0.0/24', '192.0.2.0/24', '192.88.99.0/24', '192.168.0.0/16', '198.18.0.0/15',
          	'198.51.100.0/24', '203.0.113.0/24', '224.0.0.0/4', '240.0.0.0/4'
          ];
          export const PRIVATE6 = [ '::/127', '::ffff:0:0/96', '64:ff9b::/96', '100::/64', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];
          const XPRIVATE = [ ...PRIVATE4, '::1/128', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];
          const FAKE_POOL = '198.18.0.0/15';
          function no_fake(list) { return filter(list, (x) => x != FAKE_POOL); }

          // web / social / pictures: many small connections, so one multiplexed channel saves a handshake each
          // (videos and downloads keep their own connection and the zero-copy download)
          const SMART_MUX = [
          	'domain:facebook.com', 'domain:fbcdn.net', 'domain:fbsbx.com', 'domain:instagram.com', 'domain:cdninstagram.com',
          	'domain:whatsapp.net', 'domain:whatsapp.com', 'domain:tiktok.com', 'domain:tiktokcdn.com', 'domain:tiktokv.com',
          	'domain:ibyteimg.com', 'domain:byteoversea.com', 'domain:muscdn.com', 'domain:twitter.com', 'domain:x.com', 'domain:twimg.com',
          	'domain:snapchat.com', 'domain:sc-cdn.net', 'domain:snapkit.com', 'domain:telegram.org', 'domain:t.me',
          	'domain:ytimg.com', 'domain:ggpht.com', 'domain:gstatic.com', 'domain:googleapis.com', 'domain:google.com',
          	'domain:youtube.com', 'domain:googleusercontent.com', 'domain:wikipedia.org', 'domain:wikimedia.org',
          	'domain:reddit.com', 'domain:redd.it', 'domain:redditmedia.com', 'domain:pinimg.com', 'domain:pinterest.com',
          	'domain:discord.com', 'domain:discordapp.com', 'domain:linkedin.com', 'domain:licdn.com', 'domain:cloudflare.com'
          ];
          export const DNS_PORT = 15353;
          export const SOCKS2_PORT = 20179;

          // RoutingA (the v2rayA rule language), the parts that make sense on a router:
          //   default: proxy                      outbound for everything else
          //   domain(geosite:cn, domain:x.com)->direct
          //   ip(geoip:private, 1.2.3.0/24)->direct
          //   port(80,443)->proxy    network(udp)->block    source(192.168.1.5)->direct
          // outbounds: proxy, proxy2 (the second server), direct, block
          function routinga(text) {
          	let rules = [], def = null, errs = [];
          	let n = 0;
          	for (let l in split(text ?? '', /\r?\n/)) {
          		n++;
          		l = trim(replace(l, /#.*$/, ''));
          		if (l == '')
          			continue;
          		let m = match(l, /^default *: *([A-Za-z0-9_]+)$/);
          		if (m) { def = m[1]; continue; }
          		m = match(l, /^([a-z]+) *\((.*)\) *-> *([A-Za-z0-9_]+)$/);
          		if (!m) { push(errs, n); continue; }
          		let vals = filter(map(split(m[2], ','), (x) => trim(replace(x, /^["']|["']$/g, ''))), (x) => x != '');
          		let r = { type: 'field' }, ob = m[3];
          		if (m[1] == 'domain') r.domain = vals;
          		else if (m[1] == 'ip') r.ip = vals;
          		else if (m[1] == 'port') r.port = join(',', vals);
          		else if (m[1] == 'network') r.network = join(',', vals);
          		else if (m[1] == 'source' || m[1] == 'sip') r.source = vals;
          		else { push(errs, n); continue; }
          		if (index([ 'proxy', 'proxy2', 'direct', 'block' ], ob) < 0) { push(errs, n); continue; }
          		r.outboundTag = ob;
          		push(rules, r);
          	}
          	return { rules, def, errs };
          }

          // opt: uci "main"; ctx: {
          //   port, ipv6, main: server (+ .ip), second: server or null, second_kernel: bool, second_ok: [rules],
          //   iso_domains: [], r2_domains: [], r2_ip: [], gfw: [domains], geo: bool (geoip.dat/geosite.dat present) }
          function xray_config(opt, ctx) {
          	let share = (opt.port_sharing == '1');
          	let inb = [];
          	let mode = opt.transparent ?? 'all';
          	let smart = (opt.smart_mux == '1' && opt.mux != '1' && ctx.main && !ctx.main.flow);
          	let need_domains = (opt.learn_log == '1') || (length(ctx.iso_domains ?? []) && opt.iso_sniff != '0') || length(ctx.r2_domains ?? []) || mode == 'gfwlist' || mode == 'routinga' || mode == 'same' || smart;
          	let fake = (opt.special == 'fakedns');
          	let dest = null;
          	if (opt.sniffing == 'http_tls') dest = [ 'http', 'tls' ];
          	else if (opt.sniffing == 'http_tls_quic') dest = [ 'http', 'tls', 'quic' ];
          	else if (need_domains) dest = [ 'http', 'tls', 'quic' ];
          	if (opt.special == 'supervisor')
          		dest ??= [ 'http', 'tls' ];
          	if (opt.special == 'fakedns')
          		dest = [ ...(dest ?? [ 'http', 'tls' ]), 'fakedns' ];
          	// FakeDNS: the core must connect to the real name, so the sniffed name replaces the address
          	let sniff = dest ? { enabled: true, destOverride: dest, routeOnly: !fake } : { enabled: false };

          	if (mode != 'off') {
          		let tp = { tproxy: opt.impl == 'redirect' ? 'redirect' : 'tproxy' };
          		push(inb, { tag: 'transparent', listen: (share || opt.impl == 'redirect') ? '0.0.0.0' : '127.0.0.1', port: +ctx.port, protocol: 'dokodemo-door',
          			settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          		if (ctx.ipv6)
          			push(inb, { tag: 'transparent6', listen: '::1', port: +ctx.port, protocol: 'dokodemo-door',
          				settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          	}
          	if (+opt.socks_port > 0)
          		push(inb, { tag: 'socks', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_port, protocol: 'socks', settings: { udp: true }, sniffing: sniff });
          	if (+opt.http_port > 0)
          		push(inb, { tag: 'http', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_port, protocol: 'http', sniffing: sniff });
          	if (+opt.socks_rule_port > 0)
          		push(inb, { tag: 'socks-rule', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_rule_port, protocol: 'socks', settings: { udp: true }, sniffing: sniff.enabled ? sniff : { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true } });
          	if (+opt.http_rule_port > 0)
          		push(inb, { tag: 'http-rule', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_rule_port, protocol: 'http', sniffing: sniff.enabled ? sniff : { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true } });
          	// the router's own way out through the second server (exit IP check, ping)
          	if (ctx.second)
          		push(inb, { tag: 'socks2', listen: '127.0.0.1', port: SOCKS2_PORT, protocol: 'socks', settings: { udp: false } });

          	let dnsmode = opt.antipollution ?? 'none';
          	// ad blocking with AdGuard DNS: the upstream is theirs (it answers 0.0.0.0 for ad domains)
          	let adg = (opt.adblock == 'adguard' || opt.adblock == 'both');
          	let dnsup = adg ? [ '94.140.14.14', '94.140.15.15' ]
          		: filter(map(split(opt.dns_upstream || '1.1.1.1', /[ ,]+/), (x) => trim(x)), (x) => match(x, /^[0-9a-fA-F.:]+$/));
          	let xdns = null;
          	if (dnsmode == 'forward' && opt.special != 'fakedns')
          		push(inb, { tag: 'dns-in', listen: '127.0.0.1', port: DNS_PORT, protocol: 'dokodemo-door',
          			settings: { address: dnsup[0] ?? '1.1.1.1', port: 53, network: 'tcp,udp' } });
          	else if (dnsmode == 'doh' || dnsmode == 'hijack' || opt.special == 'fakedns') {
          		push(inb, { tag: 'dns-in', listen: '127.0.0.1', port: DNS_PORT, protocol: 'dokodemo-door',
          			settings: { address: dnsup[0] ?? '1.1.1.1', port: 53, network: 'tcp,udp' } });
          		// hijack: "Prevent DNS Hijack Only": DoH straight from the router (fast, not through the server)
          		let up = (dnsmode == 'doh') ? map(dnsup, (x) => 'https://' + x + '/dns-query')
          			: (dnsmode == 'hijack') ? map(dnsup, (x) => 'https+local://' + x + '/dns-query') : map(dnsup, (x) => 'tcp://' + x);
          		xdns = { servers: (opt.special == 'fakedns') ? [ 'fakedns', ...up ] : up, queryStrategy: ctx.ipv6 ? 'UseIP' : 'UseIPv4', tag: 'dns-internal' };
          	}

          	let mux = (opt.mux == '1');
          	let ob = [ outbound(ctx.main, { tfo: opt.tfo, mux, mux_conc: opt.mux_conc }, 'proxy') ];
          	if (smart)
          		push(ob, outbound(ctx.main, { tfo: opt.tfo, mux: true, mux_conc: opt.mux_conc || 8 }, 'proxy-mux'));
          	if (ctx.second) {
          		if (ctx.second_kernel)
          			push(ob, { tag: 'proxy2', protocol: 'freedom', streamSettings: { sockopt: { mark: 0x180, interface: 'xlwg' } } });
          		else
          			push(ob, outbound(ctx.second, { tfo: opt.tfo, mux: false }, 'proxy2'));
          	}
          	push(ob, { tag: 'direct', protocol: 'freedom', streamSettings: { sockopt: { mark: 128 } } });
          	push(ob, { tag: 'block', protocol: 'blackhole' });
          	if (xdns)
          		push(ob, { tag: 'dns-out', protocol: 'dns', streamSettings: { sockopt: { mark: 128 } } });

          	let rules = [];
          	if (xdns)
          		push(rules, { type: 'field', inboundTag: [ 'dns-in' ], outboundTag: 'dns-out' });
          	else if (dnsmode == 'forward')
          		push(rules, { type: 'field', inboundTag: [ 'dns-in' ], outboundTag: 'proxy' });
          	if (ctx.second)
          		push(rules, { type: 'field', inboundTag: [ 'socks2' ], outboundTag: 'proxy2' });
          	push(rules, { type: 'field', ip: fake ? no_fake(XPRIVATE) : XPRIVATE, outboundTag: 'direct' });
          	if (length(ctx.iso_domains ?? []))
          		push(rules, { type: 'field', domain: ctx.iso_domains, outboundTag: 'direct' });

          	let balancers = null, observatory = null;
          	if (ctx.second) {
          		let fb = opt.r2_fallback ?? 'main';
          		let target = { outboundTag: 'proxy2' };
          		if (fb == 'main' || fb == 'direct') {
          			balancers = [ { tag: 'b2', selector: [ 'proxy2' ], strategy: { type: 'random' }, fallbackTag: (fb == 'main') ? 'proxy' : 'direct' } ];
          			observatory = { subjectSelector: [ 'proxy2' ], probeUrl: opt.r2_probe || 'https://www.google.com/generate_204', probeInterval: (+opt.r2_probe_interval || 30) + 's', enableConcurrency: false };
          			target = { balancerTag: 'b2' };
          		}
          		// devices set to "everything through the second server" (by their address; kernel WireGuard: by MAC in nft)
          		if (length(ctx.warp_src ?? []) && !ctx.dev_warp_kernel)
          			push(rules, { type: 'field', source: ctx.warp_src, ...target });
          		if (length(ctx.main_domains ?? []))
          			push(rules, { type: 'field', domain: ctx.main_domains, outboundTag: 'proxy' });
          		if (ctx.main_ports)
          			push(rules, { type: 'field', port: ctx.main_ports, outboundTag: 'proxy' });
          		if (length(ctx.r2_domains ?? []))
          			push(rules, { type: 'field', domain: ctx.r2_domains, ...target });
          		if (length(ctx.r2_ip ?? []))
          			push(rules, { type: 'field', ip: ctx.r2_ip, ...target });
          	}

          	// QUIC (UDP 443) through a TCP tunnel is slow: it is refused in nft (fast fallback to TCP);
          	// this rule is the same for traffic that only the core sees (socks / http ports)
          	if (opt.block_quic == '1')
          		push(rules, { type: 'field', network: 'udp', port: '443', outboundTag: 'block' });
          	// v2rayA's two routings: the transparent proxy, and the "rule" ports (socks/http with traffic splitting).
          	//   transparent: off | all | except_cn | gfwlist | routinga | same (= the rule port mode)
          	//   rule_mode:   except_cn | gfwlist | routinga
          	let rmode = opt.rule_mode ?? 'gfwlist';
          	let tmode = (mode == 'same') ? rmode : mode;
          	let groups = [];
          	if (tmode != 'off')
          		push(groups, [ ctx.ipv6 ? [ 'transparent', 'transparent6' ] : [ 'transparent' ], tmode ]);
          	let rtags = [];
          	if (+opt.socks_rule_port > 0) push(rtags, 'socks-rule');
          	if (+opt.http_rule_port > 0) push(rtags, 'http-rule');
          	if (length(rtags))
          		push(groups, [ rtags, rmode ]);
          	let ptags = [];
          	if (+opt.socks_port > 0) push(ptags, 'socks');
          	if (+opt.http_port > 0) push(ptags, 'http');
          	if (length(ptags))
          		push(groups, [ ptags, 'all' ]);
          	for (let g in groups) {
          		let tags = g[0], gm = g[1], last = 'proxy', mr = [];
          		if (gm == 'gfwlist') {
          			if (length(ctx.gfw ?? []))
          				push(mr, { type: 'field', domain: ctx.gfw, outboundTag: 'proxy' });
          			last = 'direct';
          		}
          		else if (gm == 'except_cn') {
          			if (ctx.geo)
          				push(mr, { type: 'field', domain: [ 'geosite:cn' ], outboundTag: 'direct' }, { type: 'field', ip: [ 'geoip:cn' ], outboundTag: 'direct' });
          			else if (length(ctx.cn4 ?? []))
          				push(mr, { type: 'field', ip: ctx.cn4, outboundTag: 'direct' });
          		}
          		else if (gm == 'routinga') {
          			let ra = routinga(opt.routinga);
          			for (let r in ra.rules) {
          				if (r.outboundTag == 'proxy2' && !ctx.second)
          					continue;
          				// geosite / geoip need the .dat files; without them only geoip:private is understood
          				if (!ctx.geo) {
          					for (let k in [ 'domain', 'ip' ]) {
          						if (!r[k])
          							continue;
          						let v = [];
          						for (let x in r[k])
          							if (x == 'geoip:private') push(v, ...XPRIVATE);
          							else if (!match(x, /^geo(site|ip):/)) push(v, x);
          						r[k] = v;
          					}
          					if ((r.domain && !length(r.domain)) || (r.ip && !length(r.ip)))
          						continue;
          				}
          				push(mr, r);
          			}
          			if (ra.def && (ra.def != 'proxy2' || ctx.second))
          				last = ra.def;
          		}
          		for (let r in mr)
          			push(rules, { ...r, inboundTag: tags });
          		if (smart && last == 'proxy')
          			push(rules, { type: 'field', inboundTag: tags, domain: SMART_MUX, network: 'tcp', outboundTag: 'proxy-mux' });
          		push(rules, { type: 'field', inboundTag: tags, outboundTag: last });
          	}
          	push(rules, { type: 'field', network: 'tcp,udp', outboundTag: 'proxy' });

          	let c = {
          		// learning mode: the core says which name each device connects to (read by the monitor, then off)
          		log: (opt.learn_log == '1') ? { loglevel: 'info', error: '/tmp/xlite/core.log', access: 'none' } : { loglevel: opt.loglevel || 'warning', access: 'none' },
          		inbounds: inb,
          		outbounds: ob,
          		routing: { domainStrategy: 'AsIs', rules }
          	};
          	if (balancers) {
          		c.routing.balancers = balancers;
          		c.observatory = observatory;
          	}
          	if (xdns)
          		c.dns = xdns;
          	if (fake)
          		c.fakedns = [ { ipPool: FAKE_POOL, poolSize: 65535 } ];
          	return c;
          }

          function nft_set(name, typ, elems, extra) {
          	let s = `\tset ${name} {\n\t\ttype ${typ}\n\t\tflags interval\n\t\tauto-merge\n`;
          	if (length(elems))
          		s += `\t\telements = { ${join(', ', elems)} }\n`;
          	return s + '\t}\n';
          }

          function q(n) {
          	return '"' + replace(n, /[^A-Za-z0-9._@-]/g, '') + '"';
          }

          function sname(id) {
          	return replace(id, /[^A-Za-z0-9_]/g, '_');
          }

          // ctx: { port, ipv6, wan: [devs], lan: [devs], local4, local6, bypass4, bypass6,
          //        iso: [ { id, ip4: [], ip6: [] } ], r2fast4: [], r2fast6: [] }
          function nft_rules(opt, ctx) {
          	let fam = ctx.ipv6 ? 'meta nfproto { ipv4, ipv6 }' : 'meta nfproto ipv4';
          	let early = (opt.early_exit != '0');
          	let r = 'table inet xlite {\n';
          	r += nft_set('whitelist', 'ipv4_addr', (opt.special == 'fakedns') ? no_fake(PRIVATE4) : PRIVATE4);
          	r += nft_set('whitelist6', 'ipv6_addr', PRIVATE6);
          	r += nft_set('local_ips', 'ipv4_addr', ctx.local4 ?? []);
          	r += nft_set('local_ips6', 'ipv6_addr', ctx.local6 ?? []);
          	r += nft_set('bypass4', 'ipv4_addr', ctx.bypass4 ?? []);
          	r += nft_set('bypass6', 'ipv6_addr', ctx.bypass6 ?? []);
          	r += nft_set('r2fast4', 'ipv4_addr', ctx.r2fast4 ?? []);
          	r += nft_set('r2fast6', 'ipv6_addr', ctx.r2fast6 ?? []);
          	r += nft_set('cn4', 'ipv4_addr', ctx.cn4_nft ? (ctx.cn4 ?? []) : []);
          	for (let a in ctx.iso ?? []) {
          		r += nft_set('iso4_' + sname(a.id), 'ipv4_addr', a.ip4 ?? []);
          		r += nft_set('iso6_' + sname(a.id), 'ipv6_addr', a.ip6 ?? []);
          	}
          	r += '\tset dev_direct {\n\t\ttype ether_addr\n' + (length(ctx.dev_direct ?? []) ? `\t\telements = { ${join(', ', ctx.dev_direct)} }\n` : '') + '\t}\n';
          	r += '\tset dev_warp {\n\t\ttype ether_addr\n' + ((length(ctx.dev_warp ?? []) && ctx.dev_warp_kernel) ? `\t\telements = { ${join(', ', ctx.dev_warp)} }\n` : '') + '\t}\n';
          	// devices kicked from the network (Telegram bot / LuCI)
          	r += '\tset blocked {\n\t\ttype ether_addr\n' + (length(ctx.blocked ?? []) ? `\t\telements = { ${join(', ', ctx.blocked)} }\n` : '') + '\t}\n';
          	// per device traffic (the monitor turns the counters into day / month totals)
          	r += '\tset dev_up {\n\t\ttype ipv4_addr\n\t\tsize 1024\n\t\tflags dynamic\n\t\tcounter\n\t}\n';
          	r += '\tset dev_down {\n\t\ttype ipv4_addr\n\t\tsize 1024\n\t\tflags dynamic\n\t\tcounter\n\t}\n';

          	r += '\tchain tp_out {\n';
          	if (early)
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} return\n`;
          	r += '\t\tmeta mark & 0x80 == 0x80 return\n';
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type local fib daddr type != local jump tp_rule\n';
          	r += '\t}\n';

          	r += '\tchain tp_pre {\n';
          	if (early)
          		for (let d in ctx.wan ?? [])
          			r += `\t\tiifname ${q(d)} return\n`;
          	r += '\t\tiifname "lo" mark & 0xc0 != 0x40 return\n';
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type != local fib daddr type != local jump tp_rule\n';
          	if (opt.impl != 'redirect') {
          		r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip to 127.0.0.1:${+ctx.port}\n`;
          		if (ctx.ipv6)
          			r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip6 to [::1]:${+ctx.port}\n`;
          	}
          	r += '\t}\n';

          	r += `\tchain output {\n\t\ttype route hook output priority mangle - 5; policy accept;\n\t\t${fam} jump tp_out\n`;
          	if (opt.block_quic == '1')
          		r += '\t\tmeta mark & 0x200 == 0x200 reject\n';
          	r += '\t}\n';
          	// QUIC refused right away, so apps fall back to TCP at once (a dropped packet would make them wait)
          	if (opt.block_quic == '1')
          		r += '\tchain quic {\n\t\ttype filter hook forward priority filter - 5; policy accept;\n\t\tmeta mark & 0x200 == 0x200 reject\n\t}\n';
          	r += `\tchain prerouting {\n\t\ttype filter hook prerouting priority mangle - 5; policy accept;\n\t\t${fam} jump tp_pre\n\t}\n`;
          	r += '\tchain kick {\n\t\ttype filter hook prerouting priority raw; policy accept;\n\t\tether saddr @blocked drop\n\t}\n';
          	r += '\tchain count_up {\n\t\ttype filter hook prerouting priority mangle - 6; policy accept;\n';
          	for (let d in ctx.lan ?? [])
          		r += `\t\tiifname ${q(d)} meta nfproto ipv4 update @dev_up { ip saddr }\n`;
          	r += '\t}\n';
          	r += '\tchain count_down {\n\t\ttype filter hook postrouting priority mangle; policy accept;\n';
          	for (let d in ctx.lan ?? [])
          		r += `\t\toifname ${q(d)} meta nfproto ipv4 update @dev_down { ip daddr }\n`;
          	if (length(ctx.iso ?? []))
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} jump iso_down\n`;
          	r += '\t}\n';
          	// isolated apps: bytes in each direction (the monitor reads these counters)
          	r += '\tchain iso_down {\n';
          	for (let a in ctx.iso ?? [])
          		r += `\t\tip saddr @iso4_${sname(a.id)} counter comment ${q(a.id)}\n\t\tip6 saddr @iso6_${sname(a.id)} counter comment ${q(a.id)}\n`;
          	r += '\t}\n';

          	r += '\tchain tp_rule {\n';
          	r += '\t\tmeta mark set ct mark\n';
          	r += '\t\tmeta mark & 0xc0 == 0x40 return\n';
          	if (opt.dns == 'direct' && (opt.antipollution ?? 'none') == 'none')
          		r += '\t\tmeta l4proto { tcp, udp } th dport 53 return\n';
          	r += '\t\tip daddr @local_ips return\n\t\tip6 daddr @local_ips6 return\n';
          	r += '\t\tip daddr @whitelist return\n\t\tip6 daddr @whitelist6 return\n';
          	r += '\t\tip daddr @bypass4 return\n\t\tip6 daddr @bypass6 return\n';
          	// per device: no VPN at all, or (kernel WireGuard) everything into the tunnel
          	r += '\t\tether saddr @dev_direct return\n';
          	r += '\t\tether saddr @dev_warp meta mark set mark | 0x100 return\n';
          	// voice / video calls stay on the VPN even for an isolated app: a call starts with STUN
          	// (magic cookie 0x2112A442 in every STUN message), the mark stays on the whole connection
          	if (length(ctx.iso ?? []) && opt.iso_calls != '0') {
          		r += '\t\tmeta l4proto udp @th,96,32 0x2112a442 meta mark set mark | 0x400\n';
          		r += '\t\tudp dport { 3478-3481, 5349, 19302-19309 } meta mark set mark | 0x400\n';
          	}
          	r += '\t\tjump iso\n';
          	if (ctx.cn4_nft && length(ctx.cn4 ?? []))
          		r += '\t\tip daddr @cn4 return\n';
          	if (ctx.main_ports)
          		r += `\t\tmeta l4proto tcp th dport { ${ctx.main_ports} } goto tp_mark\n`;
          	if (opt.block_quic == '1' && !ctx.second_kernel)
          		r += '\t\tudp dport 443 meta mark set mark | 0x200 return\n';
          	r += '\t\tip daddr @r2fast4 meta mark set mark | 0x100 return\n';
          	r += '\t\tip6 daddr @r2fast6 meta mark set mark | 0x100 return\n';
          	// with the kernel WireGuard, Iraqi QUIC above keeps working (UDP over WireGuard is fine)
          	if (opt.block_quic == '1' && ctx.second_kernel)
          		r += '\t\tudp dport 443 meta mark set mark | 0x200 return\n';
          	r += '\t\tjump tp_mark\n';
          	r += '\t}\n';
          	r += '\tchain iso {\n';
          	r += '\t\tmeta mark & 0x400 == 0x400 return\n';
          	for (let a in ctx.iso ?? [])
          		r += `\t\tip daddr @iso4_${sname(a.id)} counter accept comment ${q(a.id)}\n\t\tip6 daddr @iso6_${sname(a.id)} counter accept comment ${q(a.id)}\n`;
          	r += '\t}\n';
          	r += '\tchain tp_mark {\n';
          	r += '\t\ttcp flags & (fin | syn | rst | ack) == syn meta mark set mark | 0x40\n';
          	r += '\t\tmeta l4proto udp ct state new meta mark set mark | 0x40\n';
          	r += '\t\tct mark set mark\n';
          	r += '\t}\n';
          	r += '}\n';
          	return r;
          }

          // redirect mode (no tproxy kernel module): TCP only, like v2rayA's "redirect"
          function nft_redirect(opt, ctx) {
          	let r = 'table inet xlite_nat {\n';
          	r += '\tchain prerouting {\n\t\ttype nat hook prerouting priority dstnat - 5; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '\tchain output {\n\t\ttype nat hook output priority -105; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '}\n';
          	return r;
          }

          // subscription body: base64 or plain list of share links
          function parse_subscription(body) {
          	body = trim(body ?? '');
          	if (!match(body, /:\/\//)) {
          		let d = b64decode(replace(body, /\s+/g, ''));
          		if (d && match(d, /:\/\//))
          			body = d;
          	}
          	let r = [];
          	for (let l in split(body, /\r?\n/)) {
          		l = trim(l);
          		if (match(l, /^[a-z0-9]+:\/\//)) {
          			let p = parse_link(l);
          			if (!p.error)
          				push(r, p);
          		}
          	}
          	return r;
          }

          export { parse_link, outbound, xray_config, nft_rules, nft_redirect, routinga, parse_subscription, sname };
          XLITE_FILE_6
          mkdir -p "$(dirname "src/usr/share/xlite/bot.uc")"
          cat > "src/usr/share/xlite/bot.uc" <<'XLITE_FILE_7'
          // XLite Telegram bot (runs while XLite is on and the bot is enabled in Settings)
          //   alerts: a server stopped / came back, a new device joined (with Allow / Kick buttons)
          //   daily report: device usage of the day
          //   commands: /status /servers /use N /second N /off /on /devices /ping /help
          // Only the owner's chat is answered: the first chat that sends /start when no chat is saved.
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';

          const TMP = getenv('XLITE_TMP') ?? '/tmp/xlite';
          const RUN = getenv('XLITE_RUN') ?? '/var/etc/xlite';

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function uci() {
          	let c = getenv('XLITE_UCI_DIR') ? cursor(getenv('XLITE_UCI_DIR')) : cursor();
          	c.load('xlite');
          	return c;
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          function fmtb(b) {
          	b = +b || 0;
          	if (b >= 1e9) return sprintf('%.1f GB', b / 1e9);
          	if (b >= 1e6) return sprintf('%.0f MB', b / 1e6);
          	return sprintf('%.0f KB', b / 1e3);
          }

          let token = null;

          // Telegram may be blocked on the line: try through the core first, then direct
          function api(method, body, timeout) {
          	let f = TMP + '/bot-req.json';
          	fs.writefile(f, sprintf('%J', body ?? {}));
          	let socks = +(uci().get('xlite', 'main', 'socks_port') ?? 0);
          	let url = shq('https://api.telegram.org/bot' + token + '/' + method);
          	let t = timeout ?? 15;
          	let base = `curl -s -m ${t + 10} -H 'Content-Type: application/json' -d @${f} `;
          	let out = (socks > 0) ? sh(base + `--socks5-hostname 127.0.0.1:${socks} ${url} 2>/dev/null`) : '';
          	if (out == '')
          		out = sh(base + url + ' 2>/dev/null');
          	try { return json(out); } catch (e) { return null; }
          }

          function send(chat, text, buttons) {
          	let b = { chat_id: chat, text, parse_mode: 'HTML', disable_web_page_preview: true };
          	if (buttons)
          		b.reply_markup = { inline_keyboard: buttons };
          	return api('sendMessage', b);
          }

          function servers(c) {
          	let r = [];
          	c.foreach('xlite', 'server', (s) => push(r, { id: s['.name'], name: s.name ?? '?' }));
          	return r;
          }

          function status_text(c) {
          	let m = c.get_all('xlite', 'main') ?? {};
          	let st = readjson(RUN + '/state.json') ?? {};
          	let mon = readjson(TMP + '/mon.json') ?? {};
          	let on = (m.enabled == '1') && system('nft list table inet xlite > /dev/null 2>&1') == 0;
          	let t = on ? '🟢 <b>متصل</b>\n' : '🔴 <b>مفصول</b>\n';
          	t += 'الرئيسي: ' + (st.name ?? '—');
          	if (mon.health?.main) t += mon.health.main.ok ? ` (${mon.health.main.ms} ms)` : ' (ما يرد)';
          	t += '\n';
          	if (st.second) {
          		t += 'الثاني: ' + st.second.name;
          		if (mon.health?.second) t += mon.health.second.ok ? ` (${mon.health.second.ms} ms)` : ' (واكف)';
          		t += '\n';
          	}
          	let tot = 0;
          	for (let d in mon.devs ?? []) tot += d.today[0] + d.today[1];
          	t += 'استهلاك اليوم: ' + fmtb(tot) + ' · ' + length(mon.devs ?? []) + ' جهاز';
          	return t;
          }

          function devices_text() {
          	let mon = readjson(TMP + '/mon.json') ?? {};
          	let d = sort([ ...(mon.devs ?? []) ], (a, b) => (b.today[0] + b.today[1]) - (a.today[0] + a.today[1]));
          	if (!length(d))
          		return 'ما اكو بيانات بعد';
          	let t = '<b>الأجهزة اليوم</b>\n';
          	for (let x in slice(d, 0, 15))
          		t += `• ${x.name ?? x.ip}: ${fmtb(x.today[0] + x.today[1])}\n`;
          	return t;
          }

          function restart() {
          	system('( /etc/init.d/xlite restart > /dev/null 2>&1 & )');
          }

          function kick(c, mac, on) {
          	mac = lc(mac);
          	if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          		return false;
          	let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          	if (on) push(l, mac);
          	c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          	c.save('xlite');
          	c.commit('xlite');
          	system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          	return true;
          }

          function command(c, chat, text) {
          	let m = match(text, /^\/([a-z]+)(@[A-Za-z0-9_]+)?( +(.*))?$/);
          	if (!m) {
          		send(chat, 'اكتب /help حتى تشوف الأوامر');
          		return;
          	}
          	let cmd = m[1], arg = trim(m[4] ?? '');
          	let list = servers(c);
          	if (cmd == 'start' || cmd == 'help')
          		send(chat, '<b>XLite</b>\n/status الحالة\n/servers السيرفرات\n/use رقم: سيرفر رئيسي\n/second رقم: سيرفر ثاني\n/second off: إطفاء الثاني\n/devices الأجهزة اليوم\n/off و /on: الاتصال');
          	else if (cmd == 'status')
          		send(chat, status_text(c));
          	else if (cmd == 'devices')
          		send(chat, devices_text());
          	else if (cmd == 'servers') {
          		let cur = c.get('xlite', 'main', 'server'), sec = (c.get('xlite', 'main', 'r2') == '1') ? c.get('xlite', 'main', 'server2') : null;
          		let t = '<b>السيرفرات</b>\n';
          		for (let i = 0; i < length(list); i++)
          			t += `${i + 1}. ${list[i].name}${list[i].id == cur ? ' ⭐ الرئيسي' : ''}${list[i].id == sec ? ' 🇮🇶 الثاني' : ''}\n`;
          		send(chat, t + '\n/use رقم أو /second رقم');
          	}
          	else if (cmd == 'use' || cmd == 'second') {
          		if (cmd == 'second' && arg == 'off') {
          			c.set('xlite', 'main', 'r2', '0');
          			c.save('xlite'); c.commit('xlite'); restart();
          			send(chat, 'انطفى السيرفر الثاني');
          			return;
          		}
          		let s = list[+arg - 1];
          		if (!s) { send(chat, 'رقم غلط، شوف /servers'); return; }
          		if (cmd == 'use') {
          			if (c.get('xlite', 'main', 'server2') == s.id) c.set('xlite', 'main', 'server2', c.get('xlite', 'main', 'server'));
          			c.set('xlite', 'main', 'server', s.id);
          		}
          		else {
          			if (c.get('xlite', 'main', 'server') == s.id) { send(chat, 'هذا الرئيسي، اختار غيره'); return; }
          			c.set('xlite', 'main', 'server2', s.id);
          			c.set('xlite', 'main', 'r2', '1');
          		}
          		c.save('xlite'); c.commit('xlite'); restart();
          		send(chat, (cmd == 'use' ? 'الرئيسي صار: ' : 'الثاني صار: ') + s.name);
          	}
          	else if (cmd == 'off' || cmd == 'on') {
          		c.set('xlite', 'main', 'enabled', cmd == 'on' ? '1' : '0');
          		c.save('xlite'); c.commit('xlite');
          		// with XLite off the service keeps only the bot running, so /on still works
          		system('( /etc/init.d/xlite restart > /dev/null 2>&1 & )');
          		send(chat, cmd == 'on' ? 'يتصل…' : 'انفصل. اكتب /on حتى يرجع');
          	}
          	else
          		send(chat, 'ما أعرف هذا الأمر. /help');
          }

          function events(c, chat) {
          	let f = TMP + '/events.jsonl';
          	let t = fs.readfile(f);
          	if (!t)
          		return;
          	fs.unlink(f);
          	let m = c.get_all('xlite', 'main') ?? {};
          	for (let l in split(t, '\n')) {
          		let e = null;
          		try { e = json(l); } catch (x) {}
          		if (!e)
          			continue;
          		if (e.type == 'down' && m.bot_alert_down != '0')
          			send(chat, `🔴 السيرفر ${e.which == 'second' ? 'الثاني' : 'الرئيسي'} (${e.name ?? ''}) ما يرد`);
          		else if (e.type == 'up' && m.bot_alert_down != '0')
          			send(chat, `🟢 السيرفر ${e.which == 'second' ? 'الثاني' : 'الرئيسي'} (${e.name ?? ''}) رجع`);
          		else if (e.type == 'new_device' && m.bot_alert_newdev != '0')
          			send(chat, `📱 جهاز جديد دخل الشبكة:\n<b>${e.name ?? 'بدون اسم'}</b>\n${e.ip ?? ''} · ${e.mac}`,
          				[ [ { text: '✅ اسمح', callback_data: 'allow:' + e.mac }, { text: '⛔ اطرد', callback_data: 'kick:' + e.mac } ] ]);
          	}
          }

          let offset = 0, last_report = '';
          let started = time();
          while (true) {
          	let c = uci();
          	let m = c.get_all('xlite', 'main') ?? {};
          	token = m.bot_token;
          	if (m.bot_enabled != '1' || !token || !match(token, /^[0-9]+:[A-Za-z0-9_-]+$/)) {
          		sleep(30000);
          		continue;
          	}
          	let chat = m.bot_chat;
          	let r = api('getUpdates', { offset, timeout: 20, allowed_updates: [ 'message', 'callback_query' ] }, 20);
          	for (let u in r?.result ?? []) {
          		offset = u.update_id + 1;
          		let from = u.message?.chat?.id ?? u.callback_query?.message?.chat?.id;
          		if (!chat && u.message?.text == '/start' && from) {
          			chat = '' + from;
          			c.set('xlite', 'main', 'bot_chat', chat);
          			c.save('xlite'); c.commit('xlite');
          			send(chat, '✅ انربط البوت ويا XLite. هذا الحساب بس اللي ينطيه أوامر.');
          			continue;
          		}
          		if (!chat || '' + from != chat)
          			continue;
          		if (u.message?.text)
          			command(c, chat, trim(u.message.text));
          		else if (u.callback_query) {
          			let d = match(u.callback_query.data ?? '', /^(allow|kick):(.*)$/);
          			if (d) {
          				kick(c, d[2], d[1] == 'kick');
          				api('answerCallbackQuery', { callback_query_id: u.callback_query.id, text: d[1] == 'kick' ? 'انطرد' : 'مسموح' });
          				send(chat, (d[1] == 'kick' ? '⛔ انطرد ' : '✅ مسموح ') + d[2]);
          			}
          		}
          	}
          	if (chat) {
          		events(c, chat);
          		let t = localtime(), hm = sprintf('%02d:%02d', t.hour, t.min), day = sprintf('%d-%02d-%02d', t.year, t.mon, t.mday);
          		if (hm == (m.bot_report_time ?? '22:00') && last_report != day) {
          			last_report = day;
          			send(chat, '📊 <b>تقرير اليوم</b>\n' + status_text(c) + '\n\n' + devices_text());
          		}
          	}
          	if (!r)
          		sleep(10000);
          }
          XLITE_FILE_7
