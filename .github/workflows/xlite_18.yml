          	lists_info: {
          		call: function() {
          			let r = {};
          			for (let n in [ 'gfw', 'cn4' ]) {
          				let st = fs.stat(KEEP + '/' + n + '.txt');
          				r[n] = st ? { size: st.size, mtime: st.mtime } : null;
          			}
          			return r;
          		}
          	},

          	routinga_check: {
          		args: { text: '' },
          		call: function(req) {
          			let r = lib.routinga(req.args?.text ?? '');
          			return { errs: r.errs, rules: length(r.rules), def: r.def };
          		}
          	},

          	// --- subscriptions --------------------------------------------------------------------
          	subs: {
          		call: function() {
          			let c = uci(), r = [];
          			c.foreach('xlite', 'subscription', (s) => push(r, { id: s['.name'], name: s.name ?? '', url: s.url ?? '',
          				updated: +(s.updated ?? 0), count: +(s.count ?? 0) }));
          			return { subs: r };
          		}
          	},

          	sub_add: {
          		args: { name: '', url: '' },
          		call: function(req) {
          			let url = trim(req.args?.url ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(url, /^https?:\/\/[^ '"]+$/) || length(url) > 2000)
          				return { ok: false, error: 'الرابط لازم يبدي بـ http:// أو https://' };
          			let c = uci(), id = c.add('xlite', 'subscription');
          			c.set('xlite', id, 'name', name != '' ? substr(name, 0, 64) : 'اشتراك');
          			c.set('xlite', id, 'url', url);
          			c.save('xlite');
          			c.commit('xlite');
          			bg('/usr/bin/xlite sub ' + id, TMP + '/sub.log');
          			return { ok: true, id };
          		}
          	},

          	sub_update: {
          		args: { id: 'all' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? 'all', /[^A-Za-z0-9_]/g, '');
          			bg('/usr/bin/xlite sub ' + (id || 'all'), TMP + '/sub.log');
          			return { ok: true };
          		}
          	},

          	sub_remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (c.get('xlite', id) != 'subscription')
          				return { ok: false };
          			let sel = c.get('xlite', 'main', 'server'), sel2 = c.get('xlite', 'main', 'server2'), kept = 0;
          			let del = [];
          			c.foreach('xlite', 'server', (s) => { if (s.sub == id) push(del, s['.name']); });
          			for (let s in del) {
          				if (s == sel || s == sel2) { c.delete('xlite', s, 'sub'); kept++; }
          				else c.delete('xlite', s);
          			}
          			c.delete('xlite', id);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true, kept };
          		}
          	},

          	// --- devices --------------------------------------------------------------------------
          	devices: {
          		call: function() {
          			let u = readjson(TMP + '/usage.json') ?? readjson(KEEP + '/usage.json') ?? { devs: {} };
          			let mon = readjson(TMP + '/mon.json') ?? {};
          			let rate = {};
          			for (let d in mon.devs ?? []) rate[d.id] = d.rate;
          			let r = [];
          			for (let k, d in u.devs ?? {})
          				push(r, { id: k, ip: d.ip, name: d.name, seen: d.seen, days: d.days ?? {}, months: d.months ?? {}, rate: rate[k] ?? [ 0, 0 ] });
          			let names = c_names(), routes = {};
          			uci().foreach('xlite', 'device', (s) => { if (s.id && s.route) routes[s.id] = s.route; });
          			for (let d in r) {
          				if (names[d.id]) d.alias = names[d.id];
          				d.route = routes[d.id] ?? 'vpn';
          			}
          			let blocked = filter(split(uci().get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '');
          			return { devices: r, running: !!mon.t && time() - mon.t < 30, blocked };
          		}
          	},

          	device_name: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(id, /^[0-9a-f:.]+$/))
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (name == '') c.delete('xlite', sid);
          			else {
          				c.set('xlite', sid, 'device');
          				c.set('xlite', sid, 'id', id);
          				c.set('xlite', sid, 'name', substr(name, 0, 40));
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	usage_reset: {
          		call: function() {
          			for (let f in [ TMP + '/usage.json', KEEP + '/usage.json' ])
          				fs.unlink(f);
          			// the monitor clears its totals at its next cycle (no restart, the internet stays up)
          			writejson(TMP + '/usage.reset', true);
          			return { ok: true };
          		}
          	},

          	// --- isolation ------------------------------------------------------------------------
          	apps: {
          		call: function() {
          			let c = uci(), d = apps_data(), mon = readjson(TMP + '/mon.json') ?? {}, u = readjson(TMP + '/usage.json') ?? {};
          			let st = readjson(RUN + '/state.json') ?? {};
          			let ln = readjson(TMP + '/learn.json');
          			let r = [];
          			for (let a in d.apps) {
          				let sec = c.get_all('xlite', a.id) ?? {};
          				let learned = sec.learned ?? [];
          				if (type(learned) != 'array') learned = split(learned, ' ');
          				push(r, { id: a.id, name: a.name, group: a.group, letter: a.letter, color: a.color, learn: a.learn,
          					isolate: sec.isolate == '1', active: index(st.iso ?? [], a.id) >= 0,
          					domains: length(a.domains), ips: length(a.ip4 ?? []) + length(a.ip6 ?? []), learned,
          					rate: mon.apps?.[a.id]?.rate ?? 0, days: u.apps?.[a.id]?.days ?? {},
          					learning: !!(ln && ln.app == a.id && !ln.done),
          					pct: (ln && ln.app == a.id) ? +(ln.pct ?? 0) : +(sec.learn_pct ?? (length(learned) ? 100 : 0)) });
          			}
          			return { apps: r, learn: readjson(TMP + '/learn.json') };
          		}
          	},

          	iso_set: {
          		args: { id: '', on: false },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (!length(filter(apps_data().apps, (a) => a.id == id)))
          				return { ok: false };
          			if (c.get('xlite', id) != 'app')
          				c.set('xlite', id, 'app');
          			c.set('xlite', id, 'isolate', req.args?.on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	learn_start: {
          		args: { app: '', ip: '', minutes: 5 },
          		call: function(req) {
          			let app = req.args?.app ?? '', ip = req.args?.ip ?? '';
          			let c0 = uci(), kind = (c0.get('xlite', app) == 'r2app') ? 'r2' : 'iso';
          			if ((kind == 'iso' && !length(filter(apps_data().apps, (a) => a.id == app))) || !match(ip, /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/))
          				return { ok: false };
          			// Iraqi apps are learned by name too: the core logs the sniffed names while learning
          			if (kind == 'r2') {
          				c0.set('xlite', 'main', 'learn_log', '1');
          				c0.save('xlite'); c0.commit('xlite');
          				if (c0.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			}
          			let m = +(req.args?.minutes ?? 0) || +(uci().get('xlite', 'main', 'learn_minutes') ?? 10);
          			if (m < 1 || m > 30) m = 10;
          			writejson(TMP + '/learn.json', { app, ip, kind, start: time(), until: time() + m * 60, nets: {}, names: {} });
          			return { ok: true };
          		}
          	},

          	learn_stop: {
          		call: function() {
          			let l = readjson(TMP + '/learn.json');
          			if (l) { l.until = time() - 1; l.done = true; writejson(TMP + '/learn.json', l); }
          			learn_log_off();
          			return { ok: true };
          		}
          	},

          	learn_save: {
          		args: { app: '', nets: [], names: [] },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) == 'r2app') {
          				let ips = c.get('xlite', app, 'ip') ?? [], doms = c.get('xlite', app, 'domain') ?? [];
          				if (type(ips) != 'array') ips = split(ips, ' ');
          				if (type(doms) != 'array') doms = split(doms, ' ');
          				for (let n in req.args?.nets ?? [])
          					if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(ips, n) < 0) push(ips, n);
          				for (let d in req.args?.names ?? [])
          					if (match(d, /^[a-z0-9.-]{3,200}$/) && index(doms, d) < 0) push(doms, d);
          				c.set('xlite', app, 'ip', ips);
          				c.set('xlite', app, 'domain', doms);
          				let ln = readjson(TMP + '/learn.json');
          				if (ln && ln.app == app) c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          				c.set('xlite', app, 'on', '1');
          				c.save('xlite'); c.commit('xlite');
          				fs.unlink(TMP + '/learn.json');
          				learn_log_off();
          				if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          				return { ok: true, count: length(ips) + length(doms) };
          			}
          			if (!length(filter(apps_data().apps, (a) => a.id == app)))
          				return { ok: false };
          			let cur = c.get('xlite', app, 'learned') ?? [];
          			if (type(cur) != 'array') cur = split(cur, ' ');
          			for (let n in req.args?.nets ?? [])
          				if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(cur, n) < 0)
          					push(cur, n);
          			if (c.get('xlite', app) != 'app')
          				c.set('xlite', app, 'app');
          			c.set('xlite', app, 'learned', cur);
          			let ln = readjson(TMP + '/learn.json');
          			if (ln && ln.app == app)
          				c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          			c.save('xlite');
          			c.commit('xlite');
          			fs.unlink(TMP + '/learn.json');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true, count: length(cur) };
          		}
          	},

          	learn_clear: {
          		args: { app: '' },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) != 'app')
          				return { ok: false };
          			c.delete('xlite', app, 'learned');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	// --- Iraqi apps (through the second server) and the route of each device -----------------
          	r2apps: {
          		call: function() {
          			let c = uci(), r = [], ln = readjson(TMP + '/learn.json');
          			let n = 0;
          			c.foreach('xlite', 'r2app', () => n++);
          			if (!n) {
          				// first look: the usual Iraqi apps, empty (they are learned on the phone)
          				for (let p in [ [ 'cinemana', 'سينمانا' ], [ 'ayniq', 'عين العراق' ], [ 'capp', 'تطبيق C' ] ]) {
          					c.set('xlite', p[0], 'r2app'); c.set('xlite', p[0], 'name', p[1]); c.set('xlite', p[0], 'on', '0');
          				}
          				c.save('xlite'); c.commit('xlite');
          			}
          			c.foreach('xlite', 'r2app', (a) => {
          				let d = a.domain ?? [], ip = a.ip ?? [];
          				if (type(d) != 'array') d = split(d, ' ');
          				if (type(ip) != 'array') ip = split(ip, ' ');
          				push(r, { id: a['.name'], name: a.name ?? a['.name'], on: a.on == '1', domains: d, ips: ip,
          					learning: !!(ln && ln.app == a['.name'] && !ln.done),
          					pct: (ln && ln.app == a['.name']) ? +(ln.pct ?? 0) : +(a.learn_pct ?? ((length(d) + length(ip)) ? 100 : 0)) });
          			});
          			return { apps: r, learn: (ln && ln.kind == 'r2') ? ln : null };
          		}
          	},

          	r2app_set: {
          		args: { id: '', on: false, name: '', remove: false, domains: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (id == '') {
          				let name = trim(req.args?.name ?? '');
          				if (name == '' || length(name) > 40) return { ok: false };
          				id = c.add('xlite', 'r2app');
          				c.set('xlite', id, 'name', name);
          				c.set('xlite', id, 'on', '0');
          			}
          			else if (c.get('xlite', id) != 'r2app')
          				return { ok: false };
          			else if (req.args?.remove)
          				c.delete('xlite', id);
          			else {
          				if (req.args?.on != null) c.set('xlite', id, 'on', req.args.on ? '1' : '0');
          				if (req.args?.domains != null && req.args.domains != '') {
          					let l = filter(split(lc(req.args.domains), /[\s,]+/), (x) => match(x, /^[a-z0-9.-]{3,200}$/));
          					c.set('xlite', id, 'domain', l);
          				}
          			}
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true, id };
          		}
          	},

          	device_route: {
          		args: { id: '', route: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), route = req.args?.route ?? 'vpn';
          			if (!match(id, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/) || index([ 'vpn', 'warp', 'direct' ], route) < 0)
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (c.get('xlite', sid) != 'device') { c.set('xlite', sid, 'device'); c.set('xlite', sid, 'id', id); }
          			if (route == 'vpn') c.delete('xlite', sid, 'route'); else c.set('xlite', sid, 'route', route);
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	block_device: {
          		args: { mac: '', on: false },
          		call: function(req) {
          			let c = uci(), mac = lc(req.args?.mac ?? ''), on = !!req.args?.on;
          			if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          				return { ok: false };
          			let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          			if (on) push(l, mac);
          			c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          			c.save('xlite');
          			c.commit('xlite');
          			system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          			return { ok: true, blocked: l };
          		}
          	},

          	bot_test: {
          		call: function() {
          			let c = uci(), tok = c.get('xlite', 'main', 'bot_token'), chat = c.get('xlite', 'main', 'bot_chat');
          			if (!tok || !chat)
          				return { ok: false, error: chat ? 'حط التوكن' : 'افتح البوت بتلجرام واكتب /start أول' };
          			let f = TMP + '/bot-test.json';
          			writejson(f, { chat_id: chat, text: '✅ رسالة تجربة من XLite' });
          			let socks = +(c.get('xlite', 'main', 'socks_port') ?? 0);
          			let url = "'https://api.telegram.org/bot" + replace(tok, /[^0-9A-Za-z:_-]/g, '') + "/sendMessage'";
          			let out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${socks > 0 ? '--socks5-hostname 127.0.0.1:' + socks : ''} ${url} 2>/dev/null`);
          			if (!match(out, /"ok":true/))
          				out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${url} 2>/dev/null`);
          			fs.unlink(f);
          			return { ok: !!match(out, /"ok":true/) };
          		}
          	},

          	adblock_update: {
          		call: function() {
          			bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			return { ok: true };
          		}
          	},

          	// backup: the whole /etc/config/xlite (servers, subscriptions, settings, apps, device names)
          	backup: {
          		call: function() {
          			return { name: 'xlite-backup.conf', text: fs.readfile(getenv('XLITE_UCI_DIR') ? getenv('XLITE_UCI_DIR') + '/xlite' : '/etc/config/xlite') ?? '' };
          		}
          	},

          	restore: {
          		args: { text: '' },
          		call: function(req) {
          			let t = req.args?.text ?? '';
          			// only an XLite config: uci syntax, a main section, nothing else on a line
          			if (length(t) > 512000 || !match(t, /config xlite 'main'/))
          				return { ok: false, error: 'هذا مو ملف نسخة احتياطية من XLite' };
          			for (let l in split(t, '\n'))
          				if (!match(l, /^(\s*|\s*(config|option|list) .*|\s*#.*)$/))
          					return { ok: false, error: 'الملف بيه أسطر غريبة' };
          			let tmp = '/tmp/xlite-restore.conf';
          			fs.writefile(tmp, t);
          			let chk = system('uci -q -c /tmp import xlite-check < ' + tmp + ' > /dev/null 2>&1');
          			fs.unlink('/tmp/xlite-check');
          			if (chk != 0) {
          				fs.unlink(tmp);
          				return { ok: false, error: 'الملف خربان' };
          			}
          			system('cp /etc/config/xlite /etc/xlite/config.before-restore 2>/dev/null; mkdir -p /etc/xlite; cp ' + tmp + ' /etc/config/xlite; rm -f ' + tmp);
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	uninstall: {
          		call: function() {
          			bg('sleep 2; /usr/bin/xlite uninstall', '/tmp/xlite-uninstall.log');
          			return { ok: true };
          		}
          	},

          	ports: {
          		call: function() {
          			return port_list(net_cursor());
          		}
          	},

          	// the bonding page: every bonded line (address, gateway, counters, ping through it) and the ports
          	bond_status: {
          		call: function() {
          			let c = net_cursor(), m = c.get_all('xlite', 'main') ?? {};
          			let paused = words2(m.bond_paused), limits = pairs(m.bond_limits), probe = readjson(TMP + '/bond.json') ?? {}, calib = {};
          			// the last line measurement (Mb/s each), for the expected speed test total on the page
          			for (let l in split(fs.readfile(TMP + '/calib.txt') ?? '', '\n')) { let x = match(trim(l), /^([A-Za-z0-9_-]+) ([0-9.]+)/); if (x) calib[x[1]] = int(+x[2] * 8 / 1e5) / 10; }
          			let lines = [];
          			for (let i in words2(m.bond_ifaces)) {
          				let j = null;
          				try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          				let dev = j?.l3_device ?? j?.device ?? c.get('network', i, 'device') ?? i, gw = null;
          				for (let r in j?.route ?? [])
          					if (r.target == '0.0.0.0' && r.mask == 0 && r.nexthop != '0.0.0.0') gw = r.nexthop;
          				let kind = is_usb(dev) ? 'usb' : fs.stat('/sys/class/net/' + dev + '/phy80211') ? 'wifi' : (match(i, /^xw_/) ? 'lan' : 'wan');
          				let base = '/sys/class/net/' + dev + '/statistics/', pr = probe[i];
          				let state = (index(paused, i) >= 0) ? 'paused' : (!j?.up || pr?.ok === false) ? 'down' : 'active';
          				push(lines, { iface: i, dev, kind, label: line_label(i, dev, kind), state, ip: j?.['ipv4-address']?.[0]?.address ?? '', gw: gw ?? '',
          					ping: pr?.ok ? pr.ms : null, loss: pr?.loss, mbps: calib[i], weight: pairs(m.bond_weights)[i] ?? 1, addr: line_addr(m, i), rx: +trim(fs.readfile(base + 'rx_bytes') ?? '0'), tx: +trim(fs.readfile(base + 'tx_bytes') ?? '0'), limit: limits[i] ?? 0 });
          			}
          			let p = port_list(c);
          			let st0 = readjson(RUN + '/state.json') ?? {};
          			let lab = {}; for (let x in lines) lab[x.iface] = x.label;
          			let evs = map(readjson(TMP + '/bond_events.json') ?? [], (e) => ({ ...e, label: lab[e.iface] ?? e.iface }));
          			return { events: evs, cf: is_cf(st0.ip), server_ip: st0.ip ?? '', autocal: m.bond_autocal != '0', on: m.bond == '1', mode: m.bond_mode || 'rr', auto: m.bond_auto != '0', alert: m.bond_alert != '0', lines, ports: p.ports, dsa: p.dsa,
          				now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0] };
          		}
          	},

          	// one change from the bonding page: on/off, mode, a line paused, a line's speed cap, the switches
          	bond_set: {
          		args: { key: '', iface: '', value: '' },
          		call: function(req) {
          			let k = req.args?.key ?? '', i = req.args?.iface ?? '', v = '' + (req.args?.value ?? '');
          			let c = uci();
          			if (i != '' && !match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			if (k == 'on' || k == 'auto' || k == 'alert' || k == 'autocal') {
          				if (v != '0' && v != '1') return { ok: false };
          				c.set('xlite', 'main', k == 'on' ? 'bond' : 'bond_' + k, v);
          			}
          			else if (k == 'mode') {
          				if (index([ 'rr', 'fast', 'backup' ], v) < 0) return { ok: false };
          				c.set('xlite', 'main', 'bond_mode', v);
          			}
          			else if (k == 'pause') {
          				let l = filter(words2(c.get('xlite', 'main', 'bond_paused')), (x) => x != i);
          				if (v == '1') push(l, i);
          				c.set('xlite', 'main', 'bond_paused', join(' ', l));
          			}
          			else if (k == 'addr') {
          				if (v != '' && !match(v, /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/)) return { ok: false };
          				let l = {}, out = [];
          				for (let w in words2(c.get('xlite', 'main', 'bond_addr'))) { let mm = match(w, /^([A-Za-z0-9_-]+):(.+)$/); if (mm) l[mm[1]] = mm[2]; }
          				if (v == '') delete l[i]; else l[i] = v;
          				for (let n2, a in l) push(out, n2 + ':' + a);
          				c.set('xlite', 'main', 'bond_addr', join(' ', out));
          			}
          			else if (k == 'weights') {
          				let out = [];
          				for (let w in words2(v)) { let mm = match(w, /^([A-Za-z0-9_-]{1,15}):([1-8])$/); if (!mm) return { ok: false }; if (+mm[2] > 1) push(out, w); }
          				c.set('xlite', 'main', 'bond_weights', join(' ', out));
          			}
          			else if (k == 'weight') {
          				if (!match(v, /^[1-8]$/)) return { ok: false };
          				let l = pairs(c.get('xlite', 'main', 'bond_weights')), out = [];
          				l[i] = +v;
          				for (let n2, w in l) if (w > 1) push(out, n2 + ':' + w);
          				c.set('xlite', 'main', 'bond_weights', join(' ', out));
          			}
          			else if (k == 'limit') {
          				if (!match(v, /^[0-9]{1,4}$/)) return { ok: false };
          				let l = pairs(c.get('xlite', 'main', 'bond_limits')), out = [];
          				l[i] = +v;
          				for (let n, mb in l) if (mb > 0) push(out, n + ':' + mb);
          				c.set('xlite', 'main', 'bond_limits', join(' ', out));
          			}
          			else
          				return { ok: false };
          			c.save('xlite'); c.commit('xlite');
          			// the alert switch is read by the monitor; everything else rebuilds the core
          			if (k != 'alert' && k != 'autocal' && c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	// Wi-Fi as a line: the router's radio joins another network (client mode) and that becomes a bonded line
          	wifi_radios: {
          		call: function() {
          			let c = net_cursor(), st = null, r = [];
          			c.load('wireless');
          			try { st = json(sh('ubus call network.wireless status 2>/dev/null')); } catch (e) {}
          			c.foreach('wireless', 'wifi-device', (d) => {
          				let name = d['.name'], s = st?.[name] ?? {}, sta = c.get_all('wireless', 'xw_' + name);
          				let band = d.band ?? (match(d.hwmode ?? '', /a/) ? '5g' : '2g');
          				let ap = null;
          				for (let i in s.interfaces ?? []) if (i.config?.mode == 'ap' && i.ifname) { ap = i; break; }
          				let line = null;
          				if (sta) {
          					let j = null, dev = null;
          					for (let i in s.interfaces ?? []) if (i.section == 'xw_' + name) dev = i.ifname;
          					try { j = json(sh('ubus call network.interface.xw_' + name + ' status 2>/dev/null')); } catch (e) {}
          					line = { ssid: sta.ssid, on: sta.disabled != '1', up: !!j?.up, dev, ip: j?.['ipv4-address']?.[0]?.address ?? '' };
          				}
          				push(r, { radio: name, band, channel: d.channel ?? 'auto', up: !!s.up, ap: ap ? ap.config?.ssid : null, line });
          			});
          			return { radios: r };
          		}
          	},

          	// a scan can take 10 s or more, and rpcd answers one call at a time: it runs in the background (the whole
          	// page froze while it waited), the page asks for the result
          	wifi_scan: {
          		args: { radio: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/))
          				return { ok: false };
          			let st = null, ifn = null;
          			try { st = json(sh('ubus call network.wireless status 2>/dev/null')); } catch (e) {}
          			for (let i in st?.[rd]?.interfaces ?? []) if (i.ifname) { ifn = i.ifname; break; }
          			if (!ifn)
          				return { ok: false, error: 'الراديو مطفي أو ما بيه شبكة شغالة: شغّله من إعدادات الواي فاي أول' };
          			if (!match(ifn, /^[A-Za-z0-9._-]{1,15}$/))
          				return { ok: false };
          			let f = TMP + '/scan-' + rd + '.json';
          			fs.mkdir(TMP);
          			fs.unlink(f);
          			system(`( { command -v timeout > /dev/null 2>&1 && T="timeout 25"; $T ubus -t 25 call iwinfo scan '{"device":"${ifn}"}' > ${f}.tmp 2>/dev/null; } ; mv -f ${f}.tmp ${f} ) > /dev/null 2>&1 &`);
          			return { ok: true, pending: true };
          		}
          	},

          	wifi_scan_result: {
          		args: { radio: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/))
          				return { ok: false };
          			let t = fs.readfile(TMP + '/scan-' + rd + '.json');
          			if (t == null)
          				return { ok: true, pending: true };
          			let j = null;
          			try { j = json(t); } catch (e) {}
          			if (!j?.results)
          				return { ok: false, error: 'الراديو ما رجّع نتيجة: جرب مرة ثانية' };
          			let seen = {}, out = [];
          			for (let n in j.results) {
          				if (!n.ssid || seen[n.ssid] && seen[n.ssid].signal >= n.signal)
          					continue;
          				let e = n.encryption ?? {}, a = e.authentication ?? [], enc = 'none';
          				if (e.enabled) enc = (index(a, 'sae') >= 0) ? (index(a, 'psk') >= 0 ? 'sae-mixed' : 'sae') : (length(e.wpa ?? []) > 1 ? 'psk-mixed' : (index(e.wpa ?? [], 1) >= 0 && length(e.wpa) == 1 ? 'psk' : 'psk2'));
          				seen[n.ssid] = { ssid: n.ssid, bssid: n.bssid, signal: n.signal, quality: n.quality, max: n.quality_max, channel: n.channel, enc };
          			}
          			for (let k, v in seen) push(out, v);
          			out = sort(out, (x, y) => (y.signal ?? -100) - (x.signal ?? -100));
          			return { ok: true, nets: out };
          		}
          	},

          	wifi_connect: {
          		args: { radio: '', ssid: '', key: '', enc: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '', ssid = req.args?.ssid ?? '', key = req.args?.key ?? '', enc = req.args?.enc ?? 'psk2';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/) || length(ssid) < 1 || length(ssid) > 32 || index([ 'none', 'psk', 'psk2', 'psk-mixed', 'sae', 'sae-mixed' ], enc) < 0)
          				return { ok: false, error: 'بيانات غير صحيحة' };
          			if (enc != 'none' && (length(key) < 8 || length(key) > 63))
          				return { ok: false, error: 'الباسورد لازم من 8 إلى 63 حرف' };
          			let c = net_cursor(), iface = 'xw_' + rd, sec = 'xw_' + rd, wz = null;
          			c.load('wireless'); c.load('firewall');
          			if (c.get('wireless', rd) != 'wifi-device')
          				return { ok: false, error: 'ماكو هيج راديو' };
          			c.foreach('firewall', 'zone', (s) => { if (s.name == 'wan') wz = s['.name']; });
          			if (!wz)
          				return { ok: false, error: 'ماكو زون wan بالفايروول' };
          			c.set('wireless', sec, 'wifi-iface');
          			for (let k, v in { device: rd, mode: 'sta', network: iface, ssid, encryption: enc, disabled: '0' }) c.set('wireless', sec, k, v);
          			if (enc == 'none') c.delete('wireless', sec, 'key'); else c.set('wireless', sec, 'key', key);
          			c.set('network', iface, 'interface');
          			c.set('network', iface, 'proto', 'dhcp');
          			let n = 0;
          			c.foreach('network', 'interface', (s) => { if (match(s['.name'], /^xw_/)) n++; });
          			if (!c.get('network', iface, 'metric')) c.set('network', iface, 'metric', '' + (10 + n));
          			let nets = c.get('firewall', wz, 'network') ?? [];
          			if (type(nets) != 'array') nets = split(nets, ' ');
          			if (index(nets, iface) < 0) push(nets, iface);
          			c.set('firewall', wz, 'network', nets);
          			let bond = words2(c.get('xlite', 'main', 'bond_ifaces'));
          			if (!length(bond)) push(bond, 'wan');
          			if (index(bond, iface) < 0) push(bond, iface);
          			c.set('xlite', 'main', 'bond_ifaces', join(' ', bond));
          			c.set('xlite', 'main', 'bond', '1');
          			for (let k in [ 'wireless', 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			system('( sleep 1; /etc/init.d/network reload; wifi reload; /etc/init.d/firewall reload; [ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart ) > /dev/null 2>&1 &');
          			return { ok: true, iface };
          		}
          	},

          	// on / off keeps the network and its password; remove forgets it
          	wifi_set: {
          		args: { radio: '', action: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '', act = req.args?.action ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/) || index([ 'on', 'off', 'remove' ], act) < 0)
          				return { ok: false };
          			let c = net_cursor(), sec = 'xw_' + rd;
          			c.load('wireless'); c.load('firewall');
          			if (c.get('wireless', sec) != 'wifi-iface')
          				return { ok: false, error: 'ما مربوط بشبكة' };
          			if (act == 'remove') {
          				c.delete('wireless', sec);
          				c.delete('network', sec);
          				c.foreach('firewall', 'zone', (s) => {
          					let nets = s.network ?? [];
          					if (type(nets) != 'array') nets = split(nets, ' ');
          					if (index(nets, sec) >= 0) c.set('firewall', s['.name'], 'network', filter(nets, (x) => x != sec));
          				});
          				c.set('xlite', 'main', 'bond_ifaces', join(' ', filter(words2(c.get('xlite', 'main', 'bond_ifaces')), (x) => x != sec)));
          			}
          			else
          				c.set('wireless', sec, 'disabled', act == 'on' ? '0' : '1');
          			for (let k in [ 'wireless', 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			system('( sleep 1; wifi reload; /etc/init.d/network reload; /etc/init.d/firewall reload; [ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart ) > /dev/null 2>&1 &');
          			return { ok: true };
          		}
          	},

          	// "why is the internet not working": every link of the chain in order, the first broken one is the answer
          	diagnose: {
          		call: function() {
          			let c = uci(), m = c.get_all('xlite', 'main') ?? {}, st = readjson(RUN + '/state.json') ?? {}, r = [];
          			let add = (id, ok, title, detail, fix) => push(r, { id, ok, title, detail: detail ?? '', fix: fix ?? '' });
          			// 1. the clock: TLS servers refuse a router that lives in another year
          			let y = +localtime().year;
          			add('clock', y >= 2025, 'ساعة الراوتر', 'السنة بالراوتر ' + y, 'صحّح الوقت: System ‹ System ‹ Sync with browser، أو فعّل NTP');
          			// 2. the line itself, without the VPN (ICMP never goes into the tunnel)
          			let gw = trim(sh("ip -4 route show default 2>/dev/null | sed -n 's/.*via \\([0-9.]*\\).*/\\1/p' | head -n 1"));
          			// the slow probes all at once (rpcd answers nothing else while this call runs): about 6 s in all
          			let D = TMP + '/diag', socks0 = +(m.socks_port ?? 0), srvp = +(st.port ?? 0) || 443;
          			fs.mkdir(TMP); fs.mkdir(D);
          			let par = `cd ${D} && rm -f gw n1 srv tun dns dnst; ` +
          				(gw != '' ? `( ping -c 1 -W 2 ${shq(gw)} > gw 2>&1 ) & ` : '') +
          				`( ping -c 2 -W 2 1.1.1.1 > n1 2>&1 || ping -c 2 -W 2 8.8.8.8 > n1 2>&1 ) & ` +
          				(st.ip ? `( curl -s --noproxy '*' -o /dev/null --connect-timeout 4 -m 5 -w '%{time_connect}' 'http://${st.ip}:${srvp}/' > srv 2>/dev/null ) & ` : '') +
          				((m.enabled == '1' && socks0 > 0) ? `( curl -s -o /dev/null -m 6 -w '%{http_code}' --socks5-hostname 127.0.0.1:${socks0} http://cp.cloudflare.com/generate_204 > tun 2>/dev/null ) & ` : '') +
          				`( a=$(date +%s); nslookup google.com 127.0.0.1 > dns 2>/dev/null; echo $(( $(date +%s) - a )) > dnst ) & wait`;
          			sh(par);
          			let rd = (n) => fs.readfile(D + '/' + n) ?? '';
          			let gwok = gw != '' && match(rd('gw'), /bytes from/);
          			add('gateway', !!gwok, 'الراوتر يوصل للموديم', gw ? 'البوابة ' + gw : 'ماكو طريق افتراضي', 'تأكد من كيبل الـ WAN والموديم، وإن الراوتر ماخذ IP من الموديم');
          			let net = match(rd('n1'), /bytes from/);
          			// some modems never answer a ping: a line that reaches the internet has its gateway
          			if (net) r[length(r) - 1].ok = true;
          			add('line', !!net, 'الخط بيه نت (بدون VPN)', net ? 'يوصل للإنترنت' : 'ما يوصل للإنترنت حتى بدون VPN', 'المشكلة من الخط أو الشركة، مو من الأداة. جرب تطفي الأداة');
          			// 3. the tool
          			let on = m.enabled == '1';
          			add('enabled', on, 'الأداة شغالة', on ? '' : 'الأداة مطفية', 'شغّلها من الصفحة الرئيسية');
          			let pid = core_pid();
          			add('core', !on || !!pid, 'النواة (Xray) شغالة', pid ? 'رقم العملية ' + pid : 'النواة واقفة', 'شغّل الأداة من جديد. إذا رجعت توكف، شوف السجل');
          			let rules = system('nft list table inet xlite > /dev/null 2>&1') == 0;
          			add('rules', !on || m.transparent == 'off' || rules, 'قواعد التوجيه محمّلة', rules ? '' : 'الترافيك ما يمر بالأداة', 'أعد تشغيل الأداة');
          			// 4. the server: reachable from the line, then working through the tunnel
          			if (st.ip) {
          				let o = trim(rd('srv'));
          				let ms = (+o > 0) ? int(+o * 1000 + 0.5) : null;
          				add('server', ms != null, 'السيرفر يرد', ms != null ? (st.name ?? '') + ' · ' + ms + ' ms' : 'ما يرد على ' + st.ip, 'السيرفر واقف أو محجوب: جرب سيرفر ثاني');
          				if (ms != null && ms > 600)
          					add('server_slow', false, 'بنك السيرفر عالي', ms + ' ms', 'السيرفر بعيد أو مزدحم: جرب سيرفر أقرب');
          			}
          			let socks = +(m.socks_port ?? 0);
          			if (on && pid && socks > 0) {
          				let o = trim(rd('tun'));
          				add('tunnel', o == '204', 'النت يمر من السيرفر', o == '204' ? 'يشتغل' : 'السيرفر يرد بس ما يعدّي الترافيك (' + (o || 'بدون جواب') + ')', 'غالباً الكود غلط (UUID أو المسار أو SNI): راجع تعديل السيرفر');
          			}
          			// 5. DNS: the answer devices get
          			let dns = [ rd('dns'), +trim(rd('dnst')) ];
          			// the server's own "Address: 127.0.0.1#53" line comes before "Name:": only an address after it is an answer
          			let ans = (index(dns[0], 'Name:') >= 0) ? substr(dns[0], index(dns[0], 'Name:')) : '';
          			let dok = !!match(ans, /Address[^0-9]*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/);
          			add('dns', dok, 'DNS يجاوب', dok ? 'google.com يتحل' + (dns[1] > 2 ? ' بس ببطء (' + dns[1] + ' ث)' : '') : 'الأسماء ما تتحل', 'جرب وضع "منع الاختطاف بس" بقسم منع تلاعب DNS');
          			let ap = m.antipollution ?? 'none';
          			if (on && pid && (ap != 'none' || m.special == 'fakedns')) {
          				let lis = match(sh('netstat -lnu 2>/dev/null'), /127\.0\.0\.1:15353/);
          				add('core_dns', !!lis, 'DNS النواة شغال', lis ? '' : 'النواة ما تستقبل أسئلة DNS', 'أعد تشغيل الأداة');
          			}
          			if (system('pidof dnsmasq > /dev/null 2>&1') != 0)
          				add('dnsmasq', false, 'dnsmasq شغال', 'خدمة DNS والـ DHCP واقفة', '/etc/init.d/dnsmasq restart');
          			// 6. the second server and the bonded lines, when used
          			let mon = readjson(TMP + '/mon.json') ?? {};
          			if (st.second && mon.health?.second)
          				add('second', !!mon.health.second.ok, 'السيرفر الثاني يشتغل', st.second.name ?? '', 'التطبيقات العراقية ترجع للرئيسي لحد ما يرجع');
          			if (m.bond == '1' && length(keys(readjson(TMP + '/bond.json') ?? {}))) {
          				let b = readjson(TMP + '/bond.json') ?? {}, dead = [];
          				for (let k, v in b) if (!v.ok) push(dead, k);
          				add('bond', !length(dead), 'خطوط الدمج', length(dead) ? 'واكفة: ' + join('، ', dead) : length(keys(b)) + ' خطوط تشتغل', 'افحص كيبل أو مودم الخط الواكف من تبويب الدمج');
          			}
          			// 7. the router itself
          			let mi = {};
          			for (let l in split(fs.readfile('/proc/meminfo') ?? '', '\n')) { let x = match(l, /^(MemAvailable): +([0-9]+)/); if (x) mi[x[1]] = +x[2]; }
          			add('memory', (mi.MemAvailable ?? 99999) > 12000, 'ذاكرة الراوتر', int((mi.MemAvailable ?? 0) / 1024) + ' MB فاضية', 'الذاكرة قليلة: صغّر قائمة الإعلانات أو كاش DNS');
          			let bad = filter(r, (x) => !x.ok);
          			return { ok: !length(bad), checks: r, first: length(bad) ? bad[0].id : null, t: time() };
          		}
          	},

          	// fastest Cloudflare edge for one line: about 24 addresses timed at once through that line, in the background
          	bond_scan: {
          		args: { iface: '' },
          		call: function(req) {
          			let i = req.args?.iface ?? '';
          			if (!match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			let j = null, st = readjson(RUN + '/state.json') ?? {};
          			try { j = json(sh('ubus call network.interface.' + i + ' status 2>/dev/null')); } catch (e) {}
          			let dev = j?.l3_device, port = +(st.port ?? 0) || 443;
          			if (!dev || !match(dev, /^[A-Za-z0-9._-]{1,15}$/))
          				return { ok: false, error: 'الخط مو شغّال' };
          			let cand = [ st.ip ], rb = fs.readfile('/dev/urandom', 48) ?? '', ri = 0;
          			let rnd = (n) => (ord(rb, ri++ % 48) ?? 7) % n;
          			for (let k = 0; k < 24; k++) {
          				let n = CF_NETS[k % length(CF_NETS)], p = split(n, '.');
          				let ip = n + '.' + (length(p) == 2 ? (rnd(254) + 1) + '.' : '') + (rnd(253) + 1);
          				if (index(cand, ip) < 0) push(cand, ip);
          			}
          			let f = TMP + '/cfscan-' + i, cmd = '';
          			for (let ip in cand)
          				if (match(ip ?? '', /^[0-9.]+$/))
          					cmd += `( printf '%s %s\\n' ${ip} "$(curl -s --noproxy '*' --interface ${dev} -o /dev/null --connect-timeout 2 -m 3 -w '%{time_connect}' 'http://${ip}:${port}/' 2>/dev/null)" ) & `;
          			fs.mkdir(TMP);
          			fs.unlink(f);
          			system(`( { ${cmd} wait; } > ${f}.tmp 2>/dev/null; mv -f ${f}.tmp ${f} ) > /dev/null 2>&1 &`);
          			return { ok: true, pending: true };
          		}
          	},

          	bond_scan_result: {
          		args: { iface: '' },
          		call: function(req) {
          			let i = req.args?.iface ?? '';
          			if (!match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			let t = fs.readfile(TMP + '/cfscan-' + i);
          			if (t == null)
          				return { ok: true, pending: true };
          			let st = readjson(RUN + '/state.json') ?? {}, r = [];
          			for (let l in split(t, '\n')) {
          				let x = split(trim(l), ' ');
          				if (match(x[0] ?? '', /^[0-9.]+$/) && +(x[1] ?? 0) > 0)
          					push(r, { ip: x[0], ms: int(+x[1] * 1000 + 0.5), current: x[0] == st.ip });
          			}
          			r = sort(r, (a, b) => a.ms - b.ms);
          			return { ok: true, list: slice(r, 0, 8) };
          		}
          	},

          	// measure every line through its own tunnel, one after the other (a line alone, about 7 s each), in the
          	// background; the result proposes each line's share in proportion to its speed
          	bond_calibrate: {
          		call: function() {
          			let st = readjson(RUN + '/state.json') ?? {}, used = st.bond_used ?? [];
          			if (length(used) < 2)
          				return { ok: false, error: 'الدمج لازم يكون شغال بخطين أو أكثر' };
          			// every line at once, two connections each, 8 s: the lines loaded together the way a speed test loads
          			// them (a lossy line then shows its real share, and one connection alone does not fill a fast line)
          			let f = TMP + '/calib.txt', cmd = '', url = "'https://speed.cloudflare.com/__down?bytes=500000000'";
          			for (let i, n in used)
          				if (match(n, /^[A-Za-z0-9_-]{1,15}$/)) {
          					let c1 = `curl -s -o /dev/null -m 8 -w '%{speed_download}' --socks5-hostname 127.0.0.1:${20180 + i} ${url} 2>/dev/null`;
          					// each connection writes its own file: a variable set in a background job never reaches the parent
          					cmd += `( ${c1} > ${f}.${n}.a & ${c1} > ${f}.${n}.b; wait; echo "${n} $(awk -v a="$(cat ${f}.${n}.a)" -v b="$(cat ${f}.${n}.b)" 'BEGIN { printf "%d", a + b }')" >> ${f}.tmp; rm -f ${f}.${n}.a ${f}.${n}.b ) & `;
          				}
          			fs.mkdir(TMP); fs.unlink(f); fs.unlink(f + '.tmp');
          			system(`( ${cmd} wait; mv -f ${f}.tmp ${f} ) > /dev/null 2>&1 &`);
          			return { ok: true, pending: true, lines: length(used) };
          		}
          	},

          	bond_calibrate_result: {
          		call: function() {
          			let t = fs.readfile(TMP + '/calib.txt');
          			if (t == null) {
          				let p = fs.readfile(TMP + '/calib.txt.tmp') ?? '';
          				return { ok: true, pending: true, done: length(filter(split(p, '\n'), (x) => match(x, / [0-9]/))) };
          			}
          			let r = [], max = 0;
          			for (let l in split(t, '\n')) {
          				let m = match(trim(l), /^([A-Za-z0-9_-]+) ([0-9.]+)/);
          				if (m) { let bps = +m[2]; push(r, { iface: m[1], mbps: int(bps * 8 / 1e5) / 10 }); if (bps > max) max = bps; }
          			}
          			for (let x in r)
          				x.weight = (max > 0 && x.mbps > 0) ? (int(8 * x.mbps * 1e6 / 8 / max + 0.5) || 1) : 1;
          			return { ok: true, lines: r };
          		}
          	},

          	// time a connection to the server through one line, now
          	bond_test: {
          		args: { iface: '' },
          		call: function(req) {
          			let i = req.args?.iface ?? '';
          			if (!match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			let j = null, st = readjson(RUN + '/state.json') ?? {};
          			try { j = json(sh('ubus call network.interface.' + i + ' status 2>/dev/null')); } catch (e) {}
          			let dev = j?.l3_device, port = +(st.port ?? 0) || 443;
          			if (!dev || !st.ip)
          				return { ok: false, error: 'الخط مو شغّال' };
          			let la = line_addr(uci().get_all('xlite', 'main') ?? {}, i) || st.ip;
          			let t = trim(sh(`curl -s --noproxy '*' --interface ${shq(dev)} -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' 'http://${la}:${port}/' 2>/dev/null`));
          			let ms = (+t > 0) ? int(+t * 1000 + 0.5) : null;
          			return { ok: ms != null, ms, error: ms == null ? 'ما وصل للسيرفر من خلال هذا الخط' : null };
          		}
          	},

          	// one port to its own WAN line (DHCP, wan zone, in the bonding) or back to the LAN
          	port_wan: {
          		args: { port: '', on: false },
          		call: function(req) {
          			let p = req.args?.port ?? '', on = !!req.args?.on;
          			if (!match(p, /^[A-Za-z0-9._-]{1,15}$/) || !fs.stat('/sys/class/net/' + p))
          				return { ok: false, error: 'منفذ غير معروف' };
          			let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          			c.load('network'); c.load('firewall'); c.load('xlite');
          			let iface = 'xw_' + replace(p, /[^A-Za-z0-9]/g, '_'), br = null, wz = null;
          			c.foreach('network', 'device', (s) => { if (s.name == 'br-lan') br = s['.name']; });
          			c.foreach('firewall', 'zone', (s) => { if (s.name == 'wan') wz = s['.name']; });
          			if (!wz)
          				return { ok: false, error: 'ماكو زون wan بالفايروول' };
          			let ports = br ? (c.get('network', br, 'ports') ?? []) : [];
          			let nets = c.get('firewall', wz, 'network') ?? [];
          			if (type(nets) != 'array') nets = split(nets, ' ');
          			let bond = filter(split(c.get('xlite', 'main', 'bond_ifaces') ?? '', /[ ,]+/), (x) => x != '' && x != iface);
          			if (on) {
          				// keep one LAN port, or the router can only be reached over Wi-Fi
          				if (index(ports, p) >= 0 && length(ports) < 2)
          					return { ok: false, error: 'هذا آخر منفذ LAN، ما ينحول' };
          				if (index(ports, p) >= 0)
          					c.set('network', br, 'ports', filter(ports, (x) => x != p));
          				c.set('network', iface, 'interface');
          				c.set('network', iface, 'proto', 'dhcp');
          				c.set('network', iface, 'device', p);
          				// every line its own default route: different metrics, or the kernel keeps only one
          				let n = 0;
          				c.foreach('network', 'interface', (s) => { if (match(s['.name'], /^xw_/)) n++; });
          				c.set('network', iface, 'metric', '' + (10 + n));
          				if (index(nets, iface) < 0) push(nets, iface);
          				if (!length(bond)) push(bond, 'wan');
          				push(bond, iface);
          				c.set('xlite', 'main', 'bond', '1');
          			}
          			else {
          				if (c.get('network', iface) != 'interface')
          					return { ok: false, error: 'هذا المنفذ ما محوّل من هنا' };
          				c.delete('network', iface);
          				nets = filter(nets, (x) => x != iface);
          				// a USB modem was never a LAN port
          				if (br && index(ports, p) < 0 && index(fs.readlink('/sys/class/net/' + p + '/device') ?? '', 'usb') < 0)
          					c.set('network', br, 'ports', [ ...ports, p ]);
          			}
          			c.set('firewall', wz, 'network', nets);
          			c.set('xlite', 'main', 'bond_ifaces', join(' ', bond));
          			for (let k in [ 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			// the page answers first: a network reload can drop its connection for a moment
          			system('( sleep 1; /etc/init.d/network reload; /etc/init.d/firewall reload; [ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart ) > /dev/null 2>&1 &');
          			return { ok: true, iface, bond };
          		}
          	},

          	lan_devices: {
          		call: function() {
          			let r = [];
          			for (let l in split(fs.readfile('/tmp/dhcp.leases') ?? '', '\n')) {
          				let f = split(trim(l), /\s+/);
          				if (length(f) >= 4 && match(f[2], /^[0-9.]+$/))
          					push(r, { ip: f[2], mac: f[1], name: f[3] != '*' ? f[3] : '' });
          			}
          			return { devices: r };
          		}
          	},

          	update: {
          		call: function() {
          			system('( /usr/bin/xlite update > /tmp/xlite-update.log 2>&1; echo "rc=$?" >> /tmp/xlite-update.log ) > /dev/null 2>&1 &');
          			return { ok: true };
          		}
          	},

          	update_state: {
          		call: function() {
          			return { log: fs.readfile('/tmp/xlite-update.log') ?? '' };
          		}
          	},

          	log: {
          		call: function() {
          			return { log: sh("logread 2>/dev/null | grep -E 'xlite|xray' | tail -n 60") };
          		}
          	}
          };

          return { xlite: methods };
          XLITE_FILE_5
          mkdir -p "$(dirname "src/usr/share/ucode/xlite/lib.uc")"
          cat > "src/usr/share/ucode/xlite/lib.uc" <<'XLITE_FILE_6'
          // XLite: share links -> xray outbounds, xray config and the nftables tproxy ruleset.
          'use strict';

          const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

          function b64decode(s) {
          	if (s == null)
          		return null;
          	s = replace(replace(trim('' + s), /-/g, '+'), /_/g, '/');
          	s = replace(s, /[^A-Za-z0-9+\/]/g, '');
          	if (type(b64dec) == 'function') {
          		let pad = s;
          		while (length(pad) % 4)
          			pad += '=';
          		let r = b64dec(pad);
          		if (r != null)
          			return r;
          	}
          	let out = '', bits = 0, nb = 0;
          	for (let i = 0; i < length(s); i++) {
          		let v = index(B64, substr(s, i, 1));
          		if (v < 0)
          			return null;
          		bits = ((bits << 6) | v) & 0xffffff;
          		nb += 6;
          		if (nb >= 8) {
          			nb -= 8;
          			out += chr((bits >> nb) & 0xff);
          		}
          	}
          	return out;
          }

          function urldecode(s) {
          	if (s == null)
          		return null;
          	return replace('' + s, /%([0-9A-Fa-f]{2})/g, (m, h) => chr(hex(h)));
          }

          function parse_query(q) {
          	let r = {};
          	for (let kv in split(q ?? '', '&')) {
          		if (kv == '')
          			continue;
          		let i = index(kv, '=');
          		let k = urldecode(i < 0 ? kv : substr(kv, 0, i));
          		r[k] = (i < 0) ? '' : urldecode(substr(kv, i + 1));
          	}
          	return r;
          }

          // scheme://userinfo@host:port?query#fragment  (host may be [v6])
          function parse_url(link) {
          	let m = match(link, /^([A-Za-z0-9+.-]+):\/\/([^#]*)(#(.*))?$/);
          	if (!m)
          		return null;
          	let rest = m[2], frag = urldecode(m[4] ?? '');
          	let q = '', qi = index(rest, '?');
          	if (qi >= 0) {
          		q = substr(rest, qi + 1);
          		rest = substr(rest, 0, qi);
          	}
          	rest = replace(rest, /\/+$/, '');
          	let user = null, at = rindex(rest, '@');
          	if (at >= 0) {
          		user = urldecode(substr(rest, 0, at));
          		rest = substr(rest, at + 1);
          	}
          	let host, port;
          	let hm = match(rest, /^\[([0-9A-Fa-f:.]+)\]:([0-9]+)$/) || match(rest, /^([^:]+):([0-9]+)$/);
          	if (hm) {
          		host = hm[1];
          		port = +hm[2];
          	}
          	else {
          		host = rest;
          		port = null;
          	}
          	return { scheme: lc(m[1]), user, host, port, query: parse_query(q), name: frag };
          }

          function csv(s) {
          	return filter(map(split(s ?? '', ','), (x) => trim(x)), (x) => x != '');
          }

          // One server = the fields of a share link, the same names v2rayA uses.
          function wg_obj(name, host, port, priv, pub, addr, reserved, mtu, psk) {
          	let res = filter(map(split(reserved ?? '', ','), (x) => trim(x)), (x) => x != '');
          	return {
          		protocol: 'wireguard', name: name ?? '', address: host, port: +port, secret: trim(priv), pubkey: trim(pub),
          		local: csv(addr), reserved: length(res) == 3 ? map(res, (x) => +x) : null, mtu: +(mtu || 0) || 1280,
          		psk: trim(psk ?? ''), net: 'udp', security: 'none'
          	};
          }

          // a wg-quick .conf pasted as is
          function wg_conf(text) {
          	let sec = '', i = {}, p = {};
          	for (let l in split(text, /\r?\n/)) {
          		l = trim(replace(l, /#.*$/, ''));
          		let m = match(l, /^\[(.+)\]$/);
          		if (m) { sec = lc(m[1]); continue; }
          		m = match(l, /^([A-Za-z]+) *= *(.+)$/);
          		if (!m) continue;
          		let k = lc(m[1]);
          		if (sec == 'interface') i[k] = (i[k] ? i[k] + ',' : '') + trim(m[2]);
          		else if (sec == 'peer' && p[k] == null) p[k] = trim(m[2]);
          	}
          	let ep = match(p.endpoint ?? '', /^\[(.*)\]:([0-9]+)$/) || match(p.endpoint ?? '', /^([^:]+):([0-9]+)$/);
          	if (!i.privatekey || !p.publickey || !ep)
          		return { error: 'ملف wireguard ناقص (PrivateKey و PublicKey و Endpoint)' };
          	return wg_obj('', ep[1], ep[2], i.privatekey, p.publickey, i.address, '', i.mtu, p.presharedkey);
          }

          function wg_link(s) {
          	let enc = (x) => replace(replace(replace(x, /%/g, '%25'), /\+/g, '%2B'), /\//g, '%2F');
          	let h = (index(s.address, ':') >= 0) ? '[' + s.address + ']' : s.address;
          	let q = 'publickey=' + enc(s.pubkey) + '&address=' + enc(join(',', s.local)) + '&mtu=' + s.mtu;
          	if (s.reserved) q += '&reserved=' + join(',', s.reserved);
          	if (s.psk) q += '&presharedkey=' + enc(s.psk);
          	return 'wireguard://' + enc(s.secret) + '@' + h + ':' + s.port + '?' + q + '#' + enc(s.name || s.address);
          }

          function parse_link(link) {
          	link = trim('' + (link ?? ''));
          	let scheme = lc(match(link, /^([A-Za-z0-9+.-]+):\/\//)?.[1] ?? '');
          	let s;

          	if (scheme == 'vmess') {
          		let j = null;
          		try { j = json(b64decode(substr(link, 8))); } catch (e) { j = null; }
          		if (type(j) != 'object')
          			return { error: 'رابط vmess غير صالح' };
          		s = {
          			protocol: 'vmess', name: j.ps ?? '', address: j.add ?? '', port: +(j.port ?? 0),
          			id: j.id ?? '', aid: +(j.aid ?? 0), scy: j.scy ?? 'auto', net: j.net || 'tcp',
          			type: j.type || 'none', host: j.host ?? '', path: j.path ?? '',
          			security: (j.tls == 'tls' || j.tls == 'reality') ? j.tls : 'none',
          			sni: j.sni ?? '', alpn: j.alpn ?? '', fp: j.fp ?? ''
          		};
          	}
          	else if (scheme == 'vless' || scheme == 'trojan') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'الرابط ناقص: لازم يكون ' + scheme + '://...@العنوان:البورت' };
          		let q = u.query;
          		s = {
          			protocol: scheme, name: u.name ?? '', address: u.host, port: u.port,
          			id: u.user ?? '', net: q.type || 'tcp', type: q.headerType || 'none',
          			host: q.host ?? '', path: q.path ?? '', security: q.security || (scheme == 'trojan' ? 'tls' : 'none'),
          			sni: q.sni ?? q.peer ?? '', alpn: q.alpn ?? '', fp: q.fp ?? '', pbk: q.pbk ?? '', sid: q.sid ?? '',
          			spx: q.spx ?? '', flow: q.flow ?? '', mode: q.mode ?? '', service: q.serviceName ?? '',
          			insecure: (q.allowInsecure == '1' || q.allowInsecure == 'true' || q.insecure == '1')
          		};
          		if (s.net == 'grpc' && s.service != '')
          			s.path = s.service;
          	}
          	else if (scheme == 'ss') {
          		let u = parse_url(link), method, pass, host, port;
          		if (u && u.user != null && u.port) {
          			let ui = u.user;
          			if (index(ui, ':') < 0)
          				ui = b64decode(ui) ?? '';
          			let c = index(ui, ':');
          			method = substr(ui, 0, c); pass = substr(ui, c + 1);
          			host = u.host; port = u.port;
          		}
          		else {
          			let m = match(link, /^ss:\/\/([^#@?]+)(#(.*))?$/);
          			let d = m ? b64decode(m[1]) : null;
          			let mm = d ? match(d, /^([^:]+):(.*)@([^@]+):([0-9]+)$/) : null;
          			if (!mm)
          				return { error: 'رابط shadowsocks غير صالح' };
          			method = mm[1]; pass = mm[2]; host = replace(mm[3], /^\[|\]$/g, ''); port = +mm[4];
          			u = { name: urldecode(m[3] ?? '') };
          		}
          		s = { protocol: 'shadowsocks', name: u.name ?? '', address: host, port, method, password: pass, net: 'tcp', security: 'none' };
          	}
          	else if (scheme == 'wireguard' || scheme == 'wg') {
          		let u = parse_url(link);
          		if (!u || !u.port || !u.user)
          			return { error: 'رابط wireguard ناقص' };
          		let q = u.query;
          		s = wg_obj(u.name, u.host, u.port, u.user, q.publickey ?? q.publicKey ?? q.peer_public_key ?? '',
          			q.address ?? q.ip ?? '', q.reserved ?? '', q.mtu ?? '', q.presharedkey ?? q.psk ?? '');
          	}
          	else if (scheme == 'socks' || scheme == 'socks5' || scheme == 'http' || scheme == 'https') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'رابط ' + scheme + ' ناقص' };
          		let user = u.user, pass = null;
          		if (user != null && index(user, ':') < 0 && scheme != 'http' && scheme != 'https') {
          			let d = b64decode(user);
          			if (d && index(d, ':') > 0)
          				user = d;
          		}
          		if (user != null && index(user, ':') >= 0) {
          			pass = substr(user, index(user, ':') + 1);
          			user = substr(user, 0, index(user, ':'));
          		}
          		s = { protocol: (scheme == 'socks5') ? 'socks' : (scheme == 'https' ? 'http' : scheme), name: u.name ?? '',
          			address: u.host, port: u.port, user, pass, net: 'tcp', security: (scheme == 'https') ? 'tls' : 'none' };
          	}
          	else if (index(link, '[Interface]') >= 0)
          		s = wg_conf(link);
          	else
          		return { error: 'نوع الرابط غير مدعوم (المدعوم: vless و vmess و trojan و ss و wireguard و socks و http)' };
          	if (s.error)
          		return s;

          	if (lc(s.net) == 'raw')
          		s.net = 'tcp';
          	// Xray 25 removed these transports: the core would refuse the whole config and never start
          	if (index([ 'h2', 'http', 'quic' ], lc(s.net ?? '')) >= 0)
          		return { error: 'النقل ' + s.net + ' انشال من نواة Xray 25: السيرفر لازم يستخدم xhttp أو ws أو grpc أو tcp' };
          	if (!s.address || !(s.port > 0 && s.port < 65536))
          		return { error: 'الرابط ما بيه عنوان أو بورت صحيح' };
          	if (s.name == '')
          		s.name = s.address;
          	s.link = (s.protocol == 'wireguard' && index(link, '[Interface]') >= 0) ? wg_link(s) : link;
          	return s;
          }

          const UA = [
          	'Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.75 Safari/537.36',
          	'Mozilla/5.0 (iPhone; CPU iPhone OS 10_0_2 like Mac OS X) AppleWebKit/601.1 (KHTML, like Gecko) CriOS/53.0.2785.109 Mobile/14A456 Safari/601.1.46'
          ];

          function stream_settings(s, opt) {
          	let net = lc(s.net ?? 'tcp');
          	let ss = { network: net, security: s.security ?? 'none' };

          	if (net == 'tcp' && lc(s.type ?? '') == 'http') {
          		// the same request/response header v2rayA sends (the server checks the path)
          		let paths = map(csv(s.path), (p) => (substr(p, 0, 1) == '/') ? p : '/' + p);
          		ss.tcpSettings = { header: {
          			type: 'http',
          			request: {
          				version: '1.1', method: 'GET', path: length(paths) ? paths : [ '/' ],
          				headers: {
          					Host: csv(s.host),
          					'User-Agent': UA,
          					'Accept-Encoding': [ 'gzip, deflate' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			},
          			response: {
          				version: '1.1', status: '200', reason: 'OK',
          				headers: {
          					'Content-Type': [ 'application/octet-stream', 'video/mpeg' ],
          					'Transfer-Encoding': [ 'chunked' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			}
          		} };
          	}
          	else if (net == 'ws')
          		ss.wsSettings = { path: s.path || '/', headers: (s.host ? { Host: s.host } : {}) };
          	else if (net == 'grpc')
          		ss.grpcSettings = { serviceName: s.path || '', multiMode: (s.mode == 'multi') };
          	else if (net == 'httpupgrade')
          		ss.httpupgradeSettings = { path: s.path || '/', host: s.host ?? '' };
          	else if (net == 'xhttp' || net == 'splithttp')
          		ss.xhttpSettings = { path: s.path || '/', host: s.host ?? '', mode: s.mode || 'auto' };
          	else if (net == 'h2' || net == 'http')
          		ss.httpSettings = { path: s.path || '/', host: csv(s.host) };

          	if (ss.security == 'tls') {
          		ss.tlsSettings = { serverName: s.sni || s.host || s.domain || s.address, allowInsecure: !!s.insecure };
          		if (s.alpn)
          			ss.tlsSettings.alpn = csv(s.alpn);
          		if (s.fp)
          			ss.tlsSettings.fingerprint = s.fp;
          	}
          	else if (ss.security == 'reality')
          		ss.realitySettings = {
          			serverName: s.sni || s.domain || '', fingerprint: s.fp || 'chrome',
          			publicKey: s.pbk ?? '', shortId: s.sid ?? '', spiderX: s.spx ?? ''
          		};
          	else
          		ss.security = 'none';

          	ss.sockopt = { mark: 128 };
          	if (opt.tfo == 'on')
          		ss.sockopt.tcpFastOpen = true;
          	else if (opt.tfo == 'off')
          		ss.sockopt.tcpFastOpen = false;
          	return ss;
          }

          // s.ip: the address already resolved by the caller (a domain would need DNS, and DNS itself goes
          // through the proxy: the outbound always gets an IP)
          function outbound(s, opt, tag) {
          	opt ??= {};
          	let addr = s.ip || s.address;
          	let o = { tag: tag ?? 'proxy', protocol: s.protocol };
          	if (addr != s.address)
          		s = { ...s, domain: s.address };

          	if (s.protocol == 'vless')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, encryption: 'none', flow: s.flow ?? '' } ] } ] };
          	else if (s.protocol == 'vmess')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, alterId: +(s.aid ?? 0), security: s.scy || 'auto' } ] } ] };
          	else if (s.protocol == 'trojan')
          		o.settings = { servers: [ { address: addr, port: +s.port, password: s.id } ] };
          	else if (s.protocol == 'shadowsocks')
          		o.settings = { servers: [ { address: addr, port: +s.port, method: s.method, password: s.password } ] };
          	else if (s.protocol == 'socks' || s.protocol == 'http') {
          		let srv = { address: addr, port: +s.port };
          		if (s.user != null)
          			srv.users = [ { user: s.user, pass: s.pass ?? '' } ];
          		o.settings = { servers: [ srv ] };
          	}
          	else if (s.protocol == 'wireguard') {
          		o.settings = {
          			secretKey: s.secret, address: length(s.local) ? s.local : [ '10.0.0.2/32' ], mtu: +s.mtu || 1280,
          			peers: [ { publicKey: s.pubkey, endpoint: ((index(addr, ':') >= 0) ? '[' + addr + ']' : addr) + ':' + s.port,
          				allowedIPs: [ '0.0.0.0/0', '::/0' ] } ]
          		};
          		if (s.psk)
          			o.settings.peers[0].preSharedKey = s.psk;
          		if (s.reserved)
          			o.settings.reserved = s.reserved;
          		// the core's own WireGuard stack: "kernel TUN" makes a real interface that fights the router's rules
          		o.settings.noKernelTun = true;
          		o.settings.domainStrategy = 'ForceIP';
          		o.streamSettings = { sockopt: { mark: 128 } };
          		return o;
          	}

          	o.streamSettings = stream_settings(s, opt);
          	if (opt.mux && !s.flow && s.protocol != 'socks' && s.protocol != 'http')
          		o.mux = { enabled: true, concurrency: +(opt.mux_conc ?? 8) };
          	return o;
          }

          export const PRIVATE4 = [
          	'0.0.0.0/8', '10.0.0.0/8', '100.64.0.0/10', '127.0.0.0/8', '169.254.0.0/16', '172.16.0.0/12',
          	'192.0.0.0/24', '192.0.2.0/24', '192.88.99.0/24', '192.168.0.0/16', '198.18.0.0/15',
          	'198.51.100.0/24', '203.0.113.0/24', '224.0.0.0/4', '240.0.0.0/4'
          ];
          export const PRIVATE6 = [ '::/127', '::ffff:0:0/96', '64:ff9b::/96', '100::/64', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];
          const XPRIVATE = [ ...PRIVATE4, '::1/128', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];
          const FAKE_POOL = '198.18.0.0/15';
          function no_fake(list) { return filter(list, (x) => x != FAKE_POOL); }

          // a real IPv4 / IPv6 address (cidr: a prefix may follow): typed values must not break nft or the core
          function ip4_ok(x, cidr) {
          	let m = match(x ?? '', /^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})(\/([0-9]{1,2}))?$/);
          	if (!m || (m[5] && !cidr))
          		return false;
          	for (let i = 1; i <= 4; i++)
          		if (+m[i] > 255)
          			return false;
          	return !m[5] || +m[6] <= 32;
          }

          function ip6_ok(x, cidr) {
          	let m = match(x ?? '', /^([0-9A-Fa-f:.]+)(\/([0-9]{1,3}))?$/);
          	if (!m || index(m[1], ':') < 0 || (m[2] && !cidr) || length(m[1]) > 45 || (m[2] && +m[3] > 128))
          		return false;
          	let g = split(m[1], ':');
          	if (length(g) < 3 || length(g) > 8 || length(split(m[1], '::')) > 2)
          		return false;
          	for (let x in g)
          		if (length(x) > 4 && index(x, '.') < 0)
          			return false;
          	return true;
          }

          // "8080,5060": 1 to 10 ports, each 1-65535
          function ports_ok(s) {
          	let l = split(s ?? '', ',');
          	if (!length(l) || length(l) > 10)
          		return false;
          	for (let p in l)
          		if (!match(p, /^[0-9]{1,5}$/) || +p < 1 || +p > 65535)
          			return false;
          	return true;
          }

          // the DNS servers the core asks (AdGuard when its ad blocking is on), plain addresses only
          function dns_upstreams(opt) {
          	if (opt.adblock == 'adguard' || opt.adblock == 'both')
          		return [ '94.140.14.14', '94.140.15.15' ];
          	return filter(map(split(opt.dns_upstream || '1.1.1.1', /[ ,]+/), (x) => trim(x)), (x) => ip4_ok(x) || ip6_ok(x));
          }

          // an IPv6 address inside a URL needs brackets
          function url_host(x) { return index(x, ':') >= 0 ? '[' + x + ']' : x; }

          // web / social / pictures: many small connections, so one multiplexed channel saves a handshake each
          // (videos and downloads keep their own connection and the zero-copy download)
          const SMART_MUX = [
          	'domain:facebook.com', 'domain:fbcdn.net', 'domain:fbsbx.com', 'domain:instagram.com', 'domain:cdninstagram.com',
          	'domain:whatsapp.net', 'domain:whatsapp.com', 'domain:tiktok.com', 'domain:tiktokcdn.com', 'domain:tiktokv.com',
          	'domain:ibyteimg.com', 'domain:byteoversea.com', 'domain:muscdn.com', 'domain:twitter.com', 'domain:x.com', 'domain:twimg.com',
          	'domain:snapchat.com', 'domain:sc-cdn.net', 'domain:snapkit.com', 'domain:telegram.org', 'domain:t.me',
          	'domain:ytimg.com', 'domain:ggpht.com', 'domain:gstatic.com', 'domain:googleapis.com', 'domain:google.com',
          	'domain:youtube.com', 'domain:googleusercontent.com', 'domain:wikipedia.org', 'domain:wikimedia.org',
          	'domain:reddit.com', 'domain:redd.it', 'domain:redditmedia.com', 'domain:pinimg.com', 'domain:pinterest.com',
          	'domain:discord.com', 'domain:discordapp.com', 'domain:linkedin.com', 'domain:licdn.com', 'domain:cloudflare.com'
          ];
          export const DNS_PORT = 15353;
          export const SOCKS2_PORT = 20179;

          // RoutingA (the v2rayA rule language), the parts that make sense on a router:
          //   default: proxy                      outbound for everything else
          //   domain(geosite:cn, domain:x.com)->direct
          //   ip(geoip:private, 1.2.3.0/24)->direct
          //   port(80,443)->proxy    network(udp)->block    source(192.168.1.5)->direct
          // outbounds: proxy, proxy2 (the second server), direct, block
          function routinga(text) {
          	let rules = [], def = null, errs = [];
          	let n = 0;
          	for (let l in split(text ?? '', /\r?\n/)) {
          		n++;
          		l = trim(replace(l, /#.*$/, ''));
          		if (l == '')
          			continue;
          		let m = match(l, /^default *: *([A-Za-z0-9_]+)$/);
          		if (m) { def = m[1]; continue; }
          		m = match(l, /^([a-z]+) *\((.*)\) *-> *([A-Za-z0-9_]+)$/);
          		if (!m) { push(errs, n); continue; }
          		let vals = filter(map(split(m[2], ','), (x) => trim(replace(x, /^["']|["']$/g, ''))), (x) => x != '');
          		let r = { type: 'field' }, ob = m[3];
          		if (m[1] == 'domain') r.domain = vals;
          		else if (m[1] == 'ip') r.ip = vals;
          		else if (m[1] == 'port') r.port = join(',', vals);
          		else if (m[1] == 'network') r.network = join(',', vals);
          		else if (m[1] == 'source' || m[1] == 'sip') r.source = vals;
          		else { push(errs, n); continue; }
          		if (index([ 'proxy', 'proxy2', 'direct', 'block' ], ob) < 0) { push(errs, n); continue; }
          		r.outboundTag = ob;
          		push(rules, r);
          	}
          	return { rules, def, errs };
          }

          // opt: uci "main"; ctx: {
          //   port, ipv6, main: server (+ .ip), second: server or null, second_kernel: bool, second_ok: [rules],
          //   iso_domains: [], r2_domains: [], r2_ip: [], gfw: [domains], geo: bool (geoip.dat/geosite.dat present) }
          function xray_config(opt, ctx) {
          	let share = (opt.port_sharing == '1');
          	let inb = [];
          	let mode = opt.transparent ?? 'all';
          	// bonded lines: no Smart Mux, its one shared connection would keep that traffic on one line
          	let smart = (opt.smart_mux == '1' && opt.mux != '1' && ctx.main && !ctx.main.flow && !length(ctx.bond ?? []));
          	let need_domains = (opt.learn_log == '1') || (length(ctx.iso_domains ?? []) && opt.iso_sniff != '0') || length(ctx.r2_domains ?? []) || mode == 'gfwlist' || mode == 'routinga' || mode == 'same' || smart;
          	let fake = (opt.special == 'fakedns');
          	let dest = null;
          	if (opt.sniffing == 'http_tls') dest = [ 'http', 'tls' ];
          	else if (opt.sniffing == 'http_tls_quic') dest = [ 'http', 'tls', 'quic' ];
          	else if (need_domains) dest = [ 'http', 'tls', 'quic' ];
          	if (opt.special == 'supervisor')
          		dest ??= [ 'http', 'tls' ];
          	if (opt.special == 'fakedns')
          		dest = [ ...(dest ?? [ 'http', 'tls' ]), 'fakedns' ];
          	// FakeDNS: the core must connect to the real name, so the sniffed name replaces the address
          	let sniff = dest ? { enabled: true, destOverride: dest, routeOnly: !fake } : { enabled: false };

          	if (mode != 'off') {
          		let tp = { tproxy: opt.impl == 'redirect' ? 'redirect' : 'tproxy' };
          		push(inb, { tag: 'transparent', listen: (share || opt.impl == 'redirect') ? '0.0.0.0' : '127.0.0.1', port: +ctx.port, protocol: 'dokodemo-door',
          			settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          		if (ctx.ipv6)
          			push(inb, { tag: 'transparent6', listen: '::1', port: +ctx.port, protocol: 'dokodemo-door',
          				settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          	}
          	if (+opt.socks_port > 0)
          		push(inb, { tag: 'socks', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_port, protocol: 'socks', settings: { udp: true }, sniffing: sniff });
          	if (+opt.http_port > 0)
          		push(inb, { tag: 'http', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_port, protocol: 'http', sniffing: sniff });
          	if (+opt.socks_rule_port > 0)
          		push(inb, { tag: 'socks-rule', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_rule_port, protocol: 'socks', settings: { udp: true }, sniffing: sniff.enabled ? sniff : { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true } });
          	if (+opt.http_rule_port > 0)
          		push(inb, { tag: 'http-rule', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_rule_port, protocol: 'http', sniffing: sniff.enabled ? sniff : { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true } });
          	// the router's own way out through the second server (exit IP check, ping)
          	if (ctx.second)
          		push(inb, { tag: 'socks2', listen: '127.0.0.1', port: SOCKS2_PORT, protocol: 'socks', settings: { udp: false } });

          	let dnsmode = opt.antipollution ?? 'none';
          	// ad blocking with AdGuard DNS: the upstream is theirs (it answers 0.0.0.0 for ad domains)
          	let dnsup = dns_upstreams(opt);
          	if (!length(dnsup))
          		dnsup = [ '1.1.1.1' ];
          	let xdns = null;
          	if (dnsmode == 'forward' && opt.special != 'fakedns')
          		push(inb, { tag: 'dns-in', listen: '127.0.0.1', port: DNS_PORT, protocol: 'dokodemo-door',
          			settings: { address: dnsup[0] ?? '1.1.1.1', port: 53, network: 'tcp,udp' } });
          	else if (dnsmode == 'doh' || dnsmode == 'hijack' || opt.special == 'fakedns') {
          		push(inb, { tag: 'dns-in', listen: '127.0.0.1', port: DNS_PORT, protocol: 'dokodemo-door',
          			settings: { address: dnsup[0] ?? '1.1.1.1', port: 53, network: 'tcp,udp' } });
          		// hijack: "Prevent DNS Hijack Only": DoH straight from the router (fast, not through the server)
          		let up = (dnsmode == 'doh') ? map(dnsup, (x) => 'https://' + url_host(x) + '/dns-query')
          			: (dnsmode == 'hijack') ? map(dnsup, (x) => 'https+local://' + url_host(x) + '/dns-query') : map(dnsup, (x) => 'tcp://' + url_host(x));
          		xdns = { servers: (opt.special == 'fakedns') ? [ 'fakedns', ...up ] : up, queryStrategy: ctx.ipv6 ? 'UseIP' : 'UseIPv4', tag: 'dns-internal' };
          	}

          	let mux = (opt.mux == '1');
          	let ob = [ outbound(ctx.main, { tfo: opt.tfo, mux, mux_conc: opt.mux_conc }, 'proxy') ];
          	if (smart)
          		push(ob, outbound(ctx.main, { tfo: opt.tfo, mux: true, mux_conc: opt.mux_conc || 8 }, 'proxy-mux'));
          	// FakeDNS: a direct connection gets a name, not an address. Without a strategy the core would ask
          	// the system (dnsmasq -> the core's own FakeDNS) and connect to a fake 198.18.x address
          	let fset = fake ? { domainStrategy: ctx.ipv6 ? 'UseIP' : 'UseIPv4' } : null;
          	if (ctx.second) {
          		if (ctx.second_kernel)
          			push(ob, { tag: 'proxy2', protocol: 'freedom', ...(fset ? { settings: fset } : {}), streamSettings: { sockopt: { mark: 0x180, interface: 'xlwg' } } });
          		else
          			push(ob, outbound(ctx.second, { tfo: opt.tfo, mux: false }, 'proxy2'));
          	}
          	push(ob, { tag: 'direct', protocol: 'freedom', ...(fset ? { settings: fset } : {}), streamSettings: { sockopt: { mark: 128 } } });
          	push(ob, { tag: 'block', protocol: 'blackhole' });
          	// the core answers A / AAAA itself; every other question (HTTPS, SRV, TXT, MX, PTR) goes on to the
          	// upstream (the default "drop" leaves it without an answer): through the server, or straight from the
          	// router for "Prevent DNS Hijack Only"
          	if (xdns)
          		push(ob, { tag: 'dns-out', protocol: 'dns', settings: { nonIPQuery: 'skip' },
          			streamSettings: { sockopt: (dnsmode == 'hijack') ? { mark: 128 } : { dialerProxy: 'proxy' } } });

          	let rules = [];
          	if (xdns)
          		push(rules, { type: 'field', inboundTag: [ 'dns-in' ], outboundTag: 'dns-out' });
          	else if (dnsmode == 'forward')
          		push(rules, { type: 'field', inboundTag: [ 'dns-in' ], outboundTag: 'proxy' });
          	if (ctx.second)
          		push(rules, { type: 'field', inboundTag: [ 'socks2' ], outboundTag: 'proxy2' });
          	push(rules, { type: 'field', ip: fake ? no_fake(XPRIVATE) : XPRIVATE, outboundTag: 'direct' });
          	if (length(ctx.iso_domains ?? []))
          		push(rules, { type: 'field', domain: ctx.iso_domains, outboundTag: 'direct' });

          	let balancers = null, observatory = null, c_burst = null;
          	if (ctx.second) {
          		let fb = opt.r2_fallback ?? 'main';
          		let target = { outboundTag: 'proxy2' };
          		if (fb == 'main' || fb == 'direct') {
          			balancers = [ { tag: 'b2', selector: [ 'proxy2' ], strategy: { type: 'random' }, fallbackTag: (fb == 'main') ? 'proxy' : 'direct' } ];
          			observatory = { subjectSelector: [ 'proxy2' ], probeUrl: opt.r2_probe || 'https://www.google.com/generate_204', probeInterval: (+opt.r2_probe_interval || 30) + 's', enableConcurrency: false };
          			target = { balancerTag: 'b2' };
          		}
          		// devices set to "everything through the second server" (by their address; kernel WireGuard: by MAC in nft)
          		if (length(ctx.warp_src ?? []) && !ctx.dev_warp_kernel)
          			push(rules, { type: 'field', source: ctx.warp_src, ...target });
          		if (length(ctx.main_domains ?? []))
          			push(rules, { type: 'field', domain: ctx.main_domains, outboundTag: 'proxy' });
          		if (ctx.main_ports)
          			push(rules, { type: 'field', port: ctx.main_ports, network: 'tcp', outboundTag: 'proxy' });
          		if (length(ctx.r2_domains ?? []))
          			push(rules, { type: 'field', domain: ctx.r2_domains, ...target });
          		if (length(ctx.r2_ip ?? []))
          			push(rules, { type: 'field', ip: ctx.r2_ip, ...target });
          	}

          	// QUIC (UDP 443) through a TCP tunnel is slow: it is refused in nft (fast fallback to TCP);
          	// this rule is the same for traffic that only the core sees (socks / http ports)
          	if (opt.block_quic == '1')
          		push(rules, { type: 'field', network: 'udp', port: '443', outboundTag: 'block' });
          	// v2rayA's two routings: the transparent proxy, and the "rule" ports (socks/http with traffic splitting).
          	//   transparent: off | all | except_cn | gfwlist | routinga | same (= the rule port mode)
          	//   rule_mode:   except_cn | gfwlist | routinga
          	let rmode = opt.rule_mode ?? 'gfwlist';
          	let tmode = (mode == 'same') ? rmode : mode;
          	let groups = [];
          	if (tmode != 'off')
          		push(groups, [ ctx.ipv6 ? [ 'transparent', 'transparent6' ] : [ 'transparent' ], tmode ]);
          	let rtags = [];
          	if (+opt.socks_rule_port > 0) push(rtags, 'socks-rule');
          	if (+opt.http_rule_port > 0) push(rtags, 'http-rule');
          	if (length(rtags))
          		push(groups, [ rtags, rmode ]);
          	let ptags = [];
          	if (+opt.socks_port > 0) push(ptags, 'socks');
          	if (+opt.http_port > 0) push(ptags, 'http');
          	if (length(ptags))
          		push(groups, [ ptags, 'all' ]);
          	for (let g in groups) {
          		let tags = g[0], gm = g[1], last = 'proxy', mr = [];
          		if (gm == 'gfwlist') {
          			if (length(ctx.gfw ?? []))
          				push(mr, { type: 'field', domain: ctx.gfw, outboundTag: 'proxy' });
          			last = 'direct';
          		}
          		else if (gm == 'except_cn') {
          			if (ctx.geo)
          				push(mr, { type: 'field', domain: [ 'geosite:cn' ], outboundTag: 'direct' }, { type: 'field', ip: [ 'geoip:cn' ], outboundTag: 'direct' });
          			else if (length(ctx.cn4 ?? []))
          				push(mr, { type: 'field', ip: ctx.cn4, outboundTag: 'direct' });
          		}
          		else if (gm == 'routinga') {
          			let ra = routinga(opt.routinga);
          			for (let r in ra.rules) {
          				if (r.outboundTag == 'proxy2' && !ctx.second)
          					continue;
          				// geosite / geoip need the .dat files; without them only geoip:private is understood
          				if (!ctx.geo) {
          					for (let k in [ 'domain', 'ip' ]) {
          						if (!r[k])
          							continue;
          						let v = [];
          						for (let x in r[k])
          							if (x == 'geoip:private') push(v, ...XPRIVATE);
          							else if (!match(x, /^geo(site|ip):/)) push(v, x);
          						r[k] = v;
          					}
          					if ((r.domain && !length(r.domain)) || (r.ip && !length(r.ip)))
          						continue;
          				}
          				push(mr, r);
          			}
          			if (ra.def && (ra.def != 'proxy2' || ctx.second))
          				last = ra.def;
          		}
          		for (let r in mr)
          			push(rules, { ...r, inboundTag: tags });
          		if (smart && last == 'proxy')
          			push(rules, { type: 'field', inboundTag: tags, domain: SMART_MUX, network: 'tcp', outboundTag: 'proxy-mux' });
          		push(rules, { type: 'field', inboundTag: tags, outboundTag: last });
          	}
          	push(rules, { type: 'field', network: 'tcp,udp', outboundTag: 'proxy' });

          	// line bonding: one copy of the main server per line; connections take turns over the lines
          	// (a line that stops answering the probe is skipped; all down: the main route)
          	if (length(ctx.bond ?? [])) {
          		// a line's share (1-4) = that many copies of it in the turn order: a fast line gets more connections
          		for (let i, d in ctx.bond) {
          			let w = +(ctx.bond_weights?.[i] ?? 1) || 1;
          			for (let k = 0; k < w; k++) {
          				let b = outbound(ctx.bond_ips?.[i] ? { ...ctx.main, ip: ctx.bond_ips[i] } : ctx.main, { tfo: opt.tfo, mux, mux_conc: opt.mux_conc }, 'bond' + i + (k ? 'w' + k : ''));
          				b.streamSettings.sockopt.interface = d;
          				// BBR per tunnel when the router has it: holds the speed on a line that loses packets
          				if (ctx.bbr && ctx.main.protocol != 'wireguard') b.streamSettings.sockopt.tcpcongestion = 'bbr';
          				// small packets (typing, game input, page requests) leave at once instead of waiting to be batched
          				if (ctx.main.protocol != 'wireguard') b.streamSettings.sockopt.tcpNoDelay = true;
          				push(ob, b);
          			}
          		}
          		for (let r in rules)
          			if (r.outboundTag == 'proxy') { delete r.outboundTag; r.balancerTag = 'bond'; }
          		// one local door per line (127.0.0.1:20180 + n): measuring each line through its own tunnel
          		for (let i, d in ctx.bond) {
          			push(inb, { tag: 'bt' + i, listen: '127.0.0.1', port: 20180 + i, protocol: 'socks', settings: { udp: false } });
          			unshift(rules, { type: 'field', inboundTag: [ 'bt' + i ], outboundTag: 'bond' + i });
          		}
          		// rr (the default): every line in turn, shares by weight. A line is left out only when it is dead (its
          		// probe fails, checked every 15 s), never because it is busy: a line under a speed test answers slowly,
          		// and dropping it then is what made the bonding come and go.
          		// fast: the faster lines only (measured delay); backup: the first line, the next one while it is down
          		// UDP (games, calls, DNS) never hops: it stays on the line with the lowest delay
          		let mode = opt.bond_mode ?? 'rr', n = length(ctx.bond), auto = (opt.bond_auto != '0');
          		let bal = { tag: 'bond', selector: [ 'bond' ], strategy: { type: 'roundRobin' }, fallbackTag: 'proxy' };
          		if (mode == 'backup') {
          			bal.selector = [ 'bond0' ];
          			bal.fallbackTag = 'bond1';
          			bal.strategy = { type: 'random' };
          		}
          		else if (!auto) {
          			// switch off: every line whatever happens (no probe; random needs none, a fallback does)
          			bal.strategy = { type: 'random' };
          			delete bal.fallbackTag;
          		}
          		else if (mode == 'fast') {
          			bal.strategy = { type: 'leastLoad', settings: { expected: (n > 2) ? n - 1 : n, maxRTT: '2s', tolerance: 0.5 } };
          			c_burst = { subjectSelector: [ 'bond' ], pingConfig: { destination: 'https://www.google.com/generate_204', connectivity: '', interval: '15s', sampling: 4, timeout: '5s' } };
          		}
          		balancers ??= [];
          		push(balancers, bal);
          		if (auto && mode != 'backup') {
          			push(balancers, { tag: 'bondu', selector: [ 'bond' ], strategy: { type: 'leastPing' }, fallbackTag: 'proxy' });
          			// the UDP rule goes before the bonded catch-all rules
          			let first = 0;
          			for (let i, r in rules) if (r.balancerTag == 'bond') { first = i; break; }
          			splice(rules, first, 0, { type: 'field', network: 'udp', balancerTag: 'bondu' });
          		}
          		if (auto || mode == 'backup') {
          			observatory ??= { subjectSelector: [], probeUrl: 'https://www.google.com/generate_204', probeInterval: '15s', enableConcurrency: true };
          			observatory.probeInterval = '15s';
          			push(observatory.subjectSelector, mode == 'backup' ? 'bond0' : 'bond');
          		}
          	}

          	let c = {
          		// learning mode: the core says which name each device connects to (read by the monitor, then off)
          		log: (opt.learn_log == '1') ? { loglevel: 'info', error: '/tmp/xlite/core.log', access: 'none' } : { loglevel: opt.loglevel || 'warning', access: 'none' },
          		inbounds: inb,
          		outbounds: ob,
          		routing: { domainStrategy: 'AsIs', rules }
          	};
          	if (balancers) {
          		c.routing.balancers = balancers;
          		if (observatory) c.observatory = observatory;
          	}
          	if (c_burst)
          		c.burstObservatory = c_burst;
          	if (xdns)
          		c.dns = xdns;
          	if (fake)
          		c.fakedns = [ { ipPool: FAKE_POOL, poolSize: 65535 } ];
          	return c;
          }

          function nft_set(name, typ, elems, extra) {
          	let s = `\tset ${name} {\n\t\ttype ${typ}\n\t\tflags interval\n\t\tauto-merge\n`;
          	if (length(elems))
          		s += `\t\telements = { ${join(', ', elems)} }\n`;
          	return s + '\t}\n';
          }

          function q(n) {
          	return '"' + replace(n, /[^A-Za-z0-9._@-]/g, '') + '"';
          }

          function sname(id) {
          	return replace(id, /[^A-Za-z0-9_]/g, '_');
          }

          // ctx: { port, ipv6, wan: [devs], lan: [devs], local4, local6, bypass4, bypass6,
          //        iso: [ { id, ip4: [], ip6: [] } ], r2fast4: [], r2fast6: [] }
          function nft_rules(opt, ctx) {
          	let fam = ctx.ipv6 ? 'meta nfproto { ipv4, ipv6 }' : 'meta nfproto ipv4';
          	let early = (opt.early_exit != '0');
          	let r = 'table inet xlite {\n';
          	r += nft_set('whitelist', 'ipv4_addr', (opt.special == 'fakedns') ? no_fake(PRIVATE4) : PRIVATE4);
          	r += nft_set('whitelist6', 'ipv6_addr', PRIVATE6);
          	r += nft_set('local_ips', 'ipv4_addr', ctx.local4 ?? []);
          	r += nft_set('local_ips6', 'ipv6_addr', ctx.local6 ?? []);
          	r += nft_set('bypass4', 'ipv4_addr', ctx.bypass4 ?? []);
          	r += nft_set('bypass6', 'ipv6_addr', ctx.bypass6 ?? []);
          	r += nft_set('r2fast4', 'ipv4_addr', ctx.r2fast4 ?? []);
          	r += nft_set('r2fast6', 'ipv6_addr', ctx.r2fast6 ?? []);
          	r += nft_set('cn4', 'ipv4_addr', ctx.cn4_nft ? (ctx.cn4 ?? []) : []);
          	for (let a in ctx.iso ?? []) {
          		r += nft_set('iso4_' + sname(a.id), 'ipv4_addr', a.ip4 ?? []);
          		r += nft_set('iso6_' + sname(a.id), 'ipv6_addr', a.ip6 ?? []);
          	}
          	r += '\tset dev_direct {\n\t\ttype ether_addr\n' + (length(ctx.dev_direct ?? []) ? `\t\telements = { ${join(', ', ctx.dev_direct)} }\n` : '') + '\t}\n';
          	r += '\tset dev_warp {\n\t\ttype ether_addr\n' + ((length(ctx.dev_warp ?? []) && ctx.dev_warp_kernel) ? `\t\telements = { ${join(', ', ctx.dev_warp)} }\n` : '') + '\t}\n';
          	// devices kicked from the network (Telegram bot / LuCI)
          	r += '\tset blocked {\n\t\ttype ether_addr\n' + (length(ctx.blocked ?? []) ? `\t\telements = { ${join(', ', ctx.blocked)} }\n` : '') + '\t}\n';
          	// per device traffic (the monitor turns the counters into day / month totals)
          	r += '\tset dev_up {\n\t\ttype ipv4_addr\n\t\tsize 1024\n\t\tflags dynamic\n\t\tcounter\n\t}\n';
          	r += '\tset dev_down {\n\t\ttype ipv4_addr\n\t\tsize 1024\n\t\tflags dynamic\n\t\tcounter\n\t}\n';

          	r += '\tchain tp_out {\n';
          	if (early)
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} return\n`;
          	r += '\t\tmeta mark & 0x80 == 0x80 return\n';
          	// "Prevent DNS Hijack Only": the core's DoH goes straight from the router (it carries no mark)
          	if ((opt.antipollution ?? 'none') == 'hijack') {
          		let up = dns_upstreams(opt), u4 = filter(up, (x) => index(x, ':') < 0), u6 = filter(up, (x) => index(x, ':') >= 0);
          		if (length(u4)) r += `\t\tip daddr { ${join(', ', u4)} } tcp dport 443 return\n`;
          		if (length(u6)) r += `\t\tip6 daddr { ${join(', ', u6)} } tcp dport 443 return\n`;
          	}
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type local fib daddr type != local jump tp_rule\n';
          	r += '\t}\n';

          	r += '\tchain tp_pre {\n';
          	if (early)
          		for (let d in ctx.wan ?? [])
          			r += `\t\tiifname ${q(d)} return\n`;
          	r += '\t\tiifname "lo" mark & 0xc0 != 0x40 return\n';
          	// only the LAN zone goes through the core: a tproxied packet passes the firewall's input chain, where a
          	// zone with input REJECT (a guest network) would refuse it; other zones go out directly
          	if (length(ctx.lan ?? []))
          		r += `\t\tiifname != { "lo", ${join(', ', map(ctx.lan, (d) => q(d)))} } return\n`;
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type != local fib daddr type != local jump tp_rule\n';
          	if (opt.impl != 'redirect') {
          		r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip to 127.0.0.1:${+ctx.port}\n`;
          		if (ctx.ipv6)
          			r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip6 to [::1]:${+ctx.port}\n`;
          	}
          	r += '\t}\n';

          	r += `\tchain output {\n\t\ttype route hook output priority mangle - 5; policy accept;\n\t\t${fam} jump tp_out\n`;
          	if (opt.block_quic == '1')
          		r += '\t\tmeta mark & 0x200 == 0x200 reject\n';
          	r += '\t}\n';
          	// QUIC refused right away, so apps fall back to TCP at once (a dropped packet would make them wait)
          	if (opt.block_quic == '1')
          		r += '\tchain quic {\n\t\ttype filter hook forward priority filter - 5; policy accept;\n\t\tmeta mark & 0x200 == 0x200 reject\n\t}\n';
          	r += `\tchain prerouting {\n\t\ttype filter hook prerouting priority mangle - 5; policy accept;\n\t\t${fam} jump tp_pre\n\t}\n`;
          	r += '\tchain kick {\n\t\ttype filter hook prerouting priority raw; policy accept;\n\t\tether saddr @blocked drop\n\t}\n';
          	r += '\tchain count_up {\n\t\ttype filter hook prerouting priority mangle - 6; policy accept;\n';
          	for (let d in ctx.lan ?? [])
          		r += `\t\tiifname ${q(d)} meta nfproto ipv4 update @dev_up { ip saddr }\n`;
          	r += '\t}\n';
          	r += '\tchain count_down {\n\t\ttype filter hook postrouting priority mangle; policy accept;\n';
          	for (let d in ctx.lan ?? [])
          		r += `\t\toifname ${q(d)} meta nfproto ipv4 update @dev_down { ip daddr }\n`;
          	if (length(ctx.iso ?? []))
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} jump iso_down\n`;
          	r += '\t}\n';
          	// isolated apps: bytes in each direction (the monitor reads these counters)
          	r += '\tchain iso_down {\n';
          	for (let a in ctx.iso ?? [])
          		r += `\t\tip saddr @iso4_${sname(a.id)} counter comment ${q(a.id)}\n\t\tip6 saddr @iso6_${sname(a.id)} counter comment ${q(a.id)}\n`;
          	r += '\t}\n';

          	r += '\tchain tp_rule {\n';
          	r += '\t\tmeta mark set ct mark\n';
          	r += '\t\tmeta mark & 0xc0 == 0x40 return\n';
          	if (opt.dns == 'direct' && (opt.antipollution ?? 'none') == 'none')
          		r += '\t\tmeta l4proto { tcp, udp } th dport 53 return\n';
          	r += '\t\tip daddr @local_ips return\n\t\tip6 daddr @local_ips6 return\n';
          	r += '\t\tip daddr @whitelist return\n\t\tip6 daddr @whitelist6 return\n';
          	r += '\t\tip daddr @bypass4 return\n\t\tip6 daddr @bypass6 return\n';
          	// per device: no VPN at all, or (kernel WireGuard) everything into the tunnel
          	r += '\t\tether saddr @dev_direct return\n';
          	r += '\t\tether saddr @dev_warp meta mark set mark | 0x100 return\n';
          	// voice / video calls stay on the VPN even for an isolated app: a call starts with STUN
          	// (magic cookie 0x2112A442 in every STUN message), the mark stays on the whole connection
          	if (length(ctx.iso ?? []) && opt.iso_calls != '0') {
          		r += '\t\tmeta l4proto udp @th,96,32 0x2112a442 meta mark set mark | 0x400\n';
          		r += '\t\tudp dport { 3478-3481, 5349, 19302-19309 } meta mark set mark | 0x400\n';
          	}
          	r += '\t\tjump iso\n';
          	if (ctx.cn4_nft && length(ctx.cn4 ?? []))
          		r += '\t\tip daddr @cn4 return\n';
          	if (ctx.main_ports)
          		r += `\t\tmeta l4proto tcp th dport { ${ctx.main_ports} } goto tp_mark\n`;
          	if (opt.block_quic == '1' && !ctx.second_kernel)
          		r += '\t\tudp dport 443 meta mark set mark | 0x200 return\n';
          	r += '\t\tip daddr @r2fast4 meta mark set mark | 0x100 return\n';
          	r += '\t\tip6 daddr @r2fast6 meta mark set mark | 0x100 return\n';
          	// with the kernel WireGuard, Iraqi QUIC above keeps working (UDP over WireGuard is fine)
          	if (opt.block_quic == '1' && ctx.second_kernel)
          		r += '\t\tudp dport 443 meta mark set mark | 0x200 return\n';
          	r += '\t\tjump tp_mark\n';
          	r += '\t}\n';
          	r += '\tchain iso {\n';
          	r += '\t\tmeta mark & 0x400 == 0x400 return\n';
          	for (let a in ctx.iso ?? [])
          		r += `\t\tip daddr @iso4_${sname(a.id)} counter accept comment ${q(a.id)}\n\t\tip6 daddr @iso6_${sname(a.id)} counter accept comment ${q(a.id)}\n`;
          	r += '\t}\n';
          	r += '\tchain tp_mark {\n';
          	r += '\t\ttcp flags & (fin | syn | rst | ack) == syn meta mark set mark | 0x40\n';
          	r += '\t\tmeta l4proto udp ct state new meta mark set mark | 0x40\n';
          	r += '\t\tct mark set mark\n';
          	r += '\t}\n';
          	r += '}\n';
          	return r;
          }

          // redirect mode (no tproxy kernel module): TCP only, like v2rayA's "redirect"
          function nft_redirect(opt, ctx) {
          	let r = 'table inet xlite_nat {\n';
          	r += '\tchain prerouting {\n\t\ttype nat hook prerouting priority dstnat - 5; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '\tchain output {\n\t\ttype nat hook output priority -105; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '}\n';
          	return r;
          }

          // subscription body: base64 or plain list of share links
          function parse_subscription(body) {
          	body = trim(body ?? '');
          	if (!match(body, /:\/\//)) {
          		let d = b64decode(replace(body, /\s+/g, ''));
          		if (d && match(d, /:\/\//))
          			body = d;
          	}
          	let r = [];
          	for (let l in split(body, /\r?\n/)) {
          		l = trim(l);
          		if (match(l, /^[a-z0-9]+:\/\//)) {
          			let p = parse_link(l);
          			if (!p.error)
          				push(r, p);
          		}
          	}
          	return r;
          }

          export { parse_link, outbound, xray_config, nft_rules, nft_redirect, routinga, parse_subscription, sname, ip4_ok, ip6_ok, ports_ok };
          XLITE_FILE_6
          mkdir -p "$(dirname "src/usr/share/xlite/bot.uc")"
          cat > "src/usr/share/xlite/bot.uc" <<'XLITE_FILE_7'
          // XLite Telegram bot (runs while XLite is on and the bot is enabled in Settings)
          //   alerts: a server stopped / came back, a new device joined (with Allow / Kick buttons)
          //   daily report: device usage of the day
          //   commands: /status /servers /use N /second N /off /on /devices /ping /help
          // Only the owner's chat is answered: the first chat that sends /start when no chat is saved.
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';

          const TMP = getenv('XLITE_TMP') ?? '/tmp/xlite';
          const RUN = getenv('XLITE_RUN') ?? '/var/etc/xlite';

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function uci() {
          	let c = getenv('XLITE_UCI_DIR') ? cursor(getenv('XLITE_UCI_DIR')) : cursor();
          	c.load('xlite');
          	return c;
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          function fmtb(b) {
          	b = +b || 0;
          	if (b >= 1e9) return sprintf('%.1f GB', b / 1e9);
          	if (b >= 1e6) return sprintf('%.0f MB', b / 1e6);
          	return sprintf('%.0f KB', b / 1e3);
          }

          let token = null;

          // Telegram may be blocked on the line: try through the core first, then direct
          function api(method, body, timeout) {
          	let f = TMP + '/bot-req.json';
          	fs.writefile(f, sprintf('%J', body ?? {}));
          	let socks = +(uci().get('xlite', 'main', 'socks_port') ?? 0);
          	let url = shq('https://api.telegram.org/bot' + token + '/' + method);
          	let t = timeout ?? 15;
          	let base = `curl -s -m ${t + 10} -H 'Content-Type: application/json' -d @${f} `;
          	let out = (socks > 0) ? sh(base + `--socks5-hostname 127.0.0.1:${socks} ${url} 2>/dev/null`) : '';
          	if (out == '')
          		out = sh(base + url + ' 2>/dev/null');
          	try { return json(out); } catch (e) { return null; }
          }

          function send(chat, text, buttons) {
          	let b = { chat_id: chat, text, parse_mode: 'HTML', disable_web_page_preview: true };
          	if (buttons)
          		b.reply_markup = { inline_keyboard: buttons };
          	return api('sendMessage', b);
          }

          function servers(c) {
          	let r = [];
          	c.foreach('xlite', 'server', (s) => push(r, { id: s['.name'], name: s.name ?? '?' }));
          	return r;
          }

          function status_text(c) {
          	let m = c.get_all('xlite', 'main') ?? {};
          	let st = readjson(RUN + '/state.json') ?? {};
          	let mon = readjson(TMP + '/mon.json') ?? {};
          	let on = (m.enabled == '1') && system('nft list table inet xlite > /dev/null 2>&1') == 0;
          	let t = on ? '🟢 <b>متصل</b>\n' : '🔴 <b>مفصول</b>\n';
          	t += 'الرئيسي: ' + (st.name ?? '—');
          	if (mon.health?.main) t += mon.health.main.ok ? ` (${mon.health.main.ms} ms)` : ' (ما يرد)';
          	t += '\n';
          	if (st.second) {
          		t += 'الثاني: ' + st.second.name;
          		if (mon.health?.second) t += mon.health.second.ok ? ` (${mon.health.second.ms} ms)` : ' (واكف)';
          		t += '\n';
          	}
          	let tot = 0;
          	for (let d in mon.devs ?? []) tot += d.today[0] + d.today[1];
          	t += 'استهلاك اليوم: ' + fmtb(tot) + ' · ' + length(mon.devs ?? []) + ' جهاز';
          	return t;
          }

          function devices_text() {
          	let mon = readjson(TMP + '/mon.json') ?? {};
          	let d = sort([ ...(mon.devs ?? []) ], (a, b) => (b.today[0] + b.today[1]) - (a.today[0] + a.today[1]));
          	if (!length(d))
          		return 'ما اكو بيانات بعد';
          	let t = '<b>الأجهزة اليوم</b>\n';
          	for (let x in slice(d, 0, 15))
          		t += `• ${x.name ?? x.ip}: ${fmtb(x.today[0] + x.today[1])}\n`;
          	return t;
          }

          function restart() {
          	system('( /etc/init.d/xlite reload > /dev/null 2>&1 & )');
          }

          function kick(c, mac, on) {
          	mac = lc(mac);
          	if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          		return false;
          	let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          	if (on) push(l, mac);
          	c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          	c.save('xlite');
          	c.commit('xlite');
          	system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          	return true;
          }

          function command(c, chat, text) {
          	let m = match(text, /^\/([a-z]+)(@[A-Za-z0-9_]+)?( +(.*))?$/);
          	if (!m) {
          		send(chat, 'اكتب /help حتى تشوف الأوامر');
          		return;
          	}
          	let cmd = m[1], arg = trim(m[4] ?? '');
          	let list = servers(c);
          	if (cmd == 'start' || cmd == 'help')
          		send(chat, '<b>XLite</b>\n/status الحالة\n/servers السيرفرات\n/use رقم: سيرفر رئيسي\n/second رقم: سيرفر ثاني\n/second off: إطفاء الثاني\n/devices الأجهزة اليوم\n/off و /on: الاتصال');
          	else if (cmd == 'status')
          		send(chat, status_text(c));
          	else if (cmd == 'devices')
          		send(chat, devices_text());
          	else if (cmd == 'servers') {
          		let cur = c.get('xlite', 'main', 'server'), sec = (c.get('xlite', 'main', 'r2') == '1') ? c.get('xlite', 'main', 'server2') : null;
          		let t = '<b>السيرفرات</b>\n';
          		for (let i = 0; i < length(list); i++)
          			t += `${i + 1}. ${list[i].name}${list[i].id == cur ? ' ⭐ الرئيسي' : ''}${list[i].id == sec ? ' 🇮🇶 الثاني' : ''}\n`;
          		send(chat, t + '\n/use رقم أو /second رقم');
          	}
          	else if (cmd == 'use' || cmd == 'second') {
          		if (cmd == 'second' && arg == 'off') {
          			c.set('xlite', 'main', 'r2', '0');
          			c.save('xlite'); c.commit('xlite'); restart();
          			send(chat, 'انطفى السيرفر الثاني');
          			return;
          		}
          		let s = list[+arg - 1];
          		if (!s) { send(chat, 'رقم غلط، شوف /servers'); return; }
          		if (cmd == 'use') {
          			if (c.get('xlite', 'main', 'server2') == s.id) c.set('xlite', 'main', 'server2', c.get('xlite', 'main', 'server'));
          			c.set('xlite', 'main', 'server', s.id);
          		}
          		else {
          			if (c.get('xlite', 'main', 'server') == s.id) { send(chat, 'هذا الرئيسي، اختار غيره'); return; }
          			c.set('xlite', 'main', 'server2', s.id);
          			c.set('xlite', 'main', 'r2', '1');
          		}
          		c.save('xlite'); c.commit('xlite'); restart();
          		send(chat, (cmd == 'use' ? 'الرئيسي صار: ' : 'الثاني صار: ') + s.name);
          	}
          	else if (cmd == 'off' || cmd == 'on') {
          		c.set('xlite', 'main', 'enabled', cmd == 'on' ? '1' : '0');
          		c.save('xlite'); c.commit('xlite');
          		// with XLite off the service keeps only the bot running, so /on still works
          		system('( /etc/init.d/xlite restart > /dev/null 2>&1 & )');
          		send(chat, cmd == 'on' ? 'يتصل…' : 'انفصل. اكتب /on حتى يرجع');
          	}
          	else
          		send(chat, 'ما أعرف هذا الأمر. /help');
          }

          function events(c, chat) {
          	let f = TMP + '/events.jsonl';
          	let t = fs.readfile(f);
          	if (!t)
          		return;
          	fs.unlink(f);
          	let m = c.get_all('xlite', 'main') ?? {};
          	for (let l in split(t, '\n')) {
          		let e = null;
          		try { e = json(l); } catch (x) {}
          		if (!e)
          			continue;
          		if (e.which == 'dns' && m.bot_alert_down != '0')
          			send(chat, '⚠️ DNS النواة ما يرد: رجعت DNS العادي حتى ما ينقطع النت');
          		else if (e.type == 'down' && m.bot_alert_down != '0')
          			send(chat, `🔴 السيرفر ${e.which == 'second' ? 'الثاني' : 'الرئيسي'} (${e.name ?? ''}) ما يرد`);
          		else if (e.type == 'up' && m.bot_alert_down != '0')
          			send(chat, `🟢 السيرفر ${e.which == 'second' ? 'الثاني' : 'الرئيسي'} (${e.name ?? ''}) رجع`);
          		else if (e.type == 'line_down')
          			send(chat, `🔴 خط ${e.iface} بالدمج وكف، الدمج يكمل بالباقي`);
          		else if (e.type == 'line_up')
          			send(chat, `🟢 خط ${e.iface} رجع للدمج`);
          		else if (e.type == 'new_device' && m.bot_alert_newdev != '0')
          			send(chat, `📱 جهاز جديد دخل الشبكة:\n<b>${e.name ?? 'بدون اسم'}</b>\n${e.ip ?? ''} · ${e.mac}`,
          				[ [ { text: '✅ اسمح', callback_data: 'allow:' + e.mac }, { text: '⛔ اطرد', callback_data: 'kick:' + e.mac } ] ]);
          	}
          }

          // the last update handled is kept in a file and confirmed to Telegram before any command runs: a command
          // that restarts XLite restarts the bot too, and an unconfirmed update would come back and run again
          const OFFSET_FILE = TMP + '/bot.offset';
          let offset = +(fs.readfile(OFFSET_FILE) ?? 0) || 0;

          // started after the report time: today's report is not sent late
          function report_done_today() {
          	let t = localtime(), rt = uci().get('xlite', 'main', 'bot_report_time') ?? '22:00';
          	return (sprintf('%02d:%02d', t.hour, t.min) > rt) ? sprintf('%d-%02d-%02d', t.year, t.mon, t.mday) : '';
          }
          let last_report = report_done_today();
          while (true) {
          	let c = uci();
          	let m = c.get_all('xlite', 'main') ?? {};
          	token = m.bot_token;
          	if (m.bot_enabled != '1' || !token || !match(token, /^[0-9]+:[A-Za-z0-9_-]+$/)) {
          		sleep(30000);
          		continue;
          	}
          	let chat = m.bot_chat;
          	let r = api('getUpdates', { offset, timeout: 20, allowed_updates: [ 'message', 'callback_query' ] }, 20);
          	let batch = r?.result ?? [];
          	if (length(batch)) {
          		offset = batch[length(batch) - 1].update_id + 1;
          		fs.writefile(OFFSET_FILE, '' + offset);
          		api('getUpdates', { offset, timeout: 0, limit: 1 }, 0);
          	}
          	for (let u in batch) {
          		let from = u.message?.chat?.id ?? u.callback_query?.message?.chat?.id;
          		if (!chat && u.message?.text == '/start' && from) {
          			chat = '' + from;
          			c.set('xlite', 'main', 'bot_chat', chat);
          			c.save('xlite'); c.commit('xlite');
          			send(chat, '✅ انربط البوت ويا XLite. هذا الحساب بس اللي ينطيه أوامر.');
          			continue;
          		}
          		if (!chat || '' + from != chat)
          			continue;
          		if (u.message?.text)
          			command(c, chat, trim(u.message.text));
          		else if (u.callback_query) {
          			let d = match(u.callback_query.data ?? '', /^(allow|kick):(.*)$/);
          			if (d) {
          				kick(c, d[2], d[1] == 'kick');
          				api('answerCallbackQuery', { callback_query_id: u.callback_query.id, text: d[1] == 'kick' ? 'انطرد' : 'مسموح' });
          				send(chat, (d[1] == 'kick' ? '⛔ انطرد ' : '✅ مسموح ') + d[2]);
          			}
          		}
          	}
          	if (chat) {
          		events(c, chat);
          		let t = localtime(), hm = sprintf('%02d:%02d', t.hour, t.min), day = sprintf('%d-%02d-%02d', t.year, t.mon, t.mday);
          		if (hm >= (m.bot_report_time ?? '22:00') && last_report != day) {
          			last_report = day;
          			send(chat, '📊 <b>تقرير اليوم</b>\n' + status_text(c) + '\n\n' + devices_text());
          		}
          	}
          	if (!r)
          		sleep(10000);
          }
          XLITE_FILE_7
