          					"bond_calibrate_result",
          					"wifi_radios",
          					"wifi_scan",
          					"wifi_scan_result",
          					"bond_scan",
          					"bond_scan_result",
          					"diagnose",
          					"backup",
          					"r2apps"
          				]
          			},
          			"uci": [
          				"xlite"
          			]
          		},
          		"write": {
          			"ubus": {
          				"xlite": [
          					"add",
          					"remove",
          					"rename",
          					"edit",
          					"select",
          					"connect",
          					"set_settings",
          					"update",
          					"second",
          					"wg_deps",
          					"lists",
          					"sub_add",
          					"sub_update",
          					"sub_remove",
          					"device_name",
          					"usage_reset",
          					"iso_set",
          					"learn_start",
          					"learn_stop",
          					"learn_save",
          					"learn_clear",
          					"block_device",
          					"bot_test",
          					"adblock_update",
          					"restore",
          					"uninstall",
          					"r2app_set",
          					"device_route",
          					"port_wan",
          					"bond_set",
          					"bond_calibrate",
          					"wifi_connect",
          					"wifi_set",
