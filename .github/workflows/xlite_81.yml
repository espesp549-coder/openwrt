      - name: "2. Syntax checks"
        run: |
          set -e
          for f in src/www/cgi-bin/xlite-phone src/usr/bin/xlite src/usr/share/xlite/calib.sh src/usr/share/xlite/pmtu.sh src/etc/init.d/xlite src/etc/hotplug.d/iface/90-xlite src/etc/hotplug.d/net/90-xlite-usb install.sh.in; do sh -n "$f"; bash -n "$f"; done
          for f in src/usr/share/rpcd/acl.d/luci-app-xlite.json src/usr/share/luci/menu.d/luci-app-xlite.json src/usr/share/xlite/data/apps.json; do python3 -m json.tool "$f" > /dev/null; done
          node -e "new Function('view','rpc','ui','poll','L','E', require('fs').readFileSync('src/www/luci-static/resources/view/xlite/app.js','utf8').replace(/^'require [a-z]+';$/mg,''))"
          node -e "new Function('baseclass','rpc','ui','poll','L','E', require('fs').readFileSync('src/www/luci-static/resources/xlite/ui_dev.js','utf8').replace(/^'require [a-z]+';$/mg,''))"
          for f in src/www/luci-static/resources/xlite/manifest.json; do python3 -m json.tool "$f" > /dev/null; done
          # the router's C library refuses a regex repeat over 255 (a page that never loads): none may slip in
          if grep -rnE '\{([0-9]*,)?([3-9][0-9]{2}|2[6-9][0-9]|25[6-9]|[0-9]{4,}),?\}' --include=*.uc src; then echo "regex repeat over 255"; exit 1; fi
          # ucode resolves a name when it compiles: a function calling one defined further down fails only when it runs
          # ("access to undeclared variable"), in the middle of a nightly measure or a repair. None may slip in
          python3 - src/usr/share/xlite/*.uc src/usr/share/rpcd/ucode/xlite.uc src/usr/share/ucode/xlite/*.uc <<'XLITE_FWDREF'
          #!/usr/bin/env python3
          # ucode resolves a name when it compiles: a function that calls another one defined further down the file (or uses a
          # top-level variable declared further down) fails when it runs, with "access to undeclared variable". Nothing shows it
          # before that code runs (a nightly measure, a rare repair), so every ucode file is checked here: a top-level name used
          # above its declaration, and not a local of the same name, is an error.
          #   fwdref.py file.uc ...      prints each use, exits 1 when there is one
          import re, sys

          def strip(src):
              """comments, strings and regex literals blanked (the lines kept); a template's ${...} kept"""
              out = []
              i, n = 0, len(src)
              last = ''   # last significant character written (to tell a regex from a division)
              def put(s):
                  nonlocal last
                  out.append(s)
                  t = s.strip()
                  if t:
                      last = t[-1]
              while i < n:
                  c = src[i]
                  if src.startswith('//', i):
                      j = src.find('\n', i)
                      j = n if j < 0 else j
                      out.append(' ' * (j - i)); i = j; continue
                  if src.startswith('/*', i):
                      j = src.find('*/', i + 2)
                      j = n if j < 0 else j + 2
                      out.append(re.sub(r'[^\n]', ' ', src[i:j])); i = j; continue
                  if c in '"\'':
                      j = i + 1
                      while j < n and src[j] != c:
                          if src[j] == '\\':
                              j += 1
                          j += 1
                      out.append(re.sub(r'[^\n]', ' ', src[i:j + 1])); last = 'x'; i = j + 1; continue
                  if c == '`':
                      j = i + 1
                      buf = [' ']
                      while j < n and src[j] != '`':
                          if src[j] == '\\':
                              buf.append('  '); j += 2; continue
                          if src.startswith('${', j):
                              d, k = 1, j + 2
                              while k < n and d:
                                  if src[k] == '{': d += 1
                                  elif src[k] == '}': d -= 1
                                  k += 1
                              buf.append('  ' + src[j + 2:k - 1] + ' '); j = k; continue
                          buf.append('\n' if src[j] == '\n' else ' '); j += 1
                      buf.append(' ')
                      out.append(''.join(buf)); last = 'x'; i = j + 1; continue
                  if c == '/' and (last == '' or last in '(,=:[!&|?{};+-*%<>~^'):
                      j = i + 1
                      while j < n and src[j] not in '/\n':
                          if src[j] == '\\':
                              j += 1
                          elif src[j] == '[':
                              while j < n and src[j] != ']':
                                  if src[j] == '\\':
                                      j += 1
                                  j += 1
                          j += 1
                      if j < n and src[j] == '/':
                          j += 1
                          while j < n and src[j].isalpha():
                              j += 1
                          out.append(' ' * (j - i)); last = 'x'; i = j; continue
                  put(c); i += 1
              return ''.join(out)

          bad = 0
          for path in sys.argv[1:]:
              src = open(path, encoding='utf-8').read()
              lines = strip(src).split('\n')
              raw = src.split('\n')
              decl = {}
              for ln, l in enumerate(lines, 1):
                  m = re.match(r'^(?:export\s+)?function\s+([A-Za-z_]\w*)', l)
                  if m:
                      decl.setdefault(m.group(1), ln); continue
                  m = re.match(r'^(?:export\s+)?(?:let|const)\s+(.*)', l)
                  if m:
                      # names at the top of the declaration list (not inside an initializer's brackets)
                      depth, cur, names = 0, '', []
                      for ch in m.group(1):
                          if ch in '([{': depth += 1
                          elif ch in ')]}': depth -= 1
                          if depth == 0 and ch == ',':
                              names.append(cur); cur = ''
                          else:
                              cur += ch
                      names.append(cur)
                      for nm in names:
                          mm = re.match(r'\s*([A-Za-z_]\w*)\s*(=|;|$)', nm)
                          if mm:
                              decl.setdefault(mm.group(1), ln)
              for name, dl in sorted(decl.items(), key=lambda x: x[1]):
                  nm = re.escape(name)
                  pat = re.compile(r'(?<![\w.$])' + nm + r'(?!\w)')
                  for ln in range(1, dl):
                      l = lines[ln - 1]
                      for m in pat.finditer(l):
                          after = l[m.end():].lstrip()
                          before = l[:m.start()].rstrip()
                          # an object key ({ name: ... }, a, name: ...), or a key read as ?.name (handled by [\w.] above)
                          if after.startswith(':') and (before.endswith('{') or before.endswith(',')):
                              continue
                          # the enclosing top-level block: from the last line that starts at column 0
                          st = ln
                          while st > 1 and not re.match(r'^[A-Za-z_]', lines[st - 1]):
                              st -= 1
                          body = '\n'.join(lines[st - 1:ln - 1]) + '\n' + l[:m.end()]
                          local = (re.search(r'\b(let|const)\s+[^;=]*?(?<![\w.])' + nm + r'(?!\w)', body) or
                                   re.search(r'function\s*\w*\s*\([^)]*(?<![\w.])' + nm + r'(?!\w)', body) or
                                   re.search(r'\([^()]*(?<![\w.])' + nm + r'(?!\w)[^()]*\)\s*=>', body + l[m.end():]) or
                                   re.search(r'(?<![\w.])' + nm + r'\s*=>', body + l[m.end():]) or
                                   re.search(r'for\s*\(\s*let\s+[^)]*?(?<![\w.])' + nm + r'(?!\w)', body) or
                                   re.search(r'catch\s*\(\s*' + nm + r'\s*\)', body))
                          if local:
                              continue
                          print('%s:%d: %s is used here but declared further down (line %d): %s' % (path, ln, name, dl, raw[ln - 1].strip()[:120]))
                          bad = 1
          sys.exit(bad)
          XLITE_FWDREF
          echo "- syntax: shell, json, LuCI view ok, ucode names declared before use" >> out/summary.md

