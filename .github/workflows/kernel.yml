name: Build Optimized OpenWrt 24.10.8 Official for 360T6M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_TAG: v24.10.8
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE_PKG: 360_t6m
  DTS_FILENAME: mt7621_360t6m-fixed.dts
  MK_FILENAME: 360_t6m.mk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout customization repo (files/)
        uses: actions/checkout@v4

      - name: Setup swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl xsltproc libelf-dev \
            libfuse-dev libsnmp-dev swig ccache cmake zstd device-tree-compiler

      - name: Clone Official OpenWrt source (${{ env.REPO_TAG }})
        run: |
          git clone --branch openwrt-24.10 --single-branch --depth 1 $REPO_URL openwrt
          cd openwrt
          git fetch --depth 1 origin tag $REPO_TAG
          git checkout $REPO_TAG
          echo "===== SOURCE ====="
          git log -1 --oneline

      - name: Cache toolchain build directories
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/toolchain-*
          key: toolchain-off-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('openwrt/include/kernel-*.mk', 'openwrt/toolchain/**') }}
          restore-keys: |
            toolchain-off-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: Cache downloaded package sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-off-${{ env.REPO_TAG }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-off-${{ env.REPO_TAG }}-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Locate and Inject custom DTS
        run: |
          FOUND_DTS=$(find . -name "${{ env.DTS_FILENAME }}" | head -n 1)
          if [ -z "$FOUND_DTS" ]; then
            echo "ERROR: Could not find file '${{ env.DTS_FILENAME }}' in the repo!"
            exit 1
          fi
          echo "Found DTS at: $FOUND_DTS"
          cp "$FOUND_DTS" openwrt/target/linux/ramips/dts/${{ env.DTS_FILENAME }}
          echo "DTS copied successfully."

      - name: Sanity-check DTS against mt7621.dtsi (fail fast, before full build)
        run: |
          cd openwrt
          DTS_DIR="target/linux/ramips/dts"
          DTS_FILE="${{ env.DTS_FILENAME }}"
          make target/linux/prepare V=s -j$(nproc) || true
          KDIR=$(find build_dir -maxdepth 2 -type d -name "linux-ramips_mt7621*" | head -n1)
          if [ -z "$KDIR" ]; then
            echo "WARNING: couldn't locate prepared kernel dir; skipping pre-build DTS check."
            exit 0
          fi
          INCLUDE_DIR="$KDIR/linux-6.6.*/include"
          cpp -nostdinc -undef -x assembler-with-cpp \
            -I "$DTS_DIR" -I $INCLUDE_DIR \
            "$DTS_DIR/$DTS_FILE" -o /tmp/360t6m.pre.dts
          dtc -@ -I dts -O dtb -o /tmp/360t6m.dtb /tmp/360t6m.pre.dts
          dtc -I dtb -O dts /tmp/360t6m.dtb > /tmp/360t6m.decompiled.dts

          echo "== Checking for required 24.10/kernel-6.6 ethernet nodes =="
          for pattern in "mediatek,mt7621-ethsys" "mediatek,mt7621-eth" "mediatek,mt7621" "label = \"lan1\"" "label = \"lan2\"" "label = \"lan3\"" "label = \"wan\""; do
            if ! grep -q -- "$pattern" /tmp/360t6m.decompiled.dts; then
              echo "ERROR: expected pattern not found in compiled devicetree: $pattern"
              exit 1
            fi
          done
          echo "DTS sanity check passed successfully."

      - name: Locate and Inject device definition into mt7621.mk
        run: |
          FOUND_MK=$(find . -name "${{ env.MK_FILENAME }}" | head -n 1)
          if [ -z "$FOUND_MK" ]; then
            echo "ERROR: Could not find file '${{ env.MK_FILENAME }}' in the repo!"
            exit 1
          fi
          echo "Found MK snippet at: $FOUND_MK"
          cd openwrt
          MK=target/linux/ramips/image/mt7621.mk
          if grep -q "Device/${DEVICE_PKG}" "$MK"; then
            echo "Device/${DEVICE_PKG} already defined in $MK — skipping append."
          else
            echo "" >> "$MK"
            cat "../$FOUND_MK" >> "$MK"
            echo "Appended device block to $MK"
          fi

      - name: Inject v2rayA opkg feed (key + repo) into image
        run: |
          mkdir -p openwrt/files/etc/opkg/keys
          curl -fsSL https://downloads.sourceforge.net/project/v2raya/openwrt/v2raya.pub \
            -o openwrt/files/etc/opkg/keys/94cc2a834fb0aa03
          mkdir -p openwrt/files/etc/opkg
          cat << 'EOF' >> openwrt/files/etc/opkg/customfeeds.conf
          src/gz v2raya https://downloads.sourceforge.net/project/v2raya/openwrt/mipsel_24kc
          EOF
          echo "v2rayA feed key + repo baked into image."

      - name: Inject TTL rewrite rule (nftables, TTL=65)
        run: |
          mkdir -p openwrt/files/usr/share/nftables.d/chain-pre/mangle_postrouting
          echo "ip ttl set 65" > openwrt/files/usr/share/nftables.d/chain-pre/mangle_postrouting/01-set-ttl.nft
          echo "TTL rule injected."

      - name: Set default WiFi SSIDs and password
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cat << 'EOF' > openwrt/files/etc/uci-defaults/97_wifi_names
          #!/bin/sh
          uci set wireless.default_radio0.ssid='2.44'
          uci set wireless.default_radio0.key='12345678'
          uci set wireless.default_radio1.ssid='5G5'
          uci set wireless.default_radio1.key='12345678'
          uci commit wireless
          exit 0
          EOF
          chmod +x openwrt/files/etc/uci-defaults/97_wifi_names

      - name: Inject Performance & Kernel Optimizations (sysctl.conf)
        run: |
          mkdir -p openwrt/files/etc
          cat << 'EOF' > openwrt/files/etc/sysctl.conf
          vm.swappiness=10
          vm.vfs_cache_pressure=50
          net.core.netdev_max_backlog = 10000
          net.core.somaxconn = 1024
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 87380 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          EOF
          echo "Performance sysctl.conf injected successfully."

      - name: Enable flow offloading + generate .config for 24.10 Official
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          CONFIG_CC_OPTIMIZE_FOR_SIZE=y
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y
          CONFIG_PACKAGE_kmod-nft-offload=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          # حل مشكلة التعارض: إلغاء dnsmasq العادي واستبداله بـ dnsmasq-full
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_ipset=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y

          CONFIG_PACKAGE_kmod-tcp-bbr=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_resolveip=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_bash=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-zram=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ip6tables-nft=y
          CONFIG_PACKAGE_kmod-nf-conncount=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          EOF
          make defconfig

      - name: Enable flow offloading in firewall defaults (software-only, fullcone off)
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cat << 'EOF' > openwrt/files/etc/uci-defaults/98_flow_offloading
          #!/bin/sh
          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='0'
          uci set firewall.@defaults[0].fullcone='0'
          uci set firewall.@zone[1].fullcone='0'
          uci commit firewall
          exit 0
          EOF
          chmod +x openwrt/files/etc/uci-defaults/98_flow_offloading

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Verify built firmware path & files
        run: |
          TARGET_DIR="openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"
          echo "Checking firmware output directory: $TARGET_DIR"
          if [ -d "$TARGET_DIR" ]; then
            echo "Directory exists. Contents:"
            ls -lh "$TARGET_DIR"
            if ls "$TARGET_DIR"/*360* 1> /dev/null 2>&1; then
              echo "Firmware bin files for 360T6M generated successfully!"
            else
              echo "ERROR: 360T6M bin files not found in output directory!"
              exit 1
            fi
          else
            echo "ERROR: Firmware output directory does not exist!"
            exit 1
          fi

      - name: List firmware
        if: success()
        run: |
          find openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/ -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Official-OpenWrt-24.10.8-360T6M-${{ github.run_number }}
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*
          if-no-files-found: error

      - name: Upload full package repository
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Package-Repo-Official-360T6M-${{ github.run_number }}
          path: openwrt/bin/packages/*
          if-no-files-found: warn
          
