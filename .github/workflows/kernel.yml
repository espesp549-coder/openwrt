name: Check MX2000 info

on:
  workflow_dispatch:

env:
  OWRT_TAG: v24.10.8
  PICKS: f76b846eea 4b6886d9fd 24db75d242 89dd393d8c
  FIXED_PATCH: 0116-remoteproc-qcom-Update-regmap-offsets-for-halt-regis.patch

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          mkdir -p reports

      - name: 1 - Clone and tree info
        run: |
          git clone --depth 1 --branch "$OWRT_TAG" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git config user.name ci
          git config user.email ci@example.com
          {
            echo "## Tree info"
            git log -1 --format='tag commit: %H %s'
            grep -E "KERNEL_PATCHVER|KERNEL_TESTING" target/linux/qualcommax/Makefile
            grep -E "LINUX_VERSION-6.6" include/kernel-version.mk
            echo "qualcommax patches-6.6 count: $(ls target/linux/qualcommax/patches-6.6 | wc -l)"
            echo "MX2000 mentions in clean tree:"
            grep -ril mx2000 target/linux/qualcommax || echo "none"
          } | tee ../reports/01-tree.txt

      - name: 2 - Inspect the picked commits
        working-directory: openwrt
        run: |
          git remote add up https://github.com/openwrt/openwrt.git
          git fetch --filter=blob:none up main
          for c in $PICKS; do
            echo "=== $c"
            git show --stat --format='%H%n%an %ad%n%s' "$c" | head -30
            echo "contained in:"
            git branch -r --contains "$c" | head -5
          done 2>&1 | tee ../reports/02-picks.txt

      - name: 3 - Cherry-pick
        working-directory: openwrt
        run: |
          for c in $PICKS; do
            if git cherry-pick -x "$c"; then echo "APPLIED $c"; else echo "CONFLICT $c"; git status --short | head -20; git cherry-pick --abort; fi
          done 2>&1 | tee ../reports/03-apply.txt

      - name: 4 - Device definition check
        working-directory: openwrt
        run: |
          {
            echo "## Files mentioning mx2000"
            grep -ril mx2000 target/linux/qualcommax || echo "none"
            echo "## ipq50xx.mk device block"
            grep -n -A12 -i "mx2000" target/linux/qualcommax/image/ipq50xx.mk || echo "no block"
            echo "## DTS list ipq50xx"
            ls target/linux/qualcommax/files/arch/arm64/boot/dts/qcom 2>/dev/null | grep -i -E "ipq5018|mx"
            echo "## 02_network / board files"
            grep -rn -i mx2000 target/linux/qualcommax/ipq50xx || echo "none"
          } 2>&1 | tee ../reports/04-device.txt

      - name: 5 - Config and tools
        working-directory: openwrt
        run: |
          printf '%s\n' CONFIG_TARGET_qualcommax=y CONFIG_TARGET_qualcommax_ipq50xx=y > .config
          make defconfig 2>&1 | tail -20
          grep -E "DEVICE_.*mx2000" .config || echo "NO mx2000 device in .config"
          make -j$(nproc) tools/install > ../reports/05-tools.log 2>&1
          tail -3 ../reports/05-tools.log

      - name: 6 - Kernel prepare with ORIGINAL patches
        working-directory: openwrt
        continue-on-error: true
        run: |
          make -j$(nproc) target/linux/prepare V=s > ../reports/06-prepare-original.log 2>&1 \
            && echo PREPARE_OK || echo PREPARE_FAILED
          grep -n -E "FAILED|Patch failed|\.rej" ../reports/06-prepare-original.log | head -20

      - name: 7 - Retry with FIXED 0116 patch
        working-directory: openwrt
        continue-on-error: true
        run: |
          make target/linux/clean > /dev/null 2>&1 || true
          cp "../fixes/$FIXED_PATCH" "target/linux/qualcommax/patches-6.6/$FIXED_PATCH"
          make -j$(nproc) target/linux/prepare V=s > ../reports/07-prepare-fixed.log 2>&1 \
            && echo PREPARE_OK || echo PREPARE_FAILED
          grep -n -E "FAILED|Patch failed|\.rej" ../reports/07-prepare-fixed.log | head -20

      - name: 8 - Summary
        if: always()
        run: |
          for f in reports/0[1-4]*.txt; do echo "### $f"; cat "$f"; done >> "$GITHUB_STEP_SUMMARY"
          for f in reports/06*.log reports/07*.log; do echo "### $f (last 30)"; tail -30 "$f"; done >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
