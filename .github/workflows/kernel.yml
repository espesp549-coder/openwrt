name: Diagnose MX2000 OpenWrt 24.10.8 (NO firmware build)

on:
  workflow_dispatch:

env:
  TAG: v24.10.8
  BASE: e3bec5692c50ff3b8001d4611c8eb57f54efb6b5

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 0. Prepare reports
        run: |
          mkdir -p out
          cat > out/README.txt <<'EOF'
          MX2000 diagnostic run only.
          This workflow does NOT compile a full firmware image and does NOT flash a router.
          Review each numbered report and the workflow step results.
          EOF
          {
            echo "UTC: $(date -u)"
            echo "Runner: $(uname -a)"
            echo "CPU threads: $(nproc)"
            free -h
            df -h /
          } > out/00-runner.txt

      - name: 1. Install diagnostic/build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget curl xsltproc libelf-dev libfuse-dev swig cmake zstd \
            device-tree-compiler quilt

      - name: 2. Clone tag and verify source commits
        continue-on-error: true
        run: |
          set +e
          git clone --filter=blob:none https://github.com/openwrt/openwrt openwrt > out/01-clone.log 2>&1
          RC=$?
          echo "clone exit=$RC" >> out/01-source-checks.txt
          if [ "$RC" -ne 0 ]; then tail -n 60 out/01-clone.log; exit 0; fi
          cd openwrt
          git checkout -b mx2000-diagnose "$TAG" >> ../out/01-clone.log 2>&1
          echo "tag=$TAG" >> ../out/01-source-checks.txt
          echo "tag_commit=$(git rev-parse HEAD 2>&1)" >> ../out/01-source-checks.txt
          git cat-file -e "$BASE^{commit}" 2>../out/01-base-check.err
          echo "base_commit_exists_exit=$?" >> ../out/01-source-checks.txt
          git show -s --format='%H%n%cs%n%s' "$BASE" > ../out/01-base-details.txt 2>&1
          git log -1 --oneline
          grep -n 'KERNEL_PATCHVER' target/linux/qualcommax/Makefile > ../out/01-kernel-version.txt 2>&1
          git show "$BASE:target/linux/qualcommax/Makefile" 2>/dev/null | grep -n 'KERNEL_PATCHVER' >> ../out/01-kernel-version.txt
          git status --short >> ../out/01-source-checks.txt
          exit 0

      - name: 3. Inspect MX2000 and firmware paths in base commit
        continue-on-error: true
        run: |
          set +e
          cd openwrt || exit 0
          {
            for p in \
              target/linux/qualcommax/ipq50xx/target.mk \
              target/linux/qualcommax/ipq50xx.mk \
              target/linux/qualcommax/image/ipq50xx.mk \
              target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts \
              package/firmware/ipq-wifi/Makefile \
              package/firmware/ath11k-firmware/Makefile \
              package/boot/uboot-envtools/files/qualcommax_ipq50xx; do
              echo "===== $p"
              git cat-file -e "$BASE:$p" 2>/dev/null
              echo "exists_in_BASE_exit=$?"
              git ls-tree -r --name-only "$BASE" -- "$p"
            done
          } > ../out/02-base-path-audit.txt 2>&1
          git ls-tree -r --name-only "$BASE" package/boot/uboot-envtools/files/ > ../out/02-uboot-envtools-paths.txt 2>&1
          git ls-tree -r --name-only "$BASE" target/linux/qualcommax/ | grep -Ei 'mx2000|ipq50xx.mk|config-default|patches-6.6/011[36]' > ../out/02-mx2000-files.txt
          git show "$BASE:target/linux/qualcommax/image/ipq50xx.mk" > ../out/02-ipq50xx-image-mk.txt 2>&1
          git show "$BASE:package/boot/uboot-envtools/Makefile" > ../out/02-uboot-envtools-makefile.txt 2>&1
          exit 0

      - name: 4. Overlay target and firmware files in temporary working tree
        continue-on-error: true
        run: |
          set +e
          cd openwrt || exit 0
          for d in target/linux/qualcommax package/firmware/ipq-wifi package/firmware/ath11k-firmware; do
            git rm -r -q --ignore-unmatch "$d"
            git checkout "$BASE" -- "$d" 2>> ../out/03-overlay-errors.txt
            echo "$? checkout $d" >> ../out/03-overlay-status.txt
          done
          git checkout "$BASE" -- package/boot/uboot-envtools/files/qualcommax_ipq50xx 2>> ../out/03-overlay-errors.txt
          echo "$? checkout uboot-envtools device file" >> ../out/03-overlay-status.txt
          {
            echo "===== MX2000 references"
            grep -Rni 'linksys_mx2000\|linksys,mx2000' target/linux/qualcommax package/firmware/ipq-wifi package/boot/uboot-envtools/files 2>/dev/null | head -n 250
            echo "===== QCN6122 references"
            grep -Rni 'qcn6122' package/kernel/mac80211 package/firmware/ath11k-firmware target/linux/qualcommax 2>/dev/null | head -n 150
            echo "===== IPQ5018 firmware references"
            grep -Rni 'ipq5018' package/firmware/ath11k-firmware 2>/dev/null | head -n 100
          } > ../out/03-reference-audit.txt
          git status --short > ../out/03-working-tree-status.txt
          exit 0

      - name: 5. Inspect key patch files and apply generic backports
        continue-on-error: true
        run: |
          set +e
          cd openwrt || exit 0
          {
            for c in f76b846eea 4b6886d9fd 24db75d242 89dd393d8c; do
              echo "===== $c"
              git show -s --format='%H %s' "$c" 2>&1
              echo "commit_exists_exit=$?"
              git show --stat --oneline "$c" 2>&1
            done
          } > ../out/04-commit-audit.txt
          mkdir -p ../out/patch-apply
          for c in f76b846eea 4b6886d9fd 24db75d242 89dd393d8c; do
            git format-patch -1 --stdout "$c" -- target/linux/generic package/kernel > /tmp/mx-p.patch 2>> ../out/04-patch-errors.txt
            if [ -s /tmp/mx-p.patch ]; then
              git am -3 /tmp/mx-p.patch > /tmp/mx-am.log 2>&1
              rc=$?
              cat /tmp/mx-am.log >> ../out/04-patch-errors.txt
              if [ "$rc" -eq 0 ]; then echo "APPLIED $c" >> ../out/04-apply-status.txt
              else
                git am --abort >/dev/null 2>&1
                echo "FAILED $c exit=$rc" >> ../out/04-apply-status.txt
              fi
            else
              echo "NOOP/no generic or kernel-package patch for $c" >> ../out/04-apply-status.txt
            fi
          done
          find package/kernel/mac80211/patches -type f 2>/dev/null | grep -i 'qcn6122' > ../out/04-qcn6122-patches.txt
          find target/linux/generic -type f 2>/dev/null | grep -Ei 'qpic|snand' > ../out/04-qpic-snand-files.txt
          exit 0

      - name: 6. Check 0113/0116 patch hunks (report only; do not edit)
        continue-on-error: true
        run: |
          set +e
          cd openwrt/target/linux/qualcommax/patches-6.6 || exit 0
          {
            for p in 0113-remoteproc-qcom-Add-secure-PIL-support.patch 0116-remoteproc-qcom-Update-regmap-offsets-for-halt-regis.patch; do
              echo "===== $p"
              if [ -f "$p" ]; then
                grep -n -E '^Subject:|^@@|MAX_HALT_REG|halt_reg\\[' "$p"
                echo "hunk_count=$(grep -c '^@@' "$p")"
              else
                echo "MISSING"
              fi
            done
          } > "$GITHUB_WORKSPACE/out/05-halt-patches.txt"
          cd "$GITHUB_WORKSPACE/openwrt"
          git show "$BASE:target/linux/qualcommax/patches-6.6/0113-remoteproc-qcom-Add-secure-PIL-support.patch" > /tmp/base-0113.patch 2>/dev/null
          echo "base_0113_exit=$?" >> ../out/05-halt-patches.txt
          git show "$BASE:target/linux/qualcommax/patches-6.6/0116-remoteproc-qcom-Update-regmap-offsets-for-halt-regis.patch" > /tmp/base-0116.patch 2>/dev/null
          echo "base_0116_exit=$?" >> ../out/05-halt-patches.txt
          exit 0

      - name: 7. Check feeds, device config, and image naming (no compilation)
        continue-on-error: true
        run: |
          set +e
          cd openwrt || exit 0
          ./scripts/feeds update -a > ../out/06-feeds-update.log 2>&1
          echo "feeds_update_exit=$?" >> ../out/06-config-status.txt
          ./scripts/feeds install -a > ../out/06-feeds-install.log 2>&1
          echo "feeds_install_exit=$?" >> ../out/06-config-status.txt
          cat > .config <<'CFG'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mx2000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CFG
          make defconfig > ../out/06-defconfig.log 2>&1
          echo "defconfig_exit=$?" >> ../out/06-config-status.txt
          grep -E '^(CONFIG_TARGET_qualcommax|CONFIG_TARGET_qualcommax_ipq50xx|CONFIG_TARGET_PROFILE=|CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mx2000|CONFIG_PACKAGE_(luci|ipq-wifi-linksys_mx2000|kmod-ath11k-ahb|uboot-envtools)|CONFIG_TARGET_ROOTFS_INITRAMFS)' .config > ../out/06-config-result.txt
          {
            echo "===== device image definition"
            grep -Rni -A18 -B5 'linksys_mx2000' target/linux/qualcommax/ipq50xx target/linux/qualcommax/image 2>/dev/null | head -n 250
            echo "===== firmware package definitions"
            grep -n -i -E 'mx2000|qcn6122|ipq5018' package/firmware/ipq-wifi/Makefile package/firmware/ath11k-firmware/Makefile 2>/dev/null
            echo "===== uboot-envtools device config references"
            grep -Rni -E 'mx2000|ipq50xx|ubootenv_' package/boot/uboot-envtools 2>/dev/null | head -n 200
          } > ../out/06-device-config-audit.txt
          exit 0

      - name: 8. Kernel patch application check (prepare only; no full build)
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set +e
          cd openwrt || exit 0
          make -j2 target/linux/prepare V=s > ../out/07-kernel-prepare.log 2>&1
          RC=$?
          echo "kernel_prepare_exit=$RC" > ../out/07-kernel-prepare-status.txt
          grep -n -B4 -A10 -E 'Hunk #[0-9]+ FAILED|FAILED|Patch failed|can't find file|No such file|ERROR:|Error [0-9]+' ../out/07-kernel-prepare.log > ../out/07-patch-errors.txt
          tail -n 100 ../out/07-kernel-prepare.log > ../out/07-kernel-prepare-tail.txt
          exit 0

      - name: 9. Summary
        if: always()
        run: |
          {
            echo "# MX2000 diagnostic summary"
            echo
            echo "This run does not build a complete firmware image and does not flash a device."
            echo
            for f in out/01-source-checks.txt out/03-overlay-status.txt out/04-apply-status.txt out/05-halt-patches.txt out/06-config-status.txt out/06-config-result.txt out/07-kernel-prepare-status.txt; do
              if [ -f "$f" ]; then
                echo "## $f"
                echo '```'
                cat "$f"
                echo '```'
                echo
              fi
            done
          } > out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 10. Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx2000-diagnostic-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          
