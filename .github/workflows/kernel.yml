name: Probe MX2000 on 24.10.8 (overlay + kernel patch test)

on:
  workflow_dispatch:

env:
  TAG: v24.10.8
  BASE: e3bec5692c50ff3b8001d4611c8eb57f54efb6b5   # آخر commit بالـ main قبل نسخ 6.12

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl xsltproc libelf-dev \
            libfuse-dev swig cmake zstd device-tree-compiler quilt

      - name: Clone 24.10.8 and add main as remote
        run: |
          mkdir -p out
          git clone --filter=blob:none https://github.com/openwrt/openwrt openwrt
          cd openwrt
          git config user.email "ci@example.com"
          git config user.name "ci"
          git checkout -b mx2000 $TAG
          git log -1 --oneline | tee ../out/00-source.txt

      - name: Report files touched by the key commits
        run: |
          cd openwrt
          for c in 34d9172655 ea83f7de2b 552056622d f76b846eea 398f4a9737 \
                   4b6886d9fd 24db75d242 89dd393d8c abd0418684 \
                   648d070c76 fe17cc1bfd 3b7a92754e; do
            git show --stat --format='=== %h %s' $c -- >> ../out/01-key-commits-stat.txt
          done
          wc -l ../out/01-key-commits-stat.txt

      - name: Overlay qualcommax + firmware packages from main@BASE
        run: |
          cd openwrt
          for d in target/linux/qualcommax package/firmware/ipq-wifi package/firmware/ath11k-firmware; do
            git rm -r -q --ignore-unmatch $d
            git checkout $BASE -- $d
          done
          git commit -q -m "overlay ipq50xx support from main@$BASE"
          git diff --stat HEAD~1 | tail -n 5 | tee ../out/02-overlay-stat.txt

      - name: Apply the generic / kernel-package parts of the key commits
        run: |
          cd openwrt
          for c in f76b846eea 4b6886d9fd 24db75d242 89dd393d8c abd0418684 648d070c76 fe17cc1bfd; do
            git format-patch -1 --stdout $c -- target/linux/generic package/kernel > /tmp/p.patch || true
            if [ -s /tmp/p.patch ]; then
              if git am -3 /tmp/p.patch; then
                echo "APPLIED $c" >> ../out/03-apply.txt
              else
                git am --abort || true
                echo "FAILED  $c" >> ../out/03-apply.txt
              fi
            else
              echo "NOOP    $c (nothing outside qualcommax)" >> ../out/03-apply.txt
            fi
          done
          cat ../out/03-apply.txt

      - name: Feeds and minimal config
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mx2000=y
          EOF
          make defconfig 2>&1 | tee ../out/04-defconfig.txt
          grep -E "linksys_mx2000|qualcommax_ipq50xx" .config | tee ../out/04-config-check.txt

      - name: Build host tools
        run: |
          cd openwrt
          make -j$(nproc) tools/install V=s > ../out/05-tools.log 2>&1 || (tail -n 60 ../out/05-tools.log; exit 1)

      - name: Download kernel and apply patches (the real test)
        run: |
          cd openwrt
          make -j$(nproc) target/linux/prepare V=s > ../out/06-kernel-prepare.log 2>&1 || true
          tail -n 80 ../out/06-kernel-prepare.log
          grep -n -E "Hunk #.*FAILED|can't find file|Patch failed|\*\*\*" ../out/06-kernel-prepare.log | head -n 80 > ../out/07-patch-errors.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-mx2000
          path: out/
