          /etc/init.d/xlite enable
          rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
          /etc/init.d/rpcd restart > /dev/null 2>&1
          sleep 1

          if [ "$(uci -q get xlite.main.enabled)" = 1 ]; then
          	/etc/init.d/xlite restart
          	say "XLite اشتغل من جديد"
          fi
          say "تم: XLite $VERSION"
          say "$CORE_NOTE"
          if [ -z "$XLITE_UPDATE" ]; then
          	say "افتح LuCI: Services ← XLite، ضيف رابط السيرفر، ودوس الزر حتى يصير متصل."
          	[ -x /etc/init.d/v2raya ] && say "v2rayA يبقى شغال لحد ما تدوس متصل بـ XLite (ساعتها ينطفي وحده)."
          fi
          exit 0
          XLITE_INSTALLER
          find src -type f | sort

