          if [ $TPROXY = 0 ]; then
          	[ "$(uci -q get xlite.main.impl)" = redirect ] || { uci -q set xlite.main.impl=redirect; uci -q set xlite.main.impl_auto=1; }
          elif [ "$(uci -q get xlite.main.impl_auto)" = 1 ]; then
          	uci -q set xlite.main.impl=tproxy; uci -q delete xlite.main.impl_auto
          	say "kmod-nft-tproxy موجود: رجع التحويل tproxy (TCP + UDP)"
          fi
          uci -q commit xlite

          # an old hand fix (v1.0) appended an export line to lib.uc; it breaks the new one: take it out, then
          # check that the backend compiles before LuCI uses it
          sed -i '/^export { parse_link, outbound, xray_config, nft_rules, nft_redirect };$/d' /usr/share/ucode/xlite/lib.uc
