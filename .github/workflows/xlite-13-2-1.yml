          'require view';
          'require rpc';

          // XLite page loader. The page itself is /luci-static/resources/xlite/ui_<version>.js: a new name for
          // every release, so a browser can never show the page of an older version from its cache.
          var callStatus = rpc.declare({ object: 'xlite', method: 'status' });

          return view.extend({
          	load: function() {
          		return callStatus().then(function(st) {
          			var v = ((st && st.release && st.release.version) || 'dev').replace(/[^0-9A-Za-z]/g, '_');
          			return L.require('xlite.ui_' + v).then(function(ui) { return [ ui, st ]; });
          		});
          	},

          	render: function(d) {
          		return d[0].mount(d[1]);
          	},

          	handleSave: null,
          	handleSaveApply: null,
          	handleReset: null
          });
