          mkdir -p "$(dirname "src/usr/share/xlite/gen.uc")"
          cat > "src/usr/share/xlite/gen.uc" <<'XLITE_FILE_12'
          // XLite helper: ucode /usr/share/xlite/gen.uc <command> [args]
          //   build <outdir>     xray config + nft rules + env for the selected server (exit 1 = nothing to run)
          //   add               share links on stdin (one per line) -> server sections; prints a JSON report
          //   resolve <host>    IPv4 addresses of a host (one per line)
          //   server <id>       "address port" of a server
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';
          import * as lib from 'xlite.lib';

          const CONFDIR = getenv('XLITE_UCI_DIR');
          const SHARE = getenv('XLITE_SHARE') ?? '/usr/share/xlite';
          const IS_IP4 = /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/;
          const IS_IP6 = /^[0-9A-Fa-f:]+:[0-9A-Fa-f:.]*$/;

          function uci() {
          	let c = CONFDIR ? cursor(CONFDIR) : cursor();
          	c.load('xlite');
          	return c;
          }

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function lines(s) {
          	return filter(map(split(s ?? '', '\n'), (x) => trim(x)), (x) => x != '');
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          function resolve(host) {
          	if (match(host, IS_IP4))
          		return [ host ];
          	if (match(host, IS_IP6))
          		return [ host ];
          	// the local resolver first; public ones when it does not answer (dnsmasq may point at the
          	// core's DNS port while the core is down)
          	let ips = [];
          	for (let dns in [ '', '1.1.1.1', '8.8.8.8' ]) {
          		let out = sh('{ command -v timeout > /dev/null 2>&1 && T="timeout 4"; $T nslookup ' + shq(host) + (dns ? ' ' + dns : '') + ' 2>/dev/null; }'), seen = false;
          		for (let l in split(out, '\n')) {
          			if (match(l, /^Name:/))
          				seen = true;
          			else if (seen) {
          				let m = match(l, /([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          				// 198.18.0.0/15: a FakeDNS answer of the core, not the real address
          				if (m && index(ips, m[1]) < 0 && !match(m[1], /^198\.1[89]\./))
          					push(ips, m[1]);
          			}
          		}
          		if (length(ips))
          			break;
          	}
          	return ips;
          }

          function ifdevs(ifaces) {
          	let devs = [];
          	for (let i in ifaces) {
          		let j = null;
          		try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          		for (let d in [ j?.l3_device, j?.device ])
          			if (d && index(devs, d) < 0)
          				push(devs, d);
          	}
          	return devs;
          }

          function zone_networks(c, zname) {
          	let nets = [];
          	c.load('firewall');
          	c.foreach('firewall', 'zone', (z) => {
          		if (z.name == zname)
          			for (let n in (type(z.network) == 'array' ? z.network : split(z.network ?? '', ' ')))
          				if (n != '')
          					push(nets, n);
          	});
          	return nets;
          }

          function local_ips(fam) {
          	let ips = [];
          	for (let l in lines(sh('ip -' + fam + ' -o addr show 2>/dev/null'))) {
          		let m = match(l, fam == 4 ? /inet ([0-9.]+)\// : /inet6 ([0-9a-fA-F:]+)\//);
          		if (m && index(ips, m[1]) < 0)
          			push(ips, m[1]);
          	}
          	return ips;
          }

          function ipv6_on(opt) {
          	if (opt.ipv6 == '0')
          		return false;
          	if (!fs.stat('/proc/net/if_inet6'))
          		return false;
          	if (opt.ipv6 == '1')
          		return true;
          	return length(lines(sh('ip -6 route show default 2>/dev/null'))) > 0;
          }

          function servers(c) {
          	let r = [];
          	c.foreach('xlite', 'server', (s) => {
          		let p = lib.parse_link(s.link);
          		push(r, { id: s['.name'], name: s.name || p.name, link: s.link, sub: s.sub, parsed: p });
          	});
          	return r;
          }

          function readlist(path) {
          	let t = fs.readfile(path);
          	return t ? filter(lines(t), (x) => substr(x, 0, 1) != '#') : [];
          }

          function words(s) {
          	if (type(s) == 'array')
          		return s;
          	return filter(split(s ?? '', /[ ,\n\t]+/), (x) => x != '');
          }

          // user typed domains: "x.com" -> "domain:x.com"; keep "full:", "domain:", "keyword:", "regexp:", "geosite:"
          function domrule(d) {
          	d = lc(trim(d));
          	if (match(d, /^(full|domain|keyword|regexp|geosite):/))
          		return d;
          	d = replace(d, /^\*?\./, '');
          	// digits and dots only: an IPv4 address (the caller puts it in an ip rule), never a domain
          	if (match(d, /^[0-9.]+$/))
          		return null;
          	return match(d, /^[a-z0-9.-]+$/) ? 'domain:' + d : null;
          }

          function add_ip(ctx4, ctx6, ip) {
          	if (index(ip, ':') >= 0) { if (index(ctx6, ip) < 0) push(ctx6, ip); }
          	else if (index(ctx4, ip) < 0) push(ctx4, ip);
          }

          function wg_kernel_ok() {
          	if (getenv('XLITE_WG_KERNEL'))
          		return getenv('XLITE_WG_KERNEL') == '1';
          	return !!(fs.stat('/lib/netifd/proto/wireguard.sh') && (fs.stat('/sys/module/wireguard') ||
          		length(lines(sh('find /lib/modules -name wireguard.ko 2>/dev/null')))));
          }

          const NET_KEYS = [ 'proto', 'private_key', 'addresses', 'mtu', 'fwmark' ];

          // kernel WireGuard interface "xlwg" for the second server (null = remove it). Returns true if
          // /etc/config/network or firewall changed (the caller reloads them).
          function wg_apply(srv) {
          	let c = CONFDIR ? cursor(CONFDIR) : cursor();
          	c.load('network');
          	c.load('firewall');
          	let changed = false;
          	let want = srv ? {
          		iface: { proto: 'wireguard', private_key: srv.secret, addresses: srv.local, mtu: '' + (+srv.mtu || 1280), fwmark: '0x80' },
          		peer: { public_key: srv.pubkey, endpoint_host: srv.ip, endpoint_port: '' + srv.port, allowed_ips: [ '0.0.0.0/0', '::/0' ],
          			route_allowed_ips: '0', persistent_keepalive: '25', preshared_key: srv.psk ?? '' }
          	} : null;
          	let cur = c.get_all('network', 'xlwg');
          	let peer = c.get_all('network', 'xlwg_peer');
          	if (!want) {
          		for (let sec in [ 'xlwg', 'xlwg_peer', 'xlwg_rule', 'xlwg_rule6', 'xlwg_route', 'xlwg_route6' ])
          			if (c.get('network', sec)) { c.delete('network', sec); changed = true; }
          		for (let sec in [ 'xlwg_zone', 'xlwg_fwd' ])
          			if (c.get('firewall', sec)) { c.delete('firewall', sec); changed = true; }
          	}
          	else {
          		let same = (a, b) => sprintf('%J', a ?? '') == sprintf('%J', b ?? '');
          		let diff = !cur || !peer;
          		for (let k in NET_KEYS) if (!diff && !same(cur[k], want.iface[k])) diff = true;
          		for (let k, v in want.peer) if (!diff && !same(peer[k], v == '' ? null : v)) diff = true;
          		if (diff) {
          			c.set('network', 'xlwg', 'interface');
          			for (let k, v in want.iface) c.set('network', 'xlwg', k, v);
          			c.set('network', 'xlwg_peer', 'wireguard_xlwg');
          			for (let k, v in want.peer) if (v != '') c.set('network', 'xlwg_peer', k, v); else c.delete('network', 'xlwg_peer', k);
          			changed = true;
          		}
          		if (!c.get('network', 'xlwg_rule')) {
          			c.set('network', 'xlwg_rule', 'rule'); c.set('network', 'xlwg_rule', 'mark', '0x100/0x100'); c.set('network', 'xlwg_rule', 'lookup', '102'); c.set('network', 'xlwg_rule', 'priority', '90');
          			c.set('network', 'xlwg_rule6', 'rule6'); c.set('network', 'xlwg_rule6', 'mark', '0x100/0x100'); c.set('network', 'xlwg_rule6', 'lookup', '102'); c.set('network', 'xlwg_rule6', 'priority', '90');
          			c.set('network', 'xlwg_route', 'route'); c.set('network', 'xlwg_route', 'interface', 'xlwg'); c.set('network', 'xlwg_route', 'target', '0.0.0.0/0'); c.set('network', 'xlwg_route', 'table', '102');
          			c.set('network', 'xlwg_route6', 'route6'); c.set('network', 'xlwg_route6', 'interface', 'xlwg'); c.set('network', 'xlwg_route6', 'target', '::/0'); c.set('network', 'xlwg_route6', 'table', '102');
          			changed = true;
          		}
          		if (!c.get('firewall', 'xlwg_zone')) {
          			c.set('firewall', 'xlwg_zone', 'zone');
          			for (let k, v in { name: 'xlwg', network: [ 'xlwg' ], input: 'REJECT', output: 'ACCEPT', forward: 'REJECT', masq: '1', masq6: '1', mtu_fix: '1' })
          				c.set('firewall', 'xlwg_zone', k, v);
          			c.set('firewall', 'xlwg_fwd', 'forwarding'); c.set('firewall', 'xlwg_fwd', 'src', 'lan'); c.set('firewall', 'xlwg_fwd', 'dest', 'xlwg');
          			changed = true;
          		}
          		// IPv6 into the tunnel needs its own masquerade in fw4 (a zone made by an older version lacks it)
          		else if (c.get('firewall', 'xlwg_zone', 'masq6') != '1') {
          			c.set('firewall', 'xlwg_zone', 'masq6', '1');
          			changed = true;
          		}
          	}
          	if (changed) {
          		c.save('network'); c.commit('network');
          		c.save('firewall'); c.commit('firewall');
          	}
          	return changed;
          }

          // line bonding: every line gets its own route table (110 + n) for the core's connections bound to it.
          // Returns { devs: the lines in use (fewer than two: no bonding), lines: every line that is up (the monitor checks them) }
          function bond_apply(opt) {
          	sh('for i in 1 2 3 4 5 6 7 8 9; do ip rule del priority 85 2>/dev/null || break; done; for t in 110 111 112 113 114 115 116 117; do ip route flush table $t 2>/dev/null; done');
          	// speed caps set earlier come off first (only on the lines XLite capped: never a qdisc of SQM or the user)
          	let tcf = '/tmp/xlite/bond_tc';
          	for (let d in words(fs.readfile(tcf) ?? ''))
          		sh('tc qdisc del dev ' + shq(d) + ' ingress 2>/dev/null; tc qdisc del dev ' + shq(d) + ' root 2>/dev/null');
          	fs.unlink(tcf);
          	if (opt.bond != '1')
          		return { devs: [], lines: [] };
          	let paused = words(opt.bond_paused), caps = {}, capped = [];
          	for (let w in words(opt.bond_limits)) { let m = match(w, /^([A-Za-z0-9_-]+):([0-9]+)$/); if (m && +m[2] > 0) caps[m[1]] = +m[2]; }
          	let devs = [], lines = [], wts = [], wt = {}, addr = {}, ips = [], ifs = [];
          	for (let w in words(opt.bond_addr)) { let m = match(w, /^([A-Za-z0-9_-]+):([0-9]{1,3}(\.[0-9]{1,3}){3})$/); if (m) addr[m[1]] = m[2]; }
          	for (let w in words(opt.bond_weights)) { let m = match(w, /^([A-Za-z0-9_-]+):([1-8])$/); if (m) wt[m[1]] = +m[2]; }
          	for (let i in slice(words(opt.bond_ifaces), 0, 8)) {
          		let j = null;
          		try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          		let dev = j?.l3_device;
          		if (!j?.up || !dev || index(devs, dev) >= 0)
          			continue;
          		push(lines, { iface: i, dev, addr: addr[i] });
          		// the server answers on this line while the main route points at another: strict reverse-path
          		// filtering (OpenWrt's default) would drop every answer
          		fs.writefile('/proc/sys/net/ipv4/conf/' + dev + '/rp_filter', '2');
          		if (index(paused, i) >= 0)
          			continue;
          		let gw = null;
          		for (let r in j.route ?? [])
          			if (r.target == '0.0.0.0' && r.mask == 0 && r.nexthop != '0.0.0.0') gw = r.nexthop;
          		let t = 110 + length(devs);
          		sh(sprintf('ip route replace default %sdev %s table %d && ip rule add oif %s lookup %d priority 85',
          			gw ? 'via ' + gw + ' ' : '', shq(dev), t, shq(dev), t));
          		// speed cap, both ways: download policed on the way in, upload shaped on the way out
          		// (needs kmod-sched-core; without it the tc lines fail and the line runs uncapped)
          		// a line shaped by SQM (cake / htb, or its ingress) keeps SQM: replacing it would undo the user's setup
          		let sqm = caps[i] ? sh('tc qdisc show dev ' + shq(dev) + ' 2>/dev/null') : '';
          		if (caps[i] && match(sqm, /qdisc (cake|htb|hfsc)|qdisc ingress/))
          			sh('logger -t xlite ' + shq('line ' + i + ' is shaped by SQM: its XLite speed cap is left out'));
          		else if (caps[i]) {
          			let q = shq(dev), r = caps[i] + 'mbit';
          			sh(`tc qdisc replace dev ${q} root tbf rate ${r} burst 64kb latency 60ms 2>/dev/null; ` +
          				`tc qdisc add dev ${q} handle ffff: ingress 2>/dev/null && tc filter add dev ${q} parent ffff: matchall action police rate ${r} burst 256k drop 2>/dev/null`);
          			push(capped, dev);
          		}
          		push(devs, dev);
          		push(ifs, i);
          		push(wts, wt[i] ?? 1);
          		push(ips, addr[i]);
          	}
          	if (length(capped))
          		fs.writefile(tcf, join(' ', capped) + '\n');
          	if (length(devs) >= 2) {
          		// lines of different MTU (4G, PPPoE) behind one tunnel: probe the path MTU instead of stalling on big
          		// packets that get lost; socket buffers big enough for a fast line to a far server (memory permitting)
          		let put = (k, v) => fs.writefile('/proc/sys/net/' + k, v);
          		put('ipv4/tcp_mtu_probing', '1');
          		let mt = +(match(fs.readfile('/proc/meminfo') ?? '', /MemTotal: +([0-9]+)/)?.[1] ?? 0);
          		if (mt >= 200000) {
          			put('core/rmem_max', '4194304'); put('core/wmem_max', '4194304');
          			put('ipv4/tcp_rmem', '4096 131072 4194304'); put('ipv4/tcp_wmem', '4096 65536 4194304');
          		}
          		// BBR for the tunnels: load it when the kernel has it as a module
          		if (index(fs.readfile('/proc/sys/net/ipv4/tcp_available_congestion_control') ?? '', 'bbr') < 0)
          			sh('modprobe tcp_bbr 2>/dev/null');
          	}
          	return { devs: (length(devs) >= 2) ? devs : [], lines, weights: wts, ips, ifs };
          }

          function load_apps() {
          	try { return json(fs.readfile(SHARE + '/data/apps.json')); } catch (e) { return { apps: [], iraq_domains: [] }; }
          }

          function pick(all, id) {
          	let s = filter(all, (x) => x.id == id)[0];
          	if (!s || s.parsed.error)
          		return null;
          	// sid / sname: the uci section (r.id is the server's own user id)
          	let r = { ...s.parsed, sid: s.id, sname: s.name };
          	let ips = resolve(r.address);
          	if (!length(ips))
          		return { error: 'resolve', sid: s.id, sname: s.name };
          	r.ip = ips[0];
          	return r;
          }

          const ADGUARD = [ '94.140.14.14', '94.140.15.15' ];

          // dnsmasq lines XLite adds while it runs (a runtime file only: a reboot or a stop gives the normal DNS back)
          function dnsmasq_conf(opt) {
          	let l = [];
          	let ad = opt.adblock ?? 'off';
          	let tp = (opt.transparent ?? 'all') != 'off';
          	let hijack = ((opt.antipollution ?? 'none') != 'none' || opt.special == 'fakedns') && tp;
          	// the user's DNS servers (real addresses only)
          	let plain = filter(map(split(opt.dns_upstream || '1.1.1.1', /[ ,]+/), (x) => trim(x)), (x) => lib.ip4_ok(x) || lib.ip6_ok(x));
          	if (!length(plain))
          		plain = [ '1.1.1.1' ];
          	// where every name goes. "/#/" = every name: it wins over plain "server=" lines from the router's own
          	// DNS settings, which would otherwise get part of the questions (past the core / FakeDNS / AdGuard)
          	let ups = null;
          	if (hijack)
          		ups = [ '127.0.0.1#' + lib.DNS_PORT ];
          	else if (ad == 'adguard' || ad == 'both')
          		ups = ADGUARD;
          	else if (opt.dns != 'direct' && tp)
          		// "DNS through the server": a public resolver, asked through the server (the line's own DNS
          		// often refuses questions that come from outside its network)
          		ups = plain;
          	if (ups)
          		push(l, 'no-resolv', ...map(ups, (x) => 'server=/#/' + x));
          	// ad block exceptions: a closer name than the blocked one goes to a resolver without ad blocking
          	if (ad == 'local' || ad == 'both')
          		for (let w in split(opt.adblock_allow ?? '', /[ ,]+/))
          			if (match(w, /^[A-Za-z0-9.-]+\.[A-Za-z]+$/))
          				push(l, 'server=/' + w + '/' + (hijack ? '127.0.0.1#' + lib.DNS_PORT : (ups ? plain[0] : '#')));
          	if (opt.dns_cache == '1') {
          		let size = +opt.dns_cache_size || 10000;
          		push(l, 'cache-size=' + ((size < 150) ? 150 : (size > 50000 ? 50000 : size)));
          		let ttl = +opt.dns_min_ttl;
          		// FakeDNS answers live only as long as the core runs: they must not be kept longer
          		if (ttl > 0 && opt.special != 'fakedns')
          			push(l, 'min-cache-ttl=' + (ttl > 3600 ? 3600 : ttl));
          		// answer from the cache at once, refresh in the background (dnsmasq 2.87 and newer)
          		let v = match(sh('dnsmasq --version 2>/dev/null'), /version ([0-9]+)\.([0-9]+)/);
          		if (opt.dns_stale != '0' && v && (+v[1] > 2 || (+v[1] == 2 && +v[2] >= 87)))
          			push(l, 'use-stale-cache');
          	}
          	if ((ad == 'local' || ad == 'both') && fs.stat('/tmp/xlite/adblock.conf'))
          		push(l, 'conf-file=/tmp/xlite/adblock.conf');
          	return length(l) ? join('\n', l) + '\n' : '';
          }

          function build(outdir) {
          	let c = uci();
          	let opt = c.get_all('xlite', 'main') ?? {};
          	// anti-pollution off works as v2rayA's "closed": dnsmasq keeps the router's own DNS (the line's or the
          	// modem's) and nothing is asked through the tunnel. Asking 1.1.1.1 through the tunnel broke part of the
          	// apps on many lines; the DNS-through-the-server ways are the "forward" and "doh" modes
          	if ((opt.antipollution ?? 'none') == 'none')
          		opt.dns = 'direct';
          	let all = servers(c);
          	let cur = filter(all, (s) => s.id == opt.server)[0] ?? all[0];
          	if (!cur) {
          		warn('xlite: no server: add one first\n');
          		return 1;
          	}
          	if (cur.parsed.error) {
          		warn('xlite: the selected server link is not valid: ' + cur.parsed.error + '\n');
          		return 1;
          	}
          	let srv = pick(all, cur.id);
          	if (srv.error) {
          		warn('xlite: cannot resolve the server address\n');
          		return 1;
          	}

          	let ctx = {
          		port: +(opt.tproxy_port || 52345),
          		ipv6: ipv6_on(opt),
          		wan: ifdevs(length(zone_networks(c, 'wan')) ? zone_networks(c, 'wan') : [ 'wan', 'wan6' ]),
          		lan: ifdevs(length(zone_networks(c, 'lan')) ? zone_networks(c, 'lan') : [ 'lan' ]),
          		local4: local_ips(4),
          		local6: local_ips(6),
          		bypass4: [], bypass6: [],
          		main: srv,
          		geo: !!fs.stat('/usr/share/xray/geosite.dat')
          	};
          	// the servers in use go direct (the core's own connection is marked anyway). Only these: an unused
          	// server on a CDN address would take every site on that address out of the VPN, and the ping adds
          	// its own target when it runs
          	add_ip(ctx.bypass4, ctx.bypass6, srv.ip);
          	for (let a in words(opt.bypass))
          		if (lib.ip4_ok(a, true)) push(ctx.bypass4, a);
          		else if (lib.ip6_ok(a, true)) push(ctx.bypass6, a);

          	let data = load_apps();
          	let warnings = [];

          	// isolation: the chosen apps go direct (domains in the core, addresses in nft)
          	ctx.iso = []; ctx.iso_domains = [];
          	for (let a in data.apps) {
          		let sec = c.get_all('xlite', a.id);
          		if (!sec || sec.isolate != '1')
          			continue;
          		let ip4 = [ ...(a.ip4 ?? []) ], ip6 = [ ...(a.ip6 ?? []) ];
          		for (let l in words(sec.learned))
          			add_ip(ip4, ip6, l);
          		push(ctx.iso, { id: a.id, ip4, ip6 });
          		for (let d in a.domains) push(ctx.iso_domains, d);
          	}

          	// second server
          	let sec2 = null;
          	if (opt.r2 == '1' && opt.server2 && opt.server2 != cur.id) {
          		sec2 = pick(all, opt.server2);
          		if (!sec2)
          			push(warnings, 'second-invalid');
          		else if (sec2.error) {
          			push(warnings, 'second-resolve');
          			sec2 = null;
          		}
          	}
          	let kernel = false;
          	if (sec2) {
          		ctx.second = sec2;
          		add_ip(ctx.bypass4, ctx.bypass6, sec2.ip);
          		kernel = sec2.protocol == 'wireguard' && opt.r2_kernel != '0' && !sec2.reserved && wg_kernel_ok();
          		ctx.second_kernel = kernel;
          		ctx.r2_domains = [];
          		ctx.r2_ip = [];
          		if (opt.r2_iq != '0') {
          			for (let d in data.iraq_domains) push(ctx.r2_domains, d);
          			let iq4 = readlist(SHARE + '/data/iq4.txt'), iq6 = ctx.ipv6 ? readlist(SHARE + '/data/iq6.txt') : [];
          			if (kernel) {
          				// fast path: Iraqi addresses go to the WireGuard interface in the kernel, the core never sees them
          				ctx.r2fast4 = iq4; ctx.r2fast6 = iq6;
          			}
          			else
          				ctx.r2_ip = [ ...iq4, ...iq6 ];
          		}
          		// Iraqi apps (Route page): their learned / typed domains and addresses go through the second server
          		c.foreach('xlite', 'r2app', (a) => {
          			if (a.on != '1')
          				return;
          			for (let d in words(a.domain)) { let r = domrule(d); if (r) push(ctx.r2_domains, r); }
          			for (let ip in words(a.ip)) {
          				if (kernel && match(ip, /^[0-9.]+(\/[0-9]+)?$/)) { ctx.r2fast4 ??= []; push(ctx.r2fast4, ip); }
          				else push(ctx.r2_ip, ip);
          			}
          		});
          		for (let d in words(opt.r2_domains)) {
          			let r = domrule(d);
          			if (r) push(ctx.r2_domains, r);
          			else if (lib.ip4_ok(d, true) || lib.ip6_ok(d, true))
          				push(ctx.r2_ip, d);
          		}
          		if (opt.speedtest_main != '0') {
          			let sp = filter(data.apps, (a) => a.id == 'speed')[0];
          			ctx.main_domains = sp ? sp.domains : [];
          			ctx.main_ports = lib.ports_ok(opt.r2_speed_ports) ? opt.r2_speed_ports : '8080,5060';
          		}
          	}
          	let netchg = wg_apply(kernel ? sec2 : null);
          	let bnd = bond_apply(opt);
          	ctx.bond = bnd.devs; ctx.bond_lines = bnd.lines; ctx.bond_weights = bnd.weights; ctx.bond_ips = bnd.ips; ctx.bond_ifs = bnd.ifs;
          	// a line's own server address (another Cloudflare edge) never goes into the tunnel itself
          	for (let a in bnd.ips ?? []) if (a) add_ip(ctx.bypass4, ctx.bypass6, a);
          	ctx.bbr = index(fs.readfile('/proc/sys/net/ipv4/tcp_available_congestion_control') ?? '', 'bbr') >= 0;
          	// per device route: "warp" = everything through the second server, "direct" = no VPN at all
          	ctx.dev_direct = []; ctx.dev_warp = []; ctx.warp_src = [];
          	let leases = {};
          	for (let l in lines(fs.readfile('/tmp/dhcp.leases') ?? '')) { let f = split(l, /\s+/); if (length(f) >= 3) leases[lc(f[1])] = f[2]; }
          	for (let l in lines(fs.readfile('/proc/net/arp') ?? '')) { let f = split(l, /\s+/); if (length(f) >= 4 && match(f[0], /^[0-9.]+$/)) leases[lc(f[3])] ??= f[0]; }
          	c.foreach('xlite', 'device', (d) => {
          		let mac = lc(d.id ?? '');
          		if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          			return;
          		if (d.route == 'direct') push(ctx.dev_direct, mac);
          		else if (d.route == 'warp' && sec2) {
          			push(ctx.dev_warp, mac);
          			if (leases[mac]) push(ctx.warp_src, leases[mac]);
          		}
          	});
          	ctx.dev_warp_kernel = kernel;
          	ctx.blocked = filter(map(words(opt.blocked_mac), (m) => lc(m)), (m) => match(m, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/));

          	// the lists a routing mode needs (transparent proxy and the rule ports)
          	let tm = opt.transparent ?? 'all', rm = opt.rule_mode ?? 'gfwlist';
          	let rule_ports = (+opt.socks_rule_port > 0 || +opt.http_rule_port > 0);
          	let modes = [ tm == 'same' ? rm : tm ];
          	if (rule_ports) push(modes, rm);
          	if (index(modes, 'gfwlist') >= 0)
          		ctx.gfw = filter(map(readlist('/etc/xlite/gfw.txt'), (d) => domrule(d)), (x) => x);
          	if (index(modes, 'except_cn') >= 0) {
          		ctx.cn4 = filter(readlist('/etc/xlite/cn4.txt'), (x) => match(x, /^[0-9.\/]+$/));
          		// the nft set (fast path) only for the transparent proxy
          		ctx.cn4_nft = (modes[0] == 'except_cn');
          	}
          	fs.mkdir(outdir);
          	let cfg = lib.xray_config(opt, ctx);
          	fs.writefile(outdir + '/config.json', sprintf('%.2J\n', cfg));
          	fs.writefile(outdir + '/rules.nft', (opt.transparent == 'off') ? '' : lib.nft_rules(opt, ctx));
          	fs.writefile(outdir + '/redirect.nft', (opt.transparent != 'off' && opt.impl == 'redirect') ? lib.nft_redirect(opt, ctx) : '');
          	// the monitor takes the WireGuard fast path out while the tunnel is down, and puts it back
          	let fast = '';
          	if (length(ctx.r2fast4 ?? []))
          		fast += 'add element inet xlite r2fast4 { ' + join(', ', ctx.r2fast4) + ' }\n';
          	if (length(ctx.r2fast6 ?? []))
          		fast += 'add element inet xlite r2fast6 { ' + join(', ', ctx.r2fast6) + ' }\n';
          	fs.writefile(outdir + '/r2fast.nft', fast);
          	let env = sprintf("GOMAXPROCS=%s\nGOGC=%s\n", (+opt.gomaxprocs > 0) ? opt.gomaxprocs : '', (+opt.gogc > 0) ? opt.gogc : '');
          	if (opt.splice == '0')
          		env += 'XRAY_VLESS_SPLICE=off\n';
          	fs.writefile(outdir + '/env', env);
          	let dnsm = opt.antipollution ?? 'none';
          	fs.writefile(outdir + '/dnsmasq.conf', dnsmasq_conf(opt));
          	fs.writefile(outdir + '/state.json', sprintf('%J\n', {
          		server: cur.id, name: cur.name, ip: srv.ip, port: +srv.port, protocol: srv.protocol, ipv6: ctx.ipv6, wan: ctx.wan, lan: ctx.lan,
          		second: sec2 ? { id: sec2.sid, name: sec2.sname, ip: sec2.ip, protocol: sec2.protocol, kernel } : null,
          		dns_hijack: (dnsm != 'none' || opt.special == 'fakedns') && opt.transparent != 'off',
          		netchg, warnings, iso: map(ctx.iso, (a) => a.id), bond: ctx.bond_lines, bond_used: length(ctx.bond ?? []) ? ctx.bond_ifs : []
          	}));
          	return 0;
          }

          function add() {
          	let c = uci(), report = [], text = fs.stdin.read('all') ?? '';
          	let first = null;
          	// a pasted WireGuard .conf is one server, not one per line
          	let items = (index(text, '[Interface]') >= 0) ? [ text ] : lines(text);
          	for (let l in items) {
          		let p = lib.parse_link(l);
          		if (p.error) {
          			push(report, { ok: false, error: p.error, link: substr(trim(l), 0, 24) });
          			continue;
          		}
          		let dup = null, key = replace(p.link, /#.*$/, '');
          		c.foreach('xlite', 'server', (s) => { if (replace(s.link ?? '', /#.*$/, '') == key) dup = s['.name']; });
          		if (dup) {
          			push(report, { ok: true, id: dup, name: p.name, dup: true });
          			continue;
          		}
          		let id = c.add('xlite', 'server');
          		c.set('xlite', id, 'name', p.name);
          		c.set('xlite', id, 'link', p.link);
          		first ??= id;
          		push(report, { ok: true, id, name: p.name });
          	}
          	if (first && !c.get('xlite', 'main', 'server'))
          		c.set('xlite', 'main', 'server', first);
          	c.save('xlite');
          	c.commit('xlite');
          	print(sprintf('%J\n', report));
          	return 0;
          }

          // subscription body on stdin -> replaces the servers of subscription <id>
          function sub_apply(sid) {
          	let c = uci();
          	if (c.get('xlite', sid) != 'subscription') {
          		warn('no such subscription\n');
          		return 1;
          	}
          	let list = lib.parse_subscription(fs.stdin.read('all') ?? '');
          	if (!length(list)) {
          		print(sprintf('%J\n', { ok: false, error: 'empty' }));
          		return 1;
          	}
          	let old = {};
          	c.foreach('xlite', 'server', (s) => { if (s.sub == sid) old[replace(s.link ?? '', /#.*$/, '')] = s['.name']; });
          	let keep = {}, added = 0;
          	for (let p in list) {
          		let key = replace(p.link, /#.*$/, '');
          		if (old[key]) {
          			keep[old[key]] = true;
          			c.set('xlite', old[key], 'name', p.name);
          			continue;
          		}
          		let id = c.add('xlite', 'server');
          		c.set('xlite', id, 'name', p.name);
          		c.set('xlite', id, 'link', p.link);
          		c.set('xlite', id, 'sub', sid);
          		keep[id] = true;
          		added++;
          	}
          	let removed = 0, sel = c.get('xlite', 'main', 'server'), sel2 = c.get('xlite', 'main', 'server2');
          	for (let k, id in old)
          		if (!keep[id] && id != sel && id != sel2) { c.delete('xlite', id); removed++; }
          	c.set('xlite', sid, 'updated', '' + time());
          	c.set('xlite', sid, 'count', '' + length(list));
          	c.save('xlite');
          	c.commit('xlite');
          	print(sprintf('%J\n', { ok: true, total: length(list), added, removed }));
          	return 0;
          }

          let cmd = ARGV[0];
          let rc = 2;
          if (cmd == 'build')
          	rc = build(ARGV[1] ?? '/var/etc/xlite');
          else if (cmd == 'add')
          	rc = add();
          else if (cmd == 'sub_apply')
          	rc = sub_apply(ARGV[1] ?? '');
          else if (cmd == 'server') {
          	// address and port of one server (for the ping)
          	let c = uci(), l = c.get('xlite', ARGV[1] ?? '', 'link'), p = l ? lib.parse_link(l) : { error: 'no' };
          	if (!p.error) {
          		print(p.address, ' ', p.port, ' ', p.protocol, '\n');
          		rc = 0;
          	}
          	else
          		rc = 1;
          }
          else if (cmd == 'resolve') {
          	print(join('\n', resolve(ARGV[1] ?? '')), '\n');
          	rc = 0;
          }
          else
          	warn('usage: gen.uc build <dir> | add | resolve <host>\n');
          exit(rc);
          XLITE_FILE_12
          mkdir -p "$(dirname "src/usr/share/xlite/monitor.uc")"
          cat > "src/usr/share/xlite/monitor.uc" <<'XLITE_FILE_13'
          // XLite monitor (runs next to the core while XLite is on):
          //   - traffic of every device (today / this month / last 31 days), from the nft dev_up/dev_down sets
          //   - bytes of the isolated apps (nft counters)
          //   - health of the kernel WireGuard second server: its fast path is taken out while it is down
          //   - learning mode: the addresses a device talks to (from conntrack), grouped by /24
          //   - automatic subscription update
          // Output for LuCI: /tmp/xlite/mon.json (every cycle), totals kept in /etc/xlite/usage.json.
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';

          const RUN = getenv('XLITE_RUN') ?? '/var/etc/xlite';
          const TMP = getenv('XLITE_TMP') ?? '/tmp/xlite';
          const KEEP = getenv('XLITE_PERSIST') ?? '/etc/xlite';
          const ONCE = !!getenv('XLITE_ONCE');
          const STEP = 5;              // seconds between cycles
          const SAVE_EVERY = 1800;     // write the totals to flash every 30 minutes

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function writejson(path, v) {
          	fs.writefile(path + '.new', sprintf('%J', v));
          	fs.rename(path + '.new', path);
          }

          function pad(n) { return (n < 10 ? '0' : '') + n; }
          function today() { let t = localtime(); return `${t.year}-${pad(t.mon)}-${pad(t.mday)}`; }
          // the month of the line's package: it starts on the billing day (Settings > Devices)
          let billing_day = 1;
          function month() {
          	let t = localtime();
          	let y = t.year, m = t.mon;
          	if (t.mday < billing_day) { m--; if (m < 1) { m = 12; y--; } }
          	return `${y}-${pad(m)}`;
          }

          function opt() {
          	let c = getenv('XLITE_UCI_DIR') ? cursor(getenv('XLITE_UCI_DIR')) : cursor();
          	c.load('xlite');
          	return { main: c.get_all('xlite', 'main') ?? {}, c };
          }

          // --- nft counters -------------------------------------------------------------------------
          function set_counters(name) {
          	let r = {};
          	let j = null;
          	try { j = json(sh(`nft -j list set inet xlite ${name} 2>/dev/null`) || 'null'); } catch (e) {}
          	for (let o in j?.nftables ?? []) {
          		for (let e in o.set?.elem ?? []) {
          			let el = e.elem ?? e;
          			let ip = el.val ?? el;
          			if (type(ip) == 'string')
          				r[ip] = +(el.counter?.bytes ?? 0);
          		}
          	}
          	return r;
          }

          function chain_counters(chain) {
          	let r = {};
          	let j = null;
          	try { j = json(sh(`nft -j list chain inet xlite ${chain} 2>/dev/null`) || 'null'); } catch (e) {}
          	for (let o in j?.nftables ?? []) {
          		let rule = o.rule;
          		if (!rule?.comment)
          			continue;
          		for (let x in rule.expr ?? [])
          			if (x.counter)
          				r[rule.comment] = (r[rule.comment] ?? 0) + +(x.counter.bytes ?? 0);
          	}
          	return r;
          }

          // --- names of the devices -----------------------------------------------------------------
          function neighbours() {
          	let mac = {}, name = {};
          	for (let l in split(fs.readfile('/proc/net/arp') ?? '', '\n')) {
          		let f = split(trim(l), /\s+/);
          		if (length(f) >= 4 && match(f[0], /^[0-9.]+$/) && f[3] != '00:00:00:00:00:00')
          			mac[f[0]] = lc(f[3]);
          	}
          	for (let l in split(fs.readfile(getenv('XLITE_LEASES') ?? '/tmp/dhcp.leases') ?? '', '\n')) {
          		let f = split(trim(l), /\s+/);
          		if (length(f) >= 4) {
          			mac[f[2]] ??= lc(f[1]);
          			if (f[3] != '*') {
          				name[lc(f[1])] = f[3];
          				name[f[2]] = f[3];
          			}
          		}
          	}
          	return { mac, name };
          }

          // --- device usage -------------------------------------------------------------------------
          let usage = readjson(TMP + '/usage.json');
          let saved = readjson(KEEP + '/usage.json');
          if (!usage || (saved && (saved.t ?? 0) > (usage.t ?? 0)))
          	usage = saved;
          usage ??= { v: 1, t: 0, devs: {} };
          let last = { up: {}, down: {}, apps: {} };
          let rates = {};
          let last_t = 0;
          let last_save = time();

          function trim_days(d) {
          	let ks = sort(keys(d.days ?? {}));
          	while (length(ks) > 31)
          		delete d.days[shift(ks)];
          	let mk = sort(keys(d.months ?? {}));
          	while (length(mk) > 12)
          		delete d.months[shift(mk)];
          }

          // events for the Telegram bot (it sends and removes them)
          function event(e) {
          	let f = fs.open(TMP + '/events.jsonl', 'a');
          	if (f) { f.write(sprintf('%J\n', e)); f.close(); }
          }

          function delta(prev, cur) {
          	// a reloaded table starts its counters at zero again
          	return (prev == null || cur < prev) ? cur : cur - prev;
          }

          function count_devices(now) {
          	let up = set_counters('dev_up'), down = set_counters('dev_down');
          	let nb = neighbours();
          	let dt = last_t ? now - last_t : 0;
          	let day = today(), mon = month();
          	let ips = {};
          	for (let ip, b in up) ips[ip] = true;
          	for (let ip, b in down) ips[ip] = true;
          	rates = {};
          	for (let ip in keys(ips)) {
          		let du = (up[ip] != null) ? delta(last.up[ip], up[ip]) : 0;
          		let dd = (down[ip] != null) ? delta(last.down[ip], down[ip]) : 0;
          		if (!last_t) { du = 0; dd = 0; }   // first look: only the starting point
          		let key = nb.mac[ip] ?? ip;
          		if (!usage.devs[key] && usage.t && nb.mac[ip])
          			event({ type: 'new_device', mac: key, ip, name: nb.name[key] ?? nb.name[ip] });
          		let d = usage.devs[key] ??= { days: {}, months: {} };
          		d.ip = ip;
          		if (nb.name[key] ?? nb.name[ip])
          			d.name = nb.name[key] ?? nb.name[ip];
          		d.seen = now;
          		let a = d.days[day] ??= [ 0, 0 ];
          		a[0] += du; a[1] += dd;
          		let m = d.months[mon] ??= [ 0, 0 ];
          		m[0] += du; m[1] += dd;
          		// whole network by hour, today only (the home page chart)
          		let hr = localtime().hour;
          		if (usage.hday != day) { usage.hday = day; usage.hours = []; for (let k = 0; k < 24; k++) push(usage.hours, 0); }
          		usage.hours[hr] += du + dd;
          		if (dt > 0)
          			rates[key] = [ int(du / dt), int(dd / dt) ];
          		trim_days(d);
          	}
          	last.up = up; last.down = down;
          	usage.t = now;
          }

          // --- isolated apps ------------------------------------------------------------------------
          let apps = {};
          function count_apps(now) {
          	let up = chain_counters('iso'), down = chain_counters('iso_down');
          	let ids = {};
          	for (let k, v in up) ids[k] = true;
          	for (let k, v in down) ids[k] = true;
          	let day = today();
          	usage.apps ??= {};
          	for (let id in keys(ids)) {
          		let tot = (up[id] ?? 0) + (down[id] ?? 0);
          		let d = last_t ? delta(last.apps[id], tot) : 0;
          		let a = usage.apps[id] ??= { days: {} };
          		a.days[day] = (a.days[day] ?? 0) + d;
          		let dk = sort(keys(a.days));
          		while (length(dk) > 31)
          			delete a.days[shift(dk)];
          		apps[id] = { rate: (last_t && now > last_t) ? int(d / (now - last_t)) : 0 };
          		last.apps[id] = tot;
          	}
          }

          // --- kernel WireGuard health --------------------------------------------------------------
          let wg = null, fast_on = true;
          function wg_check(now, state, o) {
          	if (!state?.second?.kernel) {
          		wg = null;
          		return;
          	}
          	let hs = 0, rx = 0, tx = 0;
          	for (let l in split(sh('wg show xlwg latest-handshakes 2>/dev/null'), '\n')) {
          		let f = split(trim(l), /\s+/);
          		if (length(f) == 2) hs = +f[1];
          	}
          	for (let l in split(sh('wg show xlwg transfer 2>/dev/null'), '\n')) {
          		let f = split(trim(l), /\s+/);
          		if (length(f) == 3) { rx = +f[1]; tx = +f[2]; }
          	}
          	// WireGuard renews the handshake every 2 minutes while traffic flows; keepalive is 25 s
          	let ok = hs > 0 && (now - hs) < 180;
          	wg = { handshake: hs, ok, rx, tx };
          	if ((o.r2_fallback ?? 'main') == 'none')
          		return;
          	if (!ok && fast_on) {
          		sh('nft flush set inet xlite r2fast4 2>/dev/null; nft flush set inet xlite r2fast6 2>/dev/null');
          		fast_on = false;
          		sh("logger -t xlite 'WireGuard (second server) is down: Iraqi traffic goes through the fallback'");
          	}
          	else if (ok && !fast_on) {
          		sh(`nft -f ${RUN}/r2fast.nft 2>/dev/null`);
          		fast_on = true;
          		sh("logger -t xlite 'WireGuard (second server) is back'");
          	}
          }

          // --- learning mode ------------------------------------------------------------------------
          // Only the chosen device is watched, and an address must look like the app's to be offered:
          //   - big shared services (Google, Apple, Cloudflare, Microsoft, Amazon, Akamai, Meta for non-Meta apps)
          //     are never taken: a notification or another app on the phone lands there
          //   - game traffic is UDP on its own ports: that is a strong sign; TCP 443 alone is weak
          //   - an address must come back in several minutes, a one-off connection (a notification) is not enough
          // Progress (pct) = time with traffic from the device + how few new addresses still appear.
          const PRIV = [ /^198\.1[89]\./, /^10\./, /^127\./, /^192\.168\./, /^172\.(1[6-9]|2[0-9]|3[01])\./, /^169\.254\./, /^22[4-9]\./, /^2[3-5][0-9]\./, /^0\./, /^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\./ ];
          // first octets / prefixes of big shared networks (kept short: just enough to drop the usual noise)
          const SHARED = [
          	/^(142\.25[0-1]|172\.217|172\.253|216\.58|216\.239|74\.125|64\.233|108\.177|173\.194|209\.85|34|35)\./,   // Google
          	/^17\./,                                                                                                  // Apple
          	/^(104\.1[6-9]|104\.2[0-9]|104\.3[01]|172\.6[4-9]|172\.7[01]|162\.15[89]|188\.114|141\.101|190\.93|197\.234|198\.41)\./, // Cloudflare
          	/^(13\.(6[4-9]|[7-9][0-9]|10[0-7])|20|40|52\.(9[6-9]|1[01][0-9])|204\.79|131\.253)\./,               // Microsoft
          	/^(3|18|52\.[0-8][0-9]|54|99\.8[4-7]|13\.(3[2-5]|2[2-9]))\./,                                          // Amazon
          	/^(23\.(3[2-9]|[4-6][0-9])|2\.(1[6-9]|2[0-3])|95\.10[01]|184\.(2[4-9]|3[01])|184\.5[0-1])\./                 // Akamai
          ];
          const META = /^(157\.240|31\.13|179\.60|185\.60\.21[6-9]|129\.134|66\.220|69\.63|69\.171|102\.132|163\.70)\./;
          const STD_PORTS = { '53': 1, '123': 1, '443': 1, '80': 1, '853': 1, '3478': 1, '5228': 1 };

          // learning over: the core goes back to its quiet log
          function learn_log_off() {
          	let c = getenv('XLITE_UCI_DIR') ? cursor(getenv('XLITE_UCI_DIR')) : cursor();
          	c.load('xlite');
          	if (c.get('xlite', 'main', 'learn_log') == '1') {
          		c.set('xlite', 'main', 'learn_log', '0');
          		c.save('xlite'); c.commit('xlite');
          		if (!ONCE) sh('( /etc/init.d/xlite reload > /dev/null 2>&1 & )');
          	}
          	fs.unlink(TMP + '/core.log');
          }

          // half for time with traffic (of the chosen duration), half for "no new addresses lately"
          function learn_pct(l, now, done) {
          	let dur = (+l.until - +l.start) / 60.0 || 10.0;
          	let act = length(keys(l.mins ?? {}));
          	let tpart = (act / dur > 1) ? 1.0 : act / dur;
          	let total = 0, recent = 0;
          	for (let k, e in l.nets ?? {}) {
          		total++;
          		if ((now - l.start) - e.first < 120) recent++;
          	}
          	for (let k, e in l.names ?? {}) {
          		total++;
          		if (length(e.mins) && +e.mins[0] >= int((now - l.start) / 60) - 1) recent++;
          	}
          	let stable = total ? 1.0 - recent * 1.0 / total : 0.0;
          	if (now - l.start < 120) stable = 0;
          	let p = int(100 * (0.5 * tpart + 0.5 * stable));
          	if (done && total && stable > 0.9 && tpart > 0.6) p = 100;
          	return p > 100 ? 100 : p;
          }

          // names the device connected to (core log, sniffed domain), for the Iraqi apps of the second server
          const SHARED_NAMES = /(^|\.)(google|googleapis|gstatic|googleusercontent|googlevideo|ggpht|gvt[0-9]|doubleclick|googlesyndication|google-analytics|app-measurement|crashlytics|firebaseio|firebaseinstallations|firebase|apple|icloud|mzstatic|aaplimg|cdn-apple|facebook|fbcdn|instagram|whatsapp|microsoft|msftconnecttest|windows|live|bing|cloudflare|amazonaws|akamaized|akamaihd|xiaomi|miui|samsung|huawei|hicloud|tiktokv|tiktokcdn|byteoversea|snapchat|telegram|ntp|pool\.ntp)\.[a-z.]+$/;
          let core_off = 0, core_sess = {};
          function learn_names(l) {
          	let f = fs.open(TMP + '/core.log', 'r');
          	if (!f)
          		return;
          	let st = fs.stat(TMP + '/core.log');
          	if (st && st.size < core_off) core_off = 0;
          	f.seek(core_off);
          	let line;
          	l.names ??= {};
          	let minute = '' + int((time() - l.start) / 60);
          	while ((line = f.read('line')) != null && line != '') {
          		let m = match(line, /\[([0-9]+)\] proxy\/dokodemo: received request for ([0-9.]+):/);
          		if (m) { core_sess[m[1]] = m[2]; continue; }
          		m = match(line, /\[([0-9]+)\] app\/dispatcher: sniffed domain: ([A-Za-z0-9._-]+)/);
          		if (m && core_sess[m[1]] == l.ip) {
          			let d = lc(m[2]);
          			if (match(d, /^[0-9.]+$/) || match(d, SHARED_NAMES) || match(d, /\.iq$/))
          				continue;
          			let e = l.names[d] ??= { n: 0, mins: [] };
          			e.n++;
          			if (index(e.mins, minute) < 0 && length(e.mins) < 60) push(e.mins, minute);
          			e.strong = e.n >= 2 || length(e.mins) >= 2;
          			delete core_sess[m[1]];
          		}
          	}
          	core_off = f.tell();
          	f.close();
          	// keep the log small (RAM)
          	if (core_off > 2000000) { fs.writefile(TMP + '/core.log', ''); core_off = 0; }
          }

          let learn_seen = {};
          function learn(now) {
          	let l = readjson(TMP + '/learn.json');
          	if (!l || !l.ip)
          		return;
          	if (now > +l.until) {
          		if (!l.done) {
          			l.done = true;
          			l.pct = learn_pct(l, now, true);
          			writejson(TMP + '/learn.json', l);
          			learn_log_off();
          		}
          		return;
          	}
          	if (l.kind == 'r2')
          		learn_names(l);
          	if (l.start != learn_seen.start)
          		learn_seen = { start: l.start, flows: {} };
          	l.nets ??= {};
          	l.mins ??= {};
          	let meta_ok = (l.app == 'face' || l.app == 'insta');
          	let ct = fs.open(getenv('XLITE_CT') ?? '/proc/net/nf_conntrack', 'r');
          	if (!ct)
          		return;
          	let want = 'src=' + l.ip + ' ';
          	let minute = '' + int((now - l.start) / 60);
          	let line, active = false;
          	while ((line = ct.read('line')) != null && line != '') {
          		if (index(line, want) < 0)
          			continue;
          		let m = match(line, /^ipv4 +[0-9]+ +(tcp|udp) +[0-9]+ +[0-9]+ +([A-Z_]+ +)?src=([0-9.]+) dst=([0-9.]+) sport=([0-9]+) dport=([0-9]+)/);
          		if (!m || m[3] != l.ip)
          			continue;
          		let proto = m[1], dst = m[4], dport = m[6], skip = false;
          		// game traffic (UDP on its own ports) is kept even on big clouds: game servers live there
          		let gameflow = (proto == 'udp' && !STD_PORTS[dport]);
          		for (let p in PRIV) if (match(dst, p)) { skip = true; break; }
          		if (!skip && !gameflow) for (let p in SHARED) if (match(dst, p)) { skip = true; break; }
          		if (!skip && !gameflow && !meta_ok && match(dst, META)) skip = true;
          		if (skip)
          			continue;
          		active = true;
          		let key = proto + dst + ':' + dport + ':' + m[5];
          		let net = replace(dst, /\.[0-9]+$/, '.0/24');
          		let e = l.nets[net] ??= { n: 0, ports: [], proto: [], mins: [], first: now - l.start };
          		if (!learn_seen.flows[key]) {
          			learn_seen.flows[key] = true;
          			e.n++;
          		}
          		if (index(e.ports, dport) < 0 && length(e.ports) < 6) push(e.ports, dport);
          		if (index(e.proto, proto) < 0) push(e.proto, proto);
          		if (index(e.mins, minute) < 0 && length(e.mins) < 60) push(e.mins, minute);
          		e.game = e.game || (proto == 'udp' && !STD_PORTS[dport]);
          		// strong: the app's own kind of traffic, seen again and again
          		e.strong = (e.game && e.n >= 2) || length(e.mins) >= 3;
          	}
          	ct.close();
          	if (active)
          		l.mins[minute] = true;
          	l.pct = learn_pct(l, now, false);
          	writejson(TMP + '/learn.json', l);
          }

          // --- subscriptions ------------------------------------------------------------------------
          let booted = time();
          let sub_boot_done = false;
          let sub_try = 0, lists_try = 0;
          function subs(now, o, c) {
          	if (o.sub_auto != '1')
          		return;
          	let mode = o.sub_auto_mode ?? 'interval';
          	if (mode == 'boot') {
          		if (!sub_boot_done && now - booted > 60) {
          			sub_boot_done = true;
          			sh('( /usr/bin/xlite sub all > /dev/null 2>&1 & )');
          		}
          		return;
          	}
          	let hours = +(o.sub_interval ?? 12) || 12;
          	let due = false;
          	c.foreach('xlite', 'subscription', (s) => { if (now - +(s.updated ?? 0) > hours * 3600) due = true; });
          	// a failed download keeps "due": try again after an hour, not at every 5-minute check
          	if (due && now - booted > 60 && now - sub_try > 3600) {
          		sub_try = now;
          		sh('( /usr/bin/xlite sub all > /dev/null 2>&1 & )');
          	}
          }

          // --- watchdog and health -----------------------------------------------------------------
          // the core listens but the traffic is not sent to it (seen after a boot): apply the rules again;
          // the main server does not answer for 3 minutes while the line works: restart the core
          let health = { main: null, second: null }, fails = 0, last_restart = 0, last_health = 0, last_dog = 0;

          function listening(port) {
          	let hex = sprintf('%04X', +port);
          	for (let f in [ '/proc/net/tcp', '/proc/net/tcp6' ])
          		for (let l in split(fs.readfile(f) ?? '', '\n')) {
          			// "sl local_address rem_address st": the local port, in state 0A (LISTEN)
          			let m = match(l, /^ *[0-9]+: [0-9A-F]+:([0-9A-F]{4}) [0-9A-F]+:[0-9A-F]{4} 0A /);
          			if (m && m[1] == hex)
          				return true;
          		}
          	return false;
          }

          // the address of the check site, learned while the main server works (DNS itself may need the server)
          let probe_ip = null;
          function probe_addr() {
          	let seen = false;
          	for (let l in split(sh('nslookup cp.cloudflare.com 127.0.0.1 2>/dev/null'), '\n')) {
          		if (match(l, /^Name:/))
          			seen = true;
          		else if (seen) {
          			let m = match(l, /([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          			if (m && !match(m[1], /^(198\.1[89]|127)\./))
          				return m[1];
          		}
          	}
          	return null;
          }

          function probe(args) {
          	let t = time();
          	let out = trim(sh(`curl -s -o /dev/null -m 6 -w '%{http_code} %{time_total}' ${args} http://cp.cloudflare.com/generate_204 2>/dev/null`));
          	let m = match(out, /^(204|200) ([0-9.]+)/);
          	return { ok: !!m, ms: m ? int(+m[2] * 1000) : null, t };
          }

          // DNS failsafe: dnsmasq asks the core's DNS port; when the core is down every device loses DNS
          // (no internet at all), so the normal DNS comes back until the core listens again
          let dns_dead = 0, dns_failsafe = false;
          function dns_guard(now, m, state) {
          	if (m.enabled != '1' || !state?.dns_hijack) {
          		dns_failsafe = false;
          		return;
          	}
          	if (listening(15353)) {
          		dns_dead = 0;
          		if (dns_failsafe) {
          			dns_failsafe = false;
          			sh("logger -t xlite 'the core DNS answers again: DNS back through XLite'");
          			sh('/usr/bin/xlite dns_on > /dev/null 2>&1');
          		}
          		return;
          	}
          	if (dns_failsafe || !dns_dead) {
          		dns_dead ||= now;
          		return;
          	}
          	if (now - dns_dead >= 20) {
          		dns_failsafe = true;
          		sh("logger -t xlite 'the core DNS port does not answer: normal DNS until it is back'");
          		sh('/usr/bin/xlite dns_off > /dev/null 2>&1');
          		event({ type: 'down', which: 'dns', name: 'DNS' });
          	}
          }

          function watchdog(now, o, state) {
          	let m = o.main;
          	dns_guard(now, m, state);
          	if (m.enabled != '1' || m.transparent == 'off')
          		return;
          	let port = +(m.tproxy_port || 52345);
          	if (now - last_dog >= 30) {
          		last_dog = now;
          		if (listening(port) && system('nft list table inet xlite > /dev/null 2>&1') != 0) {
          			sh("logger -t xlite 'the core runs but the rules were missing: applying them'");
          			sh('/usr/bin/xlite rules_up > /dev/null 2>&1');
          		}
          	}
          	if (now - last_health < 60)
          		return;
          	last_health = now;
          	let socks = +(m.socks_port ?? 0);
          	let was = { main: health.main?.ok, second: health.second?.ok };
          	if (socks > 0)
          		health.main = probe(`--socks5-hostname 127.0.0.1:${socks}`);
          	if (state?.second)
          		health.second = state.second.kernel ? probe("--noproxy '*' --interface xlwg") : probe('--socks5-hostname 127.0.0.1:20179');
          	else
          		health.second = null;
          	for (let w in [ 'main', 'second' ])
          		if (health[w] && was[w] != null && was[w] != health[w].ok)
          			event({ type: health[w].ok ? 'up' : 'down', which: w, name: (w == 'main') ? state?.name : state?.second?.name });
          	if (!health.main || health.main.ok) {
          		if (health.main?.ok && !probe_ip)
          			probe_ip = probe_addr();
          		fails = 0;
          		return;
          	}
          	// is it the line or the server? only the server is worth a restart. nft sends the router's own traffic
          	// to the core, so the direct check uses an address put in the bypass set for that moment
          	if (!probe_ip)
          		return;
          	sh(`nft add element inet xlite bypass4 '{ ${probe_ip} }' 2>/dev/null`);
          	let direct = probe(`--noproxy '*' --resolve cp.cloudflare.com:80:${probe_ip}`).ok;
          	sh(`nft delete element inet xlite bypass4 '{ ${probe_ip} }' 2>/dev/null`);
          	if (!direct)
          		return;
          	if (++fails >= 3 && now - last_restart > 600) {
          		fails = 0;
          		last_restart = now;
          		sh("logger -t xlite 'the main server has not answered for 3 minutes: restarting the core'");
          		sh('( /etc/init.d/xlite restart > /dev/null 2>&1 & )');
          	}
          }

          // --- GFWList / China list / ad list: automatic update ---------------------------------------
          let lists_boot = false;
          function lists_auto(now, m) {
          	let mode = m.gfw_auto ?? 'weekly';
          	if (mode == 'off' || now - booted < 120)
          		return;
          	let st = fs.stat('/etc/xlite/gfw.txt');
          	let age = st ? now - st.mtime : 1e9;
          	let due = (mode == 'boot') ? !lists_boot : age > ((mode == 'daily') ? 86400 : 604800);
          	lists_boot = true;
          	// a failed download leaves the list old: try again after an hour (the ad list is downloaded with it)
          	if (!due || now - lists_try < 3600)
          		return;
          	lists_try = now;
          	let tm = m.transparent ?? 'all', rm = m.rule_mode ?? 'gfwlist';
          	let used = (tm == 'gfwlist' || ((tm == 'same' || +m.socks_rule_port > 0 || +m.http_rule_port > 0) && rm == 'gfwlist'));
          	// download, then rebuild only when the list is in use
          	sh('( /usr/bin/xlite lists gfw > /dev/null 2>&1' + (used ? ' && /etc/init.d/xlite reload > /dev/null 2>&1' : '') + ' & )');
          	let ad = m.adblock ?? 'off';
          	if ((ad == 'local' || ad == 'both') && mode != 'boot')
          		sh('( /usr/bin/xlite adblock > /dev/null 2>&1 && /usr/bin/xlite dns_on > /dev/null 2>&1 & )');
          }

          // --- automatic update of XLite (at night, only when a newer version is published) -------------
          let update_day = '';
          function auto_update(m) {
          	if (m.auto_update != '1')
          		return;
          	let t = localtime();
          	let day = today();
          	if (t.hour != 4 || update_day == day)
          		return;
          	update_day = day;
          	let rel = {};
          	for (let l in split(fs.readfile('/usr/share/xlite/release') ?? '', '\n')) {
          		let x = match(l, /^([A-Z]+)=(.*)$/);
          		if (x) rel[x[1]] = x[2];
          	}
          	if (!rel.REPO)
          		return;
          	let v = trim(sh(`curl -fsSL -m 20 https://github.com/${rel.REPO}/releases/download/${rel.TAG ?? 'xlite'}/version 2>/dev/null`));
          	let mine = rel.VERSION + (rel.BUILD ? '.' + rel.BUILD : '');
          	if (match(v, /^[0-9.]+$/) && v != mine && v != rel.VERSION) {
          		sh(`logger -t xlite 'automatic update: ${mine} -> ${v}'`);
          		sh('( /usr/bin/xlite update > /tmp/xlite-update.log 2>&1 & )');
          	}
          }

          // --- main loop ----------------------------------------------------------------------------
          fs.mkdir(TMP);
          fs.mkdir(KEEP);
          let cycle = 0;
          let sub_check = 0;
          // bonded lines: a connection to the server through each line every 30 s (all lines at once); the page shows
          // the delay, and a line that stops answering (or answers again) is told to the Telegram bot
          let bond_t = 0, bond_ok = {};
          function bond_check(now, state, m) {
          	let lines = state?.bond ?? [];
          	if (!length(lines) || !state?.ip || now - bond_t < 30)
          		return;
          	bond_t = now;
          	let port = +(state.port ?? 0) || 443, cmd = '';
          	for (let l in lines)
          		if (match(l.dev ?? '', /^[A-Za-z0-9._-]{1,15}$/) && match(l.iface ?? '', /^[A-Za-z0-9_-]{1,15}$/))
          			// the server reached through the line (delay), and 10 pings of the line itself (loss: ICMP never enters the tunnel)
          			cmd += `( printf '%s %s %s\\n' ${l.iface} "$(curl -s --noproxy '*' --interface ${l.dev} -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' 'http://${match(l.addr ?? '', /^[0-9.]+$/) ? l.addr : state.ip}:${port}/' 2>/dev/null)" "$(ping -I ${l.dev} -c 10 -i 0.2 -W 1 -q 1.1.1.1 2>/dev/null | sed -n 's/.* \\([0-9.]*\\)% packet loss.*/\\1/p')" ) & `;
          	let res = {};
          	for (let ln in split(sh(cmd + 'wait'), '\n')) {
          		let f = split(trim(ln), ' ');
          		if (length(f) < 1 || f[0] == '')
          			continue;
          		let t = +(f[1] ?? 0);
          		res[f[0]] = { ok: t > 0, ms: (t > 0) ? int(t * 1000 + 0.5) : null, loss: (f[2] != null && f[2] != '') ? int(+f[2] + 0.5) : null, t: now };
          	}
          	for (let i, r in res) {
          		if (bond_ok[i] != null && bond_ok[i] != r.ok) {
          			if (m.bond_alert != '0') event({ type: r.ok ? 'line_up' : 'line_down', iface: i });
          			// the page's "last events": newest first, 20 kept
          			let lt = localtime(), evs = readjson(TMP + '/bond_events.json') ?? [];
          			unshift(evs, { iface: i, up: r.ok, at: sprintf('%02d:%02d', lt.hour, lt.min), t: now });
          			writejson(TMP + '/bond_events.json', slice(evs, 0, 20));
          		}
          		bond_ok[i] = r.ok;
          	}
          	writejson(TMP + '/bond.json', res);
          }

          // shares re-measured every night at 4 when nobody uses the line (the lines change: a 4G cell, a busy evening),
          // applied only when they changed; the core restarts for it, which at 4 with no traffic nobody notices
          let cal_day = '', cal_t = 0;
          function bond_autocal(now, state, m) {
          	if (m.bond_autocal == '0' || length(state?.bond_used ?? []) < 2)
          		return;
          	let t = localtime(), day = today();
          	if (cal_t && now - cal_t > 25) {
          		cal_t = 0;
          		let r = null;
          		try { r = json(sh('ubus call xlite bond_calibrate_result 2>/dev/null')); } catch (e) {}
          		if (!r?.lines || !length(r.lines) || length(filter(r.lines, (x) => x.mbps > 0)) < 2)
          			return;
          		let want = join(' ', map(sort(r.lines, (a, b) => a.iface < b.iface ? -1 : 1), (x) => x.iface + ':' + x.weight));
          		let cur = {};
          		for (let w in split(m.bond_weights ?? '', /[ ,]+/)) { let x = match(w, /^(.+):([0-9])$/); if (x) cur[x[1]] = x[2]; }
          		let same = true;
          		for (let x in r.lines) if ((+(cur[x.iface] ?? 1)) != x.weight) same = false;
          		if (!same)
          			sh(`ubus call xlite bond_set '{"key":"weights","iface":"","value":"${want}"}' > /dev/null 2>&1`);
          		return;
          	}
          	if (t.hour != 4 || cal_day == day || cal_t)
          		return;
          	let busy = 0;
          	for (let k, r in rates) busy += (r?.[0] ?? 0) + (r?.[1] ?? 0);
          	if (busy > 250000)
          		return;
          	cal_day = day;
          	cal_t = now;
          	sh('ubus call xlite bond_calibrate > /dev/null 2>&1');
          }

          while (true) {
          	let now = time();
          	let o = opt();
          	billing_day = +(o.main.billing_day ?? 1) || 1;
          	let save_every = (+(o.main.save_minutes ?? 30) || 30) * 60;
          	let state = readjson(RUN + '/state.json');
          	count_devices(now);
          	count_apps(now);
          	wg_check(now, state, o.main);
          	bond_check(now, state, o.main);
          	if (!ONCE) bond_autocal(now, state, o.main);
          	learn(now);
          	// "reset the numbers" from LuCI
          	if (fs.stat(TMP + '/usage.reset')) {
          		fs.unlink(TMP + '/usage.reset');
          		fs.unlink(KEEP + '/usage.json');
          		usage = { v: 1, t: now, devs: {} };
          		last = { up: {}, down: {}, apps: {} };
          		apps = {};
          		last_t = 0;
          	}
          	if (!ONCE)
          		watchdog(now, o, state);
          	if (now - sub_check > 300) {
          		sub_check = now;
          		subs(now, o.main, o.c);
          		if (!ONCE) {
          			lists_auto(now, o.main);
          			auto_update(o.main);
          		}
          	}
          	last_t = now;
          	writejson(TMP + '/usage.json', usage);
          	let devs = [];
          	let day = today(), mon = month();
          	for (let k, d in usage.devs)
          		push(devs, { id: k, ip: d.ip, name: d.name, seen: d.seen, today: d.days[day] ?? [ 0, 0 ], month: d.months[mon] ?? [ 0, 0 ],
          			rate: rates[k] ?? [ 0, 0 ] });
          	writejson(TMP + '/mon.json', { t: now, devs, apps, wg, fast: fast_on, health, period: mon, hours: (usage.hday == day) ? usage.hours : [] });
          	if (now - last_save >= save_every) {
          		writejson(KEEP + '/usage.json', usage);
          		last_save = now;
          	}
          	if (ONCE && ++cycle >= +(getenv('XLITE_ONCE')))
          		break;
          	sleep(STEP * 1000);
          }
          writejson(KEEP + '/usage.json', usage);
          XLITE_FILE_13
          mkdir -p "$(dirname "src/usr/share/xlite/wifiguard.uc")"
          cat > "src/usr/share/xlite/wifiguard.uc" <<'XLITE_FILE_WG'
          // XLite Wi-Fi guard: Wi-Fi as a line (client mode, section xw_<radio>) shares the radio with the router's own
          // Wi-Fi. When the network it joins goes away (a phone hotspot turned off), the radio keeps searching for it
          // and the router's own network on that radio is gone. The guard turns the client off after a short wait
          // ("parked": the router's network comes back), looks for the network now and then from the router's own
          // interface, and turns the client on again once the network is there.
          // Parked sections are listed in /etc/xlite/wifi_parked (the page shows them as "waiting for the network"); a file,
          // not the xlite config, so parking never reloads XLite.
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';

          const PARKED = '/etc/xlite/wifi_parked';
          const STEP = 10;            // seconds between checks
          const GRACE = 45;           // a client not connected for this long is parked
          const GRACE_AFTER = 90;     // right after it is turned on (boot, unpark): DHCP and the first scan take longer
          const SCAN_FAST = 60;       // parked: look for the network every minute for the first 10 minutes
          const SCAN_SLOW = 180;      // then every 3 minutes (a scan takes the router's own Wi-Fi off its channel briefly)

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function words(s) { return filter(split(trim(s ?? ''), /[ ,]+/), (x) => x != ''); }
          function read_parked() { return words(fs.readfile(PARKED)); }
          function write_parked(l) {
          	if (!length(l)) { fs.unlink(PARKED); return; }
          	fs.mkdir('/etc/xlite');
          	fs.writefile(PARKED + '.new', join(' ', l) + '\n');
          	fs.rename(PARKED + '.new', PARKED);
          }
          function log(msg) { sh(`logger -t xlite-wifi '${replace(msg, /'/g, '')}'`); }

          // fails: times in a row the client was turned on (its network seen) and still could not connect, a wrong
          // password say: each one doubles the wait before the next try (up to 30 minutes), so the router's own Wi-Fi
          // is not dropped every minute
          let down_since = {}, on_since = {}, parked_at = {}, last_scan = {}, fails = {}, tried = {};
          let started = time();

          function wireless_status() {
          	try { return json(sh('ubus call network.wireless status 2>/dev/null') || 'null'); } catch (e) { return null; }
          }

          // the client's interface and an interface of the router's own network on the same radio (used to scan)
          function ifnames(st, radio, sec) {
          	let sta = null, ap = null;
          	for (let i in st?.[radio]?.interfaces ?? []) {
          		if (i.section == sec) sta = i.ifname;
          		else if (i.config?.mode == 'ap' && i.ifname && !ap) ap = i.ifname;
          	}
          	return { sta, ap };
          }

          function connected(ifn) {
          	if (!ifn || !match(ifn, /^[A-Za-z0-9._-]{1,15}$/))
          		return false;
          	// a client interface is "up" only while it is associated (and authenticated); searching it is "dormant"/"down"
          	return trim(fs.readfile('/sys/class/net/' + ifn + '/operstate') ?? '') == 'up';
          }

          function seen(ap_ifn, ssid) {
          	if (!ap_ifn || !match(ap_ifn, /^[A-Za-z0-9._-]{1,15}$/))
          		return null;
          	let j = null;
          	try { j = json(sh(`ubus -t 20 call iwinfo scan '{"device":"${ap_ifn}"}' 2>/dev/null`) || 'null'); } catch (e) {}
          	if (!j?.results)
          		return null;
          	for (let n in j.results)
          		if (n.ssid == ssid)
          			return true;
          	return false;
          }

          function set_state(c, sec, park) {
          	c.set('wireless', sec, 'disabled', park ? '1' : '0');
          	let l = filter(read_parked(), (x) => x != sec);
          	if (park) push(l, sec);
          	write_parked(l);
          	c.save('wireless'); c.commit('wireless');
          	sh('wifi reload > /dev/null 2>&1');
          }

          while (true) {
          	let now = time();
          	let c = cursor();
          	c.load('wireless');
          	let parked = read_parked();
          	let st = null, any = false;
          	c.foreach('wireless', 'wifi-iface', (s) => {
          		let sec = s['.name'];
          		if (!match(sec, /^xw_[A-Za-z0-9_]{1,20}$/) || s.mode != 'sta')
          			return;
          		any = true;
          		let radio = s.device, is_parked = index(parked, sec) >= 0;
          		if (st == null) st = wireless_status();
          		let n = ifnames(st, radio, sec);
          		if (is_parked) {
          			// turned on by hand meanwhile (the page): not parked any more
          			if (s.disabled != '1') {
          				parked = filter(parked, (x) => x != sec);
          				write_parked(parked);
          				return;
          			}
          			if (parked_at[sec] == null) parked_at[sec] = now;
          			let every = (now - parked_at[sec] < 600) ? SCAN_FAST : SCAN_SLOW;
          			if (fails[sec]) every = [ 0, 120, 240, 480, 960, 1800 ][fails[sec]] ?? 1800;
          			if (now - (last_scan[sec] ?? 0) < every)
          				return;
          			last_scan[sec] = now;
          			// no interface of the router's own on this radio to look with: just try the client again
          			let f = n.ap ? seen(n.ap, s.ssid) : true;
          			if (f) {
          				log(`network "${s.ssid}" is back: client ${sec} on`);
          				delete parked_at[sec];
          				on_since[sec] = now;
          				tried[sec] = true;
          				delete down_since[sec];
          				set_state(c, sec, false);
          			}
          			return;
          		}
          		if (s.disabled == '1') {
          			delete down_since[sec];
          			return;
          		}
          		if (on_since[sec] == null) on_since[sec] = started;
          		if (connected(n.sta)) {
          			delete down_since[sec];
          			delete fails[sec];
          			delete tried[sec];
          			return;
          		}
          		if (down_since[sec] == null) down_since[sec] = now;
          		let wait = (now - on_since[sec] < GRACE_AFTER) ? GRACE_AFTER : GRACE;
          		if (now - down_since[sec] >= wait) {
          			log(`network "${s.ssid}" not reachable for ${now - down_since[sec]} s: client ${sec} parked, the router's own Wi-Fi is back`);
          			delete down_since[sec];
          			if (tried[sec]) fails[sec] = min(5, (fails[sec] ?? 0) + 1);
          			delete tried[sec];
          			parked_at[sec] = now;
          			last_scan[sec] = now;
          			set_state(c, sec, true);
          		}
          	});
          	// no Wi-Fi line at all: nothing to guard, look again now and then (one may be added from the page)
