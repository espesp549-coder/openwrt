              if fc.pstr(fn['props'].get('compression')) not in (None, 'none'): raise SystemExit('compressed DTB in FIT; not supported')
              fn['props']['data'] = new_dtb
              for hname, h in fn['kids'].items():
                  if not hname.startswith('hash'): continue
                  algo = fc.pstr(h['props'].get('algo'))
                  if algo == 'crc32': h['props']['value'] = struct.pack('>I', zlib.crc32(new_dtb) & 0xffffffff)
                  elif algo in ('sha1', 'sha256', 'md5'): h['props']['value'] = hashlib.new(algo, new_dtb).digest()
                  else: raise SystemExit(f'unknown hash algo {algo}')
