name: Build MX2000 24.10.8 (verified)

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Ignore all build caches (use if a cached run misbehaves)'
        type: boolean
        default: false
      diag:
        description: 'Diagnostic boot build: LED heartbeat, panic halts, boot logs saved to flash, boot counter reset only with an Ethernet link (turn OFF for daily use)'
        type: boolean
        default: false
      disable_broken:
        description: 'Disable in the DTS the hardware that stops the boot today (USB, crypto/rng/thermal/qfprom, Wi-Fi) - this is the combination that booted with working Ethernet'
        type: boolean
        default: true
      wifi_mode:
        description: 'Wi-Fi: off = DT nodes disabled (boots today); manual = enabled but ath11k_ahb not auto-loaded, start it by hand with wifi-test to watch the crash; on = normal'
        type: choice
        options: ['on', 'manual', 'off']
        default: 'on'
      extra_packages:
        description: 'Extra packages built into the image, space separated (kmods can also be added later with opkg from the kmod feed of the build, see kmod_feed)'
        type: string
        default: 'luci-app-v2raya'
      wifi_ethernet_mode:
        description: 'Speed: ath11k frame_mode=2 (the Wi-Fi chip converts 802.11/Ethernet headers instead of the CPU; measured 80 -> 90 Mbit/s through v2rayA)'
        type: boolean
        default: true
      perf_kernel:
        description: 'Speed over hardening (home router): hardened_usercopy=off mitigations=off, no software PAN emulation on every user<->kernel copy, no slab freelist hardening/randomisation'
        type: boolean
        default: true
      irq_split:
        description: 'Speed: all Wi-Fi interrupts (ce*, DP_EXT_IRQ data path) on CPU1, Ethernet on CPU0 (measured: Ethernet drops 800/s -> 0 under a VPN download)'
        type: boolean
        default: true
      gmac_rx_ring:
        description: 'Speed: Ethernet (nss-dp syn-gmac) RX ring size; the driver default 128 overflows in TCP bursts while a CPU is busy (lost packets -> slow ramp-up)'
        type: choice
        options: ['1024', '512', '128']
        default: '1024'
      net_tuning:
        description: 'Speed: cubic (no BBR pacing cost), 2 MB TCP receive buffer, xray with GOMAXPROCS=1 GOGC=200 (measured 100 -> 110 Mbit/s), netdev_budget=600, netdev_max_backlog=2000, no slow start after idle'
        type: boolean
        default: true
      wifi_lowmem:
        description: 'RAM: smaller ath11k Wi-Fi rings (monitor 4096->128, RX 4096->2048, TX completion 32768->8192) = the values of the IPQ5018+QCN6122 Mercusys MR80X v2 OpenWrt port, about 37 MB less RAM'
        type: boolean
        default: true
      syscfg_storage:
        description: 'Storage: the Linksys syscfg partition (68 MB, the stock firmware settings, never used by OpenWrt) becomes extra space at /mnt/syscfg (~55 MB); v2rayA geo files move there'
        type: boolean
        default: true
      perf_tools:
        description: 'Diagnostics: kernel performance events + the perf tool, to see which kernel functions use the CPU during a VPN download (perf top / perf record)'
        type: boolean
        default: true
      kmod_feed:
        description: 'opkg kmod feed: every kmod is built with this firmware (same kernel) and published as a release of this repo; on the router run mx2000-kmods once, then opkg install kmod-... works like on an official build (dropped by itself if a kmod breaks the build)'
        type: boolean
        default: true
      xray_splice:
        description: 'Speed: xray zero-copy download for VLESS over TCP (+HTTP header) without TLS: the kernel hands the download from the server socket to the client socket, xray no longer copies it (same protocol and server, v2rayA unchanged); tested on the runner first, left out by itself if a test fails'
        type: boolean
        default: true

permissions:
  contents: write   # the kmod feed is published as a release of this repo

env:
  TAG: v24.10.8
  BASE: e3bec5692c50ff3b8001d4611c8eb57f54efb6b5   # آخر commit بالـ main قبل نسخ ملفات 6.12

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 345
    steps:
      # ------------------------------------------------------------------
      - name: "0. Helper scripts + runner info"
        run: |
          mkdir -p out
          cat > ci-lib.sh <<'LIB'
          SUMMARY="$GITHUB_WORKSPACE/out/summary.md"
          pass() { echo "- **PASS** $*" | tee -a "$SUMMARY"; }
          warn() { echo "- **WARN** $*" | tee -a "$SUMMARY"; echo "::warning::$*"; }
          fail() { echo "- **FAIL** $*" | tee -a "$SUMMARY"; echo "::error::$*"; exit 1; }
          check() { local d="$1"; shift; if "$@" >/dev/null 2>&1; then pass "$d"; else fail "$d"; fi; }
          soft()  { local d="$1"; shift; if "$@" >/dev/null 2>&1; then pass "$d"; else warn "$d"; fi; }
          LIB

          cat > stage.sh <<'STAGE'
          #!/bin/bash
          # usage: stage.sh NAME [make targets...]
          name="$1"; shift
          cd "$GITHUB_WORKSPACE/openwrt" || exit 1
          unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CC CXX LD AR AS
          log="$GITHUB_WORKSPACE/out/stage-$name.log"
          echo "=== STAGE $name: make $*"; date
          start=$(date +%s)
          if make -j"$(nproc)" "$@" V=s > "$log" 2>&1; then
            mins=$(( ($(date +%s) - start) / 60 ))
            echo "STAGE $name OK in ${mins} min"
            df -h / | tail -n 1
            echo "- **STAGE $name** ok (${mins} min)" >> "$GITHUB_WORKSPACE/out/summary.md"
          else
            echo "::error::stage $name FAILED"
            grep -n -E "Patch failed|Hunk #[0-9]+ FAILED|[Ee]rror:|Error [0-9]+|\*\*\*" "$log" | head -n 60
            echo "----- real configure errors from config.log -----"
            for f in $(find build_dir -name config.log 2>/dev/null | xargs -r grep -l "configure: error" 2>/dev/null | head -n 3); do
              echo "##### $f"
              sed -n '/^configure:.*checking for suffix of object files/,/^## Cache variables/p' "$f" | head -n 60
              cp "$f" "$GITHUB_WORKSPACE/out/cfglog-$name-$(echo "$f" | tr '/' '_')"
            done
            if [ -n "$STAGE_NO_RETRY" ]; then echo "- **FAIL** stage $name (no retry)" >> "$GITHUB_WORKSPACE/out/summary.md"; exit 1; fi
            echo "----- retry single-threaded for a readable error (max 30 min) -----"
            timeout 30m make -j1 "$@" V=s 2>&1 | tail -n 200 > "$GITHUB_WORKSPACE/out/stage-$name-retry-tail.txt"
            tail -n 80 "$GITHUB_WORKSPACE/out/stage-$name-retry-tail.txt"
            echo "- **FAIL** stage $name" >> "$GITHUB_WORKSPACE/out/summary.md"
            exit 1
          fi
          STAGE
          chmod +x stage.sh
          cat > compare-mx2000.py <<'CMPPY'
          #!/usr/bin/env python3
          """MX2000 flash-readiness checks (static safety + comparison with the real router).

          Level 1 (needs only the built DTS/images): can this build do damage / is it self-consistent?
          Level 2 (needs --ref-dir from the router, see mx2000-preflight.sh): does it match the hardware
                  that is running OpenWrt 25 today (partition table, memory map, FIT parameters, upgrade scripts)?
          Exit code: 0 = no CRITICAL finding, 2 = at least one CRITICAL finding.
          """
          import argparse, difflib, glob, gzip, hashlib, os, re, subprocess, sys, tarfile

          # ---------------------------------------------------------------- DTS parsing
          def parse_dts(text):
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              text = re.sub(r'(?m)//.*$', '', text)
              root = {'name': '/', 'props': {}, 'kids': {}}
              stack = [root]
              for m in re.finditer(r'([^{};]*)\{|\}\s*;|([^{};]+);', text):
                  if m.group(1) is not None:
                      hdr = m.group(1).strip()
                      if hdr == '/':
                          stack.append(root); continue
                      name = hdr.split(':')[-1].strip()
                      node = {'name': name, 'props': {}, 'kids': {}}
                      stack[-1]['kids'][name] = node
                      stack.append(node)
                  elif m.group(2) is None:
                      if len(stack) > 1: stack.pop()
                  else:
                      stmt = m.group(2).strip()
                      if stmt.startswith('/') and stmt.endswith('/') or stmt.startswith(('/dts-v1/', '/memreserve/', '/plugin/')):
                          continue
                      if '=' in stmt:
                          k, v = stmt.split('=', 1)
                          stack[-1]['props'][k.strip()] = ' '.join(v.split())
                      elif stmt:
                          stack[-1]['props'][stmt] = ''
              return root

          def walk(node, path=''):
              yield (path or '/'), node
              for n, k in node['kids'].items():
                  yield from walk(k, (path if path != '/' else '') + '/' + n)

          def cells(v):
              out = []
              for grp in re.findall(r'<([^>]*)>', v):
                  for t in grp.split():
                      try: out.append(int(t, 0))
                      except ValueError: pass
              return out

          def join32(lst):
              n = 0
              for x in lst: n = (n << 32) | x
              return n

          def strings(v):
              out = []
              for x in re.findall(r'"([^"]*)"', v):
                  out.extend(x.split('\\0'))
              return out

          def load_dts(path):
              if path.endswith('.dtb'):
                  txt = subprocess.run(['dtc', '-I', 'dtb', '-O', 'dts', '-q', path], capture_output=True, text=True).stdout
              else:
                  txt = open(path, errors='replace').read()
              return parse_dts(txt)

          def partitions(root):
              out = {}
              for path, node in walk(root):
                  if 'fixed-partitions' in node['props'].get('compatible', ''):
                      ac = int(cells(node['props'].get('#address-cells', '<1>'))[0]) if node['props'].get('#address-cells') else 1
                      sc = int(cells(node['props'].get('#size-cells', '<1>'))[0]) if node['props'].get('#size-cells') else 1
                      for kn, kid in node['kids'].items():
                          lab = strings(kid['props'].get('label', ''))
                          reg = cells(kid['props'].get('reg', ''))
                          if lab and len(reg) >= ac + sc:
                              out[lab[0]] = dict(off=join32(reg[:ac]), size=join32(reg[ac:ac + sc]),
                                                 ro='read-only' in kid['props'], path=path + '/' + kn)
              return out

          # ---------------------------------------------------------------- report
          class Report:
              def __init__(self): self.rows = []
              def add(self, lvl, msg): self.rows.append((lvl, msg)); print(f'[{lvl}] {msg}')
              def count(self, lvl): return sum(1 for l, _ in self.rows if l == lvl)

          # يجب أن تكون read-only (bootloader + معايرة + معلومات الجهاز). أقسام الـ env (u_env, s_env, 0:APPSBLENV) لازم تبقى writable لأن fw_setenv يكتب فيها.
          CRIT_RX = re.compile(r'^(0:(SBL1|MIBIB|QSEE|DEVCFG|CDT|APPSBL|ART|TRAINING)|devinfo)$')
          ENV_RX = re.compile(r'^(u_env|s_env|0:APPSBLENV)$')
          SKIP_PROPS = {'phandle', 'linux,phandle', 'clocks', 'resets', 'interrupt-parent', 'phys', 'phy-handle', 'pinctrl-0',
                        'pinctrl-1', 'pinctrl-2', 'memory-region', 'nvmem-cells', 'power-domains', 'iommus', 'mboxes',
                        'interrupts-extended', 'qcom,smem-states', 'local-mac-address', 'mac-address', 'bootargs'}
          def norm_prop(k, v):
              if k.endswith('gpios') or k in ('gpio', 'gpios'):
                  c = cells(v); return ' '.join(hex(x) for x in c[1:]) if c else v
              return v

          def hr(n): return f'0x{n:x} ({n/1048576:.2f} MiB)'

          # ---------------------------------------------------------------- level 1
          def level1(rep, built, args):
              P = partitions(built)
              if not P: rep.add('CRIT', 'no fixed-partitions found in the built DTS'); return P
              rep.add('OK', f'built DTS has {len(P)} partitions: ' + ', '.join(sorted(P)))
              rootp = built['props']
              comp = strings(rootp.get('compatible', ''))
              rep.add('OK' if 'linksys,mx2000' in comp else 'CRIT', f'root compatible = {comp} (sysupgrade/board_name needs linksys,mx2000)')
              for lab, p in sorted(P.items(), key=lambda x: x[1]['off']):
                  if CRIT_RX.match(lab) and not p['ro']:
                      rep.add('CRIT', f'bootloader/calibration partition "{lab}" is WRITABLE in the built DTS (kernel could overwrite it)')
              if not any(l == 'CRIT' and 'WRITABLE' in m for l, m in rep.rows):
                  rep.add('OK', 'all bootloader/calibration partitions (SBL1, MIBIB, QSEE, DEVCFG, CDT, APPSBL, ART, TRAINING, devinfo) are read-only')
              for lab, p in sorted(P.items()):
                  if ENV_RX.match(lab) and not p['ro']:
                      rep.add('INFO', f'env partition "{lab}" is writable (expected: fw_setenv/boot_part switching writes there)')
              writable = {l: p for l, p in P.items() if not p['ro']}
              for a, pa in P.items():
                  if not CRIT_RX.match(a): continue
                  for b, pb in writable.items():
                      if a != b and pa['off'] < pb['off'] + pb['size'] and pb['off'] < pa['off'] + pa['size']:
                          rep.add('CRIT', f'critical partition "{a}" overlaps writable partition "{b}"')
              for need in ('kernel', 'rootfs', 'alt_kernel', 'alt_rootfs', '0:ART', 'u_env', 's_env', 'devinfo'):
                  if need not in P: rep.add('WARN', f'expected partition "{need}" missing from the built DTS')

              # images
              k, r = P.get('kernel'), P.get('rootfs')
              if args.sysupgrade and os.path.exists(args.sysupgrade) and k and r:
                  try:
                      with tarfile.open(args.sysupgrade) as tf:
                          names = {m.name.split('/')[-1]: m for m in tf.getmembers() if m.isfile()}
                          rep.add('OK' if {'kernel', 'root'} <= set(names) else 'CRIT', f'sysupgrade tar members: {sorted(names)}')
                          if 'kernel' in names:
                              kd = tf.extractfile(names['kernel']).read(); ks = len(kd)
                              rep.add('OK' if kd[:4] == b'\xd0\x0d\xfe\xed' else 'CRIT', 'kernel member is a FIT/DTB image (magic d00dfeed)')
                              limit = (r['off'] - k['off']) if r['off'] > k['off'] else k['size']
                              limit = min(limit, k['size'])
                              rep.add('OK' if ks <= limit else 'CRIT', f'kernel image {hr(ks)} vs space before rootfs/kernel partition {hr(limit)}')
                          if 'root' in names:
                              rd = tf.extractfile(names['root']); magic = rd.read(4); rs = names['root'].size
                              rep.add('OK' if magic == b'hsqs' else 'WARN', f'root member magic = {magic!r} (squashfs is b\'hsqs\')')
                              rep.add('OK' if rs <= 0.85 * r['size'] else 'CRIT', f'root image {hr(rs)} vs 85% of rootfs partition {hr(int(0.85*r["size"]))}')
                  except Exception as e:
                      rep.add('WARN', f'could not inspect sysupgrade image: {e}')
              elif args.sysupgrade:
                  rep.add('WARN', 'sysupgrade image or kernel/rootfs partitions not available for the size check')
              if args.factory and os.path.exists(args.factory) and k and r:
                  fs = os.path.getsize(args.factory)
                  rep.add('OK' if fs <= k['size'] + r['size'] else 'CRIT', f'factory image {hr(fs)} vs kernel+rootfs partitions {hr(k["size"]+r["size"])}')
                  rep.add('INFO', 'factory.bin acceptance by the STOCK Linksys firmware cannot be verified offline - prefer flashing from the running OpenWrt (sysupgrade) after a RAM-boot test')
                  factory_layout(rep, P, args)

              # uboot-envtools block
              if args.envtools_block and os.path.exists(args.envtools_block):
                  blk = open(args.envtools_block, errors='replace').read()
                  m = re.search(r'mx2000.*?;;', blk, flags=re.S)
                  if not m: rep.add('WARN', 'MX2000 block not found in the built uboot-envtools file')
                  else:
                      for line in m.group(0).splitlines():
                          if 'ubootenv_add' in line:
                              toks = re.findall(r'"([^"]+)"', line)
                              nm = toks[0] if toks else ''
                              if nm.startswith('/dev/mtd$'):  # idx="$(find_mtd_index <name>)" on an earlier line
                                  fm = re.findall(r'find_mtd_index\s+"?([\w:]+)"?', m.group(0))
                                  nm = fm[-1] if fm else nm
                              if nm in P:
                                  nums = [int(t, 16) for t in toks[1:] if re.fullmatch(r'0x[0-9a-fA-F]+', t)]
                                  if len(nums) >= 2 and nums[0] + nums[1] > P[nm]['size']:
                                      rep.add('CRIT', f'envtools "{nm}": offset+env size {hr(nums[0]+nums[1])} exceeds partition {hr(P[nm]["size"])}')
                                  else: rep.add('OK', f'envtools "{nm}" matches a DTS partition ({line.strip()})')
                              elif nm: rep.add('WARN', f'envtools names "{nm}" which is not a DTS partition label ({line.strip()})')
              return P

          # ---------------------------------------------------------------- FIT info
          def fit_info(path, mkimage):
              if not mkimage or not os.path.exists(path): return None
              out = subprocess.run([mkimage, '-l', path], capture_output=True, text=True).stdout
              keys = ('Architecture', 'Compression', 'Load Address', 'Entry Point', 'Default Configuration', 'OS', 'Type')
              info = {}
              for line in out.splitlines():
                  for kk in keys:
                      m = re.match(r'\s*' + re.escape(kk) + r':\s*(.*)', line)
                      if m: info.setdefault(kk, set()).add(m.group(1).strip())
              cfgs = re.findall(r'Configuration \d+ \(([^)]*)\)', out)
              if cfgs: info['Configurations'] = set(cfgs)
              return info


          def sha(b): return hashlib.sha256(b).hexdigest()

          def magic_kind(b):
              if b[:4] == b'\xd0\x0d\xfe\xed': return 'FIT/DTB image (d00dfeed)'
              if b[257:262] == b'ustar': return 'TAR archive = a sysupgrade .bin written RAW (NOT bootable: use factory.bin for raw writes)'
              if b[:4] == b'UBI#': return 'UBI image'
              if b[:4] == b'hsqs': return 'squashfs'
              if b and set(b[:64]) == {0xff}: return 'erased flash (all 0xFF)'
              if b and set(b[:64]) == {0}: return 'zeros'
              return 'unknown (' + b[:8].hex() + ')'

          def fit_total(b):
              return int.from_bytes(b[4:8], 'big') if b[:4] == b'\xd0\x0d\xfe\xed' else 0

          def factory_layout(rep, P, args):
              """factory.bin is written raw at the START of the kernel partition: FIT at 0, UBI rootfs at (rootfs.off - kernel.off)."""
              k, r = P.get('kernel'), P.get('rootfs')
              if not (args.factory and os.path.exists(args.factory) and k and r): return
              delta = r['off'] - k['off']
              with open(args.factory, 'rb') as f:
                  head = f.read(4096); f.seek(delta); at = f.read(4096)
              rep.add('OK' if head[:4] == b'\xd0\x0d\xfe\xed' else 'CRIT', f'factory.bin offset 0: {magic_kind(head)}')
              tot = fit_total(head)
              if tot: rep.add('OK' if tot <= delta else 'CRIT', f'factory.bin FIT size {hr(tot)} must end before the UBI start at {hr(delta)}')
              rep.add('OK' if at[:4] == b'UBI#' else 'CRIT', f'factory.bin offset {hex(delta)} (start of the rootfs partition): {magic_kind(at)} (expected UBI image)')

          def read_opt(path, n=None):
              try:
                  with open(path, 'rb') as f: return f.read(n) if n else f.read()
              except OSError: return None

          def postmortem(rep, args):
              d = os.path.join(args.ref_dir, 'postmortem') if args.ref_dir else ''
              if not d or not os.path.isdir(d):
                  rep.add('INFO', 'no ref/postmortem/ (run mx2000-postmortem.sh on the router AFTER a failed boot attempt)'); return
              rep.add('OK', 'post-mortem data from the router found')
              built_kernel = None
              if args.sysupgrade and os.path.exists(args.sysupgrade):
                  with tarfile.open(args.sysupgrade) as tf:
                      for m in tf.getmembers():
                          if m.isfile() and m.name.split('/')[-1] == 'kernel': built_kernel = tf.extractfile(m).read()
              flashed = None
              for slot in ('kernel', 'alt_kernel'):
                  head = read_opt(os.path.join(d, slot + '-head.bin'), 4096)
                  if head is None: continue
                  rep.add('INFO', f'slot {slot}: first bytes = {magic_kind(head)}')
                  fit = read_opt(os.path.join(d, slot + '-fit.bin'))
                  if fit and built_kernel is not None:
                      same = fit[:len(built_kernel)] == built_kernel[:len(fit)] and abs(len(fit) - len(built_kernel)) <= 4096
                      if same:
                          flashed = slot; rep.add('OK', f'slot {slot} contains EXACTLY the kernel FIT of the build (sha256 {sha(fit)[:16]}...) => the flash itself was correct')
                      else: rep.add('INFO', f'slot {slot}: FIT sha256 {sha(fit)[:16]}... differs from the build (normal for the slot that holds OpenWrt 25)')
                  if flashed is None and built_kernel is not None and head[:8] == built_kernel[:8] and fit is None:
                      rep.add('WARN', f'slot {slot} starts like the built kernel but the FIT region was not dumped')
              for slot in ('rootfs', 'alt_rootfs'):
                  h = read_opt(os.path.join(d, slot + '-head.bin'), 4096)
                  if h is not None: rep.add('INFO', f'partition {slot}: first bytes = {magic_kind(h)}')
              if flashed is None and built_kernel is not None and any(os.path.exists(os.path.join(d, s + '-head.bin')) for s in ('kernel', 'alt_kernel')):
                  kinds = [magic_kind(read_opt(os.path.join(d, s + '-head.bin'), 4096) or b'') for s in ('kernel', 'alt_kernel')]
                  rep.add('CRIT' if any('TAR' in k for k in kinds) else 'WARN', 'the build kernel was NOT found in either kernel slot: ' + ' | '.join(kinds))
              if flashed:
                  other = 'alt_rootfs' if flashed == 'alt_kernel' else 'rootfs'
                  h = read_opt(os.path.join(d, other + '-head.bin'), 4096)
                  if h is not None: rep.add('OK' if h[:4] == b'UBI#' else 'CRIT', f'rootfs partition of the flashed slot ({other}): {magic_kind(h)} (expected UBI image)')
              envf = os.path.join(d, 'fw_printenv.txt')
              if os.path.exists(envf):
                  env = open(envf, errors='replace').read()
                  vals = {k: v for k, v in re.findall(r'(?m)^(boot_part|bootcount|bootlimit|auto_recovery|upgrade_available)=(.*)$', env)}
                  rep.add('INFO', 'U-Boot env after the failed attempts: ' + ', '.join(f'{k}={v}' for k, v in vals.items()))
              ps = sorted(glob.glob(os.path.join(d, 'pstore', '*')))
              if ps:
                  for f in ps[:4]:
                      txt = (read_opt(f, 4000) or b'').decode(errors='replace')
                      rep.add('WARN', f'pstore {os.path.basename(f)} (a saved kernel log!): ' + ' / '.join(txt.splitlines()[-12:])[:700])
              else: rep.add('INFO', 'no pstore/ramoops data (the OpenWrt 25 kernel or DTS has no ramoops, so no crash log survived)')
              for dd in sorted(glob.glob(os.path.join(d, 'diag-*'))):
                  snaps = sorted(glob.glob(os.path.join(dd, 'boot*-*.txt')))
                  rep.add('OK', f'{os.path.basename(dd)}: {len(snaps)} snapshots written by the 24.10 build itself (it reached userspace)')
                  if snaps:
                      last = open(snaps[-1], errors='replace').read()
                      bad = [l for l in last.splitlines() if re.search(r'(error|fail|timeout|unable|cannot|not found|probe of .* failed|deferred|nss-dp|ssdk|ath11k|q6|remoteproc)', l, re.I)]
                      rep.add('WARN', f'{os.path.basename(snaps[-1])}: ' + ' // '.join(bad[:15])[:1500] if bad else f'{os.path.basename(snaps[-1])}: no error lines')
                      sec = re.search(r'=== ip -?b?r? ?link\n(.*?)\n===', last, re.S) or re.search(r'=== ip link\n(.*?)\n===', last, re.S)
                      if sec: rep.add('INFO', 'interfaces seen by 24.10: ' + ' | '.join(sec.group(1).splitlines()[:12]))
              dm = os.path.join(d, 'dmesg-boot.txt')
              if os.path.exists(dm):
                  lines = [l for l in open(dm, errors='replace').read().splitlines() if re.search(r'reset|bootcount|panic|wdt|watchdog|reboot|boot_part|restart', l, re.I)]
                  if lines: rep.add('INFO', 'boot-related dmesg lines on OpenWrt 25: ' + ' // '.join(lines[:10])[:800])

          CFG_KEY = re.compile(r'(QCOM|IPQ|MSM|QCA|MTD|UBI|NAND|SPI|NVMEM|MDIO|PHY|PINCTRL|GCC|REGULATOR|SMEM|SCM|HWSPINLOCK|MAILBOX|REMOTEPROC|RPMSG|QMI|BAM|PWM|SERIAL|DWC3|SDHCI|DSA|PSTORE|RAMOOPS|WATCHDOG|WDT|CPUFREQ|ARM64_|PANIC)')
          def parse_cfg(txt):
              return {m.group(1): m.group(2) for m in re.finditer(r'(?m)^CONFIG_([A-Za-z0-9_]+)=(.*)$', txt)}

          def config_compare(rep, args):
              cz = os.path.join(args.ref_dir, 'config.gz') if args.ref_dir else ''
              if not (cz and os.path.exists(cz) and args.kernel_config and os.path.exists(args.kernel_config)):
                  rep.add('INFO', 'kernel config comparison skipped (needs ref/config.gz = /proc/config.gz of OpenWrt 25 and out/13-kernel.config)'); return
              router = parse_cfg(gzip.open(cz, 'rt', errors='replace').read()); ours = parse_cfg(open(args.kernel_config, errors='replace').read())
              miss = sorted(k for k, v in router.items() if v in ('y', 'm') and CFG_KEY.search(k) and ours.get(k) not in ('y', 'm'))
              path = os.path.join(args.out_dir_reports, '18-config-missing.txt')
              open(path, 'w').write('\n'.join(f'CONFIG_{k}={router[k]} (router)  ours={ours.get(k, "absent")}' for k in miss))
              hot = [k for k in miss if re.search(r'(UBI|NAND|SNAND|NVMEM|SERIAL_MSM|QCOM_SCM|PINCTRL_IPQ|GCC_IPQ|IPQ_GCC|SMEM|PSTORE|RAMOOPS|PANIC)', k)]
              rep.add('OK' if not miss else 'WARN', f'{len(miss)} qcom/flash/boot-related options are enabled in OpenWrt 25 but not in this build (6.12 vs 6.6 renames explain some); full list: 18-config-missing.txt')
              if hot: rep.add('WARN', 'most suspicious: ' + ', '.join('CONFIG_' + k for k in hot[:25]))
              rep.add('INFO', f'PANIC_TIMEOUT router={router.get("PANIC_TIMEOUT")} ours={ours.get("PANIC_TIMEOUT")} (1 = reboot 1 s after a kernel panic -> a boot loop of ~2 s)')

          def recipe_check(rep, args, itb_info):
              if not (args.recipe and os.path.exists(args.recipe)): return
              txt = open(args.recipe, errors='replace').read()
              m = re.search(r'define Device/linksys_mx2000(.*?)endef', txt, flags=re.S)
              blk = m.group(1) if m else ''
              vars_ = dict(re.findall(r'(?m)^\s*([A-Z_]+)\s*:?=\s*(.+)$', blk))
              interesting = {k: v for k, v in vars_.items() if k in ('DEVICE_DTS', 'DEVICE_DTS_CONFIG', 'KERNEL_SIZE', 'KERNEL_LOADADDR', 'IMAGE_SIZE', 'BLOCKSIZE', 'PAGESIZE', 'DEVICE_VENDOR', 'DEVICE_MODEL')}
              rep.add('INFO', 'image recipe linksys_mx2000: ' + '; '.join(f'{k}={v.strip()}' for k, v in interesting.items()))
              cfgnames = set(re.findall(r'config@[\w.\-]+', txt))
              if itb_info and cfgnames and itb_info.get('Configurations') is not None:
                  ok = cfgnames & itb_info['Configurations']
                  rep.add('OK' if ok or 'DEVICE_DTS_CONFIG' not in interesting else 'WARN', f'FIT configuration names in the recipe {sorted(cfgnames)[:4]} vs in the built FIT {sorted(itb_info["Configurations"])}')

          # ---------------------------------------------------------------- level 2
          def level2(rep, built, P, args):
              d = args.ref_dir
              run = None
              for nm in ('running.dtb', 'running.dts'):
                  if os.path.exists(os.path.join(d, nm)): run = load_dts(os.path.join(d, nm)); break
              if run is None:
                  rep.add('INFO', f'no {d}/running.dtb (or running.dts) yet: the running-DTB comparison needs mx2000-preflight.sh (the official image is compared in step 21)')
                  return False
              rep.add('OK', 'reference device tree from the real router loaded')
              RP = partitions(run)
              if not RP: rep.add('WARN', 'running DTB has no fixed-partitions (router may use another partition scheme)')
              for lab, rp in sorted(RP.items(), key=lambda x: x[1]['off']):
                  bp = P.get(lab)
                  if not bp: rep.add('WARN', f'partition "{lab}" exists on the router but not in the built DTS'); continue
                  if (rp['off'], rp['size']) != (bp['off'], bp['size']):
                      rep.add('CRIT', f'partition "{lab}" differs: router off/size {hex(rp["off"])}/{hex(rp["size"])} vs built {hex(bp["off"])}/{hex(bp["size"])}')
                  elif rp['ro'] and not bp['ro']:
                      rep.add('CRIT', f'partition "{lab}" is read-only on the router but writable in the built DTS')
                  else: rep.add('OK', f'partition "{lab}" identical (off {hex(bp["off"])}, size {hex(bp["size"])})')
              for lab in P:
                  if lab not in RP and RP: rep.add('INFO', f'partition "{lab}" only exists in the built DTS')

              # root / chosen / memory
              for key in ('compatible', 'model', 'qcom,msm-id', 'qcom,board-id'):
                  a, b = run['props'].get(key), built['props'].get(key)
                  if a != b: rep.add('WARN', f'root {key}: router={a} built={b}')
                  else: rep.add('OK', f'root {key} identical')
              rn = {p: n for p, n in walk(run)}; bn = {p: n for p, n in walk(built)}
              def compare_nodes(rx, label, lvl):
                  diffs = 0
                  for p in sorted(set(rn) | set(bn)):
                      if not re.search(rx, p): continue
                      a, b = rn.get(p), bn.get(p)
                      if a is None or b is None:
                          rep.add(lvl, f'{label}: node {p} only in {"built" if a is None else "router"} DTS'); diffs += 1; continue
                      for k in sorted(set(a['props']) | set(b['props'])):
                          if k in SKIP_PROPS: continue
                          va, vb = norm_prop(k, a['props'].get(k, '<absent>')), norm_prop(k, b['props'].get(k, '<absent>'))
                          if va != vb:
                              diffs += 1
                              if diffs <= 25: rep.add(lvl, f'{label}: {p} {k}: router={va[:90]} built={vb[:90]}')
                  if diffs == 0: rep.add('OK', f'{label}: identical')
                  elif diffs > 25: rep.add(lvl, f'{label}: ... {diffs-25} more differences')
              compare_nodes(r'^/memory', 'memory map', 'WARN')
              compare_nodes(r'^/reserved-memory', 'reserved-memory (wifi/Q6 carve-outs)', 'WARN')
              compare_nodes(r'^/chosen', 'chosen (console/bootargs)', 'WARN')
              compare_nodes(r'(gpio-keys|/leds|pwm-leds)', 'buttons/LEDs gpios', 'WARN')
              compare_nodes(r'(mdio|ethernet-phy|ess-switch|ess-uniphy|nss-dp|gmac)', 'ethernet/switch/phy', 'WARN')
              compare_nodes(r'(qcn6122|wifi@|q6|wcss)', 'wifi nodes', 'WARN')
              def enabled(nodes):
                  return {p for p, n in nodes.items() if strings(n['props'].get('status', '"okay"'))[:1] in (['okay'], ['ok']) and 'compatible' in n['props']}
              miss = sorted(enabled(rn) - enabled(bn))
              if miss:
                  rep.add('WARN', f'{len(miss)} hardware nodes are enabled on the router but missing/disabled in the built DTS (first 25): ' + ', '.join(miss[:25]))
              else: rep.add('OK', 'every enabled hardware node of the router is enabled in the built DTS')

              # FIT parameters
              cur = fit_info(os.path.join(d, 'kernel-head.bin'), args.mkimage)
              mine = fit_info(args.itb, args.mkimage) if args.itb else None
              if cur and mine:
                  for kk in ('Architecture', 'Compression', 'Load Address', 'Entry Point', 'OS', 'Type'):
                      a, b = cur.get(kk), mine.get(kk)
                      if a and b and a != b: rep.add('WARN', f'FIT {kk}: router kernel={sorted(a)} built={sorted(b)} (U-Boot may not boot a different layout)')
                      elif a and b: rep.add('OK', f'FIT {kk} identical ({sorted(a)})')
                  ca, cb = cur.get('Configurations', set()), mine.get('Configurations', set())
                  rep.add('OK' if ca & cb else 'WARN', f'FIT configuration names: router={sorted(ca)} built={sorted(cb)}')
              else:
                  rep.add('INFO', 'FIT comparison skipped (needs ref/kernel-head.bin and mkimage)')

              # boot-count / dual boot environment
              envf = os.path.join(d, 'fw_printenv.txt')
              if os.path.exists(envf):
                  env = open(envf, errors='replace').read()
                  for key in ('boot_part', 'bootcount', 'bootlimit', 'auto_recovery', 'upgrade_available'):
                      rep.add('OK' if re.search(r'(?m)^' + key + r'=', env) else 'INFO', f'U-Boot env key {key}: ' + ('present' if re.search(r'(?m)^' + key + r'=', env) else 'absent'))
              # upgrade logic: the running OS performs the flash, so its scripts matter more than ours
              for nm, rel in (('platform.sh', 'target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh'),
                              ('bootcount', 'target/linux/qualcommax/ipq50xx/base-files/etc/init.d/bootcount')):
                  a, b = os.path.join(d, 'router', nm), os.path.join(args.tree, rel) if args.tree else ''
                  if os.path.exists(a) and os.path.exists(b):
                      A, B = open(a, errors='replace').read().splitlines(), open(b, errors='replace').read().splitlines()
                      diff = list(difflib.unified_diff(A, B, 'router-OpenWrt25/' + nm, 'built/' + nm, lineterm='', n=1))
                      if not diff: rep.add('OK', f'{nm}: identical to the one running on the router')
                      else:
                          rep.add('WARN', f'{nm}: {len(diff)} diff lines vs the OpenWrt 25 script on the router (the router\'s script performs the flash!)')
                          open(os.path.join(args.out_dir_reports, f'18-diff-{nm}.txt'), 'w').write('\n'.join(diff))
                  else: rep.add('INFO', f'{nm}: no copy from the router (ref/router/{nm}) - upgrade logic not compared')
              return True

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--built-dts', required=True); ap.add_argument('--ref-dir', default='')
              ap.add_argument('--sysupgrade'); ap.add_argument('--factory'); ap.add_argument('--itb')
              ap.add_argument('--tree', default=''); ap.add_argument('--envtools-block')
              ap.add_argument('--mkimage', default=''); ap.add_argument('--report', default='flash-readiness.md')
              ap.add_argument('--summary', default='')
              ap.add_argument('--kernel-config', default=''); ap.add_argument('--recipe', default='')
              args = ap.parse_args()
              args.out_dir_reports = os.path.dirname(os.path.abspath(args.report))
              rep = Report()
              built = load_dts(args.built_dts)
              P = level1(rep, built, args)
              l1crit = rep.count('CRIT')
              had_ref = False
              recipe_check(rep, args, fit_info(args.itb, args.mkimage) if args.itb else None)
              if args.ref_dir and os.path.isdir(args.ref_dir):
                  had_ref = level2(rep, built, P, args)
                  postmortem(rep, args)
                  config_compare(rep, args)
              else: rep.add('INFO', 'no ref/ directory in the repository yet: comparison with the real router not done (run mx2000-preflight.sh)')
              crit, warn = rep.count('CRIT'), rep.count('WARN')
              ram = 'GO' if l1crit == 0 else 'NO-GO'
              flash = 'GO' if (crit == 0 and had_ref) else 'NO-GO'
              verdict = [f'RAM-boot test (initramfs, no flash writes): {ram}' + ('' if crit == l1crit else ' (router comparison found critical differences: relevant for flashing only)'),
                         f'Permanent flash: {flash}' + ('' if had_ref else ' (no reference data from the real router)') + (f' - review {warn} warning(s) first' if warn and flash == 'GO' else '')]
              with open(args.report, 'w') as f:
                  f.write('# MX2000 flash readiness\n\n' + '\n'.join('- **%s**' % v for v in verdict) + '\n\n')
                  for lvl in ('CRIT', 'WARN', 'INFO', 'OK'):
                      f.write(f'## {lvl} ({rep.count(lvl)})\n' + ''.join(f'- {m}\n' for l, m in rep.rows if l == lvl) + '\n')
              print('\n'.join(verdict))
              if args.summary:
                  with open(args.summary, 'a') as f:
                      f.write('\n'.join(f'- **READINESS** {v}' for v in verdict) + f'\n- **READINESS** critical={crit} warnings={warn}\n')
              sys.exit(2 if crit else 0)

          if __name__ == '__main__':
              main()
          CMPPY
          cat > mx2000-preflight.sh <<'PREFLIGHT'
          #!/bin/sh
          # mx2000-preflight.sh - READ-ONLY collector. Run it on the router that currently runs OpenWrt 25:
          #     scp mx2000-preflight.sh root@192.168.1.1:/tmp/ && ssh root@192.168.1.1 sh /tmp/mx2000-preflight.sh
          # It never writes to flash: it only reads /proc, /sys and the MTD devices (/dev/mtdNro) and writes into /tmp.
          # Output: /tmp/mx2000-preflight.tar.gz  containing
          #     ref/     (small, sanitized)  -> commit into your GitHub repo as ref/   (PRIVATE repo recommended)
          #     backup/  (raw partitions)    -> keep OFFLINE, never commit (contains MAC / serial / calibration)

          OUT=${OUT:-/tmp/mx2000-preflight}
          PROC_MTD=${PROC_MTD:-/proc/mtd}
          DRYRUN=${DRYRUN:-}
          rm -rf "$OUT"; mkdir -p "$OUT/ref/router" "$OUT/backup"
          log() { echo "[preflight] $*"; }
          run() { if [ -n "$DRYRUN" ]; then echo "+ $*"; else "$@"; fi; }

          log "1/7 identity"
          { echo "model: $(cat /proc/device-tree/model 2>/dev/null | tr -d '\000')"
            echo "compatible: $(cat /proc/device-tree/compatible 2>/dev/null | tr '\000' ' ')"
            echo "kernel: $(uname -r)"; cat /etc/openwrt_release 2>/dev/null; } > "$OUT/ref/identity.txt"
          cat "$PROC_MTD" > "$OUT/ref/mtd.txt" 2>/dev/null
          cat /proc/cmdline > "$OUT/ref/cmdline.txt" 2>/dev/null

          log "2/7 running device tree (U-Boot patched, contains MAC addresses: sanitize before sharing)"
          if [ -r /sys/firmware/fdt ]; then run cp /sys/firmware/fdt "$OUT/ref/running.dtb"; else log "WARNING: /sys/firmware/fdt missing"; fi

          log "3/7 U-Boot environment (read only) - sensitive values are masked"
          if command -v fw_printenv >/dev/null 2>&1; then
            fw_printenv 2>/dev/null | awk -F= '{ k=tolower($1);
                if (k ~ /serial|_sn|^sn|ssid|psk|pass|token|ethaddr|macaddr|^mac|wifi.*key|^key/) print $1"=<redacted>";
                else { gsub(/([0-9A-Fa-f][0-9A-Fa-f][:-]){5}[0-9A-Fa-f][0-9A-Fa-f]/, "XX:XX:XX:XX:XX:XX"); print } }' > "$OUT/ref/fw_printenv.txt"
          else log "WARNING: fw_printenv not installed (opkg/apk install uboot-envtools)"; fi

          log "4/7 the scripts that will perform the flash (these decide what happens, not ours)"
          for f in /lib/upgrade/platform.sh /lib/upgrade/linksys.sh /lib/upgrade/nand.sh; do
            [ -r "$f" ] && cp "$f" "$OUT/ref/router/$(basename "$f")"
          done
          [ -r /etc/init.d/bootcount ] && cp /etc/init.d/bootcount "$OUT/ref/router/bootcount"
          [ -r /etc/board.json ] && grep -v -iE 'macaddr|mac_address|ssid|key' /etc/board.json > "$OUT/ref/router/board.json"

          log "5/7 partition list"
          cat "$PROC_MTD" | tail -n +2 | while read dev size erase name; do
            dev=${dev%:}; name=$(echo "$name" | tr -d '"'); echo "$dev $size $erase $name"
          done > "$OUT/ref/mtd-parsed.txt"

          log "6/7 backup of the small critical partitions (bootloader, calibration, env, device info)"
          while read dev size erase name; do
            sz=$((0x$size))
            case "$name" in
              0:SBL1|0:MIBIB|0:QSEE|0:DEVCFG|0:CDT|0:APPSBL|0:APPSBLENV|0:ART|0:TRAINING|u_env|s_env|devinfo|sysdiag)
                src=/dev/${dev}ro; [ -e "$src" ] || src=/dev/$dev
                safe=$(echo "$name" | tr ':' '_')
                log "  $name ($sz bytes) <- $src"
                run dd if="$src" of="$OUT/backup/$safe.bin" bs=65536 2>/dev/null ;;
            esac
          done < "$OUT/ref/mtd-parsed.txt"
          ( cd "$OUT/backup" && sha256sum *.bin > SHA256SUMS 2>/dev/null )

          log "7/7 head of the kernel partitions (FIT header: load address, compression, config names)"
          while read dev size erase name; do
            case "$name" in kernel|alt_kernel)
              src=/dev/${dev}ro; [ -e "$src" ] || src=/dev/$dev
              magic=$(dd if="$src" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
              if [ "$magic" = "d00dfeed" ]; then
                b=$(dd if="$src" bs=1 skip=4 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
                total=$((0x$b)); [ "$total" -gt 33554432 ] && total=33554432
                cnt=$(( (total + 4095) / 4096 ))
                run dd if="$src" of="$OUT/ref/kernel-head-$name.bin" bs=4096 count=$cnt 2>/dev/null
                log "  $name: FIT of $total bytes saved"
              else log "  $name: no FIT magic at offset 0 (got '$magic'), skipped"; fi ;;
            esac
          done < "$OUT/ref/mtd-parsed.txt"
          # the partition that is actually booted (boot_part) is the reference; fall back to the first one
          if [ -f "$OUT/ref/kernel-head-kernel.bin" ]; then cp "$OUT/ref/kernel-head-kernel.bin" "$OUT/ref/kernel-head.bin"
          elif [ -f "$OUT/ref/kernel-head-alt_kernel.bin" ]; then cp "$OUT/ref/kernel-head-alt_kernel.bin" "$OUT/ref/kernel-head.bin"; fi

          ( cd "$OUT" && tar czf /tmp/mx2000-preflight.tar.gz ref backup )
          log "done: /tmp/mx2000-preflight.tar.gz"
          cat <<EOF

          Next steps (on your PC):
            scp root@<router>:/tmp/mx2000-preflight.tar.gz .      && tar xzf mx2000-preflight.tar.gz
            1) KEEP backup/ OFFLINE (it holds MAC, serial and the Wi-Fi calibration; a lost ART partition cannot be recreated).
            2) Make the device tree safe to publish, then put ref/ in your repo:
                 dtc -I dtb -O dts ref/running.dtb | sed -E '/mac-address|serial|ethaddr/d' > ref/running.dts && rm ref/running.dtb
            3) git add ref && git commit -m "reference data from the real MX2000" && git push   (prefer a PRIVATE repo)
            4) Re-run the workflow: step 18 compares the build with this data and prints GO / NO-GO.
          Optional FULL backup of both firmware slots, streamed over SSH (does not use router RAM):
            ssh root@<router> 'dd if=/dev/mtdXro bs=64k' > mtdX.bin     (X from ref/mtd.txt: kernel, rootfs, alt_kernel, alt_rootfs)
          EOF
          PREFLIGHT
          cat > mx2000-postmortem.sh <<'POSTMORTEM'
          #!/bin/sh
          # mx2000-postmortem.sh - READ-ONLY. Run it on the router AFTER a failed boot attempt, once it has fallen back to OpenWrt 25:
          #     scp mx2000-postmortem.sh root@192.168.1.1:/tmp/ && ssh root@192.168.1.1 sh /tmp/mx2000-postmortem.sh
          # It answers: (1) what is really stored in each kernel slot (FIT? a raw tar? erased?), (2) did the rootfs UBI land where it must,
          # (3) what did U-Boot count (bootcount/boot_part), (4) did a kernel log survive (pstore), (5) what does OpenWrt 25's kernel config look like.
          # Nothing is written to flash. Output: /tmp/mx2000-postmortem.tar.gz  -> unpack into your repo as ref/postmortem/
          OUT=${OUT:-/tmp/mx2000-postmortem}
          PROC_MTD=${PROC_MTD:-/proc/mtd}
          rm -rf "$OUT"; mkdir -p "$OUT/pstore"
          say() { echo "[postmortem] $*"; }
          mask_mac() { sed -E 's/([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}/XX:XX:XX:XX:XX:XX/g'; }

          cat "$PROC_MTD" > "$OUT/mtd.txt" 2>/dev/null
          cat /proc/cmdline | mask_mac > "$OUT/cmdline.txt" 2>/dev/null
          say "boot command line of the OpenWrt that is running now: $(cat "$OUT/cmdline.txt")"

          if command -v fw_printenv >/dev/null 2>&1; then
            fw_printenv 2>/dev/null | awk -F= '{ k=tolower($1);
                if (k ~ /serial|_sn|^sn|ssid|psk|pass|token|ethaddr|macaddr|^mac|wifi.*key|^key/) print $1"=<redacted>"; else print }' | mask_mac > "$OUT/fw_printenv.txt"
            say "U-Boot env: $(grep -E '^(boot_part|bootcount|bootlimit|auto_recovery|upgrade_available)=' "$OUT/fw_printenv.txt" | tr '\n' ' ')"
          else say "fw_printenv missing (install uboot-envtools)"; fi

          dmesg 2>/dev/null | head -n 400 | mask_mac > "$OUT/dmesg-boot.txt"
          [ -r /proc/config.gz ] && cp /proc/config.gz "$OUT/config.gz"
          if [ -d /sys/fs/pstore ] && [ -n "$(ls /sys/fs/pstore 2>/dev/null)" ]; then cp /sys/fs/pstore/* "$OUT/pstore/" 2>/dev/null; say "pstore: $(ls /sys/fs/pstore | tr '\n' ' ') (a kernel log from the crashed boot!)"; else say "pstore: empty"; fi

          kind() { # first bytes -> human readable
            case "$1" in
              d00dfeed*) echo "FIT image (OK)";;
              ffffffff*) echo "ERASED (nothing written here)";;
              00000000*) echo "zeros";;
              55424923*) echo "UBI image";;
              68737173*) echo "squashfs";;
              *) echo "unknown";;
            esac
          }
          tail -n +2 "$PROC_MTD" | while read dev size erase name; do
            dev=${dev%:}; name=$(echo "$name" | tr -d '"')
            src=/dev/${dev}ro; [ -e "$src" ] || src=/dev/$dev
            case "$name" in
              kernel|alt_kernel)
                dd if="$src" of="$OUT/$name-head.bin" bs=4096 count=1 2>/dev/null
                hex=$(od -An -tx1 -N8 "$OUT/$name-head.bin" | tr -d ' \n')
                # tar archives carry "ustar" at offset 257: that means a sysupgrade .bin was written raw
                if [ "$(dd if="$OUT/$name-head.bin" bs=1 skip=257 count=5 2>/dev/null)" = "ustar" ]; then k="TAR ARCHIVE (a sysupgrade .bin written raw: NOT bootable)"; else k=$(kind "$hex"); fi
                if [ "${hex%${hex#d00dfeed}}" = "d00dfeed" ]; then
                  b=$(od -An -tx1 -j4 -N4 "$OUT/$name-head.bin" | tr -d ' \n'); total=$((0x$b)); [ "$total" -gt 33554432 ] && total=33554432
                  dd if="$src" of="$OUT/$name-fit.bin" bs=4096 count=$(( (total + 4095) / 4096 )) 2>/dev/null
                  say "$name ($dev): $k, FIT $total bytes, sha256 $(sha256sum "$OUT/$name-fit.bin" | cut -c1-16)..."
                else say "$name ($dev): $k  first bytes $hex"; fi ;;
              rootfs|alt_rootfs)
                dd if="$src" of="$OUT/$name-head.bin" bs=4096 count=1 2>/dev/null
                hex=$(od -An -tx1 -N8 "$OUT/$name-head.bin" | tr -d ' \n'); say "$name ($dev): $(kind "$hex")  first bytes $hex" ;;
            esac
          done

          # ---- logs written by the 24.10 diagnostic build (/etc/mx2000-diag on its UBI overlay) ----
          # Attach the NON-running slot's UBI read-only-ish, mount its overlay read-only, copy the snapshots, detach.
          RUNNING=$(cat /sys/class/ubi/ubi*/mtd_num 2>/dev/null | tr '\n' ' ')
          if command -v ubiattach >/dev/null 2>&1; then
            tail -n +2 "$PROC_MTD" | while read dev size erase name; do
              dev=${dev%:}; name=$(echo "$name" | tr -d '"'); idx=${dev#mtd}
              case "$name" in rootfs|alt_rootfs) ;; *) continue;; esac
              case " $RUNNING " in *" $idx "*) say "$name: in use by the running system, skipped"; continue;; esac
              [ "$(od -An -tx1 -N4 /dev/${dev}ro 2>/dev/null | tr -d ' \n')" = "55424923" ] || { say "$name: no UBI, nothing to read"; continue; }
              if ubiattach -m "$idx" -d 9 >/dev/null 2>&1; then
                mkdir -p /tmp/pm_mnt
                if mount -t ubifs -o ro ubi9:rootfs_data /tmp/pm_mnt 2>/dev/null; then
                  if [ -d /tmp/pm_mnt/upper/etc/mx2000-diag ]; then
