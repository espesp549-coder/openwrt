          def variant_dtb(dtb_bytes, rx):
              root, _ = fc.fdt_parse(dtb_bytes)
              boot_cpuid = struct.unpack('>I', dtb_bytes[28:32])[0]
              off = []
              for path, n in walk(root):
                  if 'compatible' not in n['props'] or re.search(KEEP, path, re.I) or not re.search(rx, path, re.I): continue
