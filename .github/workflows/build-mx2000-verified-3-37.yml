          +func (c *Conn) TakeReadBuffer() (*buf.Buffer, bool) {
          +	if c.oneTimeReader != nil {
          +		return nil, false
          +	}
          +	b := c.readBuffer
          +	c.readBuffer = nil
          +	if b.IsEmpty() {
          +		b.Release()
          +		return nil, true
          +	}
          +	return b, true
          +}
