                  blk = m.group(1) if m else ''
                  mm = re.search(r'DEVICE_DTS_CONFIG\s*:?=\s*(\S+)', blk)
                  if not mm:  # inherited from a base definition (e.g. Device/linksys_ipq50xx_mx_base)
                      for base in re.findall(r'\$\(call Device/([\w\-]+)\)', blk) + re.findall(r'\$\$\(call Device/([\w\-]+)\)', blk):
                          mb = re.search(r'define Device/' + re.escape(base) + r'(.*?)endef', t, re.S)
                          mm = mm or (re.search(r'DEVICE_DTS_CONFIG\s*:?=\s*(\S+)', mb.group(1)) if mb else None)
                  want = mm.group(1) if mm else None
                  add('INFO' if want else 'WARN', f'recipe DEVICE_DTS_CONFIG = {want}')
              sys_fit = None
              if a.sysupgrade and os.path.exists(a.sysupgrade):
                  with tarfile.open(a.sysupgrade) as tf:
                      for m in tf.getmembers():
                          if m.isfile() and m.name.split('/')[-1] == 'kernel':
                              sys_fit = tf.extractfile(m).read()
                  if sys_fit is None: add('CRIT', 'sysupgrade.bin has no kernel member')
                  else:
                      tmp = a.report + '.kernel.itb'; open(tmp, 'wb').write(sys_fit)
                      r = check_fit(tmp, 'sysupgrade kernel', want, a.diag)
                      add('OK' if len(sys_fit) <= a.kernel_space else 'CRIT', f'sysupgrade kernel FIT {len(sys_fit)} bytes vs kernel space {a.kernel_space} bytes')
                      os.remove(tmp)
              check_factory(a.factory, sys_fit, a.kernel_space)
              if a.initramfs:
                  check_fit(a.initramfs, 'initramfs', want, a.diag, crit_on_cfg=False)
                  if os.path.exists(a.initramfs):
                      sz = os.path.getsize(a.initramfs)
                      add('INFO', f'initramfs {sz} bytes (RAM-boot image; only relevant if it is ever written to the kernel area of {a.kernel_space} bytes)')
              crit = sum(1 for l, _ in ROWS if l == 'CRIT')
              with open(a.report, 'w') as f:
                  f.write(f'# MX2000 image check: {"PASS" if not crit else f"{crit} CRITICAL"}\n\n')
                  for lvl in ('CRIT', 'WARN', 'INFO', 'OK'):
                      f.write(f'## {lvl}\n' + ''.join(f'- {m}\n' for l, m in ROWS if l == lvl) + '\n')
              if a.summary:
                  with open(a.summary, 'a') as f:
                      f.write(f'- **IMAGECHECK** {"all boot-chain checks passed" if not crit else f"{crit} CRITICAL boot-chain problem(s)"}\n')
                      for l, m in ROWS:
                          if l == 'CRIT': f.write(f'- **CRIT** {m}\n')
