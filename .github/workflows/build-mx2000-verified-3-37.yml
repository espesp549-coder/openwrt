                          # fetched by index when the node has no *-names, so those only count when the node does use names
                          # DMA is mandatory for flash/SPI/crypto engines; consoles (serial) fall back to PIO without it
                          dma_hard = kind == 'dma' and any(re.search(r'/drivers/(spi|mtd|crypto)/', f) for f in bi)
                          hard = dma_hard or kind == 'reg' or (kind != 'dma' and bool(have))
                          (problems if hard else notes).append(f'{kind}: driver asks {miss}, node has {names_prop}={sorted(have) or "none"}')
                  props = set(re.findall(PROP_RX, src))
                  missing_props = sorted(p for p in props if p not in n['props'] and not p.startswith('#'))
                  if missing_props: notes.append('properties read by the driver but absent here (may be optional): ' + ', '.join(missing_props[:15]))
                  rows.append({'path': path, 'compat': comps[0], 'files': [os.path.relpath(f, a.kernel_dir) for f in bi], 'problems': problems, 'notes': notes})
              # nodes of the working image that differ for built-in drivers
              ref_diff = {}
              if a.ref_dts and os.path.exists(a.ref_dts):
                  rroot = cm.parse_dts(open(a.ref_dts, errors='replace').read())
                  rnodes = {strings(n['props'].get('compatible', ''))[0]: n for _, n in cm.walk(rroot) if strings(n['props'].get('compatible', ''))}
                  for r in rows:
                      rn = rnodes.get(r['compat'])
                      on = dict(nodes)[r['path']]
                      if rn is None: ref_diff[r['path']] = 'node with this compatible not in the working DTB'; continue
                      keys = ('clock-names', 'dma-names', 'reset-names', 'interrupt-names', 'reg-names', 'dmas', 'clocks', 'reg')
                      d = [k for k in keys if (k in rn['props']) != (k in on['props']) or (k.endswith('names') and strings(rn['props'].get(k, '')) != strings(on['props'].get(k, '')))]
                      if d: ref_diff[r['path']] = 'differs from the working DTB in: ' + ', '.join(d)
              bad = [r for r in rows if r['problems']]
              with open(a.report, 'w') as f:
                  f.write(f'# Built-in drivers vs their DT nodes: {len(rows)} nodes, {len(bad)} with missing mandatory resources\n\n')
                  for r in sorted(rows, key=lambda r: (not r['problems'], r['path'] not in ref_diff, r['path'])):
                      f.write(f'## {r["path"]} ({r["compat"]}) -> {", ".join(r["files"])}\n')
                      for p in r['problems']: f.write(f'- **MISSING** {p}\n')
                      if r['path'] in ref_diff: f.write(f'- **VS OPENWRT 25** {ref_diff[r["path"]]}\n')
                      for p in r['notes']: f.write(f'- note: {p}\n')
                      f.write('\n')
              for r in rows:
                  if r['problems'] or r['path'] in ref_diff:
                      print(f'[{"MISSING" if r["problems"] else "DIFF   "}] {r["path"]} ({r["compat"]}): ' + ' | '.join(r['problems'] + ([ref_diff[r['path']]] if r['path'] in ref_diff else [])))
              if a.summary:
                  with open(a.summary, 'a') as f:
                      f.write(f'- **BINDCHECK** {len(rows)} built-in drivers checked against their DT nodes: {len(bad)} with missing mandatory resources, {len(ref_diff)} differ from OpenWrt 25 (21c-bindcheck.md)\n')
                      for r in rows:
                          if r['problems'] or r['path'] in ref_diff:
                              f.write(f'- **{"MISSING" if r["problems"] else "DIFF"}** {r["path"]} ({r["compat"]}): ' + ' | '.join(r['problems'] + ([ref_diff[r["path"]]] if r['path'] in ref_diff else []))[:400] + '\n')

          if __name__ == '__main__':
              main()
