          #!/usr/bin/env python3
          """fitcheck.py - open the built MX2000 images the way U-Boot and the kernel will see them.

          No external tools needed (own FDT parser, python lzma). Checks:
            * FIT structure: configurations, default config, the recipe's DEVICE_DTS_CONFIG is present
            * kernel image node: arch/os/type/compression/load/entry
            * kernel payload: decompresses, is an arm64 Image, right version, fits below the first reserved-memory region,
              contains the strings the boot chain depends on (bootargs-append support, ubiblock, squashfs)
            * the DTB inside the FIT: compatible linksys,mx2000, chosen/bootargs-append has root=/dev/ubiblock0_0
              (and panic=0 in a diagnostic build), the LED triggers of the diagnostic build
            * sysupgrade kernel == factory.bin kernel (same bytes), factory.bin has UBI at the rootfs offset
          Exit 2 when a CRITICAL check fails.
          """
          import argparse, lzma, os, re, struct, sys, tarfile, zlib

          ROWS = []
          def add(lvl, msg):
              ROWS.append((lvl, msg)); print(f'[{lvl}] {msg}')

          # ------------------------------------------------------------------ minimal FDT reader
          def fdt_parse(buf):
              if buf[:4] != b'\xd0\x0d\xfe\xed': raise ValueError('no FDT magic')
              total, off_struct, off_strings = struct.unpack('>III', buf[4:16])
              size_strings, size_struct = struct.unpack('>II', buf[32:40])
              strings = buf[off_strings:off_strings + size_strings]
              def sname(o): return strings[o:strings.index(b'\0', o)].decode()
              root = None; stack = []; p = off_struct
              while True:
                  tok = struct.unpack('>I', buf[p:p + 4])[0]; p += 4
                  if tok == 1:
                      e = buf.index(b'\0', p); name = buf[p:e].decode(errors='replace'); p = (e + 4) & ~3
                      node = {'name': name, 'props': {}, 'kids': {}}
                      if stack: stack[-1]['kids'][name] = node
                      else: root = node
                      stack.append(node)
                  elif tok == 2: stack.pop()
                  elif tok == 3:
                      ln, no = struct.unpack('>II', buf[p:p + 8]); p += 8
                      stack[-1]['props'][sname(no)] = buf[p:p + ln]; p = (p + ln + 3) & ~3
                  elif tok == 4: continue
                  elif tok == 9: break
                  else: raise ValueError(f'bad FDT token {tok}')
              return root, total

          def pstr(v): return v.rstrip(b'\0').decode(errors='replace') if v is not None else None
          def pstrs(v): return [x.decode(errors='replace') for x in v.rstrip(b'\0').split(b'\0')] if v else []
          def pu32(v): return struct.unpack('>I', v[:4])[0] if v and len(v) >= 4 else None
          def paddr(v):
              if not v: return None
              return struct.unpack('>Q', v[:8])[0] if len(v) >= 8 else struct.unpack('>I', v[:4])[0]

          def image_data(buf, total, node):
              pr = node['props']
              if 'data' in pr: return pr['data']
              size = pu32(pr.get('data-size'))
              if 'data-position' in pr: s = pu32(pr['data-position']); return buf[s:s + size]
              if 'data-offset' in pr: s = ((total + 3) & ~3) + pu32(pr['data-offset']); return buf[s:s + size]
              return None

          def decompress(comp, data):
              if comp in (None, 'none'): return data
              if comp == 'lzma': return lzma.decompress(data, format=lzma.FORMAT_ALONE)
              if comp == 'gzip': return zlib.decompress(data, 16 + zlib.MAX_WBITS)
              if comp == 'xz': return lzma.decompress(data)
              raise ValueError(f'unsupported compression {comp}')

          def walk(n, path=''):
              yield path or '/', n
              for k, c in n['kids'].items(): yield from walk(c, (path if path != '/' else '') + '/' + k)

          def first_reserved(dtb_root):
              rm = dtb_root['kids'].get('reserved-memory')
              if not rm: return None
              addrs = [paddr(c['props'].get('reg')) for c in rm['kids'].values() if c['props'].get('reg')]
              addrs = [a for a in addrs if a]
              return min(addrs) if addrs else None

          # ------------------------------------------------------------------ checks
          def check_fit(path, label, want_cfg, diag, crit_on_cfg=True):
              if not path or not os.path.exists(path):
                  add('WARN', f'{label}: file not found'); return None
              buf = open(path, 'rb').read()
              try: root, total = fdt_parse(buf)
              except Exception as e:
                  add('CRIT', f'{label}: not a FIT image ({e}); U-Boot cannot boot it'); return None
              add('OK', f'{label}: valid FIT, header size {total} bytes, file {len(buf)} bytes')
              images = root['kids'].get('images', {'kids': {}})['kids']
              confs = root['kids'].get('configurations', {'kids': {}, 'props': {}})
              names = list(confs['kids'])
              default = pstr(confs['props'].get('default'))
              add('INFO', f'{label}: configurations {names}, default={default}')
              if want_cfg:
                  lvl = 'OK' if want_cfg in names else ('CRIT' if crit_on_cfg else 'WARN')
                  add(lvl, f'{label}: recipe DEVICE_DTS_CONFIG "{want_cfg}" ' + ('present' if want_cfg in names else 'MISSING - Linksys U-Boot boots "#<config>" and resets immediately when it is absent'))
              if default not in names: add('CRIT', f'{label}: default configuration "{default}" does not exist')
              cfg = confs['kids'].get(want_cfg) or confs['kids'].get(default) or (next(iter(confs['kids'].values())) if names else None)
              if not cfg: add('CRIT', f'{label}: no configuration node'); return None
              kname, fname = pstr(cfg['props'].get('kernel')), pstrs(cfg['props'].get('fdt'))
              add('INFO', f'{label}: config uses kernel={kname} fdt={fname} ramdisk={pstr(cfg["props"].get("ramdisk"))}')
              kn = images.get(kname)
              if not kn: add('CRIT', f'{label}: kernel image node "{kname}" missing'); return None
              kp = kn['props']
              meta = {k: pstr(kp.get(k)) for k in ('arch', 'os', 'type', 'compression')}
              load, entry = paddr(kp.get('load')), paddr(kp.get('entry'))
              add('OK' if meta['arch'] == 'arm64' and meta['os'] == 'linux' and meta['type'] in ('kernel', 'kernel_noload') else 'CRIT',
                  f'{label}: kernel node arch={meta["arch"]} os={meta["os"]} type={meta["type"]} compression={meta["compression"]} load={hex(load or 0)} entry={hex(entry or 0)}')
              kdata = image_data(buf, total, kn)
              if kdata is None: add('CRIT', f'{label}: kernel data not found in FIT'); return None
              try: img = decompress(meta['compression'], kdata)
              except Exception as e:
                  add('CRIT', f'{label}: kernel payload does not decompress as {meta["compression"]} ({e}) - U-Boot would fail and reset'); return None
              if img[0x38:0x3c] != b'ARM\x64':
                  add('CRIT', f'{label}: payload is not an arm64 Image (magic {img[0x38:0x3c]!r})'); return None
              text_off, isize = struct.unpack('<QQ', img[8:24])
              add('OK', f'{label}: arm64 Image {len(img)} bytes (image_size field {isize}, text_offset {hex(text_off)})')
              m = re.search(rb'Linux version (\S+)', img)
              add('OK' if m and m.group(1).startswith(b'6.6.') else 'CRIT', f'{label}: kernel version string {m.group(1).decode() if m else "NOT FOUND"}')
              for s, lvl, why in ((b'bootargs-append', 'CRIT', 'without it root=/dev/ubiblock0_0 is never added to the U-Boot command line'),
                                  (b'ubiblock', 'CRIT', 'UBI block device for the squashfs rootfs'),
                                  (b'squashfs', 'CRIT', 'rootfs filesystem'),
                                  (b'ubifs', 'WARN', 'overlay (rootfs_data)'),
                                  (b'qcom,ipq9574-snand', 'WARN', 'SPI-NAND driver (built-in)'),
                                  (b'qcom,ipq5018-tlmm', 'WARN', 'pin controller (built-in)'),
                                  (b'qcom,gcc-ipq5018', 'WARN', 'clock controller (built-in)')):
                  add('OK' if s in img else lvl, f'{label}: kernel contains "{s.decode()}" ({why})')
              # DTB
              if not fname: add('CRIT', f'{label}: configuration has no fdt'); return None
              fn = images.get(fname[0])
              fdata = image_data(buf, total, fn) if fn else None
              try: droot, _ = fdt_parse(decompress(pstr(fn['props'].get('compression')), fdata))
              except Exception as e:
                  add('CRIT', f'{label}: embedded DTB unreadable ({e})'); return None
              comp = pstrs(droot['props'].get('compatible'))
              add('OK' if 'linksys,mx2000' in comp else 'CRIT', f'{label}: DTB compatible {comp}, model "{pstr(droot["props"].get("model"))}"')
              ch = droot['kids'].get('chosen', {'props': {}})['props']
              ba = pstr(ch.get('bootargs-append')) or ''
              add('OK' if 'root=/dev/ubiblock0_0' in ba else 'CRIT', f'{label}: chosen/bootargs-append = "{ba}"')
              if diag:
                  add('OK' if re.search(r'(^|\s)panic=0(\s|$)', ba) else 'CRIT', f'{label}: diagnostic build: panic=0 in bootargs-append (a kernel panic halts instead of rebooting)')
                  add('OK' if re.search(r'(^|\s)sysctl\.kernel\.panic_on_oops=0(\s|$)', ba) else 'WARN', f'{label}: diagnostic build: sysctl.kernel.panic_on_oops=0 (a driver oops after boot keeps the router up, oops readable with dmesg)')
                  leds = droot['kids'].get('leds', {'kids': {}})['kids']
                  trig = {n: pstr(l['props'].get('linux,default-trigger')) for n, l in leds.items()}
                  add('OK' if trig.get('blue') == 'heartbeat' else 'CRIT', f'{label}: diagnostic build: LED triggers {trig} (blue must be heartbeat)')
              rb = first_reserved(droot)
              if load and rb:
                  end = load + max(isize, len(img))
                  add('OK' if end < rb else 'CRIT', f'{label}: kernel occupies {hex(load)}-{hex(end)}, first reserved-memory region starts at {hex(rb)}')
              return kdata, buf

          def check_factory(path, sys_fit, kernel_space):
              if not path or not os.path.exists(path): add('WARN', 'factory.bin not found'); return
              fb = open(path, 'rb').read()
              if sys_fit is not None:
                  same = fb[:len(sys_fit)] == sys_fit
                  add('OK' if same else 'CRIT', 'factory.bin starts with exactly the same kernel FIT as sysupgrade.bin' if same else 'factory.bin kernel differs from sysupgrade.bin kernel')
              at = fb[kernel_space:kernel_space + 4]
              add('OK' if at == b'UBI#' else 'CRIT', f'factory.bin has a UBI image at {hex(kernel_space)} (start of the rootfs partition): got {at!r}')
              ubi = fb[kernel_space:]
              vols = set(re.findall(rb'(rootfs_data|rootfs|kernel)\x00', ubi[:4 * 131072]))
              add('OK' if b'rootfs' in vols else 'WARN', f'UBI volume names seen in the volume table: {sorted(v.decode() for v in vols)}')
              if ubi.find(b'hsqs') < 0: add('WARN', 'no squashfs magic found inside the UBI image')
              else: add('OK', 'squashfs found inside the UBI image')

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--sysupgrade'); ap.add_argument('--factory'); ap.add_argument('--initramfs')
              ap.add_argument('--recipe'); ap.add_argument('--diag', action='store_true')
              ap.add_argument('--kernel-space', type=lambda x: int(x, 0), default=0x800000)
              ap.add_argument('--report', default='20-fitcheck.md'); ap.add_argument('--summary', default='')
              a = ap.parse_args()
