                  ok = any(os.path.exists(os.path.join(R, 'lib/modules', k, m + '.ko')) for k in kv)
                  row('PASS' if ok else 'FAIL', f'image: kernel module {m}.ko ({kv[-1] if kv else "no lib/modules"})')
              md = os.path.join(R, 'etc/modules.d')
              autoload = [f for f in (os.listdir(md) if os.path.isdir(md) else []) if 'ath11k_ahb' in open(os.path.join(md, f), errors='replace').read().split()]
              if a.wifi_mode == 'on':
                  row('PASS' if autoload else 'FAIL', f'image: ath11k_ahb loads at boot (etc/modules.d: {autoload or "no file lists it"})')
              elif a.wifi_mode == 'manual':
                  row('PASS' if not autoload else 'FAIL', f'image: Wi-Fi manual mode, ath11k_ahb NOT loaded at boot (etc/modules.d: {autoload or "none"})')
              if a.frame_mode:
                  fm = [f for f in (os.listdir(md) if os.path.isdir(md) else [])
                        if any(l.split()[:1] == ['ath11k'] and 'frame_mode=2' in l.split() for l in open(os.path.join(md, f), errors='replace'))]
                  if a.frame_mode == 'ethernet':
                      row('PASS' if fm else 'FAIL', f'image: ath11k loads with frame_mode=2 (Wi-Fi Ethernet mode, etc/modules.d: {fm or "none"})')
                  else:
                      row('PASS' if not fm else 'WARN', f'image: ath11k native Wi-Fi frame mode (etc/modules.d frame_mode=2: {fm or "none"})')
              if a.diag == 'true':
                  for s, n in (('mx2000-diag-early', 'S01'), ('mx2000-diag', 'S99')):
                      ok = os.access(os.path.join(R, 'etc/init.d', s), os.X_OK) and os.path.islink(os.path.join(R, 'etc/rc.d', f'{n}{s}'))
                      row('PASS' if ok else 'FAIL', f'image: diagnostic log script {n}{s} installed and enabled')

              # 3) parity with the official OpenWrt 25.12.4 image
              if a.ref and os.path.exists(a.ref):
                  try:
                      ref_w = wifi_nodes(dtb_from_sysupgrade(a.ref))
                  except Exception as e:
                      row('WARN', f'25.12.4: cannot read its device tree: {e}'); ref_w = []
                  for w in on:
                      r = next((x for x in ref_w if x['chip'] == w['chip'] and x['addr'] == w['addr'] and enabled(x)), None)
                      if not r:
                          row('WARN', f'25.12.4: no enabled {w["chip"]} node at {w["addr"]:x} to compare with'); continue
                      diff = [f'{k}: ours {w[k]!r} / 25 {r[k]!r}' for k in ('memmode', 'variant', 'bdf', 'm3dump', 'caldb', 'userpd') if w[k] != r[k]]
                      row('PASS' if not diff else 'WARN', f'25.12.4: {w["chip"]} DT Wi-Fi properties ' + ('identical' if not diff else 'differ: ' + '; '.join(diff)))
              if a.ref_root and os.path.isdir(a.ref_root):
                  mo, mr = file_map(R, 'lib/firmware/ath11k'), file_map(a.ref_root, 'lib/firmware/ath11k')
                  if not mr:
                      row('WARN', '25.12.4: no lib/firmware/ath11k extracted from its rootfs')
                  else:
                      same = sorted(k for k in mo if k in mr and mo[k] == mr[k])
                      diff = sorted(k for k in mo if k in mr and mo[k] != mr[k])
                      only25 = sorted(k for k in mr if k not in mo); onlyours = sorted(k for k in mo if k not in mr)
                      row('PASS' if not diff else 'WARN', f'25.12.4: Wi-Fi firmware + board files: {len(same)} identical, {len(diff)} different {diff[:12]}')
                      row('PASS' if not only25 else 'WARN', f'25.12.4: files only in 25 ({len(only25)}): {only25[:12]}')
                      row('PASS' if not onlyours else 'WARN', f'25.12.4: files only in ours ({len(onlyours)}): {onlyours[:12]}')
                  rc = os.path.join(a.ref_root, 'etc/hotplug.d/firmware/11-ath11k-caldata')
                  if os.path.exists(rc) and ours_arms:
                      ref_arms = caldata_arms(open(rc, errors='replace').read())
                      for w in on:
                          key = (w['chip'], f'{w["addr"]:x}')
                          o, r = ours_arms.get(key), ref_arms.get(key)
                          if not r or not r[1]:
                              row('WARN', f'25.12.4: caldata has no linksys,mx2000 branch for {key}'); continue
                          same = o and norm_cmds(o[1]) == norm_cmds(r[1])
                          row('PASS' if same else 'WARN', f'25.12.4: caldata commands for {w["chip"]} ' + ('identical (partition label case aside)' if same else f'differ: ours {o[1] if o else None} / 25 {r[1]}'))

              # report
              nf = sum(1 for l, _ in ROWS if l == 'FAIL'); nw = sum(1 for l, _ in ROWS if l == 'WARN')
              with open(a.report, 'w') as f:
                  f.write(f'# Wi-Fi readiness of the final image: {nf} FAIL, {nw} WARN, {len(ROWS) - nf - nw} PASS\n\n')
                  for l, m in ROWS: f.write(f'- **{l}** {m}\n')
              if a.summary:
                  with open(a.summary, 'a') as f:
                      f.write(f'- **WIFI-READY** final image: {nf} FAIL, {nw} WARN, {len(ROWS) - nf - nw} PASS (17d-wifi-ready.md)\n')
                      for l, m in ROWS:
                          if l != 'PASS': f.write(f'- **{l}** WIFI-READY: {m[:400]}\n')
              return 0

          if __name__ == '__main__':
              sys.exit(main())
          WIFIREADY
          python3 -m py_compile wifiready.py
          cat > mx2000-diag.init <<'DIAGINIT'
          #!/bin/sh /etc/rc.common
          # Diagnostic build only: writes boot snapshots to /etc/mx2000-diag/ (the UBI overlay, survives reboots).
          # OpenWrt 25 can read them later from the other slot with mx2000-postmortem.sh, even if this build had no network.
          START=99

          snap() {
          	d=/etc/mx2000-diag; mkdir -p "$d"
          	f="$d/boot$(cat "$d/n" 2>/dev/null || echo 0)-$1.txt"
          	{
          		echo "=== $1  uptime: $(cat /proc/uptime)  date: $(date)"
          		echo "=== cmdline";  cat /proc/cmdline
          		echo "=== ip link";  ip -br link 2>&1
          		echo "=== ip addr";  ip -br addr 2>&1
          		echo "=== carrier";  for n in /sys/class/net/*; do echo "$(basename "$n") $(cat "$n/carrier" 2>/dev/null)"; done
          		echo "=== lsmod";    lsmod 2>&1
          		echo "=== mtd";      cat /proc/mtd
          		echo "=== ubi";      ubinfo -a 2>&1 | head -n 60
          		echo "=== mounts";   cat /proc/mounts
          		echo "=== leds";     for l in /sys/class/leds/*; do echo "$(basename "$l") $(cat "$l/trigger" 2>/dev/null | grep -o '\[[^]]*\]')"; done
          		echo "=== wifi";     iw dev 2>&1; ls /sys/class/ieee80211 2>&1
          		echo "=== processes"; ps w 2>&1 | head -n 60
          		echo "=== dmesg";    dmesg 2>&1
          		echo "=== logread";  logread 2>&1 | tail -n 400
          	} > "$f" 2>&1
          	sync
          }

          boot() {
          	d=/etc/mx2000-diag; mkdir -p "$d"
          	n=$(( $(cat "$d/n" 2>/dev/null || echo 0) + 1 )); echo "$n" > "$d/n"
          	# keep the last 5 boots only
          	ls "$d"/boot*-*.txt 2>/dev/null | sort -V | head -n -15 | xargs -r rm -f
          	( snap t0; sleep 30; snap t30; sleep 90; snap t120; sleep 300; snap t420 ) >/dev/null 2>&1 &
          }
          DIAGINIT
          cat > mx2000-diag-early.init <<'DIAGEARLY'
          #!/bin/sh /etc/rc.common
          # Diagnostic build only. Runs FIRST (before /etc/init.d/boot loads the kernel modules) and keeps writing the
          # kernel log to the UBI overlay every 2 s, so the last lines before a crash survive the reboot.
          # With "initcall_debug" on the command line the log shows "calling <module_init>" for every driver:
          # the last one without a matching "initcall ... returned" is the driver that killed the boot.
          START=01

          boot() {
          	d=/etc/mx2000-diag; mkdir -p "$d"
          	n=$(( $(cat "$d/n-early" 2>/dev/null || echo 0) + 1 )); echo "$n" > "$d/n-early"; sync
          	ls "$d"/early*.txt 2>/dev/null | sort -V | head -n -3 | xargs -r rm -f
          	(
          		i=0
          		while [ "$i" -lt 150 ]; do
          			{ echo "=== early boot $n, sample $i, uptime $(cut -d' ' -f1 /proc/uptime)"; lsmod 2>/dev/null | awk '{print $1}' | tr '\n' ' '; echo; dmesg | tail -n 3000; } > "$d/early$n.tmp" 2>&1
          			mv "$d/early$n.tmp" "$d/early$n.txt"; sync
          			i=$((i + 1)); sleep 2
          		done
          	) >/dev/null 2>&1 &
          }
          DIAGEARLY
          cat > bootcount-wrap.txt <<'BCWRAP'

          # --- mx2000 diagnostic build -------------------------------------------------
          # The original boot() was renamed to boot_real(). It tells U-Boot "this boot worked" (resets the boot counter).
          # Here it only runs once an Ethernet port has a link, 5 minutes after boot. Without a link the counter is NOT
          # reset, so power-cycling the router 4 times makes U-Boot fall back to the other slot (OpenWrt 25).
          boot() {
          	(
          		sleep 300
          		for n in /sys/class/net/*; do
          			case "$(basename "$n")" in lo|br-*|wlan*|phy*) continue;; esac
          			if [ "$(cat "$n/carrier" 2>/dev/null)" = "1" ]; then
          				logger -t mx2000-diag "link on $(basename "$n"): marking boot as good"
          				boot_real
          				exit 0
          			fi
          		done
          		logger -t mx2000-diag "no ethernet link after 5 min: boot counter NOT reset (power-cycle 4x to return to the other slot)"
          	) &
          }
          BCWRAP

          echo "IMG=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          echo "runner image: ${ImageVersion:-unknown}"
          nproc; free -h

      - name: "0b. Checkout own repo (ref/ = data collected from the real router, optional)"
        uses: actions/checkout@v5
        with:
          path: selfrepo
          sparse-checkout: |
            ref
          fetch-depth: 1

      - name: "1. Free disk space (and require enough)"
        run: |
          source ./ci-lib.sh
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h /
          AVAIL=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [ "$AVAIL" -ge 20 ]; then pass "disk free: ${AVAIL}G"; else fail "only ${AVAIL}G free on / (need 20G)"; fi

      - name: "2. Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl xsltproc libelf-dev \
            libfuse-dev swig cmake zstd device-tree-compiler quilt

      # ------------------------------------------------------------------
      - name: "3. Clone 24.10.8 and verify source"
        run: |
          source ./ci-lib.sh
          git clone --filter=blob:none https://github.com/openwrt/openwrt openwrt
          cd openwrt
          git config user.email "ci@example.com"
          git config user.name "ci"
          git checkout -b mx2000 "$TAG"
          check "tree is exactly tag $TAG" test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          check "BASE commit exists in main history" git cat-file -e "$BASE^{commit}"
          FORK=$(git merge-base "$TAG" "$BASE")
          echo "FORK=$FORK" >> "$GITHUB_ENV"
          check "qualcommax uses kernel 6.6 on $TAG" grep -q 'KERNEL_PATCHVER:=6.6' target/linux/qualcommax/Makefile
          check "qualcommax uses kernel 6.6 on BASE" sh -c "git show $BASE:target/linux/qualcommax/Makefile | grep -q 'KERNEL_PATCHVER:=6.6'"
          {
            echo "tag: $TAG ($(git rev-parse HEAD))"
            echo "base: $BASE"
            echo "fork point: $FORK"
            echo "kernel: $(grep 'LINUX_VERSION-6.6' include/kernel-6.6)"
            echo "runner image: $IMG"
            date -u
          } | tee ../out/00-build-info.txt
          # git clone يعطي كل الملفات وقت "الآن"، فيعتبر make إن المصدر أحدث من الـ stamps المسترجعة ويعيد بناء كل شي.
          # نخلي كل ملفات المصدر قديمة (2020) والملفات الي تتعدل بالخطوات 5-7 تاخذ وقت جديد وتنبني من جديد فقط.
          git ls-files -z | xargs -0 touch -h -d '2020-01-01 00:00:00'

      - name: "4a. Restore base cache (host tools + toolchain + downloads)"
        id: cacheA
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
            openwrt/dl
          key: mx2000-base-${{ env.TAG }}-${{ env.IMG }}-v3

      # ------------------------------------------------------------------
      - name: "5. Overlay ipq50xx support from main and verify it"
        run: |
          source ./ci-lib.sh
          cd openwrt
          for d in target/linux/qualcommax package/firmware/ipq-wifi package/firmware/ath11k-firmware; do
            git rm -r -q --ignore-unmatch "$d"
            git checkout "$BASE" -- "$d"
          done
          # ملف uboot-envtools خارج مجلد qualcommax: بدونه fw_setenv ما يعرف أقسام الجهاز
          # main نقل المجلد لاحقاً (package/boot/uboot-tools/uboot-envtools)؛ نبحث عن الملف بـ BASE ونحطه بمسار 24.10
          SRC=$(git ls-tree -r --name-only "$BASE" -- package/boot | grep -E '/files/qualcommax_ipq50xx$' | head -n1)
          check "qualcommax_ipq50xx found in BASE (got: $SRC)" test -n "$SRC"
          mkdir -p package/boot/uboot-envtools/files
          git show "$BASE:$SRC" > package/boot/uboot-envtools/files/qualcommax_ipq50xx
          # main نقل هذا الخيار للـ generic config؛ بـ 24.10 لازم نرجعه
          echo "CONFIG_NET_SWITCHDEV=y" >> target/linux/qualcommax/config-6.6

          Q=target/linux/qualcommax
          check "ipq50xx target.mk present" test -f $Q/ipq50xx/target.mk
          check "ipq50xx in SUBTARGETS" grep -qE '^SUBTARGETS:=.*ipq50xx' $Q/Makefile
          check "kernel still 6.6 in overlaid Makefile" grep -q 'KERNEL_PATCHVER:=6.6' $Q/Makefile
          check "MX2000 defined in ipq50xx.mk" grep -q 'linksys_mx2000' $Q/image/ipq50xx.mk
          check "MX2000 dts present" test -f $Q/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          check "ipq-wifi knows MX2000" grep -q 'linksys_mx2000' package/firmware/ipq-wifi/Makefile
          check "ath11k-firmware has IPQ5018" grep -qi 'ipq5018' package/firmware/ath11k-firmware/Makefile
          check "ath11k-firmware has QCN6122" grep -qi 'qcn6122' package/firmware/ath11k-firmware/Makefile
          check "uboot-envtools file for ipq50xx present" test -s package/boot/uboot-envtools/files/qualcommax_ipq50xx
          check "NET_SWITCHDEV set exactly once" test "$(grep -c '^CONFIG_NET_SWITCHDEV=y' $Q/config-6.6)" = 1
          check "no NET_SWITCHDEV 'is not set' conflict" sh -c "! grep -q '^# CONFIG_NET_SWITCHDEV is not set' $Q/config-6.6"
          soft "24.10 itself had NET_SWITCHDEV=y for qualcommax (we restored it)" sh -c "git show $TAG:$Q/config-6.6 | grep -qx CONFIG_NET_SWITCHDEV=y"

          # الدوال اللي يستخدمها ملف uboot-envtools لازم تكون معرّفة بمكتبة 24.10
          for fn in $(grep -oE 'ubootenv_[a-z_]+' package/boot/uboot-envtools/files/qualcommax_ipq50xx | sort -u); do
            check "uboot-envtools lib defines $fn" grep -rqE "^${fn}\(\)" package/boot/uboot-envtools/files/
          done
          ls package/boot/uboot-envtools/files/ | tee ../out/05-uboot-envtools-files.txt
          grep -n 'SUBTARGET\|BOARD' package/boot/uboot-envtools/Makefile | tee ../out/05-uboot-envtools-makefile-refs.txt || true

          # سكربتات مساعدة تستدعيها ملفات image بالـ qualcommax لازم تكون موجودة
          for s in $(grep -rhoE '\$\(TOPDIR\)/scripts/[A-Za-z0-9_.-]+' $Q/image/ | sort -u | sed 's#\$(TOPDIR)/##'); do
            check "image helper $s exists" test -e "$s"
          done

          git add -A
          git commit -q -m "overlay ipq50xx support from main@$BASE"

      - name: "6. Apply the generic / kernel-package commits and verify"
        run: |
          source ./ci-lib.sh
          cd openwrt
          for c in f76b846eea 4b6886d9fd 24db75d242 89dd393d8c; do
            git format-patch -1 --stdout "$c" -- target/linux/generic package/kernel > /tmp/p.patch || true
            if [ -s /tmp/p.patch ]; then
              if git am -3 /tmp/p.patch; then pass "applied $c"
              else git am --abort || true; fail "git am failed for $c"; fi
            else
              echo "nothing outside qualcommax in $c"
            fi
          done
          check "mac80211 QCN6122 patches present (>=6)" test "$(find package/kernel/mac80211/patches -name '*QCN6122*' | wc -l)" -ge 6
          check "SNAND/QPIC backports present in generic" test "$(find target/linux/generic -iname '*qpic*' | wc -l)" -ge 1

          # تقرير: ملفات خارج qualcommax لمس بها commits الـ ipq50xx (للمراجعة اليدوية)
          git log --format='== %h %s' --name-only -i -E \
            --grep='ipq50xx|ipq5018|qcn6122|mx2000|mx5500|spnmx56|mr5500|snand|qpic' "$FORK..$BASE" \
            | awk 'NF' | awk '/^== /{c=$0; next} {print c " :: " $0}' \
            | grep -v -E ' :: (target/linux/qualcommax/|package/firmware/(ipq-wifi|ath11k-firmware)/)' \
            > ../out/06-outside-files-audit.txt || true
          # لكل ملف بالتقرير: هل نسختنا مطابقة لـ BASE؟ المطابق مغطّى، والباقي يتصنّف (غير لازم لهذا الجهاز / ناقص فعلاً)
          : > ../out/06-audit-missing.txt; : > ../out/06-audit-notneeded.txt; COVERED=0
          sed 's/.* :: //' ../out/06-outside-files-audit.txt | sort -u | while read -r f; do
            case "$f" in
              target/linux/generic/*-6.12/*|target/linux/qualcommbe/*) echo "$f (other kernel/target)" >> ../out/06-audit-notneeded.txt; continue;;
              include/image-commands.mk|scripts/mkits-qsdk-ipq-image.sh) echo "$f (GL.iNet qsdk images only; FIT tools are checked in step 6e/20)" >> ../out/06-audit-notneeded.txt; continue;;
              package/firmware/linux-firmware/*|package/network/utils/iwinfo/*|package/base-files/files/lib/upgrade/fwtool.sh) echo "$f (not used to boot MX2000)" >> ../out/06-audit-notneeded.txt; continue;;
              package/boot/uboot-tools/uboot-envtools/files/qualcommax_ipq50xx) f=package/boot/uboot-envtools/files/qualcommax_ipq50xx;;
            esac
            if ! git cat-file -e "$BASE:$f" 2>/dev/null; then echo "$f (deleted/renamed later in main)" >> ../out/06-audit-notneeded.txt; continue; fi
            if [ -f "$f" ] && git show "$BASE:$f" | cmp -s - "$f"; then :; else echo "$f" >> ../out/06-audit-missing.txt; fi
          done
          NM=$(wc -l < ../out/06-audit-missing.txt); NN=$(wc -l < ../out/06-audit-notneeded.txt)
          echo "--- not needed:"; cat ../out/06-audit-notneeded.txt; echo "--- missing/different (fixed in 6b0/6c/6d when listed there):"; cat ../out/06-audit-missing.txt
          echo "- **INFO** outside-qualcommax audit: $NN not needed for MX2000, $NM missing/different before steps 6b0-6e (see 06-audit-*.txt)" >> "$SUMMARY"

      - name: "6b0. ath11k: add the ipq50xx-related patches main has and 24.10 lacks (201 bdf/caldb-addr, 932 reo poll)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          A=package/kernel/mac80211/patches/ath11k
          grep -oE "$A/[^ ]+\.patch" ../out/06-outside-files-audit.txt | sort -u | while read -r f; do
            if [ ! -f "$f" ] && git cat-file -e "$BASE:$f" 2>/dev/null; then git show "$BASE:$f" > "$f"; echo "added $f"; fi
          done | tee ../out/06b0-ath11k-added.txt
          check "ath11k 201 (bdf-addr / caldb-addr from DT) present" sh -c "ls $A/201-*bdf-addr* >/dev/null 2>&1"
          check "ath11k 932 (IPQ5018 reo status polling) present" sh -c "ls $A/932-* >/dev/null 2>&1"
          git add -A && git commit -q -m "ath11k: ipq50xx patches from main" || true

      - name: "6b1. ath11k Wi-Fi fixes: 910 from main (CE remap on arm64) + 990 from OpenWrt 25.12 (no cold-boot calibration, CALDB 0x500000)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          A=package/kernel/mac80211/patches/ath11k
          # 910: جزء من نفس سلسلة دعم IPQ5018 بالـ main (انضاف بعد QCN6122 بـ 39 ثانية) وخطوة 6b0 ما لقطته لأن رسالته ما بيها ipq5018
          # بدونه: قراءة سجلات CE على arm64 تروح لعنوان غلط (Data Abort) لما يكون ioremap مال CE أوطأ من الذاكرة الرئيسية
          F910=$A/910-ath11k-fix-remapped-ce-accessing-issue-on-64bit-OS.patch
          check "no other 910-* ath11k patch in 24.10" sh -c "! ls $A/910-* >/dev/null 2>&1"
          git show "$BASE:$F910" > "$F910"
          check "910 (CE remap fix for IPQ5018 on arm64) added from main" grep -q 'ATH11K_REG_TYPE_CE' "$F910"
          # لو فشل بناء mac80211، خطوة 14 تشيل هذا ويا باتشات 6b0 وتعيد (990 يطبق بدونهم، مجرّب)
          echo "added $F910" >> ../out/06b0-ath11k-added.txt
          # يطبق آخر شي (990) لأن عقدة QCN6122 تنضاف بباتش 920
          cat > $A/990-mx2000-ath11k-ipq5018-qcn6122-coldboot-caldb.patch <<'PATCH990'
          From: George Moussalem (OpenWrt 25.12 fixes, rebased for 24.10)
          Subject: [PATCH] wifi: ath11k: disable coldboot calibration for IPQ5018 and QCN6122, raise CALDB size

          Cold-boot calibration crashes the IPQ5018 Q6 firmware (platform.c:717 assertion);
          QCN6122 firmware asks for a 0x500000 CALDB ("qmi mem size is low to load caldata").
          Same changes as OpenWrt 25.12 patches 907 and 920.
          ---
          --- a/drivers/net/wireless/ath/ath11k/core.c
          +++ b/drivers/net/wireless/ath/ath11k/core.c
          @@ -688,14 +688,14 @@
           		.num_peers = 512,
           		.supports_regdb = false,
           		.idle_ps = false,
           		.supports_suspend = false,
           		.hal_params = &ath11k_hw_hal_params_ipq8074,
           		.single_pdev_only = false,
          -		.coldboot_cal_mm = true,
          -		.coldboot_cal_ftm = true,
          +		.coldboot_cal_mm = false,
          +		.coldboot_cal_ftm = false,
           		.cbcal_restart_fw = true,
           		.fix_l1ss = true,
           		.supports_dynamic_smps_6ghz = false,
           		.alloc_cacheable_memory = true,
           		.supports_rssi_stats = false,
           		.fw_wmi_diag_event = false,
          @@ -851,14 +851,14 @@
           		.single_pdev_only = false,
           		.rxdma1_enable = true,
           		.num_rxdma_per_pdev = RXDMA_PER_PDEV_5018,
           		.rx_mac_buf_ring = false,
           		.vdev_start_delay = false,
           		.htt_peer_map_v2 = true,
          -		.coldboot_cal_mm = true,
          -		.coldboot_cal_ftm = true,
          +		.coldboot_cal_mm = false,
          +		.coldboot_cal_ftm = false,
           		.cbcal_restart_fw = true,
           		.fix_l1ss = true,
           		.alloc_cacheable_memory = true,
           		.m3_fw_support = false,
           		.fixed_bdf_addr = true,
           		.fixed_mem_region = true,
          --- a/drivers/net/wireless/ath/ath11k/qmi.h
          +++ b/drivers/net/wireless/ath/ath11k/qmi.h
          @@ -23,13 +23,13 @@
           #define ATH11K_QMI_WLFW_SERVICE_INS_ID_V01_QCN9074	0x07
           #define ATH11K_QMI_WLFW_SERVICE_INS_ID_V01_WCN6750	0x03
           #define ATH11K_QMI_WLFW_SERVICE_INS_ID_V01_QCN6122	0x40
           #define ATH11K_QMI_WLANFW_MAX_TIMESTAMP_LEN_V01	32
           #define ATH11K_QMI_RESP_LEN_MAX			8192
           #define ATH11K_QMI_WLANFW_MAX_NUM_MEM_SEG_V01	52
          -#define ATH11K_QMI_CALDB_SIZE			0x480000
          +#define ATH11K_QMI_CALDB_SIZE			0x500000
           #define ATH11K_QMI_BDF_EXT_STR_LENGTH		0x20
           #define ATH11K_QMI_FW_MEM_REQ_SEGMENT_CNT	5
           
           #define QMI_WLFW_REQUEST_MEM_IND_V01		0x0035
           #define QMI_WLFW_FW_MEM_READY_IND_V01		0x0037
           #define QMI_WLFW_COLD_BOOT_CAL_DONE_IND_V01	0x003E
          PATCH990
          check "990 Wi-Fi fix patch written" grep -q 'ATH11K_QMI_CALDB_SIZE.*0x500000' $A/990-mx2000-ath11k-ipq5018-qcn6122-coldboot-caldb.patch
          check "990 sorts after the QCN6122 patches" test "$(ls $A | tail -n1)" = 990-mx2000-ath11k-ipq5018-qcn6122-coldboot-caldb.patch
          git add -A && git commit -q -m "ath11k: 910 CE remap fix from main; disable coldboot cal for ipq5018/qcn6122, CALDB 0x500000 (from 25.12)"
          echo "- **WIFI FIX** ath11k 910 (CE remap on arm64, from main) + 990: cold-boot calibration off for IPQ5018 + QCN6122, CALDB 0x500000 (OpenWrt commits cf715a2305, aefdbf0edc)" >> "$SUMMARY"

      - name: "6b2. ath11k RAM: smaller DP rings (same values as the IPQ5018 + QCN6122 MR80X v2 OpenWrt port)"
        if: ${{ inputs.wifi_lowmem != false }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          # Per radio ath11k pre-allocates 4096 RX + 4096 monitor + 1024 status buffers (~2.5 KB each) and a 32768-entry
          # TX completion ring with a host copy. Monitor buffers are only used by a monitor interface (the IPQ5018 radio
          # cannot even run one). Applies on top of every ath11k patch, also after the step-14 fallback (dp.h is only
          # touched by 932, far from these lines). DP_RXDMA_REFILL_RING_SIZE stays: it is the buffer size sent to firmware.
          A=package/kernel/mac80211/patches/ath11k
          check "ath11k patch directory present" test -d $A
          cat > $A/991-mx2000-ath11k-smaller-dp-rings.patch <<'PATCH991'
          From: MX2000 build <ci@local>
          Subject: [PATCH] wifi: ath11k: smaller DP rings for the 512 MB MX2000

          Per radio ath11k keeps 4096 RX buffers, 4096 monitor buffers (monitor
          mode only: the IPQ5018 radio does not even support it) and a 32768-entry
          TX completion ring (plus a host copy of it). Same values as the
          IPQ5018 + QCN6122 Mercusys MR80X v2 OpenWrt port: about 37 MB less RAM.
          DP_RXDMA_REFILL_RING_SIZE stays: it is the buffer size told to firmware.
          ---
          --- a/drivers/net/wireless/ath/ath11k/dp.h
          +++ b/drivers/net/wireless/ath/ath11k/dp.h
          @@ -209,7 +209,7 @@
           #define DP_WBM_RELEASE_RING_SIZE	64
           #define DP_TCL_DATA_RING_SIZE		512
           #define DP_TCL_DATA_RING_SIZE_WCN6750	2048
          -#define DP_TX_COMP_RING_SIZE		32768
          +#define DP_TX_COMP_RING_SIZE		8192
           #define DP_TX_IDR_SIZE			DP_TX_COMP_RING_SIZE
           #define DP_TCL_CMD_RING_SIZE		32
           #define DP_TCL_STATUS_RING_SIZE		32
          @@ -220,12 +220,12 @@
           #define DP_REO_EXCEPTION_RING_SIZE	128
           #define DP_REO_CMD_RING_SIZE		256
           #define DP_REO_STATUS_RING_SIZE		2048
          -#define DP_RXDMA_BUF_RING_SIZE		4096
          +#define DP_RXDMA_BUF_RING_SIZE		2048
           #define DP_RXDMA_REFILL_RING_SIZE	2048
           #define DP_RXDMA_ERR_DST_RING_SIZE	1024
           #define DP_RXDMA_MON_STATUS_RING_SIZE	1024
          -#define DP_RXDMA_MONITOR_BUF_RING_SIZE	4096
          -#define DP_RXDMA_MONITOR_DST_RING_SIZE	2048
          +#define DP_RXDMA_MONITOR_BUF_RING_SIZE	128
          +#define DP_RXDMA_MONITOR_DST_RING_SIZE	128
           #define DP_RXDMA_MONITOR_DESC_RING_SIZE	4096
           
           #define DP_RX_RELEASE_RING_NUM	3
          PATCH991
          P=$A/991-mx2000-ath11k-smaller-dp-rings.patch
          for kv in 'DP_TX_COMP_RING_SIZE 8192' 'DP_RXDMA_BUF_RING_SIZE 2048' 'DP_RXDMA_MONITOR_BUF_RING_SIZE 128' 'DP_RXDMA_MONITOR_DST_RING_SIZE 128'; do
            set -- $kv
            check "991 RAM patch sets $1 = $2" grep -qE "^\+#define $1[[:space:]]+$2\$" $P
          done
          check "991 RAM patch leaves DP_RXDMA_REFILL_RING_SIZE alone" sh -c "! grep -q '^[-+]#define DP_RXDMA_REFILL_RING_SIZE' $P"
          check "991 sorts after every other ath11k patch" test "$(ls $A | tail -n1)" = 991-mx2000-ath11k-smaller-dp-rings.patch
          git add -A && git commit -q -m "ath11k: smaller DP rings for the 512 MB MX2000"
          echo "- **RAM** ath11k rings: monitor 4096->128, RX 4096->2048, TX completion 32768->8192 (about 37 MB less RAM)" >> "$SUMMARY"

      - name: "6b. Make ath11k m3-dump patch self-contained (addr undeclared on 24.10)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          python3 - 'package/kernel/mac80211/patches/ath11k/931-*m3-dump*.patch' <<'PYM3'
          import re, sys, glob
          fs = glob.glob(sys.argv[1])
          if len(fs) != 1: sys.exit("ERROR: expected exactly one m3-dump patch, got %s" % fs)
          p = fs[0]; L = open(p).read().split("\n")
          if any("m3_dump_addr" in l for l in L): print("already fixed"); sys.exit(0)
          ci = next((i for i,l in enumerate(L) if re.match(r'^\+\s*case M3_DUMP_REGION_TYPE:\s*$', l)), None)
          if ci is None: sys.exit("ERROR: case M3_DUMP_REGION_TYPE not found")
          bi = next((i for i in range(ci+1, len(L)) if re.match(r'^\+\s*break;\s*$', L[i]) and not L[i+1].startswith('+')), None)
          if bi is None: sys.exit("ERROR: closing break not found")
          ind = re.match(r'^\+(\s*)', L[ci]).group(1)
          for i in range(ci+1, bi+1):
              L[i] = re.sub(r'(?<![-\w])addr\b', 'm3_dump_addr', L[i])
          L.insert(bi+1, "+" + ind + "}")
          L[ci] = "+" + ind + "case M3_DUMP_REGION_TYPE: {"
          L.insert(ci+1, "+" + ind + "\tu32 m3_dump_addr;")
          hh = [i for i,l in enumerate(L) if l.startswith("@@ ")]
          if len(hh) != 1: sys.exit("ERROR: expected 1 hunk, got %d" % len(hh))
          m = re.match(r'^@@ -(\d+),(\d+) \+(\d+),(\d+) @@(.*)$', L[hh[0]])
          L[hh[0]] = "@@ -%s,%s +%s,%d @@%s" % (m.group(1), m.group(2), m.group(3), int(m.group(4)) + 2, m.group(5))
          s = "\n".join(L); open(p, "w").write(s)
          assert s.count("m3_dump_addr") == 3, s.count("m3_dump_addr")
          assert '"qcom,m3-dump-addr"' in s
          print("fixed", p)
          PYM3
          check "931 patch no longer uses undeclared addr" sh -c "! grep -qE '&addr\)' package/kernel/mac80211/patches/ath11k/931-*m3-dump*.patch"
          git add -A && git commit -q -m "fix 931 m3-dump patch: declare its own variable"

      - name: "6c. qca-ssdk + qca-nss-dp: take the ipq50xx-capable versions from BASE"
        run: |
          source ./ci-lib.sh
          cd openwrt
          # 24.10 ما بيه دعم ipq50xx بهاي الحزم (Makefile بدون CHIP_TYPE=MP، و nss-dp بدون إصلاح qcom_scm وغيره).
          # BASE يستخدم نفس الكيرنل 6.6، فنسحب الحزمتين كاملتين (Makefile + patches) حتى تبقى النسخ متوافقة مع بعض.
          for pkg in qca-ssdk qca-nss-dp; do
            D=$(git ls-tree -r --name-only "$BASE" -- package/kernel | grep -E "/$pkg/Makefile$" | head -n1 | xargs -r dirname)
            check "$pkg exists in BASE (got: $D)" test -n "$D"
            echo "== $pkg: 24.10 vs BASE (diffstat) =="
            git diff --stat "$TAG" "$BASE" -- "package/kernel/$pkg" | tail -n 15 || true
            git rm -r -q --ignore-unmatch "package/kernel/$pkg"
            git checkout "$BASE" -- "$D"
            if [ "$D" != "package/kernel/$pkg" ]; then mkdir -p package/kernel && git mv "$D" "package/kernel/$pkg"; fi
            grep -E '^PKG_(SOURCE_DATE|SOURCE_VERSION|VERSION|RELEASE)' "package/kernel/$pkg/Makefile" | tee -a ../out/06c-versions.txt
          done
          D=package/kernel
          check "qca-ssdk Makefile sets CHIP_TYPE=MP for ipq50xx" grep -q 'CHIP_TYPE=MP' $D/qca-ssdk/Makefile
          check "qca-nss-dp source is the 2025 version from main (has the qcom_scm fix in the source itself)" grep -qE '^PKG_SOURCE_DATE:=2025' $D/qca-nss-dp/Makefile
          git add -A && git commit -q -m "qca-ssdk, qca-nss-dp: versions from BASE (ipq50xx support)"

      - name: "6d. Sync QPIC SPI-NAND + NVMEM ascii-env generic patches from BASE"
        run: |
          source ./ci-lib.sh
          cd openwrt
          # التقرير بين إن CONFIG_SPI_QPIC_SNAND و CONFIG_NVMEM_LAYOUT_ASCII_ENV غير معرّفين بالكيرنل:
          #  - SNAND: بدونه الكيرنل ما يشوف الـ NAND (qcom,ipq9574-snand)
          #  - ascii-env: الـ DTS يجيب MAC الإيثرنت من قسم devinfo بهذا الـ layout
          # كل باتشات هذي الميزتين بملفات generic بالـ BASE، فننسخها كما هي (ونحذف النسخ القديمة المتبدلة الاسم).
          RX='(qpic|snand|rawnand-qcom|nand-qcom|ascii-env|nvmem-core-generalize-mac-base|mtk-bmt)'  # mtk-bmt: باتش hack يعدّل نفس Makefile حق mtd/nand، لازم نسخته تطابق ترتيب الباتشات بالـ BASE
          N=0
          for k in backport pending hack; do
            d="target/linux/generic/$k-6.6"
            git ls-tree -r --name-only "$BASE" -- "$d/" | grep -iE "/[^/]*$RX[^/]*\.patch$" > /tmp/base-$k.txt || true
            git ls-files -- "$d/" | grep -iE "/[^/]*$RX[^/]*\.patch$" > /tmp/ours-$k.txt || true
            # ملفات عندنا مو موجودة بالـ BASE (انحذفت/تغيّر اسمها) -> نحذفها
            comm -13 <(sort /tmp/base-$k.txt) <(sort /tmp/ours-$k.txt) | while read -r f; do git rm -q -f "$f"; echo "removed (not in BASE): $f"; done
            while read -r f; do
              mkdir -p "$(dirname "$f")"
              git show "$BASE:$f" > "$f"
              N=$((N+1))
            done < /tmp/base-$k.txt
          done
          # أي باتش generic بالـ BASE يعرّف أو يستخدم nvmem_layout_parse_mac_base (حتى لو تغيّر اسمه أو مكانه)
          git grep -l 'nvmem_layout_parse_mac_base' "$BASE" -- 'target/linux/generic/' 2>/dev/null | sed "s#^$BASE:##" | grep -E -- '-6\.6/' > /tmp/base-macbase.txt || true
          echo "--- patches mentioning nvmem_layout_parse_mac_base in BASE ---"; cat /tmp/base-macbase.txt
          while read -r f; do
            mkdir -p "$(dirname "$f")"; git show "$BASE:$f" > "$f"; N=$((N+1))
          done < /tmp/base-macbase.txt
          cat /tmp/base-backport.txt /tmp/base-pending.txt /tmp/base-hack.txt /tmp/base-macbase.txt > ../out/06d-synced-files.txt 2>/dev/null || true
          git add -A
          git diff --cached --stat | tail -n 40 | tee ../out/06d-generic-sync.txt
          check "synced at least 8 qpic/nvmem generic patches (got $N)" test "$N" -ge 8
          check "SNAND driver patch present" sh -c "ls target/linux/generic/*-6.6/ | grep -qiE 'spi-qpic.*(add-driver|driver)'"
          check "ascii-env layout patch present" sh -c "ls target/linux/generic/pending-6.6/ | grep -qi 'ascii-env'"
          check "a patch defining nvmem_layout_parse_mac_base is present (ascii-env.c calls it)" sh -c "grep -rlq '+void nvmem_layout_parse_mac_base' target/linux/generic/*-6.6/"
          git -c core.hooksPath=/dev/null commit -q -m "generic: sync QPIC SPI-NAND and NVMEM ascii-env patches from BASE" || true

      - name: "7d. Diagnostic boot build (LED stages, panic delay, logs on flash, safe boot counter)"
        if: ${{ inputs.diag != false }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          Q=target/linux/qualcommax
          DTS=$Q/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          python3 - "$DTS" <<'PYDTS'
          import re, sys
          p = sys.argv[1]; s = open(p).read()
          m = re.search(r'bootargs-append\s*=\s*"([^"]*)"', s)
          if m:
              v = re.sub(r'\s*(panic=-?[0-9]+|initcall_debug|log_buf_len=\S+|sysctl\.kernel\.panic_on_oops=\S+)', '', m.group(1)) + ' panic=0 initcall_debug log_buf_len=1M sysctl.kernel.panic_on_oops=0'
              s = s[:m.start(1)] + v + s[m.end(1):]
          else:
              s += '\n/ {\n\tchosen {\n\t\tbootargs-append = " root=/dev/ubiblock0_0 coherent_pool=2M panic=0 initcall_debug log_buf_len=1M sysctl.kernel.panic_on_oops=0";\n\t};\n};\n'
          s += ('\n/* mx2000 diagnostic build: blue = kernel heartbeat (alive), frozen = panic/hang */\n'
                '/ {\n\tleds {\n\t\tblue {\n\t\t\tlinux,default-trigger = "heartbeat";\n\t\t};\n\t\tred {\n\t\t\tlinux,default-trigger = "none";\n\t\t};\n\t};\n};\n')
          open(p, 'w').write(s)
          PYDTS
          check "DTS: panic=0 + initcall_debug in bootargs-append" grep -qE 'bootargs-append = "[^"]*panic=0 initcall_debug log_buf_len=1M( |")' "$DTS"
          check "DTS: blue LED heartbeat trigger added" grep -q '"heartbeat"' "$DTS"
          # a module oops (e.g. ath11k) after boot no longer panics -> router stays up and dmesg keeps the full oops;
          # the kernel applies sysctl.* only after the built-in drivers ran, so an early built-in crash still halts (LED freeze)
          check "DTS: sysctl.kernel.panic_on_oops=0 in bootargs-append" grep -qE 'bootargs-append = "[^"]*sysctl\.kernel\.panic_on_oops=0' "$DTS"
          # kernel options for the LED stages (built-in, so they work before any module loads)
          CD=$Q/ipq50xx/config-default
          for o in LEDS_CLASS LEDS_PWM LEDS_TRIGGERS LEDS_TRIGGER_HEARTBEAT LEDS_TRIGGER_TIMER LEDS_TRIGGER_DEFAULT_ON PRINTK_TIME PANIC_ON_OOPS; do
            sed -i "/^CONFIG_$o=/d; /^# CONFIG_$o is not set/d" $CD; echo "CONFIG_$o=y" >> $CD
          done
          # a panic before the command line is parsed uses this value: 0 = halt (never reboot), so an early panic shows as "stuck, no reboot"
          sed -i "/^CONFIG_PANIC_TIMEOUT=/d" $CD; echo "CONFIG_PANIC_TIMEOUT=0" >> $CD
          check "config-default: PANIC_TIMEOUT=0 and PANIC_ON_OOPS=y" sh -c "grep -qx 'CONFIG_PANIC_TIMEOUT=0' $CD && grep -qx 'CONFIG_PANIC_ON_OOPS=y' $CD"
          check "config-default forces LEDS_TRIGGER_HEARTBEAT=y" grep -qx 'CONFIG_LEDS_TRIGGER_HEARTBEAT=y' $CD
          # boot counter: reset only when an Ethernet port has a link (escape hatch: power-cycle 4x -> OpenWrt 25)
          BC=$Q/ipq50xx/base-files/etc/init.d/bootcount
          if [ -f "$BC" ]; then
            cp "$BC" ../out/07d-bootcount.orig
            python3 - "$BC" "$GITHUB_WORKSPACE/bootcount-wrap.txt" <<'PYBC'
          import re, sys
          p, w = sys.argv[1], open(sys.argv[2]).read()
          s = open(p).read()
          assert len(re.findall(r'(?m)^boot\(\)\s*\{', s)) == 1, 'expected exactly one boot() in bootcount'
          open(p, 'w').write(re.sub(r'(?m)^boot\(\)\s*\{', 'boot_real() {', s, count=1) + w)
          PYBC
            sh -n "$BC"
            check "bootcount wrapped (boot_real + link-gated boot)" sh -c "grep -q '^boot_real()' '$BC' && grep -q 'carrier' '$BC'"
            grep -n -A6 'boot_real()' "$BC" | head -n 12 | tee ../out/07d-bootcount-real.txt
          else
            warn "no ipq50xx bootcount script in this tree: the boot counter is reset elsewhere (or never). Escape hatch = U-Boot only"
          fi
          # boot snapshots saved to the overlay (readable later from OpenWrt 25 with mx2000-postmortem.sh)
          mkdir -p files/etc/init.d files/etc/rc.d
          cp "$GITHUB_WORKSPACE/mx2000-diag.init" files/etc/init.d/mx2000-diag && chmod 755 files/etc/init.d/mx2000-diag
          ln -sf ../init.d/mx2000-diag files/etc/rc.d/S99mx2000-diag
          cp "$GITHUB_WORKSPACE/mx2000-diag-early.init" files/etc/init.d/mx2000-diag-early && chmod 755 files/etc/init.d/mx2000-diag-early
          ln -sf ../init.d/mx2000-diag-early files/etc/rc.d/S01mx2000-diag-early
          check "early kernel-log writer installed (S01, before module loading)" sh -c "test -x files/etc/init.d/mx2000-diag-early && test -L files/etc/rc.d/S01mx2000-diag-early"
          check "diag init script in files/ and enabled" sh -c "test -x files/etc/init.d/mx2000-diag && test -L files/etc/rc.d/S99mx2000-diag"
          git add -A && git commit -q -m "mx2000 diagnostic build instrumentation" || true
          echo "- **DIAG** diagnostic build ON (LED stages, a panic halts instead of rebooting, a driver oops after boot does not panic, logs in /etc/mx2000-diag, link-gated boot counter)" >> "$SUMMARY"

      - name: "6e. FIT image tools: use main's Build/fit + mkits.sh (main's image Makefile is built with them)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          git show "$BASE:include/image-commands.mk" > /tmp/icm-main.mk
          python3 - <<'PYFIT'
          import re
          ours = open('include/image-commands.mk').read(); main = open('/tmp/icm-main.mk').read()
          rx = re.compile(r'(?ms)^define Build/fit\n.*?^endef\n')
          a, b = rx.search(ours), rx.search(main)
          assert a and b, 'Build/fit not found'
          open('include/image-commands.mk', 'w').write(ours[:a.start()] + b.group(0) + ours[a.end():])
          print('Build/fit replaced' if a.group(0) != b.group(0) else 'Build/fit already identical')
          PYFIT
          git show "$BASE:scripts/mkits.sh" > scripts/mkits.sh
          git diff --stat -- include/image-commands.mk scripts/mkits.sh | tee ../out/06e-fit-tools.txt
          check "Build/fit identical to main" bash -c "diff <(git show $BASE:include/image-commands.mk | sed -n '/^define Build\/fit$/,/^endef$/p') <(sed -n '/^define Build\/fit$/,/^endef$/p' include/image-commands.mk) >/dev/null"
          check "mkits.sh identical to main" sh -c "git show $BASE:scripts/mkits.sh | cmp -s - scripts/mkits.sh"
          git add -A && git commit -q -m "FIT tools from main" || true

      - name: "7f. Disable the hardware that breaks the boot today (verified on the router: USB + extras + Wi-Fi off = boots with Ethernet)"
        if: ${{ inputs.disable_broken != false }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          DTS=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          WIFI_NODES=""; [ "${{ inputs.wifi_mode || 'on' }}" = "off" ] && WIFI_NODES="/soc@0/wifi@c000000 /soc@0/wifi1@c000000 /soc@0/remoteproc@cd00000 /soc@0/smp2p-wcss"
          {
            echo ""
            echo "/* TEMPORARY: these blocks stop the 24.10 boot on the MX2000 (bisected on the router, 2026-10-25) */"
            for n in /soc@0/qfprom@a0000 /soc@0/rng@e3000 /soc@0/thermal-sensor@4a9000 /soc@0/dma-controller@704000 /soc@0/crypto@73a000 \
                     /soc@0/usb@8af8800/usb@8a00000 $WIFI_NODES; do
              echo "&{$n} { status = \"disabled\"; };"
            done
          } >> "$DTS"
          tail -n 12 "$DTS"
          N=$(grep -c '^&{/soc@0/.*status = "disabled"' "$DTS"); W=$([ -n "$WIFI_NODES" ] && echo 4 || echo 0)
          check "path overrides appended to the MX2000 DTS ($N = 6 + $W wifi)" test "$N" -eq $((6 + W))
          git add -A && git commit -q -m "mx2000: disable hardware that breaks the 24.10 boot (temporary)" || true
          echo "- **STABLE** USB and crypto/rng/thermal/qfprom disabled in the DTS (known to break the boot)$([ -n "$WIFI_NODES" ] && echo ', Wi-Fi disabled too'); Ethernet stays on" >> "$SUMMARY"

      - name: "7f2. Wi-Fi: fw-memory-mode 1 on both radios (always, not only with disable_broken; OpenWrt commit b9704413c4)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          DTS=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          # مجرّب على الراوتر: الوضع 2 (قيمة main القديمة) يطيّح النظام كله؛ الوضع 1 هو قيمة OpenWrt 25 لأجهزة 512 MB ويمشي ويا باتش 990
          sed -i -E 's/(qcom,ath11k-fw-memory-mode = )<2>;/\1<1>;/' "$DTS"
          check "ath11k fw-memory-mode = <1> on both radios" test "$(grep -c 'qcom,ath11k-fw-memory-mode = <1>;' "$DTS")" -eq 2
          check "no fw-memory-mode <2> left" sh -c "! grep -q 'qcom,ath11k-fw-memory-mode = <2>;' '$DTS'"
          git add -A && git commit -q -m "mx2000: ath11k fw-memory-mode 1 (OpenWrt b9704413c4)" || true

      - name: "7h. Speed settings: Wi-Fi Ethernet frame mode, speed-over-hardening kernel, Wi-Fi IRQs on CPU1, GMAC RX ring, network tuning"
        env:
          WIFI_ETH: ${{ inputs.wifi_ethernet_mode != false }}
          PERF: ${{ inputs.perf_kernel != false }}
          IRQS: ${{ inputs.irq_split != false }}
          NETT: ${{ inputs.net_tuning != false }}
          GMAC_RX: ${{ inputs.gmac_rx_ring || '1024' }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          Q=target/linux/qualcommax
          D=$Q/files/arch/arm64/boot/dts/qcom
          DTS=$D/ipq5018-mx2000.dts
          CD=$Q/ipq50xx/config-default
          mkdir -p files/etc/modules.d files/etc/sysctl.d files/etc/uci-defaults
          if [ "$WIFI_ETH" = "true" ]; then
            # kmodloader reads "module options" lines: ath11k is loaded (as a dependency of ath11k_ahb) with frame_mode=2
            echo "ath11k frame_mode=2" > files/etc/modules.d/ath11k-frame-mode
            check "Wi-Fi Ethernet frame mode: files/etc/modules.d/ath11k-frame-mode" grep -qx 'ath11k frame_mode=2' files/etc/modules.d/ath11k-frame-mode
          fi
          if [ "$PERF" = "true" ]; then
            python3 - "$DTS" "$D/ipq5018-mx-base.dtsi" <<'PYPERF'
          import re, sys
          dts, base = sys.argv[1], sys.argv[2]
          s = open(dts).read(); EXTRA = ' hardened_usercopy=off mitigations=off'
          rx = re.compile(r'bootargs-append\s*=\s*"([^"]*)"')
          ms = list(rx.finditer(s))
          if ms:                                   # the diagnostic build (7d) already wrote one: the last one wins in dtc
              m = ms[-1]
              v = re.sub(r'\s*(hardened_usercopy|mitigations)=\S+', '', m.group(1)) + EXTRA
              s = s[:m.start(1)] + v + s[m.end(1):]
          else:                                    # take the value the board actually uses (mx-base.dtsi) and extend it
              b = rx.findall(open(base).read())
              if not b: sys.exit('no bootargs-append in the MX2000 DTS or mx-base.dtsi')
              s += '\n/* speed over hardening (home router) */\n/ {\n\tchosen {\n\t\tbootargs-append = "%s";\n\t};\n};\n' % (b[-1] + EXTRA)
          open(dts, 'w').write(s)
          PYPERF
            check "DTS: bootargs-append keeps root=/dev/ubiblock0_0 and adds hardened_usercopy=off mitigations=off" grep -qE 'bootargs-append = "[^"]*root=/dev/ubiblock0_0[^"]*hardened_usercopy=off mitigations=off' "$DTS"
            sed -i "/^CONFIG_ARM64_SW_TTBR0_PAN=/d; /^# CONFIG_ARM64_SW_TTBR0_PAN is not set/d" $CD
            echo "# CONFIG_ARM64_SW_TTBR0_PAN is not set" >> $CD
            check "config-default: ARM64_SW_TTBR0_PAN off (no TTBR0 switch on every copy_to/from_user)" grep -qx '# CONFIG_ARM64_SW_TTBR0_PAN is not set' $CD
            # every packet buffer is a slab alloc + free: drop the freelist pointer obfuscation and the random freelist order
            sed -i "/^CONFIG_SLAB_FREELIST_HARDENED=/d; /^# CONFIG_SLAB_FREELIST_HARDENED is not set/d; /^CONFIG_SLAB_FREELIST_RANDOM=/d; /^# CONFIG_SLAB_FREELIST_RANDOM is not set/d" $CD
            printf '# CONFIG_SLAB_FREELIST_HARDENED is not set\n# CONFIG_SLAB_FREELIST_RANDOM is not set\n' >> $CD
            check "config-default: slab freelist hardening + randomisation off" sh -c "grep -qx '# CONFIG_SLAB_FREELIST_HARDENED is not set' $CD && grep -qx '# CONFIG_SLAB_FREELIST_RANDOM is not set' $CD"
          fi
          if [ "$IRQS" = "true" ]; then
            mkdir -p files/etc/init.d
            cat > files/etc/init.d/mx2000-irq <<'IRQSPLIT'
          #!/bin/sh /etc/rc.common
          # Wi-Fi (ath11k) interrupts on CPU1, Ethernet (nss-dp-gmac) stays on CPU0.
          # Measured on the router: all interrupts sat on CPU0 (irqbalance moved none); after the split 35% fewer
          # out-of-order/lost packets on the v2rayA download path.
          START=99
          boot() {
          	(
          		n=0
          		while [ "$n" -lt 60 ] && ! grep -qE 'wbm2host|reo2host|DP_EXT_IRQ' /proc/interrupts; do sleep 2; n=$((n + 1)); done
          		# on this build the ath11k data path rings are named DP_EXT_IRQ (TX completions, RX, status):
          		# left on CPU0 they cost ~800 dropped Ethernet frames per second under a VPN download
          		for i in $(grep -E 'ce[0-9]+|wbm2host|reo2host|reo2ost|DP_EXT_IRQ' /proc/interrupts | cut -d: -f1); do
          			echo 2 > "/proc/irq/$i/smp_affinity" 2>/dev/null
          		done
          		# spread the WAN receive work (IP, firewall, TCP) over both CPUs: Ethernet drops stay at 0
          		echo 3 > /sys/class/net/wan/queues/rx-0/rps_cpus 2>/dev/null
          		logger -t mx2000-irq "Wi-Fi interrupts moved to CPU1, WAN RPS on both CPUs"
          	) &
          }
          IRQSPLIT
            chmod 755 files/etc/init.d/mx2000-irq
            sh -n files/etc/init.d/mx2000-irq
            check "IRQ split script installed (files/etc/init.d/mx2000-irq, START=99)" sh -c "test -x files/etc/init.d/mx2000-irq && grep -q '^START=99' files/etc/init.d/mx2000-irq"
          fi
          P=package/kernel/qca-nss-dp/patches
          check "qca-nss-dp package present (step 6c)" test -f package/kernel/qca-nss-dp/Makefile
          check "qca-nss-dp source is the BASE commit the patches below were made for" grep -q 'PKG_SOURCE_VERSION:=b65a3bc9747e6725f48f55f1a1769b7599dccfc9' package/kernel/qca-nss-dp/Makefile
          mkdir -p $P
          if [ "$GMAC_RX" != "128" ]; then
            # qca-nss-dp (from BASE, step 6c) uses 128 RX descriptors for the IPQ5018 GMAC: at 1 Gbit/s a burst fills
            # them in ~1.6 ms, so a busy CPU drops packets before NAPI runs (seen as ~48k out-of-order TCP segments
            # per speed test through v2rayA). Index math masks with (SIZE - 1): keep a power of two.
            cat > $P/0100-mx2000-syn-gmac-rx-ring.patch <<'GMACRX'
          --- a/hal/dp_ops/syn_gmac_dp/syn_dp_rx.h
          +++ b/hal/dp_ops/syn_gmac_dp/syn_dp_rx.h
          @@ -20,7 +20,7 @@
           #define __NSS_DP_SYN_DP_RX__
           
           #define SYN_DP_NAPI_BUDGET_RX		64
          -#define SYN_DP_RX_DESC_SIZE		128	/* Rx Descriptors needed in the descriptor pool/queue */
          +#define SYN_DP_RX_DESC_SIZE		@SIZE@	/* Rx Descriptors needed in the descriptor pool/queue */
           #define SYN_DP_RX_DESC_MAX_INDEX	(SYN_DP_RX_DESC_SIZE - 1)
           
           /*
          GMACRX
            sed -i "s/@SIZE@/$GMAC_RX/" $P/0100-mx2000-syn-gmac-rx-ring.patch
            check "nss-dp RX ring patch: $GMAC_RX descriptors" grep -qE "^\+#define SYN_DP_RX_DESC_SIZE\s+$GMAC_RX\b" $P/0100-mx2000-syn-gmac-rx-ring.patch
          fi
          # The driver never reads the DMA "missed frame / FIFO overflow" register (clear-on-read), so frames the GMAC
          # dropped for lack of a free RX descriptor were invisible: ethtool rx_missed stayed 0 while TCP saw holes.
          # This adds every reading to rx_missed / rx_fifo_overflows, so the RX ring fix can be verified on the router.
          cat > $P/0101-mx2000-syn-gmac-count-missed-frames.patch <<'GMACMISS'
          --- a/hal/dp_ops/syn_gmac_dp/syn_dp.c
          +++ b/hal/dp_ops/syn_gmac_dp/syn_dp.c
          @@ -382,6 +382,23 @@
           	struct net_device *netdev = dpc->dev;
           	struct nss_dp_dev *gmac_dev = (struct nss_dp_dev *)netdev_priv(netdev);
           	struct nss_dp_hal_info *hal_info = &gmac_dev->dp_info;
          +	struct syn_dp_info_rx *rx_info = &hal_info->syn_info.dp_info_rx;
          +	uint32_t mfbo;
          +
          +	/*
          +	 * The DMA counts the frames it drops because no RX descriptor was free
          +	 * (bits 15:0, overflow flag bit 16) and the frames lost to an RX FIFO
          +	 * overflow (bits 27:17, overflow flag bit 28). Nothing else reads this
          +	 * clear-on-read register, so add every reading to rx_missed and
          +	 * rx_fifo_overflows, which ethtool -S already reports.
          +	 */
          +	if (likely(hal_info->syn_info.mac_base)) {
          +		mfbo = hal_read_reg(hal_info->syn_info.mac_base, SYN_DMA_MISSED_FRAME_AND_BUFF_OVERFLOW_COUNTER);
          +		atomic64_add((mfbo & SYN_DMA_RX_MISSED_MASK) + ((mfbo & BIT(16)) ? 0x10000 : 0),
          +				(atomic64_t *)&rx_info->rx_stats.rx_missed);
          +		atomic64_add(((mfbo >> SYN_DMA_FIFO_OVERFLOW_SHIFT) & SYN_DMA_FIFO_OVERFLOW_MASK) + ((mfbo & BIT(28)) ? 0x800 : 0),
          +				(atomic64_t *)&rx_info->rx_stats.rx_fifo_overflows);
          +	}
           
           	netdev_dbg(netdev, "GETTING stats: rx_packets:%llu rx_bytes:%llu",
           			hal_info->syn_info.dp_info_rx.rx_stats.rx_packets,
          GMACMISS
          check "nss-dp drop counter patch: DMA missed-frame register feeds ethtool rx_missed" grep -q '^+.*SYN_DMA_MISSED_FRAME_AND_BUFF_OVERFLOW_COUNTER' $P/0101-mx2000-syn-gmac-count-missed-frames.patch
          if [ "$NETT" = "true" ]; then
            # netdev_budget_usecs is NOT set: its minimum is 2*USEC_PER_SEC/HZ = 20000 with HZ=100 (lower values are rejected, verified on the router).
            # TCP receive buffer 2 MB: measured on the router, xray is CPU-bound (both cores 100%, 55 zero-window events per
            # speed test), and with 8 MB the server bursts more than xray can drain (memory pressure, pruning, loss).
            # 2 MB + GOMAXPROCS=1 (step 8b) took the v2rayA speed test from 100 to 110 Mbit/s.
            # BBR comes from kmod-tcp-bbr (selected in step 9, it ships its own /etc/sysctl.d/12-tcp-bbr.conf).
            cat > files/etc/sysctl.d/99-mx2000-net.conf <<'NETCONF'
          net.core.netdev_budget=600
          net.core.netdev_max_backlog=2000
          net.core.rmem_max=2097152
          net.ipv4.tcp_rmem=4096 131072 2097152
          net.ipv4.tcp_slow_start_after_idle=0
          net.ipv4.tcp_congestion_control=cubic
          NETCONF
            # cubic, not BBR, as the default: the router's TCP to the LAN client (the download leg) paced by BBR cost
            # hrtimers/tcp_pace_kick in perf on the router and was not faster (97 vs 95 Mbit/s). 99-* sorts after
            # 12-tcp-bbr.conf, so this wins; BBR stays available per socket.
            for kv in net.core.netdev_budget=600 net.core.netdev_max_backlog=2000 net.core.rmem_max=2097152 'net.ipv4.tcp_rmem=4096 131072 2097152' net.ipv4.tcp_slow_start_after_idle=0 net.ipv4.tcp_congestion_control=cubic; do
              check "sysctl file: $kv" grep -qxF "$kv" files/etc/sysctl.d/99-mx2000-net.conf
            done
          fi
          git add -A && git commit -q -m "mx2000 speed settings" || true
          echo "- **SPEED** Wi-Fi Ethernet mode=$WIFI_ETH, speed-over-hardening kernel=$PERF, Wi-Fi IRQs on CPU1=$IRQS, GMAC RX ring=$GMAC_RX (+ DMA drop counter), network tuning (cubic, 2 MB TCP receive buffer, xray GOMAXPROCS=1)=$NETT" >> "$SUMMARY"

      - name: "7i. Extra storage: the Linksys syscfg partition (68 MB, unused by OpenWrt) mounted at /mnt/syscfg"
        if: ${{ inputs.syscfg_storage != false }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          # NAND map (mx-base.dtsi): kernel+rootfs 82 MB, alt_kernel+alt_rootfs 82 MB (dual boot, untouched), sysdiag 2 MB,
          # syscfg 68 MB = the stock firmware's settings (UBIFS). Only the read-only flag of syscfg is dropped; sysupgrade
          # (linksys_mx_pre_upgrade) only ever writes kernel/rootfs or alt_kernel/alt_rootfs.
          BASEDTSI=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx-base.dtsi
          check "mx-base.dtsi has the syscfg partition" grep -q 'label = "syscfg";' $BASEDTSI
          N0=$(grep -c 'read-only;' $BASEDTSI)
          python3 - "$BASEDTSI" <<'PYSYSCFG'
          import re, sys
          p = sys.argv[1]; s = open(p).read()
          i = s.index('label = "syscfg";')
          a = s.rindex('partition@', 0, i); b = s.index('};', i)
          node = re.sub(r'\n[ \t]*read-only;', '', s[a:b], count=1)
          assert 'read-only' not in node and 'reg = <0x0acc0000 0x4400000>;' in node, node
          open(p, 'w').write(s[:a] + node + s[b:])
          PYSYSCFG
          check "only the syscfg partition lost its read-only flag" test "$(grep -c 'read-only;' $BASEDTSI)" -eq $((N0 - 1))
          mkdir -p files/etc/init.d
          cat > files/etc/init.d/syscfg-storage <<'SYSCFG'
          #!/bin/sh /etc/rc.common
          # Extra storage: the Linksys "syscfg" partition (68 MB, where the stock firmware keeps its settings; OpenWrt never
          # used it) is mounted at /mnt/syscfg. v2rayA's downloaded geo files (/usr/share/xray) are kept there, not on the overlay.
          # The volume keeps the stock name "syscfg", so the Linksys firmware still finds one if it is ever flashed back.
          START=19

          MP=/mnt/syscfg
          VOL=syscfg

          say() { logger -t syscfg-storage "$*"; }

          ubi_of_mtd() {
          	local d
          	for d in /sys/class/ubi/ubi[0-9]*; do
          		[ "$(cat "$d/mtd_num" 2>/dev/null)" = "$1" ] && { echo "${d##*/}"; return 0; }
          	done
          	return 1
          }

          start() {
          	local mtd ubi
          	if ! grep -q " $MP ubifs " /proc/mounts; then
          		mtd=$(grep '"syscfg"' /proc/mtd | cut -d: -f1)
          		mtd=${mtd#mtd}
          		[ -n "$mtd" ] || { say "no syscfg partition"; return 0; }
          		ubi=$(ubi_of_mtd "$mtd")
          		if [ -z "$ubi" ]; then
          			if ! ubiattach -m "$mtd" >/dev/null 2>&1; then
          				say "syscfg holds no UBI: formatting it (first time only)"
          				ubiformat -y -q "/dev/mtd$mtd" >/dev/null 2>&1 && ubiattach -m "$mtd" >/dev/null 2>&1 || { say "cannot attach syscfg"; return 1; }
          			fi
          			ubi=$(ubi_of_mtd "$mtd") || { say "syscfg attached but no UBI device found"; return 1; }
          		fi
          		ubinfo -d "${ubi#ubi}" -N "$VOL" >/dev/null 2>&1 || ubimkvol "/dev/$ubi" -N "$VOL" -m >/dev/null 2>&1 || { say "cannot create the $VOL volume"; return 1; }
          		mkdir -p "$MP"
          		if ! mount -t ubifs -o noatime "$ubi:$VOL" "$MP" 2>/dev/null; then
          			say "the $VOL volume does not mount: recreating it empty"
          			ubirmvol "/dev/$ubi" -N "$VOL" >/dev/null 2>&1
          			ubimkvol "/dev/$ubi" -N "$VOL" -m >/dev/null 2>&1 && mount -t ubifs -o noatime "$ubi:$VOL" "$MP" 2>/dev/null || { say "cannot mount $VOL"; return 1; }
          		fi
          		say "extra storage ready at $MP: $(df -h "$MP" | awk 'NR == 2 {print $4}') free"
          	fi
          	grep -q " /usr/share/xray " /proc/mounts && return 0
          	mkdir -p "$MP/xray" /usr/share/xray
          	if [ ! -e "$MP/xray/.moved" ]; then
          		if cp -a /usr/share/xray/. "$MP/xray/" 2>/dev/null; then
          			rm -rf /usr/share/xray/* 2>/dev/null
          			touch "$MP/xray/.moved"
          		else
          			say "could not copy the v2rayA geo files: they stay on the overlay"
          			return 0
          		fi
          	fi
          	mount -o bind "$MP/xray" /usr/share/xray && say "v2rayA geo files are kept on $MP/xray"
          }
          SYSCFG
          chmod 755 files/etc/init.d/syscfg-storage
          sh -n files/etc/init.d/syscfg-storage
          check "syscfg storage script installed (START=19, before v2rayA at 99)" grep -q '^START=19' files/etc/init.d/syscfg-storage
          check "syscfg storage never touches rootfs_data (the overlay volume name)" sh -c "! grep -q rootfs_data files/etc/init.d/syscfg-storage"
          git add -A && git commit -q -m "extra storage: syscfg partition at /mnt/syscfg" || true
          echo "- **STORAGE** syscfg (68 MB) made writable and mounted at /mnt/syscfg on boot (~55 MB); v2rayA geo files kept there" >> "$SUMMARY"

      - name: "7g. Wi-Fi manual mode: keep the Wi-Fi nodes but do not auto-load ath11k_ahb (start it by hand to watch the crash)"
        if: ${{ (inputs.wifi_mode || 'on') == 'manual' }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          mkdir -p files/etc/modules.d files/usr/sbin
          : > files/etc/modules.d/ath11k-ahb        # overrides the package file: empty = not loaded at boot
          cat > files/usr/sbin/wifi-test <<'WT'
          #!/bin/sh
          # Starts the Wi-Fi driver by hand and streams the kernel log, so the last lines before a crash reach your screen.
          echo "kernel log follows; the router may freeze within seconds - copy everything you see"
          echo 8 > /proc/sys/kernel/printk
          dmesg -c > /tmp/dmesg-before-wifi.txt
          ( while true; do dmesg -c; sleep 0.2; done ) &
          sleep 1
          echo ">>> modprobe ath11k_ahb"
          modprobe ath11k_ahb
          sleep 30
          echo ">>> still alive after 30 s"; kill %1 2>/dev/null
          WT
          chmod 755 files/usr/sbin/wifi-test
          sh -n files/usr/sbin/wifi-test
          check "ath11k_ahb autoload disabled (empty files/etc/modules.d/ath11k-ahb)" test -f files/etc/modules.d/ath11k-ahb -a ! -s files/etc/modules.d/ath11k-ahb
          check "wifi-test helper installed" test -x files/usr/sbin/wifi-test
          git add -A && git commit -q -m "mx2000: wifi manual mode" || true
          echo "- **WIFI** manual mode: Wi-Fi nodes enabled, ath11k_ahb not auto-loaded; run 'wifi-test' over SSH to start it and watch the kernel log" >> "$SUMMARY"

      - name: "7. Fix kernel patches for 6.6.144 (with asserts)"
        run: |
          source ./ci-lib.sh
          cd openwrt/target/linux/qualcommax/patches-6.6
          P13=0113-remoteproc-qcom-Add-secure-PIL-support.patch
          P16=0116-remoteproc-qcom-Update-regmap-offsets-for-halt-regis.patch
          check "0113 exists" test -f "$P13"
          check "0116 exists" test -f "$P16"
          check "0113 has MAX_HALT_REG 3 context before fix" grep -qE '^ #define MAX_HALT_REG[[:space:]]+3$' "$P13"
          sed -i -E 's/^( #define MAX_HALT_REG[[:space:]]+)3$/\14/' "$P13"
          check "0113 fixed to MAX_HALT_REG 4" grep -qE '^ #define MAX_HALT_REG[[:space:]]+4$' "$P13"
          python3 - "$P16" <<'PYFIX'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          parts = re.split(r'(?m)^(?=@@ )', s)
          hunks = parts[1:]
          if len(hunks) != 6:
              sys.exit("ERROR: 0116 has %d hunks, expected 6" % len(hunks))
          drop = [h for h in hunks if h.startswith('@@ -86,7 ') or h.startswith('@@ -928,9 ')]
          if len(drop) != 2:
              sys.exit("ERROR: matched %d hunks to drop, expected 2" % len(drop))
          keep = [h for h in hunks if h not in drop]
          open(p, 'w').write(parts[0] + ''.join(keep))
          PYFIX
          check "0116 has 4 hunks left" test "$(grep -c '^@@' "$P16")" -eq 4
          check "0116 no longer touches MAX_HALT_REG" sh -c "! grep -q 'MAX_HALT_REG' $P16"
          cd "$GITHUB_WORKSPACE/openwrt" && git add -A && git commit -q -m "fix 0113/0116 for kernel 6.6.144"

      # ------------------------------------------------------------------
      - name: "8. Feeds"
        run: |
          source ./ci-lib.sh
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          for d in feeds/*/; do
            [ -d "$d/.git" ] && echo "$(basename "$d") $(git -C "$d" rev-parse HEAD)"
          done > ../out/08-feeds-commits.txt
          cat ../out/08-feeds-commits.txt
          check "luci installed from feed" test -d package/feeds/luci/luci-base

      - name: "8b. v2rayA/xray: GOMAXPROCS=1 GOGC=200 (measured on the router: 100 -> 110 Mbit/s with the 2 MB TCP buffer)"
        if: ${{ inputs.net_tuning != false }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          # CPU0 is 100% busy receiving packets (softirq), so xray effectively runs on CPU1 only: one Go thread avoids
          # cross-CPU wakeups, GOGC=200 halves the garbage-collector runs. v2rayA starts xray with its own environment.
          I=feeds/packages/net/v2raya/files/v2raya.init
          if [ -f "$I" ]; then
            check "v2raya init has the procd env line this edit hooks onto" grep -q 'procd_set_param env XDG_DATA_HOME="/usr/share"' "$I"
            grep -q 'GOMAXPROCS=1 GOGC=200' "$I" || sed -i 's#^\(\t*\)procd_set_param env XDG_DATA_HOME="/usr/share"#&\n\1procd_append_param env GOMAXPROCS=1 GOGC=200#' "$I"
            check "the env line was added exactly once" test "$(grep -c 'GOMAXPROCS=1 GOGC=200' "$I")" -eq 1
            check "v2raya init starts v2rayA/xray with GOMAXPROCS=1 GOGC=200" grep -qP '^\t*procd_append_param env GOMAXPROCS=1 GOGC=200$' "$I"
            check "v2raya init still parses" sh -n "$I"
            echo "- **SPEED** v2rayA/xray started with GOMAXPROCS=1 GOGC=200" >> "$SUMMARY"
            # v2rayA's nftables chains run two route lookups and set lookups on every packet, also on the
            # WAN replies to xray and on xray's packets to the LAN that are never proxied. Its transparent
            # hook (post-start) adds an early exit for both (measured on the router: steadier, 98 -> 109 Mbit/s avg).
            mkdir -p files/usr/bin files/etc/uci-defaults
            cat > files/usr/bin/mx2000-v2raya-hook <<'V2HOOK'
          #!/bin/sh
          # v2rayA transparent hook: --transparent-type=... --stage=pre-start|post-start|pre-stop|post-stop
          case " $* " in *--stage=post-start*) ;; *) exit 0 ;; esac
          nft list chain inet v2raya tp_pre > /dev/null 2>&1 || exit 0
          for c in tp_pre tp_out; do
          	for h in $(nft -a list chain inet v2raya $c | awk '/(iifname "wan"|oifname "br-lan") return/ {print $NF}'); do
          		nft delete rule inet v2raya $c handle $h
          	done
