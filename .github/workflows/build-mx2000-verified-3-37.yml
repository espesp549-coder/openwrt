          #!/usr/bin/env python3
          """bindcheck.py - does every BUILT-IN driver find in the DT node what its source code asks for?

          The kernel dies ~1-2 s after the LED driver, before any module can load from the rootfs, so the culprit is a
          built-in driver. For each enabled DT node: find the driver (of_match string in the kernel tree), read the
          names it requests (clocks, resets, DMA channels, IRQs, register regions, phandles, properties) and compare
          with the node. Missing *mandatory* resources make probe fail or dereference NULL.
          """
          import argparse, glob, importlib.machinery, os, re, sys

          HERE = os.path.dirname(os.path.abspath(__file__))
          cm = importlib.machinery.SourceFileLoader('cm', os.path.join(HERE, 'compare-mx2000.py')).load_module()

          GETTERS = {
              'clock':    (r'\b(?:devm_)?clk_get(?:_enabled)?\s*\([^,()]+,\s*"([^"]+)"', r'\b(?:devm_)?clk_get_optional(?:_enabled)?\s*\([^,()]+,\s*"([^"]+)"', 'clock-names'),
              'reset':    (r'\b(?:devm_)?reset_control_get(?:_exclusive|_shared)?\s*\([^,()]+,\s*"([^"]+)"', r'\b(?:devm_)?reset_control_get_optional\w*\s*\([^,()]+,\s*"([^"]+)"', 'reset-names'),
              'dma':      (r'\bdma_request_(?:chan|slave_channel)\s*\([^,()]+,\s*"([^"]+)"', None, 'dma-names'),
              'irq':      (r'\bplatform_get_irq_byname\s*\([^,()]+,\s*"([^"]+)"', r'\bplatform_get_irq_byname_optional\s*\([^,()]+,\s*"([^"]+)"', 'interrupt-names'),
              'reg':      (r'\b(?:devm_platform_ioremap_resource_byname|platform_get_resource_byname)\s*\([^"]*?"([^"]+)"', None, 'reg-names'),
          }
          PROP_RX = r'\b(?:of_property_read_\w+|of_get_property|of_property_count_\w+|device_property_read_\w+|of_parse_phandle(?:_with_args)?|of_property_match_string)\s*\([^,()]+,\s*"([^"]+)"'

          def strings(v): return cm.strings(v) if v else []

          def find_driver(kd, comp, cache):
              if comp in cache: return cache[comp]
              hits = []
              for root in ('drivers', 'sound'):
                  for dirpath, _, files in os.walk(os.path.join(kd, root)):
                      for f in files:
                          if f.endswith('.c'):
                              p = os.path.join(dirpath, f)
                              try:
                                  if f'"{comp}"' in open(p, errors='replace').read(): hits.append(p)
                              except OSError: pass
              cache[comp] = hits
              return hits

          def built_in(cfile):
              o = cfile[:-2] + '.o'
              ko = cfile[:-2] + '.ko'
              return os.path.exists(o) and not os.path.exists(ko)

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--dts', required=True); ap.add_argument('--kernel-dir', required=True)
              ap.add_argument('--ref-dts', default='', help='decompiled DTS of the working OpenWrt 25 image (optional)')
              ap.add_argument('--report', default='21c-bindcheck.md'); ap.add_argument('--summary', default='')
              a = ap.parse_args()
              root = cm.parse_dts(open(a.dts, errors='replace').read())
              nodes = list(cm.walk(root))
              cache = {}; rows = []
              for path, n in nodes:
                  comps = strings(n['props'].get('compatible', ''))
                  if not comps: continue
                  st = (strings(n['props'].get('status', '')) or ['okay'])[0]
                  if st not in ('okay', 'ok'): continue
                  files = []
                  for c in comps:
                      files = find_driver(a.kernel_dir, c, cache)
                      if files: break
                  if not files: continue
                  bi = [f for f in files if built_in(f)]
                  if not bi: continue                       # module or not compiled: cannot run in the first seconds
                  src = '\n'.join(open(f, errors='replace').read() for f in bi)
                  problems, notes = [], []
                  for kind, (rx_req, rx_opt, names_prop) in GETTERS.items():
                      req = set(re.findall(rx_req, src)); opt = set(re.findall(rx_opt, src)) if rx_opt else set()
                      have = set(strings(n['props'].get(names_prop, '')))
