              return fdt_write(root, boot_cpuid)

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--sysupgrade', required=True); ap.add_argument('--outdir', required=True)
              ap.add_argument('--fwtool', default=''); ap.add_argument('--summary', default='')
