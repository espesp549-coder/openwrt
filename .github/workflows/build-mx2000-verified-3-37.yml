          			}
          		}
          	})
          	mux.HandleFunc("/upload", func(w http.ResponseWriter, r *http.Request) {
          		h := sha256.New()
          		n, err := io.Copy(h, r.Body)
          		if err != nil {
          			http.Error(w, err.Error(), 500)
          			return
          		}
          		fmt.Fprintf(w, "%d %s", n, hex.EncodeToString(h.Sum(nil)))
          	})
          	go func() {
          		if err := http.ListenAndServe(httpAddr, mux); err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			os.Exit(1)
          		}
          	}()
          	// raw: the client sends "size seed chunk ms\n"; the reply is the stream,
          	// then the server closes. Whatever else the client sends is ignored.
          	ln, err := net.Listen("tcp", rawAddr)
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		os.Exit(1)
          	}
          	for {
          		c, err := ln.Accept()
          		if err != nil {
          			continue
          		}
          		go func(c net.Conn) {
          			defer c.Close()
          			br := bufio.NewReader(c)
          			line, err := br.ReadString('\n')
          			if err != nil {
          				return
          			}
          			if strings.HasPrefix(line, "echo ") {
          				// echo: send back the next n bytes as they come
          				var n int64
          				fmt.Sscan(line[5:], &n)
          				io.CopyN(c, br, n)
          				return
          			}
          			var size, seed, chunk, ms int64
          			fmt.Sscan(line, &size, &seed, &chunk, &ms)
          			g := newGen(uint64(seed))
          			if ms < 0 {
          				// send size bytes, then reset the connection instead of closing it
          				io.CopyN(c, g, size)
          				c.(*net.TCPConn).SetLinger(0)
          				return
          			}
          			if chunk <= 0 {
          				io.CopyN(c, g, size)
          				return
          			}
          			for size > 0 {
          				k := chunk
          				if k > size {
          					k = size
          				}
          				if _, err := io.CopyN(c, g, k); err != nil {
          					return
          				}
          				size -= k
          				if size > 0 {
          					time.Sleep(time.Duration(ms) * time.Millisecond)
          				}
          			}
          		}(c)
          	}
          }

          // every test ends within 2 minutes or fails: a lost byte must not hang the run
          const limit = 2 * time.Minute

          var client = &http.Client{Transport: &http.Transport{MaxIdleConnsPerHost: 64, DisableCompression: true}, Timeout: limit}

          func dial(addr string) net.Conn {
          	c, err := net.Dial("tcp", addr)
          	if err != nil {
          		fail("%s: %v", os.Args[1], err)
          	}
          	c.SetDeadline(time.Now().Add(limit))
          	return c
          }

          func get(base string, size int64, seed uint64) (int64, bool, error) {
          	reused := false
          	trace := &httptrace.ClientTrace{GotConn: func(i httptrace.GotConnInfo) { reused = i.Reused }}
          	req, _ := http.NewRequest("GET", fmt.Sprintf("%s/data?size=%d&seed=%d", base, size, seed), nil)
          	req = req.WithContext(httptrace.WithClientTrace(req.Context(), trace))
          	resp, err := client.Do(req)
          	if err != nil {
          		return 0, reused, err
          	}
          	defer resp.Body.Close()
          	n, err := io.Copy(newChecker(seed), resp.Body)
          	if err == nil && n != size {
          		err = fmt.Errorf("got %d of %d bytes", n, size)
          	}
          	return n, reused, err
          }

          func fail(f string, a ...interface{}) {
          	fmt.Printf("FAIL "+f+"\n", a...)
          	os.Exit(1)
          }

          func main() {
          	if len(os.Args) < 2 {
          		fmt.Println("usage: e2etool serve|big|small|keepalive|parallel|upload|halfclose|abort|trickle ...")
          		os.Exit(2)
          	}
          	fs := flag.NewFlagSet(os.Args[1], flag.ExitOnError)
          	httpAddr := fs.String("http", "127.0.0.1:18080", "")
          	rawAddr := fs.String("raw", "127.0.0.1:18090", "")
          	base := fs.String("base", "http://127.0.0.1:18080", "")
          	size := fs.Int64("size", 256<<20, "")
          	count := fs.Int("n", 100, "")
          	chunk := fs.Int64("chunk", 0, "")
          	ms := fs.Int64("ms", 0, "")
          	fs.Parse(os.Args[2:])
          	switch os.Args[1] {
          	case "serve":
          		serve(*httpAddr, *rawAddr)
          	case "big":
          		t := time.Now()
          		n, _, err := get(*base, *size, 7)
          		if err != nil {
          			fail("big: %v", err)
          		}
          		d := time.Since(t).Seconds()
          		fmt.Printf("ok big %d MB in %.2f s = %.0f Mbit/s\n", n>>20, d, float64(n)*8/d/1e6)
          	case "small":
          		r := rand.New(rand.NewSource(42))
          		var total int64
          		for i := 0; i < *count; i++ {
          			s := int64(r.Intn(3)) * int64(r.Intn(20000))
          			if i%10 == 0 {
          				s = int64(i % 7) // 0..6 bytes
          			}
          			client.CloseIdleConnections() // a new connection each time
          			n, _, err := get(*base, s, uint64(1000+i))
          			if err != nil {
          				fail("small #%d size %d: %v", i, s, err)
          			}
          			total += n
          		}
          		fmt.Printf("ok small %d downloads, %d bytes, new connection each\n", *count, total)
          	case "keepalive":
          		client.CloseIdleConnections()
          		r := rand.New(rand.NewSource(7))
          		reusedN := 0
          		for i := 0; i < *count; i++ {
          			s := int64(r.Intn(300000))
          			if i%5 == 0 {
          				s = int64(r.Intn(10))
          			}
          			_, reused, err := get(*base, s, uint64(5000+i))
          			if err != nil {
          				fail("keepalive #%d size %d: %v", i, s, err)
          			}
          			if reused {
          				reusedN++
          			}
          		}
          		if reusedN < *count-1 {
          			fail("keepalive: only %d of %d requests reused the connection", reusedN, *count)
          		}
          		fmt.Printf("ok keepalive %d requests, %d on the same connection\n", *count, reusedN)
          	case "parallel":
          		var wg sync.WaitGroup
          		var bad atomic.Value
          		var total int64
          		t := time.Now()
          		for i := 0; i < *count; i++ {
          			wg.Add(1)
          			go func(i int) {
          				defer wg.Done()
          				n, _, err := get(*base, *size, uint64(9000+i))
          				atomic.AddInt64(&total, n)
          				if err != nil {
          					bad.Store(fmt.Sprintf("#%d: %v", i, err))
          				}
          			}(i)
          		}
          		wg.Wait()
          		if v := bad.Load(); v != nil {
          			fail("parallel %s", v)
          		}
          		d := time.Since(t).Seconds()
          		fmt.Printf("ok parallel %d x %d MB in %.2f s = %.0f Mbit/s\n", *count, *size>>20, d, float64(total)*8/d/1e6)
          	case "upload":
          		h := sha256.New()
          		g := newGen(77)
          		pr, pw := io.Pipe()
          		go func() {
          			_, err := io.CopyN(io.MultiWriter(pw, h), g, *size)
          			pw.CloseWithError(err)
          		}()
          		resp, err := client.Post(*base+"/upload", "application/octet-stream", pr)
          		if err != nil {
          			fail("upload: %v", err)
          		}
          		body, _ := io.ReadAll(resp.Body)
          		resp.Body.Close()
          		want := fmt.Sprintf("%d %s", *size, hex.EncodeToString(h.Sum(nil)))
          		if strings.TrimSpace(string(body)) != want {
          			fail("upload: server saw %q, sent %q", body, want)
          		}
          		fmt.Printf("ok upload %d MB, server hash matches\n", *size>>20)
          	case "halfclose", "trickle":
          		// raw protocol through the second dokodemo port; halfclose shuts our
          		// sending side down right after the request line
          		c := dial(*rawAddr)
          		fmt.Fprintf(c, "%d %d %d %d\n", *size, 31, *chunk, *ms)
          		if os.Args[1] == "halfclose" {
          			c.(*net.TCPConn).CloseWrite()
          		}
          		t := time.Now()
          		n, err := io.Copy(newChecker(31), c)
          		c.Close()
          		if err != nil || n != *size {
          			fail("%s: got %d of %d bytes after %.1f s: %v", os.Args[1], n, *size, time.Since(t).Seconds(), err)
          		}
          		fmt.Printf("ok %s %d bytes in %.1f s (chunk %d every %d ms)\n", os.Args[1], n, time.Since(t).Seconds(), *chunk, *ms)
          	case "slowread":
          		// read at about -chunk bytes every -ms milliseconds
          		c := dial(*rawAddr)
          		fmt.Fprintf(c, "%d %d 0 0\n", *size, 31)
          		chk := newChecker(31)
          		t := time.Now()
          		var n int64
          		for n < *size {
          			k, err := io.CopyN(chk, c, *chunk)
          			n += k
          			if err != nil {
          				fail("slowread: got %d of %d bytes: %v", n, *size, err)
          			}
          			time.Sleep(time.Duration(*ms) * time.Millisecond)
          		}
          		c.Close()
          		fmt.Printf("ok slowread %d bytes in %.1f s\n", n, time.Since(t).Seconds())
          	case "echo":
          		// full duplex: send -size bytes and check the echo while still sending
          		c := dial(*rawAddr)
          		fmt.Fprintf(c, "echo %d\n", *size)
          		errc := make(chan error, 1)
          		go func() {
          			_, err := io.CopyN(c, newGen(55), *size)
          			errc <- err
          		}()
          		t := time.Now()
          		n, err := io.CopyN(newChecker(55), c, *size)
          		if err != nil {
          			fail("echo: got %d of %d bytes back: %v", n, *size, err)
          		}
          		if err := <-errc; err != nil {
          			fail("echo: sending: %v", err)
          		}
          		c.Close()
          		fmt.Printf("ok echo %d MB both ways at once in %.1f s\n", n>>20, time.Since(t).Seconds())
          	case "rst":
          		// the far end resets the connection after -size bytes: the client
          		// must get those bytes (or fewer) and an end, not hang
          		for i := 0; i < *count; i++ {
          			c := dial(*rawAddr)
          			c.SetDeadline(time.Now().Add(20 * time.Second))
          			fmt.Fprintf(c, "%d %d 0 -1\n", *size, 31)
          			n, err := io.Copy(newChecker(31), c)
          			c.Close()
          			if n > *size || (err != nil && strings.Contains(err.Error(), "differs")) {
          				fail("rst #%d: %d bytes: %v", i, n, err)
          			}
          			if err != nil && strings.Contains(err.Error(), "timeout") {
          				fail("rst #%d: hung after %d bytes", i, n)
          			}
          		}
          		fmt.Printf("ok rst %d connections reset by the far end\n", *count)
          	case "idle":
          		// -n keep-alive connections, each idle between two requests; meanwhile
          		// count the pipes the client xray holds (-pid)
          		pid := fs.Arg(0)
          		clients := make([]*http.Client, *count)
          		for i := range clients {
          			clients[i] = &http.Client{Transport: &http.Transport{MaxIdleConnsPerHost: 1, DisableCompression: true}, Timeout: limit}
          		}
          		round := func(r int) int {
          			reused := 0
          			for i, cl := range clients {
          				seed := uint64(70000 + 1000*r + i)
          				trace := &httptrace.ClientTrace{GotConn: func(ci httptrace.GotConnInfo) {
          					if ci.Reused {
          						reused++
          					}
          				}}
          				req, _ := http.NewRequest("GET", fmt.Sprintf("%s/data?size=%d&seed=%d", *base, 3000+i, seed), nil)
          				resp, err := cl.Do(req.WithContext(httptrace.WithClientTrace(req.Context(), trace)))
          				if err != nil {
          					fail("idle round %d #%d: %v", r, i, err)
          				}
          				n, err := io.Copy(newChecker(seed), resp.Body)
          				resp.Body.Close()
          				if err != nil || n != int64(3000+i) {
          					fail("idle round %d #%d: %d bytes: %v", r, i, n, err)
          				}
          			}
          			return reused
          		}
          		pipes := func() int {
          			n := 0
          			if ents, err := os.ReadDir("/proc/" + pid + "/fd"); err == nil {
          				for _, e := range ents {
          					if l, _ := os.Readlink("/proc/" + pid + "/fd/" + e.Name()); strings.HasPrefix(l, "pipe:") {
          						n++
          					}
          				}
          			}
          			return n / 2
          		}
          		before := pipes()
          		round(0)
          		time.Sleep(2 * time.Second)
          		during := pipes()
          		reused := round(1)
          		if reused != *count {
          			fail("idle: only %d of %d connections survived the pause", reused, *count)
          		}
          		if during > before+4 {
          			fail("idle: xray holds %d more pipes while %d connections are idle", during-before, *count)
          		}
          		fmt.Printf("ok idle %d connections paused and reused, xray pipes %d before, %d while idle\n", *count, before, during)
          	case "abort":
          		for i := 0; i < *count; i++ {
          			c := dial(*rawAddr)
          			fmt.Fprintf(c, "%d %d 0 0\n", int64(64<<20), 31)
          			k := int64(1+i*37%3000) * 1024
          			n, err := io.CopyN(newChecker(31), c, k)
          			if err != nil {
          				fail("abort #%d: got %d of the first %d bytes: %v", i, n, k, err)
          			}
          			if i%2 == 0 {
          				c.(*net.TCPConn).SetLinger(0) // RST
          			}
          			c.Close()
          		}
          		fmt.Printf("ok abort %d downloads cut short (half by RST)\n", *count)
          	default:
          		fmt.Println("unknown command")
          		os.Exit(2)
          	}
          }
          E2EGO
          cat > "$X/run.sh" <<'E2ERUN'
          #!/bin/bash
          # run.sh XRAY VARIANT MODE   end-to-end test of one xray binary on this machine
          #   VARIANT  http  VLESS + RAW TCP + HTTP header camouflage, no TLS (the router's case)
          #            none  VLESS + RAW TCP, no header
          #            tls   VLESS + TCP + TLS            (must keep the normal path)
          #            mux   VLESS + HTTP header + mux    (must keep the normal path)
          #   MODE     full | quick | cpu (one big download, prints the client's CPU time)
          #   EXPECT=yes|no  the client must / must not take the zero-copy path
          # Topology: e2etool server <- xray server (VLESS inbound, freedom) <- xray client
          # (dokodemo-door inbounds = what tproxy uses, VLESS outbound) <- e2etool client.
          # Every payload is checked byte by byte.
          set -u
          X=$(readlink -f "$1"); V=$2; MODE=${3:-full}
          D=$(dirname "$(readlink -f "$0")")
          T=${E2ETOOL:-$D/e2etool}
          W=$(mktemp -d "${TMPDIR:-/tmp}/xe2e.XXXX")
          UUID=6a3c0e5e-6f1a-4d55-9d2a-8c1f0b2e7d41
          cleanup() { kill $(jobs -p) 2>/dev/null; wait 2>/dev/null; }
          trap cleanup EXIT
          trap 'exit 1' INT TERM   # runs the EXIT trap: no server left on the test ports

          HDR_REQ='{"version":"1.1","method":"GET","path":["/video"],"headers":{"Host":["www.example.com"],"User-Agent":["Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.75 Safari/537.36"],"Accept-Encoding":["gzip, deflate"],"Connection":["keep-alive"],"Pragma":"no-cache"}}'
          HDR_RESP='{"version":"1.1","status":"200","reason":"OK","headers":{"Content-Type":["application/octet-stream","video/mpeg"],"Transfer-Encoding":["chunked"],"Connection":["keep-alive"],"Pragma":"no-cache"}}'
          case $V in
          http|mux) SS='{"network":"tcp","security":"none","tcpSettings":{"header":{"type":"http","request":'$HDR_REQ',"response":'$HDR_RESP'}}}' ;;
          none) SS='{"network":"tcp","security":"none"}' ;;
          tls)
          	"$X" tls cert -domain=test.local -file="$W/c" >/dev/null 2>&1 || { echo "FAIL cannot make a test certificate"; exit 1; }
          	SS='{"network":"tcp","security":"tls","tlsSettings":{"certificates":[{"certificateFile":"'$W'/c_cert.pem","keyFile":"'$W'/c_key.pem"}]}}' ;;
          *) echo "FAIL unknown variant $V"; exit 2 ;;
          esac
          CS=$SS
          [ "$V" = tls ] && CS='{"network":"tcp","security":"tls","tlsSettings":{"serverName":"test.local","allowInsecure":true}}'
          MUX='{"enabled":false}'
          [ "$V" = mux ] && MUX='{"enabled":true,"concurrency":8}'
          # v2rayA marks the outbound sockets (needs CAP_NET_ADMIN, so only when allowed here)
          python3 -c 'import socket;s=socket.socket();s.setsockopt(socket.SOL_SOCKET,36,128)' 2>/dev/null && CS=${CS%\}}',"sockopt":{"mark":128}}'

          cat > "$W/server.json" <<J
          {"log":{"loglevel":"warning","access":"none","error":"$W/server.log"},
           "inbounds":[{"listen":"127.0.0.1","port":18443,"protocol":"vless","settings":{"clients":[{"id":"$UUID"}],"decryption":"none"},"streamSettings":$SS}],
           "outbounds":[{"protocol":"freedom"}]}
          J
          cat > "$W/client.json" <<J
          {"log":{"loglevel":"debug","access":"none","error":"$W/client.log"},
           "inbounds":[
            {"tag":"transparent","listen":"127.0.0.1","port":18081,"protocol":"dokodemo-door","settings":{"address":"127.0.0.1","port":18080,"network":"tcp,udp"},"sniffing":{"enabled":true,"destOverride":["http","tls"]}},
            {"tag":"raw","listen":"127.0.0.1","port":18091,"protocol":"dokodemo-door","settings":{"address":"127.0.0.1","port":18090,"network":"tcp"}}],
           "outbounds":[{"tag":"proxy","protocol":"vless","settings":{"vnext":[{"address":"127.0.0.1","port":18443,"users":[{"id":"$UUID","encryption":"none","flow":""}]}]},"streamSettings":$CS,"mux":$MUX}]}
          J
          "$T" serve -http 127.0.0.1:18080 -raw 127.0.0.1:18090 > "$W/tool.out" 2>&1 &
          # readv in the stock server misses a reset from the target (after any error it
          # waits for readability again), which the rst test would see as a hang
          XRAY_BUF_READV=disable "$X" run -c "$W/server.json" > "$W/server.out" 2>&1 &
          "$X" run -c "$W/client.json" > "$W/client.out" 2>&1 &
          CPID=$!
          up=0
          for i in $(seq 100); do
          	if (exec 3<>/dev/tcp/127.0.0.1/18081) 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/18443) 2>/dev/null \
          	   && (exec 3<>/dev/tcp/127.0.0.1/18080) 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/18090) 2>/dev/null; then up=1; break; fi
          	sleep 0.1
          done
          [ $up = 1 ] || { echo "FAIL the test servers did not start"; cat "$W"/*.out | tail -n 20; exit 1; }
          sleep 0.5   # the probes above were connections too: let them end
          B=http://127.0.0.1:18081
          R=127.0.0.1:18091
          socks() { ls -l /proc/$CPID/fd 2>/dev/null | grep -c socket:; }
          cpu() { awk '{print $14 "/" $15}' /proc/$CPID/stat; }   # client xray utime/stime in clock ticks
          rc=0
          finish() {
          	# every connection must be gone a few seconds later (the client side idle
          	# timers close a finished connection within about 2 s)
          	for i in $(seq 40); do [ "$(socks)" -le $((S0 + 4)) ] && break; sleep 0.2; done
          	S1=$(socks)
          	[ "$S1" -le $((S0 + 4)) ] || { echo "FAIL $((S1 - S0)) client sockets still open 8 s after the last test"; rc=1; }
          	N=$(grep -c "VLESS downlink splice" "$W/client.log")
          	kill -0 $CPID 2>/dev/null || { echo "FAIL the client xray died"; rc=1; }
          	if grep -qE "panic|fatal error|DATA RACE" "$W"/*.out "$W"/*.log; then
          		echo "FAIL xray crashed:"; grep -E -A3 "panic|fatal error|DATA RACE" "$W"/*.out "$W"/*.log | head -n 20; rc=1
          	fi
          	case ${EXPECT:-} in
          	yes) [ "$N" -gt 0 ] || { echo "FAIL no connection took the zero-copy path"; rc=1; } ;;
          	no) [ "$N" -eq 0 ] || { echo "FAIL $N connections took the zero-copy path"; rc=1; } ;;
          	esac
          	echo "RESULT variant=$V mode=$MODE zero_copy_connections=$N client_sockets_left=$((S1 - S0))"
          	[ $rc = 0 ] && rm -rf "$W" || echo "logs kept in $W"
          	exit $rc
          }
          t() { "$T" "$@" && return 0; echo "FAIL in: e2etool $*"; rc=1; finish; }   # stop at the first failure
          S0=$(socks)
          case $MODE in
          cpu)
          	a=$(cpu); t big -base $B -size $((512 << 20)); b=$(cpu)
          	echo "$a $b" | awk -v hz=$(getconf CLK_TCK) '{ split($1, x, "/"); split($2, y, "/"); g = 0.5 * hz
          		printf "RESULT cpu_user=%.2f cpu_kernel=%.2f (client xray, seconds per GB)\n", (y[1] - x[1]) / g, (y[2] - x[2]) / g }'
          	;;
          quick)
          	t big -base $B -size $((256 << 20))
          	t small -base $B -n 100
          	t keepalive -base $B -n 30
          	[ "$V" = mux ] || t halfclose -raw $R -size $((32 << 20))   # stock mux drops half-closed streams
          	;;
          full)
          	t big -base $B -size $((1024 << 20))
          	t small -base $B -n 300
          	t keepalive -base $B -n 60
          	t parallel -base $B -n 16 -size $((64 << 20))
          	t upload -base $B -size $((128 << 20))
          	if [ "$V" != mux ]; then
          		t halfclose -raw $R -size $((64 << 20))
          		t halfclose -raw $R -size $((2 << 20)) -chunk $((256 << 10)) -ms 400
          		t halfclose -raw $R -size 3000 -chunk 200 -ms 400
          	fi
          	t trickle -raw $R -size 2000 -chunk 200 -ms 1500
          	t abort -raw $R -n 40
          	t slowread -raw $R -size $((8 << 20)) -chunk $((256 << 10)) -ms 50
          	t echo -raw $R -size $((64 << 20))
          	t rst -raw $R -size $((3 << 20)) -n 10
          	t idle -base $B -n 40 $CPID
          	t big -base $B -size $((256 << 20))
          	;;
          *) echo "FAIL unknown mode $MODE"; exit 2 ;;
          esac
          finish
          E2ERUN
          cat > "$X/urg.sh" <<'E2EURG'
          #!/bin/bash
          # urg.sh XRAY   a VLESS server that puts a TCP urgent byte in the middle of the
          # response: the client must deliver the stream without it (as a plain read
          # does), without hanging or spinning.
          set -u
          X=$(readlink -f "$1"); D=$(dirname "$(readlink -f "$0")"); T=${E2ETOOL:-$D/e2etool}
          W=$(mktemp -d "${TMPDIR:-/tmp}/xurg.XXXX")
          trap 'kill $(jobs -p) 2>/dev/null; wait 2>/dev/null' EXIT
          trap 'exit 1' INT TERM
          cat > "$W/fake.py" <<'P'
          import socket, sys, threading, time
          x = (31 * 0x9E3779B97F4A7C15 + 0x1234567) & (2**64 - 1); out = bytearray()
          while len(out) < 300000:             # the e2etool stream for seed 31
              x ^= x >> 12; x ^= (x << 25) & (2**64 - 1); x ^= x >> 27
              out += ((x * 2685821657736338717) & (2**64 - 1)).to_bytes(8, 'little')
          data = bytes(out[:300000]); half = len(data) // 2
          ls = socket.socket(); ls.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          ls.bind(('127.0.0.1', 18444)); ls.listen(16)
          def serve(c):
              b = b''
              while b'\r\n\r\n' not in b:
                  d = c.recv(65536)
                  if not d: return
                  b += d
              time.sleep(0.2)                  # the VLESS request and its first payload: ignored
              c.setblocking(False)
              try:
                  while c.recv(65536): pass
              except BlockingIOError: pass
              c.setblocking(True)
              c.sendall(b'HTTP/1.1 200 OK\r\nContent-Type: video/mpeg\r\n\r\n' + b'\x00\x00' + data[:half])
              time.sleep(0.2); c.send(b'!', socket.MSG_OOB)
              time.sleep(0.2); c.sendall(data[half:])
              time.sleep(0.5); c.close()
          while True:
              c, _ = ls.accept()
              threading.Thread(target=serve, args=(c,), daemon=True).start()
          P
          python3 "$W/fake.py" &
          cat > "$W/client.json" <<J
          {"log":{"loglevel":"debug","access":"none","error":"$W/client.log"},
           "inbounds":[{"listen":"127.0.0.1","port":18091,"protocol":"dokodemo-door","settings":{"address":"127.0.0.1","port":18090,"network":"tcp"}}],
           "outbounds":[{"protocol":"vless","settings":{"vnext":[{"address":"127.0.0.1","port":18444,"users":[{"id":"6a3c0e5e-6f1a-4d55-9d2a-8c1f0b2e7d41","encryption":"none"}]}]},
            "streamSettings":{"network":"tcp","tcpSettings":{"header":{"type":"http","request":{"path":["/"]}}}}}]}
          J
          "$X" run -c "$W/client.json" > "$W/client.out" 2>&1 &
          for i in $(seq 100); do (exec 3<>/dev/tcp/127.0.0.1/18091) 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/18444) 2>/dev/null && break; sleep 0.1; done
          sleep 0.5
          rc=0
          timeout 15 "$T" halfclose -raw 127.0.0.1:18091 -size 300000 || rc=1
          N=$(grep -c "VLESS downlink splice" "$W/client.log")
          case ${EXPECT:-} in yes) [ "$N" -gt 0 ] || { echo "FAIL the urgent-data test did not take the zero-copy path"; rc=1; } ;; esac
          echo "RESULT variant=urgent zero_copy_connections=$N"
          [ $rc = 0 ] && rm -rf "$W" || echo "logs kept in $W"
          exit $rc
          E2EURG
          chmod +x "$X/run.sh" "$X/urg.sh"
          (cd "$X/tool-src" && GOFLAGS= "$GO" build -o "$X/e2etool" .) > "$O/build-e2etool.txt" 2>&1 \
            || untested "the test tool does not build: out/08c-xray-splice/build-e2etool.txt"
          export TMPDIR="$X"
          e2e() {   # name, command; one retry (a busy runner can miss a 1 s timer once)
            local name=$1; shift
            if timeout 900 "$@" > "$O/$name.txt" 2>&1 || { echo "--- retry" >> "$O/$name.txt"; timeout 900 "$@" >> "$O/$name.txt" 2>&1; }; then
              pass "xray end-to-end $name: $(grep RESULT "$O/$name.txt" | tail -n1 | cut -d' ' -f2-)"
            else
              grep -E "FAIL|logs kept" "$O/$name.txt" | head -n 8 || true
              for d in $(sed -n 's/^logs kept in //p' "$O/$name.txt"); do cp -r "$d" "$O/$name-logs" 2>/dev/null || true; done
              off "the patched xray failed the end-to-end test $name: $(grep -m1 FAIL "$O/$name.txt" | tr -cd '[:print:]' | cut -c1-160 || true) (out/08c-xray-splice/$name.txt)"
            fi
          }
          e2e vless-tcp-http-header env EXPECT=yes "$X/run.sh" "$X/xray-patched" http full
          e2e vless-tcp-no-header env EXPECT=yes "$X/run.sh" "$X/xray-patched" none full
          e2e vless-tls-normal-path env EXPECT=no "$X/run.sh" "$X/xray-patched" tls quick
          e2e vless-mux-normal-path env EXPECT=no "$X/run.sh" "$X/xray-patched" mux quick
          e2e switched-off env EXPECT=no XRAY_VLESS_SPLICE=off "$X/run.sh" "$X/xray-patched" http quick
          e2e urgent-data env EXPECT=yes "$X/urg.sh" "$X/xray-patched"
          # what it saves: CPU of the client xray (the router's role) per GB downloaded
          for k in stock patched; do GOMAXPROCS=1 GOGC=200 "$X/run.sh" "$X/xray-$k" http cpu > "$O/cpu-$k.txt" 2>&1 || true; done
          CS=$(sed -n 's/^RESULT cpu_user=\([0-9.]*\) cpu_kernel=\([0-9.]*\).*/\1 s user + \2 s kernel/p' "$O/cpu-stock.txt")
          CP=$(sed -n 's/^RESULT cpu_user=\([0-9.]*\) cpu_kernel=\([0-9.]*\).*/\1 s user + \2 s kernel/p' "$O/cpu-patched.txt")
          pass "xray CPU per GB downloaded on this runner: stock ${CS:-?}, patched ${CP:-?}"
          keep "tested on the runner with $("$GO" version | cut -d' ' -f3) (CPU per GB: stock ${CS:-?}, patched ${CP:-?})"

      - name: "9. Config + verify device selection"
        run: |
          source ./ci-lib.sh
          cd openwrt
          cat > .config <<'CFG'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mx2000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_ubi-utils=y
          CONFIG_PACKAGE_ethtool=y
          CFG
          for pkg in ${{ inputs.extra_packages || 'luci-app-v2raya' }}; do echo "CONFIG_PACKAGE_$pkg=y" >> .config; done
          if [ "${{ inputs.net_tuning != false }}" = "true" ]; then echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config; fi
          # downloads.openwrt.org has no 24.10 ipq50xx target (the target comes from main), so opkg update fails on
          # that feed line; packages (base/luci/packages/...) work. kmods come from the kmod feed of this build (kmod_feed).
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/98-mx2000-distfeeds <<'DISTF'
          sed -i '/\/targets\/qualcommax\/ipq50xx\//s/^src/# src/' /etc/opkg/distfeeds.conf 2>/dev/null
          exit 0
          DISTF
          check "uci-defaults comments out the missing ipq50xx target feed" grep -q 'targets' files/etc/uci-defaults/98-mx2000-distfeeds
          if [ "${{ inputs.perf_tools != false }}" = "true" ]; then printf 'CONFIG_KERNEL_PERF_EVENTS=y\nCONFIG_KERNEL_KALLSYMS=y\nCONFIG_PACKAGE_perf=y\n' >> .config; fi
          if [ "${{ inputs.perf_tools != false }}" = "true" ]; then
            # one command on the router: start it, start a speed test, get the busiest functions per CPU
            mkdir -p files/usr/bin
            cat > files/usr/bin/mx2000-perf <<'MXPERF'
          #!/bin/sh
          # mx2000-perf [lines]: which functions use the CPU during a download through the VPN
          echo -1 > /proc/sys/kernel/perf_event_paranoid; echo 0 > /proc/sys/kernel/kptr_restrict
          echo ">>> start the speed test now (recording starts in 6 s and lasts 12 s)"
          sleep 6
          perf record -a -F 499 -o /tmp/perf.data -- sleep 12 > /dev/null 2>&1 || { echo "perf record failed"; exit 1; }
          echo "=== busiest functions, both CPUs"
          perf report -i /tmp/perf.data --stdio --no-children --sort comm,dso,sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -n "${1:-50}"
          for c in 0 1; do
          	echo "=== cpu$c"
          	perf report -i /tmp/perf.data --stdio --no-children --cpu $c --sort sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -n 15
          done
          rm -f /tmp/perf.data
          MXPERF
            chmod 755 files/usr/bin/mx2000-perf
            sh -n files/usr/bin/mx2000-perf
          fi
          make defconfig > ../out/09-defconfig.txt 2>&1
          check "target ipq50xx selected" grep -qx 'CONFIG_TARGET_qualcommax_ipq50xx=y' .config
          check "device MX2000 selected" grep -qx 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mx2000=y' .config
          check "profile is MX2000" grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_linksys_mx2000"' .config
          check "ipq-wifi MX2000 package selected" grep -qx 'CONFIG_PACKAGE_ipq-wifi-linksys_mx2000=y' .config
          check "luci selected" grep -qx 'CONFIG_PACKAGE_luci=y' .config
          check "ath11k-ahb selected" grep -qx 'CONFIG_PACKAGE_kmod-ath11k-ahb=y' .config
          check "uboot-envtools selected" grep -qx 'CONFIG_PACKAGE_uboot-envtools=y' .config
          check "ethtool selected (ethtool -S eth0 shows the GMAC drop counter)" grep -qx 'CONFIG_PACKAGE_ethtool=y' .config
          soft "initramfs image enabled" grep -qx 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config
          for pkg in ${{ inputs.extra_packages || 'luci-app-v2raya' }}; do check "extra package selected: $pkg" grep -qx "CONFIG_PACKAGE_$pkg=y" .config; done
          if grep -qx 'CONFIG_PACKAGE_luci-app-v2raya=y' .config; then
            for dep in v2raya kmod-nft-tproxy xray-core; do check "v2rayA dependency built into the image: $dep" grep -qx "CONFIG_PACKAGE_$dep=y" .config; done
          fi
          if [ "${{ inputs.net_tuning != false }}" = "true" ]; then check "BBR module selected (kmod-tcp-bbr)" grep -qx 'CONFIG_PACKAGE_kmod-tcp-bbr=y' .config; fi
          if [ "${{ inputs.perf_tools != false }}" = "true" ]; then
            check "kernel performance events on (KERNEL_PERF_EVENTS)" grep -qx 'CONFIG_KERNEL_PERF_EVENTS=y' .config
            check "perf tool selected" grep -qx 'CONFIG_PACKAGE_perf=y' .config
            soft "kernel symbols on (KALLSYMS, perf shows function names)" grep -qx 'CONFIG_KERNEL_KALLSYMS=y' .config
          fi
          if [ "${{ inputs.kmod_feed != false }}" = "true" ]; then
            # kmod feed: every kmod is built WITH this image (same kernel config = same vermagic); opkg installs them later
            cp .config .config.no-kmods
            printf 'CONFIG_ALL_KMODS=y\nCONFIG_PACKAGE_curl=y\n' >> .config
            make defconfig > ../out/09-defconfig-kmods.txt 2>&1
            check "kmod feed: every kmod selected (ALL_KMODS)" grep -qx 'CONFIG_ALL_KMODS=y' .config
            NM=$(grep -c '^CONFIG_PACKAGE_kmod-.*=m$' .config || true)
            check "kmod feed: $NM kmods built next to the image" test "$NM" -ge 150
            check "kmod feed: curl in the image (mx2000-kmods downloads the feed with it)" grep -qx 'CONFIG_PACKAGE_curl=y' .config
            comm -13 <(grep '^CONFIG_PACKAGE_.*=y$' .config.no-kmods | sort) <(grep '^CONFIG_PACKAGE_.*=y$' .config | sort) > ../out/09-kmods-image-added.txt
            comm -23 <(grep '^CONFIG_PACKAGE_.*=y$' .config.no-kmods | sort) <(grep '^CONFIG_PACKAGE_.*=y$' .config | sort) > ../out/09-kmods-image-removed.txt
            check "kmod feed: no package left the image" test ! -s ../out/09-kmods-image-removed.txt
            echo "image packages added with the kmod feed: $(sed 's/^CONFIG_PACKAGE_//; s/=y$//' ../out/09-kmods-image-added.txt | tr '\n' ' ')"
            soft "kmod feed: only curl (+ its libraries) added to the image" sh -c "! grep -vE '^CONFIG_PACKAGE_(curl|libcurl|libnghttp2|libmbedtls|libwolfssl|libopenssl|ca-bundle|zlib)' ../out/09-kmods-image-added.txt | grep -q ."
            # a missing module of a kmod that is only built for the feed (=m) is reported and that kmod stays out of
            # the feed, instead of stopping the whole build (=y kmods of the image still stop it)
            python3 - include/kernel.mk <<'PYKMK'
          import sys
          p = sys.argv[1]; s = open(p).read()
          a = '''		  @for mod in $$(call version_filter,$$(FILES)); do \\
          '''
          b = '''		  @rm -f $(STAGING_DIR)/kmod-missing/kmod-$(1); for mod in $$(call version_filter,$$(FILES)); do \\
          '''
          assert s.count(a) == 1, 'for-loop line'
          s = s.replace(a, b)
          a = '''				echo "ERROR: module '$$$$$$$$mod' is missing." >&2; \\
          				exit 1; \\
          '''
          b = '''				$(if $(filter y,$(CONFIG_PACKAGE_kmod-$(1))),echo "ERROR: module '$$$$$$$$mod' is missing." >&2; exit 1;,echo "WARNING: module '$$$$$$$$mod' is missing: kmod-$(1) stays out of the kmod feed" >&2; mkdir -p $(STAGING_DIR)/kmod-missing; touch $(STAGING_DIR)/kmod-missing/kmod-$(1);) \\
          '''
          assert s.count(a) == 1, 'missing-module lines'
          s = s.replace(a, b)
          a = '''		@echo "WARNING: kmod-$(1) is not available in the kernel config - generating empty package" >&2
          '''
          b = '''		@echo "WARNING: kmod-$(1) is not available in the kernel config - generating empty package" >&2
          		@mkdir -p $(STAGING_DIR)/kmod-missing; touch $(STAGING_DIR)/kmod-missing/kmod-$(1)
          '''
          assert s.count(a) == 1, 'disabled rule'
          s = s.replace(a, b)
          open(p, 'w').write(s)
          PYKMK
            check "kernel.mk: a missing module of a feed-only kmod no longer stops the build" grep -q 'stays out of the kmod feed' include/kernel.mk
            git add include/kernel.mk && git -c user.email=ci@local -c user.name=ci commit -q -m "kmod feed: missing modules of feed-only kmods are reported, not fatal" || true
            mkdir -p files/usr/bin files/etc/init.d
            cat > files/usr/bin/mx2000-kmods <<'MXKMODS'
          #!/bin/sh
          # mx2000-kmods: an opkg feed with every kmod of THIS firmware build (same kernel, signed with the key this
          # firmware trusts), so "opkg install kmod-..." works like on an official OpenWrt release.
          #   mx2000-kmods token <github token>   once: a read-only token for the private build repo (kept on /mnt/syscfg,
          #                                       so it survives flashing a new build)
          #   mx2000-kmods                        download this build's kmod feed and add it to opkg
          #   mx2000-kmods <file.tar>             the same from mx2000-kmods.tar already copied to the router
          #   mx2000-kmods status                 what is set up
          #   mx2000-kmods remove                 delete the feed (frees the space)
          # After a new build is flashed the feed of that build is fetched at boot by itself (when a token is saved).
          CONF=${MX2000_KMODS_CONF:-/etc/mx2000-kmods.conf}
          CF=${MX2000_KMODS_FEEDS:-/etc/opkg/customfeeds.conf}
          PERS=${MX2000_KMODS_PERS:-/mnt/syscfg}
          RAMD=${MX2000_KMODS_RAM:-/tmp/mx2000-kmods}
          KEYS=${MX2000_KMODS_KEYS:-/etc/opkg/keys}
          NAME=mx2000_kmods
          ASSET=mx2000-kmods.tar
          TMPD=
          AUTO=

          . "$CONF" 2>/dev/null
          [ -n "$REPO" ] && [ -n "$TAG" ] || { echo "mx2000-kmods: $CONF is missing (this firmware was built without the kmod feed)" >&2; exit 1; }

          log() { if [ -n "$AUTO" ]; then logger -t mx2000-kmods "$*"; else echo "$*"; fi; }
          die() { log "mx2000-kmods: $*"; [ -n "$TMPD" ] && rm -rf "$TMPD"; exit "${RC:-1}"; }
          persistent() { grep -q " $PERS ubifs " /proc/mounts 2>/dev/null || [ -n "$MX2000_KMODS_PERS" ]; }
          tokfile() { if persistent; then echo "$PERS/.mx2000-kmods-token"; else echo /etc/mx2000-kmods.token; fi; }
          kernel_now() { opkg status kernel 2>/dev/null | sed -n 's/^Version: //p' | head -n 1; }
          feed_dir() { sed -n "s|^src/gz $NAME file://||p" "$CF" 2>/dev/null | head -n 1; }
          feed_tag() { sed -n 's/^TAG=//p' "$1/.mx2000" 2>/dev/null; }
          set_feed() {
          	[ -f "$CF" ] && sed -i "/^src\/gz $NAME /d" "$CF"
          	[ -n "$1" ] && echo "src/gz $NAME file://$1" >> "$CF"
          	return 0
          }
          ready() { local d; d=$(feed_dir); [ -n "$d" ] && [ -s "$d/Packages.gz" ] && [ "$(feed_tag "$d")" = "$TAG" ]; }
          kb_free() { df -k "$1" 2>/dev/null | awk 'NR == 2 {print $4}'; }

          # drop a feed that is gone (it was in RAM) or belongs to another build (flashed since): opkg would fail on it
          cleanup() {
          	local d
          	# a feed left on $PERS by an older build (also when flashed without keeping the settings)
          	if persistent && [ -d "$PERS/kmods" ] && [ "$(feed_tag "$PERS/kmods")" != "$TAG" ]; then
          		rm -rf "$PERS/kmods"
          		log "removed the kmod feed of another build ($PERS/kmods)"
          	fi
          	d=$(feed_dir)
          	[ -n "$d" ] || return 0
          	if [ ! -s "$d/Packages.gz" ]; then
          		set_feed ""
          	elif [ "$(feed_tag "$d")" != "$TAG" ]; then
          		set_feed ""
          		rm -rf "$d"
          		log "removed the kmod feed of another build ($d)"
          	fi
          	return 0
          }

          install_tar() {   # $1 = mx2000-kmods.tar
          	local need dir k t old
          	tar -tf "$1" 2>/dev/null | grep -q '^kmods/Packages.sig$' || die "$1 is not a kmod feed ($ASSET)"
          	cleanup
          	need=$(( $(wc -c < "$1") / 1024 + 4096 ))
          	dir=$RAMD
          	if persistent; then
          		[ "$(feed_dir)" = "$PERS/kmods" ] && rm -rf "$PERS/kmods" && set_feed ""
          		[ "$(kb_free "$PERS")" -gt "$need" ] 2>/dev/null && dir=$PERS/kmods
          	fi
          	if [ "$dir" = "$RAMD" ]; then
          		[ -n "$AUTO" ] && RC=0 die "not enough space on $PERS for the kmod feed ($((need / 1024)) MB): run mx2000-kmods by hand to keep it in RAM until the next reboot"
          		log "not enough space on $PERS: the feed is kept in RAM until the next reboot"
          	fi
          	rm -rf "$dir.new" && mkdir -p "$dir.new" || die "cannot write $dir.new"
          	tar -xf "$1" -C "$dir.new" 2>/dev/null || { rm -rf "$dir.new"; die "extracting the feed failed (no space?)"; }
          	t=$(feed_tag "$dir.new/kmods")
          	[ "$t" = "$TAG" ] || { rm -rf "$dir.new"; die "this feed is from another build ($t), this firmware is $TAG"; }
          	k=$(sed -n 's/^KERNEL=//p' "$dir.new/kmods/.mx2000")
          	[ "$k" = "$(kernel_now)" ] || { rm -rf "$dir.new"; die "kernel mismatch: feed $k, router $(kernel_now)"; }
          	usign -V -q -m "$dir.new/kmods/Packages" -x "$dir.new/kmods/Packages.sig" -P "$KEYS" || { rm -rf "$dir.new"; die "the feed signature does not verify with this firmware's keys"; }
          	old=$(feed_dir)
          	rm -rf "$dir" && mv "$dir.new/kmods" "$dir" && rm -rf "$dir.new" || die "cannot move the feed to $dir"
          	set_feed "$dir"
          	[ -n "$old" ] && [ "$old" != "$dir" ] && rm -rf "$old"
          	log "kmod feed ready: $(grep -c '^Package: ' "$dir/Packages") kmods in $dir"
          }

          fetch() {
          	local tok h j id sz rc
          	command -v curl > /dev/null || die "curl is missing"
          	tok=$(cat "$(tokfile)" 2>/dev/null)
          	# public repo: no token needed; private repo: mx2000-kmods token <token>
          	if [ -n "$tok" ]; then h="Authorization: Bearer $tok"; else h="X-No-Token: 1"; fi
          	j=$(curl -fsS --retry 3 --connect-timeout 15 -H "$h" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/tags/$TAG" 2>&1)
          	rc=$?
          	if [ $rc -ne 0 ]; then
          		# HTTP errors (22: 401/404) will not fix themselves; network errors are retried at boot
          		[ $rc -eq 22 ] && [ -z "$tok" ] && RC=$([ -n "$AUTO" ] && echo 0 || echo 1) die "release $TAG not found in $REPO (private repo? then once: mx2000-kmods token <github token>; or this build did not publish its kmod feed)"
          		[ $rc -eq 22 ] && RC=$([ -n "$AUTO" ] && echo 0 || echo 1) die "release $TAG not found in $REPO (wrong/expired token, or this build did not publish its kmod feed)"
          		die "GitHub not reachable ($j)"
          	fi
          	id=$(echo "$j" | jsonfilter -e '@.assets[@.name="mx2000-kmods.tar"].id' 2>/dev/null)
          	sz=$(echo "$j" | jsonfilter -e '@.assets[@.name="mx2000-kmods.tar"].size' 2>/dev/null)
          	[ -n "$id" ] && [ -n "$sz" ] || RC=0 die "release $TAG has no $ASSET"
          	[ "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" -gt $((sz / 1024 + 65536)) ] || die "not enough free RAM to download $((sz / 1048576)) MB"
          	TMPD=$(mktemp -d /tmp/mx2000-kmods.XXXXXX) || die "no /tmp"
          	log "downloading the kmod feed of this build ($((sz / 1048576)) MB)..."
          	curl -fsSL --retry 3 --connect-timeout 15 -H "$h" -H 'Accept: application/octet-stream' -o "$TMPD/$ASSET" "https://api.github.com/repos/$REPO/releases/assets/$id" || die "download failed"
          	[ "$(wc -c < "$TMPD/$ASSET")" -eq "$sz" ] || die "download incomplete"
          	install_tar "$TMPD/$ASSET"
          	rm -rf "$TMPD"
          }

          case "$1" in
          token)
          	[ -n "$2" ] || die "usage: mx2000-kmods token <github token>"
          	f=$(tokfile)
          	umask 077
          	echo "$2" > "$f" || die "cannot write $f"
          	if command -v curl > /dev/null && curl -fsS -o /dev/null --connect-timeout 15 -H "Authorization: Bearer $2" "https://api.github.com/repos/$REPO"; then
          		echo "token saved in $f and it can read $REPO"
          	else
          		echo "token saved in $f, but it could not read $REPO now (wrong token, or no internet?)"
          	fi
          	;;
          status)
          	echo "build:  $TAG ($REPO)"
          	echo "kernel: $(kernel_now)"
          	if ready; then echo "feed:   $(feed_dir) ($(grep -c '^Package: ' "$(feed_dir)/Packages") kmods, $(du -sh "$(feed_dir)" | cut -f1))"
          	else echo "feed:   not set up (run mx2000-kmods)"; fi
          	if [ -s "$(tokfile)" ]; then echo "token:  saved ($(tokfile))"; else echo "token:  none"; fi
          	persistent && echo "space:  $(($(kb_free "$PERS") / 1024)) MB free on $PERS"
          	;;
          remove)
          	d=$(feed_dir)
          	set_feed ""
          	[ -n "$d" ] && rm -rf "$d" && echo "removed $d"
          	;;
          auto)
          	# at boot: quiet, persistent storage only; exit 0 = nothing (more) to do, 1 = try again later
          	AUTO=1
          	cleanup
          	ready && exit 0
          	fetch
          	;;
          "")
          	cleanup
          	if ready; then echo "kmod feed of this build is already set up: $(feed_dir)"
          	else fetch || exit 1
          	fi
          	opkg update > /dev/null 2>&1
          	echo "now: opkg install kmod-<name>   (opkg list 'kmod-*' shows them all)"
          	;;
          -h|--help|help)
          	sed -n '2,10p' "$0" | sed 's/^# \{0,1\}//'
          	;;
          *)
          	[ -f "$1" ] || die "no such file: $1 (mx2000-kmods help)"
          	install_tar "$1"
          	opkg update > /dev/null 2>&1
          	echo "now: opkg install kmod-<name>"
          	;;
          esac
          MXKMODS
            cat > files/etc/init.d/mx2000-kmods <<'MXKINIT'
          #!/bin/sh /etc/rc.common
          # kmod feed of this build (mx2000-kmods): drop a stale opkg line after a reboot/flash, and with a saved
          # token fetch the feed of a newly flashed build by itself (retries while the internet comes up).
          START=99

          boot() {
          	( i=0
          	  while [ $i -lt 20 ]; do
          		/usr/bin/mx2000-kmods auto && exit 0
          		i=$((i + 1)); sleep 30
          	  done ) > /dev/null 2>&1 &
          }

          start() {
          	return 0
          }
          MXKINIT
            chmod 755 files/usr/bin/mx2000-kmods files/etc/init.d/mx2000-kmods
            mkdir -p files/lib/upgrade/keep.d && echo /etc/mx2000-kmods.token > files/lib/upgrade/keep.d/mx2000-kmods   # token when /mnt/syscfg is off
            sh -n files/usr/bin/mx2000-kmods
            KTAG="kmods-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            printf 'REPO=%s\nTAG=%s\n' "$GITHUB_REPOSITORY" "$KTAG" > files/etc/mx2000-kmods.conf
            check "kmod feed: the firmware knows its feed ($KTAG)" grep -qx "TAG=$KTAG" files/etc/mx2000-kmods.conf
            cat > "$GITHUB_WORKSPACE/kmods-off.sh" <<'KOFF'
          #!/bin/bash
          # the firmware never waits for a kmod: go back to the config without the kmod feed
          cd "$GITHUB_WORKSPACE/openwrt" || exit 1
          [ -f .config.no-kmods ] && grep -qx 'CONFIG_ALL_KMODS=y' .config || exit 1
          echo "::warning::kmod feed dropped: $1"
          cp .config.no-kmods .config
          make defconfig > "$GITHUB_WORKSPACE/out/kmods-off-defconfig.txt" 2>&1 || exit 1
          rm -f files/usr/bin/mx2000-kmods files/etc/init.d/mx2000-kmods files/etc/mx2000-kmods.conf
          echo "KMOD_FEED=off" >> "$GITHUB_ENV"
          echo "- **WARN** kmod feed dropped ($1): this firmware is built without it (no opkg kmods for this build; see the stage logs)" >> "$GITHUB_WORKSPACE/out/summary.md"
          exit 0
          KOFF
            chmod 755 "$GITHUB_WORKSPACE/kmods-off.sh"
            echo "KMOD_FEED=on" >> "$GITHUB_ENV"
            echo "KTAG=$KTAG" >> "$GITHUB_ENV"
            echo "- **KMODS** $NM kmods are built with this image for its opkg feed ($KTAG)" >> "$SUMMARY"
          fi

      - name: "9b. Compute kernel/wifi cache key"
        id: bkey
        run: |
          cd openwrt
          H=$( { for d in target/linux package/kernel/mac80211 package/kernel/linux package/firmware package/boot include scripts toolchain tools; do echo "$d $(git rev-parse HEAD:$d)"; done; grep -v '^#' .config; } | sha256sum | cut -c1-24)
          echo "source+config hash: $H"
          echo "prefix=mx2000-target-${TAG}-${IMG}-v1-${H}-" >> "$GITHUB_OUTPUT"

      - name: "9c. Restore kernel/wifi build cache"
        id: cacheB
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/build_dir/target-*
            openwrt/staging_dir/target-*
            openwrt/bin
          key: ${{ steps.bkey.outputs.prefix }}kw
          restore-keys: |
            ${{ steps.bkey.outputs.prefix }}k

      - name: "9d. Align source timestamps with the restored kernel/wifi cache"
        if: ${{ steps.cacheB.outputs.cache-matched-key != '' }}
        run: |
          cd openwrt
          echo "restored: ${{ steps.cacheB.outputs.cache-matched-key }}"
          # المحتوى مطابق للكاش (المفتاح مبني على hash المصدر)، فنخلي هذي الملفات قديمة حتى ما يعيد make تطبيق الباتشات
          for d in target/linux package/kernel/mac80211 package/kernel/linux package/firmware package/boot; do
            git ls-files -z -- "$d" | xargs -0 -r touch -h -d '2020-01-01 00:00:00'
          done
          echo "- **CACHE** kernel/wifi build restored (${{ steps.cacheB.outputs.cache-matched-key }})" >> ../out/summary.md

      - name: "10. Host tools"
        run: |
          cd openwrt
          T0=$(date +%s)
          make -j"$(nproc)" tools/install > ../out/10-tools.log 2>&1 || { tail -n 60 ../out/10-tools.log; exit 1; }
          echo $(( $(date +%s) - T0 )) > ../out/10-tools-seconds.txt

      # ------------------------------------------------------------------
      - name: "11. Kernel patches + DTS compile + driver check (fast)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          ../stage.sh kernel-prepare target/linux/prepare
          cd "$GITHUB_WORKSPACE/openwrt"
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.* | head -n1)
          check "kernel dir found ($KDIR)" test -d "$KDIR"
          DTS="$KDIR/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts"
          check "MX2000 dts copied into kernel tree" test -f "$DTS"
          check "kernel has SPI_QPIC_SNAND driver (spi-qpic-snand.c + Kconfig)" sh -c "test -f '$KDIR/drivers/spi/spi-qpic-snand.c' && grep -q 'config SPI_QPIC_SNAND' '$KDIR/drivers/spi/Kconfig'"
          check "kernel supports the DT property bootargs-append (adds root=/dev/ubiblock0_0)" grep -rq 'bootargs-append' "$KDIR/drivers/of" "$KDIR/arch/arm64/kernel"
          check "UBI block auto-creation for the rootfs volume is patched in" grep -rqE 'ubiblock.*rootfs|"rootfs"' "$KDIR/drivers/mtd/ubi/block.c"
          soft "kernel has a PWM driver for ipq5018 (LEDs are PWM-only on MX2000)" grep -rqE 'qcom,ipq5018-pwm|qcom,ipq6018-pwm' "$KDIR/drivers/pwm"
          check "kernel has NVMEM ascii-env layout" sh -c "grep -q 'config NVMEM_LAYOUT_ASCII_ENV' '$KDIR/drivers/nvmem/layouts/Kconfig'"
          # RISK: سلسلة الـ MAC كاملة (devinfo -> ascii-env layout -> mac-base cell -> gmac)
          echo "--- files in the kernel tree that mention mac-base ---"
          grep -rl 'mac-base' "$KDIR/drivers/nvmem" "$KDIR/net/ethernet" "$KDIR/include/linux" 2>/dev/null | tee ../out/11-mac-base-files.txt || true
          # بدون هذي الدالة ascii-env.c ما ينبني (compile error)، وبدون ascii_read ما يقرأ hw_mac_addr (نص ASCII بطول 17)
          check "nvmem knows 'mac-base' cells somewhere in drivers/nvmem or include (needed by hw_mac_addr)" test -s ../out/11-mac-base-files.txt
          check "nvmem_layout_parse_mac_base exists (ascii-env.c calls it; 809-01 applied)" sh -c "grep -rq 'nvmem_layout_parse_mac_base' '$KDIR/include' '$KDIR/drivers/nvmem'"
          soft "nvmem mac-base code handles raw_len (ASCII MAC text -> 6 bytes)" sh -c "grep -rq 'raw_len' '$KDIR/drivers/nvmem' '$KDIR/include/linux'"
          check "ascii-env layout driver matches ascii-eq-delim-env" grep -rq 'ascii-eq-delim-env' "$KDIR/drivers/nvmem/layouts"
          check "spi-qpic-snand matches qcom,ipq9574-snand (DTS fallback compatible)" grep -q 'qcom,ipq9574-snand' "$KDIR/drivers/spi/spi-qpic-snand.c"

          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
            -I "$KDIR/arch/arm64/boot/dts" -I "$KDIR/arch/arm64/boot/dts/qcom" \
            -I "$KDIR/include" -I "$KDIR/scripts/dtc/include-prefixes" \
            "$DTS" -o /tmp/mx2000.pp.dts 2> ../out/11-cpp-errors.txt \
            || { tail -n 30 ../out/11-cpp-errors.txt; fail "preprocessing MX2000 dts failed"; }
          dtc -I dts -O dtb -o /tmp/mx2000.dtb \
            -W no-unit_address_vs_reg -W no-simple_bus_reg -W no-unique_unit_address -W no-avoid_unnecessary_addr_size \
            /tmp/mx2000.pp.dts 2> ../out/11-dtc-warnings.txt \
            || { tail -n 40 ../out/11-dtc-warnings.txt; fail "dtc failed: MX2000 dts has errors (missing label/node?)"; }
          pass "MX2000 dts compiles with dtc"
          dtc -I dtb -O dts /tmp/mx2000.dtb > ../out/11-mx2000-decompiled.dts 2>/dev/null
          check "dtb compatible = linksys,mx2000" grep -q 'linksys,mx2000' ../out/11-mx2000-decompiled.dts
          soft "ath11k calibration variant present" grep -q 'calibration-variant' ../out/11-mx2000-decompiled.dts
          check "compiled DTB: fw-memory-mode 1 on both radios" test "$(grep -cE 'qcom,ath11k-fw-memory-mode = <(0x0*1|1)>;' ../out/11-mx2000-decompiled.dts)" -eq 2
          if [ "${{ inputs.syscfg_storage != false }}" = "true" ]; then
            check "compiled DTB: syscfg partition writable (extra storage)" python3 -c "import sys; s = open(sys.argv[1]).read(); i = s.index('label = \"syscfg\";'); n = s[s.rindex('{', 0, i):s.index('};', i)]; sys.exit('read-only' in n)" ../out/11-mx2000-decompiled.dts
            check "compiled DTB: kernel, rootfs, alt_kernel, alt_rootfs untouched" test "$(grep -cE 'label = \"(kernel|rootfs|alt_kernel|alt_rootfs)\";' ../out/11-mx2000-decompiled.dts)" -eq 4
          fi

          # كل compatible بالـDTS لازم يكون له driver بالنواة (بعد تطبيق الباتشات)
          grep -E '^[[:space:]]*compatible' ../out/11-mx2000-decompiled.dts | sed 's/\\0/", "/g' | grep -oE '"[^"]+"' | sort -u > /tmp/compats.txt
          grep -rhoF -f /tmp/compats.txt "$KDIR/drivers" "$KDIR/sound" "$KDIR/kernel" 2>/dev/null | sort -u > /tmp/found.txt
          comm -23 /tmp/compats.txt /tmp/found.txt > ../out/11-compatibles-without-driver.txt
          # هذي تتوفر من modules خارجية (qca-ssdk / nss-dp / ath11k) ويتحقق منها الخطوة 17
          M=$(grep -vc -E '"linksys,|"qcom,ipq5018"$|"qcom,ess-switch-ipq50xx"|"qcom,ess-uniphy"|"qcom,nss-dp|"qcom,qcn6122-wifi"|"ethernet-phy-id|"arm,cortex-a53"|"syscon"|"simple-mfd"' ../out/11-compatibles-without-driver.txt || true)
          if [ "$M" -eq 0 ]; then pass "every DTS compatible has a driver string in the kernel"
          else echo "- **INFO** $M DTS compatibles not matched inside the kernel tree yet (out-of-tree drivers and fallback lists are resolved in step 17)" >> "$SUMMARY"; fi

      # ------------------------------------------------------------------
      # 6.6.144 (stable) أضاف استخدامين لـ props->qpic_v2 بملف qcom_nandc.c،
      # بينما باتشات سلسلة SNAND غيّرت اسم الحقل بالـstruct. نكتشف الاسم الجديد من الـheader ونصلح.
      - name: "11b. Fix QPIC field rename (stable 6.6.144 vs SNAND series)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.* | head -n1)
          F="$KDIR/drivers/mtd/nand/raw/qcom_nandc.c"
          check "qcom_nandc.c present" test -f "$F"
          PH=$(grep -rlE '^struct qcom_nandc_props[[:space:]]*\{' "$KDIR/include" "$KDIR/drivers/mtd" "$KDIR/drivers/spi" 2>/dev/null | head -n1)
          check "qcom_nandc_props definition found" test -n "$PH"
          awk '/^struct qcom_nandc_props[[:space:]]*\{/{f=1; next} f && /^\};/{f=0} f' "$PH" > ../out/11b-props-struct.txt
          cat ../out/11b-props-struct.txt
          if grep -qE '\bqpic_v2\b' ../out/11b-props-struct.txt; then
            pass "struct still has qpic_v2, nothing to fix"
          else
            NEW=$(grep -oE '\bqpic_[a-z0-9_]+' ../out/11b-props-struct.txt | sort -u)
            check "exactly one qpic_* member in struct (got: $NEW)" test "$(echo "$NEW" | wc -w)" -eq 1
            if ! grep -q 'props->qpic_v2' "$F"; then
              pass "already renamed to props->$NEW (kernel tree restored from cache)"
            else
            cp "$F" /tmp/qcom_nandc.c.orig
            sed -i -E "s/(props->)qpic_v2\b/\1$NEW/g" "$F"
            diff -u /tmp/qcom_nandc.c.orig "$F" > ../out/11b-qpic-fix.diff || true
            check "qpic_v2 uses were rewritten" test -s ../out/11b-qpic-fix.diff
            check "no leftover props->qpic_v2" sh -c "! grep -q 'props->qpic_v2' '$F'"
            pass "renamed props->qpic_v2 to props->$NEW in qcom_nandc.c"
            fi
          fi
          grep -rn --include='*.c' --include='*.h' '\bqpic_v2\b' "$KDIR/drivers" "$KDIR/include" > ../out/11b-leftover-qpic_v2.txt || true
          L=$(wc -l < ../out/11b-leftover-qpic_v2.txt)
          if [ "$L" -eq 0 ]; then pass "no other qpic_v2 users left"; else warn "$L other qpic_v2 references (11b-leftover-qpic_v2.txt)"; fi

      - name: "12-pre. Toolchain sanity (host tools, env, no binutils hack)"
        run: |
          source ./ci-lib.sh
          cd openwrt
          gcc --version | head -n1; ld --version | head -n1; make --version | head -n1
          echo "--- env flags that could leak into the toolchain build ---"
          env | grep -E '^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|CC|CXX|LD)=' || echo "none"
          check "no CFLAGS/LDFLAGS leaking from env" sh -c "! env | grep -qE '^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS)='"
          check "no _LARGEFILE64_SOURCE hack in toolchain/binutils" sh -c "! grep -rq '_LARGEFILE64_SOURCE' toolchain/binutils"
          check "git tree clean for toolchain/" test -z "$(git status --porcelain toolchain)"

      - name: "12. Toolchain"
        timeout-minutes: 100
        env:
          CACHE_A_HIT: ${{ steps.cacheA.outputs.cache-hit }}
        run: |
          if [ "$CACHE_A_HIT" = "true" ]; then
            if ! STAGE_NO_RETRY=1 ./stage.sh toolchain toolchain/install; then
              echo "::warning::toolchain failed on top of the restored cache; wiping tools+toolchain and rebuilding from scratch (bump -v3 in the base cache key afterwards)"
              echo "- **WARN** base cache was bad: tools+toolchain rebuilt from scratch" >> out/summary.md
              (cd openwrt && rm -rf build_dir/host build_dir/hostpkg build_dir/toolchain-* staging_dir/host staging_dir/hostpkg staging_dir/toolchain-*)
              (cd openwrt && make -j"$(nproc)" tools/install > ../out/12-tools-fresh.log 2>&1) || { tail -n 60 out/12-tools-fresh.log; exit 1; }
              ./stage.sh toolchain-fresh toolchain/install
            fi
          else
            ./stage.sh toolchain toolchain/install
          fi

      - name: "12b. Save base cache (host tools + toolchain + downloads)"
        if: ${{ steps.cacheA.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
            openwrt/dl
          key: mx2000-base-${{ env.TAG }}-${{ env.IMG }}-v3

      - name: "13. Kernel compile + verify kernel config"
        timeout-minutes: 90
        env:
          CACHE_B_MATCH: ${{ steps.cacheB.outputs.cache-matched-key }}
        run: |
          source ./ci-lib.sh
          if [ -n "$CACHE_B_MATCH" ]; then export STAGE_NO_RETRY=1; fi
          KM=""; [ "${KMOD_FEED:-off}" = on ] && KM=1
          if ! STAGE_NO_RETRY=${KM:-$STAGE_NO_RETRY} ./stage.sh kernel target/linux/compile; then
            if [ -n "$KM" ] && ./kmods-off.sh "the kernel did not build with every module (stage-kernel.log)"; then
              ./stage.sh kernel-nokmods target/linux/compile || { echo "::error::kernel stage failed without the kmod feed too"; exit 1; }
            else
              [ -z "$CACHE_B_MATCH" ] || echo "::error::kernel stage failed on top of a restored cache - rerun the workflow with fresh=true"
              exit 1
            fi
          fi
          cd "$GITHUB_WORKSPACE/openwrt"
          KCFG=$(ls build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.*/.config | head -n1)
          check "kernel .config found" test -f "$KCFG"
          cp "$KCFG" ../out/13-kernel.config
          check "CONFIG_SPI_QPIC_SNAND enabled in final kernel config" grep -qE '^CONFIG_SPI_QPIC_SNAND=(y|m)' "$KCFG"
          check "CONFIG_NVMEM_LAYOUT_ASCII_ENV enabled in final kernel config" grep -qE '^CONFIG_NVMEM_LAYOUT_ASCII_ENV=(y|m)' "$KCFG"
          # رموز لازمة لإقلاع الجهاز (console، NAND، UBI، pinctrl، clocks، SCM)
          for sym in MTD_UBI_BLOCK SQUASHFS SQUASHFS_XZ UBIFS_FS OF_FLATTREE; do
            check "boot chain: CONFIG_$sym=y (built-in)" grep -qE "^CONFIG_${sym}=y" "$KCFG"
          done
          if [ "${{ inputs.diag }}" != "false" ]; then
            for sym in LEDS_PWM LEDS_TRIGGER_HEARTBEAT PANIC_ON_OOPS; do check "diag: CONFIG_$sym=y" grep -qE "^CONFIG_${sym}=y" "$KCFG"; done
            check "diag: CONFIG_PANIC_TIMEOUT=0 (early panic halts)" grep -qx 'CONFIG_PANIC_TIMEOUT=0' "$KCFG"
            soft "diag: PWM driver built-in (needed before modules load for the LED heartbeat)" sh -c "grep -E '^CONFIG_PWM_IPQ' '$KCFG' | grep -q '=y'"
          fi
          if [ "${{ inputs.perf_kernel != false }}" = "true" ]; then
            check "perf: built kernel has no ARM64_SW_TTBR0_PAN" sh -c "! grep -qx 'CONFIG_ARM64_SW_TTBR0_PAN=y' '$KCFG'"
            check "perf: built kernel has no slab freelist hardening/randomisation" sh -c "! grep -qE '^CONFIG_SLAB_FREELIST_(HARDENED|RANDOM)=y' '$KCFG'"
          fi
          if [ "${{ inputs.net_tuning != false }}" = "true" ]; then
            check "net: kernel builds BBR (CONFIG_TCP_CONG_BBR)" grep -qE '^CONFIG_TCP_CONG_BBR=(m|y)' "$KCFG"
          fi
          if [ "${{ inputs.perf_tools != false }}" = "true" ]; then
            soft "perf: kernel has performance events (CONFIG_PERF_EVENTS)" grep -qx 'CONFIG_PERF_EVENTS=y' "$KCFG"
            soft "perf: Cortex-A53 hardware counters (CONFIG_ARM_PMUV3)" grep -qx 'CONFIG_ARM_PMUV3=y' "$KCFG"
          fi
          for sym in SERIAL_MSM SERIAL_MSM_CONSOLE QCOM_SCM MTD_UBI PINCTRL_IPQ5018 IPQ_GCC_5018; do
            check "kernel config: CONFIG_$sym enabled" grep -qE "^CONFIG_${sym}=(y|m)" "$KCFG"
          done
          for sym in MTD_SPI_NAND IPQ5018_PHY MFD_SYSCON USB_DWC3_QCOM PHY_QCOM_M31_USB PWM_IPQ QCOM_APCS_IPC; do
            soft "kernel config: CONFIG_$sym enabled" grep -qE "^CONFIG_${sym}=(y|m)" "$KCFG"
          done
          VML=$(find build_dir -name vmlinux -path '*linux-6.6*' 2>/dev/null | head -n1)
          KD=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.* | head -n1)
          soft "SNAND driver object was compiled (spi-qpic-snand.o / .ko)" sh -c "find '$KD/drivers/spi' -name 'spi-qpic-snand.*o' | grep -q ."
          soft "ascii-env layout object was compiled" sh -c "find '$KD/drivers/nvmem/layouts' -name '*ascii*.*o' | grep -q ."

          verify_cfg() {   # $1 = file, $2 = label; returns number of mismatches
            local f="$1" tag="$2" miss=0 l sym
            while IFS= read -r l; do
              case "$l" in
                CONFIG_*=*)
                  if ! grep -qxF "$l" "$KCFG"; then
                    echo "$tag MISMATCH wanted [$l] got [$(grep -E "^(# )?${l%%=*}[= ]" "$KCFG" | head -n1)]"
                    miss=$((miss + 1))
                  fi ;;
                "# CONFIG_"*" is not set")
                  sym=${l#\# }; sym=${sym%% *}
                  # with the kmod feed (ALL_KMODS) "not set" -> =m is expected: only a module next to the image
                  if grep -qE "^${sym}=y$" "$KCFG" || { [ "${KMOD_FEED:-off}" != on ] && grep -qE "^${sym}=m$" "$KCFG"; }; then
                    echo "$tag MISMATCH wanted [$l] got [$(grep -E "^${sym}=" "$KCFG")]"
                    miss=$((miss + 1))
                  fi ;;
              esac
            done < "$f"
            return $miss
          }
          Q=target/linux/qualcommax
          # GitHub يشغّل bash بـ -e، فلازم نلتقط الـ exit code بـ || حتى ما تموت الخطوة بصمت
          N1=0; verify_cfg $Q/ipq50xx/config-default ipq50xx > ../out/13-cfg-ipq50xx.txt || N1=$?
          cat ../out/13-cfg-ipq50xx.txt
          if [ "$N1" -eq 0 ]; then pass "every symbol of ipq50xx/config-default is honoured by kernel 6.6.144"
          else warn "$N1 ipq50xx config symbols were dropped/changed (see 13-cfg-ipq50xx.txt) - review before flashing"; fi
          N2=0; verify_cfg $Q/config-6.6 shared > ../out/13-cfg-shared.txt || N2=$?
          if [ "$N2" -eq 0 ]; then pass "shared qualcommax config fully honoured"
          else
            # "not set" in the shared config but =y here because ipq50xx/config-default enables it = expected subtarget override
            : > ../out/13-cfg-shared-unexpected.txt
            while IFS= read -r l; do
              sym=$(echo "$l" | grep -oE 'CONFIG_[A-Z0-9_]+' | head -n1)
              case "$sym" in CONFIG_PAHOLE*|CONFIG_CC_*|CONFIG_GCC_*|CONFIG_AS_*|CONFIG_LD_*|CONFIG_TOOLS_*) continue;; esac
              grep -qE "^${sym}=y" $Q/ipq50xx/config-default && echo "$l" | grep -q 'is not set' && continue
              echo "$l" >> ../out/13-cfg-shared-unexpected.txt
            done < ../out/13-cfg-shared.txt
            NU=$(wc -l < ../out/13-cfg-shared-unexpected.txt)
            if [ "$NU" -eq 0 ]; then pass "shared config: all $N2 differences are ipq50xx subtarget overrides or host-toolchain symbols"
            else warn "shared config: $NU unexpected differences: $(cut -c1-120 ../out/13-cfg-shared-unexpected.txt | tr '\n' '|')"; fi
          fi
          check "CONFIG_NET_SWITCHDEV=y in kernel" grep -qx 'CONFIG_NET_SWITCHDEV=y' "$KCFG"
          check "CONFIG_ARCH_QCOM=y in kernel" grep -qx 'CONFIG_ARCH_QCOM=y' "$KCFG"

      - name: "13b. Save kernel cache"
        if: ${{ steps.cacheB.outputs.cache-matched-key == '' && env.KMOD_FEED != 'off' }}
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/build_dir/target-*
            openwrt/staging_dir/target-*
            openwrt/bin
          key: ${{ steps.bkey.outputs.prefix }}k

      - name: "14. Wi-Fi stack (mac80211 QCN6122 patches, firmware, BDF) + verify"
        timeout-minutes: 90
        env:
          CACHE_B_MATCH: ${{ steps.cacheB.outputs.cache-matched-key }}
        run: |
          source ./ci-lib.sh
          if [ -n "$CACHE_B_MATCH" ]; then export STAGE_NO_RETRY=1; fi
          WIFI="package/kernel/mac80211/compile package/firmware/ipq-wifi/compile package/firmware/ath11k-firmware/compile"
          WOK=""
          if STAGE_NO_RETRY=1 ./stage.sh wifi $WIFI; then WOK=1
          elif [ "${KMOD_FEED:-off}" = on ] && ./kmods-off.sh "the Wi-Fi stack did not build with every mac80211 driver (stage-wifi.log)"; then
            (cd openwrt && make package/kernel/mac80211/clean > /dev/null 2>&1) || true
            ./stage.sh kernel-nokmods target/linux/compile || { echo "::error::kernel stage failed without the kmod feed"; exit 1; }
            if STAGE_NO_RETRY=1 ./stage.sh wifi-nokmods $WIFI; then WOK=1; else cp out/stage-wifi-nokmods.log out/stage-wifi.log; fi
          fi
          if [ -z "$WOK" ]; then
            ADDED=$(sed -n 's/^added //p' out/06b0-ath11k-added.txt 2>/dev/null | tr '\n' ' ')
            if [ -n "$ADDED" ]; then
              # the ath11k patches added in 6b0/6b1 (201, 932, 910) are new on 24.10: drop them and build the proven set again (990 stays: it applies without them)
              echo "::warning::wifi stage failed with the 6b0 ath11k patches; retrying without: $ADDED"
              grep -n -E "Patch failed|Hunk #[0-9]+ FAILED|error:" out/stage-wifi.log | head -n 20 | tee out/14-6b0-failure.txt
              (cd openwrt && git rm -q -f $ADDED && git -c user.email=ci@local -c user.name=ci commit -q -m "drop 6b0 ath11k patches (did not build on 24.10)" && make package/kernel/mac80211/clean > /dev/null 2>&1)
              touch out/FALLBACK_6b0
              echo "- **FALLBACK** 6b0 ath11k patches dropped (did not build): $ADDED - Wi-Fi BDF/caldb from DT unavailable" >> "$SUMMARY"
              ./stage.sh wifi-retry $WIFI || { [ -z "$CACHE_B_MATCH" ] || echo "::error::wifi stage failed on top of a restored cache - rerun the workflow with fresh=true"; exit 1; }
            else
              [ -z "$CACHE_B_MATCH" ] || echo "::error::wifi stage failed on top of a restored cache - rerun the workflow with fresh=true"
              ./stage.sh wifi-readable $WIFI; exit 1
            fi
          fi
          cd "$GITHUB_WORKSPACE/openwrt"
          KO=$(find build_dir -name 'ath11k_ahb.ko' | head -n1)
          check "ath11k_ahb.ko was built" test -n "$KO"
          check "ath11k_ahb.ko contains QCN6122 support" sh -c "strings -a '$KO' | grep -qi qcn6122"
          QMI=$(find build_dir -path '*backports*' -path '*ath11k/qmi.c' | head -n1)
          check "ath11k qmi.c found" test -n "$QMI"
          check "FIX 6b kept: qmi.c m3-dump code declares its own variable" grep -q 'm3_dump_addr' "$QMI"
          CORE="$(dirname "$QMI")/core.c"
          if [ -f "$GITHUB_WORKSPACE/out/FALLBACK_6b0" ]; then warn "patch 910 dropped by the fallback: CE register access may hit a Data Abort on arm64"
          else
            check "FIX 910: CE remap fix in built source" grep -q 'ATH11K_REG_TYPE_CE' "$(dirname "$QMI")/ahb.c"
            check "FIX 910: no ATH11K_CE_OFFSET users left in .c/.h (patch leaves *.orig backups, ignored)" sh -c "! grep -rq --include='*.c' --include='*.h' 'ATH11K_CE_OFFSET' '$(dirname "$QMI")'"
          fi
          check "FIX 990: CALDB size 0x500000 in built source" grep -q 'ATH11K_QMI_CALDB_SIZE.*0x500000' "$(dirname "$QMI")/qmi.h"
          cat > /tmp/chk990.py <<'PY990'
          import sys
          s = open(sys.argv[1]).read()
          for n in ('ipq5018 hw1.0', 'qcn6122 hw1.0'):
              i = s.index('.name = "%s"' % n)
              e = s.find('.name = ', i + 10)
              blk = s[i:e if e > 0 else len(s)]
              assert '.coldboot_cal_mm = false' in blk and '.coldboot_cal_ftm = false' in blk, n
          PY990
          check "FIX 990: cold-boot cal off for ipq5018 and qcn6122 in built source" python3 /tmp/chk990.py "$CORE"
          if [ "${{ inputs.wifi_lowmem != false }}" = "true" ]; then
            DPH="$(dirname "$QMI")/dp.h"
            for kv in 'DP_TX_COMP_RING_SIZE 8192' 'DP_RXDMA_BUF_RING_SIZE 2048' 'DP_RXDMA_MONITOR_BUF_RING_SIZE 128' 'DP_RXDMA_MONITOR_DST_RING_SIZE 128' 'DP_RXDMA_REFILL_RING_SIZE 2048'; do
              set -- $kv
              check "RAM 991: built ath11k has $1 = $2" grep -qE "^#define $1[[:space:]]+$2\$" "$DPH"
            done
          fi
          if [ -f "$GITHUB_WORKSPACE/out/FALLBACK_6b0" ]; then warn "patch 201 dropped by the fallback: ath11k ignores qcom,bdf-addr/caldb-addr"
          else check "ath11k reads qcom,bdf-addr from DT (patch 201)" grep -rq --include='*.c' 'qcom,bdf-addr' "$(dirname "$QMI")"; fi
          soft "ath11k_ahb.ko matches DTS compatible qcom,qcn6122-wifi" sh -c "strings -a '$KO' | grep -q 'qcom,qcn6122-wifi'"
          soft "ath11k_ahb.ko matches DTS compatible qcom,ipq5018-wifi" sh -c "strings -a '$KO' | grep -q 'qcom,ipq5018-wifi'"
          soft "ath11k reads qcom,m3-dump-addr from DT" sh -c "find build_dir -name 'ath11k.ko' | head -n1 | xargs strings -a | grep -q 'qcom,m3-dump-addr'"
          check "ipq-wifi MX2000 package built" test -n "$(find bin -name 'ipq-wifi-linksys_mx2000_*.ipk' | head -n1)"
          soft "ath11k firmware packages built" test -n "$(find bin -name 'ath11k-firmware-*.ipk' | head -n1)"

      - name: "14b. Save kernel + wifi cache"
        if: ${{ steps.cacheB.outputs.cache-hit != 'true' && env.KMOD_FEED != 'off' }}
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/build_dir/target-*
            openwrt/staging_dir/target-*
            openwrt/bin
          key: ${{ steps.bkey.outputs.prefix }}kw

      - name: "15. Full build"
        timeout-minutes: 240
        run: |
          source ./ci-lib.sh
          IGN=""; [ "${KMOD_FEED:-off}" = on ] && IGN="IGNORE_ERRORS=m"   # a feed-only (=m) kmod that fails is left out, never the image
          if ! STAGE_NO_RETRY=1 ./stage.sh full $IGN; then
            if grep -qE 'mkits|image-commands\.mk|Build/fit|mkimage|target/linux/install|image/Makefile|\.itb' out/stage-full.log; then
              # step 6e put main's FIT tools in: go back to the 24.10 ones and only redo the image step
              echo "::warning::image step failed with main's FIT tools; retrying with the 24.10 ones"
              grep -n -E "mkits|mkimage|Error|error" out/stage-full.log | tail -n 25 | tee out/15-6e-failure.txt
              (cd openwrt && git checkout "$TAG" -- scripts/mkits.sh && git show "$TAG:include/image-commands.mk" > /tmp/icm-24.mk && python3 - <<'PYREV'
          import re
          rx = re.compile(r'(?ms)^define Build/fit\n.*?^endef\n')
          ours = open('include/image-commands.mk').read(); old = open('/tmp/icm-24.mk').read()
          a, b = rx.search(ours), rx.search(old)
          open('include/image-commands.mk', 'w').write(ours[:a.start()] + b.group(0) + ours[a.end():])
          PYREV
              )
              touch out/FALLBACK_6e
              echo "- **FALLBACK** 6e reverted: images built with the 24.10 FIT tools" >> "$SUMMARY"
              ./stage.sh full-retry $IGN || { [ -n "$IGN" ] && ./kmods-off.sh "the full build failed with every kmod selected (stage-full-retry.log)" && ./stage.sh full-nokmods; }
            elif [ -n "$IGN" ] && ./kmods-off.sh "the full build failed with every kmod selected (stage-full.log)"; then
              grep -n -E "Error [0-9]|error:|ERROR" out/stage-full.log | tail -n 40 > out/15-kmods-failure.txt || true
              ./stage.sh full-nokmods
            else
              ./stage.sh full-readable; exit 1
            fi
          fi

      # ------------------------------------------------------------------
      - name: "16. Verify final images and packages"
        run: |
          source ./ci-lib.sh
          cd openwrt
          OUT=bin/targets/qualcommax/ipq50xx
          ls -l "$OUT" > ../out/16-bin-ls.txt
          FACT=$(ls "$OUT"/*linksys_mx2000*squashfs-factory* 2>/dev/null | head -n1)
          SYSU=$(ls "$OUT"/*linksys_mx2000*squashfs-sysupgrade* 2>/dev/null | head -n1)
          ITB=$(ls "$OUT"/*linksys_mx2000*initramfs* 2>/dev/null | head -n1)
          check "factory image exists" test -n "$FACT"
          check "sysupgrade image exists" test -n "$SYSU"
          check "factory image > 5 MB" test "$(stat -c %s "$FACT")" -gt 5000000
          check "sysupgrade image > 5 MB" test "$(stat -c %s "$SYSU")" -gt 5000000
          soft "initramfs (RAM-boot) image exists" test -n "$ITB"
          sha256sum "$OUT"/*linksys_mx2000* > ../out/16-sha256.txt
          { echo "factory:   $FACT $(stat -c %s "$FACT")"; echo "sysupgrade:$SYSU $(stat -c %s "$SYSU")"; file "$FACT" "$SYSU"; } | tee ../out/16-image-info.txt
          tar -tvf "$SYSU" > ../out/16-sysupgrade-listing.txt 2>&1 || true
          [ -n "$ITB" ] && dtc -I dtb -O dts "$ITB" 2>/dev/null | grep -E 'description|compatible|type|arch' | head -n 40 > ../out/16-fit-info.txt

          # DTB داخل الصورة
          DTB=$(find build_dir -name 'image-ipq5018-mx2000.dtb' -o -name 'ipq5018-mx2000.dtb' | head -n1)
          check "final DTB built" test -n "$DTB"
          check "final DTB is for linksys,mx2000" sh -c "dtc -I dtb -O dts '$DTB' 2>/dev/null | grep -q 'linksys,mx2000'"

          # الحزم داخل الصورة
          MF=$(ls "$OUT"/*linksys_mx2000*.manifest 2>/dev/null | head -n1)
          [ -z "$MF" ] && MF=$(ls "$OUT"/*.manifest | head -n1)
          cp "$MF" ../out/16-manifest.txt
          check "manifest: ipq-wifi-linksys_mx2000" grep -q '^ipq-wifi-linksys_mx2000 ' "$MF"
          check "manifest: ath11k firmware" grep -q '^ath11k-firmware' "$MF"
          soft "manifest: QCN6122 firmware" grep -qi '^ath11k-firmware-qcn6122' "$MF"
          soft "manifest: IPQ5018 firmware" grep -qi '^ath11k-firmware-ipq5018' "$MF"
          check "manifest: kmod-ath11k-ahb" grep -q '^kmod-ath11k-ahb ' "$MF"
          check "manifest: uboot-envtools" grep -q '^uboot-envtools ' "$MF"
          check "manifest: luci" grep -q '^luci ' "$MF"
          check "manifest: wpad" grep -q '^wpad' "$MF"
          for pkg in ${{ inputs.extra_packages || 'luci-app-v2raya' }}; do soft "manifest: $pkg (extra_packages)" grep -q "^$pkg " "$MF"; done
          case " ${{ inputs.extra_packages || 'luci-app-v2raya' }} " in *" luci-app-v2raya "*) soft "manifest: kmod-nft-tproxy (v2rayA transparent proxy)" grep -q '^kmod-nft-tproxy ' "$MF";; esac
          if [ "${{ inputs.net_tuning != false }}" = "true" ]; then soft "manifest: kmod-tcp-bbr (BBR)" grep -q '^kmod-tcp-bbr ' "$MF"; fi
          if [ "${{ inputs.syscfg_storage != false }}" = "true" ]; then soft "manifest: ubi-utils (needed by the syscfg storage)" grep -q '^ubi-utils ' "$MF"; fi
          if [ "${{ inputs.perf_tools != false }}" = "true" ]; then soft "manifest: perf" grep -q '^perf ' "$MF"; fi
          if [ "${KMOD_FEED:-off}" = on ]; then soft "manifest: curl (mx2000-kmods downloads the kmod feed)" grep -q '^curl ' "$MF"; fi
          if [ "${XRAY_SPLICE:-off}" = on ]; then
            soft "manifest: xray-core 25.1.30-r101 (the build with patch 900)" grep -q '^xray-core 25\.1\.30-r101' "$MF"
            XIPK=$(find bin -name 'xray-core_25.1.30-r101_*.ipk' | head -n1)
            if [ -n "$XIPK" ] && tar -xzOf "$XIPK" ./data.tar.gz | tar -xzO ./usr/bin/xray > ../out/16-xray.bin 2>/dev/null; then
              soft "built xray carries the zero-copy download (patch 900 compiled in)" grep -aq 'VLESS downlink splice' ../out/16-xray.bin
            else
              warn "xray-core 25.1.30-r101 package not found or unreadable: patch 900 not checked"
            fi
            rm -f ../out/16-xray.bin
          fi

          IPK=$(find bin -name 'ipq-wifi-linksys_mx2000_*.ipk' | head -n1)
          tar -xzOf "$IPK" ./data.tar.gz | tar -tzv > ../out/16-ipq-wifi-files.txt
          check "ipq-wifi package ships files" test -s ../out/16-ipq-wifi-files.txt

          # الأهم: uboot-envtools المبني يعرف MX2000 (يحدد أقسام الـU-Boot env)
          IPK2=$(find bin -name 'uboot-envtools_*.ipk' | head -n1)
          tar -xzOf "$IPK2" ./data.tar.gz | tar -xzO --wildcards '*uci-defaults/*' > ../out/16-uboot-envtools-uci.txt 2>/dev/null || true
          check "built uboot-envtools knows linksys,mx2000" grep -q 'linksys,mx2000' ../out/16-uboot-envtools-uci.txt

          # سكربتات الجهاز تذكر MX2000
          B=target/linux/qualcommax/ipq50xx/base-files
          check "02_network handles MX2000" grep -q 'linksys,mx2000' $B/etc/board.d/02_network
          check "platform.sh (sysupgrade) handles MX2000" grep -q 'linksys,mx2000' $B/lib/upgrade/platform.sh
          check "caldata hotplug handles MX2000" grep -q 'linksys,mx2000' $B/etc/hotplug.d/firmware/11-ath11k-caldata
          soft "bootcount handles MX2000" grep -q 'linksys,mx2000' $B/etc/init.d/bootcount

          # دوال sysupgrade غير معرّفة (فحص تقريبي)
          PL=$B/lib/upgrade/platform.sh
          ENVBINS=$(tar -xzOf "$IPK2" ./data.tar.gz | tar -tz 2>/dev/null | xargs -r -n1 basename)
          # only words used as a COMMAND (line start or after ; | & ( then do else), not strings/paths/arguments
          for fn in $(sed -E 's/#.*$//' "$PL" | grep -oE '(^|[;|&(]|\bthen\b|\bdo\b|\belse\b)[[:space:]]*[a-z][a-z0-9]*(_[a-z0-9]+)+' | grep -oE '[a-z][a-z0-9]*(_[a-z0-9]+)+$' | sort -u); do
            echo "$ENVBINS" | grep -qx "$fn" && continue                          # أمر يجي من uboot-envtools (fw_printenv / fw_setenv)
            grep -qE "label = \"${fn}\"" ../out/11-mx2000-decompiled.dts && continue   # اسم قسم MTD موجود بالـ DTS
            grep -qE "\b${fn}=" "$PL" && continue
            grep -qE "^[[:space:]]*(function[[:space:]]+)?${fn}[[:space:]]*\(\)" "$PL" && continue
            grep -rqE "^[[:space:]]*(function[[:space:]]+)?${fn}[[:space:]]*\(\)" package/base-files target/linux/qualcommax target/linux/generic include scripts 2>/dev/null && continue
            echo "$fn"
          done > ../out/16-undefined-upgrade-functions.txt
          U=$(wc -l < ../out/16-undefined-upgrade-functions.txt)
          if [ "$U" -eq 0 ]; then pass "no undefined helper in sysupgrade platform.sh"
          else
            echo "--- identifiers not defined anywhere (with the platform.sh lines using them) ---"
            while read -r fn; do echo "## $fn"; grep -n -w "$fn" "$PL" | head -n 3; done < ../out/16-undefined-upgrade-functions.txt
            USAGE=$(while read -r fn; do printf '%s => %s ;; ' "$fn" "$(grep -m1 -w "$fn" "$PL" | tr -s '[:space:]' ' ')"; done < ../out/16-undefined-upgrade-functions.txt)
            warn "$U identifiers in platform.sh not found as functions/vars/DTS labels/envtools binaries: $USAGE"
          fi

      - name: "16b. kmod feed: every kmod of this build, signed with the key the firmware trusts, checked with opkg (never blocks the upload)"
        if: ${{ env.KMOD_FEED == 'on' }}
        continue-on-error: true
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          source ./ci-lib.sh
          W=$GITHUB_WORKSPACE; OW=$W/openwrt; HB=$OW/staging_dir/host/bin
          O=$W/out/16b; rm -rf "$O"; mkdir -p "$O"
          KF=$W/kmodfeed; rm -rf "$KF"; mkdir -p "$KF/kmods"
          OUT=$OW/bin/targets/qualcommax/ipq50xx
          MF=$(ls "$OUT"/*linksys_mx2000*.manifest 2>/dev/null | head -n1 || true)
          check "kmod feed: image manifest found" test -n "$MF"
          KV=$(awk '$1 == "kernel" && $2 == "-" {print $3}' "$MF")
          check "kmod feed: kernel of the image is $KV" test -n "$KV"
          MISS=$(ls -d "$OW"/staging_dir/target-*/kmod-missing 2>/dev/null | head -n1 || true)
          python3 - "$KV" "$MF" "$KF/kmods" "${MISS:-/nonexistent}" "$OUT/packages" "$OW/bin/packages" > "$W/out/16b-kmod-feed.txt" <<'PYFEED'
          import glob, io, os, re, shutil, sys, tarfile
          # kmod feed: every kmod-*.ipk of THIS build (kernel dependency = the kernel in the image), without kmods whose
          # module was missing/unavailable (marked by the patched kernel.mk), without stale ipks from a restored cache,
          # and without kmods that need a kmod that is neither in the feed nor in the image.
          kv, mf, feed, miss, tdir, pdir = sys.argv[1:7]
          image = {}
          for l in open(mf):
              p = l.rstrip('\n').split(' - ')
              if len(p) == 2:
                  image[p[0]] = p[1]
          missing = set(os.listdir(miss)) if os.path.isdir(miss) else set()
          cands = sorted(glob.glob(os.path.join(tdir, 'kmod-*.ipk')) + glob.glob(os.path.join(pdir, '*', '*', 'kmod-*.ipk')))

          def member(t, name):
              for n in (name, './' + name):
                  try:
                      return t.extractfile(n).read()
                  except KeyError:
                      pass
              raise KeyError(name)

          def read_ipk(path):
              with tarfile.open(path, 'r:gz') as t:
                  ctl = member(t, 'control.tar.gz')
                  data = member(t, 'data.tar.gz')
              with tarfile.open(fileobj=io.BytesIO(ctl), mode='r:gz') as t:
                  txt = member(t, 'control').decode('utf-8', 'replace')
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as t:
                  ko = sum(1 for m in t.getmembers() if m.isfile() and m.name.endswith('.ko'))
              f = {}
              for line in txt.splitlines():
                  m = re.match(r'^([A-Za-z0-9-]+):\s*(.*)$', line)
                  if m:
                      f[m.group(1)] = m.group(2)
              return f, ko

          def deps(f):
              out = []
              for d in f.get('Depends', '').split(','):
                  d = d.strip()
                  if d:
                      out.append([a.strip().split(' ')[0].split('(')[0] for a in d.split('|')])
              return out

          want = 'kernel(=%s)' % kv
          pk, stale, marked, bad, noko = {}, 0, [], [], []
          for p in cands:
              try:
                  f, ko = read_ipk(p)
              except Exception as e:
                  bad.append('%s (%s)' % (os.path.basename(p), e))
                  continue
              name = f.get('Package', '')
              if not any(re.sub(r'\s+', '', d) == want for d in f.get('Depends', '').split(',')):
                  stale += 1
                  continue
              if name in missing:
                  marked.append(name)
                  continue
              if ko == 0:
                  noko.append(name)   # meta package (only dependencies) - kept
              if name in pk and os.path.getmtime(pk[name][0]) >= os.path.getmtime(p):
                  continue
              pk[name] = (p, f)

          dropped = {}
          changed = True
          while changed:
              changed = False
              for n in sorted(pk):
                  for alts in deps(pk[n][1]):
                      ks = [a for a in alts if a.startswith('kmod-')]
                      if ks and len(ks) == len(alts) and not any(a in pk or a in image for a in alts):
                          dropped[n] = '|'.join(alts)
                          del pk[n]
                          changed = True
                          break

          for n in sorted(pk):
              shutil.copy2(pk[n][0], os.path.join(feed, os.path.basename(pk[n][0])))
          print('kernel %s' % kv)
          print('candidates %d | in the feed %d | stale (other kernel) %d | module missing %d | needs a missing kmod %d | unreadable %d | meta (no .ko) %d'
                % (len(cands), len(pk), stale, len(marked), len(dropped), len(bad), len([n for n in noko if n in pk])))
          for n in sorted(marked):
              print('MISSING-MODULE %s' % n)
          for n in sorted(dropped):
              print('NEEDS-MISSING %s (%s)' % (n, dropped[n]))
          for b in bad:
              print('UNREADABLE %s' % b)
          for n in sorted(pk):
              print('FEED %s %s%s' % (n, pk[n][1].get('Version', '?'), ' (in the image)' if n in image else ''))
          PYFEED
          sed -n '1,2p' "$W/out/16b-kmod-feed.txt"
          grep -E '^(MISSING-MODULE|NEEDS-MISSING|UNREADABLE) ' "$W/out/16b-kmod-feed.txt" | head -n 40 || true
          N=$(find "$KF/kmods" -name '*.ipk' | wc -l)
          check "kmod feed: $N kmods of this build collected" test "$N" -ge "${KMODS_MIN:-150}"
          cd "$KF/kmods"
          MKHASH="$HB/mkhash" "$OW/scripts/ipkg-make-index.sh" . > Packages.manifest 2> "$O/index.log"
          grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch):' Packages.manifest > Packages
          case "$(((64 + $(stat -L -c%s Packages)) % 128))" in 110|111) printf '\n\n' >> Packages ;; esac   # usign SHA-512 padding bug (as in package/Makefile)
          gzip -9nc Packages > Packages.gz
          rm -f Packages.manifest
          check "kmod feed: index lists every kmod" test "$(grep -c '^Package: ' Packages)" -eq "$N"
          "$HB/usign" -S -m Packages -s "$OW/key-build" -x Packages.sig
          printf 'TAG=%s\nKERNEL=%s\nBUILD=%s\n' "$KTAG" "$KV" "$RUN_NUMBER" > .mx2000
          cd "$W"

          # what the router will see: the rootfs of the final sysupgrade image
          USQ=$(ls "$HB"/unsquashfs4 "$HB"/unsquashfs 2>/dev/null | head -n1 || true)
          SYSU=$(ls "$OUT"/*linksys_mx2000*squashfs-sysupgrade* 2>/dev/null | head -n1 || true)
          R=$O/root
          if [ -n "$USQ" ] && [ -n "$SYSU" ] && tar -xOf "$SYSU" --wildcards '*/root' > "$O/root.sqfs" 2>/dev/null; then
            "$USQ" -no-progress -no-xattrs -f -d "$R" "$O/root.sqfs" etc/opkg usr/lib/opkg/status etc/mx2000-kmods.conf usr/bin/mx2000-kmods \
              etc/init.d/mx2000-kmods etc/rc.d usr/bin/curl > "$O/unsquashfs.log" 2>&1 || true
          fi
          rm -f "$O/root.sqfs"
          if [ -d "$R/etc/opkg/keys" ] && [ -f "$R/usr/lib/opkg/status" ]; then
            pass "kmod feed: checked against the rootfs of the final sysupgrade image"
          else
            R=$(ls -d "$OW"/build_dir/target-*/root-qualcommax 2>/dev/null | head -n1 || true)
            warn "kmod feed: sysupgrade rootfs not readable - checking the staging rootfs instead ($R)"
          fi
          FP=$("$HB/usign" -F -p "$OW/key-build.pub")
          check "kmod feed: the firmware trusts the key that signed the feed (etc/opkg/keys/$FP)" test -f "$R/etc/opkg/keys/$FP"
          check "kmod feed: signature verifies with the firmware's own keys" "$HB/usign" -V -q -m "$KF/kmods/Packages" -x "$KF/kmods/Packages.sig" -P "$R/etc/opkg/keys"
          IK=$(awk '/^Package: kernel$/ {f = 1} f && /^Version:/ {print $2; exit}' "$R/usr/lib/opkg/status")
          check "kmod feed: the firmware's kernel package ($IK) is the one every kmod needs" test "$IK" = "$KV"
          check "kmod feed: the firmware knows its feed (etc/mx2000-kmods.conf TAG=$KTAG)" grep -qx "TAG=$KTAG" "$R/etc/mx2000-kmods.conf"
          check "kmod feed: mx2000-kmods is in the firmware" test -x "$R/usr/bin/mx2000-kmods"
          soft "kmod feed: mx2000-kmods runs at boot (etc/rc.d/S99mx2000-kmods)" test -L "$R/etc/rc.d/S99mx2000-kmods"
          soft "kmod feed: curl is in the firmware (downloads the feed)" test -x "$R/usr/bin/curl"

          # dry run on the firmware's package database: opkg of this build + this feed + the official 24.10 package feeds
          OPKG=$HB/opkg
          OR=$O/oroot; mkdir -p "$OR/usr/lib/opkg/info" "$OR/var/lock" "$OR/tmp"; cp "$R/usr/lib/opkg/status" "$OR/usr/lib/opkg/status"
          { echo "src/gz mx2000_kmods file://$KF/kmods"
            for f in base luci packages routing telephony; do
              if curl -fsSL --retry 3 --connect-timeout 20 --create-dirs -o "$O/feeds/$f/Packages.gz" "https://downloads.openwrt.org/releases/${TAG#v}/packages/aarch64_cortex-a53/$f/Packages.gz" 2>/dev/null; then
                echo "src/gz openwrt_$f file://$O/feeds/$f"
              fi
            done
            printf 'dest root /\nlists_dir ext /var/opkg-lists\narch all 1\narch noarch 1\narch aarch64_cortex-a53 10\n'; } > "$O/opkg.conf"
          NOFF=$(grep -c '^src/gz openwrt_' "$O/opkg.conf" || true)
          if [ -x "$OPKG" ] && "$OPKG" -f "$O/opkg.conf" --offline-root "$OR" update > "$O/opkg-update.log" 2>&1; then
            awk '/^Package: / {print $2}' "$OR/usr/lib/opkg/status" | sort -u > "$O/installed.txt"
            grep '^Package: ' "$KF/kmods/Packages" | cut -d' ' -f2 | sort -u | comm -23 - "$O/installed.txt" > "$O/try.txt"
            J=$(nproc); rm -f "$O"/dry-*.txt
            split -n "r/$J" "$O/try.txt" "$O/chunk."
            for c in "$O"/chunk.*; do
              ( cp -a "$OR" "$c.root"
                while read -r p; do
                  if timeout 60 "$OPKG" -f "$O/opkg.conf" --offline-root "$c.root" --noaction install "$p" > "$c.log" 2>&1; then echo "$p" >> "$c.ok"
                  else echo "$p: $({ grep -m1 -E 'cannot find dependency|Cannot satisfy|onflict|incompatible' "$c.log" || grep -m1 -v -E 'Collected errors|pkg_get_installed_files|opkg_conf_deinit' "$c.log"; } | tr -s ' ')" >> "$c.bad"; fi
                done < "$c"
                rm -rf "$c.root" ) &
            done
            wait
            cat "$O"/chunk.*.ok 2>/dev/null | sort > "$W/out/16b-dryrun-ok.txt" || true
            cat "$O"/chunk.*.bad 2>/dev/null | sort > "$W/out/16b-dryrun-failures.txt" || true
            rm -f "$O"/chunk.*
            NT=$(wc -l < "$O/try.txt"); NOK=$(wc -l < "$W/out/16b-dryrun-ok.txt"); NB=$(wc -l < "$W/out/16b-dryrun-failures.txt")
            if [ "$NB" -eq 0 ]; then pass "kmod feed: all $NT kmods not already in the image install on it (opkg dry run, $NOFF official feeds)"
            else warn "kmod feed: $NOK of $NT kmods install on the image; $NB would not (opkg dry run, $NOFF official feeds; see 16b-dryrun-failures.txt): $(head -n 5 "$W/out/16b-dryrun-failures.txt" | cut -c1-110 | tr '\n' '|')"; fi
            for p in kmod-nft-socket kmod-tun kmod-wireguard kmod-fs-ext4 kmod-usb-storage; do
              grep -qx "$p" "$O/try.txt" || continue
              soft "kmod feed: opkg install $p works on this firmware (dry run)" grep -qx "$p" "$W/out/16b-dryrun-ok.txt"
            done
          else
            warn "kmod feed: opkg dry run not possible ($( [ -x "$OPKG" ] && tail -n 3 "$O/opkg-update.log" | tr '\n' ' ' || echo "no host opkg"))"
          fi

          tar -C "$KF" -cf "$KF/mx2000-kmods.tar" kmods
          SZ=$(du -m "$KF/mx2000-kmods.tar" | cut -f1)
          [ "$SZ" -le 40 ] || warn "kmod feed is $SZ MB: it may not fit next to the v2rayA geo files on /mnt/syscfg (mx2000-kmods then keeps it in RAM until reboot)"
          touch "$KF/READY"
          echo "- **KMODS** opkg feed of this build: $N kmods, $SZ MB, release $KTAG (router: mx2000-kmods, then opkg install kmod-...; private repo: mx2000-kmods token <token> once)" >> "$SUMMARY"

      - name: "17. Verify fixes + risky assumptions (never blocks the firmware upload)"
        continue-on-error: true
        env:
          CACHE_A_HIT: ${{ steps.cacheA.outputs.cache-hit }}
          CACHE_B_MATCH: ${{ steps.cacheB.outputs.cache-matched-key }}
        run: |
          source ./ci-lib.sh
          cd openwrt
          FAILS=0
          # fx = تصليح سويناه: لو انكسر نعتبره regression (خطأ). rk = افتراض مو متأكد منه: تحذير فقط.
          fx() { local d="$1"; shift; if "$@" >/dev/null 2>&1; then pass "FIX-VERIFY: $d"; else echo "- **FAIL** FIX-VERIFY: $d" >> "$SUMMARY"; echo "::error::FIX regression: $d"; FAILS=$((FAILS+1)); fi; }
          rk() { local d="$1"; shift; if "$@" >/dev/null 2>&1; then pass "RISK-OK: $d"; else warn "RISK-UNVERIFIED: $d"; fi; }
          TB=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx | head -n1)
          DTS=../out/11-mx2000-decompiled.dts
          OUT=bin/targets/qualcommax/ipq50xx

          echo "=== FIX 6c: qca-ssdk (MP / ipq50xx) ==="
          SSDK=$(ls -d $TB/qca-ssdk-* 2>/dev/null | head -n1)
          fx "qca-ssdk build dir found" test -n "$SSDK"
          fx "qca-ssdk compiled the MP (ipq50xx) code" test -n "$(find "$SSDK" -name 'adpt_mp_*.o' 2>/dev/null | head -n1)"
          rk "qca-ssdk skipped unrelated HPPE code (CHIP_TYPE=MP took effect)" test -z "$(find "$SSDK" -name 'adpt_hppe_*.o' 2>/dev/null | head -n1)"
          fx "qca-ssdk matches the switch node (qcom,ess-switch-ipq50xx)" grep -rq 'qcom,ess-switch-ipq50xx' "$SSDK"

          echo "=== FIX 6c: qca-nss-dp ==="
          NSS=$(ls -d $TB/qca-nss-dp-* 2>/dev/null | head -n1)
          fx "nss-dp build dir found" test -n "$NSS"
          fx "nss-dp ipq50xx soc_ops compiled" test -n "$(find "$NSS/hal/soc_ops/ipq50xx" -name '*.o' 2>/dev/null | head -n1)"
          fx "nss-dp ipq50xx no longer includes the old <linux/qcom_scm.h>" sh -c "! grep -q 'include <linux/qcom_scm.h>' '$NSS/hal/soc_ops/ipq50xx/nss_ipq50xx.c'"
          rk "nss-dp matches DTS compatibles (qcom,nss-dp, qcom,nss-dp-common)" sh -c "grep -rq 'qcom,nss-dp' '$NSS' --include=*.c"
          rk "nss-dp supports fixed-link (the MX2000 DTS gmac uses it)" sh -c "grep -rq 'fixed-link' '$NSS' --include=*.c"
          rk "nss-dp reads phy-handle" sh -c "grep -rq 'phy-handle' '$NSS' --include=*.c"
          GRX="${{ inputs.gmac_rx_ring || '1024' }}"
          fx "nss-dp built with $GRX RX descriptors for the IPQ5018 GMAC" grep -qE "define SYN_DP_RX_DESC_SIZE[[:space:]]+$GRX([^0-9]|$)" "$NSS/hal/dp_ops/syn_gmac_dp/syn_dp_rx.h"
          fx "nss-dp built with the DMA drop counter (ethtool -S eth0: rx_missed / rx_fifo_overflows are live)" grep -q 'SYN_DMA_MISSED_FRAME_AND_BUFF_OVERFLOW_COUNTER' "$NSS/hal/dp_ops/syn_gmac_dp/syn_dp.c"
          if [ "${{ inputs.wifi_lowmem != false }}" = "true" ]; then
            DPH=$(find build_dir -path '*backports*' -path '*ath11k/dp.h' | head -n1)
            fx "ath11k built with the smaller rings (monitor 128, RX 2048, TX completion 8192: about 37 MB less RAM)" sh -c "grep -qE '^#define DP_RXDMA_MONITOR_BUF_RING_SIZE[[:space:]]+128\$' '$DPH' && grep -qE '^#define DP_RXDMA_BUF_RING_SIZE[[:space:]]+2048\$' '$DPH' && grep -qE '^#define DP_TX_COMP_RING_SIZE[[:space:]]+8192\$' '$DPH'"
          fi

          echo "=== FIX 6d: SNAND + ascii-env made it into the final image config ==="
          fx "final kernel .config has SPI_QPIC_SNAND" grep -qE '^CONFIG_SPI_QPIC_SNAND=(y|m)' ../out/13-kernel.config
          fx "final kernel .config has NVMEM_LAYOUT_ASCII_ENV" grep -qE '^CONFIG_NVMEM_LAYOUT_ASCII_ENV=(y|m)' ../out/13-kernel.config
          KD=$(ls -d $TB/linux-6.6.* | head -n1)
          grep -rn --include='*.c' --include='*.h' 'props->qpic_v2' "$KD/drivers/mtd" "$KD/drivers/spi" > ../out/17-qpic-v2-sources.txt 2>/dev/null || true
          grep -rl 'props->qpic_v2' "$KD/drivers/mtd" "$KD/drivers/spi" 2>/dev/null | grep -vE '\.(c|h|orig)$' > ../out/17-qpic-v2-other-files.txt || true
          fx "no .rej (failed patch hunk) files anywhere in the kernel tree" sh -c "! find '$KD' -name '*.rej' | grep -q ."
          fx "11b qpic fix: no props->qpic_v2 left in any .c/.h under drivers/mtd and drivers/spi" test ! -s ../out/17-qpic-v2-sources.txt
          fx "no other file mentions props->qpic_v2 ($(head -n3 ../out/17-qpic-v2-other-files.txt | tr '\n' ' '))" test ! -s ../out/17-qpic-v2-other-files.txt

          echo "=== RISK: DTS partition labels vs scripts that use them ==="
          grep -oE 'label = "[^"]+"' $DTS | sed 's/label = //; s/"//g' | sort -u > ../out/17-dts-labels.txt
          rk "DTS has partitions (u_env, devinfo, rootfs)" sh -c "grep -qx u_env ../out/17-dts-labels.txt && grep -qx devinfo ../out/17-dts-labels.txt && grep -qx rootfs ../out/17-dts-labels.txt"
          ENVF=../out/16-uboot-envtools-uci.txt
          awk '/mx2000/{f=1} f{print} f&&/;;/{exit}' "$ENVF" > ../out/17-envtools-mx2000-block.txt
          echo "--- uboot-envtools block for mx2000 ---"; head -n 15 ../out/17-envtools-mx2000-block.txt
          grep -oE '"[^"]+"' ../out/17-envtools-mx2000-block.txt | tr -d '"' | grep -E '^[A-Za-z][A-Za-z0-9_:]*$' | sort -u > ../out/17-envtools-mtds.txt || true
          rk "uboot-envtools MX2000 block found ($(wc -l < ../out/17-envtools-mx2000-block.txt) lines)" test -s ../out/17-envtools-mx2000-block.txt
          while read -r m; do rk "uboot-envtools name '$m' is a DTS partition label" grep -qx "$m" ../out/17-dts-labels.txt; done < ../out/17-envtools-mtds.txt
          CAL=target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata
          awk '/mx2000/{f=1} f{print} f&&/;;/{exit}' $CAL > ../out/17-caldata-mx2000.txt
          cat ../out/17-caldata-mx2000.txt
          CALMTD=$(grep -oE '"[^"]+"' ../out/17-caldata-mx2000.txt | tr -d '"' | head -n1)
          rk "caldata MX2000 reads from a partition that exists in the DTS (got: ${CALMTD:-none})" sh -c "test -n '$CALMTD' && grep -qx '$CALMTD' ../out/17-dts-labels.txt"

          echo "=== RISK: every DTS compatible is served by something ==="
          sed 's/\\0/", "/g' $DTS | grep -E '^[[:space:]]*compatible' | grep -oE '"[^"]+"' | tr -d '"' | sort -u > ../out/17-dts-compats.txt
          # كل سطر compatible هو قائمة (الأول خاص بالـ SoC والباقي fallback)، يكفي أن يطابق أحد عناصرها driver
          sed 's/\\0/", "/g' $DTS | grep -E '^[[:space:]]*compatible' | sort -u > /tmp/17-lines.txt
          grep -oE '"[^"]+"' /tmp/17-lines.txt | sort -u > /tmp/17-pat.txt
          grep -rhoF -f /tmp/17-pat.txt $TB/linux-6.6.*/drivers $TB/linux-6.6.*/sound $TB/linux-6.6.*/kernel "$SSDK" "$NSS" $TB/mac80211-regular 2>/dev/null | sort -u > /tmp/17-found.txt || true
          : > ../out/17-compats-unresolved.txt
          while read -r line; do
            case "$line" in *'"linksys,'*|*'"arm,'*|*ethernet-phy-id*) continue;; esac
            ok=0
            for it in $(echo "$line" | grep -oE '"[^"]+"'); do grep -qxF "$it" /tmp/17-found.txt && { ok=1; break; }; done
            [ "$ok" -eq 1 ] || echo "$line" | grep -oE '"[^"]+"' | tr -d '"' | paste -sd'|' >> ../out/17-compats-unresolved.txt
          done < /tmp/17-lines.txt
          # nodes without a driver that other nodes point to (phandle) are resources read by their user's driver (e.g. nss-dp, ssdk)
          python3 - "$DTS" ../out/17-compats-unresolved.txt "$SSDK" "$NSS" <<'PYPH'
          import re, sys, os, subprocess, importlib.machinery
          cm = importlib.machinery.SourceFileLoader('cm', os.path.join(os.environ['GITHUB_WORKSPACE'], 'compare-mx2000.py')).load_module()
          dts, unres, ssdk, nss = sys.argv[1:5]
          root = cm.parse_dts(open(dts, errors='replace').read())
          nodes = list(cm.walk(root))
          keep, info = [], []
          for line in open(unres).read().split():
              comps = line.split('|'); refs = []
              for path, n in nodes:
                  if not set(comps) & set(cm.strings(n['props'].get('compatible', ''))): continue
                  ph = cm.cells(n['props'].get('phandle', ''))
                  if not ph: continue
                  for p2, n2 in nodes:
                      if p2 == path: continue
                      for k, v in n2['props'].items():
                          if k != 'phandle' and ph[0] in cm.cells(v): refs.append(f'{p2}:{k}')
              if not refs:  # drivers may look the node up by NAME (of_find_node_by_name / of_get_child_by_name)
                  names = {path.rsplit('/', 1)[-1].split('@')[0] for path, n in nodes if set(comps) & set(cm.strings(n['props'].get('compatible', '')))}
                  for nm in names:
                      if subprocess.run(['grep', '-rqF', '--include=*.c', f'"{nm}"', ssdk, nss]).returncode == 0:
                          refs.append(f'driver source looks up node name "{nm}"')
              if refs: info.append(f'{line} -> used as a resource by {", ".join(sorted(set(refs))[:3])}')
              else: keep.append(line)
          open(unres, 'w').write(''.join(x + '\n' for x in keep))
          open(unres.replace('unresolved', 'resources'), 'w').write(''.join(x + '\n' for x in info))
          for x in info: print('RESOURCE', x)
          PYPH
          [ -s ../out/17-compats-resources.txt ] && echo "- **INFO** $(wc -l < ../out/17-compats-resources.txt) driverless DTS nodes are resources referenced by other nodes (17-compats-resources.txt)" >> "$SUMMARY"
          U=$(wc -l < ../out/17-compats-unresolved.txt)
          if [ "$U" -eq 0 ]; then pass "RISK-OK: every DTS compatible list has at least one driver match (kernel + qca-ssdk + nss-dp + ath11k)"; else warn "RISK-UNVERIFIED: $U DTS compatible lists with NO driver match at all: $(tr '\n' ' ' < ../out/17-compats-unresolved.txt)"; fi

          echo "=== RISK: images and packages ==="
          ITB=$(ls $OUT/*linksys_mx2000*initramfs* 2>/dev/null | head -n1)
          SYSU=$(ls $OUT/*linksys_mx2000*squashfs-sysupgrade* 2>/dev/null | head -n1)
          dtc -I dtb -O dts "$ITB" > ../out/17-itb.dts 2>/dev/null || true
          grep -E 'description|load =|entry =|compression|arch =|os =|type =' ../out/17-itb.dts | head -n 30 | tee ../out/17-itb-summary.txt
          rk "initramfs FIT is parseable" test -s ../out/17-itb.dts
          rk "initramfs FIT references mx2000" grep -qi 'mx2000' ../out/17-itb.dts
          rk "initramfs FIT has load/entry addresses" grep -qE 'load = |entry = ' ../out/17-itb.dts
          rk "sysupgrade metadata names linksys,mx2000 (otherwise sysupgrade refuses the image)" sh -c "strings -a '$SYSU' | grep -q 'linksys,mx2000'"
          rk "profiles.json lists linksys,mx2000" grep -q 'linksys,mx2000' $OUT/profiles.json
          for pat in 'ipq-wifi-linksys_mx2000_*.ipk' 'ath11k-firmware-qcn6122_*.ipk' 'ath11k-firmware-ipq5018_*.ipk'; do
            P=$(find bin -name "$pat" | head -n1)
            N=$(basename "${P:-none}" | cut -d_ -f1)
            if [ -n "$P" ]; then tar -xzOf "$P" ./data.tar.gz | tar -tzv > "../out/17-ipk-$N.txt" 2>/dev/null || true; fi
          done
          rk "ipq-wifi MX2000 ships a board file" sh -c "grep -qiE 'board.*\.bin|\.bin' ../out/17-ipk-ipq-wifi-linksys.txt"
          rk "QCN6122 firmware ships q6/m3 files" sh -c "grep -qiE 'q6|m3|qcn6122' ../out/17-ipk-ath11k-firmware-qcn6122.txt"

          echo "=== CACHE effectiveness ==="
          stage_min() { grep -E "STAGE $1\*\*" "$SUMMARY" | grep -oE '[0-9]+ min' | grep -oE '[0-9]+' | head -n1; }
          TC=$(stage_min toolchain); KN=$(stage_min kernel); WF=$(stage_min wifi)
          HT=$(( $(cat ../out/10-tools-seconds.txt 2>/dev/null || echo 0) / 60 ))
          echo "host tools ${HT}m | toolchain ${TC:-?}m | kernel ${KN:-?}m | wifi ${WF:-?}m | cacheA=${CACHE_A_HIT:-none} | cacheB=${CACHE_B_MATCH:-none}"
          if [ "$CACHE_A_HIT" = "true" ]; then
            if [ "$HT" -le 5 ] && [ "${TC:-0}" -le 8 ]; then pass "CACHE-OK: tools+toolchain reused (${HT}m + ${TC:-0}m)"; else warn "CACHE-INEFFECTIVE: base cache restored but host tools took ${HT}m / toolchain ${TC:-?}m (stamps invalid?)"; fi
          fi
          if [ -n "$CACHE_B_MATCH" ]; then
            if [ "${KN:-0}" -le 5 ] && [ "${WF:-0}" -le 5 ]; then pass "CACHE-OK: kernel+wifi reused (${KN:-0}m + ${WF:-0}m)"; else warn "CACHE-INEFFECTIVE: kernel/wifi cache restored but kernel ${KN:-?}m / wifi ${WF:-?}m"; fi
          fi
          [ "$FAILS" -eq 0 ] || { echo "::error::$FAILS FIX regression(s) - see summary"; exit 1; }

      - name: "17b. Reference data: the official OpenWrt 25.12.4 MX2000 image (boots on this router) + known U-Boot env"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          R=out/ref-combined; mkdir -p "$R/postmortem"
          # 1) your own data from the router (ref/ in the repo) takes priority
          [ -d selfrepo/ref ] && cp -r selfrepo/ref/. "$R/" || true
          # 2) U-Boot environment read on the router (2026-10-25, OpenWrt 25.12.4, running slot 1). Values only, nothing secret.
          if [ ! -f "$R/fw_printenv.txt" ]; then cat > "$R/fw_printenv.txt" <<'ENV'
          auto_recovery=yes
          boot_part=1
          boot_part_ready=3
          boot_ver=4.0.04
          bootargs=console=ttyMSM0,115200n8
          bootcmd=if test $auto_recovery = no; then bootipq; elif test $boot_part = 1; then run bootpart1; else run bootpart2; fi
          bootdelay=3
          bootpart1=setenv bootargs $partbootargs && nand read $loadaddr $prikern $kernsize && bootm $loadaddr
          bootpart2=setenv bootargs $partbootargs2 && nand read $loadaddr $altkern $kernsize && bootm $loadaddr
          fdt_high=0x4A400000
          loadaddr=44000000
          machid=8040004
          prikern=6c0000
          altkern=58c0000
          kernsize=800000
          partbootargs=init=/sbin/init rootfstype=squashfs ubi.mtd=rootfs root=mtd:squashfs rootwait
          partbootargs2=init=/sbin/init rootfstype=squashfs ubi.mtd=alt_rootfs root=mtd:squashfs rootwait
          ENV
          fi
          # platform drivers bound by the OpenWrt 25.12.4 kernel on this router (ls /sys/bus/platform/drivers, 2026-10-25)
          [ -f "$R/25-platform-drivers.txt" ] || echo "alarmtimer ath11k bam-dma-engine cpufreq-dt dwc3 dwc3-qcom ess_ssdk gated-fixed-clk gpio-clk gpio-export gpio-keys gpio-keys-polled gpio-wdt i2c_qup ipq-pwm ipq4019-mdio ipq5018-tlmm ipq_cmn_pll leds-gpio leds_pwm msm_serial nss-dp of_fixed_clk of_fixed_factor_clk pinctrl-single psci-cpuidle pwrseq_emmc pwrseq_simple qcom,apss-ipq6018-clk qcom,gcc-ipq5018 qcom,msm-apm qcom,qfprom qcom-ipq-apss-pll qcom-m31usb-phy qcom-nandc qcom-pcie qcom-q6-mpd qcom-q6v5-wcss-pil qcom-qmp-combo-phy qcom-qmp-msm8996-pcie-phy qcom-qmp-pcie-phy qcom-qmp-ufs-phy qcom-qmp-usb-phy qcom-qmp-usbc-phy qcom-qusb2-phy qcom-smd qcom-smem qcom-socinfo qcom-tsens qcom-uniphy-pcie qcom-wcss-secure-pil qcom_apcs_ipc qcom_glink_rpm qcom_hwspinlock qcom_rng qcom_scm qcom_smp2p qcom_snand qcom_wdt qcrypto reg-dummy reg-fixed-voltage regulatory rproc-virtio sdhci_msm serial8250 simple-pm-bus spi_qup syscon tmel_qmp_mbox xhci-hcd" > "$R/25-platform-drivers.txt"
          # 3) the official image: its kernel FIT is exactly what U-Boot accepts today
          V=25.12.4; F=openwrt-$V-qualcommax-ipq50xx-linksys_mx2000-squashfs-sysupgrade.bin
          for base in https://downloads.openwrt.org/releases https://archive.openwrt.org/releases; do
            curl -fsSL --retry 3 -o "$R/official25.bin" "$base/$V/targets/qualcommax/ipq50xx/$F" && { echo "downloaded $base/$V/.../$F"; break; }
          done
          if [ -s "$R/official25.bin" ]; then
            tar -xOf "$R/official25.bin" --wildcards '*/kernel' > "$R/kernel-head-official25.bin"
            check "official 25.12.4 kernel FIT extracted" sh -c "head -c4 '$R/kernel-head-official25.bin' | od -An -tx1 | tr -d ' \n' | grep -q d00dfeed"
            echo "- **REF** official OpenWrt $V MX2000 image used as the working reference" >> "$SUMMARY"
          else
            warn "could not download the official OpenWrt $V image (network?) - suspects that compare with the working image stay UNKNOWN"
          fi
          # 4) the 25.12.4 SOURCE: its kernel config and its MX2000 device tree, to diff against ours
          cd openwrt
          git fetch -q origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null || git fetch -q --depth 1 origin tag "v$V" 2>/dev/null || true
          if git rev-parse -q --verify "v$V^{commit}" >/dev/null; then
            KV=$(git show "v$V:target/linux/qualcommax/Makefile" | sed -n 's/^KERNEL_PATCHVER:=//p')
            echo "OpenWrt $V uses kernel $KV for qualcommax"
            if [ ! -f "../$R/config.gz" ]; then
              { git show "v$V:target/linux/generic/config-$KV"; git show "v$V:target/linux/qualcommax/config-$KV"; git show "v$V:target/linux/qualcommax/ipq50xx/config-default"; } 2>/dev/null \
                | awk -F= '/^CONFIG_/{v[$1]=$0; next} /^# CONFIG_.* is not set/{k=$0; sub(/^# /,"",k); sub(/ is not set.*/,"",k); v[k]=$0} END{for (k in v) print v[k]}' | sort | gzip > "../$R/config.gz"
              echo "- **REF** kernel config of OpenWrt $V composed from its source (generic + qualcommax + ipq50xx, kernel $KV)" >> "$SUMMARY"
            fi
            D=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom
            git diff "v$V" HEAD -- "$D/ipq5018-mx2000.dts" "$D/ipq5018-mx-base.dtsi" "$D/ipq5018.dtsi" "$D/ipq5018-ess.dtsi" > ../out/17b-dts-ours-vs-25.diff || true
            git ls-tree -r --name-only "v$V" -- "target/linux/qualcommax/patches-$KV" | grep -iE '5018|ipq50|mx2000' > ../out/17b-25-ipq5018-patches.txt || true
            echo "DTS lines that differ from OpenWrt $V: $(grep -cE '^[+-][^+-]' ../out/17b-dts-ours-vs-25.diff || true) (17b-dts-ours-vs-25.diff)"
            echo "- **REF** DTS diff vs OpenWrt $V: $(grep -cE '^[+-][^+-]' ../out/17b-dts-ours-vs-25.diff || true) lines (17b-dts-ours-vs-25.diff), ipq5018 kernel patches in $V: $(wc -l < ../out/17b-25-ipq5018-patches.txt)" >> "$SUMMARY"
            { echo "### DTS: ours vs OpenWrt $V (lines starting with - are in 25.12.4, + are ours)"; echo '```diff'; head -n 400 ../out/17b-dts-ours-vs-25.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            warn "tag v$V not reachable: no source-level comparison with OpenWrt $V"
          fi
          cd ..
          ls -la "$R" | tee out/17b-ref-files.txt

      - name: "17c. Wi-Fi stack: ours vs OpenWrt 25.12.4 (Q6 remoteproc driver, pd nodes, ath11k patches)"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          cd openwrt
          V=25.12.4; T="v$V"
          git rev-parse -q --verify "$T^{commit}" >/dev/null || git fetch -q origin "refs/tags/$T:refs/tags/$T" || true
          O=../out/17c-wifi; mkdir -p $O
          KD=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.* | head -n1)
          KV=$(git show "$T:target/linux/qualcommax/Makefile" | sed -n 's/^KERNEL_PATCHVER:=//p')
          # 1) every 25.12.4 kernel patch touching the Q6/WCSS remoteproc, and the mpd driver file it creates or changes
          git ls-tree -r --name-only "$T" -- "target/linux/qualcommax/patches-$KV" > $O/25-patches.txt
          : > $O/25-remoteproc-patches.txt
          while read -r f; do
            if git show "$T:$f" | grep -qE '^\+\+\+ b/drivers/remoteproc/qcom_q6v5_mpd|^\+\+\+ b/drivers/remoteproc/qcom_q6v5_wcss|^\+\+\+ b/include/linux/remoteproc|^\+\+\+ b/drivers/firmware/qcom'; then
              echo "$f" >> $O/25-remoteproc-patches.txt; git show "$T:$f" > "$O/25-$(basename "$f")"
            fi
          done < $O/25-patches.txt
          # 2) ours: the mpd driver as compiled, and the 6.6 patches that touch it
          cp "$KD/drivers/remoteproc/qcom_q6v5_mpd.c" $O/ours-qcom_q6v5_mpd.c 2>/dev/null || true
          grep -lE '^\+\+\+ b/drivers/remoteproc/qcom_q6v5_mpd' target/linux/qualcommax/patches-6.6/*.patch > $O/ours-remoteproc-patches.txt || true
          # 3) ath11k patches: names present only in 25 or only in ours, and same name with different content
          A=package/kernel/mac80211/patches/ath11k
          git ls-tree -r --name-only "$T" -- "$A" | xargs -n1 basename | sort > $O/25-ath11k.txt
          ls $A | sort > $O/ours-ath11k.txt
          comm -23 $O/25-ath11k.txt $O/ours-ath11k.txt > $O/ath11k-only-in-25.txt
          comm -13 $O/25-ath11k.txt $O/ours-ath11k.txt > $O/ath11k-only-in-ours.txt
          : > $O/ath11k-differ.txt
          comm -12 $O/25-ath11k.txt $O/ours-ath11k.txt | while read -r f; do git show "$T:$A/$f" | cmp -s - "$A/$f" || echo "$f" >> $O/ath11k-differ.txt; done
          git show "$T:package/kernel/mac80211/Makefile" | grep -E '^PKG_VERSION' > $O/25-mac80211-version.txt
          grep -E '^PKG_VERSION' package/kernel/mac80211/Makefile > $O/ours-mac80211-version.txt
          {
            echo "### Wi-Fi stack: ours vs OpenWrt $V"
            echo "- mac80211 backports: ours $(cat $O/ours-mac80211-version.txt) / 25 $(cat $O/25-mac80211-version.txt)"
            echo "- 25 kernel patches touching the Q6 remoteproc (kernel $KV): $(wc -l < $O/25-remoteproc-patches.txt)"; sed 's/^/  - /' $O/25-remoteproc-patches.txt
            echo "- our 6.6 patches touching qcom_q6v5_mpd: $(wc -l < $O/ours-remoteproc-patches.txt)"; sed 's/^/  - /' $O/ours-remoteproc-patches.txt
            echo "- ath11k patches only in 25 ($(wc -l < $O/ath11k-only-in-25.txt)):"; sed 's/^/  - /' $O/ath11k-only-in-25.txt | head -n 60
            echo "- ath11k patches only in ours ($(wc -l < $O/ath11k-only-in-ours.txt)):"; sed 's/^/  - /' $O/ath11k-only-in-ours.txt | head -n 60
            echo "- ath11k patches with the same name but different content ($(wc -l < $O/ath11k-differ.txt)):"; sed 's/^/  - /' $O/ath11k-differ.txt | head -n 60
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "17d. Wi-Fi readiness of the final image + parity with the official OpenWrt 25.12.4 image (never blocks the upload)"
        continue-on-error: true
        env:
          WIFI_MODE: ${{ inputs.wifi_mode || 'on' }}
          DIAG: ${{ inputs.diag != false }}
          FRAME: ${{ inputs.wifi_ethernet_mode != false && 'ethernet' || 'native' }}
        run: |
          source ./ci-lib.sh
          O=out/17d-wifi; rm -rf "$O"; mkdir -p "$O"
          USQ=$(ls "$PWD"/openwrt/staging_dir/host/bin/unsquashfs4 "$PWD"/openwrt/staging_dir/host/bin/unsquashfs 2>/dev/null | head -n1)
          SYSU=$(ls openwrt/bin/targets/qualcommax/ipq50xx/*linksys_mx2000*squashfs-sysupgrade* 2>/dev/null | head -n1)
          REF=out/ref-combined/official25.bin
          PATHS="lib/firmware etc/hotplug.d/firmware etc/modules.d etc/init.d etc/rc.d lib/modules"
          extract() {   # $1 = sysupgrade image, $2 = output dir: only the paths Wi-Fi needs
            tar -xOf "$1" --wildcards '*/root' > "$2.sqfs" 2>/dev/null || return 1
            "$USQ" -no-progress -no-xattrs -f -d "$2" "$2.sqfs" $PATHS > "$2.log" 2>&1 || true
            test -d "$2/lib/firmware"
          }
          check "our sysupgrade image found" test -n "$SYSU"
          if [ -n "$USQ" ] && extract "$SYSU" "$O/ours"; then pass "17d: our rootfs extracted from the final sysupgrade image"
          else
            TD=$(ls -d openwrt/build_dir/target-*/root-qualcommax 2>/dev/null | head -n1)
            warn "17d: unsquashfs failed on our image ($(tail -n 2 "$O/ours.log" 2>/dev/null | tr '\n' ' ')) - using the staging rootfs $TD"
            rm -rf "$O/ours"; mkdir -p "$O/ours"
            for p in $PATHS; do [ -e "$TD/$p" ] && { mkdir -p "$O/ours/$(dirname "$p")"; cp -a "$TD/$p" "$O/ours/$p"; }; done
          fi
          REFARGS=""
          if [ -s "$REF" ]; then
            REFARGS="--ref $REF"
            if [ -n "$USQ" ] && extract "$REF" "$O/r25"; then REFARGS="$REFARGS --ref-root $O/r25"; pass "17d: official 25.12.4 rootfs extracted"
            else warn "17d: could not extract the official 25.12.4 rootfs - firmware/caldata parity not checked"; fi
          else
            warn "17d: official 25.12.4 image not downloaded (17b) - no parity check"
          fi
          python3 wifiready.py --ours "$SYSU" --ours-root "$O/ours" $REFARGS --wifi-mode "$WIFI_MODE" --diag "$DIAG" --frame-mode "$FRAME" \
            --report "$O/17d-wifi-ready.md" --summary "$SUMMARY"
          { echo "### Wi-Fi readiness of the final image"; head -n 80 "$O/17d-wifi-ready.md"; } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$O"/*.sqfs

      - name: "17e. Speed settings inside the final image (never blocks the upload)"
        continue-on-error: true
        env:
          WIFI_ETH: ${{ inputs.wifi_ethernet_mode != false }}
          PERF: ${{ inputs.perf_kernel != false }}
          IRQS: ${{ inputs.irq_split != false }}
          NETT: ${{ inputs.net_tuning != false }}
        run: |
          source ./ci-lib.sh
          O=out/17e-speed; rm -rf "$O"; mkdir -p "$O"
          USQ=$(ls "$PWD"/openwrt/staging_dir/host/bin/unsquashfs4 "$PWD"/openwrt/staging_dir/host/bin/unsquashfs 2>/dev/null | head -n1)
          SYSU=$(ls openwrt/bin/targets/qualcommax/ipq50xx/*linksys_mx2000*squashfs-sysupgrade* 2>/dev/null | head -n1)
          check "our sysupgrade image found" test -n "$SYSU"
          R="$O/root"
          if [ -n "$USQ" ] && tar -xOf "$SYSU" --wildcards '*/root' > "$O/root.sqfs" 2>/dev/null \
             && "$USQ" -no-progress -no-xattrs -f -d "$R" "$O/root.sqfs" etc/sysctl.d etc/modules.d etc/init.d etc/rc.d lib/modules > "$O/unsquashfs.log" 2>&1 \
             && test -d "$R/etc/init.d"; then
            pass "17e: rootfs extracted from the final sysupgrade image"
          else
            R=$(ls -d "$PWD"/openwrt/build_dir/target-*/root-qualcommax 2>/dev/null | head -n1)
            warn "17e: could not extract the sysupgrade rootfs - checking the staging rootfs instead ($R)"
          fi
          XB="$R/usr/bin/xray"
          if [ -n "$USQ" ] && [ -s "$O/root.sqfs" ]; then
            "$USQ" -no-progress -no-xattrs -f -d "$O/xr" "$O/root.sqfs" usr/bin/xray > /dev/null 2>&1 || true
            XB="$O/xr/usr/bin/xray"
          fi
          rm -f "$O/root.sqfs"
          tar -xOf "$SYSU" --wildcards '*/kernel' > "$O/kernel.itb" 2>/dev/null || true
          if [ "$WIFI_ETH" = "true" ]; then
            soft "image: ath11k loads with frame_mode=2" grep -qx 'ath11k frame_mode=2' "$R/etc/modules.d/ath11k-frame-mode"
          fi
          if [ "$IRQS" = "true" ]; then
            soft "image: Wi-Fi IRQ split script is executable" test -x "$R/etc/init.d/mx2000-irq"
            soft "image: Wi-Fi IRQ split runs at boot (etc/rc.d/S99mx2000-irq)" test -L "$R/etc/rc.d/S99mx2000-irq"
          fi
          if [ "$NETT" = "true" ]; then
            soft "image: 2 MB TCP receive buffer + network budget (etc/sysctl.d/99-mx2000-net.conf)" grep -qx 'net.ipv4.tcp_rmem=4096 131072 2097152' "$R/etc/sysctl.d/99-mx2000-net.conf"
            soft "image: v2rayA/xray start with GOMAXPROCS=1 GOGC=200" grep -q 'procd_append_param env GOMAXPROCS=1 GOGC=200' "$R/etc/init.d/v2raya"
            soft "image: cubic is the TCP congestion control (99-mx2000-net.conf, after 12-tcp-bbr.conf)" grep -qx 'net.ipv4.tcp_congestion_control=cubic' "$R/etc/sysctl.d/99-mx2000-net.conf"
            soft "image: tcp_bbr.ko is in the image" sh -c "find '$R/lib/modules' -name tcp_bbr.ko | grep -q ."
            soft "image: tcp_bbr loads at boot (etc/modules.d)" grep -rqx 'tcp_bbr' "$R/etc/modules.d"
          fi
          if [ "$PERF" = "true" ]; then
            soft "image: kernel command line in the FIT has hardened_usercopy=off mitigations=off" grep -aq 'hardened_usercopy=off mitigations=off' "$O/kernel.itb"
          fi
          if [ "${{ inputs.syscfg_storage != false }}" = "true" ]; then
            soft "image: syscfg storage script is executable" test -x "$R/etc/init.d/syscfg-storage"
            soft "image: syscfg storage runs at boot (etc/rc.d/S19syscfg-storage)" test -L "$R/etc/rc.d/S19syscfg-storage"
          fi
          if [ "${XRAY_SPLICE:-off}" = on ]; then
            soft "image: xray has the zero-copy download for VLESS over TCP (patch 900)" grep -aq 'VLESS downlink splice' "$XB"
          fi
          rm -rf "$O/kernel.itb" "$O/xr"

      - name: "18. Flash readiness: static safety + comparison with the real router (never blocks the upload)"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          OUT=openwrt/bin/targets/qualcommax/ipq50xx
          SYSU=$(ls $OUT/*linksys_mx2000*squashfs-sysupgrade* 2>/dev/null | head -n1)
          FACT=$(ls $OUT/*linksys_mx2000*squashfs-factory* 2>/dev/null | head -n1)
          ITB=$(ls $OUT/*linksys_mx2000*initramfs* 2>/dev/null | head -n1)
          REF=out/ref-combined; [ -d "$REF" ] || REF=selfrepo/ref
          if [ -d "$REF" ] && [ -n "$(ls -A $REF 2>/dev/null)" ]; then echo "reference data found: $(ls $REF | tr '\n' ' ')"; else echo "no ref/ directory in your repo yet"; REF=""; fi
          mkdir -p out/tools && cp compare-mx2000.py mx2000-preflight.sh mx2000-postmortem.sh out/tools/
          python3 compare-mx2000.py --built-dts out/11-mx2000-decompiled.dts --ref-dir "$REF" \
            --sysupgrade "$SYSU" --factory "$FACT" --itb "$ITB" --tree openwrt \
            --envtools-block out/16-uboot-envtools-uci.txt --mkimage openwrt/staging_dir/host/bin/mkimage \
            --kernel-config out/13-kernel.config --recipe openwrt/target/linux/qualcommax/image/ipq50xx.mk \
            --report out/18-flash-readiness.md --summary "$SUMMARY" | tee out/18-flash-readiness.log
          RC=${PIPESTATUS[0]}
          grep -E '^\[(CRIT|WARN)\]' out/18-flash-readiness.log | head -n 60 | while read -r l; do echo "::warning::$l"; done
          exit $RC

      - name: "19. Audit: what OpenWrt main has that this build does not (never blocks the upload)"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          cd openwrt
          # 1) كيف تُبنى الصورة فعلاً (الـ recipe) - للمقارنة مع صورة OpenWrt 25 الشغالة
          { echo "### device recipes (linksys mx*)"; awk '/^define Device\/linksys_m/,/^endef/' target/linux/qualcommax/image/ipq50xx.mk
            echo; echo "### kernel/FIT lines of the image makefiles"; grep -nE 'KERNEL|FIT|fit |LOADADDR|DTS_CONFIG|compress|gzip|lzma' target/linux/qualcommax/image/Makefile target/linux/qualcommax/image/ipq50xx.mk
          } > ../out/19-recipe.txt 2>&1 || true
          mkdir -p ../out/19-copy && cp target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh target/linux/qualcommax/ipq50xx/base-files/etc/init.d/bootcount target/linux/qualcommax/ipq50xx/config-default ../out/19-copy/ 2>/dev/null || true
          # 2) باتشات generic موجودة بـ BASE (main) وغير موجودة عندنا، وتلمس عتاد Qualcomm/NAND/NVMEM/mtd/spi/clk...
          RX='drivers/(clk/qcom|pinctrl/qcom|soc/qcom|firmware/qcom|mtd|spi|nvmem|net/mdio|net/phy|net/ethernet/qualcomm|mailbox|remoteproc|rpmsg|hwspinlock|regulator|watchdog|pwm|usb/(dwc3|phy)|phy/qualcomm|tty/serial|reset|clk/clk-|of/|dma/qcom|crypto/qce|thermal/qcom|cpufreq)|arch/arm64/(boot/dts/qcom|kernel|mm|include)'
          : > ../out/19-generic-missing-relevant.txt
          for d in backport-6.6 pending-6.6 hack-6.6; do
            git ls-tree -r --name-only "$BASE" -- "target/linux/generic/$d" | sort > /tmp/b-$d
            git ls-files -- "target/linux/generic/$d" | sort > /tmp/o-$d
            comm -23 /tmp/b-$d /tmp/o-$d | while read -r f; do
              T=$(git show "$BASE:$f" 2>/dev/null | grep -E '^\+\+\+ b/' | sed 's#^+++ b/##' | grep -E "$RX" | head -n 4 | tr '\n' ' ')
              if [ -n "$T" ]; then echo "$f  ->  $T"; fi
            done >> ../out/19-generic-missing-relevant.txt
          done
          M=$(wc -l < ../out/19-generic-missing-relevant.txt)
          if [ "$M" -eq 0 ]; then pass "AUDIT: no qcom/mtd/spi/nvmem related generic patch of BASE is missing"; else warn "AUDIT: $M generic patches of BASE touching Qualcomm/flash/clock/DT code are NOT in this build (see 19-generic-missing-relevant.txt): $(head -n 6 ../out/19-generic-missing-relevant.txt | cut -c1-150 | tr '\n' '|')"; fi
          # 3) باتشات qualcommax (من BASE) الي تلمس ملفات خارج qualcommax: نتأكد أن الملفات موجودة بشجرة الكيرنل المبنية
          KD=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.* | head -n1)
          grep -hE '^\+\+\+ b/' target/linux/qualcommax/patches-6.6/*.patch | sed 's#^+++ b/##' | sort -u | grep -E 'drivers/(clk|pinctrl|soc|firmware|mtd|spi|nvmem|net)' | while read -r f; do [ -e "$KD/$f" ] || echo "$f"; done > ../out/19-qualcommax-patch-targets-missing.txt
          [ ! -s ../out/19-qualcommax-patch-targets-missing.txt ] && pass "AUDIT: every file touched by qualcommax patches exists in the built kernel tree" || warn "AUDIT: qualcommax patches touch $(wc -l < ../out/19-qualcommax-patch-targets-missing.txt) files that are absent from the kernel tree (new files they create are expected)"
          # 4) أحجام: kernel Image بعد الضغط مقابل المساحة
          IMG=$(find build_dir -path '*linux-6.6*' -name Image -size +1M 2>/dev/null | head -n1)
          [ -n "$IMG" ] && echo "kernel Image: $(stat -c %s "$IMG") bytes ($IMG)" | tee ../out/19-kernel-size.txt || true

      - name: "20. Boot-chain check of the real images (what U-Boot and the kernel will see)"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          OUT=openwrt/bin/targets/qualcommax/ipq50xx
          DIAGFLAG=""; [ "${{ inputs.diag }}" != "false" ] && DIAGFLAG="--diag"
          set +e
          python3 fitcheck.py $DIAGFLAG \
            --sysupgrade "$(ls $OUT/*linksys_mx2000*squashfs-sysupgrade* | head -n1)" \
            --factory "$(ls $OUT/*linksys_mx2000*squashfs-factory* | head -n1)" \
            --initramfs "$(ls $OUT/*linksys_mx2000*initramfs* | head -n1)" \
            --recipe openwrt/target/linux/qualcommax/image/ipq50xx.mk \
            --report out/20-fitcheck.md --summary "$SUMMARY" | tee out/20-fitcheck.log
          RC=${PIPESTATUS[0]}; set -e
          grep -E '^\[CRIT\]' out/20-fitcheck.log | while read -r l; do echo "::error::$l"; done
          grep -E '^\[WARN\]' out/20-fitcheck.log | while read -r l; do echo "::warning::$l"; done
          # the FIT is made by 24.10 tools (mkits.sh, image-commands.mk) from main's image Makefile: show what differs
          cd openwrt
          { git show "$BASE:scripts/mkits.sh" | diff - scripts/mkits.sh
            diff <(git show "$BASE:include/image-commands.mk" | sed -n '/^define Build\/fit$/,/^endef$/p') <(sed -n '/^define Build\/fit$/,/^endef$/p' include/image-commands.mk); } > ../out/20-fit-tools-vs-main.diff || true
          if [ ! -s ../out/20-fit-tools-vs-main.diff ]; then pass "FIT tools used for this build (mkits.sh + Build/fit) are identical to main"
          elif [ -f ../out/FALLBACK_6e ]; then echo "::warning::FIT tools are the 24.10 ones (step 15 fallback) - compare with the working image in step 21"
          else echo "::error::FIT tools differ from main (20-fit-tools-vs-main.diff) - step 6e did not take effect"; fi
          grep -nE 'fit|FIT' target/linux/qualcommax/image/Makefile > ../out/20-qualcommax-fit-lines.txt || true
          cd ..
          if [ -n "$DIAGFLAG" ]; then cat >> "$SUMMARY" <<'LEDS'
          - **LED GUIDE (diagnostic build: a kernel panic now HALTS, it never reboots)** watch for 2 minutes:
          - A) still reboots every ~7 s, LED steady -> NOT a kernel panic: an instant hardware reset (TrustZone/XPU access violation or watchdog) in the first second
          - A2) LED steady and it STAYS like that (no reboot) -> the kernel panicked very early, before the LED driver (software bug: DTB/early init)
          - B) blue heartbeat starts, then FREEZES for good -> kernel panic/oops after the drivers loaded
          - C) blue heartbeat never stops -> kernel alive but stuck (waiting for root or init)
          - D) heartbeat -> fast blink -> solid blue -> OpenWrt 24.10 is up; logs are saved in /etc/mx2000-diag
          - to get back to OpenWrt 25 in A2/B/C: unplug and replug power 4 times (each time as soon as the LED lights); U-Boot counts every start and falls back
          LEDS
          fi
          exit $RC

      - name: "21. Boot suspects: every suspected cause, one numbered check each (PROBLEM / SUSPECT / UNKNOWN / OK)"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          OUT=openwrt/bin/targets/qualcommax/ipq50xx
          REF=out/ref-combined; [ -d "$REF" ] || REF=selfrepo/ref; [ -d "$REF" ] || REF=""
          USQ=$(ls openwrt/staging_dir/host/bin/unsquashfs4 openwrt/staging_dir/host/bin/unsquashfs 2>/dev/null | head -n1)
          cp bootsuspects.py fitcheck.py out/tools/ 2>/dev/null || true
          set +e
          python3 bootsuspects.py \
            --sysupgrade "$(ls $OUT/*linksys_mx2000*squashfs-sysupgrade* | head -n1)" \
            --factory "$(ls $OUT/*linksys_mx2000*squashfs-factory* | head -n1)" \
            --kernel-config out/13-kernel.config --ref-dir "$REF" --unsquashfs "$USQ" \
            --report out/21-boot-suspects.md --json out/21-boot-suspects.json --summary "$SUMMARY" | tee out/21-boot-suspects.log
          RC=${PIPESTATUS[0]}; set -e
          grep -E '^\[PROBLEM' out/21-boot-suspects.log | while read -r l; do echo "::error::$l"; done
          grep -E '^\[SUSPECT' out/21-boot-suspects.log | while read -r l; do echo "::warning::$l"; done
          U=$(grep -c '^\[UNKNOWN' out/21-boot-suspects.log || true)
          [ "$U" -gt 0 ] && echo "::notice::$U suspects need data from the router: run mx2000-preflight.sh (and mx2000-postmortem.sh after a failed boot), commit ref/, re-run"
          cat out/21-boot-suspects.md >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: "21c. Built-in drivers vs their DT nodes (the crash is in a built-in driver: it happens before modules load)"
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          KD=$(ls -d openwrt/build_dir/target-*/linux-qualcommax_ipq50xx/linux-6.6.* | head -n1)
          DTC=$(ls "$KD/scripts/dtc/dtc" openwrt/staging_dir/host/bin/dtc 2>/dev/null | head -n1)
          REFDTS=""
          if [ -s out/ref-combined/kernel-head-official25.bin ] && [ -n "$DTC" ]; then
            python3 - <<'PYDTB'
          import importlib.machinery
          fc = importlib.machinery.SourceFileLoader('fc', 'fitcheck.py').load_module()
          b = open('out/ref-combined/kernel-head-official25.bin', 'rb').read()
          root, total = fc.fdt_parse(b)
          imgs = root['kids']['images']['kids']; confs = root['kids']['configurations']
          cfg = confs['kids'][fc.pstr(confs['props']['default'])]
          fn = imgs[fc.pstrs(cfg['props']['fdt'])[0]]
          open('out/official25.dtb', 'wb').write(fc.decompress(fc.pstr(fn['props'].get('compression')), fc.image_data(b, total, fn)))
          PYDTB
            "$DTC" -q -I dtb -O dts out/official25.dtb > out/official25.dts && REFDTS=out/official25.dts
          fi
          python3 bindcheck.py --dts out/11-mx2000-decompiled.dts --kernel-dir "$KD" --ref-dts "$REFDTS" --report out/21c-bindcheck.md --summary "$SUMMARY" | tee out/21c-bindcheck.log
          grep -E '^\[MISSING' out/21c-bindcheck.log | while read -r l; do echo "::error::$l"; done
          grep -E '^\[DIFF' out/21c-bindcheck.log | while read -r l; do echo "::warning::$l"; done
          { echo "### Built-in drivers vs DT nodes"; echo '```'; cat out/21c-bindcheck.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "22. Bisect images: same kernel, one hardware group disabled per image (diagnostic build)"
        if: ${{ inputs.diag != false }}
        continue-on-error: true
        run: |
          source ./ci-lib.sh
          OUT=openwrt/bin/targets/qualcommax/ipq50xx
          SYSU=$(ls $OUT/*linksys_mx2000*squashfs-sysupgrade.bin | head -n1)
          mkdir -p variants
          python3 mkvariants.py --sysupgrade "$SYSU" --outdir variants --fwtool openwrt/staging_dir/host/bin/fwtool --summary "$SUMMARY" | tee out/22-variants.txt
          for f in variants/*-sysupgrade.bin; do
            if python3 fitcheck.py --diag --sysupgrade "$f" --recipe openwrt/target/linux/qualcommax/image/ipq50xx.mk --report "$f.check.md" > /dev/null; then pass "variant OK: $(basename "$f")"
            else echo "::error::variant failed the image check: $(basename "$f")"; grep CRIT "$f.check.md"; rm -f "$f"; fi
          done
          cat >> "$SUMMARY" <<'BISECT'
          - **HOW TO BISECT** flash ONE variant (sysupgrade from OpenWrt 25, keep settings OFF), watch the blue LED for 1 minute, return to 25 (power-cycle 4x if it does not by itself):
          - 1) no-nand first: heartbeat KEEPS GOING -> the panic is in flash/UBI/rootfs; still FREEZES -> the panic happens before the rootfs, continue with 2)
          - 2) minimal (ethernet+wifi+usb+extras off): heartbeat keeps going -> culprit is in one of those groups, try 3); still freezes -> core clocks/pins/SoC (report back)
          - 3) no-ethernet, no-wifi, no-usb-pcie, no-extras one by one: the one whose heartbeat keeps going holds the culprit
          BISECT

      # ------------------------------------------------------------------
      - name: "Summary"
        if: always()
        run: |
          [ -f out/summary.md ] && cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: "Compress logs"
        if: always()
        run: |
          gzip -f out/stage-*.log out/10-tools.log 2>/dev/null || true
          du -sh out

      - name: "Upload logs and reports"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-mx2000-${{ github.run_number }}
          path: out/

      - name: "Upload bisect variants"
        if: ${{ inputs.diag != false }}
        uses: actions/upload-artifact@v5
        with:
          name: MX2000-bisect-variants-${{ github.run_number }}
          path: |
            variants/*-sysupgrade.bin
            variants/*.disabled.txt
          if-no-files-found: warn

      - name: "Upload firmware"
        uses: actions/upload-artifact@v5
        with:
          name: OpenWrt-24.10.8-MX2000-${{ github.run_number }}
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*linksys_mx2000*
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
          if-no-files-found: error

      - name: "Upload kmod feed (mx2000-kmods.tar: copy it to the router and run mx2000-kmods /tmp/mx2000-kmods.tar)"
        if: ${{ env.KMOD_FEED == 'on' && hashFiles('kmodfeed/READY') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: MX2000-kmods-${{ github.run_number }}
          path: kmodfeed/mx2000-kmods.tar
          compression-level: 0
          if-no-files-found: warn

      - name: "Publish kmod feed as a release (the router fetches it: mx2000-kmods)"
        if: ${{ env.KMOD_FEED == 'on' && hashFiles('kmodfeed/READY') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./ci-lib.sh
          R="$GITHUB_REPOSITORY"
          gh release delete "$KTAG" -y --cleanup-tag -R "$R" > /dev/null 2>&1 || true
          printf '%s\n' "opkg kmod feed of build ${{ github.run_number }} (kernel $(sed -n 's/^KERNEL=//p' kmodfeed/kmods/.mx2000), $(grep -c '^Package: ' kmodfeed/kmods/Packages) kmods)." "" \
            "Only for the firmware of the same build. Private repo only, once on the router: mx2000-kmods token <read-only token for this repo>" \
            "then: mx2000-kmods   and   opkg install kmod-<name>. After flashing a newer build its feed is fetched at boot." > kmodfeed/notes.txt
          gh release create "$KTAG" kmodfeed/mx2000-kmods.tar -R "$R" --target "$GITHUB_SHA" --prerelease \
            --title "MX2000 kmods - build ${{ github.run_number }}" --notes-file kmodfeed/notes.txt
          check "kmod feed published as release $KTAG" gh release view "$KTAG" -R "$R"
          # keep the feeds of the newest 8 builds (older firmware builds then need mx2000-kmods <file.tar>)
          gh release list -R "$R" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("kmods-"))] | sort_by(.createdAt) | reverse | .[8:] | .[].tagName' |
            while read -r old; do gh release delete "$old" -y --cleanup-tag -R "$R" && echo "removed old kmod feed $old"; done
          echo "- **KMODS** published: release $KTAG of this repo" >> "$SUMMARY"
