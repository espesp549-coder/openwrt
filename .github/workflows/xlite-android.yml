          package com.xlite.app

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.InetSocketAddress
          import java.net.Proxy
          import java.net.Socket
          import java.net.URL

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var store: Store
              private val reqVpn = 10

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = Store(this)
                  web = WebView(this)
                  setContentView(web)
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  web.setBackgroundColor(0xFF080D18.toInt())
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.loadUrl("file:///android_asset/index.html")
                  XLiteVpnService.listener = {
                      runOnUiThread { web.evaluateJavascript("window.xl&&xl.refresh()", null) }
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }

              override fun onDestroy() {
                  XLiteVpnService.listener = null
                  super.onDestroy()
              }

              private fun startVpn() {
                  val i = Intent(this, XLiteVpnService::class.java).setAction(XLiteVpnService.ACTION_START)
                  startForegroundService(i)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqVpn) {
                      if (resultCode == RESULT_OK) startVpn() else toast("ما انمنحت صلاحية VPN")
                  }
              }

              private fun toast(msg: String) {
                  runOnUiThread {
                      web.evaluateJavascript("window.xl&&xl.toast(" + JSONObject.quote(msg) + ")", null)
                  }
              }

              private fun fetchSub(u: String): List<String> {
                  val url = URL(u)
                  val conn = if (XLiteVpnService.state == "on") {
                      url.openConnection(Proxy(Proxy.Type.SOCKS, InetSocketAddress("127.0.0.1", XLiteVpnService.SOCKS_PORT)))
                  } else {
                      url.openConnection()
                  }
                  val c = conn as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 20000
                  c.setRequestProperty("User-Agent", "XLite/0.1")
                  val body = c.inputStream.bufferedReader().readText()
                  c.disconnect()
                  var text = body.trim()
                  if (!text.contains("://")) {
                      text = try {
                          LinkParser.decodeBase64(text)
                      } catch (e: Exception) {
                          text
                      }
                  }
                  return text.lines().map { it.trim() }.filter { it.isNotEmpty() }
              }

              inner class Bridge {

                  @JavascriptInterface
                  fun state(): String {
                      val o = JSONObject()
                      o.put("state", XLiteVpnService.state)
                      o.put("message", XLiteVpnService.message)
                      var name = XLiteVpnService.serverName
                      if (name.isEmpty()) {
                          val sel = store.selected
                          name = store.servers().firstOrNull { it.id == sel }?.name ?: ""
                      }
                      o.put("server", name)
                      return o.toString()
                  }

                  @JavascriptInterface
                  fun list(): String {
                      val arr = JSONArray()
                      val sel = store.selected
                      for (s in store.servers()) {
                          val n = LinkParser.parse(s.link)
                          arr.put(
                              JSONObject().put("id", s.id).put("name", s.name)
                                  .put("proto", n?.protocol ?: "?").put("sel", s.id == sel)
                          )
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun add(text: String) {
                      Thread {
                          try {
                              val t = text.trim()
                              val links = if (t.startsWith("http://") || t.startsWith("https://")) fetchSub(t) else t.lines()
                              val n = store.add(links)
                              toast(if (n > 0) "انضاف $n سيرفر" else "ما لقيت سيرفر جديد مدعوم")
                          } catch (e: Exception) {
                              toast("فشل: " + (e.message ?: e.toString()))
                          }
                          XLiteVpnService.notifyUi()
                      }.start()
                  }

                  @JavascriptInterface
                  fun remove(id: String) {
                      store.remove(id)
                      XLiteVpnService.notifyUi()
                  }

                  @JavascriptInterface
                  fun select(id: String) {
                      store.selected = id
                      XLiteVpnService.notifyUi()
                  }

                  @JavascriptInterface
                  fun toggle() {
                      runOnUiThread {
                          val st = XLiteVpnService.state
                          if (st == "on" || st == "connecting") {
                              startService(Intent(this@MainActivity, XLiteVpnService::class.java).setAction(XLiteVpnService.ACTION_STOP))
                          } else if (store.selected.isEmpty()) {
                              toast("ضيف سيرفر أول")
                          } else {
                              val p = VpnService.prepare(this@MainActivity)
                              if (p != null) startActivityForResult(p, reqVpn) else startVpn()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun ping(id: String) {
                      Thread {
                          var ms = -1
                          try {
                              val srv = store.servers().firstOrNull { it.id == id }
                              val n = if (srv != null) LinkParser.parse(srv.link) else null
                              if (n != null) {
                                  val sock = Socket()
                                  val t0 = System.nanoTime()
                                  try {
                                      sock.connect(InetSocketAddress(n.host, n.port), 4000)
                                      ms = ((System.nanoTime() - t0) / 1000000).toInt()
                                  } finally {
                                      try {
                                          sock.close()
                                      } catch (e: Exception) {
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              ms = -1
                          }
                          val r = ms
                          runOnUiThread { web.evaluateJavascript("window.xl&&xl.ping('" + id + "'," + r + ")", null) }
                      }.start()
                  }

                  @JavascriptInterface
                  fun log(): String = XLiteVpnService.logText()

                  @JavascriptInterface
                  fun clearLog() {
                      XLiteVpnService.clearLog()
                  }
              }
          }
