      - name: Get the xray core (android arm64)
        run: |
          set -e
          cd xlite-android
          B="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}"
          curl -fsSL "$B/Xray-android-arm64-v8a.zip" -o /tmp/xray.zip
          curl -fsSL "$B/Xray-android-arm64-v8a.zip.dgst" -o /tmp/xray.dgst
          WANT=$(grep -i 'sha2-256' /tmp/xray.dgst | awk '{print $NF}' | head -1)
          GOT=$(sha256sum /tmp/xray.zip | awk '{print $1}')
          echo "want=$WANT got=$GOT"
          [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "xray hash mismatch"; exit 1; }
          mkdir -p /tmp/xray && unzip -o /tmp/xray.zip xray -d /tmp/xray
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/xray/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so
          file app/src/main/jniLibs/arm64-v8a/libxray.so || true

      - name: Build hev-socks5-tunnel (JNI, arm64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)}}"
          echo "NDK=$NDK"
          mkdir -p hev/jni && cd hev
          git clone --recursive --depth 1 --shallow-submodules https://github.com/heiher/hev-socks5-tunnel jni/hev-socks5-tunnel
          grep -rn "PKGNAME\|CLSNAME" jni/hev-socks5-tunnel/Android.mk jni/hev-socks5-tunnel/src/hev-jni.c || true
          echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
          "$NDK/ndk-build" NDK_PROJECT_PATH="$PWD" APP_BUILD_SCRIPT="$PWD/jni/Android.mk" \
            APP_ABI=arm64-v8a APP_PLATFORM=android-26 NDK_LIBS_OUT="$PWD/libs" NDK_OUT="$PWD/obj" \
            "APP_CFLAGS=-O3 -DPKGNAME=com/xlite/app" "APP_LDFLAGS=-Wl,--build-id=none -Wl,--hash-style=gnu"
          ls -la libs/arm64-v8a
          cp libs/arm64-v8a/libhev-socks5-tunnel.so ../xlite-android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the APK
        run: |
          set -e
          cd xlite-android
          gradle --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/XLite-android-arm64.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: XLite-android-arm64
          path: out/XLite-android-arm64.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          R="${{ github.repository }}"
          gh release view xlite-android -R "$R" > /dev/null 2>&1 || gh release create xlite-android -R "$R" --title "XLite Android" --notes "XLite for Android (arm64). Install the APK and allow the VPN request."
          gh release upload xlite-android -R "$R" --clobber out/XLite-android-arm64.apk
