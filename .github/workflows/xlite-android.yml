          package com.xlite.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.File
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.Socket

          class XLiteVpnService : VpnService() {

              companion object {
                  const val ACTION_START = "com.xlite.app.START"
                  const val ACTION_STOP = "com.xlite.app.STOP"
                  const val SOCKS_PORT = 10808

                  @Volatile
                  var state = "off" // off, connecting, on, error

                  @Volatile
                  var message = ""

                  @Volatile
                  var serverName = ""

                  @Volatile
                  var listener: (() -> Unit)? = null

                  private val logBuf = StringBuilder()

                  fun log(s: String) {
                      synchronized(logBuf) {
                          logBuf.append(s).append('\n')
                          if (logBuf.length > 20000) logBuf.delete(0, logBuf.length - 15000)
                      }
                      notifyUi()
                  }

                  fun logText(): String {
                      synchronized(logBuf) {
                          return logBuf.toString()
                      }
                  }

                  fun clearLog() {
                      synchronized(logBuf) {
                          logBuf.setLength(0)
                      }
                      notifyUi()
                  }

                  fun notifyUi() {
                      try {
                          listener?.invoke()
                      } catch (e: Exception) {
                      }
                  }
              }

              private var tun: ParcelFileDescriptor? = null
              private var proc: Process? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopAll()
                      state = "off"
                      message = ""
                      notifyUi()
                      stopForeground(true)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (state == "on" || state == "connecting") return START_NOT_STICKY
                  state = "connecting"
                  message = ""
                  notifyUi()
                  startForeground(1, notification("جاري الاتصال…"))
                  Thread {
                      try {
                          doStart()
                      } catch (t: Throwable) {
                          log("خطأ: " + (t.message ?: t.toString()))
                          fail(t.message ?: "خطأ غير معروف")
                      }
                  }.start()
                  return START_NOT_STICKY
              }

              private fun resolveHost(host: String): String {
                  if (host.contains(":") || host.matches(Regex("^[0-9.]+$"))) return host
                  val all = InetAddress.getAllByName(host)
                  for (a in all) if (a is Inet4Address) return a.hostAddress ?: host
                  return all[0].hostAddress ?: host
              }

              private fun waitPort(port: Int, ms: Int): Boolean {
                  val end = System.currentTimeMillis() + ms
                  while (System.currentTimeMillis() < end) {
                      try {
                          val s = Socket()
                          s.connect(InetSocketAddress("127.0.0.1", port), 300)
                          s.close()
                          return true
                      } catch (e: Exception) {
                          Thread.sleep(150)
                      }
                  }
                  return false
              }

              private fun doStart() {
                  val store = Store(this)
                  val sel = store.selected
                  val server = store.servers().firstOrNull { it.id == sel } ?: throw Exception("ما محدد سيرفر")
                  val node = LinkParser.parse(server.link) ?: throw Exception("رابط السيرفر غير مدعوم")
                  serverName = server.name
                  log("السيرفر: " + server.name + " (" + node.protocol + ")")

                  val addr = try {
                      resolveHost(node.host)
                  } catch (e: Exception) {
                      throw Exception("ما كدرت أحل اسم السيرفر " + node.host)
                  }
                  val cfg = LinkParser.config(LinkParser.outbound(node, addr), SOCKS_PORT)
                  val cfgFile = File(filesDir, "config.json")
                  cfgFile.writeText(cfg)

                  val bin = File(applicationInfo.nativeLibraryDir, "libxray.so")
                  if (!bin.exists()) throw Exception("نواة xray مو موجودة بالتطبيق")
                  val pb = ProcessBuilder(bin.absolutePath, "run", "-c", cfgFile.absolutePath)
                  pb.directory(filesDir)
                  pb.redirectErrorStream(true)
                  pb.environment()["XRAY_LOCATION_ASSET"] = filesDir.absolutePath
                  val p = pb.start()
                  proc = p
                  Thread {
                      try {
                          p.inputStream.bufferedReader().forEachLine { log(it) }
                      } catch (e: Exception) {
                      }
                  }.start()
                  if (!waitPort(SOCKS_PORT, 7000)) throw Exception("xray ما اشتغل (شوف السجل)")
                  log("xray اشتغل")

                  val b = Builder()
                      .setSession("XLite")
                      .setMtu(1500)
                      .addAddress("10.10.14.2", 30)
                      .addRoute("0.0.0.0", 0)
                      .addDnsServer("1.1.1.1")
                      .addDnsServer("8.8.8.8")
                  try {
                      b.addDisallowedApplication(packageName)
                  } catch (e: Exception) {
                  }
                  val t = b.establish() ?: throw Exception("ما انمنحت صلاحية VPN")
                  tun = t

                  val hev = File(filesDir, "hev.yml")
                  hev.writeText(
                      "tunnel:\n  mtu: 1500\nsocks5:\n  port: " + SOCKS_PORT +
                          "\n  address: 127.0.0.1\n  udp: 'udp'\nmisc:\n  log-level: warn\n"
                  )
                  try {
                      TProxyService.TProxyStartService(hev.absolutePath, t.fd)
                  } catch (e: Throwable) {
                      throw Exception("فشل تشغيل hev: " + (e.message ?: e.toString()))
                  }
                  log("الاتصال اشتغل")
                  state = "on"
                  notifyUi()
                  updateNotification("متصل — " + serverName)

                  Thread {
                      try {
                          p.waitFor()
                      } catch (e: Exception) {
                      }
                      if (state == "on") {
                          log("xray وقف")
                          fail("xray وقف فجأة")
                      }
                  }.start()
              }

              private fun stopAll() {
                  try {
                      TProxyService.TProxyStopService()
                  } catch (t: Throwable) {
                  }
                  try {
                      tun?.close()
                  } catch (e: Exception) {
                  }
                  tun = null
                  try {
                      proc?.destroy()
                  } catch (e: Exception) {
                  }
                  proc = null
              }

              private fun fail(msg: String) {
                  stopAll()
                  state = "error"
                  message = msg
                  notifyUi()
                  try {
                      stopForeground(true)
                  } catch (e: Exception) {
                  }
                  stopSelf()
              }

              override fun onRevoke() {
                  stopAll()
                  state = "off"
                  notifyUi()
                  stopForeground(true)
                  stopSelf()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  stopAll()
                  if (state == "on" || state == "connecting") state = "off"
                  notifyUi()
                  super.onDestroy()
              }

              private fun notification(text: String): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("xlite", "XLite", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, "xlite")
                      .setContentTitle("XLite")
                      .setContentText(text)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun updateNotification(text: String) {
                  try {
                      getSystemService(NotificationManager::class.java).notify(1, notification(text))
                  } catch (e: Exception) {
                  }
              }
          }
