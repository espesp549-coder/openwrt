          package com.xlite.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          class Server(val id: String, val name: String, val link: String)

          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("xlite", Context.MODE_PRIVATE)

              @Synchronized
              fun servers(): MutableList<Server> {
                  val out = ArrayList<Server>()
                  try {
                      val arr = JSONArray(sp.getString("servers", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Server(o.getString("id"), o.getString("name"), o.getString("link")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              @Synchronized
              fun save(list: List<Server>) {
                  val arr = JSONArray()
                  for (s in list) {
                      arr.put(JSONObject().put("id", s.id).put("name", s.name).put("link", s.link))
                  }
                  sp.edit().putString("servers", arr.toString()).apply()
              }

              var selected: String
                  get() = sp.getString("selected", "") ?: ""
                  set(v) {
                      sp.edit().putString("selected", v).apply()
                  }

              // returns how many new servers were added
              @Synchronized
              fun add(links: List<String>): Int {
                  val list = servers()
                  var n = 0
                  for (raw in links) {
                      val link = raw.trim()
                      if (link.isEmpty()) continue
                      val node = LinkParser.parse(link) ?: continue
                      if (list.any { it.link == link }) continue
                      list.add(Server(UUID.randomUUID().toString().substring(0, 8), node.name, link))
                      n++
                  }
                  save(list)
                  if (selected.isEmpty() && list.isNotEmpty()) selected = list[0].id
                  return n
              }

              @Synchronized
              fun remove(id: String) {
                  val list = servers()
                  list.removeAll { it.id == id }
                  save(list)
                  if (selected == id) selected = if (list.isNotEmpty()) list[0].id else ""
              }
          }
