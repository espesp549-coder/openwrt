          /*
           * XLite: replacement for the JNI glue of hev-socks5-tunnel.
           * Plain JNI names (no RegisterNatives / JNI_OnLoad), so nothing can fail while loading the library.
           */
          #include <jni.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>

          /* XL_INCLUDES */

          #ifndef HEV_MAIN
          #define HEV_MAIN hev_socks5_tunnel_main_from_file
          #endif

          #ifndef HEV_QUIT
          #define HEV_QUIT hev_socks5_tunnel_quit
          #endif

          static pthread_t work_thread;
          static int running = 0;
          static char *config_path = NULL;
          static int tun_fd = -1;

          static void *
          work_handler (void *data)
          {
              HEV_MAIN (config_path, tun_fd);
              return NULL;
          }

          JNIEXPORT void JNICALL
          Java_com_xlite_app_TProxyService_TProxyStartService (JNIEnv *env, jobject thiz,
                                                               jstring path, jint fd)
          {
              const char *p;

              if (running)
                  return;

              p = (*env)->GetStringUTFChars (env, path, NULL);
              if (!p)
                  return;
              free (config_path);
              config_path = strdup (p);
              (*env)->ReleaseStringUTFChars (env, path, p);
              tun_fd = fd;

              if (pthread_create (&work_thread, NULL, work_handler, NULL) == 0)
                  running = 1;
          }

          JNIEXPORT void JNICALL
          Java_com_xlite_app_TProxyService_TProxyStopService (JNIEnv *env, jobject thiz)
          {
              if (!running)
                  return;
              HEV_QUIT ();
              pthread_join (work_thread, NULL);
              running = 0;
          }
          XL_FILE_20
