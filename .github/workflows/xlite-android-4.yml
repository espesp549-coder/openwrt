                  val uid = android.os.Process.myUid()
                  baseRx = android.net.TrafficStats.getUidRxBytes(uid).coerceAtLeast(0)
                  baseTx = android.net.TrafficStats.getUidTxBytes(uid).coerceAtLeast(0)
                  startedAt = android.os.SystemClock.elapsedRealtime()
                  health = null
                  state = "on"
                  notifyUi()
                  updateNotification("متصل — " + serverName)

