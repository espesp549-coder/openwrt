              private fun listsInfo(): JSONObject {
                  val o = JSONObject()
                  for (n in listOf("gfw", "cn4")) {
                      val f = XrayConfig.listFile(ctx, "$n.txt")
                      o.put(n, if (f.exists()) JSONObject().put("size", f.length()).put("mtime", f.lastModified() / 1000) else JSONObject.NULL)
                  }
