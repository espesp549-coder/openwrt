          package com.xlite.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          class Server(val id: String, val name: String, val link: String, val sub: String)

          class Sub(val id: String, val name: String, val url: String, val updated: Long, val count: Int)

          object Defaults {
              val map: Map<String, String> = mapOf(
                  "transparent" to "all", "rule_mode" to "except_cn", "antipollution" to "doh",
                  "dns_upstream" to "1.1.1.1 8.8.8.8", "special" to "off", "tfo" to "default",
                  "mux" to "0", "mux_conc" to "8", "sniffing" to "http_tls_quic",
                  "sub_interval" to "24", "gfw_auto" to "off", "update_via" to "direct", "loglevel" to "warning",
                  "block_quic" to "0", "ipv6" to "auto", "bypass" to "", "routinga" to "",
                  "r2_fallback" to "main", "r2_iq" to "1", "r2_domains" to "", "iso_calls" to "1",
                  "ui_motion" to "full", "ui_refresh" to "2", "auto_update" to "0",
                  "adblock" to "off", "adblock_allow" to "", "hide_idle" to "0", "billing_day" to "1"
              )
          }

          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("xlite", Context.MODE_PRIVATE)

              // ---- servers ----
              @Synchronized
              fun servers(): MutableList<Server> {
                  val out = ArrayList<Server>()
                  try {
                      val arr = JSONArray(sp.getString("servers", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Server(o.getString("id"), o.getString("name"), o.getString("link"), o.optString("sub", "")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              @Synchronized
              fun save(list: List<Server>) {
                  val arr = JSONArray()
                  for (s in list) {
                      arr.put(JSONObject().put("id", s.id).put("name", s.name).put("link", s.link).put("sub", s.sub))
                  }
                  sp.edit().putString("servers", arr.toString()).apply()
              }

              var selected: String
                  get() = sp.getString("selected", "") ?: ""
                  set(v) {
                      sp.edit().putString("selected", v).apply()
                  }

              private fun key(l: String) = l.substringBefore('#')

              // returns the report entries for the UI
              @Synchronized
              fun add(links: List<String>, sub: String = ""): JSONArray {
                  val list = servers()
                  val report = JSONArray()
                  for (raw in links) {
                      val link = raw.trim()
                      if (link.isEmpty()) continue
                      val node = LinkParser.parse(link)
                      if (node == null) {
                          report.put(JSONObject().put("ok", false).put("error", "رابط غير مدعوم"))
                          continue
                      }
                      if (list.any { key(it.link) == key(link) }) {
                          report.put(JSONObject().put("ok", true).put("dup", true).put("name", node.name))
                          continue
                      }
                      val id = "s" + UUID.randomUUID().toString().replace("-", "").substring(0, 8)
                      list.add(Server(id, node.name, link, sub))
                      report.put(JSONObject().put("ok", true).put("name", node.name).put("id", id))
                  }
                  save(list)
                  if (selected.isEmpty() && list.isNotEmpty()) selected = list[0].id
                  return report
              }

              @Synchronized
              fun remove(id: String) {
                  val list = servers()
                  list.removeAll { it.id == id }
                  save(list)
                  if (selected == id) selected = if (list.isNotEmpty()) list[0].id else ""
                  if (setting("server2") == id) setSetting("server2", "")
              }

              @Synchronized
              fun update(id: String, name: String?, link: String?) {
                  val list = servers().map {
                      if (it.id == id) Server(it.id, name ?: it.name, link ?: it.link, it.sub) else it
                  }
                  save(list)
              }

              // ---- subscriptions ----
              @Synchronized
              fun subs(): MutableList<Sub> {
                  val out = ArrayList<Sub>()
                  try {
                      val arr = JSONArray(sp.getString("subs", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Sub(o.getString("id"), o.optString("name"), o.getString("url"), o.optLong("updated"), o.optInt("count")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              @Synchronized
              fun saveSubs(list: List<Sub>) {
                  val arr = JSONArray()
                  for (s in list) arr.put(JSONObject().put("id", s.id).put("name", s.name).put("url", s.url).put("updated", s.updated).put("count", s.count))
                  sp.edit().putString("subs", arr.toString()).apply()
              }

              // ---- settings ----
              @Synchronized
              fun rawSettings(): JSONObject = try {
                  JSONObject(sp.getString("settings", "{}"))
              } catch (e: Exception) {
                  JSONObject()
              }

              fun setting(k: String): String {
                  val r = rawSettings()
                  if (r.has(k)) return r.optString(k)
                  return Defaults.map[k] ?: ""
              }

              @Synchronized
              fun setSetting(k: String, v: String) {
                  val r = rawSettings()
                  r.put(k, v)
                  sp.edit().putString("settings", r.toString()).apply()
              }

              fun allSettings(): JSONObject {
                  val o = JSONObject()
                  for ((k, v) in Defaults.map) o.put(k, v)
                  val r = rawSettings()
                  val it = r.keys()
                  while (it.hasNext()) {
                      val k = it.next()
                      o.put(k, r.optString(k))
                  }
                  o.put("server2", setting("server2"))
                  return o
              }

              @Synchronized
              fun replaceAll(servers: List<Server>, subs: List<Sub>, settings: JSONObject, selected: String) {
                  save(servers)
                  saveSubs(subs)
                  sp.edit().putString("settings", settings.toString()).putString("selected", selected).apply()
              }

              // ---- small caches ----
              fun cache(k: String): String = sp.getString("c_" + k, "") ?: ""
              fun putCache(k: String, v: String) {
                  sp.edit().putString("c_" + k, v).apply()
              }
          }
