              private fun stopAll() {
                  health = null
                  try {
                      tproxy?.TProxyStopService()
                  } catch (t: Throwable) {
                  }
                  try {
                      tun?.close()
                  } catch (e: Exception) {
                  }
                  tun = null
                  tproxy = null
                  try {
                      proc?.destroy()
                  } catch (e: Exception) {
                  }
                  proc = null
              }

              private fun fail(msg: String) {
