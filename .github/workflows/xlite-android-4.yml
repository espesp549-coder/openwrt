                  log("xray اشتغل")

                  if (myGen != gen) return
                  val b = Builder()
                      .setSession("XLite")
                      .setMtu(1500)
                      .addAddress("10.10.14.2", 30)
                      .addRoute("0.0.0.0", 0)
                      .addDnsServer("1.1.1.1")
                      .addDnsServer("8.8.8.8")
                  if (store.setting("ipv6") == "1") {
                      try {
                          b.addAddress("fd00:10:14::2", 126).addRoute("::", 0).addDnsServer("2606:4700:4700::1111")
                      } catch (e: Exception) {
                      }
