                  var listener: (() -> Unit)? = null

                  private val logBuf = StringBuilder()

                  fun log(s: String) {
                      synchronized(logBuf) {
                          logBuf.append(s).append('\n')
                          if (logBuf.length > 20000) logBuf.delete(0, logBuf.length - 15000)
                      }
                      notifyUi()
                  }

                  fun logText(): String {
                      synchronized(logBuf) {
                          return logBuf.toString()
                      }
                  }

                  fun clearLog() {
                      synchronized(logBuf) {
                          logBuf.setLength(0)
                      }
                      notifyUi()
                  }

                  fun notifyUi() {
                      try {
                          listener?.invoke()
                      } catch (e: Exception) {
                      }
                  }
