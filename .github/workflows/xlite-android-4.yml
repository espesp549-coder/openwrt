name: XLite Android

# Builds the XLite Android app (arm64) and publishes the APK as release "xlite-android".
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: "25.1.30"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write the project
        run: |
          set -e
          mkdir -p xlite-android && cd xlite-android
          mkdir -p "$(dirname "app/build.gradle")"
          cat > "app/build.gradle" <<'XL_FILE_1'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.xlite.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.xlite.app'
                  minSdk 26
                  targetSdk 33
                  versionCode 2
                  versionName '0.2.0'
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('xlite.p12')
                      storePassword 'xlite123'
                      keyAlias 'xlite'
                      keyPassword 'xlite123'
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      keepDebugSymbols.add('**/*.so')
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          XL_FILE_1
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'XL_FILE_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="XLite"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".XLiteVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          XL_FILE_2
          mkdir -p "$(dirname "app/src/main/assets/index.html")"
          cat > "app/src/main/assets/index.html" <<'XL_FILE_3'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>XLite</title>
          <style>
          html,body{margin:0;padding:0;background:#070A12;color:#EAF0F7;-webkit-text-size-adjust:100%}
          .xl{border-radius:0!important;max-width:none!important;min-height:100vh!important}
          @media(min-width:600px){.xl{max-width:560px!important;margin:0 auto!important}}
          </style>
          </head>
          <body>
          <div id="app"></div>
          <script src="shim.js"></script>
          <script src="ui.wrapped.js"></script>
          <script>xliteStart();</script>
          </body>
          </html>
          XL_FILE_3
          mkdir -p "$(dirname "app/src/main/assets/shim.js")"
          cat > "app/src/main/assets/shim.js" <<'XL_FILE_4'
          // LuCI compatibility layer: lets the router UI (ui.js) run inside the Android WebView.
          (function () {
            var cbs = {}, seq = 0;
            window.__rpcDone = function (id, json) {
              var c = cbs[id]; if (!c) return; delete cbs[id]; clearTimeout(c.t);
              var v = {}; try { v = JSON.parse(json); } catch (e) {}
              c.res(v);
            };
            var lastErr = '';
            window.rpcCall = function (method, params) {
              return window.rpcRaw(method, params).then(function (r) {
                if (method === 'status' && r && r.error && r.error !== lastErr) { lastErr = r.error; try { window.__xl.toast(r.error, true); } catch (e) {} }
                if (method === 'status' && r && !r.error) lastErr = '';
                return r;
              });
            };
            window.rpcRaw = function (method, params) {
              return new Promise(function (res) {
                var id = ++seq;
                cbs[id] = { res: res, t: setTimeout(function () { if (cbs[id]) { delete cbs[id]; res({}); } }, 90000) };
                try { Android.rpc(method, JSON.stringify(params || {}), id); } catch (e) { delete cbs[id]; res({}); }
              });
            };
            var rpc = { declare: function (o) {
              var names = o.params || [];
              return function () {
                var p = {}, a = arguments;
                for (var i = 0; i < names.length; i++) p[names[i]] = a[i];
                return window.rpcCall(o.method, p);
              };
            } };
            var poll = { add: function (fn, sec) { setInterval(function () { try { fn(); } catch (e) {} }, Math.max(1, +sec || 2) * 1000); } };
            var L = { bind: function (f, o) { return f.bind(o); }, resource: function (p) { return p; } };
            var baseclass = { extend: function (proto) { var C = function () {}; C.prototype = proto; return C; } };

            function append(node, c) {
              if (c === null || c === undefined || c === false) return;
              if (Array.isArray(c)) { for (var i = 0; i < c.length; i++) append(node, c[i]); return; }
              if (c.nodeType) { node.appendChild(c); return; }
              node.appendChild(document.createTextNode('' + c));
            }
            function E(tag, attr, data) {
              if (!(attr instanceof Object) || Array.isArray(attr) || attr.nodeType) { data = attr; attr = null; }
              var el;
              if (Array.isArray(tag)) el = document.createDocumentFragment();
              else if (tag && tag.nodeType) el = tag;
              else el = document.createElement(tag);
              if (attr && el.nodeType === 1) {
                for (var k in attr) {
                  if (!Object.prototype.hasOwnProperty.call(attr, k)) continue;
                  var v = attr[k];
                  if (v === null || v === undefined) continue;
                  if (typeof v === 'function') el.addEventListener(k, v);
                  else if (k === 'class') el.className = v;
                  else if (typeof v === 'object') el.setAttribute(k, JSON.stringify(v));
                  else el.setAttribute(k, v);
                }
              }
              append(el, data);
              return el;
            }

            window.xliteStart = function () {
              window.rpcCall('status').then(function (st) {
                var Cls = window.__XLUI(baseclass, rpc, {}, poll, L, E);
                var inst = new Cls();
                inst.pwa = function () {};
                var HIDE_SEC = { ports: 1, dev: 1, tg: 1, core: 1, iso: 1 };
                var HIDE_ROW = { impl: 1, ip_forward: 1, port_sharing: 1, rule_mode: 1, _routinga: 1, special: 1, sub_interval: 1, gfw_auto: 1,
                  r2_kernel: 1, speedtest_main: 1, r2_speed_ports: 1, smart_mux: 1, dns: 1, dns_cache: 1, dns_cache_size: 1, dns_stale: 1, dns_min_ttl: 1,
                  _upd: 1, _rm: 1, auto_update: 1 };
                var origDef = inst.settingsDef;
                inst.settingsDef = function () {
                  var defs = origDef.call(this), out = [];
                  defs.forEach(function (d) {
                    if (HIDE_SEC[d.id]) return;
                    if (d.id === 'v2') d.title = 'الاتصال';
                    d.rows = d.rows.filter(function (r) { return !HIDE_ROW[r[0]]; });
                    d.rows.forEach(function (r) {
                      if (r[0] === 'mux') r[2] = '';
                      if (r[0] === 'transparent') r[4] = r[4].filter(function (o) { return o[0] === 'all' || o[0] === 'except_cn' || o[0] === 'gfwlist'; });
                    });
                    out.push(d);
                  });
                  return out;
                };
                var host = document.getElementById('app');
                host.appendChild(inst.mount(st));
                window.__xl = inst;
              });
            };
            window.xlNative = function () { try { if (window.__xl && window.__xl.tick) window.__xl.tick(); } catch (e) {} };
          })();
          XL_FILE_4
          mkdir -p "$(dirname "app/src/main/assets/ui.wrapped.js")"
          cat <<'XL_UI' | base64 -d | gunzip > "app/src/main/assets/ui.wrapped.js"
