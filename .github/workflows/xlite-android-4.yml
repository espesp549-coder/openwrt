                  return try {
                      if (name == "gfw") download("https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/gfw.txt", f) { true }
                      else download("https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt", XrayConfig.listFile(ctx, "cn4.txt")) { !it.contains(":") }
                      true
                  } catch (e: Exception) {
