              private fun adblockUpdate() {
                  runTask("ads") {
                      val size = store.setting("adblock_size").ifEmpty { "medium" }
                      val name = when (size) {
                          "small" -> "light"
                          "large" -> "pro"
                          else -> "multi"
                      }
                      taskAdd("ads", "تحميل قائمة الإعلانات ($name)…")
                      val f = XrayConfig.listFile(ctx, "ads.txt")
                      // dnsmasq format: address=/domain/0.0.0.0
                      download("https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/$name.txt", f) { it.startsWith("local=/") || it.startsWith("address=/") }
                      val fixed = f.readLines().mapNotNull { l ->
                          val a = l.indexOf('/')
                          val b = l.indexOf('/', a + 1)
                          if (a > 0 && b > a) l.substring(a + 1, b) else null
                      }
                      f.writeText(fixed.joinToString("\n"))
                      taskAdd("ads", "تم: " + fixed.size + " نطاق")
                  }
              }

