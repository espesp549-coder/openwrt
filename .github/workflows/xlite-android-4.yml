          cat > "app/src/main/java/com/xlite/app/Backend.kt" <<'XL_FILE_6'
          package com.xlite.app

          import android.content.Context
          import android.net.TrafficStats
          import android.os.SystemClock
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.InetSocketAddress
          import java.net.Proxy
          import java.net.Socket
          import java.net.URL

          class Backend(private val ctx: Context, private val store: Store) {

              companion object {
                  const val VERSION = "0.2.0"
                  private val tasks = HashMap<String, String>()

                  fun taskLog(n: String): String = synchronized(tasks) { tasks[n] ?: "" }
                  fun taskPut(n: String, s: String) = synchronized(tasks) { tasks[n] = s }
                  fun taskAdd(n: String, s: String) = synchronized(tasks) { tasks[n] = (tasks[n] ?: "") + s + "\n" }

                  fun runTask(name: String, block: () -> Unit) {
                      taskPut(name, "")
                      Thread {
                          var rc = 0
                          try {
                              block()
                          } catch (e: Exception) {
                              taskAdd(name, e.message ?: e.toString())
                              rc = 1
                          }
                          taskAdd(name, "rc=$rc")
                      }.start()
                  }
              }

              private fun proxyIfOn(): Proxy? =
                  if (XLiteVpnService.state == "on") Proxy(Proxy.Type.SOCKS, InetSocketAddress("127.0.0.1", XLiteVpnService.SOCKS_PORT)) else null

              private fun open(u: String, viaProxy: Boolean): HttpURLConnection {
                  val url = URL(u)
                  val p = if (viaProxy) proxyIfOn() else null
                  val c = (if (p != null) url.openConnection(p) else url.openConnection()) as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 25000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "XLite/" + VERSION)
                  return c
              }

              private fun httpGet(u: String, viaProxy: Boolean): String {
                  val c = open(u, viaProxy)
                  try {
                      return c.inputStream.bufferedReader().readText()
                  } finally {
                      c.disconnect()
                  }
              }

              fun fetchLinks(u: String, viaProxy: Boolean): List<String> {
                  var text = httpGet(u, viaProxy).trim()
                  if (!text.contains("://")) {
                      text = try {
                          LinkParser.decodeBase64(text)
                      } catch (e: Exception) {
                          text
                      }
                  }
                  return text.lines().map { it.trim() }.filter { it.isNotEmpty() }
              }

              // ------------------------------------------------------------------ dispatch
              fun call(method: String, p: JSONObject): JSONObject {
                  return try {
                      when (method) {
                          "status" -> status()
                          "servers" -> JSONObject().put("servers", serverList())
                          "add" -> add(p.optString("links"))
                          "remove" -> {
                              store.remove(p.optString("id"))
                              ok()
                          }
                          "rename" -> {
                              val n = p.optString("name").trim()
                              if (n.isEmpty() || n.length > 64) JSONObject().put("ok", false)
                              else {
                                  store.update(p.optString("id"), n, null)
                                  ok()
                              }
                          }
                          "link" -> JSONObject().put("link", store.servers().firstOrNull { it.id == p.optString("id") }?.link ?: "")
                          "edit" -> edit(p.optString("id"), p.optString("link"))
                          "ping" -> ping(p.optString("id"))
                          "settings" -> JSONObject().put("settings", store.allSettings()).put("tcp_cc_now", "").put("tcp_cc_avail", JSONArray())
                          "set_settings" -> setSettings(p.optJSONObject("values") ?: JSONObject())
                          "log" -> JSONObject().put("log", XLiteVpnService.logText())
                          "geo" -> JSONObject().put("geo", geo(p.optJSONArray("hosts") ?: JSONArray()))
                          "exitip" -> exitIp(p.optInt("which", 1), p.optBoolean("fresh"))
                          "task_state" -> JSONObject().put("log", taskLog(p.optString("name")))
                          "subs" -> subs()
                          "sub_add" -> subAdd(p.optString("name"), p.optString("url"))
                          "sub_update" -> {
                              subUpdate(p.optString("id", "all"))
                              ok()
                          }
                          "sub_remove" -> subRemove(p.optString("id"))
                          "lists" -> {
                              lists(p.optString("which", "all"))
                              ok()
                          }
                          "lists_info" -> listsInfo()
                          "adblock_update" -> {
                              adblockUpdate()
                              ok()
                          }
                          "routinga_check" -> JSONObject().put("errs", JSONArray()).put("rules", 0).put("def", "")
                          "backup" -> JSONObject().put("text", backup())
                          "restore" -> restore(p.optString("text"))
                          "update" -> {
                              taskPut("update", "لا يوجد تحديث تلقائي بعد: نزّل الـAPK الجديد من GitHub\nrc=1\n")
                              ok()
                          }
                          "update_state" -> JSONObject().put("log", taskLog("update"))
                          "second" -> JSONObject().put("ok", false).put("error", "السيرفر الثاني ينضاف بالمرحلة الجاية")
                          "wg_deps" -> ok()
                          "devices" -> JSONObject().put("devices", JSONArray()).put("running", true).put("blocked", JSONArray())
                          "apps", "r2apps" -> JSONObject().put("apps", JSONArray())
                          "usage_reset", "device_name", "block_device", "iso_set", "learn_start", "learn_stop",
                          "learn_save", "learn_clear", "r2app_set", "device_route" -> ok()
                          "lan_devices" -> JSONObject().put("devices", JSONArray())
                          "bot_test" -> JSONObject().put("ok", false).put("error", "البوت ينضاف بمرحلة لاحقة")
                          "uninstall" -> ok()
                          else -> JSONObject().put("ok", false).put("error", "غير مدعوم: $method")
                      }
                  } catch (e: Exception) {
                      JSONObject().put("ok", false).put("error", e.message ?: e.toString())
                  }
              }

              private fun ok(): JSONObject = JSONObject().put("ok", true)

              // ------------------------------------------------------------------ status
              private fun status(): JSONObject {
                  val st = XLiteVpnService.state
                  val on = st == "on"
                  val busy = on || st == "connecting"
                  val sel = store.selected
                  val srv = store.servers().firstOrNull { it.id == sel }
                  val o = JSONObject()
                  o.put("enabled", busy)
                  o.put("running", on)
                  o.put("rules", on)
                  o.put("uptime", if (on) (SystemClock.elapsedRealtime() - XLiteVpnService.startedAt) / 1000 else 0L)
                  if (srv != null) {
                      val n = LinkParser.parse(srv.link)
                      o.put("server", JSONObject().put("id", srv.id).put("name", srv.name).put("protocol", n?.protocol ?: "?")
                          .put("net", n?.q?.get("type") ?: "tcp").put("header", n?.q?.get("headerType") ?: "")
                          .put("security", n?.q?.get("security") ?: ""))
                  }
                  val uid = android.os.Process.myUid()
                  val rx = (TrafficStats.getUidRxBytes(uid) - XLiteVpnService.baseRx).coerceAtLeast(0)
                  val tx = (TrafficStats.getUidTxBytes(uid) - XLiteVpnService.baseTx).coerceAtLeast(0)
                  o.put("net", JSONObject().put("rx", rx).put("tx", tx))
                  o.put("now", SystemClock.elapsedRealtime() / 1000.0)
                  o.put("cpu", JSONArray())
                  o.put("release", JSONObject().put("version", VERSION).put("build", 1))
                  o.put("servers", store.servers().size)
                  o.put("warnings", JSONArray())
                  o.put("r2", false)
                  o.put("ip", cachedExit())
                  val health = JSONObject()
                  val h = XLiteVpnService.health
                  if (on && h != null) health.put("main", JSONObject().put("t", h[0]).put("ok", h[1] == 1L).put("ms", h[2]))
                  o.put("mon", JSONObject().put("health", health).put("devs", JSONArray()).put("period", ""))
                  if (st == "error") o.put("error", XLiteVpnService.message)
                  return o
              }

              private fun cachedExit(): String? {
                  val s = store.cache("exit1")
                  if (s.isEmpty()) return null
                  return try {
                      JSONObject(s).optString("ip").ifEmpty { null }
                  } catch (e: Exception) {
                      null
                  }
              }

              // ------------------------------------------------------------------ servers
              private fun serverList(): JSONArray {
                  val arr = JSONArray()
                  val sel = store.selected
                  for (s in store.servers()) {
                      val n = LinkParser.parse(s.link)
                      val o = JSONObject().put("id", s.id).put("name", s.name).put("protocol", n?.protocol ?: "?")
                          .put("net", n?.q?.get("type") ?: "tcp").put("header", n?.q?.get("headerType") ?: "")
                          .put("security", n?.q?.get("security") ?: "").put("valid", n != null)
                          .put("current", s.id == sel).put("second", false)
                          .put("host", n?.host ?: "").put("port", n?.port ?: 0).put("sub", s.sub)
                      if (n == null) o.put("error", "رابط غير مدعوم")
                      arr.put(o)
                  }
                  return arr
              }

              private fun add(links: String): JSONObject {
                  val report = store.add(links.split(Regex("[\\r\\n ]+")))
                  return JSONObject().put("report", report)
              }

              private fun edit(id: String, link: String): JSONObject {
                  val n = LinkParser.parse(link) ?: return JSONObject().put("ok", false).put("error", "رابط غير مدعوم")
                  if (store.servers().none { it.id == id }) return JSONObject().put("ok", false).put("error", "السيرفر غير موجود")
                  store.update(id, n.name, link.trim())
                  return ok()
              }

              private fun ping(id: String): JSONObject {
                  var ms = -1
                  val srv = store.servers().firstOrNull { it.id == id }
                  val n = if (srv != null) LinkParser.parse(srv.link) else null
                  if (n != null) {
                      val sock = Socket()
                      try {
                          val t0 = System.nanoTime()
                          sock.connect(InetSocketAddress(n.host, n.port), 4000)
                          ms = ((System.nanoTime() - t0) / 1000000).toInt()
                      } catch (e: Exception) {
                          ms = -1
                      } finally {
                          try {
                              sock.close()
                          } catch (e: Exception) {
                          }
                      }
                  }
                  return JSONObject().put("id", id).put("ms", ms)
              }

              // ------------------------------------------------------------------ settings
              private val restartKeys = setOf("transparent", "antipollution", "dns_upstream", "sniffing", "mux", "mux_conc", "tfo",
                  "loglevel", "block_quic", "bypass", "ipv6", "adblock", "adblock_allow", "special")

              private fun setSettings(v: JSONObject): JSONObject {
                  var restart = false
                  val it = v.keys()
                  while (it.hasNext()) {
                      val k = it.next()
                      val old = store.setting(k)
                      val nw = v.optString(k)
                      store.setSetting(k, nw)
                      if (old != nw && k in restartKeys) restart = true
                  }
                  if (restart && XLiteVpnService.state == "on") XLiteVpnService.requestRestart(ctx)
                  return JSONObject().put("ok", true).put("bad", JSONArray()).put("restart", restart)
              }

              // ------------------------------------------------------------------ geo / exit ip
              fun geo(hosts: JSONArray): JSONObject {
                  val cache = try {
                      JSONObject(store.cache("geo").ifEmpty { "{}" })
                  } catch (e: Exception) {
                      JSONObject()
                  }
                  val need = ArrayList<String>()
                  for (i in 0 until hosts.length()) {
                      val h = hosts.optString(i)
                      if (h.isNotEmpty() && !cache.has(h) && need.size < 100) need.add(h)
                  }
                  if (need.isNotEmpty()) {
                      try {
                          val c = open("http://ip-api.com/batch?fields=query,countryCode,status", false)
                          c.requestMethod = "POST"
                          c.doOutput = true
                          c.setRequestProperty("Content-Type", "application/json")
                          c.outputStream.use { it.write(JSONArray(need).toString().toByteArray()) }
                          val txt = c.inputStream.bufferedReader().readText()
                          c.disconnect()
                          val res = JSONArray(txt)
                          for (i in 0 until res.length()) {
                              val r = res.getJSONObject(i)
                              val cc = r.optString("countryCode")
                              if (r.optString("status") == "success" && cc.isNotEmpty() && i < need.size) cache.put(need[i], cc)
                          }
                          store.putCache("geo", cache.toString())
                      } catch (e: Exception) {
                      }
                  }
                  val out = JSONObject()
                  for (i in 0 until hosts.length()) {
                      val h = hosts.optString(i)
                      if (cache.has(h)) out.put(h, cache.getString(h))
                  }
                  return out
              }

              private fun exitIp(which: Int, fresh: Boolean): JSONObject {
                  if (which != 1 || XLiteVpnService.state != "on") return JSONObject()
                  val old = store.cache("exit1")
                  if (!fresh && old.isNotEmpty()) {
                      try {
                          val j = JSONObject(old)
                          if (System.currentTimeMillis() / 1000 - j.optLong("t") < 120) return j
                      } catch (e: Exception) {
                      }
                  }
                  val e = JSONObject()
                  try {
                      val ip = httpGet("https://api.ipify.org", true).trim()
                      e.put("ip", ip).put("t", System.currentTimeMillis() / 1000)
                      val g = geo(JSONArray().put(ip))
                      if (g.has(ip)) e.put("cc", g.getString(ip))
                      store.putCache("exit1", e.toString())
                  } catch (ex: Exception) {
                      e.put("ip", JSONObject.NULL)
                  }
                  return e
              }

              // ------------------------------------------------------------------ subscriptions
              private fun subs(): JSONObject {
                  val arr = JSONArray()
                  for (s in store.subs()) arr.put(JSONObject().put("id", s.id).put("name", s.name).put("url", s.url).put("updated", s.updated).put("count", s.count))
                  return JSONObject().put("subs", arr)
              }

              private fun subAdd(name: String, url: String): JSONObject {
                  val u = url.trim()
                  if (!u.startsWith("http://") && !u.startsWith("https://")) {
                      return JSONObject().put("ok", false).put("error", "الرابط لازم يبدي بـ http:// أو https://")
                  }
                  val list = store.subs()
                  val id = "u" + java.util.UUID.randomUUID().toString().replace("-", "").substring(0, 8)
                  list.add(Sub(id, if (name.trim().isEmpty()) "اشتراك" else name.trim().take(64), u, 0, 0))
                  store.saveSubs(list)
                  subUpdate(id)
                  return JSONObject().put("ok", true).put("id", id)
              }

              private fun subUpdate(id: String) {
                  runTask("sub") {
                      val all = store.subs()
                      val todo = if (id == "all" || id.isEmpty()) all else all.filter { it.id == id }
                      val via = store.setting("update_via") == "proxy"
                      for (s in todo) {
                          taskAdd("sub", "تحميل: " + s.name)
                          val links = fetchLinks(s.url, via)
                          val keep = store.selected
                          val old = store.servers().filter { it.sub == s.id && it.id != keep }.map { it.id }.toSet()
                          val cur = store.servers().filter { it.id !in old }
                          store.save(cur)
                          val rep = store.add(links, s.id)
                          var n = 0
                          for (i in 0 until rep.length()) if (rep.getJSONObject(i).optBoolean("ok") && !rep.getJSONObject(i).optBoolean("dup")) n++
                          val ns = store.subs().map {
                              if (it.id == s.id) Sub(it.id, it.name, it.url, System.currentTimeMillis() / 1000, store.servers().count { x -> x.sub == s.id }) else it
                          }
                          store.saveSubs(ns)
                          taskAdd("sub", "انضاف $n سيرفر")
                      }
                      XLiteVpnService.notifyUi()
                  }
              }

              private fun subRemove(id: String): JSONObject {
                  val sel = store.selected
                  var kept = 0
                  val list = ArrayList<Server>()
                  for (s in store.servers()) {
                      if (s.sub == id) {
                          if (s.id == sel) {
                              kept++
                              list.add(Server(s.id, s.name, s.link, ""))
                          }
                      } else list.add(s)
                  }
                  store.save(list)
                  store.saveSubs(store.subs().filter { it.id != id })
                  return JSONObject().put("ok", true).put("kept", kept)
              }

              // ------------------------------------------------------------------ lists
              private fun download(url: String, out: File, filter: (String) -> Boolean) {
                  val via = store.setting("update_via") == "proxy"
                  val c = open(url, via)
                  try {
                      out.parentFile?.mkdirs()
                      val tmp = File(out.path + ".tmp")
                      var n = 0
                      tmp.bufferedWriter().use { w ->
                          c.inputStream.bufferedReader().forEachLine { l ->
                              val t = l.trim()
                              if (t.isNotEmpty() && !t.startsWith("#") && filter(t)) {
                                  w.write(t)
                                  w.write("\n")
                                  n++
                              }
                          }
                      }
                      if (n < 10) throw Exception("القائمة فارغة أو ناقصة")
                      tmp.renameTo(out)
                  } finally {
                      c.disconnect()
                  }
              }

