                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = filePathCallback
                          return try {
                              startActivityForResult(fileChooserParams!!.createIntent(), reqFile)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
                  XLiteVpnService.listener = {
                      runOnUiThread { web.evaluateJavascript("window.xlNative&&xlNative()", null) }
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }

              override fun onDestroy() {
                  XLiteVpnService.listener = null
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  // let the page close its sheet first
                  web.evaluateJavascript("(function(){var x=window.__xl;if(x&&x.sheet&&x.sheet.classList.contains('on')){x.closeSheet();return 1}return 0})()") { r ->
                      if (r != "1") runOnUiThread { moveTaskToBack(true) }
                  }
              }

              private fun startVpn() {
                  val i = Intent(this, XLiteVpnService::class.java).setAction(XLiteVpnService.ACTION_START)
                  startForegroundService(i)
              }

              private fun ensureVpnAndStart() {
                  val p = VpnService.prepare(this)
                  if (p != null) startActivityForResult(p, reqVpn) else startVpn()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqVpn) {
                      if (resultCode == RESULT_OK) startVpn() else toast("ما انمنحت صلاحية VPN")
                  } else if (requestCode == reqFile) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCb = null
                  }
              }

              private fun toast(msg: String) {
                  runOnUiThread {
                      web.evaluateJavascript("window.__xl&&__xl.toast(" + JSONObject.quote(msg) + ",true)", null)
                  }
              }

              private fun reply(id: Int, o: JSONObject) {
                  val js = "window.__rpcDone(" + id + "," + JSONObject.quote(o.toString()) + ")"
                  runOnUiThread { web.evaluateJavascript(js, null) }
              }

              inner class Bridge {

                  @JavascriptInterface
                  fun rpc(method: String, params: String, id: Int) {
                      val p = try {
                          JSONObject(params)
                      } catch (e: Exception) {
                          JSONObject()
                      }
                      when (method) {
                          "connect" -> runOnUiThread { doConnect(p.optBoolean("on"), id) }
                          "select" -> runOnUiThread { doSelect(p.optString("id"), id) }
                          else -> Thread { reply(id, backend.call(method, p)) }.start()
                      }
                  }

                  @JavascriptInterface
                  fun copy(text: String) {
                      runOnUiThread {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("xlite", text))
                      }
                  }

                  @JavascriptInterface
                  fun saveFile(name: String, text: String): Boolean {
                      return try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              val v = ContentValues()
                              v.put(MediaStore.Downloads.DISPLAY_NAME, name)
                              v.put(MediaStore.Downloads.MIME_TYPE, "text/plain")
                              val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                              contentResolver.openOutputStream(uri!!)?.use { it.write(text.toByteArray()) }
                          } else {
                              val d = getExternalFilesDir(null) ?: filesDir
                              File(d, name).writeText(text)
                          }
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }
              }

              private fun doConnect(on: Boolean, id: Int) {
                  if (!on) {
                      startService(Intent(this, XLiteVpnService::class.java).setAction(XLiteVpnService.ACTION_STOP))
                      reply(id, JSONObject().put("ok", true))
                      return
                  }
                  val list = store.servers()
                  if (list.isEmpty()) {
                      reply(id, JSONObject().put("ok", false).put("error", "ضيف سيرفر أول"))
                      return
                  }
                  if (list.none { it.id == store.selected }) store.selected = list[0].id
                  ensureVpnAndStart()
                  reply(id, JSONObject().put("ok", true))
              }

              private fun doSelect(sid: String, id: Int) {
                  if (store.servers().none { it.id == sid }) {
                      reply(id, JSONObject().put("ok", false))
                      return
                  }
                  store.selected = sid
                  val st = XLiteVpnService.state
                  if (st == "on" || st == "connecting") XLiteVpnService.requestRestart(this) else ensureVpnAndStart()
                  reply(id, JSONObject().put("ok", true))
              }
          }
