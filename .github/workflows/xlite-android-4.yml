                      .setContentText(text)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun updateNotification(text: String) {
                  try {
                      getSystemService(NotificationManager::class.java).notify(1, notification(text))
                  } catch (e: Exception) {
                  }
              }
          }
