          	'.xl-tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:#12302A;color:var(--ac);animation:xlPop .45s both;white-space:nowrap}.xl-tag.s{background:#221E44;color:var(--viot)}.xl-tag.w{background:#2B2410;color:var(--warn)}',
