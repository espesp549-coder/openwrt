          	'.xl-srv{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--c1);border:1px solid var(--ln);transition:background .35s,border-color .35s}',
          	'.xl-srv.m{border-color:#1F5A49}.xl-srv.s{border-color:#3A3172}.xl-srv.mbg{background:#0F1F1B}.xl-srv.sbg{background:#15132A}',
          	'.xl-srv .shine{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(126,240,201,.08),transparent);animation:xlShimmer 3.5s ease-in-out infinite;pointer-events:none}',
          	'.xl-srv .n{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
          	'.xl-flag{width:46px;height:32px;border-radius:7px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px #24324A;background:var(--c4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub)}',
          	'.xl-flag img{width:100%;height:100%;object-fit:cover;display:block}.xl-flag.iq{display:flex;flex-direction:column}.xl-flag.iq span{flex:1;width:100%}',
