          	'position:relative;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;border-radius:28px;margin:0 auto;max-width:560px;box-sizing:border-box;line-height:1.55;font-size:14px;overflow:hidden;min-height:760px}',
          	'.xl *{box-sizing:border-box}.xl button,.xl input,.xl select,.xl textarea{font-family:inherit}',
