          	'.xl-btn{height:42px;padding:0 16px;border-radius:14px;border:1px solid #2A3650;background:transparent;color:var(--tx);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}',
          	'.xl-btn.pri{background:var(--ac);border-color:var(--ac);color:#071410;font-weight:700}.xl-btn.vio{background:#221E44;border-color:#3A3172;color:var(--viot)}',
          	'.xl-btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:11px}.xl-btn.danger{color:var(--bad);border-color:#4A2A2E}.xl-btn[disabled]{opacity:.45;cursor:default}',
