          {"log":{"loglevel":"warning","access":"none","error":"$W/server.log"},
           "inbounds":[{"listen":"127.0.0.1","port":18443,"protocol":"vless","settings":{"clients":[{"id":"$UUID"}],"decryption":"none"},"streamSettings":$SS}],
           "outbounds":[{"protocol":"freedom"}]}
          J
