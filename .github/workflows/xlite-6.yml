          	'.xl-core{position:absolute;inset:34px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:700;transition:background .6s,color .6s,transform .5s var(--spring)}',
          	'.xl-ring.off .xl-rip,.xl-ring.off .xl-orbit{display:none}.xl-hero.off .xl-halo{opacity:0}',
