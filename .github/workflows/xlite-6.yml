          	'.xl .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}',
          	'.xl-scroll{padding:18px 16px 110px}',
          	'.xl h2{margin:0;font-size:16px;font-weight:600}',
          	'.xl-mut{color:var(--mut);font-size:12px}.xl-sub{color:var(--sub);font-size:12px}',
          	'.xl-row{display:flex;align-items:center;justify-content:space-between;gap:10px}',
          	'.xl-col{display:flex;flex-direction:column;gap:2px;min-width:0}',
          	'.xl-stack{display:flex;flex-direction:column;gap:14px}',
          	'.xl-card{background:var(--c1);border:1px solid var(--ln);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}',
          	'.xl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}',
          	'.xl-logo{width:40px;height:40px;border-radius:13px;background:#0F1A2A;border:1px solid var(--ln2);display:flex;align-items:center;justify-content:center}',
          	'.xl-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#0F1A2A;border:1px solid var(--ln2);font-size:12px;color:var(--sub)}',
          	'.xl-dot{width:8px;height:8px;border-radius:50%;background:#6B778A;flex-shrink:0}.xl-dot.on{background:var(--ac);animation:xlPulse 1.6s infinite}.xl-dot.wait{background:var(--warn);animation:xlBlink 1s infinite}',
          	// home hero
          	'.xl-hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px 18px;border-radius:28px;background:var(--c2);border:1px solid var(--ln);overflow:hidden}',
          	'.xl-halo{position:absolute;top:14px;left:50%;width:250px;height:250px;margin-left:-125px;border-radius:50%;background:radial-gradient(circle,rgba(59,224,168,.19),transparent 65%);animation:xlGlow 3s ease-in-out infinite;transition:opacity .6s;pointer-events:none}',
          	'.xl-ring{position:relative;width:190px;height:190px;border:0;border-radius:50%;background:transparent;padding:0;cursor:pointer;transition:transform .2s}',
          	'.xl-ring svg{position:absolute;inset:0}.xl-ring .arc{transition:stroke-dashoffset 1.2s var(--ease)}',
          	'.xl-rip{position:absolute;inset:20px;border-radius:50%;border:2px solid var(--ac);animation:xlPing 2.4s ease-out infinite;pointer-events:none}.xl-rip.b{border-color:var(--vio);animation-delay:1.2s}',
