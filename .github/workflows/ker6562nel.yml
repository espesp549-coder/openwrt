          for f in src/usr/bin/xlite src/etc/init.d/xlite src/etc/hotplug.d/iface/90-xlite install.sh.in; do sh -n "$f"; bash -n "$f"; done
          for f in src/usr/share/rpcd/acl.d/luci-app-xlite.json src/usr/share/luci/menu.d/luci-app-xlite.json src/usr/share/xlite/data/apps.json; do python3 -m json.tool "$f" > /dev/null; done
          node -e "new Function('view','rpc','ui','poll','L','E', require('fs').readFileSync('src/www/luci-static/resources/view/xlite/main.js','utf8').replace(/^'require [a-z]+';$/mg,''))"
          echo "- syntax: shell, json, LuCI view ok" >> out/summary.md

      - name: "3. Test files"
        run: |
          mkdir -p "$(dirname "t/xray-900-vless-downlink-splice.patch")"
          cat > "t/xray-900-vless-downlink-splice.patch" <<'XLITE_PATCH'
          From: mx2000 build
          Subject: [PATCH] VLESS: zero-copy downlink for plain VLESS over RAW TCP

          A VLESS connection without flow on the RAW TCP transport without TLS/REALITY
          (optionally with the HTTP header camouflage) carries the target's bytes
          unchanged after the response header. When the inbound is dokodemo-door
          (tproxy/redirect), splice(2) the rest of the response from the server
          socket to the client socket inside the kernel. Everything else keeps the
          normal path. XRAY_VLESS_SPLICE=off disables it at run time.
          ---
          diff --git a/proxy/vless/outbound/outbound.go b/proxy/vless/outbound/outbound.go
          index e1a727e..43eb027 100644
          --- a/proxy/vless/outbound/outbound.go
          +++ b/proxy/vless/outbound/outbound.go
          @@ -258,6 +258,15 @@ func (h *Handler) Process(ctx context.Context, link *transport.Link, dialer inte
           			return errors.New("failed to decode response header").Base(err).AtInfo()
           		}
           
          +		if requestAddons.Flow == "" && responseAddons.Flow == "" && request.Command == protocol.RequestCommandTCP {
          +			if s := newDownlinkSplice(ctx, conn); s != nil {
          +				if err := s.run(ctx, clientWriter, timer); err != nil {
          +					return errors.New("failed to transfer response payload").Base(err).AtInfo()
          +				}
          +				return nil
          +			}
          +		}
          +
           		// default: serverReader := buf.NewReader(conn)
           		serverReader := encoding.DecodeBodyAddons(conn, request, responseAddons)
           		if requestAddons.Flow == vless.XRV {
          diff --git a/proxy/vless/outbound/splice_linux.go b/proxy/vless/outbound/splice_linux.go
          new file mode 100644
          index 0000000..1035429
          --- /dev/null
          +++ b/proxy/vless/outbound/splice_linux.go
          @@ -0,0 +1,224 @@
          +package outbound
          +
          +// Zero-copy downlink for plain VLESS.
          +//
          +// A VLESS connection without flow on the RAW TCP transport without TLS or
          +// REALITY (optionally wrapped in the HTTP header camouflage) carries the
          +// target's bytes unchanged after the response header. When the client side
          +// is a plain TCP socket that also passes bytes through unchanged
          +// (dokodemo-door, used by tproxy and redirect), the rest of the response can
          +// go from the server socket to the client socket inside the kernel with
          +// splice(2) instead of being read into Go buffers, handed through a pipe to
          +// another goroutine and written out again. Everything else (flows, TLS,
          +// REALITY, other transports, UDP, mux, proxy chains that change the bytes,
          +// other inbounds) keeps the normal path, and so does the uplink.
          +//
          +// XRAY_VLESS_SPLICE=off turns it off at run time.
          +
          +import (
          +	"context"
          +	"io"
          +	"syscall"
          +
          +	"github.com/xtls/xray-core/app/dispatcher"
          +	"github.com/xtls/xray-core/common/buf"
          +	"github.com/xtls/xray-core/common/errors"
          +	"github.com/xtls/xray-core/common/net"
          +	"github.com/xtls/xray-core/common/platform"
          +	"github.com/xtls/xray-core/common/session"
          +	"github.com/xtls/xray-core/common/signal"
          +	"github.com/xtls/xray-core/features/stats"
          +	httpheader "github.com/xtls/xray-core/transport/internet/headers/http"
          +	"github.com/xtls/xray-core/transport/internet/stat"
          +	"golang.org/x/sys/unix"
          +)
          +
          +// spliceRound caps one splice round, so that the idle timers and the traffic
          +// counters keep moving while a slow client drains a long transfer.
          +const spliceRound = 32 * 1024
          +
          +var downlinkSpliceEnabled = func() bool {
          +	switch platform.NewEnvFlag("xray.vless.splice").GetValue(func() string { return "" }) {
          +	case "0", "off", "no", "false", "disable", "disabled":
          +		return false
          +	}
          +	return true
          +}()
          +
          +type downlinkSplice struct {
          +	src        *net.TCPConn // socket to the VLESS server
          +	dst        *net.TCPConn // socket of the client
          +	pending    *buf.Buffer  // read past the HTTP header but not sent yet
          +	srcCounter stats.Counter
          +	dstCounter stats.Counter
          +	inTimer    *signal.ActivityTimer
          +}
          +
          +// newDownlinkSplice returns nil unless every byte the server sends from now
          +// on can go to the client socket unchanged. Call it right after the VLESS
          +// response header has been read, from the goroutine that reads conn.
          +func newDownlinkSplice(ctx context.Context, conn net.Conn) *downlinkSplice {
          +	if !downlinkSpliceEnabled {
          +		return nil
          +	}
          +	inbound := session.InboundFromContext(ctx)
          +	if inbound == nil || inbound.Conn == nil || inbound.CanSpliceCopy != 1 {
          +		return nil
          +	}
          +	outbounds := session.OutboundsFromContext(ctx)
          +	if len(outbounds) == 0 {
          +		return nil
          +	}
          +	for _, ob := range outbounds[:len(outbounds)-1] {
          +		if ob.CanSpliceCopy != 1 { // another proxy in the chain needs the bytes
          +			return nil
          +		}
          +	}
          +	s := &downlinkSplice{inTimer: inbound.Timer}
          +	var ok bool
          +	var c net.Conn = conn
          +	if sc, isCounter := c.(*stat.CounterConnection); isCounter {
          +		c, s.srcCounter = sc.Connection, sc.ReadCounter
          +	}
          +	header, _ := c.(*httpheader.Conn)
          +	if header != nil {
          +		c = header.Conn
          +	}
          +	if s.src, ok = c.(*net.TCPConn); !ok {
          +		return nil // TLS, REALITY, another transport or a dialer proxy
          +	}
          +	c = inbound.Conn
          +	if sc, isCounter := c.(*stat.CounterConnection); isCounter {
          +		c, s.dstCounter = sc.Connection, sc.WriteCounter
          +	}
          +	if s.dst, ok = c.(*net.TCPConn); !ok {
          +		return nil
          +	}
          +	if header != nil {
          +		if s.pending, ok = header.TakeReadBuffer(); !ok {
          +			return nil
          +		}
          +	}
          +	return s
          +}
          +
          +// run moves the rest of the response to the client. It returns nil once the
          +// server has finished sending, or the first error.
          +func (s *downlinkSplice) run(ctx context.Context, writer buf.Writer, timer *signal.ActivityTimer) error {
          +	statWriter, _ := writer.(*dispatcher.SizeStatWriter)
          +	count := func(n int64) {
          +		if n <= 0 {
          +			return
          +		}
          +		if s.srcCounter != nil {
          +			s.srcCounter.Add(n) // outbound stats
          +		}
          +		if s.dstCounter != nil {
          +			s.dstCounter.Add(n) // inbound stats
          +		}
          +		if statWriter != nil {
          +			statWriter.Counter.Add(n) // user stats
          +		}
          +		timer.Update()
          +		if s.inTimer != nil {
          +			s.inTimer.Update()
          +		}
          +	}
          +	if s.pending != nil {
          +		n, err := s.dst.Write(s.pending.Bytes())
          +		s.pending.Release()
          +		s.pending = nil
          +		count(int64(n))
          +		if err != nil {
          +			return err
          +		}
          +	}
          +	rc, err := s.src.SyscallConn()
          +	if err != nil {
          +		return err
          +	}
          +	errors.LogDebug(ctx, "VLESS downlink splice")
