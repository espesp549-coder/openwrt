name: XLite release

# Builds XLite (the light v2rayA replacement) and publishes it as the release "xlite" of this repo.
# On any OpenWrt 22.03+ router:  wget -O- https://github.com/<this repo>/releases/download/xlite/install.sh | sh
# Every file of the tool is inside this workflow: the repo needs nothing else.

on:
  workflow_dispatch:
    inputs:
      zero_copy:
        description: 'Core with the zero-copy download for VLESS over TCP (patch 900): tested on the runner first, left out by itself if a test fails'
        type: boolean
        default: true

permissions:
  contents: write

env:
  XRAY_VERSION: 25.1.30
  XRAY_HASH: 983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e
  GO_VERSION: 1.23.12
  RELEASE_TAG: xlite
  LIBUBOX_REV: da2d205a5cf3e877c45a2eec488218cbaf452e7d
  UCI_REV: 74f6277aabffc943d026f406df57c22595134c42
  UCODE_REV: 3f64c8089bf3ea4847c96b91df09fbfcaec19e1d   # the ucode of OpenWrt 24.10

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: "1. XLite files"
        run: |
          mkdir -p out
          echo "# XLite build $GITHUB_RUN_NUMBER" > out/summary.md
          mkdir -p "$(dirname "src/etc/hotplug.d/iface/90-xlite")"
          cat > "src/etc/hotplug.d/iface/90-xlite" <<'XLITE_FILE_0'
          # XLite: keep the set of the router's own addresses current (they never go through the proxy),
          # and start XLite again when the line comes up after a boot or a drop (it may have started too early)
          case "$ACTION" in
          ifup|ifupdate)
          	[ -x /usr/bin/xlite ] || exit 0
          	/usr/bin/xlite refresh_ips
          	[ "$ACTION" = ifup ] || exit 0
          	[ "$(uci -q get xlite.main.enabled)" = 1 ] || exit 0
          	[ "$(uci -q get xlite.main.transparent)" = off ] && exit 0
          	if nft list table inet xlite > /dev/null 2>&1; then
          		# running: restart only when a bonded line came back (its route table is gone), or when IPv6
          		# came up after XLite was built without it ("auto"), else IPv6 would go out outside the VPN
          		b=; [ "$(uci -q get xlite.main.bond)" = 1 ] && b=" $(uci -q get xlite.main.bond_ifaces) "
          		case "$b" in
          		*" $INTERFACE "*) ;;
          		*)
          			[ "$(uci -q get xlite.main.ipv6)" = 0 ] && exit 0
          			[ "$(jsonfilter -i /var/etc/xlite/state.json -e '@.ipv6' 2>/dev/null)" = false ] || exit 0
          			[ -n "$(ip -6 route show default 2>/dev/null)" ] || exit 0
          			;;
          		esac
          	else
          		# still starting (the core can need a while at boot): rules_when_ready applies the rules itself
          		s=/tmp/xlite/starting
          		[ -f $s ] && [ $(( $(date +%s) - $(date -r $s +%s 2>/dev/null || echo 0) )) -lt 130 ] && exit 0
          	fi
          	# one restart per 30 s, whatever number of interfaces come up together
          	l=/tmp/xlite-hotplug.lock
          	[ -f $l ] && [ $(( $(date +%s) - $(date -r $l +%s 2>/dev/null || echo 0) )) -lt 30 ] && exit 0
          	touch $l
          	logger -t xlite "$INTERFACE is up and XLite was not routing: starting it again"
          	( /etc/init.d/xlite restart > /dev/null 2>&1 & )
          	;;
          esac
          XLITE_FILE_0
          mkdir -p "$(dirname "src/etc/init.d/xlite")"
          cat > "src/etc/init.d/xlite" <<'XLITE_FILE_1'
          #!/bin/sh /etc/rc.common
          # XLite: transparent proxy (xray core + nftables tproxy)
          START=99
          STOP=10
          USE_PROCD=1

          bot_instance() {
          	procd_open_instance bot
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/bot.uc
          	procd_set_param respawn 3600 15 0
          	procd_set_param stderr 1
          	procd_close_instance
          }

          start_service() {
          	local enabled core kv
          	config_load xlite
          	config_get_bool enabled main enabled 0
          	config_get_bool bot main bot_enabled 0
          	if [ "$enabled" != 1 ]; then
          		/usr/bin/xlite rules_down
          		# the Telegram bot stays reachable while XLite is off (so /on works)
          		[ "$bot" = 1 ] && bot_instance
          		return 0
          	fi
          	/usr/bin/xlite stop_v2raya
          	if ! /usr/bin/xlite prepare; then
          		logger -t xlite "not started: no valid server (add one in LuCI: Services > XLite)"
          		return 1
          	fi
          	if ! core=$(/usr/bin/xlite core); then
          		logger -t xlite "not started: the core (xray) is missing, run: xlite update"
          		return 1
          	fi
          	/usr/bin/xlite sysctl
          	procd_open_instance xray
          	procd_set_param command "$core" run -c /var/etc/xlite/config.json
          	# a reload restarts the core only when its config changed
          	procd_set_param file /var/etc/xlite/config.json /var/etc/xlite/env
          	procd_set_param env XRAY_LOCATION_ASSET=/usr/share/xray
          	for kv in $(cat /var/etc/xlite/env); do
          		[ -n "${kv#*=}" ] && procd_append_param env "$kv"
          	done
          	local nofile; config_get nofile main nofile 65535
          	procd_set_param limits nofile="$nofile $nofile"
          	procd_set_param respawn 3600 5 0
          	procd_set_param stdout 1
          	procd_set_param stderr 1
          	procd_close_instance
          	# device usage, WireGuard health, learning mode, subscription updates
          	procd_open_instance monitor
          	procd_set_param command /usr/bin/ucode -L /usr/share/ucode /usr/share/xlite/monitor.uc
          	procd_set_param respawn 3600 10 0
          	procd_set_param stderr 1
          	procd_close_instance
          	[ "$bot" = 1 ] && bot_instance
          	( /usr/bin/xlite rules_when_ready > /dev/null 2>&1 & )
          }

          stop_service() {
          	/usr/bin/xlite rules_down
          	# keep today's device totals (the monitor writes them to flash every 30 minutes)
          	[ -s /tmp/xlite/usage.json ] && mkdir -p /etc/xlite && cp /tmp/xlite/usage.json /etc/xlite/usage.json
          }

          # a settings change: build again; procd restarts only the instances whose command or files changed
          reload_service() {
          	start
          }

          service_triggers() {
          	procd_add_reload_trigger "xlite"
          }
          XLITE_FILE_1
          chmod 755 "src/etc/init.d/xlite"
          mkdir -p "$(dirname "src/usr/bin/xlite")"
          cat > "src/usr/bin/xlite" <<'XLITE_FILE_2'
          #!/bin/sh
          # XLite: a light transparent proxy for OpenWrt (xray core + nftables tproxy), managed from LuCI.
          #   xlite start|stop|restart        the proxy (same as /etc/init.d/xlite ...)
          #   xlite status                    is it running, which server, which core
          #   xlite add                       share links on stdin (vless://, vmess://, trojan://, ss://)
          #   xlite ping <server-id>          TCP connect time to a server in ms (-1 = no answer)
          #   xlite sub <id|all>              update subscriptions
          #   xlite lists [gfw|cn]            download the GFWList / China address list
          #   xlite exitip [1|2]              the public address seen through the main (1) or second (2) server
          #   xlite update                    install the newest version (settings and servers are kept)
          #   xlite uninstall                 remove XLite (v2rayA is enabled again if it is installed)
          SHARE=/usr/share/xlite
          RUN=/var/etc/xlite
          UC="ucode -L /usr/share/ucode $SHARE/gen.uc"
          TABLE=100
          [ -f $SHARE/release ] && . $SHARE/release   # REPO=owner/name TAG=xlite VERSION=...

          log() { logger -t xlite "$*"; }

          core_path() {
          	local c
          	c=$(uci -q get xlite.main.core)
          	[ -n "$c" ] && [ -x "$c" ] && { echo "$c"; return 0; }
          	for c in $SHARE/bin/xray /usr/bin/xray /tmp/xlite-core/xray; do
          		[ -x "$c" ] && { echo "$c"; return 0; }
          	done
          	# small flash: the core is kept compressed and unpacked to RAM at start
          	if [ -s $SHARE/bin/xray.gz ]; then
          		mkdir -p /tmp/xlite-core && gzip -dc $SHARE/bin/xray.gz > /tmp/xlite-core/xray.new && chmod 755 /tmp/xlite-core/xray.new &&
          			mv /tmp/xlite-core/xray.new /tmp/xlite-core/xray && { echo /tmp/xlite-core/xray; return 0; }
          	fi
          	return 1
          }

          TMPD=/tmp/xlite
          DNS_PORT=15353
          SOCKS2_PORT=20179

          pkg_install() {
          	if command -v apk > /dev/null; then apk update > /dev/null 2>&1; apk add "$@"
          	else opkg update > /dev/null 2>&1; opkg install "$@"; fi
          }

          # dnsmasq asks the core (Forward DNS Request / DoH / FakeDNS). Only a runtime file: a reboot or a
          # stop of XLite gives the normal DNS back.
          dns_dirs() {
          	local d
          	for d in /tmp/dnsmasq.d /tmp/dnsmasq.*.d; do [ -d "$d" ] && echo "$d"; done
          }

          # the DNS cache size and the shortest keep time are dnsmasq settings that its own config already has
          # (cachesize 1000 by default): a second one stops dnsmasq, so they are changed in /etc/config/dhcp
          # (written only when the value changes; the old value is kept and comes back when the cache is turned off)
          dhcp_opt() {
          	local o=$1 v=$2 sec cur
          	sec=$(uci -q show dhcp | sed -n 's/^dhcp\.\([^.=]*\)=dnsmasq$/\1/p' | head -n 1); [ -n "$sec" ] || return 1
          	cur=$(uci -q get dhcp.$sec.$o)
          	if [ -n "$v" ]; then
          		[ "$cur" = "$v" ] && return 1
          		mkdir -p /etc/xlite; [ -f /etc/xlite/dhcp.$o ] || echo "${cur:--}" > /etc/xlite/dhcp.$o
          		uci set dhcp.$sec.$o="$v"
          	else
          		[ -f /etc/xlite/dhcp.$o ] || return 1
          		v=$(cat /etc/xlite/dhcp.$o); rm -f /etc/xlite/dhcp.$o
          		if [ "$v" = - ]; then uci -q delete dhcp.$sec.$o; else uci set dhcp.$sec.$o="$v"; fi
          	fi
          	uci commit dhcp
          	return 0
          }

          dns_cache_opts() {
          	local any=1
          	dhcp_opt cachesize "$(sed -n 's/^cache-size=//p' $RUN/dnsmasq.conf 2>/dev/null)" && any=0
          	dhcp_opt min_cache_ttl "$(sed -n 's/^min-cache-ttl=//p' $RUN/dnsmasq.conf 2>/dev/null)" && any=0
          	return $any
          }

          dns_on() {
          	local d f main line key changed=
          	dns_cache_opts && changed=1
          	[ -s $RUN/dnsmasq.conf ] || { dns_off; [ -n "$changed" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1; return 0; }
          	for d in $(dns_dirs); do
          		# dnsmasq stops (and DHCP with it) on a keyword it already has: leave out what its own config sets
          		main=$(ls /var/etc/dnsmasq.conf.* 2>/dev/null | head -n 1)
          		f=$TMPD/dnsmasq.try; : > $f
          		while IFS= read -r line; do
          			key=${line%%=*}
          			case "$key" in cache-size|min-cache-ttl) continue ;; server|conf-file) ;; *) [ -n "$main" ] && grep -q "^$key\(=\|\$\)" "$main" && continue ;; esac
          			echo "$line" >> $f
          		done < $RUN/dnsmasq.conf
          		# same lines and the ad list not newer than them: nothing to do (dnsmasq reads the list only at start)
          		cmp -s $f "$d/xlite.conf" && ! [ $TMPD/adblock.conf -nt "$d/xlite.conf" ] && continue
          		cp $f "$d/xlite.conf"; changed=1
          		# a last check: the whole dnsmasq config with ours must pass, else ours goes
          		if [ -n "$main" ] && ! dnsmasq --test -C "$main" > $TMPD/dnsmasq.test 2>&1; then
          			logger -t xlite "dnsmasq refused the XLite DNS lines ($(head -n 1 $TMPD/dnsmasq.test)): DNS left as it was"
          			rm -f "$d/xlite.conf"
          		fi
          	done
          	[ -n "$changed" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	return 0
          }

          dns_off() {
          	local d any=
          	for d in $(dns_dirs); do
          		[ -f "$d/xlite.conf" ] && { rm -f "$d/xlite.conf"; any=1; }
          	done
          	[ -n "$any" ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	return 0
          }

          # local ad list (dnsmasq format), kept in RAM; size: small | medium | large
          adblock_list() {
          	local size url f
          	size=$(uci -q get xlite.main.adblock_size); size=${size:-small}
          	case "$size" in
          	large) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/pro.txt ;;
          	medium) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/multi.txt ;;
          	*) url=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/light.txt ;;
          	esac
          	mkdir -p $TMPD; f=$TMPD/adblock.new
          	fetch "$url" "$f" || { rm -f "$f"; echo "download failed"; return 1; }
          	# keep only "local=/name/" lines (the list must not be able to set anything else in dnsmasq)
          	grep -E '^local=/[A-Za-z0-9._-]+/$' "$f" > $TMPD/adblock.conf; rm -f "$f"
          	for w in $(uci -q get xlite.main.adblock_allow); do grep -vxF "local=/$w/" $TMPD/adblock.conf > $TMPD/adblock.tmp; mv $TMPD/adblock.tmp $TMPD/adblock.conf; done
          	echo "ads: $(wc -l < $TMPD/adblock.conf) domains"
          }

          state() { jsonfilter -i $RUN/state.json -e "$1" 2>/dev/null; }

          ipv6_rules() { grep -q 'tproxy ip6' $RUN/rules.nft 2>/dev/null; }

          rules_down() {
          	# "keepdns": the rules are applied again, the DNS lines stay (no dnsmasq restart, the cache stays)
          	[ "$1" = keepdns ] || dns_off
          	# full stop: the bonded lines' route tables too (the build sets them again)
          	if [ "$1" != keepdns ]; then
          		for i in 1 2 3 4 5 6 7 8 9; do ip rule del priority 85 2>/dev/null || break; done
          		for t in 110 111 112 113 114 115 116 117; do ip route flush table $t 2>/dev/null; done
          		for d in $(cat $TMPD/bond_tc 2>/dev/null); do tc qdisc del dev "$d" ingress 2>/dev/null; tc qdisc del dev "$d" root 2>/dev/null; done
          		rm -f $TMPD/bond_tc
          	fi
          	nft delete table inet xlite 2>/dev/null
          	nft delete table inet xlite_nat 2>/dev/null
          	while ip rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip route flush table $TABLE 2>/dev/null
          	while ip -6 rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip -6 route flush table $TABLE 2>/dev/null
          	return 0
          }

          rules_up() {
          	[ -s $RUN/rules.nft ] || return 0
          	rules_down keepdns
          	if ! nft -f $RUN/rules.nft; then
          		log "nft rules failed to load (see: nft -c -f $RUN/rules.nft)"
          		return 1
          	fi
          	if [ -s $RUN/redirect.nft ]; then
          		nft -f $RUN/redirect.nft || { log "redirect rules failed"; rules_down; return 1; }
          	else
          		ip rule add fwmark 0x40/0xc0 table $TABLE
          		ip route add local 0.0.0.0/0 dev lo table $TABLE
          		if ipv6_rules; then
          			ip -6 rule add fwmark 0x40/0xc0 table $TABLE
          			ip -6 route add local ::/0 dev lo table $TABLE
          		fi
          	fi
          	dns_on
          	return 0
          }

          # the kernel WireGuard of the second server needs kmod-wireguard (asked for once, from LuCI)
          wg_deps() {
          	[ -f /lib/netifd/proto/wireguard.sh ] && { [ -d /sys/module/wireguard ] || modprobe wireguard 2>/dev/null; } && [ -d /sys/module/wireguard ] && { echo ok; return 0; }
          	pkg_install kmod-wireguard wireguard-tools > /tmp/xlite-wg.log 2>&1
          	modprobe wireguard 2>/dev/null
          	[ -f /lib/netifd/proto/wireguard.sh ] && [ -d /sys/module/wireguard ] && { /etc/init.d/rpcd reload 2>/dev/null; echo ok; return 0; }
          	echo "failed (see /tmp/xlite-wg.log); the second server works anyway through the core"
          	return 1
          }

          # public address through the main (1) or the second (2) server
          exit_ip() {
          	local ip url=https://api.ipify.org port
          	if [ "${1:-1}" = 2 ]; then
          		if [ "$(state '@.second.kernel')" = true ]; then
          			ip=$(curl -s --noproxy '*' --interface xlwg -m 8 $url 2>/dev/null)
          		else
          			ip=$(curl -s -m 8 --socks5-hostname 127.0.0.1:$SOCKS2_PORT $url 2>/dev/null)
          		fi
          	else
          		port=$(uci -q get xlite.main.socks_port)
          		if [ "${port:-0}" -gt 0 ] 2>/dev/null; then
          			ip=$(curl -s -m 8 --socks5-hostname 127.0.0.1:$port $url 2>/dev/null)
          		else
          			ip=$(curl -s -m 8 $url 2>/dev/null)
          		fi
          	fi
          	case "$ip" in *[!0-9a-fA-F.:]*|'') return 1 ;; esac
          	echo "$ip"
          }

          # subscriptions: plain or base64 lists of share links
          sub_one() {   # $1 = section id
          	local url f port rc
          	url=$(uci -q get xlite."$1".url) || return 1
          	f=$(mktemp /tmp/xlite-sub.XXXXXX)
          	port=$(uci -q get xlite.main.socks_port)
          	# direct first; through the proxy when the direct way is blocked
          	if ! curl -fsSL -m 30 -A 'v2rayA/2' -o "$f" "$url" 2>/dev/null || [ ! -s "$f" ]; then
          		[ "${port:-0}" -gt 0 ] 2>/dev/null && curl -fsSL -m 30 -A 'v2rayA/2' --socks5-hostname 127.0.0.1:$port -o "$f" "$url" 2>/dev/null
          	fi
          	if [ ! -s "$f" ]; then
          		rm -f "$f"; echo '{"ok":false,"error":"download"}'; return 1
          	fi
          	$UC sub_apply "$1" < "$f"; rc=$?
          	rm -f "$f"
          	return $rc
          }

          subs() {   # $1 = id or all
          	local s
          	if [ "$1" = all ]; then
          		for s in $(uci -q show xlite | sed -n "s/^xlite\.\([^.=]*\)=subscription$/\1/p"); do sub_one "$s"; done
          	else
          		sub_one "$1"
          	fi
          }

          # GFWList (for the "gfwlist" mode) and the China address list (for "except China")
          lists() {
          	local w=${1:-all} f
          	mkdir -p /etc/xlite
          	f=$(mktemp /tmp/xlite-list.XXXXXX)
          	if [ "$w" = gfw ] || [ "$w" = all ]; then
          		if fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/gfw.txt "$f" && [ -s "$f" ]; then
          			mv "$f" /etc/xlite/gfw.txt; echo "gfw: $(wc -l < /etc/xlite/gfw.txt)"
          		else echo "gfw: download failed"; fi
          	fi
          	if [ "$w" = cn ] || [ "$w" = all ]; then
          		if fetch https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt "$f" && [ -s "$f" ]; then
          			grep -v : "$f" > /etc/xlite/cn4.txt; echo "cn: $(wc -l < /etc/xlite/cn4.txt)"
          		else echo "cn: download failed"; fi
          	fi
          	rm -f "$f"
          }

          # wait until the core listens, then send the traffic to it
          rules_when_ready() {
          	local port i=0
          	port=$(uci -q get xlite.main.tproxy_port); port=${port:-52345}
          	mkdir -p $TMPD; touch $TMPD/starting
          	# at boot the router is busy: the core can need a while (seen: 16 s on the MX2000)
          	while [ $i -lt 480 ]; do
          		if netstat -ltn 2>/dev/null | grep -q "[:.]$port "; then
          			rules_up && log "running"
          			rm -f $TMPD/starting
          			return
          		fi
          		i=$((i + 1)); sleep 0.25
          	done
          	rm -f $TMPD/starting
          	log "the core did not start listening on port $port: rules not applied (logread -e xray)"
          }

          sysctl_apply() {
          	local cc fw
          	cc=$(uci -q get xlite.main.tcp_cc)
          	[ -n "$cc" ] && sysctl -q -w net.ipv4.tcp_congestion_control="$cc" > /dev/null 2>&1
          	fw=$(uci -q get xlite.main.ip_forward)
          	[ "$fw" = 1 ] && sysctl -q -w net.ipv4.ip_forward=1 > /dev/null 2>&1
          	return 0
          }

          stop_v2raya() {
          	[ -x /etc/init.d/v2raya ] || return 0
          	if /etc/init.d/v2raya enabled 2>/dev/null || pidof v2raya > /dev/null; then
          		/etc/init.d/v2raya disable 2>/dev/null
          		uci -q set v2raya.config.enabled=0 && uci -q commit v2raya
          		# its own stop can hang (seen on the MX2000): give it 3 s, then kill
          		( /etc/init.d/v2raya stop > /dev/null 2>&1 & ); sleep 3
          		killall -9 v2raya v2ray xray 2>/dev/null
          		nft delete table inet v2raya 2>/dev/null
          		log "v2rayA stopped and disabled (XLite replaces it)"
          	fi
          	return 0
          }

          ping_server() {   # $1 = server section id
          	local hp host port proto ip uip t
          	hp=$($UC server "$1" 2>/dev/null) || { echo -1; return 1; }
          	set -- $hp; host=$1; port=$2; proto=$3
          	ip=$($UC resolve "$host" 2>/dev/null | head -n 1)
          	[ -n "$ip" ] && [ -n "$port" ] || { echo -1; return 1; }
          	# the ping must not go through the proxy
          	case "$ip" in
          	*:*) nft add element inet xlite bypass6 "{ $ip }" 2>/dev/null; uip="[$ip]" ;;
          	*) nft add element inet xlite bypass4 "{ $ip }" 2>/dev/null; uip=$ip ;;
          	esac
          	if [ "$proto" = wireguard ] || nft list table inet v2raya > /dev/null 2>&1; then
          		# WireGuard is UDP (no TCP connect to time); v2rayA would catch a TCP ping
          		t=$(ping -c 1 -W 2 "$ip" 2>/dev/null | sed -n 's/.*time=\([0-9.]*\) *ms.*/\1/p' | head -n 1)
          		[ -n "$t" ] || { echo -1; return 1; }
          		awk -v t="$t" 'BEGIN { printf "%d\n", t + 0.5 }'
          		return 0
          	fi
          	t=$(curl -s --noproxy '*' -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' "http://$uip:$port/" 2>/dev/null)
          	case "$t" in ''|0|0.000|0.000000) echo -1; return 1 ;; esac
          	awk -v t="$t" 'BEGIN { printf "%d\n", t * 1000 + 0.5 }'
          }

          fetch() {   # $1 = url, $2 = file  (direct; through the core when "update_via" is proxy or direct fails)
          	local port via
          	port=$(uci -q get xlite.main.socks_port); via=$(uci -q get xlite.main.update_via)
          	if command -v curl > /dev/null; then
          		if [ "$via" != proxy ] && curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"; then return 0; fi
          		[ "${port:-0}" -gt 0 ] 2>/dev/null && pidof xray > /dev/null && curl -fsSL --retry 2 --connect-timeout 15 --socks5-hostname 127.0.0.1:$port -o "$2" "$1" && return 0
          		[ "$via" = proxy ] && curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"
          	else wget -q -O "$2" "$1"; fi
          }

          do_update() {
          	local tmp
          	[ -n "$REPO" ] || { echo "update source unknown (reinstall with the install command)"; return 1; }
          	tmp=$(mktemp -d /tmp/xlite-up.XXXXXX) || return 1
          	if ! fetch "https://github.com/$REPO/releases/download/${TAG:-xlite}/install.sh" "$tmp/install.sh"; then
          		rm -rf "$tmp"; echo "download failed (no internet?)"; return 1
          	fi
          	XLITE_UPDATE=1 sh "$tmp/install.sh"
          	local rc=$?
          	rm -rf "$tmp"
          	return $rc
          }

          do_uninstall() {
          	/etc/init.d/xlite stop 2>/dev/null
          	/etc/init.d/xlite disable 2>/dev/null
          	rules_down
          	# the DNS cache settings XLite changed in /etc/config/dhcp go back to what they were
          	r=1
          	dhcp_opt cachesize '' && r=0
          	dhcp_opt min_cache_ttl '' && r=0
          	[ $r = 0 ] && /etc/init.d/dnsmasq restart > /dev/null 2>&1
          	if uci -q get network.xlwg > /dev/null; then
          		for s in xlwg xlwg_peer xlwg_rule xlwg_rule6 xlwg_route xlwg_route6; do uci -q delete network.$s; done
          		uci -q delete firewall.xlwg_zone; uci -q delete firewall.xlwg_fwd
          		uci commit network; uci commit firewall
          		ubus call network reload; /etc/init.d/firewall reload > /dev/null 2>&1
          	fi
          	for f in $(cat $SHARE/files 2>/dev/null); do rm -f "$f"; done
          	rm -rf $SHARE /usr/share/ucode/xlite /www/luci-static/resources/view/xlite $RUN /tmp/xlite-core $TMPD
          	rm -f /etc/init.d/xlite /usr/bin/xlite /etc/hotplug.d/iface/90-xlite /usr/share/rpcd/ucode/xlite.uc \
          		/usr/share/rpcd/acl.d/luci-app-xlite.json /usr/share/luci/menu.d/luci-app-xlite.json
          	rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
          	/etc/init.d/rpcd reload 2>/dev/null
          	if [ -x /etc/init.d/v2raya ]; then
          		uci -q set v2raya.config.enabled=1 && uci -q commit v2raya
          		/etc/init.d/v2raya enable && /etc/init.d/v2raya start
          		echo "v2rayA is running again"
          	fi
          	echo "XLite removed (settings kept in /etc/config/xlite; delete it by hand if you want)"
          }

          case "$1" in
          prepare)
          	rm -rf $RUN && mkdir -p $RUN $TMPD
          	ad=$(uci -q get xlite.main.adblock)
          	if [ "$ad" = local ] || [ "$ad" = both ]; then [ -s $TMPD/adblock.conf ] || adblock_list > /dev/null 2>&1; fi
          	mode=$(uci -q get xlite.main.transparent)
          	rmode=$(uci -q get xlite.main.rule_mode); rmode=${rmode:-gfwlist}
          	[ "$mode" = same ] && mode=$rmode
          	rp="$(uci -q get xlite.main.socks_rule_port)$(uci -q get xlite.main.http_rule_port)"
          	case "$mode $rmode" in *gfwlist*) [ "$mode" = gfwlist ] || [ -n "${rp#0}" ] && [ ! -s /etc/xlite/gfw.txt ] && lists gfw > /dev/null 2>&1 ;; esac
          	case "$mode $rmode" in *except_cn*) [ "$mode" = except_cn ] || [ -n "${rp#0}" ] && [ ! -s /etc/xlite/cn4.txt ] && lists cn > /dev/null 2>&1 ;; esac
          	$UC build $RUN || exit 1
          	if [ "$(state '@.netchg')" = true ]; then
          		# the WireGuard interface of the second server was added, changed or removed
          		ubus call network reload 2>/dev/null
          		/etc/init.d/firewall reload > /dev/null 2>&1
          	elif [ "$(state '@.second.kernel')" = true ]; then
          		# only when it is down: an ifup of a running interface restarts it (and cuts the tunnel)
          		[ "$(ubus call network.interface.xlwg status 2>/dev/null | jsonfilter -e '@.up' 2>/dev/null)" = true ] || ifup xlwg 2>/dev/null
          	fi
          	exit 0
          	;;
          dns_on) dns_on ;;
          adblock) adblock_list ;;
          dns_off) dns_off ;;
          wg_deps) wg_deps ;;
          exitip) exit_ip "$2" ;;
          sub) subs "${2:-all}" ;;
          lists) lists "$2" ;;
          rules_up) rules_up ;;
          rules_when_ready) rules_when_ready ;;
          rules_down) rules_down ;;
          sysctl) sysctl_apply ;;
          stop_v2raya) stop_v2raya ;;
          core) core_path ;;
          refresh_ips)
          	# an interface got a new address: refresh the set of the router's own addresses
          	nft list table inet xlite > /dev/null 2>&1 || exit 0
          	nft flush set inet xlite local_ips 2>/dev/null
          	for a in $(ip -4 -o addr show | sed -n 's/.* inet \([0-9.]*\)\/.*/\1/p'); do nft add element inet xlite local_ips "{ $a }" 2>/dev/null; done
          	if nft list set inet xlite local_ips6 > /dev/null 2>&1; then
          		nft flush set inet xlite local_ips6
          		for a in $(ip -6 -o addr show | sed -n 's/.* inet6 \([0-9a-fA-F:]*\)\/.*/\1/p'); do nft add element inet xlite local_ips6 "{ $a }" 2>/dev/null; done
          	fi
          	;;
          start|stop|restart|reload|enable|disable) /etc/init.d/xlite "$1" ;;
          status)
          	echo "version: ${VERSION:-?}"
          	if pidof xray > /dev/null && nft list table inet xlite > /dev/null 2>&1; then echo "state:   running"; else echo "state:   stopped"; fi
          	[ -s $RUN/state.json ] && echo "server:  $(jsonfilter -i $RUN/state.json -e '@.name')"
          	[ -n "$(state '@.second.name')" ] && echo "second:  $(state '@.second.name') ($(state '@.second.protocol'), kernel: $(state '@.second.kernel'))"
          	echo "core:    $(core_path 2>/dev/null || echo missing)"
          	c=$(core_path 2>/dev/null) && grep -aq 'VLESS downlink splice' "$c" && echo "zero-copy: built in"
          	;;
          add) $UC add ;;
          ping) ping_server "$2" ;;
          update) do_update ;;
          uninstall) do_uninstall ;;
          *) sed -n '2,9p' "$0" | sed 's/^# \{0,1\}//'; exit 1 ;;
          esac
          XLITE_FILE_2
          chmod 755 "src/usr/bin/xlite"
          mkdir -p "$(dirname "src/usr/share/luci/menu.d/luci-app-xlite.json")"
          cat > "src/usr/share/luci/menu.d/luci-app-xlite.json" <<'XLITE_FILE_3'
          {
          	"admin/services/xlite": {
          		"title": "XLite",
          		"order": 5,
          		"action": { "type": "view", "path": "xlite/app" },
          		"depends": { "acl": [ "luci-app-xlite" ] }
          	}
          }
          XLITE_FILE_3
          mkdir -p "$(dirname "src/usr/share/rpcd/acl.d/luci-app-xlite.json")"
          cat > "src/usr/share/rpcd/acl.d/luci-app-xlite.json" <<'XLITE_FILE_4'
          {
          	"luci-app-xlite": {
          		"description": "XLite proxy",
          		"read": {
          			"ubus": {
          				"xlite": [
          					"status",
          					"servers",
          					"settings",
          					"ping",
          					"link",
          					"update_state",
          					"log",
          					"geo",
          					"exitip",
          					"task_state",
          					"lists_info",
          					"routinga_check",
          					"subs",
          					"devices",
          					"apps",
          					"lan_devices",
          					"ports",
          					"bond_status",
          					"backup",
          					"r2apps"
          				]
          			},
          			"uci": [
          				"xlite"
          			]
          		},
          		"write": {
          			"ubus": {
          				"xlite": [
          					"add",
          					"remove",
          					"rename",
          					"edit",
          					"select",
          					"connect",
          					"set_settings",
          					"update",
          					"second",
          					"wg_deps",
          					"lists",
          					"sub_add",
          					"sub_update",
          					"sub_remove",
          					"device_name",
          					"usage_reset",
          					"iso_set",
          					"learn_start",
          					"learn_stop",
          					"learn_save",
          					"learn_clear",
          					"block_device",
          					"bot_test",
          					"adblock_update",
          					"restore",
          					"uninstall",
          					"r2app_set",
          					"device_route",
          					"port_wan",
          					"bond_set",
          					"bond_test"
          				]
          			},
          			"uci": [
          				"xlite"
          			]
          		}
          	}
          }
          XLITE_FILE_4
          mkdir -p "$(dirname "src/usr/share/rpcd/ucode/xlite.uc")"
          cat > "src/usr/share/rpcd/ucode/xlite.uc" <<'XLITE_FILE_5'
          // XLite backend for LuCI (ubus object "xlite")
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';
          import * as lib from 'xlite.lib';

          const RUN = '/var/etc/xlite';
          const TMP = '/tmp/xlite';
          const KEEP = '/etc/xlite';
          const SHARE = getenv('XLITE_SHARE') ?? '/usr/share/xlite';
          const B = [ '0', '1' ];
          function num(lo, hi) { return [ 'num', lo, hi ]; }
          // every option LuCI may change, with what it may hold
          const SETTINGS = {
          	// v2rayA
          	transparent: [ 'off', 'all', 'gfwlist', 'except_cn', 'routinga', 'same' ], rule_mode: [ 'gfwlist', 'except_cn', 'routinga' ],
          	impl: [ 'tproxy', 'redirect' ], antipollution: [ 'none', 'hijack', 'forward', 'doh' ], special: [ 'off', 'supervisor', 'fakedns' ],
          	tfo: [ 'default', 'on', 'off' ], mux: B, mux_conc: num(1, 128), sniffing: [ 'off', 'http_tls', 'http_tls_quic' ],
          	sub_auto: B, sub_auto_mode: [ 'interval', 'boot' ], sub_interval: num(1, 168), gfw_auto: [ 'off', 'boot', 'daily', 'weekly' ],
          	update_via: [ 'direct', 'proxy' ], ip_forward: B, port_sharing: B, loglevel: [ 'warning', 'info', 'debug', 'error', 'none' ],
          	// ports
          	tproxy_port: num(1024, 65535), socks_port: num(0, 65535), http_port: num(0, 65535), socks_rule_port: num(0, 65535), http_rule_port: num(0, 65535),
          	// second server
          	r2: B, r2_iq: B, r2_fallback: [ 'main', 'direct', 'none' ], r2_kernel: B, speedtest_main: B, r2_probe_interval: num(10, 300),
          	r2_probe: /^https?:\/\/[A-Za-z0-9.:\/_?=&%-]{1,200}$/, r2_speed_ports: (v) => lib.ports_ok(v),
          	// DNS and speed
          	dns: [ 'proxy', 'direct' ], dns_cache: B, dns_cache_size: num(150, 50000),
          	dns_upstream: (v) => length(v) <= 120 && !length(filter(split(v, /[ ,]+/), (x) => x != '' && !lib.ip4_ok(x) && !lib.ip6_ok(x))),
          	dns_stale: B, dns_min_ttl: num(0, 3600), block_quic: B, smart_mux: B,
          	// line bonding
          	bond: B, bond_ifaces: /^[A-Za-z0-9_ -]{0,120}$/, bond_mode: [ 'rr', 'fast', 'backup' ], bond_auto: B, bond_alert: B,
          	// ads
          	adblock: [ 'off', 'adguard', 'local', 'both' ], adblock_size: [ 'small', 'medium', 'large' ], adblock_allow: /^[A-Za-z0-9. -]*$/,
          	// isolation
          	iso_calls: B, iso_sniff: B, learn_minutes: num(1, 30),
          	// core
          	splice: B, gomaxprocs: num(0, 8), gogc: num(50, 1000), early_exit: B, tcp_cc: [ '', 'cubic', 'bbr' ], ipv6: [ 'auto', '0', '1' ], nofile: num(1024, 65535),
          	// devices
          	save_minutes: num(5, 240), billing_day: num(1, 28), hide_idle: B,
          	// Telegram
          	bot_enabled: B, bot_token: /^([0-9]{5,15}:[A-Za-z0-9_-]{20,60})?$/, bot_chat: /^-?[0-9]{0,20}$/, bot_alert_down: B, bot_alert_newdev: B,
          	bot_report_time: /^([01][0-9]|2[0-3]):[0-5][0-9]$/,
          	// tool and page
          	auto_update: B, ui_motion: [ 'full', 'light', 'off' ], ui_refresh: [ '1', '2', '5' ], ui_lang: [ 'ar', 'en' ]
          };
          // changing these needs no restart of the core (the page or the monitor reads them)
          const NO_RESTART = { ui_motion: 1, ui_refresh: 1, ui_lang: 1, hide_idle: 1, save_minutes: 1, learn_minutes: 1, bot_alert_down: 1,
          	bot_alert_newdev: 1, bot_report_time: 1, auto_update: 1, gfw_auto: 1, sub_auto: 1, sub_auto_mode: 1, sub_interval: 1, update_via: 1, adblock_size: 1, adblock_allow: 1 };

          function valid(rule, val) {
          	if (type(rule) == 'function')
          		return !!rule(val);
          	if (type(rule) == 'array' && rule[0] == 'num')
          		return match(val, /^[0-9]{1,5}$/) && +val >= rule[1] && +val <= rule[2];
          	if (type(rule) == 'array')
          		return index(rule, val) >= 0;
          	return !!match(val, rule);
          }

          let splice_cache = {};
          let geo_saved = 0;

          // the page asks for status every 2 s: what it would learn by starting processes (ubus, nft, xlite core)
          // is remembered for a few seconds instead (restart_bg / stop_bg forget it at once)
          let sc = { pid: null, pid_t: -100, core: null, core_t: -100, rules: false, rules_t: -100 };

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function uci() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('xlite');
          	return c;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function writejson(path, v) {
          	fs.mkdir(TMP);
          	fs.writefile(path, sprintf('%J', v));
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          let apps_cache = null;

          function apps_data() {
          	let st = fs.stat(SHARE + '/data/apps.json'), key = st ? st.size + ':' + st.mtime : '';
          	if (!apps_cache || apps_cache.key != key)
          		apps_cache = { key, d: readjson(SHARE + '/data/apps.json') ?? { apps: [], iraq_domains: [] } };
          	return apps_cache.d;
          }

          // a settings change: a reload rebuilds the config, and only what changed restarts (see the init script)
          // line bonding: the router's ports and the bonded lines
          function net_cursor() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('network'); c.load('xlite');
          	return c;
          }

          function is_usb(dev) {
          	return index(fs.readlink('/sys/class/net/' + dev + '/device') ?? '', 'usb') >= 0;
          }

          function carrier(dev) {
          	return trim(fs.readfile('/sys/class/net/' + dev + '/carrier') ?? '0') == '1';
          }

          // LAN ports of br-lan (DSA), the WAN ports, and USB modems; "xw_<port>" = made a line here
          function port_list(c) {
          	let r = [], seen = {}, br = null, iface_of = {};
          	c.foreach('network', 'device', (s) => { if (s.name == 'br-lan') br = s; });
          	c.foreach('network', 'interface', (s) => { if (s.device && s['.name'] != 'loopback') iface_of[s.device] = s['.name']; });
          	for (let p in br?.ports ?? []) {
          		seen[p] = 1;
          		push(r, { port: p, kind: is_usb(p) ? 'usb' : 'lan', role: 'lan', up: carrier(p) });
          	}
          	for (let dev, i in iface_of) {
          		if (seen[dev] || i == 'lan' || !fs.stat('/sys/class/net/' + dev))
          			continue;
          		let usb = is_usb(dev);
          		if (i == 'wan' || i == 'wwan' || match(i, /^xw_/) || usb) {
          			seen[dev] = 1;
          			push(r, { port: dev, kind: usb ? 'usb' : (match(i, /^xw_/) ? 'lan' : 'wan'), role: 'wan', iface: i, line: i, mine: !!match(i, /^xw_/), up: carrier(dev), usb });
          		}
          	}
          	// a USB modem nobody configured yet
          	for (let dev in fs.lsdir('/sys/class/net') ?? [])
          		if (!seen[dev] && is_usb(dev))
          			push(r, { port: dev, kind: 'usb', role: 'free', usb: true, up: carrier(dev) });
          	return { ports: r, dsa: !!br };
          }

          function pairs(s) {
          	let r = {};
          	for (let w in split(s ?? '', /[ ,]+/)) { let m = match(w, /^([A-Za-z0-9_-]+):([0-9]+)$/); if (m) r[m[1]] = +m[2]; }
          	return r;
          }

          function words2(s) {
          	return filter(split(s ?? '', /[ ,]+/), (x) => x != '');
          }

          function line_label(iface, dev, kind) {
          	if (iface == 'wan') return 'الخط الأساسي';
          	if (kind == 'usb') return 'مودم USB';
          	return 'خط منفذ ' + dev;
          }

          function restart_bg() {
          	sc.pid_t = -100; sc.rules_t = -100; sc.core_t = -100;
          	system('( /etc/init.d/xlite reload > /dev/null 2>&1 & )');
          }

          function stop_bg() {
          	sc.pid_t = -100; sc.rules_t = -100;
          	system('( /etc/init.d/xlite stop > /dev/null 2>&1 & )');
          }

          function core_pid() {
          	let j = null;
          	try { j = json(sh("ubus call service list '{\"name\":\"xlite\"}' 2>/dev/null")); } catch (e) {}
          	return j?.xlite?.instances?.xray?.running ? j.xlite.instances.xray.pid : null;
          }

          function core_pid_cached(now) {
          	if (sc.pid) {
          		let cl = fs.readfile('/proc/' + sc.pid + '/cmdline') ?? '';
          		if (index(cl, '/var/etc/xlite/config.json') >= 0)
          			return sc.pid;
          		sc.pid = null;
          	}
          	if (now - sc.pid_t < 3)
          		return null;
          	sc.pid_t = now;
          	sc.pid = core_pid();
          	return sc.pid;
          }

          function core_cached(now) {
          	if (sc.core != null && now - sc.core_t < (sc.core == '' ? 10 : 60) && (sc.core == '' || fs.stat(sc.core)))
          		return sc.core;
          	sc.core = trim(sh('/usr/bin/xlite core 2>/dev/null'));
          	sc.core_t = now;
          	return sc.core;
          }

          function rules_up(now) {
          	if (now - sc.rules_t < 5)
          		return sc.rules;
          	sc.rules = (system('nft -t list table inet xlite > /dev/null 2>&1') == 0 || system('nft list table inet xlite > /dev/null 2>&1') == 0);
          	sc.rules_t = now;
          	return sc.rules;
          }

          function first_num(s) {
          	let m = match(s ?? '', /([0-9]+)/);
          	return m ? +m[1] : null;
          }

          function cpu_counters() {
          	let r = [];
          	for (let l in split(fs.readfile('/proc/stat') ?? '', '\n')) {
          		let m = match(l, /^cpu([0-9]+) +(.*)$/);
          		if (!m)
          			continue;
          		let v = map(split(m[2], / +/), (x) => +x);
          		let idle = v[3] + (v[4] ?? 0), total = 0;
          		for (let x in v)
          			total += x;
          		push(r, [ total - idle, total ]);
          	}
          	return r;
          }

          function net_counters(dev) {
          	let base = '/sys/class/net/' + replace(dev ?? '', /[^A-Za-z0-9._@-]/g, '') + '/statistics/';
          	return { rx: +(trim(fs.readfile(base + 'rx_bytes') ?? '0')), tx: +(trim(fs.readfile(base + 'tx_bytes') ?? '0')) };
          }

          function splice_built(path) {
          	let st = fs.stat(path);
          	if (!st)
          		return false;
          	let key = path + ':' + st.size + ':' + st.mtime;
          	if (splice_cache[key] == null)
          		splice_cache[key] = (trim(sh("grep -aq 'VLESS downlink splice' '" + replace(path, /'/g, '') + "' && echo y")) == 'y');
          	return splice_cache[key];
          }

          function release() {
          	let r = {};
          	for (let l in split(fs.readfile('/usr/share/xlite/release') ?? '', '\n')) {
          		let m = match(l, /^([A-Z]+)=(.*)$/);
          		if (m)
          			r[lc(m[1])] = m[2];
          	}
          	return r;
          }

          function server_list(c, cur) {
          	let r = [], cur2 = c.get('xlite', 'main', 'server2'), r2 = c.get('xlite', 'main', 'r2') == '1';
          	c.foreach('xlite', 'server', (s) => {
          		let p = lib.parse_link(s.link);
          		push(r, {
          			id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '', valid: !p.error, error: p.error, current: s['.name'] == cur,
          			second: r2 && s['.name'] == cur2, host: p.address ?? '', port: p.port ?? '', sub: s.sub ?? ''
          		});
          	});
          	return r;
          }

          function status_server(c, cur) {
          	let r = null;
          	c.foreach('xlite', 'server', (s) => {
          		if (s['.name'] != cur)
          			return;
          		let p = lib.parse_link(s.link);
          		r = { id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '' };
          	});
          	return r;
          }

          function count_servers(c) {
          	let n = 0;
          	c.foreach('xlite', 'server', () => { n++; });
          	return n;
          }

          // country of an address (ip-api.com, cached: in RAM and in /etc/xlite/geo.json)
          function resolve1(host) {
          	if (match(host, /^[0-9.]+$/) || index(host, ':') >= 0)
          		return host;
          	for (let dns in [ '', ' 1.1.1.1' ]) {
          		let out = sh('{ command -v timeout > /dev/null 2>&1 && T="timeout 3"; $T nslookup ' + shq(host) + dns + ' 2>/dev/null; }'), seen = false;
          		for (let l in split(out, '\n')) {
          			if (match(l, /^Name:/)) seen = true;
          			else if (seen) {
          				let m = match(l, /([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          				// 198.18.0.0/15: a FakeDNS answer of the core, not the real address
          				if (m && !match(m[1], /^198\.1[89]\./)) return m[1];
          			}
          		}
          	}
          	return null;
          }

          function geo_lookup(hosts) {
          	let cache = readjson(TMP + '/geo.json') ?? readjson(KEEP + '/geo.json') ?? {};
          	// names are looked up again after a day (their address may have moved)
          	if (time() - (cache['@t'] ?? 0) > 86400) {
          		for (let k in keys(cache))
          			if (!match(k, /^[0-9.]+$/) && index(k, ':') < 0) delete cache[k];
          		cache['@t'] = time();
          	}
          	let r = {}, ask = [], ipof = {}, miss = readjson(TMP + '/geo-miss.json') ?? {}, missed = false;
          	for (let h in hosts) {
          		if (type(h) != 'string' || h == '' || length(h) > 255)
          			continue;
          		if (cache[h]) { r[h] = cache[h]; continue; }
          		if (miss[h] && time() - miss[h] < 1800) continue;
          		let ip = resolve1(h);
          		if (!ip) { miss[h] = time(); missed = true; continue; }
          		ipof[h] = ip;
          		if (cache[ip]) { r[h] = cache[ip]; cache[h] = cache[ip]; continue; }
          		push(ask, ip);
          	}
          	if (missed) writejson(TMP + '/geo-miss.json', miss);
          	if (length(ask)) {
          		let f = TMP + '/geo-q.json';
          		writejson(f, map(slice(ask, 0, 100), (ip) => ({ query: ip, fields: 'countryCode,query' })));
          		let port = +(uci().get('xlite', 'main', 'socks_port') ?? 0);
          		let via = (port > 0 && system('nft list table inet xlite > /dev/null 2>&1') == 0) ? ` --socks5-hostname 127.0.0.1:${port}` : '';
          		let out = sh(`curl -s -m 6${via} -X POST --data @${f} http://ip-api.com/batch 2>/dev/null`);
          		if (out == '' && via != '')
          			out = sh(`curl -s -m 6 -X POST --data @${f} http://ip-api.com/batch 2>/dev/null`);
          		let j = null;
          		try { j = json(out); } catch (e) {}
          		for (let x in (type(j) == 'array' ? j : []))
          			if (x?.query && match(x.countryCode ?? '', /^[A-Z]{2}$/))
          				cache[x.query] = x.countryCode;
          		for (let h, ip in ipof)
          			if (cache[ip]) { r[h] = cache[ip]; cache[h] = cache[ip]; }
          		writejson(TMP + '/geo.json', cache);
          		// flash: addresses only (the country of a name follows its address), at most once an hour
          		if (time() - geo_saved > 3600) {
          			geo_saved = time();
          			let keep = {};
          			for (let k, v in cache)
          				if (match(k, /^[0-9.]+$/) || index(k, ':') >= 0) keep[k] = v;
          			fs.mkdir(KEEP);
          			writejson(KEEP + '/geo.json', keep);
          		}
          	}
          	return r;
          }

          function bg(cmd, log) {
          	fs.mkdir(TMP);
          	system(`( ${cmd} > ${log} 2>&1; echo "rc=$?" >> ${log} ) > /dev/null 2>&1 &`);
          }

          function learn_log_off() {
          	let c = uci();
          	if (c.get('xlite', 'main', 'learn_log') == '1') {
          		c.set('xlite', 'main', 'learn_log', '0');
          		c.save('xlite'); c.commit('xlite');
          		if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          	}
          }

          function c_names() {
          	let r = {};
          	uci().foreach('xlite', 'device', (s) => { if (s.id) r[s.id] = s.name; });
          	return r;
          }

          const methods = {
          	status: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {};
          			let st = null;
          			try { st = json(fs.readfile(RUN + '/state.json') ?? 'null'); } catch (e) {}
          			let now0 = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          			let pid = core_pid_cached(now0), up = null, mem = null, core = core_cached(now0);
          			if (pid) {
          				let stat = fs.readfile('/proc/' + pid + '/stat') ?? '';
          				let f = split(substr(stat, rindex(stat, ')') + 2), ' ');
          				let uptime = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          				up = int(uptime - (+f[19]) / 100);
          				mem = first_num(match(fs.readfile('/proc/' + pid + '/status') ?? '', /VmRSS:[^\n]*/)?.[0]);
          			}
          			let rules = rules_up(now0);
          			let wan = st?.wan?.[0] ?? 'wan';
          			let srv = status_server(c, opt.server);
          			let mi = {};
          			for (let l in split(fs.readfile('/proc/meminfo') ?? '', '\n')) {
          				let m = match(l, /^(MemTotal|MemAvailable): +([0-9]+)/);
          				if (m) mi[m[1]] = +m[2];
          			}
          			return {
          				enabled: opt.enabled == '1', running: !!pid, rules, uptime: up, core_rss_kb: mem,
          				server: srv ? { id: srv.id, name: srv.name, protocol: srv.protocol, net: srv.net, header: srv.header, security: srv.security } : null,
          				core: core, core_splice: core ? splice_built(core) : false, splice_on: opt.splice != '0',
          				wan, net: net_counters(wan), cpu: cpu_counters(), now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0],
          				mem_total_kb: mi.MemTotal, mem_avail_kb: mi.MemAvailable,
          				v2raya: !!fs.stat('/etc/init.d/v2raya'), release: release(), servers: count_servers(c),
          				ip: st?.ip, protocol: st?.protocol, second: st?.second, warnings: st?.warnings ?? [],
          				r2: opt.r2 == '1', mon: readjson(TMP + '/mon.json')
          			};
          		}
          	},

          	servers: {
          		call: function() {
          			let c = uci();
          			return { servers: server_list(c, c.get('xlite', 'main', 'server')) };
          		}
          	},

          	add: {
          		args: { links: '' },
          		call: function(req) {
          			let c = uci(), report = [], first = null;
          			for (let l in split(req.args?.links ?? '', /[\r\n ]+/)) {
          				l = trim(l);
          				if (l == '')
          					continue;
          				let p = lib.parse_link(l);
          				if (p.error) {
          					push(report, { ok: false, error: p.error });
          					continue;
          				}
          				let dup = null, key = replace(p.link, /#.*$/, '');
          				c.foreach('xlite', 'server', (s) => { if (replace(s.link ?? '', /#.*$/, '') == key) dup = s['.name']; });
          				if (dup) {
          					push(report, { ok: true, dup: true, name: p.name });
          					continue;
          				}
          				let id = c.add('xlite', 'server');
          				c.set('xlite', id, 'name', p.name);
          				c.set('xlite', id, 'link', p.link);
          				first ??= id;
          				push(report, { ok: true, name: p.name, id });
          			}
          			let restart = false;
          			if (first && !c.get('xlite', 'main', 'server')) {
          				c.set('xlite', 'main', 'server', first);
          				restart = (c.get('xlite', 'main', 'enabled') == '1');
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart)
          				restart_bg();
          			return { report };
          		}
          	},

          	remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.delete('xlite', id);
          			let cur = c.get('xlite', 'main', 'server'), restart = false;
          			if (cur == id) {
          				let next = null;
          				c.foreach('xlite', 'server', (s) => { next ??= s['.name']; });
          				if (next)
          					c.set('xlite', 'main', 'server', next);
          				else
          					c.delete('xlite', 'main', 'server');
          				restart = true;
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	rename: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, name = trim(req.args?.name ?? '');
          			if (c.get('xlite', id) != 'server' || name == '' || length(name) > 64)
          				return { ok: false };
          			c.set('xlite', id, 'name', name);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	link: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci();
          			return { link: c.get('xlite', req.args?.id ?? '', 'link') };
          		}
          	},

          	edit: {
          		args: { id: '', link: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, p = lib.parse_link(req.args?.link ?? '');
          			if (c.get('xlite', id) != 'server')
          				return { ok: false, error: 'السيرفر غير موجود' };
          			if (p.error)
          				return { ok: false, error: p.error };
          			c.set('xlite', id, 'link', p.link);
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'server') == id && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	select: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.set('xlite', 'main', 'server', id);
          			c.set('xlite', 'main', 'enabled', '1');
          			c.save('xlite');
          			c.commit('xlite');
          			system('/etc/init.d/xlite enable > /dev/null 2>&1');
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	connect: {
          		args: { on: false },
          		call: function(req) {
          			let c = uci(), on = !!req.args?.on;
          			if (on && !c.get('xlite', 'main', 'server')) {
          				let first = null;
          				c.foreach('xlite', 'server', (s) => { first ??= s['.name']; });
          				if (!first)
          					return { ok: false, error: 'ضيف سيرفر أول' };
          				c.set('xlite', 'main', 'server', first);
          			}
          			c.set('xlite', 'main', 'enabled', on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (on) {
          				system('/etc/init.d/xlite enable > /dev/null 2>&1');
          				restart_bg();
          			}
          			else
          				stop_bg();
          			return { ok: true };
          		}
          	},

          	ping: {
          		args: { id: '' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? '', /[^A-Za-z0-9_]/g, '');
          			let ms = +trim(sh('/usr/bin/xlite ping ' + id + ' 2>/dev/null') || '-1');
          			return { id, ms };
          		}
          	},

          	settings: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {}, r = {};
          			for (let k in SETTINGS)
          				r[k] = opt[k] ?? '';
          			r.bypass = opt.bypass ?? '';
          			r.r2_domains = opt.r2_domains ?? '';
          			r.routinga = opt.routinga ?? '';
          			r.server2 = opt.server2 ?? '';
          			return { settings: r, tcp_cc_now: trim(fs.readfile('/proc/sys/net/ipv4/tcp_congestion_control') ?? ''),
          				tcp_cc_avail: split(trim(fs.readfile('/proc/sys/net/ipv4/tcp_available_congestion_control') ?? ''), ' ') };
          		}
          	},

          	set_settings: {
          		args: { values: {} },
          		call: function(req) {
          			let c = uci(), v = req.args?.values ?? {}, bad = [], changed = {};
          			for (let k in v) {
          				let rule = SETTINGS[k], val = '' + v[k];
          				if (k == 'bypass') {
          					if (length(filter(split(trim(val), /[ ]+/), (x) => x != '' && !lib.ip4_ok(x, true) && !lib.ip6_ok(x, true)))) push(bad, k);
          					else { c.set('xlite', 'main', k, trim(val)); changed[k] = true; }
          					continue;
          				}
          				if (k == 'r2_domains') {
          					val = trim(replace(val, /[\r\n\t, ]+/g, ' '));
          					// an entry made of digits (an address) must be a real one, or nft and the core refuse the rules
          					let badip = filter(split(val, ' '), (x) => (match(x, /^[0-9.\/]+$/) && !lib.ip4_ok(x, true)) || (index(x, ':') >= 0 && !lib.ip6_ok(x, true)));
          					if (length(val) > 8000 || !match(val, /^[A-Za-z0-9.:\/*_ -]*$/) || length(badip)) push(bad, k);
          					else { c.set('xlite', 'main', k, val); changed[k] = true; }
          					continue;
          				}
          				if (k == 'routinga') {
          					if (length(val) > 20000 || length(lib.routinga(val).errs)) push(bad, k);
          					else { c.set('xlite', 'main', k, val); changed[k] = true; }
          					continue;
          				}
          				if (!rule || !valid(rule, val)) {
          					push(bad, k);
          					continue;
          				}
          				if (c.get('xlite', 'main', k) != val) {
          					c.set('xlite', 'main', k, val);
          					changed[k] = true;
          				}
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			let restart = false;
          			for (let k in changed) if (!NO_RESTART[k]) restart = true;
          			let on = (c.get('xlite', 'main', 'enabled') == '1');
          			// new exceptions change the DNS lines too: download the list, then restart (one restart for all)
          			if (changed.adblock_allow && on) {
          				sc.pid_t = -100; sc.rules_t = -100; sc.core_t = -100;
          				bg('/usr/bin/xlite adblock; /etc/init.d/xlite restart', TMP + '/ads.log');
          				return { ok: !length(bad), bad, restart: true };
          			}
          			if (changed.adblock_size || changed.adblock_allow)
          				bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			if (restart && (on || changed.bot_enabled || changed.bot_token))
          				restart_bg();
          			return { ok: !length(bad), bad, restart };
          		}
          	},

          	geo: {
          		args: { hosts: [] },
          		call: function(req) {
          			return { geo: geo_lookup(req.args?.hosts ?? []) };
          		}
          	},

          	exitip: {
          		args: { which: 1, fresh: false },
          		call: function(req) {
          			let w = (req.args?.which == 2) ? 2 : 1;
          			let cache = readjson(TMP + '/exit.json') ?? {};
          			let e = cache['' + w];
          			if (!req.args?.fresh && e && time() - e.t < 120)
          				return e;
          			let ip = trim(sh('/usr/bin/xlite exitip ' + w + ' 2>/dev/null'));
          			e = { ip: ip || null, t: time() };
          			if (ip) {
          				let g = geo_lookup([ ip ]);
          				e.cc = g[ip];
          			}
          			cache['' + w] = e;
          			writejson(TMP + '/exit.json', cache);
          			return e;
          		}
          	},

          	second: {
          		args: { id: '', on: false },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '', on = !!req.args?.on;
          			if (on) {
          				if (c.get('xlite', id) != 'server')
          					return { ok: false, error: 'السيرفر غير موجود' };
          				if (id == c.get('xlite', 'main', 'server'))
          					return { ok: false, error: 'هذا السيرفر الأساسي، اختار غيره' };
          				c.set('xlite', 'main', 'server2', id);
          			}
          			c.set('xlite', 'main', 'r2', on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			let p = on ? lib.parse_link(c.get('xlite', id, 'link')) : {};
          			let need_wg = on && p.protocol == 'wireguard' && !p.reserved && c.get('xlite', 'main', 'r2_kernel') != '0' &&
          				!(fs.stat('/lib/netifd/proto/wireguard.sh') && fs.stat('/sys/module/wireguard'));
          			return { ok: true, need_wg };
          		}
          	},

          	wg_deps: {
          		call: function() {
          			bg('/usr/bin/xlite wg_deps', TMP + '/wg.log');
          			return { ok: true };
          		}
          	},

          	task_state: {
          		args: { name: '' },
          		call: function(req) {
          			let n = replace(req.args?.name ?? '', /[^a-z]/g, '');
          			return { log: fs.readfile(TMP + '/' + n + '.log') ?? '' };
          		}
          	},

          	lists: {
          		args: { which: 'all' },
          		call: function(req) {
          			let w = req.args?.which;
          			bg('/usr/bin/xlite lists ' + ((w == 'gfw' || w == 'cn') ? w : 'all'), TMP + '/lists.log');
          			return { ok: true };
          		}
          	},

          	lists_info: {
          		call: function() {
          			let r = {};
          			for (let n in [ 'gfw', 'cn4' ]) {
          				let st = fs.stat(KEEP + '/' + n + '.txt');
          				r[n] = st ? { size: st.size, mtime: st.mtime } : null;
          			}
          			return r;
          		}
          	},

          	routinga_check: {
          		args: { text: '' },
          		call: function(req) {
          			let r = lib.routinga(req.args?.text ?? '');
          			return { errs: r.errs, rules: length(r.rules), def: r.def };
          		}
          	},

          	// --- subscriptions --------------------------------------------------------------------
          	subs: {
          		call: function() {
          			let c = uci(), r = [];
          			c.foreach('xlite', 'subscription', (s) => push(r, { id: s['.name'], name: s.name ?? '', url: s.url ?? '',
          				updated: +(s.updated ?? 0), count: +(s.count ?? 0) }));
          			return { subs: r };
          		}
          	},

          	sub_add: {
          		args: { name: '', url: '' },
          		call: function(req) {
          			let url = trim(req.args?.url ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(url, /^https?:\/\/[^ '"]+$/) || length(url) > 2000)
          				return { ok: false, error: 'الرابط لازم يبدي بـ http:// أو https://' };
          			let c = uci(), id = c.add('xlite', 'subscription');
          			c.set('xlite', id, 'name', name != '' ? substr(name, 0, 64) : 'اشتراك');
          			c.set('xlite', id, 'url', url);
          			c.save('xlite');
          			c.commit('xlite');
          			bg('/usr/bin/xlite sub ' + id, TMP + '/sub.log');
          			return { ok: true, id };
          		}
          	},

          	sub_update: {
          		args: { id: 'all' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? 'all', /[^A-Za-z0-9_]/g, '');
          			bg('/usr/bin/xlite sub ' + (id || 'all'), TMP + '/sub.log');
          			return { ok: true };
          		}
          	},

          	sub_remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (c.get('xlite', id) != 'subscription')
          				return { ok: false };
          			let sel = c.get('xlite', 'main', 'server'), sel2 = c.get('xlite', 'main', 'server2'), kept = 0;
          			let del = [];
          			c.foreach('xlite', 'server', (s) => { if (s.sub == id) push(del, s['.name']); });
          			for (let s in del) {
          				if (s == sel || s == sel2) { c.delete('xlite', s, 'sub'); kept++; }
          				else c.delete('xlite', s);
          			}
          			c.delete('xlite', id);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true, kept };
          		}
          	},

          	// --- devices --------------------------------------------------------------------------
          	devices: {
          		call: function() {
          			let u = readjson(TMP + '/usage.json') ?? readjson(KEEP + '/usage.json') ?? { devs: {} };
          			let mon = readjson(TMP + '/mon.json') ?? {};
          			let rate = {};
          			for (let d in mon.devs ?? []) rate[d.id] = d.rate;
          			let r = [];
          			for (let k, d in u.devs ?? {})
          				push(r, { id: k, ip: d.ip, name: d.name, seen: d.seen, days: d.days ?? {}, months: d.months ?? {}, rate: rate[k] ?? [ 0, 0 ] });
          			let names = c_names(), routes = {};
          			uci().foreach('xlite', 'device', (s) => { if (s.id && s.route) routes[s.id] = s.route; });
          			for (let d in r) {
          				if (names[d.id]) d.alias = names[d.id];
          				d.route = routes[d.id] ?? 'vpn';
          			}
          			let blocked = filter(split(uci().get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '');
          			return { devices: r, running: !!mon.t && time() - mon.t < 30, blocked };
          		}
          	},

          	device_name: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(id, /^[0-9a-f:.]+$/))
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (name == '') c.delete('xlite', sid);
          			else {
          				c.set('xlite', sid, 'device');
          				c.set('xlite', sid, 'id', id);
          				c.set('xlite', sid, 'name', substr(name, 0, 40));
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	usage_reset: {
          		call: function() {
          			for (let f in [ TMP + '/usage.json', KEEP + '/usage.json' ])
          				fs.unlink(f);
          			// the monitor clears its totals at its next cycle (no restart, the internet stays up)
          			writejson(TMP + '/usage.reset', true);
          			return { ok: true };
          		}
          	},

          	// --- isolation ------------------------------------------------------------------------
          	apps: {
          		call: function() {
          			let c = uci(), d = apps_data(), mon = readjson(TMP + '/mon.json') ?? {}, u = readjson(TMP + '/usage.json') ?? {};
          			let st = readjson(RUN + '/state.json') ?? {};
          			let ln = readjson(TMP + '/learn.json');
          			let r = [];
          			for (let a in d.apps) {
          				let sec = c.get_all('xlite', a.id) ?? {};
          				let learned = sec.learned ?? [];
          				if (type(learned) != 'array') learned = split(learned, ' ');
          				push(r, { id: a.id, name: a.name, group: a.group, letter: a.letter, color: a.color, learn: a.learn,
          					isolate: sec.isolate == '1', active: index(st.iso ?? [], a.id) >= 0,
          					domains: length(a.domains), ips: length(a.ip4 ?? []) + length(a.ip6 ?? []), learned,
          					rate: mon.apps?.[a.id]?.rate ?? 0, days: u.apps?.[a.id]?.days ?? {},
          					learning: !!(ln && ln.app == a.id && !ln.done),
          					pct: (ln && ln.app == a.id) ? +(ln.pct ?? 0) : +(sec.learn_pct ?? (length(learned) ? 100 : 0)) });
          			}
          			return { apps: r, learn: readjson(TMP + '/learn.json') };
          		}
          	},

          	iso_set: {
          		args: { id: '', on: false },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (!length(filter(apps_data().apps, (a) => a.id == id)))
          				return { ok: false };
          			if (c.get('xlite', id) != 'app')
          				c.set('xlite', id, 'app');
          			c.set('xlite', id, 'isolate', req.args?.on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	learn_start: {
          		args: { app: '', ip: '', minutes: 5 },
          		call: function(req) {
          			let app = req.args?.app ?? '', ip = req.args?.ip ?? '';
          			let c0 = uci(), kind = (c0.get('xlite', app) == 'r2app') ? 'r2' : 'iso';
          			if ((kind == 'iso' && !length(filter(apps_data().apps, (a) => a.id == app))) || !match(ip, /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/))
          				return { ok: false };
          			// Iraqi apps are learned by name too: the core logs the sniffed names while learning
          			if (kind == 'r2') {
          				c0.set('xlite', 'main', 'learn_log', '1');
          				c0.save('xlite'); c0.commit('xlite');
          				if (c0.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			}
          			let m = +(req.args?.minutes ?? 0) || +(uci().get('xlite', 'main', 'learn_minutes') ?? 10);
          			if (m < 1 || m > 30) m = 10;
          			writejson(TMP + '/learn.json', { app, ip, kind, start: time(), until: time() + m * 60, nets: {}, names: {} });
          			return { ok: true };
          		}
          	},

          	learn_stop: {
          		call: function() {
          			let l = readjson(TMP + '/learn.json');
          			if (l) { l.until = time() - 1; l.done = true; writejson(TMP + '/learn.json', l); }
          			learn_log_off();
          			return { ok: true };
          		}
          	},

          	learn_save: {
          		args: { app: '', nets: [], names: [] },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) == 'r2app') {
          				let ips = c.get('xlite', app, 'ip') ?? [], doms = c.get('xlite', app, 'domain') ?? [];
          				if (type(ips) != 'array') ips = split(ips, ' ');
          				if (type(doms) != 'array') doms = split(doms, ' ');
          				for (let n in req.args?.nets ?? [])
          					if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(ips, n) < 0) push(ips, n);
          				for (let d in req.args?.names ?? [])
          					if (match(d, /^[a-z0-9.-]{3,200}$/) && index(doms, d) < 0) push(doms, d);
          				c.set('xlite', app, 'ip', ips);
          				c.set('xlite', app, 'domain', doms);
          				let ln = readjson(TMP + '/learn.json');
          				if (ln && ln.app == app) c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          				c.set('xlite', app, 'on', '1');
          				c.save('xlite'); c.commit('xlite');
          				fs.unlink(TMP + '/learn.json');
          				learn_log_off();
          				if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          				return { ok: true, count: length(ips) + length(doms) };
          			}
          			if (!length(filter(apps_data().apps, (a) => a.id == app)))
          				return { ok: false };
          			let cur = c.get('xlite', app, 'learned') ?? [];
          			if (type(cur) != 'array') cur = split(cur, ' ');
          			for (let n in req.args?.nets ?? [])
          				if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(cur, n) < 0)
          					push(cur, n);
          			if (c.get('xlite', app) != 'app')
          				c.set('xlite', app, 'app');
          			c.set('xlite', app, 'learned', cur);
          			let ln = readjson(TMP + '/learn.json');
          			if (ln && ln.app == app)
          				c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          			c.save('xlite');
          			c.commit('xlite');
          			fs.unlink(TMP + '/learn.json');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true, count: length(cur) };
          		}
          	},

          	learn_clear: {
          		args: { app: '' },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) != 'app')
          				return { ok: false };
          			c.delete('xlite', app, 'learned');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	// --- Iraqi apps (through the second server) and the route of each device -----------------
          	r2apps: {
          		call: function() {
          			let c = uci(), r = [], ln = readjson(TMP + '/learn.json');
          			let n = 0;
          			c.foreach('xlite', 'r2app', () => n++);
          			if (!n) {
          				// first look: the usual Iraqi apps, empty (they are learned on the phone)
          				for (let p in [ [ 'cinemana', 'سينمانا' ], [ 'ayniq', 'عين العراق' ], [ 'capp', 'تطبيق C' ] ]) {
          					c.set('xlite', p[0], 'r2app'); c.set('xlite', p[0], 'name', p[1]); c.set('xlite', p[0], 'on', '0');
          				}
          				c.save('xlite'); c.commit('xlite');
          			}
          			c.foreach('xlite', 'r2app', (a) => {
          				let d = a.domain ?? [], ip = a.ip ?? [];
          				if (type(d) != 'array') d = split(d, ' ');
          				if (type(ip) != 'array') ip = split(ip, ' ');
          				push(r, { id: a['.name'], name: a.name ?? a['.name'], on: a.on == '1', domains: d, ips: ip,
          					learning: !!(ln && ln.app == a['.name'] && !ln.done),
          					pct: (ln && ln.app == a['.name']) ? +(ln.pct ?? 0) : +(a.learn_pct ?? ((length(d) + length(ip)) ? 100 : 0)) });
          			});
          			return { apps: r, learn: (ln && ln.kind == 'r2') ? ln : null };
          		}
          	},

          	r2app_set: {
          		args: { id: '', on: false, name: '', remove: false, domains: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (id == '') {
          				let name = trim(req.args?.name ?? '');
          				if (name == '' || length(name) > 40) return { ok: false };
          				id = c.add('xlite', 'r2app');
          				c.set('xlite', id, 'name', name);
          				c.set('xlite', id, 'on', '0');
          			}
          			else if (c.get('xlite', id) != 'r2app')
          				return { ok: false };
          			else if (req.args?.remove)
          				c.delete('xlite', id);
          			else {
          				if (req.args?.on != null) c.set('xlite', id, 'on', req.args.on ? '1' : '0');
          				if (req.args?.domains != null && req.args.domains != '') {
          					let l = filter(split(lc(req.args.domains), /[\s,]+/), (x) => match(x, /^[a-z0-9.-]{3,200}$/));
          					c.set('xlite', id, 'domain', l);
          				}
          			}
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true, id };
          		}
          	},

          	device_route: {
          		args: { id: '', route: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), route = req.args?.route ?? 'vpn';
          			if (!match(id, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/) || index([ 'vpn', 'warp', 'direct' ], route) < 0)
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (c.get('xlite', sid) != 'device') { c.set('xlite', sid, 'device'); c.set('xlite', sid, 'id', id); }
          			if (route == 'vpn') c.delete('xlite', sid, 'route'); else c.set('xlite', sid, 'route', route);
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	block_device: {
          		args: { mac: '', on: false },
          		call: function(req) {
          			let c = uci(), mac = lc(req.args?.mac ?? ''), on = !!req.args?.on;
          			if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          				return { ok: false };
          			let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          			if (on) push(l, mac);
          			c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          			c.save('xlite');
          			c.commit('xlite');
          			system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          			return { ok: true, blocked: l };
          		}
          	},

          	bot_test: {
          		call: function() {
          			let c = uci(), tok = c.get('xlite', 'main', 'bot_token'), chat = c.get('xlite', 'main', 'bot_chat');
          			if (!tok || !chat)
          				return { ok: false, error: chat ? 'حط التوكن' : 'افتح البوت بتلجرام واكتب /start أول' };
          			let f = TMP + '/bot-test.json';
          			writejson(f, { chat_id: chat, text: '✅ رسالة تجربة من XLite' });
          			let socks = +(c.get('xlite', 'main', 'socks_port') ?? 0);
          			let url = "'https://api.telegram.org/bot" + replace(tok, /[^0-9A-Za-z:_-]/g, '') + "/sendMessage'";
          			let out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${socks > 0 ? '--socks5-hostname 127.0.0.1:' + socks : ''} ${url} 2>/dev/null`);
          			if (!match(out, /"ok":true/))
          				out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${url} 2>/dev/null`);
          			fs.unlink(f);
          			return { ok: !!match(out, /"ok":true/) };
          		}
          	},

          	adblock_update: {
          		call: function() {
          			bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			return { ok: true };
          		}
          	},

          	// backup: the whole /etc/config/xlite (servers, subscriptions, settings, apps, device names)
          	backup: {
          		call: function() {
          			return { name: 'xlite-backup.conf', text: fs.readfile(getenv('XLITE_UCI_DIR') ? getenv('XLITE_UCI_DIR') + '/xlite' : '/etc/config/xlite') ?? '' };
          		}
          	},

          	restore: {
          		args: { text: '' },
          		call: function(req) {
          			let t = req.args?.text ?? '';
          			// only an XLite config: uci syntax, a main section, nothing else on a line
          			if (length(t) > 512000 || !match(t, /config xlite 'main'/))
          				return { ok: false, error: 'هذا مو ملف نسخة احتياطية من XLite' };
          			for (let l in split(t, '\n'))
          				if (!match(l, /^(\s*|\s*(config|option|list) .*|\s*#.*)$/))
          					return { ok: false, error: 'الملف بيه أسطر غريبة' };
          			let tmp = '/tmp/xlite-restore.conf';
          			fs.writefile(tmp, t);
          			let chk = system('uci -q -c /tmp import xlite-check < ' + tmp + ' > /dev/null 2>&1');
          			fs.unlink('/tmp/xlite-check');
          			if (chk != 0) {
          				fs.unlink(tmp);
          				return { ok: false, error: 'الملف خربان' };
          			}
          			system('cp /etc/config/xlite /etc/xlite/config.before-restore 2>/dev/null; mkdir -p /etc/xlite; cp ' + tmp + ' /etc/config/xlite; rm -f ' + tmp);
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	uninstall: {
          		call: function() {
          			bg('sleep 2; /usr/bin/xlite uninstall', '/tmp/xlite-uninstall.log');
          			return { ok: true };
          		}
          	},

          	ports: {
          		call: function() {
          			return port_list(net_cursor());
          		}
          	},

          	// the bonding page: every bonded line (address, gateway, counters, ping through it) and the ports
          	bond_status: {
          		call: function() {
          			let c = net_cursor(), m = c.get_all('xlite', 'main') ?? {};
          			let paused = words2(m.bond_paused), limits = pairs(m.bond_limits), probe = readjson(TMP + '/bond.json') ?? {};
          			let lines = [];
          			for (let i in words2(m.bond_ifaces)) {
          				let j = null;
          				try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          				let dev = j?.l3_device ?? j?.device ?? c.get('network', i, 'device') ?? i, gw = null;
          				for (let r in j?.route ?? [])
          					if (r.target == '0.0.0.0' && r.mask == 0 && r.nexthop != '0.0.0.0') gw = r.nexthop;
          				let kind = is_usb(dev) ? 'usb' : (i == 'wan' ? 'wan' : 'lan');
          				let base = '/sys/class/net/' + dev + '/statistics/', pr = probe[i];
          				let state = (index(paused, i) >= 0) ? 'paused' : (!j?.up || pr?.ok === false) ? 'down' : 'active';
          				push(lines, { iface: i, dev, kind, label: line_label(i, dev, kind), state, ip: j?.['ipv4-address']?.[0]?.address ?? '', gw: gw ?? '',
          					ping: pr?.ok ? pr.ms : null, rx: +trim(fs.readfile(base + 'rx_bytes') ?? '0'), tx: +trim(fs.readfile(base + 'tx_bytes') ?? '0'), limit: limits[i] ?? 0 });
          			}
          			let p = port_list(c);
          			return { on: m.bond == '1', mode: m.bond_mode || 'rr', auto: m.bond_auto != '0', alert: m.bond_alert != '0', lines, ports: p.ports, dsa: p.dsa,
          				now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0] };
          		}
          	},

          	// one change from the bonding page: on/off, mode, a line paused, a line's speed cap, the switches
          	bond_set: {
          		args: { key: '', iface: '', value: '' },
          		call: function(req) {
          			let k = req.args?.key ?? '', i = req.args?.iface ?? '', v = '' + (req.args?.value ?? '');
          			let c = uci();
          			if (i != '' && !match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			if (k == 'on' || k == 'auto' || k == 'alert') {
          				if (v != '0' && v != '1') return { ok: false };
          				c.set('xlite', 'main', k == 'on' ? 'bond' : 'bond_' + k, v);
          			}
          			else if (k == 'mode') {
          				if (index([ 'rr', 'fast', 'backup' ], v) < 0) return { ok: false };
          				c.set('xlite', 'main', 'bond_mode', v);
          			}
          			else if (k == 'pause') {
          				let l = filter(words2(c.get('xlite', 'main', 'bond_paused')), (x) => x != i);
          				if (v == '1') push(l, i);
          				c.set('xlite', 'main', 'bond_paused', join(' ', l));
          			}
          			else if (k == 'limit') {
          				if (!match(v, /^[0-9]{1,4}$/)) return { ok: false };
          				let l = pairs(c.get('xlite', 'main', 'bond_limits')), out = [];
          				l[i] = +v;
          				for (let n, mb in l) if (mb > 0) push(out, n + ':' + mb);
          				c.set('xlite', 'main', 'bond_limits', join(' ', out));
          			}
          			else
          				return { ok: false };
          			c.save('xlite'); c.commit('xlite');
          			// the alert switch is read by the monitor; everything else rebuilds the core
          			if (k != 'alert' && c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	// time a connection to the server through one line, now
          	bond_test: {
          		args: { iface: '' },
          		call: function(req) {
          			let i = req.args?.iface ?? '';
          			if (!match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			let j = null, st = readjson(RUN + '/state.json') ?? {};
          			try { j = json(sh('ubus call network.interface.' + i + ' status 2>/dev/null')); } catch (e) {}
          			let dev = j?.l3_device, port = +(st.port ?? 0) || 443;
          			if (!dev || !st.ip)
          				return { ok: false, error: 'الخط مو شغّال' };
          			let t = trim(sh(`curl -s --noproxy '*' --interface ${shq(dev)} -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' 'http://${st.ip}:${port}/' 2>/dev/null`));
          			let ms = (+t > 0) ? int(+t * 1000 + 0.5) : null;
          			return { ok: ms != null, ms, error: ms == null ? 'ما وصل للسيرفر من خلال هذا الخط' : null };
          		}
          	},

          	// one port to its own WAN line (DHCP, wan zone, in the bonding) or back to the LAN
          	port_wan: {
          		args: { port: '', on: false },
          		call: function(req) {
          			let p = req.args?.port ?? '', on = !!req.args?.on;
          			if (!match(p, /^[A-Za-z0-9._-]{1,15}$/) || !fs.stat('/sys/class/net/' + p))
          				return { ok: false, error: 'منفذ غير معروف' };
          			let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          			c.load('network'); c.load('firewall'); c.load('xlite');
          			let iface = 'xw_' + replace(p, /[^A-Za-z0-9]/g, '_'), br = null, wz = null;
          			c.foreach('network', 'device', (s) => { if (s.name == 'br-lan') br = s['.name']; });
          			c.foreach('firewall', 'zone', (s) => { if (s.name == 'wan') wz = s['.name']; });
          			if (!wz)
          				return { ok: false, error: 'ماكو زون wan بالفايروول' };
          			let ports = br ? (c.get('network', br, 'ports') ?? []) : [];
          			let nets = c.get('firewall', wz, 'network') ?? [];
          			if (type(nets) != 'array') nets = split(nets, ' ');
          			let bond = filter(split(c.get('xlite', 'main', 'bond_ifaces') ?? '', /[ ,]+/), (x) => x != '' && x != iface);
          			if (on) {
          				// keep one LAN port, or the router can only be reached over Wi-Fi
          				if (index(ports, p) >= 0 && length(ports) < 2)
          					return { ok: false, error: 'هذا آخر منفذ LAN، ما ينحول' };
          				if (index(ports, p) >= 0)
          					c.set('network', br, 'ports', filter(ports, (x) => x != p));
          				c.set('network', iface, 'interface');
          				c.set('network', iface, 'proto', 'dhcp');
          				c.set('network', iface, 'device', p);
          				// every line its own default route: different metrics, or the kernel keeps only one
          				let n = 0;
          				c.foreach('network', 'interface', (s) => { if (match(s['.name'], /^xw_/)) n++; });
          				c.set('network', iface, 'metric', '' + (10 + n));
          				if (index(nets, iface) < 0) push(nets, iface);
          				if (!length(bond)) push(bond, 'wan');
          				push(bond, iface);
          				c.set('xlite', 'main', 'bond', '1');
          			}
          			else {
          				if (c.get('network', iface) != 'interface')
          					return { ok: false, error: 'هذا المنفذ ما محوّل من هنا' };
          				c.delete('network', iface);
          				nets = filter(nets, (x) => x != iface);
          				// a USB modem was never a LAN port
          				if (br && index(ports, p) < 0 && index(fs.readlink('/sys/class/net/' + p + '/device') ?? '', 'usb') < 0)
          					c.set('network', br, 'ports', [ ...ports, p ]);
          			}
          			c.set('firewall', wz, 'network', nets);
          			c.set('xlite', 'main', 'bond_ifaces', join(' ', bond));
          			for (let k in [ 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			// the page answers first: a network reload can drop its connection for a moment
          			system('( sleep 1; /etc/init.d/network reload; /etc/init.d/firewall reload; [ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart ) > /dev/null 2>&1 &');
          			return { ok: true, iface, bond };
          		}
          	},

          	lan_devices: {
          		call: function() {
          			let r = [];
          			for (let l in split(fs.readfile('/tmp/dhcp.leases') ?? '', '\n')) {
          				let f = split(trim(l), /\s+/);
          				if (length(f) >= 4 && match(f[2], /^[0-9.]+$/))
          					push(r, { ip: f[2], mac: f[1], name: f[3] != '*' ? f[3] : '' });
          			}
          			return { devices: r };
          		}
          	},

          	update: {
          		call: function() {
          			system('( /usr/bin/xlite update > /tmp/xlite-update.log 2>&1; echo "rc=$?" >> /tmp/xlite-update.log ) > /dev/null 2>&1 &');
          			return { ok: true };
          		}
          	},

          	update_state: {
          		call: function() {
          			return { log: fs.readfile('/tmp/xlite-update.log') ?? '' };
          		}
          	},

          	log: {
          		call: function() {
          			return { log: sh("logread 2>/dev/null | grep -E 'xlite|xray' | tail -n 60") };
          		}
          	}
          };

          return { xlite: methods };
          XLITE_FILE_5
          mkdir -p "$(dirname "src/usr/share/ucode/xlite/lib.uc")"
          cat > "src/usr/share/ucode/xlite/lib.uc" <<'XLITE_FILE_6'
          // XLite: share links -> xray outbounds, xray config and the nftables tproxy ruleset.
          'use strict';

          const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

          function b64decode(s) {
          	if (s == null)
          		return null;
          	s = replace(replace(trim('' + s), /-/g, '+'), /_/g, '/');
          	s = replace(s, /[^A-Za-z0-9+\/]/g, '');
          	if (type(b64dec) == 'function') {
          		let pad = s;
          		while (length(pad) % 4)
          			pad += '=';
          		let r = b64dec(pad);
          		if (r != null)
          			return r;
          	}
          	let out = '', bits = 0, nb = 0;
          	for (let i = 0; i < length(s); i++) {
          		let v = index(B64, substr(s, i, 1));
          		if (v < 0)
          			return null;
          		bits = ((bits << 6) | v) & 0xffffff;
          		nb += 6;
          		if (nb >= 8) {
          			nb -= 8;
          			out += chr((bits >> nb) & 0xff);
          		}
          	}
          	return out;
          }

          function urldecode(s) {
          	if (s == null)
          		return null;
          	return replace('' + s, /%([0-9A-Fa-f]{2})/g, (m, h) => chr(hex(h)));
          }

          function parse_query(q) {
          	let r = {};
          	for (let kv in split(q ?? '', '&')) {
          		if (kv == '')
          			continue;
          		let i = index(kv, '=');
          		let k = urldecode(i < 0 ? kv : substr(kv, 0, i));
          		r[k] = (i < 0) ? '' : urldecode(substr(kv, i + 1));
          	}
          	return r;
          }

          // scheme://userinfo@host:port?query#fragment  (host may be [v6])
          function parse_url(link) {
          	let m = match(link, /^([A-Za-z0-9+.-]+):\/\/([^#]*)(#(.*))?$/);
          	if (!m)
          		return null;
          	let rest = m[2], frag = urldecode(m[4] ?? '');
          	let q = '', qi = index(rest, '?');
          	if (qi >= 0) {
          		q = substr(rest, qi + 1);
          		rest = substr(rest, 0, qi);
          	}
          	rest = replace(rest, /\/+$/, '');
          	let user = null, at = rindex(rest, '@');
          	if (at >= 0) {
          		user = urldecode(substr(rest, 0, at));
          		rest = substr(rest, at + 1);
          	}
          	let host, port;
          	let hm = match(rest, /^\[([0-9A-Fa-f:.]+)\]:([0-9]+)$/) || match(rest, /^([^:]+):([0-9]+)$/);
          	if (hm) {
          		host = hm[1];
          		port = +hm[2];
          	}
          	else {
          		host = rest;
          		port = null;
          	}
          	return { scheme: lc(m[1]), user, host, port, query: parse_query(q), name: frag };
          }

          function csv(s) {
          	return filter(map(split(s ?? '', ','), (x) => trim(x)), (x) => x != '');
          }

          // One server = the fields of a share link, the same names v2rayA uses.
          function wg_obj(name, host, port, priv, pub, addr, reserved, mtu, psk) {
          	let res = filter(map(split(reserved ?? '', ','), (x) => trim(x)), (x) => x != '');
          	return {
          		protocol: 'wireguard', name: name ?? '', address: host, port: +port, secret: trim(priv), pubkey: trim(pub),
          		local: csv(addr), reserved: length(res) == 3 ? map(res, (x) => +x) : null, mtu: +(mtu || 0) || 1280,
          		psk: trim(psk ?? ''), net: 'udp', security: 'none'
          	};
          }

          // a wg-quick .conf pasted as is
          function wg_conf(text) {
          	let sec = '', i = {}, p = {};
          	for (let l in split(text, /\r?\n/)) {
          		l = trim(replace(l, /#.*$/, ''));
          		let m = match(l, /^\[(.+)\]$/);
          		if (m) { sec = lc(m[1]); continue; }
          		m = match(l, /^([A-Za-z]+) *= *(.+)$/);
          		if (!m) continue;
          		let k = lc(m[1]);
          		if (sec == 'interface') i[k] = (i[k] ? i[k] + ',' : '') + trim(m[2]);
          		else if (sec == 'peer' && p[k] == null) p[k] = trim(m[2]);
          	}
          	let ep = match(p.endpoint ?? '', /^\[(.*)\]:([0-9]+)$/) || match(p.endpoint ?? '', /^([^:]+):([0-9]+)$/);
          	if (!i.privatekey || !p.publickey || !ep)
          		return { error: 'ملف wireguard ناقص (PrivateKey و PublicKey و Endpoint)' };
          	return wg_obj('', ep[1], ep[2], i.privatekey, p.publickey, i.address, '', i.mtu, p.presharedkey);
          }

          function wg_link(s) {
          	let enc = (x) => replace(replace(replace(x, /%/g, '%25'), /\+/g, '%2B'), /\//g, '%2F');
          	let h = (index(s.address, ':') >= 0) ? '[' + s.address + ']' : s.address;
          	let q = 'publickey=' + enc(s.pubkey) + '&address=' + enc(join(',', s.local)) + '&mtu=' + s.mtu;
          	if (s.reserved) q += '&reserved=' + join(',', s.reserved);
          	if (s.psk) q += '&presharedkey=' + enc(s.psk);
          	return 'wireguard://' + enc(s.secret) + '@' + h + ':' + s.port + '?' + q + '#' + enc(s.name || s.address);
          }

          function parse_link(link) {
          	link = trim('' + (link ?? ''));
          	let scheme = lc(match(link, /^([A-Za-z0-9+.-]+):\/\//)?.[1] ?? '');
          	let s;

          	if (scheme == 'vmess') {
          		let j = null;
          		try { j = json(b64decode(substr(link, 8))); } catch (e) { j = null; }
          		if (type(j) != 'object')
          			return { error: 'رابط vmess غير صالح' };
          		s = {
          			protocol: 'vmess', name: j.ps ?? '', address: j.add ?? '', port: +(j.port ?? 0),
          			id: j.id ?? '', aid: +(j.aid ?? 0), scy: j.scy ?? 'auto', net: j.net || 'tcp',
          			type: j.type || 'none', host: j.host ?? '', path: j.path ?? '',
          			security: (j.tls == 'tls' || j.tls == 'reality') ? j.tls : 'none',
          			sni: j.sni ?? '', alpn: j.alpn ?? '', fp: j.fp ?? ''
          		};
          	}
          	else if (scheme == 'vless' || scheme == 'trojan') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'الرابط ناقص: لازم يكون ' + scheme + '://...@العنوان:البورت' };
          		let q = u.query;
          		s = {
          			protocol: scheme, name: u.name ?? '', address: u.host, port: u.port,
          			id: u.user ?? '', net: q.type || 'tcp', type: q.headerType || 'none',
          			host: q.host ?? '', path: q.path ?? '', security: q.security || (scheme == 'trojan' ? 'tls' : 'none'),
          			sni: q.sni ?? q.peer ?? '', alpn: q.alpn ?? '', fp: q.fp ?? '', pbk: q.pbk ?? '', sid: q.sid ?? '',
          			spx: q.spx ?? '', flow: q.flow ?? '', mode: q.mode ?? '', service: q.serviceName ?? '',
          			insecure: (q.allowInsecure == '1' || q.allowInsecure == 'true' || q.insecure == '1')
          		};
          		if (s.net == 'grpc' && s.service != '')
          			s.path = s.service;
          	}
          	else if (scheme == 'ss') {
          		let u = parse_url(link), method, pass, host, port;
          		if (u && u.user != null && u.port) {
          			let ui = u.user;
          			if (index(ui, ':') < 0)
          				ui = b64decode(ui) ?? '';
          			let c = index(ui, ':');
          			method = substr(ui, 0, c); pass = substr(ui, c + 1);
          			host = u.host; port = u.port;
          		}
          		else {
          			let m = match(link, /^ss:\/\/([^#@?]+)(#(.*))?$/);
          			let d = m ? b64decode(m[1]) : null;
          			let mm = d ? match(d, /^([^:]+):(.*)@([^@]+):([0-9]+)$/) : null;
          			if (!mm)
          				return { error: 'رابط shadowsocks غير صالح' };
          			method = mm[1]; pass = mm[2]; host = replace(mm[3], /^\[|\]$/g, ''); port = +mm[4];
          			u = { name: urldecode(m[3] ?? '') };
          		}
          		s = { protocol: 'shadowsocks', name: u.name ?? '', address: host, port, method, password: pass, net: 'tcp', security: 'none' };
          	}
          	else if (scheme == 'wireguard' || scheme == 'wg') {
          		let u = parse_url(link);
          		if (!u || !u.port || !u.user)
          			return { error: 'رابط wireguard ناقص' };
          		let q = u.query;
          		s = wg_obj(u.name, u.host, u.port, u.user, q.publickey ?? q.publicKey ?? q.peer_public_key ?? '',
          			q.address ?? q.ip ?? '', q.reserved ?? '', q.mtu ?? '', q.presharedkey ?? q.psk ?? '');
          	}
          	else if (scheme == 'socks' || scheme == 'socks5' || scheme == 'http' || scheme == 'https') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'رابط ' + scheme + ' ناقص' };
          		let user = u.user, pass = null;
          		if (user != null && index(user, ':') < 0 && scheme != 'http' && scheme != 'https') {
          			let d = b64decode(user);
          			if (d && index(d, ':') > 0)
          				user = d;
          		}
          		if (user != null && index(user, ':') >= 0) {
          			pass = substr(user, index(user, ':') + 1);
          			user = substr(user, 0, index(user, ':'));
          		}
          		s = { protocol: (scheme == 'socks5') ? 'socks' : (scheme == 'https' ? 'http' : scheme), name: u.name ?? '',
          			address: u.host, port: u.port, user, pass, net: 'tcp', security: (scheme == 'https') ? 'tls' : 'none' };
          	}
          	else if (index(link, '[Interface]') >= 0)
          		s = wg_conf(link);
          	else
          		return { error: 'نوع الرابط غير مدعوم (المدعوم: vless و vmess و trojan و ss و wireguard و socks و http)' };
          	if (s.error)
          		return s;

          	if (lc(s.net) == 'raw')
          		s.net = 'tcp';
          	// Xray 25 removed these transports: the core would refuse the whole config and never start
          	if (index([ 'h2', 'http', 'quic' ], lc(s.net ?? '')) >= 0)
          		return { error: 'النقل ' + s.net + ' انشال من نواة Xray 25: السيرفر لازم يستخدم xhttp أو ws أو grpc أو tcp' };
          	if (!s.address || !(s.port > 0 && s.port < 65536))
          		return { error: 'الرابط ما بيه عنوان أو بورت صحيح' };
          	if (s.name == '')
          		s.name = s.address;
          	s.link = (s.protocol == 'wireguard' && index(link, '[Interface]') >= 0) ? wg_link(s) : link;
          	return s;
          }

          const UA = [
          	'Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.75 Safari/537.36',
          	'Mozilla/5.0 (iPhone; CPU iPhone OS 10_0_2 like Mac OS X) AppleWebKit/601.1 (KHTML, like Gecko) CriOS/53.0.2785.109 Mobile/14A456 Safari/601.1.46'
          ];

          function stream_settings(s, opt) {
          	let net = lc(s.net ?? 'tcp');
          	let ss = { network: net, security: s.security ?? 'none' };

          	if (net == 'tcp' && lc(s.type ?? '') == 'http') {
          		// the same request/response header v2rayA sends (the server checks the path)
          		let paths = map(csv(s.path), (p) => (substr(p, 0, 1) == '/') ? p : '/' + p);
          		ss.tcpSettings = { header: {
          			type: 'http',
          			request: {
          				version: '1.1', method: 'GET', path: length(paths) ? paths : [ '/' ],
          				headers: {
          					Host: csv(s.host),
          					'User-Agent': UA,
          					'Accept-Encoding': [ 'gzip, deflate' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			},
          			response: {
          				version: '1.1', status: '200', reason: 'OK',
          				headers: {
          					'Content-Type': [ 'application/octet-stream', 'video/mpeg' ],
          					'Transfer-Encoding': [ 'chunked' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			}
          		} };
          	}
          	else if (net == 'ws')
          		ss.wsSettings = { path: s.path || '/', headers: (s.host ? { Host: s.host } : {}) };
          	else if (net == 'grpc')
          		ss.grpcSettings = { serviceName: s.path || '', multiMode: (s.mode == 'multi') };
          	else if (net == 'httpupgrade')
          		ss.httpupgradeSettings = { path: s.path || '/', host: s.host ?? '' };
          	else if (net == 'xhttp' || net == 'splithttp')
          		ss.xhttpSettings = { path: s.path || '/', host: s.host ?? '', mode: s.mode || 'auto' };
          	else if (net == 'h2' || net == 'http')
          		ss.httpSettings = { path: s.path || '/', host: csv(s.host) };

          	if (ss.security == 'tls') {
          		ss.tlsSettings = { serverName: s.sni || s.host || s.domain || s.address, allowInsecure: !!s.insecure };
          		if (s.alpn)
          			ss.tlsSettings.alpn = csv(s.alpn);
          		if (s.fp)
          			ss.tlsSettings.fingerprint = s.fp;
          	}
          	else if (ss.security == 'reality')
          		ss.realitySettings = {
          			serverName: s.sni || s.domain || '', fingerprint: s.fp || 'chrome',
          			publicKey: s.pbk ?? '', shortId: s.sid ?? '', spiderX: s.spx ?? ''
          		};
          	else
          		ss.security = 'none';

          	ss.sockopt = { mark: 128 };
          	if (opt.tfo == 'on')
          		ss.sockopt.tcpFastOpen = true;
          	else if (opt.tfo == 'off')
          		ss.sockopt.tcpFastOpen = false;
          	return ss;
          }

          // s.ip: the address already resolved by the caller (a domain would need DNS, and DNS itself goes
          // through the proxy: the outbound always gets an IP)
          function outbound(s, opt, tag) {
          	opt ??= {};
          	let addr = s.ip || s.address;
          	let o = { tag: tag ?? 'proxy', protocol: s.protocol };
          	if (addr != s.address)
          		s = { ...s, domain: s.address };

          	if (s.protocol == 'vless')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, encryption: 'none', flow: s.flow ?? '' } ] } ] };
          	else if (s.protocol == 'vmess')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, alterId: +(s.aid ?? 0), security: s.scy || 'auto' } ] } ] };
          	else if (s.protocol == 'trojan')
          		o.settings = { servers: [ { address: addr, port: +s.port, password: s.id } ] };
          	else if (s.protocol == 'shadowsocks')
          		o.settings = { servers: [ { address: addr, port: +s.port, method: s.method, password: s.password } ] };
          	else if (s.protocol == 'socks' || s.protocol == 'http') {
          		let srv = { address: addr, port: +s.port };
          		if (s.user != null)
          			srv.users = [ { user: s.user, pass: s.pass ?? '' } ];
          		o.settings = { servers: [ srv ] };
          	}
          	else if (s.protocol == 'wireguard') {
          		o.settings = {
          			secretKey: s.secret, address: length(s.local) ? s.local : [ '10.0.0.2/32' ], mtu: +s.mtu || 1280,
          			peers: [ { publicKey: s.pubkey, endpoint: ((index(addr, ':') >= 0) ? '[' + addr + ']' : addr) + ':' + s.port,
          				allowedIPs: [ '0.0.0.0/0', '::/0' ] } ]
          		};
          		if (s.psk)
          			o.settings.peers[0].preSharedKey = s.psk;
          		if (s.reserved)
          			o.settings.reserved = s.reserved;
          		// the core's own WireGuard stack: "kernel TUN" makes a real interface that fights the router's rules
          		o.settings.noKernelTun = true;
          		o.settings.domainStrategy = 'ForceIP';
          		o.streamSettings = { sockopt: { mark: 128 } };
          		return o;
          	}

          	o.streamSettings = stream_settings(s, opt);
          	if (opt.mux && !s.flow && s.protocol != 'socks' && s.protocol != 'http')
          		o.mux = { enabled: true, concurrency: +(opt.mux_conc ?? 8) };
          	return o;
          }

          export const PRIVATE4 = [
          	'0.0.0.0/8', '10.0.0.0/8', '100.64.0.0/10', '127.0.0.0/8', '169.254.0.0/16', '172.16.0.0/12',
          	'192.0.0.0/24', '192.0.2.0/24', '192.88.99.0/24', '192.168.0.0/16', '198.18.0.0/15',
          	'198.51.100.0/24', '203.0.113.0/24', '224.0.0.0/4', '240.0.0.0/4'
          ];
          export const PRIVATE6 = [ '::/127', '::ffff:0:0/96', '64:ff9b::/96', '100::/64', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];
          const XPRIVATE = [ ...PRIVATE4, '::1/128', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];
          const FAKE_POOL = '198.18.0.0/15';
          function no_fake(list) { return filter(list, (x) => x != FAKE_POOL); }

          // a real IPv4 / IPv6 address (cidr: a prefix may follow): typed values must not break nft or the core
          function ip4_ok(x, cidr) {
          	let m = match(x ?? '', /^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})(\/([0-9]{1,2}))?$/);
          	if (!m || (m[5] && !cidr))
          		return false;
          	for (let i = 1; i <= 4; i++)
          		if (+m[i] > 255)
          			return false;
          	return !m[5] || +m[6] <= 32;
          }

          function ip6_ok(x, cidr) {
          	let m = match(x ?? '', /^([0-9A-Fa-f:.]+)(\/([0-9]{1,3}))?$/);
          	if (!m || index(m[1], ':') < 0 || (m[2] && !cidr) || length(m[1]) > 45 || (m[2] && +m[3] > 128))
          		return false;
          	let g = split(m[1], ':');
          	if (length(g) < 3 || length(g) > 8 || length(split(m[1], '::')) > 2)
          		return false;
          	for (let x in g)
          		if (length(x) > 4 && index(x, '.') < 0)
          			return false;
          	return true;
          }

          // "8080,5060": 1 to 10 ports, each 1-65535
          function ports_ok(s) {
          	let l = split(s ?? '', ',');
          	if (!length(l) || length(l) > 10)
          		return false;
          	for (let p in l)
          		if (!match(p, /^[0-9]{1,5}$/) || +p < 1 || +p > 65535)
          			return false;
          	return true;
          }

          // the DNS servers the core asks (AdGuard when its ad blocking is on), plain addresses only
          function dns_upstreams(opt) {
          	if (opt.adblock == 'adguard' || opt.adblock == 'both')
          		return [ '94.140.14.14', '94.140.15.15' ];
          	return filter(map(split(opt.dns_upstream || '1.1.1.1', /[ ,]+/), (x) => trim(x)), (x) => ip4_ok(x) || ip6_ok(x));
          }

          // an IPv6 address inside a URL needs brackets
          function url_host(x) { return index(x, ':') >= 0 ? '[' + x + ']' : x; }

          // web / social / pictures: many small connections, so one multiplexed channel saves a handshake each
          // (videos and downloads keep their own connection and the zero-copy download)
          const SMART_MUX = [
          	'domain:facebook.com', 'domain:fbcdn.net', 'domain:fbsbx.com', 'domain:instagram.com', 'domain:cdninstagram.com',
          	'domain:whatsapp.net', 'domain:whatsapp.com', 'domain:tiktok.com', 'domain:tiktokcdn.com', 'domain:tiktokv.com',
          	'domain:ibyteimg.com', 'domain:byteoversea.com', 'domain:muscdn.com', 'domain:twitter.com', 'domain:x.com', 'domain:twimg.com',
          	'domain:snapchat.com', 'domain:sc-cdn.net', 'domain:snapkit.com', 'domain:telegram.org', 'domain:t.me',
          	'domain:ytimg.com', 'domain:ggpht.com', 'domain:gstatic.com', 'domain:googleapis.com', 'domain:google.com',
          	'domain:youtube.com', 'domain:googleusercontent.com', 'domain:wikipedia.org', 'domain:wikimedia.org',
          	'domain:reddit.com', 'domain:redd.it', 'domain:redditmedia.com', 'domain:pinimg.com', 'domain:pinterest.com',
          	'domain:discord.com', 'domain:discordapp.com', 'domain:linkedin.com', 'domain:licdn.com', 'domain:cloudflare.com'
          ];
          export const DNS_PORT = 15353;
          export const SOCKS2_PORT = 20179;

          // RoutingA (the v2rayA rule language), the parts that make sense on a router:
          //   default: proxy                      outbound for everything else
          //   domain(geosite:cn, domain:x.com)->direct
          //   ip(geoip:private, 1.2.3.0/24)->direct
          //   port(80,443)->proxy    network(udp)->block    source(192.168.1.5)->direct
          // outbounds: proxy, proxy2 (the second server), direct, block
          function routinga(text) {
          	let rules = [], def = null, errs = [];
          	let n = 0;
          	for (let l in split(text ?? '', /\r?\n/)) {
          		n++;
          		l = trim(replace(l, /#.*$/, ''));
          		if (l == '')
          			continue;
          		let m = match(l, /^default *: *([A-Za-z0-9_]+)$/);
          		if (m) { def = m[1]; continue; }
          		m = match(l, /^([a-z]+) *\((.*)\) *-> *([A-Za-z0-9_]+)$/);
          		if (!m) { push(errs, n); continue; }
          		let vals = filter(map(split(m[2], ','), (x) => trim(replace(x, /^["']|["']$/g, ''))), (x) => x != '');
          		let r = { type: 'field' }, ob = m[3];
          		if (m[1] == 'domain') r.domain = vals;
          		else if (m[1] == 'ip') r.ip = vals;
          		else if (m[1] == 'port') r.port = join(',', vals);
          		else if (m[1] == 'network') r.network = join(',', vals);
          		else if (m[1] == 'source' || m[1] == 'sip') r.source = vals;
          		else { push(errs, n); continue; }
          		if (index([ 'proxy', 'proxy2', 'direct', 'block' ], ob) < 0) { push(errs, n); continue; }
          		r.outboundTag = ob;
          		push(rules, r);
          	}
          	return { rules, def, errs };
          }

          // opt: uci "main"; ctx: {
          //   port, ipv6, main: server (+ .ip), second: server or null, second_kernel: bool, second_ok: [rules],
          //   iso_domains: [], r2_domains: [], r2_ip: [], gfw: [domains], geo: bool (geoip.dat/geosite.dat present) }
          function xray_config(opt, ctx) {
          	let share = (opt.port_sharing == '1');
          	let inb = [];
          	let mode = opt.transparent ?? 'all';
          	// bonded lines: no Smart Mux, its one shared connection would keep that traffic on one line
          	let smart = (opt.smart_mux == '1' && opt.mux != '1' && ctx.main && !ctx.main.flow && !length(ctx.bond ?? []));
          	let need_domains = (opt.learn_log == '1') || (length(ctx.iso_domains ?? []) && opt.iso_sniff != '0') || length(ctx.r2_domains ?? []) || mode == 'gfwlist' || mode == 'routinga' || mode == 'same' || smart;
          	let fake = (opt.special == 'fakedns');
          	let dest = null;
          	if (opt.sniffing == 'http_tls') dest = [ 'http', 'tls' ];
          	else if (opt.sniffing == 'http_tls_quic') dest = [ 'http', 'tls', 'quic' ];
          	else if (need_domains) dest = [ 'http', 'tls', 'quic' ];
          	if (opt.special == 'supervisor')
          		dest ??= [ 'http', 'tls' ];
          	if (opt.special == 'fakedns')
          		dest = [ ...(dest ?? [ 'http', 'tls' ]), 'fakedns' ];
          	// FakeDNS: the core must connect to the real name, so the sniffed name replaces the address
          	let sniff = dest ? { enabled: true, destOverride: dest, routeOnly: !fake } : { enabled: false };

          	if (mode != 'off') {
          		let tp = { tproxy: opt.impl == 'redirect' ? 'redirect' : 'tproxy' };
          		push(inb, { tag: 'transparent', listen: (share || opt.impl == 'redirect') ? '0.0.0.0' : '127.0.0.1', port: +ctx.port, protocol: 'dokodemo-door',
          			settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          		if (ctx.ipv6)
          			push(inb, { tag: 'transparent6', listen: '::1', port: +ctx.port, protocol: 'dokodemo-door',
          				settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          	}
          	if (+opt.socks_port > 0)
          		push(inb, { tag: 'socks', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_port, protocol: 'socks', settings: { udp: true }, sniffing: sniff });
          	if (+opt.http_port > 0)
          		push(inb, { tag: 'http', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_port, protocol: 'http', sniffing: sniff });
          	if (+opt.socks_rule_port > 0)
          		push(inb, { tag: 'socks-rule', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_rule_port, protocol: 'socks', settings: { udp: true }, sniffing: sniff.enabled ? sniff : { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true } });
          	if (+opt.http_rule_port > 0)
          		push(inb, { tag: 'http-rule', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_rule_port, protocol: 'http', sniffing: sniff.enabled ? sniff : { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true } });
          	// the router's own way out through the second server (exit IP check, ping)
          	if (ctx.second)
          		push(inb, { tag: 'socks2', listen: '127.0.0.1', port: SOCKS2_PORT, protocol: 'socks', settings: { udp: false } });

          	let dnsmode = opt.antipollution ?? 'none';
          	// ad blocking with AdGuard DNS: the upstream is theirs (it answers 0.0.0.0 for ad domains)
          	let dnsup = dns_upstreams(opt);
          	if (!length(dnsup))
          		dnsup = [ '1.1.1.1' ];
          	let xdns = null;
          	if (dnsmode == 'forward' && opt.special != 'fakedns')
          		push(inb, { tag: 'dns-in', listen: '127.0.0.1', port: DNS_PORT, protocol: 'dokodemo-door',
          			settings: { address: dnsup[0] ?? '1.1.1.1', port: 53, network: 'tcp,udp' } });
          	else if (dnsmode == 'doh' || dnsmode == 'hijack' || opt.special == 'fakedns') {
          		push(inb, { tag: 'dns-in', listen: '127.0.0.1', port: DNS_PORT, protocol: 'dokodemo-door',
          			settings: { address: dnsup[0] ?? '1.1.1.1', port: 53, network: 'tcp,udp' } });
          		// hijack: "Prevent DNS Hijack Only": DoH straight from the router (fast, not through the server)
          		let up = (dnsmode == 'doh') ? map(dnsup, (x) => 'https://' + url_host(x) + '/dns-query')
          			: (dnsmode == 'hijack') ? map(dnsup, (x) => 'https+local://' + url_host(x) + '/dns-query') : map(dnsup, (x) => 'tcp://' + url_host(x));
          		xdns = { servers: (opt.special == 'fakedns') ? [ 'fakedns', ...up ] : up, queryStrategy: ctx.ipv6 ? 'UseIP' : 'UseIPv4', tag: 'dns-internal' };
          	}

          	let mux = (opt.mux == '1');
          	let ob = [ outbound(ctx.main, { tfo: opt.tfo, mux, mux_conc: opt.mux_conc }, 'proxy') ];
          	if (smart)
          		push(ob, outbound(ctx.main, { tfo: opt.tfo, mux: true, mux_conc: opt.mux_conc || 8 }, 'proxy-mux'));
          	// FakeDNS: a direct connection gets a name, not an address. Without a strategy the core would ask
          	// the system (dnsmasq -> the core's own FakeDNS) and connect to a fake 198.18.x address
          	let fset = fake ? { domainStrategy: ctx.ipv6 ? 'UseIP' : 'UseIPv4' } : null;
          	if (ctx.second) {
          		if (ctx.second_kernel)
          			push(ob, { tag: 'proxy2', protocol: 'freedom', ...(fset ? { settings: fset } : {}), streamSettings: { sockopt: { mark: 0x180, interface: 'xlwg' } } });
          		else
          			push(ob, outbound(ctx.second, { tfo: opt.tfo, mux: false }, 'proxy2'));
          	}
          	push(ob, { tag: 'direct', protocol: 'freedom', ...(fset ? { settings: fset } : {}), streamSettings: { sockopt: { mark: 128 } } });
          	push(ob, { tag: 'block', protocol: 'blackhole' });
          	// the core answers A / AAAA itself; every other question (HTTPS, SRV, TXT, MX, PTR) goes on to the
          	// upstream (the default "drop" leaves it without an answer): through the server, or straight from the
          	// router for "Prevent DNS Hijack Only"
          	if (xdns)
          		push(ob, { tag: 'dns-out', protocol: 'dns', settings: { nonIPQuery: 'skip' },
          			streamSettings: { sockopt: (dnsmode == 'hijack') ? { mark: 128 } : { dialerProxy: 'proxy' } } });

          	let rules = [];
          	if (xdns)
          		push(rules, { type: 'field', inboundTag: [ 'dns-in' ], outboundTag: 'dns-out' });
          	else if (dnsmode == 'forward')
          		push(rules, { type: 'field', inboundTag: [ 'dns-in' ], outboundTag: 'proxy' });
          	if (ctx.second)
          		push(rules, { type: 'field', inboundTag: [ 'socks2' ], outboundTag: 'proxy2' });
          	push(rules, { type: 'field', ip: fake ? no_fake(XPRIVATE) : XPRIVATE, outboundTag: 'direct' });
          	if (length(ctx.iso_domains ?? []))
          		push(rules, { type: 'field', domain: ctx.iso_domains, outboundTag: 'direct' });

          	let balancers = null, observatory = null, c_burst = null;
          	if (ctx.second) {
          		let fb = opt.r2_fallback ?? 'main';
          		let target = { outboundTag: 'proxy2' };
          		if (fb == 'main' || fb == 'direct') {
          			balancers = [ { tag: 'b2', selector: [ 'proxy2' ], strategy: { type: 'random' }, fallbackTag: (fb == 'main') ? 'proxy' : 'direct' } ];
          			observatory = { subjectSelector: [ 'proxy2' ], probeUrl: opt.r2_probe || 'https://www.google.com/generate_204', probeInterval: (+opt.r2_probe_interval || 30) + 's', enableConcurrency: false };
          			target = { balancerTag: 'b2' };
          		}
          		// devices set to "everything through the second server" (by their address; kernel WireGuard: by MAC in nft)
          		if (length(ctx.warp_src ?? []) && !ctx.dev_warp_kernel)
          			push(rules, { type: 'field', source: ctx.warp_src, ...target });
          		if (length(ctx.main_domains ?? []))
          			push(rules, { type: 'field', domain: ctx.main_domains, outboundTag: 'proxy' });
          		if (ctx.main_ports)
          			push(rules, { type: 'field', port: ctx.main_ports, network: 'tcp', outboundTag: 'proxy' });
          		if (length(ctx.r2_domains ?? []))
          			push(rules, { type: 'field', domain: ctx.r2_domains, ...target });
          		if (length(ctx.r2_ip ?? []))
          			push(rules, { type: 'field', ip: ctx.r2_ip, ...target });
          	}

          	// QUIC (UDP 443) through a TCP tunnel is slow: it is refused in nft (fast fallback to TCP);
          	// this rule is the same for traffic that only the core sees (socks / http ports)
          	if (opt.block_quic == '1')
          		push(rules, { type: 'field', network: 'udp', port: '443', outboundTag: 'block' });
          	// v2rayA's two routings: the transparent proxy, and the "rule" ports (socks/http with traffic splitting).
          	//   transparent: off | all | except_cn | gfwlist | routinga | same (= the rule port mode)
          	//   rule_mode:   except_cn | gfwlist | routinga
          	let rmode = opt.rule_mode ?? 'gfwlist';
          	let tmode = (mode == 'same') ? rmode : mode;
          	let groups = [];
          	if (tmode != 'off')
          		push(groups, [ ctx.ipv6 ? [ 'transparent', 'transparent6' ] : [ 'transparent' ], tmode ]);
          	let rtags = [];
          	if (+opt.socks_rule_port > 0) push(rtags, 'socks-rule');
          	if (+opt.http_rule_port > 0) push(rtags, 'http-rule');
          	if (length(rtags))
          		push(groups, [ rtags, rmode ]);
          	let ptags = [];
          	if (+opt.socks_port > 0) push(ptags, 'socks');
          	if (+opt.http_port > 0) push(ptags, 'http');
          	if (length(ptags))
          		push(groups, [ ptags, 'all' ]);
          	for (let g in groups) {
          		let tags = g[0], gm = g[1], last = 'proxy', mr = [];
          		if (gm == 'gfwlist') {
          			if (length(ctx.gfw ?? []))
          				push(mr, { type: 'field', domain: ctx.gfw, outboundTag: 'proxy' });
          			last = 'direct';
          		}
          		else if (gm == 'except_cn') {
          			if (ctx.geo)
          				push(mr, { type: 'field', domain: [ 'geosite:cn' ], outboundTag: 'direct' }, { type: 'field', ip: [ 'geoip:cn' ], outboundTag: 'direct' });
          			else if (length(ctx.cn4 ?? []))
          				push(mr, { type: 'field', ip: ctx.cn4, outboundTag: 'direct' });
          		}
          		else if (gm == 'routinga') {
          			let ra = routinga(opt.routinga);
          			for (let r in ra.rules) {
          				if (r.outboundTag == 'proxy2' && !ctx.second)
          					continue;
          				// geosite / geoip need the .dat files; without them only geoip:private is understood
          				if (!ctx.geo) {
          					for (let k in [ 'domain', 'ip' ]) {
          						if (!r[k])
          							continue;
          						let v = [];
          						for (let x in r[k])
          							if (x == 'geoip:private') push(v, ...XPRIVATE);
          							else if (!match(x, /^geo(site|ip):/)) push(v, x);
          						r[k] = v;
          					}
          					if ((r.domain && !length(r.domain)) || (r.ip && !length(r.ip)))
          						continue;
          				}
          				push(mr, r);
          			}
          			if (ra.def && (ra.def != 'proxy2' || ctx.second))
          				last = ra.def;
          		}
          		for (let r in mr)
          			push(rules, { ...r, inboundTag: tags });
          		if (smart && last == 'proxy')
          			push(rules, { type: 'field', inboundTag: tags, domain: SMART_MUX, network: 'tcp', outboundTag: 'proxy-mux' });
          		push(rules, { type: 'field', inboundTag: tags, outboundTag: last });
          	}
          	push(rules, { type: 'field', network: 'tcp,udp', outboundTag: 'proxy' });

          	// line bonding: one copy of the main server per line; connections take turns over the lines
          	// (a line that stops answering the probe is skipped; all down: the main route)
          	if (length(ctx.bond ?? [])) {
          		for (let i, d in ctx.bond) {
          			let b = outbound(ctx.main, { tfo: opt.tfo, mux, mux_conc: opt.mux_conc }, 'bond' + i);
          			b.streamSettings.sockopt.interface = d;
          			push(ob, b);
          		}
          		for (let r in rules)
          			if (r.outboundTag == 'proxy') { delete r.outboundTag; r.balancerTag = 'bond'; }
          		// rr: turns over every line; fast: the faster lines (by measured delay), the slowest is left out;
          		// backup: the first line only, the next one while it is down
          		let mode = opt.bond_mode ?? 'rr', n = length(ctx.bond), auto = (opt.bond_auto != '0');
          		let bal = { tag: 'bond', selector: [ 'bond' ], strategy: { type: 'roundRobin' }, fallbackTag: 'proxy' };
          		if (mode == 'fast') {
          			bal.strategy = { type: 'leastLoad', settings: { expected: (n > 2) ? n - 1 : n, tolerance: 0.2 } };
          			c_burst = { subjectSelector: [ 'bond' ], pingConfig: { destination: 'https://www.google.com/generate_204', interval: '30s', sampling: 3, timeout: '5s' } };
          		}
          		else if (mode == 'backup') {
          			bal.selector = [ 'bond0' ];
          			bal.fallbackTag = 'bond1';
          		}
          		// without the probe the core has no line health: roundRobin needs it, random does not
          		// (a fallback needs it too)
          		if (mode == 'rr' && !auto) {
          			bal.strategy = { type: 'random' };
          			delete bal.fallbackTag;
          		}
          		balancers ??= [];
          		push(balancers, bal);
          		// a line that stops answering the probe is skipped (switch off: every line is used whatever happens)
          		if (auto || mode == 'backup') {
          			observatory ??= { subjectSelector: [], probeUrl: 'https://www.google.com/generate_204', probeInterval: '30s', enableConcurrency: false };
          			push(observatory.subjectSelector, mode == 'backup' ? 'bond0' : 'bond');
          		}
          	}

          	let c = {
          		// learning mode: the core says which name each device connects to (read by the monitor, then off)
          		log: (opt.learn_log == '1') ? { loglevel: 'info', error: '/tmp/xlite/core.log', access: 'none' } : { loglevel: opt.loglevel || 'warning', access: 'none' },
          		inbounds: inb,
          		outbounds: ob,
          		routing: { domainStrategy: 'AsIs', rules }
          	};
          	if (balancers) {
          		c.routing.balancers = balancers;
          		if (observatory) c.observatory = observatory;
          	}
          	if (c_burst)
          		c.burstObservatory = c_burst;
          	if (xdns)
          		c.dns = xdns;
          	if (fake)
          		c.fakedns = [ { ipPool: FAKE_POOL, poolSize: 65535 } ];
          	return c;
          }

          function nft_set(name, typ, elems, extra) {
          	let s = `\tset ${name} {\n\t\ttype ${typ}\n\t\tflags interval\n\t\tauto-merge\n`;
          	if (length(elems))
          		s += `\t\telements = { ${join(', ', elems)} }\n`;
          	return s + '\t}\n';
          }

          function q(n) {
          	return '"' + replace(n, /[^A-Za-z0-9._@-]/g, '') + '"';
          }

          function sname(id) {
          	return replace(id, /[^A-Za-z0-9_]/g, '_');
          }

          // ctx: { port, ipv6, wan: [devs], lan: [devs], local4, local6, bypass4, bypass6,
          //        iso: [ { id, ip4: [], ip6: [] } ], r2fast4: [], r2fast6: [] }
          function nft_rules(opt, ctx) {
          	let fam = ctx.ipv6 ? 'meta nfproto { ipv4, ipv6 }' : 'meta nfproto ipv4';
          	let early = (opt.early_exit != '0');
          	let r = 'table inet xlite {\n';
          	r += nft_set('whitelist', 'ipv4_addr', (opt.special == 'fakedns') ? no_fake(PRIVATE4) : PRIVATE4);
          	r += nft_set('whitelist6', 'ipv6_addr', PRIVATE6);
          	r += nft_set('local_ips', 'ipv4_addr', ctx.local4 ?? []);
          	r += nft_set('local_ips6', 'ipv6_addr', ctx.local6 ?? []);
          	r += nft_set('bypass4', 'ipv4_addr', ctx.bypass4 ?? []);
          	r += nft_set('bypass6', 'ipv6_addr', ctx.bypass6 ?? []);
          	r += nft_set('r2fast4', 'ipv4_addr', ctx.r2fast4 ?? []);
          	r += nft_set('r2fast6', 'ipv6_addr', ctx.r2fast6 ?? []);
          	r += nft_set('cn4', 'ipv4_addr', ctx.cn4_nft ? (ctx.cn4 ?? []) : []);
          	for (let a in ctx.iso ?? []) {
          		r += nft_set('iso4_' + sname(a.id), 'ipv4_addr', a.ip4 ?? []);
          		r += nft_set('iso6_' + sname(a.id), 'ipv6_addr', a.ip6 ?? []);
          	}
          	r += '\tset dev_direct {\n\t\ttype ether_addr\n' + (length(ctx.dev_direct ?? []) ? `\t\telements = { ${join(', ', ctx.dev_direct)} }\n` : '') + '\t}\n';
          	r += '\tset dev_warp {\n\t\ttype ether_addr\n' + ((length(ctx.dev_warp ?? []) && ctx.dev_warp_kernel) ? `\t\telements = { ${join(', ', ctx.dev_warp)} }\n` : '') + '\t}\n';
          	// devices kicked from the network (Telegram bot / LuCI)
          	r += '\tset blocked {\n\t\ttype ether_addr\n' + (length(ctx.blocked ?? []) ? `\t\telements = { ${join(', ', ctx.blocked)} }\n` : '') + '\t}\n';
          	// per device traffic (the monitor turns the counters into day / month totals)
          	r += '\tset dev_up {\n\t\ttype ipv4_addr\n\t\tsize 1024\n\t\tflags dynamic\n\t\tcounter\n\t}\n';
          	r += '\tset dev_down {\n\t\ttype ipv4_addr\n\t\tsize 1024\n\t\tflags dynamic\n\t\tcounter\n\t}\n';

          	r += '\tchain tp_out {\n';
          	if (early)
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} return\n`;
          	r += '\t\tmeta mark & 0x80 == 0x80 return\n';
          	// "Prevent DNS Hijack Only": the core's DoH goes straight from the router (it carries no mark)
          	if ((opt.antipollution ?? 'none') == 'hijack') {
          		let up = dns_upstreams(opt), u4 = filter(up, (x) => index(x, ':') < 0), u6 = filter(up, (x) => index(x, ':') >= 0);
          		if (length(u4)) r += `\t\tip daddr { ${join(', ', u4)} } tcp dport 443 return\n`;
          		if (length(u6)) r += `\t\tip6 daddr { ${join(', ', u6)} } tcp dport 443 return\n`;
          	}
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type local fib daddr type != local jump tp_rule\n';
          	r += '\t}\n';

          	r += '\tchain tp_pre {\n';
          	if (early)
          		for (let d in ctx.wan ?? [])
          			r += `\t\tiifname ${q(d)} return\n`;
          	r += '\t\tiifname "lo" mark & 0xc0 != 0x40 return\n';
          	// only the LAN zone goes through the core: a tproxied packet passes the firewall's input chain, where a
          	// zone with input REJECT (a guest network) would refuse it; other zones go out directly
          	if (length(ctx.lan ?? []))
          		r += `\t\tiifname != { "lo", ${join(', ', map(ctx.lan, (d) => q(d)))} } return\n`;
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type != local fib daddr type != local jump tp_rule\n';
          	if (opt.impl != 'redirect') {
          		r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip to 127.0.0.1:${+ctx.port}\n`;
          		if (ctx.ipv6)
          			r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip6 to [::1]:${+ctx.port}\n`;
          	}
          	r += '\t}\n';

          	r += `\tchain output {\n\t\ttype route hook output priority mangle - 5; policy accept;\n\t\t${fam} jump tp_out\n`;
          	if (opt.block_quic == '1')
          		r += '\t\tmeta mark & 0x200 == 0x200 reject\n';
          	r += '\t}\n';
          	// QUIC refused right away, so apps fall back to TCP at once (a dropped packet would make them wait)
          	if (opt.block_quic == '1')
          		r += '\tchain quic {\n\t\ttype filter hook forward priority filter - 5; policy accept;\n\t\tmeta mark & 0x200 == 0x200 reject\n\t}\n';
          	r += `\tchain prerouting {\n\t\ttype filter hook prerouting priority mangle - 5; policy accept;\n\t\t${fam} jump tp_pre\n\t}\n`;
          	r += '\tchain kick {\n\t\ttype filter hook prerouting priority raw; policy accept;\n\t\tether saddr @blocked drop\n\t}\n';
          	r += '\tchain count_up {\n\t\ttype filter hook prerouting priority mangle - 6; policy accept;\n';
          	for (let d in ctx.lan ?? [])
          		r += `\t\tiifname ${q(d)} meta nfproto ipv4 update @dev_up { ip saddr }\n`;
          	r += '\t}\n';
          	r += '\tchain count_down {\n\t\ttype filter hook postrouting priority mangle; policy accept;\n';
          	for (let d in ctx.lan ?? [])
          		r += `\t\toifname ${q(d)} meta nfproto ipv4 update @dev_down { ip daddr }\n`;
          	if (length(ctx.iso ?? []))
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} jump iso_down\n`;
          	r += '\t}\n';
          	// isolated apps: bytes in each direction (the monitor reads these counters)
          	r += '\tchain iso_down {\n';
          	for (let a in ctx.iso ?? [])
          		r += `\t\tip saddr @iso4_${sname(a.id)} counter comment ${q(a.id)}\n\t\tip6 saddr @iso6_${sname(a.id)} counter comment ${q(a.id)}\n`;
          	r += '\t}\n';

          	r += '\tchain tp_rule {\n';
          	r += '\t\tmeta mark set ct mark\n';
          	r += '\t\tmeta mark & 0xc0 == 0x40 return\n';
          	if (opt.dns == 'direct' && (opt.antipollution ?? 'none') == 'none')
          		r += '\t\tmeta l4proto { tcp, udp } th dport 53 return\n';
          	r += '\t\tip daddr @local_ips return\n\t\tip6 daddr @local_ips6 return\n';
          	r += '\t\tip daddr @whitelist return\n\t\tip6 daddr @whitelist6 return\n';
          	r += '\t\tip daddr @bypass4 return\n\t\tip6 daddr @bypass6 return\n';
          	// per device: no VPN at all, or (kernel WireGuard) everything into the tunnel
          	r += '\t\tether saddr @dev_direct return\n';
          	r += '\t\tether saddr @dev_warp meta mark set mark | 0x100 return\n';
          	// voice / video calls stay on the VPN even for an isolated app: a call starts with STUN
          	// (magic cookie 0x2112A442 in every STUN message), the mark stays on the whole connection
          	if (length(ctx.iso ?? []) && opt.iso_calls != '0') {
          		r += '\t\tmeta l4proto udp @th,96,32 0x2112a442 meta mark set mark | 0x400\n';
          		r += '\t\tudp dport { 3478-3481, 5349, 19302-19309 } meta mark set mark | 0x400\n';
          	}
          	r += '\t\tjump iso\n';
          	if (ctx.cn4_nft && length(ctx.cn4 ?? []))
          		r += '\t\tip daddr @cn4 return\n';
          	if (ctx.main_ports)
          		r += `\t\tmeta l4proto tcp th dport { ${ctx.main_ports} } goto tp_mark\n`;
          	if (opt.block_quic == '1' && !ctx.second_kernel)
          		r += '\t\tudp dport 443 meta mark set mark | 0x200 return\n';
          	r += '\t\tip daddr @r2fast4 meta mark set mark | 0x100 return\n';
          	r += '\t\tip6 daddr @r2fast6 meta mark set mark | 0x100 return\n';
          	// with the kernel WireGuard, Iraqi QUIC above keeps working (UDP over WireGuard is fine)
          	if (opt.block_quic == '1' && ctx.second_kernel)
          		r += '\t\tudp dport 443 meta mark set mark | 0x200 return\n';
          	r += '\t\tjump tp_mark\n';
          	r += '\t}\n';
          	r += '\tchain iso {\n';
          	r += '\t\tmeta mark & 0x400 == 0x400 return\n';
          	for (let a in ctx.iso ?? [])
          		r += `\t\tip daddr @iso4_${sname(a.id)} counter accept comment ${q(a.id)}\n\t\tip6 daddr @iso6_${sname(a.id)} counter accept comment ${q(a.id)}\n`;
          	r += '\t}\n';
          	r += '\tchain tp_mark {\n';
          	r += '\t\ttcp flags & (fin | syn | rst | ack) == syn meta mark set mark | 0x40\n';
          	r += '\t\tmeta l4proto udp ct state new meta mark set mark | 0x40\n';
          	r += '\t\tct mark set mark\n';
          	r += '\t}\n';
          	r += '}\n';
          	return r;
          }

          // redirect mode (no tproxy kernel module): TCP only, like v2rayA's "redirect"
          function nft_redirect(opt, ctx) {
          	let r = 'table inet xlite_nat {\n';
          	r += '\tchain prerouting {\n\t\ttype nat hook prerouting priority dstnat - 5; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '\tchain output {\n\t\ttype nat hook output priority -105; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '}\n';
          	return r;
          }

          // subscription body: base64 or plain list of share links
          function parse_subscription(body) {
          	body = trim(body ?? '');
          	if (!match(body, /:\/\//)) {
          		let d = b64decode(replace(body, /\s+/g, ''));
          		if (d && match(d, /:\/\//))
          			body = d;
          	}
          	let r = [];
          	for (let l in split(body, /\r?\n/)) {
          		l = trim(l);
          		if (match(l, /^[a-z0-9]+:\/\//)) {
          			let p = parse_link(l);
          			if (!p.error)
          				push(r, p);
          		}
          	}
          	return r;
          }

          export { parse_link, outbound, xray_config, nft_rules, nft_redirect, routinga, parse_subscription, sname, ip4_ok, ip6_ok, ports_ok };
          XLITE_FILE_6
          mkdir -p "$(dirname "src/usr/share/xlite/bot.uc")"
          cat > "src/usr/share/xlite/bot.uc" <<'XLITE_FILE_7'
          // XLite Telegram bot (runs while XLite is on and the bot is enabled in Settings)
          //   alerts: a server stopped / came back, a new device joined (with Allow / Kick buttons)
          //   daily report: device usage of the day
          //   commands: /status /servers /use N /second N /off /on /devices /ping /help
          // Only the owner's chat is answered: the first chat that sends /start when no chat is saved.
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';

          const TMP = getenv('XLITE_TMP') ?? '/tmp/xlite';
          const RUN = getenv('XLITE_RUN') ?? '/var/etc/xlite';

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function uci() {
          	let c = getenv('XLITE_UCI_DIR') ? cursor(getenv('XLITE_UCI_DIR')) : cursor();
          	c.load('xlite');
          	return c;
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          function fmtb(b) {
          	b = +b || 0;
          	if (b >= 1e9) return sprintf('%.1f GB', b / 1e9);
          	if (b >= 1e6) return sprintf('%.0f MB', b / 1e6);
          	return sprintf('%.0f KB', b / 1e3);
          }

          let token = null;

          // Telegram may be blocked on the line: try through the core first, then direct
          function api(method, body, timeout) {
          	let f = TMP + '/bot-req.json';
          	fs.writefile(f, sprintf('%J', body ?? {}));
          	let socks = +(uci().get('xlite', 'main', 'socks_port') ?? 0);
          	let url = shq('https://api.telegram.org/bot' + token + '/' + method);
          	let t = timeout ?? 15;
          	let base = `curl -s -m ${t + 10} -H 'Content-Type: application/json' -d @${f} `;
          	let out = (socks > 0) ? sh(base + `--socks5-hostname 127.0.0.1:${socks} ${url} 2>/dev/null`) : '';
          	if (out == '')
          		out = sh(base + url + ' 2>/dev/null');
          	try { return json(out); } catch (e) { return null; }
          }

          function send(chat, text, buttons) {
          	let b = { chat_id: chat, text, parse_mode: 'HTML', disable_web_page_preview: true };
          	if (buttons)
          		b.reply_markup = { inline_keyboard: buttons };
          	return api('sendMessage', b);
          }

          function servers(c) {
          	let r = [];
          	c.foreach('xlite', 'server', (s) => push(r, { id: s['.name'], name: s.name ?? '?' }));
          	return r;
          }

          function status_text(c) {
          	let m = c.get_all('xlite', 'main') ?? {};
          	let st = readjson(RUN + '/state.json') ?? {};
          	let mon = readjson(TMP + '/mon.json') ?? {};
          	let on = (m.enabled == '1') && system('nft list table inet xlite > /dev/null 2>&1') == 0;
          	let t = on ? '🟢 <b>متصل</b>\n' : '🔴 <b>مفصول</b>\n';
          	t += 'الرئيسي: ' + (st.name ?? '—');
          	if (mon.health?.main) t += mon.health.main.ok ? ` (${mon.health.main.ms} ms)` : ' (ما يرد)';
          	t += '\n';
          	if (st.second) {
          		t += 'الثاني: ' + st.second.name;
          		if (mon.health?.second) t += mon.health.second.ok ? ` (${mon.health.second.ms} ms)` : ' (واكف)';
          		t += '\n';
          	}
          	let tot = 0;
          	for (let d in mon.devs ?? []) tot += d.today[0] + d.today[1];
          	t += 'استهلاك اليوم: ' + fmtb(tot) + ' · ' + length(mon.devs ?? []) + ' جهاز';
          	return t;
          }

          function devices_text() {
          	let mon = readjson(TMP + '/mon.json') ?? {};
          	let d = sort([ ...(mon.devs ?? []) ], (a, b) => (b.today[0] + b.today[1]) - (a.today[0] + a.today[1]));
          	if (!length(d))
          		return 'ما اكو بيانات بعد';
          	let t = '<b>الأجهزة اليوم</b>\n';
          	for (let x in slice(d, 0, 15))
          		t += `• ${x.name ?? x.ip}: ${fmtb(x.today[0] + x.today[1])}\n`;
          	return t;
          }

          function restart() {
          	system('( /etc/init.d/xlite reload > /dev/null 2>&1 & )');
          }

          function kick(c, mac, on) {
          	mac = lc(mac);
          	if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          		return false;
          	let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          	if (on) push(l, mac);
          	c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          	c.save('xlite');
          	c.commit('xlite');
          	system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          	return true;
          }

          function command(c, chat, text) {
          	let m = match(text, /^\/([a-z]+)(@[A-Za-z0-9_]+)?( +(.*))?$/);
          	if (!m) {
          		send(chat, 'اكتب /help حتى تشوف الأوامر');
          		return;
          	}
          	let cmd = m[1], arg = trim(m[4] ?? '');
          	let list = servers(c);
          	if (cmd == 'start' || cmd == 'help')
          		send(chat, '<b>XLite</b>\n/status الحالة\n/servers السيرفرات\n/use رقم: سيرفر رئيسي\n/second رقم: سيرفر ثاني\n/second off: إطفاء الثاني\n/devices الأجهزة اليوم\n/off و /on: الاتصال');
          	else if (cmd == 'status')
          		send(chat, status_text(c));
          	else if (cmd == 'devices')
          		send(chat, devices_text());
          	else if (cmd == 'servers') {
          		let cur = c.get('xlite', 'main', 'server'), sec = (c.get('xlite', 'main', 'r2') == '1') ? c.get('xlite', 'main', 'server2') : null;
          		let t = '<b>السيرفرات</b>\n';
          		for (let i = 0; i < length(list); i++)
          			t += `${i + 1}. ${list[i].name}${list[i].id == cur ? ' ⭐ الرئيسي' : ''}${list[i].id == sec ? ' 🇮🇶 الثاني' : ''}\n`;
          		send(chat, t + '\n/use رقم أو /second رقم');
          	}
          	else if (cmd == 'use' || cmd == 'second') {
          		if (cmd == 'second' && arg == 'off') {
          			c.set('xlite', 'main', 'r2', '0');
          			c.save('xlite'); c.commit('xlite'); restart();
          			send(chat, 'انطفى السيرفر الثاني');
          			return;
          		}
          		let s = list[+arg - 1];
          		if (!s) { send(chat, 'رقم غلط، شوف /servers'); return; }
          		if (cmd == 'use') {
          			if (c.get('xlite', 'main', 'server2') == s.id) c.set('xlite', 'main', 'server2', c.get('xlite', 'main', 'server'));
          			c.set('xlite', 'main', 'server', s.id);
          		}
          		else {
          			if (c.get('xlite', 'main', 'server') == s.id) { send(chat, 'هذا الرئيسي، اختار غيره'); return; }
          			c.set('xlite', 'main', 'server2', s.id);
          			c.set('xlite', 'main', 'r2', '1');
          		}
          		c.save('xlite'); c.commit('xlite'); restart();
          		send(chat, (cmd == 'use' ? 'الرئيسي صار: ' : 'الثاني صار: ') + s.name);
          	}
          	else if (cmd == 'off' || cmd == 'on') {
          		c.set('xlite', 'main', 'enabled', cmd == 'on' ? '1' : '0');
          		c.save('xlite'); c.commit('xlite');
          		// with XLite off the service keeps only the bot running, so /on still works
          		system('( /etc/init.d/xlite restart > /dev/null 2>&1 & )');
          		send(chat, cmd == 'on' ? 'يتصل…' : 'انفصل. اكتب /on حتى يرجع');
          	}
          	else
          		send(chat, 'ما أعرف هذا الأمر. /help');
          }

          function events(c, chat) {
          	let f = TMP + '/events.jsonl';
          	let t = fs.readfile(f);
          	if (!t)
          		return;
          	fs.unlink(f);
          	let m = c.get_all('xlite', 'main') ?? {};
          	for (let l in split(t, '\n')) {
          		let e = null;
          		try { e = json(l); } catch (x) {}
          		if (!e)
          			continue;
          		if (e.which == 'dns' && m.bot_alert_down != '0')
          			send(chat, '⚠️ DNS النواة ما يرد: رجعت DNS العادي حتى ما ينقطع النت');
          		else if (e.type == 'down' && m.bot_alert_down != '0')
          			send(chat, `🔴 السيرفر ${e.which == 'second' ? 'الثاني' : 'الرئيسي'} (${e.name ?? ''}) ما يرد`);
          		else if (e.type == 'up' && m.bot_alert_down != '0')
          			send(chat, `🟢 السيرفر ${e.which == 'second' ? 'الثاني' : 'الرئيسي'} (${e.name ?? ''}) رجع`);
          		else if (e.type == 'line_down')
          			send(chat, `🔴 خط ${e.iface} بالدمج وكف، الدمج يكمل بالباقي`);
          		else if (e.type == 'line_up')
          			send(chat, `🟢 خط ${e.iface} رجع للدمج`);
          		else if (e.type == 'new_device' && m.bot_alert_newdev != '0')
          			send(chat, `📱 جهاز جديد دخل الشبكة:\n<b>${e.name ?? 'بدون اسم'}</b>\n${e.ip ?? ''} · ${e.mac}`,
          				[ [ { text: '✅ اسمح', callback_data: 'allow:' + e.mac }, { text: '⛔ اطرد', callback_data: 'kick:' + e.mac } ] ]);
          	}
          }

          // the last update handled is kept in a file and confirmed to Telegram before any command runs: a command
          // that restarts XLite restarts the bot too, and an unconfirmed update would come back and run again
          const OFFSET_FILE = TMP + '/bot.offset';
          let offset = +(fs.readfile(OFFSET_FILE) ?? 0) || 0;

          // started after the report time: today's report is not sent late
          function report_done_today() {
          	let t = localtime(), rt = uci().get('xlite', 'main', 'bot_report_time') ?? '22:00';
          	return (sprintf('%02d:%02d', t.hour, t.min) > rt) ? sprintf('%d-%02d-%02d', t.year, t.mon, t.mday) : '';
          }
          let last_report = report_done_today();
          while (true) {
          	let c = uci();
          	let m = c.get_all('xlite', 'main') ?? {};
          	token = m.bot_token;
          	if (m.bot_enabled != '1' || !token || !match(token, /^[0-9]+:[A-Za-z0-9_-]+$/)) {
          		sleep(30000);
          		continue;
          	}
          	let chat = m.bot_chat;
          	let r = api('getUpdates', { offset, timeout: 20, allowed_updates: [ 'message', 'callback_query' ] }, 20);
          	let batch = r?.result ?? [];
          	if (length(batch)) {
          		offset = batch[length(batch) - 1].update_id + 1;
          		fs.writefile(OFFSET_FILE, '' + offset);
          		api('getUpdates', { offset, timeout: 0, limit: 1 }, 0);
          	}
          	for (let u in batch) {
          		let from = u.message?.chat?.id ?? u.callback_query?.message?.chat?.id;
          		if (!chat && u.message?.text == '/start' && from) {
          			chat = '' + from;
          			c.set('xlite', 'main', 'bot_chat', chat);
          			c.save('xlite'); c.commit('xlite');
          			send(chat, '✅ انربط البوت ويا XLite. هذا الحساب بس اللي ينطيه أوامر.');
          			continue;
          		}
          		if (!chat || '' + from != chat)
          			continue;
          		if (u.message?.text)
          			command(c, chat, trim(u.message.text));
          		else if (u.callback_query) {
          			let d = match(u.callback_query.data ?? '', /^(allow|kick):(.*)$/);
          			if (d) {
          				kick(c, d[2], d[1] == 'kick');
          				api('answerCallbackQuery', { callback_query_id: u.callback_query.id, text: d[1] == 'kick' ? 'انطرد' : 'مسموح' });
          				send(chat, (d[1] == 'kick' ? '⛔ انطرد ' : '✅ مسموح ') + d[2]);
          			}
          		}
          	}
          	if (chat) {
          		events(c, chat);
          		let t = localtime(), hm = sprintf('%02d:%02d', t.hour, t.min), day = sprintf('%d-%02d-%02d', t.year, t.mon, t.mday);
          		if (hm >= (m.bot_report_time ?? '22:00') && last_report != day) {
          			last_report = day;
          			send(chat, '📊 <b>تقرير اليوم</b>\n' + status_text(c) + '\n\n' + devices_text());
          		}
          	}
          	if (!r)
          		sleep(10000);
          }
          XLITE_FILE_7
          mkdir -p "$(dirname "src/usr/share/xlite/data/apps.json")"
          cat <<'XLITE_FILE_8' | base64 -d | gunzip > "src/usr/share/xlite/data/apps.json"
