          +// newDownlinkSplice returns nil unless every byte the server sends from now
          +// on can go to the client socket unchanged. Call it right after the VLESS
          +// response header has been read, from the goroutine that reads conn.
          +func newDownlinkSplice(ctx context.Context, conn net.Conn) *downlinkSplice {
          +	if !downlinkSpliceEnabled {
          +		return nil
          +	}
          +	inbound := session.InboundFromContext(ctx)
          +	if inbound == nil || inbound.Conn == nil || inbound.CanSpliceCopy != 1 {
          +		return nil
          +	}
          +	outbounds := session.OutboundsFromContext(ctx)
          +	if len(outbounds) == 0 {
          +		return nil
          +	}
          +	for _, ob := range outbounds[:len(outbounds)-1] {
