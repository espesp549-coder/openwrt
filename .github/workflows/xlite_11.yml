          			]
          		}
          	}
          }
          XLITE_FILE_4
          mkdir -p "$(dirname "src/usr/share/rpcd/ucode/xlite.uc")"
          cat > "src/usr/share/rpcd/ucode/xlite.uc" <<'XLITE_FILE_5'
          // XLite backend for LuCI (ubus object "xlite")
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';
          import * as lib from 'xlite.lib';

          const RUN = '/var/etc/xlite';
          const TMP = '/tmp/xlite';
          const KEEP = '/etc/xlite';
          const SHARE = getenv('XLITE_SHARE') ?? '/usr/share/xlite';
          const B = [ '0', '1' ];
          function num(lo, hi) { return [ 'num', lo, hi ]; }
          // every option LuCI may change, with what it may hold
          const SETTINGS = {
          	// v2rayA
          	transparent: [ 'off', 'all', 'gfwlist', 'except_cn', 'routinga', 'same' ], rule_mode: [ 'gfwlist', 'except_cn', 'routinga' ],
          	impl: [ 'tproxy', 'redirect' ], antipollution: [ 'none', 'hijack', 'forward', 'doh' ], special: [ 'off', 'supervisor', 'fakedns' ],
          	tfo: [ 'default', 'on', 'off' ], mux: B, mux_conc: num(1, 128), sniffing: [ 'off', 'http_tls', 'http_tls_quic' ],
          	sub_auto: B, sub_auto_mode: [ 'interval', 'boot' ], sub_interval: num(1, 168), gfw_auto: [ 'off', 'boot', 'daily', 'weekly' ],
          	update_via: [ 'direct', 'proxy' ], ip_forward: B, port_sharing: B, loglevel: [ 'warning', 'info', 'debug', 'error', 'none' ],
          	// ports
          	tproxy_port: num(1024, 65535), socks_port: num(0, 65535), http_port: num(0, 65535), socks_rule_port: num(0, 65535), http_rule_port: num(0, 65535),
          	// second server
          	r2: B, r2_iq: B, r2_fallback: [ 'main', 'direct', 'none' ], r2_kernel: B, speedtest_main: B, r2_probe_interval: num(10, 300),
          	r2_probe: /^https?:\/\/[A-Za-z0-9.:\/_?=&%-]{1,200}$/, r2_speed_ports: (v) => lib.ports_ok(v),
          	// DNS and speed
          	dns: [ 'proxy', 'direct' ], dns_cache: B, dns_cache_size: num(150, 50000),
          	dns_upstream: (v) => length(v) <= 120 && !length(filter(split(v, /[ ,]+/), (x) => x != '' && !lib.ip4_ok(x) && !lib.ip6_ok(x))),
          	dns_stale: B, dns_min_ttl: num(0, 3600), block_quic: B, smart_mux: B,
          	// line bonding
          	bond: B, bond_ifaces: /^[A-Za-z0-9_ -]{0,120}$/, bond_mode: [ 'rr', 'fast', 'backup' ], bond_auto: B, bond_alert: B,
          	// ads
          	adblock: [ 'off', 'adguard', 'local', 'both' ], adblock_size: [ 'small', 'medium', 'large' ], adblock_allow: /^[A-Za-z0-9. -]*$/,
          	// isolation
          	iso_calls: B, iso_sniff: B, learn_minutes: num(1, 30),
          	// core
          	splice: B, gomaxprocs: num(0, 8), gogc: num(50, 1000), early_exit: B, tcp_cc: [ '', 'cubic', 'bbr' ], ipv6: [ 'auto', '0', '1' ], nofile: num(1024, 65535),
          	// devices
          	save_minutes: num(5, 240), billing_day: num(1, 28), hide_idle: B,
          	// Telegram
          	bot_enabled: B, bot_token: /^([0-9]{5,15}:[A-Za-z0-9_-]{20,60})?$/, bot_chat: /^-?[0-9]{0,20}$/, bot_alert_down: B, bot_alert_newdev: B,
          	bot_report_time: /^([01][0-9]|2[0-3]):[0-5][0-9]$/,
          	// tool and page
          	auto_update: B, ui_motion: [ 'full', 'light', 'off' ], ui_refresh: [ '1', '2', '5' ], ui_lang: [ 'ar', 'en' ]
          };
          // changing these needs no restart of the core (the page or the monitor reads them)
          const NO_RESTART = { ui_motion: 1, ui_refresh: 1, ui_lang: 1, hide_idle: 1, save_minutes: 1, learn_minutes: 1, bot_alert_down: 1,
          	bot_alert_newdev: 1, bot_report_time: 1, auto_update: 1, gfw_auto: 1, sub_auto: 1, sub_auto_mode: 1, sub_interval: 1, update_via: 1, adblock_size: 1, adblock_allow: 1 };

          function valid(rule, val) {
          	if (type(rule) == 'function')
          		return !!rule(val);
          	if (type(rule) == 'array' && rule[0] == 'num')
          		return match(val, /^[0-9]{1,5}$/) && +val >= rule[1] && +val <= rule[2];
          	if (type(rule) == 'array')
          		return index(rule, val) >= 0;
          	return !!match(val, rule);
          }

          let splice_cache = {};
          let geo_saved = 0;

          // the page asks for status every 2 s: what it would learn by starting processes (ubus, nft, xlite core)
          // is remembered for a few seconds instead (restart_bg / stop_bg forget it at once)
          let sc = { pid: null, pid_t: -100, core: null, core_t: -100, rules: false, rules_t: -100 };

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function uci() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('xlite');
          	return c;
          }

          function readjson(path) {
          	try { return json(fs.readfile(path) ?? 'null'); } catch (e) { return null; }
          }

          function writejson(path, v) {
          	fs.mkdir(TMP);
          	fs.writefile(path, sprintf('%J', v));
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          let apps_cache = null;

          function apps_data() {
          	let st = fs.stat(SHARE + '/data/apps.json'), key = st ? st.size + ':' + st.mtime : '';
          	if (!apps_cache || apps_cache.key != key)
          		apps_cache = { key, d: readjson(SHARE + '/data/apps.json') ?? { apps: [], iraq_domains: [] } };
          	return apps_cache.d;
          }

          // a settings change: a reload rebuilds the config, and only what changed restarts (see the init script)
          // line bonding: the router's ports and the bonded lines
          function net_cursor() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('network'); c.load('xlite');
          	return c;
          }

          function is_usb(dev) {
          	return index(fs.readlink('/sys/class/net/' + dev + '/device') ?? '', 'usb') >= 0;
          }

          function carrier(dev) {
          	return trim(fs.readfile('/sys/class/net/' + dev + '/carrier') ?? '0') == '1';
          }

          // LAN ports of br-lan (DSA), the WAN ports, and USB modems; "xw_<port>" = made a line here
          function port_list(c) {
          	let r = [], seen = {}, br = null, iface_of = {};
          	c.foreach('network', 'device', (s) => { if (s.name == 'br-lan') br = s; });
          	c.foreach('network', 'interface', (s) => { if (s.device && s['.name'] != 'loopback') iface_of[s.device] = s['.name']; });
          	for (let p in br?.ports ?? []) {
          		seen[p] = 1;
          		push(r, { port: p, kind: is_usb(p) ? 'usb' : 'lan', role: 'lan', up: carrier(p) });
          	}
          	for (let dev, i in iface_of) {
          		if (seen[dev] || i == 'lan' || !fs.stat('/sys/class/net/' + dev))
          			continue;
          		let usb = is_usb(dev);
          		if (i == 'wan' || i == 'wwan' || match(i, /^xw_/) || usb) {
          			seen[dev] = 1;
          			push(r, { port: dev, kind: usb ? 'usb' : (match(i, /^xw_/) ? 'lan' : 'wan'), role: 'wan', iface: i, line: i, mine: !!match(i, /^xw_/), up: carrier(dev), usb });
          		}
          	}
          	// a USB modem nobody configured yet
          	for (let dev in fs.lsdir('/sys/class/net') ?? [])
          		if (!seen[dev] && is_usb(dev))
          			push(r, { port: dev, kind: 'usb', role: 'free', usb: true, up: carrier(dev) });
          	return { ports: r, dsa: !!br };
          }

          function pairs(s) {
          	let r = {};
          	for (let w in split(s ?? '', /[ ,]+/)) { let m = match(w, /^([A-Za-z0-9_-]+):([0-9]+)$/); if (m) r[m[1]] = +m[2]; }
          	return r;
          }

          function words2(s) {
          	return filter(split(s ?? '', /[ ,]+/), (x) => x != '');
          }

          function line_label(iface, dev, kind) {
          	if (iface == 'wan') return 'الخط الأساسي';
          	if (kind == 'usb') return 'مودم USB';
          	if (kind == 'wifi') return 'واي فاي';
          	return 'خط منفذ ' + dev;
          }

          function restart_bg() {
          	sc.pid_t = -100; sc.rules_t = -100; sc.core_t = -100;
          	system('( /etc/init.d/xlite reload > /dev/null 2>&1 & )');
          }

          function stop_bg() {
          	sc.pid_t = -100; sc.rules_t = -100;
          	system('( /etc/init.d/xlite stop > /dev/null 2>&1 & )');
          }

          function core_pid() {
          	let j = null;
          	try { j = json(sh("ubus call service list '{\"name\":\"xlite\"}' 2>/dev/null")); } catch (e) {}
          	return j?.xlite?.instances?.xray?.running ? j.xlite.instances.xray.pid : null;
          }

          function core_pid_cached(now) {
          	if (sc.pid) {
          		let cl = fs.readfile('/proc/' + sc.pid + '/cmdline') ?? '';
          		if (index(cl, '/var/etc/xlite/config.json') >= 0)
          			return sc.pid;
          		sc.pid = null;
          	}
          	if (now - sc.pid_t < 3)
          		return null;
          	sc.pid_t = now;
          	sc.pid = core_pid();
          	return sc.pid;
          }

          function core_cached(now) {
          	if (sc.core != null && now - sc.core_t < (sc.core == '' ? 10 : 60) && (sc.core == '' || fs.stat(sc.core)))
          		return sc.core;
          	sc.core = trim(sh('/usr/bin/xlite core 2>/dev/null'));
          	sc.core_t = now;
          	return sc.core;
          }

          function rules_up(now) {
          	if (now - sc.rules_t < 5)
          		return sc.rules;
          	sc.rules = (system('nft -t list table inet xlite > /dev/null 2>&1') == 0 || system('nft list table inet xlite > /dev/null 2>&1') == 0);
          	sc.rules_t = now;
          	return sc.rules;
          }

          function first_num(s) {
          	let m = match(s ?? '', /([0-9]+)/);
          	return m ? +m[1] : null;
          }

          function cpu_counters() {
          	let r = [];
          	for (let l in split(fs.readfile('/proc/stat') ?? '', '\n')) {
          		let m = match(l, /^cpu([0-9]+) +(.*)$/);
          		if (!m)
          			continue;
          		let v = map(split(m[2], / +/), (x) => +x);
          		let idle = v[3] + (v[4] ?? 0), total = 0;
          		for (let x in v)
          			total += x;
          		push(r, [ total - idle, total ]);
          	}
          	return r;
          }

          function net_counters(dev) {
          	let base = '/sys/class/net/' + replace(dev ?? '', /[^A-Za-z0-9._@-]/g, '') + '/statistics/';
          	return { rx: +(trim(fs.readfile(base + 'rx_bytes') ?? '0')), tx: +(trim(fs.readfile(base + 'tx_bytes') ?? '0')) };
          }

          function splice_built(path) {
          	let st = fs.stat(path);
          	if (!st)
          		return false;
          	let key = path + ':' + st.size + ':' + st.mtime;
          	if (splice_cache[key] == null)
          		splice_cache[key] = (trim(sh("grep -aq 'VLESS downlink splice' '" + replace(path, /'/g, '') + "' && echo y")) == 'y');
          	return splice_cache[key];
          }

          function release() {
          	let r = {};
          	for (let l in split(fs.readfile('/usr/share/xlite/release') ?? '', '\n')) {
          		let m = match(l, /^([A-Z]+)=(.*)$/);
          		if (m)
          			r[lc(m[1])] = m[2];
          	}
          	return r;
          }

          function server_list(c, cur) {
          	let r = [], cur2 = c.get('xlite', 'main', 'server2'), r2 = c.get('xlite', 'main', 'r2') == '1';
          	c.foreach('xlite', 'server', (s) => {
          		let p = lib.parse_link(s.link);
          		push(r, {
          			id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '', valid: !p.error, error: p.error, current: s['.name'] == cur,
          			second: r2 && s['.name'] == cur2, host: p.address ?? '', port: p.port ?? '', sub: s.sub ?? ''
          		});
          	});
          	return r;
          }

          function status_server(c, cur) {
          	let r = null;
          	c.foreach('xlite', 'server', (s) => {
          		if (s['.name'] != cur)
          			return;
          		let p = lib.parse_link(s.link);
          		r = { id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '' };
          	});
          	return r;
          }

          function count_servers(c) {
          	let n = 0;
          	c.foreach('xlite', 'server', () => { n++; });
          	return n;
          }

          // country of an address (ip-api.com, cached: in RAM and in /etc/xlite/geo.json)
          function resolve1(host) {
          	if (match(host, /^[0-9.]+$/) || index(host, ':') >= 0)
          		return host;
          	for (let dns in [ '', ' 1.1.1.1' ]) {
          		let out = sh('{ command -v timeout > /dev/null 2>&1 && T="timeout 3"; $T nslookup ' + shq(host) + dns + ' 2>/dev/null; }'), seen = false;
          		for (let l in split(out, '\n')) {
          			if (match(l, /^Name:/)) seen = true;
          			else if (seen) {
          				let m = match(l, /([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          				// 198.18.0.0/15: a FakeDNS answer of the core, not the real address
          				if (m && !match(m[1], /^198\.1[89]\./)) return m[1];
          			}
          		}
          	}
          	return null;
          }

          function geo_lookup(hosts) {
          	let cache = readjson(TMP + '/geo.json') ?? readjson(KEEP + '/geo.json') ?? {};
          	// names are looked up again after a day (their address may have moved)
          	if (time() - (cache['@t'] ?? 0) > 86400) {
          		for (let k in keys(cache))
          			if (!match(k, /^[0-9.]+$/) && index(k, ':') < 0) delete cache[k];
          		cache['@t'] = time();
          	}
          	let r = {}, ask = [], ipof = {}, miss = readjson(TMP + '/geo-miss.json') ?? {}, missed = false;
          	for (let h in hosts) {
          		if (type(h) != 'string' || h == '' || length(h) > 255)
          			continue;
          		if (cache[h]) { r[h] = cache[h]; continue; }
          		if (miss[h] && time() - miss[h] < 1800) continue;
          		let ip = resolve1(h);
          		if (!ip) { miss[h] = time(); missed = true; continue; }
          		ipof[h] = ip;
          		if (cache[ip]) { r[h] = cache[ip]; cache[h] = cache[ip]; continue; }
          		push(ask, ip);
          	}
          	if (missed) writejson(TMP + '/geo-miss.json', miss);
          	if (length(ask)) {
          		let f = TMP + '/geo-q.json';
          		writejson(f, map(slice(ask, 0, 100), (ip) => ({ query: ip, fields: 'countryCode,query' })));
          		let port = +(uci().get('xlite', 'main', 'socks_port') ?? 0);
          		let via = (port > 0 && system('nft list table inet xlite > /dev/null 2>&1') == 0) ? ` --socks5-hostname 127.0.0.1:${port}` : '';
          		let out = sh(`curl -s -m 6${via} -X POST --data @${f} http://ip-api.com/batch 2>/dev/null`);
          		if (out == '' && via != '')
          			out = sh(`curl -s -m 6 -X POST --data @${f} http://ip-api.com/batch 2>/dev/null`);
          		let j = null;
          		try { j = json(out); } catch (e) {}
          		for (let x in (type(j) == 'array' ? j : []))
          			if (x?.query && match(x.countryCode ?? '', /^[A-Z]{2}$/))
          				cache[x.query] = x.countryCode;
          		for (let h, ip in ipof)
          			if (cache[ip]) { r[h] = cache[ip]; cache[h] = cache[ip]; }
          		writejson(TMP + '/geo.json', cache);
          		// flash: addresses only (the country of a name follows its address), at most once an hour
          		if (time() - geo_saved > 3600) {
          			geo_saved = time();
          			let keep = {};
          			for (let k, v in cache)
          				if (match(k, /^[0-9.]+$/) || index(k, ':') >= 0) keep[k] = v;
          			fs.mkdir(KEEP);
          			writejson(KEEP + '/geo.json', keep);
          		}
          	}
          	return r;
          }

          function bg(cmd, log) {
          	fs.mkdir(TMP);
          	system(`( ${cmd} > ${log} 2>&1; echo "rc=$?" >> ${log} ) > /dev/null 2>&1 &`);
          }

          function learn_log_off() {
          	let c = uci();
          	if (c.get('xlite', 'main', 'learn_log') == '1') {
          		c.set('xlite', 'main', 'learn_log', '0');
          		c.save('xlite'); c.commit('xlite');
          		if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          	}
          }

          function c_names() {
          	let r = {};
          	uci().foreach('xlite', 'device', (s) => { if (s.id) r[s.id] = s.name; });
          	return r;
          }

          const methods = {
          	status: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {};
          			let st = null;
          			try { st = json(fs.readfile(RUN + '/state.json') ?? 'null'); } catch (e) {}
          			let now0 = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          			let pid = core_pid_cached(now0), up = null, mem = null, core = core_cached(now0);
          			if (pid) {
          				let stat = fs.readfile('/proc/' + pid + '/stat') ?? '';
          				let f = split(substr(stat, rindex(stat, ')') + 2), ' ');
          				let uptime = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          				up = int(uptime - (+f[19]) / 100);
          				mem = first_num(match(fs.readfile('/proc/' + pid + '/status') ?? '', /VmRSS:[^\n]*/)?.[0]);
          			}
          			let rules = rules_up(now0);
          			let wan = st?.wan?.[0] ?? 'wan';
          			let srv = status_server(c, opt.server);
          			let mi = {};
          			for (let l in split(fs.readfile('/proc/meminfo') ?? '', '\n')) {
          				let m = match(l, /^(MemTotal|MemAvailable): +([0-9]+)/);
          				if (m) mi[m[1]] = +m[2];
          			}
          			return {
          				enabled: opt.enabled == '1', running: !!pid, rules, uptime: up, core_rss_kb: mem,
          				server: srv ? { id: srv.id, name: srv.name, protocol: srv.protocol, net: srv.net, header: srv.header, security: srv.security } : null,
          				core: core, core_splice: core ? splice_built(core) : false, splice_on: opt.splice != '0',
          				wan, net: net_counters(wan), cpu: cpu_counters(), now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0],
          				mem_total_kb: mi.MemTotal, mem_avail_kb: mi.MemAvailable,
          				v2raya: !!fs.stat('/etc/init.d/v2raya'), release: release(), servers: count_servers(c),
          				ip: st?.ip, protocol: st?.protocol, second: st?.second, warnings: st?.warnings ?? [],
          				r2: opt.r2 == '1', mon: readjson(TMP + '/mon.json')
          			};
          		}
          	},

          	servers: {
          		call: function() {
          			let c = uci();
          			return { servers: server_list(c, c.get('xlite', 'main', 'server')) };
          		}
          	},

          	add: {
          		args: { links: '' },
          		call: function(req) {
          			let c = uci(), report = [], first = null;
          			for (let l in split(req.args?.links ?? '', /[\r\n ]+/)) {
          				l = trim(l);
          				if (l == '')
          					continue;
          				let p = lib.parse_link(l);
          				if (p.error) {
          					push(report, { ok: false, error: p.error });
          					continue;
          				}
          				let dup = null, key = replace(p.link, /#.*$/, '');
          				c.foreach('xlite', 'server', (s) => { if (replace(s.link ?? '', /#.*$/, '') == key) dup = s['.name']; });
          				if (dup) {
          					push(report, { ok: true, dup: true, name: p.name });
          					continue;
          				}
          				let id = c.add('xlite', 'server');
          				c.set('xlite', id, 'name', p.name);
          				c.set('xlite', id, 'link', p.link);
          				first ??= id;
          				push(report, { ok: true, name: p.name, id });
          			}
          			let restart = false;
          			if (first && !c.get('xlite', 'main', 'server')) {
          				c.set('xlite', 'main', 'server', first);
          				restart = (c.get('xlite', 'main', 'enabled') == '1');
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart)
          				restart_bg();
          			return { report };
          		}
          	},

          	remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.delete('xlite', id);
          			let cur = c.get('xlite', 'main', 'server'), restart = false;
          			if (cur == id) {
          				let next = null;
          				c.foreach('xlite', 'server', (s) => { next ??= s['.name']; });
          				if (next)
          					c.set('xlite', 'main', 'server', next);
          				else
          					c.delete('xlite', 'main', 'server');
          				restart = true;
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	rename: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, name = trim(req.args?.name ?? '');
          			if (c.get('xlite', id) != 'server' || name == '' || length(name) > 64)
          				return { ok: false };
          			c.set('xlite', id, 'name', name);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	link: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci();
          			return { link: c.get('xlite', req.args?.id ?? '', 'link') };
          		}
          	},

          	edit: {
          		args: { id: '', link: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, p = lib.parse_link(req.args?.link ?? '');
          			if (c.get('xlite', id) != 'server')
          				return { ok: false, error: 'السيرفر غير موجود' };
          			if (p.error)
          				return { ok: false, error: p.error };
          			c.set('xlite', id, 'link', p.link);
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'server') == id && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	select: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.set('xlite', 'main', 'server', id);
          			c.set('xlite', 'main', 'enabled', '1');
          			c.save('xlite');
          			c.commit('xlite');
          			system('/etc/init.d/xlite enable > /dev/null 2>&1');
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	connect: {
          		args: { on: false },
          		call: function(req) {
          			let c = uci(), on = !!req.args?.on;
          			if (on && !c.get('xlite', 'main', 'server')) {
          				let first = null;
          				c.foreach('xlite', 'server', (s) => { first ??= s['.name']; });
          				if (!first)
          					return { ok: false, error: 'ضيف سيرفر أول' };
          				c.set('xlite', 'main', 'server', first);
          			}
          			c.set('xlite', 'main', 'enabled', on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (on) {
          				system('/etc/init.d/xlite enable > /dev/null 2>&1');
          				restart_bg();
          			}
          			else
          				stop_bg();
          			return { ok: true };
          		}
          	},

          	ping: {
          		args: { id: '' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? '', /[^A-Za-z0-9_]/g, '');
          			let ms = +trim(sh('/usr/bin/xlite ping ' + id + ' 2>/dev/null') || '-1');
          			return { id, ms };
          		}
          	},

          	settings: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {}, r = {};
          			for (let k in SETTINGS)
          				r[k] = opt[k] ?? '';
          			r.bypass = opt.bypass ?? '';
          			r.r2_domains = opt.r2_domains ?? '';
          			r.routinga = opt.routinga ?? '';
          			r.server2 = opt.server2 ?? '';
          			return { settings: r, tcp_cc_now: trim(fs.readfile('/proc/sys/net/ipv4/tcp_congestion_control') ?? ''),
          				tcp_cc_avail: split(trim(fs.readfile('/proc/sys/net/ipv4/tcp_available_congestion_control') ?? ''), ' ') };
          		}
          	},

          	set_settings: {
          		args: { values: {} },
          		call: function(req) {
          			let c = uci(), v = req.args?.values ?? {}, bad = [], changed = {};
          			for (let k in v) {
          				let rule = SETTINGS[k], val = '' + v[k];
          				if (k == 'bypass') {
          					if (length(filter(split(trim(val), /[ ]+/), (x) => x != '' && !lib.ip4_ok(x, true) && !lib.ip6_ok(x, true)))) push(bad, k);
          					else { c.set('xlite', 'main', k, trim(val)); changed[k] = true; }
          					continue;
          				}
          				if (k == 'r2_domains') {
          					val = trim(replace(val, /[\r\n\t, ]+/g, ' '));
          					// an entry made of digits (an address) must be a real one, or nft and the core refuse the rules
          					let badip = filter(split(val, ' '), (x) => (match(x, /^[0-9.\/]+$/) && !lib.ip4_ok(x, true)) || (index(x, ':') >= 0 && !lib.ip6_ok(x, true)));
          					if (length(val) > 8000 || !match(val, /^[A-Za-z0-9.:\/*_ -]*$/) || length(badip)) push(bad, k);
          					else { c.set('xlite', 'main', k, val); changed[k] = true; }
          					continue;
          				}
          				if (k == 'routinga') {
          					if (length(val) > 20000 || length(lib.routinga(val).errs)) push(bad, k);
          					else { c.set('xlite', 'main', k, val); changed[k] = true; }
          					continue;
          				}
          				if (!rule || !valid(rule, val)) {
          					push(bad, k);
          					continue;
          				}
          				if (c.get('xlite', 'main', k) != val) {
          					c.set('xlite', 'main', k, val);
          					changed[k] = true;
          				}
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			let restart = false;
          			for (let k in changed) if (!NO_RESTART[k]) restart = true;
          			let on = (c.get('xlite', 'main', 'enabled') == '1');
          			// new exceptions change the DNS lines too: download the list, then restart (one restart for all)
          			if (changed.adblock_allow && on) {
          				sc.pid_t = -100; sc.rules_t = -100; sc.core_t = -100;
          				bg('/usr/bin/xlite adblock; /etc/init.d/xlite restart', TMP + '/ads.log');
          				return { ok: !length(bad), bad, restart: true };
          			}
          			if (changed.adblock_size || changed.adblock_allow)
          				bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			if (restart && (on || changed.bot_enabled || changed.bot_token))
          				restart_bg();
          			return { ok: !length(bad), bad, restart };
          		}
          	},

          	geo: {
          		args: { hosts: [] },
          		call: function(req) {
          			return { geo: geo_lookup(req.args?.hosts ?? []) };
          		}
          	},

          	exitip: {
          		args: { which: 1, fresh: false },
          		call: function(req) {
          			let w = (req.args?.which == 2) ? 2 : 1;
          			let cache = readjson(TMP + '/exit.json') ?? {};
          			let e = cache['' + w];
          			if (!req.args?.fresh && e && time() - e.t < 120)
          				return e;
          			let ip = trim(sh('/usr/bin/xlite exitip ' + w + ' 2>/dev/null'));
          			e = { ip: ip || null, t: time() };
          			if (ip) {
          				let g = geo_lookup([ ip ]);
          				e.cc = g[ip];
          			}
          			cache['' + w] = e;
          			writejson(TMP + '/exit.json', cache);
          			return e;
          		}
          	},

          	second: {
          		args: { id: '', on: false },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '', on = !!req.args?.on;
          			if (on) {
          				if (c.get('xlite', id) != 'server')
          					return { ok: false, error: 'السيرفر غير موجود' };
          				if (id == c.get('xlite', 'main', 'server'))
          					return { ok: false, error: 'هذا السيرفر الأساسي، اختار غيره' };
          				c.set('xlite', 'main', 'server2', id);
          			}
          			c.set('xlite', 'main', 'r2', on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			let p = on ? lib.parse_link(c.get('xlite', id, 'link')) : {};
          			let need_wg = on && p.protocol == 'wireguard' && !p.reserved && c.get('xlite', 'main', 'r2_kernel') != '0' &&
          				!(fs.stat('/lib/netifd/proto/wireguard.sh') && fs.stat('/sys/module/wireguard'));
          			return { ok: true, need_wg };
          		}
          	},

          	wg_deps: {
          		call: function() {
          			bg('/usr/bin/xlite wg_deps', TMP + '/wg.log');
          			return { ok: true };
          		}
          	},

          	task_state: {
          		args: { name: '' },
          		call: function(req) {
          			let n = replace(req.args?.name ?? '', /[^a-z]/g, '');
          			return { log: fs.readfile(TMP + '/' + n + '.log') ?? '' };
          		}
          	},

          	lists: {
          		args: { which: 'all' },
          		call: function(req) {
          			let w = req.args?.which;
          			bg('/usr/bin/xlite lists ' + ((w == 'gfw' || w == 'cn') ? w : 'all'), TMP + '/lists.log');
          			return { ok: true };
          		}
          	},

          	lists_info: {
          		call: function() {
          			let r = {};
          			for (let n in [ 'gfw', 'cn4' ]) {
          				let st = fs.stat(KEEP + '/' + n + '.txt');
          				r[n] = st ? { size: st.size, mtime: st.mtime } : null;
          			}
          			return r;
          		}
          	},

          	routinga_check: {
          		args: { text: '' },
          		call: function(req) {
          			let r = lib.routinga(req.args?.text ?? '');
          			return { errs: r.errs, rules: length(r.rules), def: r.def };
          		}
          	},

          	// --- subscriptions --------------------------------------------------------------------
          	subs: {
          		call: function() {
          			let c = uci(), r = [];
          			c.foreach('xlite', 'subscription', (s) => push(r, { id: s['.name'], name: s.name ?? '', url: s.url ?? '',
          				updated: +(s.updated ?? 0), count: +(s.count ?? 0) }));
          			return { subs: r };
          		}
          	},

          	sub_add: {
          		args: { name: '', url: '' },
          		call: function(req) {
          			let url = trim(req.args?.url ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(url, /^https?:\/\/[^ '"]+$/) || length(url) > 2000)
          				return { ok: false, error: 'الرابط لازم يبدي بـ http:// أو https://' };
          			let c = uci(), id = c.add('xlite', 'subscription');
          			c.set('xlite', id, 'name', name != '' ? substr(name, 0, 64) : 'اشتراك');
          			c.set('xlite', id, 'url', url);
          			c.save('xlite');
          			c.commit('xlite');
          			bg('/usr/bin/xlite sub ' + id, TMP + '/sub.log');
          			return { ok: true, id };
          		}
          	},

          	sub_update: {
          		args: { id: 'all' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? 'all', /[^A-Za-z0-9_]/g, '');
          			bg('/usr/bin/xlite sub ' + (id || 'all'), TMP + '/sub.log');
          			return { ok: true };
          		}
          	},

          	sub_remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (c.get('xlite', id) != 'subscription')
          				return { ok: false };
          			let sel = c.get('xlite', 'main', 'server'), sel2 = c.get('xlite', 'main', 'server2'), kept = 0;
          			let del = [];
          			c.foreach('xlite', 'server', (s) => { if (s.sub == id) push(del, s['.name']); });
          			for (let s in del) {
          				if (s == sel || s == sel2) { c.delete('xlite', s, 'sub'); kept++; }
          				else c.delete('xlite', s);
          			}
          			c.delete('xlite', id);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true, kept };
          		}
          	},

          	// --- devices --------------------------------------------------------------------------
          	devices: {
          		call: function() {
          			let u = readjson(TMP + '/usage.json') ?? readjson(KEEP + '/usage.json') ?? { devs: {} };
          			let mon = readjson(TMP + '/mon.json') ?? {};
          			let rate = {};
          			for (let d in mon.devs ?? []) rate[d.id] = d.rate;
          			let r = [];
          			for (let k, d in u.devs ?? {})
          				push(r, { id: k, ip: d.ip, name: d.name, seen: d.seen, days: d.days ?? {}, months: d.months ?? {}, rate: rate[k] ?? [ 0, 0 ] });
          			let names = c_names(), routes = {};
          			uci().foreach('xlite', 'device', (s) => { if (s.id && s.route) routes[s.id] = s.route; });
          			for (let d in r) {
          				if (names[d.id]) d.alias = names[d.id];
          				d.route = routes[d.id] ?? 'vpn';
          			}
          			let blocked = filter(split(uci().get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '');
          			return { devices: r, running: !!mon.t && time() - mon.t < 30, blocked };
          		}
          	},

          	device_name: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), name = trim(req.args?.name ?? '');
          			if (!match(id, /^[0-9a-f:.]+$/))
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (name == '') c.delete('xlite', sid);
          			else {
          				c.set('xlite', sid, 'device');
          				c.set('xlite', sid, 'id', id);
          				c.set('xlite', sid, 'name', substr(name, 0, 40));
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	usage_reset: {
          		call: function() {
          			for (let f in [ TMP + '/usage.json', KEEP + '/usage.json' ])
          				fs.unlink(f);
          			// the monitor clears its totals at its next cycle (no restart, the internet stays up)
          			writejson(TMP + '/usage.reset', true);
          			return { ok: true };
          		}
          	},

          	// --- isolation ------------------------------------------------------------------------
          	apps: {
          		call: function() {
          			let c = uci(), d = apps_data(), mon = readjson(TMP + '/mon.json') ?? {}, u = readjson(TMP + '/usage.json') ?? {};
          			let st = readjson(RUN + '/state.json') ?? {};
          			let ln = readjson(TMP + '/learn.json');
          			let r = [];
          			for (let a in d.apps) {
          				let sec = c.get_all('xlite', a.id) ?? {};
          				let learned = sec.learned ?? [];
          				if (type(learned) != 'array') learned = split(learned, ' ');
          				push(r, { id: a.id, name: a.name, group: a.group, letter: a.letter, color: a.color, learn: a.learn,
          					isolate: sec.isolate == '1', active: index(st.iso ?? [], a.id) >= 0,
          					domains: length(a.domains), ips: length(a.ip4 ?? []) + length(a.ip6 ?? []), learned,
          					rate: mon.apps?.[a.id]?.rate ?? 0, days: u.apps?.[a.id]?.days ?? {},
          					learning: !!(ln && ln.app == a.id && !ln.done),
          					pct: (ln && ln.app == a.id) ? +(ln.pct ?? 0) : +(sec.learn_pct ?? (length(learned) ? 100 : 0)) });
          			}
          			return { apps: r, learn: readjson(TMP + '/learn.json') };
          		}
          	},

          	iso_set: {
          		args: { id: '', on: false },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (!length(filter(apps_data().apps, (a) => a.id == id)))
          				return { ok: false };
          			if (c.get('xlite', id) != 'app')
          				c.set('xlite', id, 'app');
          			c.set('xlite', id, 'isolate', req.args?.on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	learn_start: {
          		args: { app: '', ip: '', minutes: 5 },
          		call: function(req) {
          			let app = req.args?.app ?? '', ip = req.args?.ip ?? '';
          			let c0 = uci(), kind = (c0.get('xlite', app) == 'r2app') ? 'r2' : 'iso';
          			if ((kind == 'iso' && !length(filter(apps_data().apps, (a) => a.id == app))) || !match(ip, /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/))
          				return { ok: false };
          			// Iraqi apps are learned by name too: the core logs the sniffed names while learning
          			if (kind == 'r2') {
          				c0.set('xlite', 'main', 'learn_log', '1');
          				c0.save('xlite'); c0.commit('xlite');
          				if (c0.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			}
          			let m = +(req.args?.minutes ?? 0) || +(uci().get('xlite', 'main', 'learn_minutes') ?? 10);
          			if (m < 1 || m > 30) m = 10;
          			writejson(TMP + '/learn.json', { app, ip, kind, start: time(), until: time() + m * 60, nets: {}, names: {} });
          			return { ok: true };
          		}
          	},

          	learn_stop: {
          		call: function() {
          			let l = readjson(TMP + '/learn.json');
          			if (l) { l.until = time() - 1; l.done = true; writejson(TMP + '/learn.json', l); }
          			learn_log_off();
          			return { ok: true };
          		}
          	},

          	learn_save: {
          		args: { app: '', nets: [], names: [] },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) == 'r2app') {
          				let ips = c.get('xlite', app, 'ip') ?? [], doms = c.get('xlite', app, 'domain') ?? [];
          				if (type(ips) != 'array') ips = split(ips, ' ');
          				if (type(doms) != 'array') doms = split(doms, ' ');
          				for (let n in req.args?.nets ?? [])
          					if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(ips, n) < 0) push(ips, n);
          				for (let d in req.args?.names ?? [])
          					if (match(d, /^[a-z0-9.-]{3,200}$/) && index(doms, d) < 0) push(doms, d);
          				c.set('xlite', app, 'ip', ips);
          				c.set('xlite', app, 'domain', doms);
          				let ln = readjson(TMP + '/learn.json');
          				if (ln && ln.app == app) c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          				c.set('xlite', app, 'on', '1');
          				c.save('xlite'); c.commit('xlite');
          				fs.unlink(TMP + '/learn.json');
          				learn_log_off();
          				if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          				return { ok: true, count: length(ips) + length(doms) };
          			}
          			if (!length(filter(apps_data().apps, (a) => a.id == app)))
          				return { ok: false };
          			let cur = c.get('xlite', app, 'learned') ?? [];
          			if (type(cur) != 'array') cur = split(cur, ' ');
          			for (let n in req.args?.nets ?? [])
          				if (match(n, /^[0-9]{1,3}(\.[0-9]{1,3}){3}\/([0-9]|[12][0-9]|3[0-2])$/) && !match(n, /^198\.1[89]\./) && index(cur, n) < 0)
          					push(cur, n);
          			if (c.get('xlite', app) != 'app')
          				c.set('xlite', app, 'app');
          			c.set('xlite', app, 'learned', cur);
          			let ln = readjson(TMP + '/learn.json');
          			if (ln && ln.app == app)
          				c.set('xlite', app, 'learn_pct', '' + (+(ln.pct ?? 0)));
          			c.save('xlite');
          			c.commit('xlite');
          			fs.unlink(TMP + '/learn.json');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true, count: length(cur) };
          		}
          	},

          	learn_clear: {
          		args: { app: '' },
          		call: function(req) {
          			let c = uci(), app = req.args?.app ?? '';
          			if (c.get('xlite', app) != 'app')
          				return { ok: false };
          			c.delete('xlite', app, 'learned');
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1' && c.get('xlite', app, 'isolate') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	// --- Iraqi apps (through the second server) and the route of each device -----------------
          	r2apps: {
          		call: function() {
          			let c = uci(), r = [], ln = readjson(TMP + '/learn.json');
          			let n = 0;
          			c.foreach('xlite', 'r2app', () => n++);
          			if (!n) {
          				// first look: the usual Iraqi apps, empty (they are learned on the phone)
          				for (let p in [ [ 'cinemana', 'سينمانا' ], [ 'ayniq', 'عين العراق' ], [ 'capp', 'تطبيق C' ] ]) {
          					c.set('xlite', p[0], 'r2app'); c.set('xlite', p[0], 'name', p[1]); c.set('xlite', p[0], 'on', '0');
          				}
          				c.save('xlite'); c.commit('xlite');
          			}
          			c.foreach('xlite', 'r2app', (a) => {
          				let d = a.domain ?? [], ip = a.ip ?? [];
          				if (type(d) != 'array') d = split(d, ' ');
          				if (type(ip) != 'array') ip = split(ip, ' ');
          				push(r, { id: a['.name'], name: a.name ?? a['.name'], on: a.on == '1', domains: d, ips: ip,
          					learning: !!(ln && ln.app == a['.name'] && !ln.done),
          					pct: (ln && ln.app == a['.name']) ? +(ln.pct ?? 0) : +(a.learn_pct ?? ((length(d) + length(ip)) ? 100 : 0)) });
          			});
          			return { apps: r, learn: (ln && ln.kind == 'r2') ? ln : null };
          		}
          	},

          	r2app_set: {
          		args: { id: '', on: false, name: '', remove: false, domains: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id ?? '';
          			if (id == '') {
          				let name = trim(req.args?.name ?? '');
          				if (name == '' || length(name) > 40) return { ok: false };
          				id = c.add('xlite', 'r2app');
          				c.set('xlite', id, 'name', name);
          				c.set('xlite', id, 'on', '0');
          			}
          			else if (c.get('xlite', id) != 'r2app')
          				return { ok: false };
          			else if (req.args?.remove)
          				c.delete('xlite', id);
          			else {
          				if (req.args?.on != null) c.set('xlite', id, 'on', req.args.on ? '1' : '0');
          				if (req.args?.domains != null && req.args.domains != '') {
          					let l = filter(split(lc(req.args.domains), /[\s,]+/), (x) => match(x, /^[a-z0-9.-]{3,200}$/));
          					c.set('xlite', id, 'domain', l);
          				}
          			}
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true, id };
          		}
          	},

          	device_route: {
          		args: { id: '', route: '' },
          		call: function(req) {
          			let c = uci(), id = lc(req.args?.id ?? ''), route = req.args?.route ?? 'vpn';
          			if (!match(id, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/) || index([ 'vpn', 'warp', 'direct' ], route) < 0)
          				return { ok: false };
          			let sid = 'dev_' + replace(id, /[^0-9a-f]/g, '');
          			if (c.get('xlite', sid) != 'device') { c.set('xlite', sid, 'device'); c.set('xlite', sid, 'id', id); }
          			if (route == 'vpn') c.delete('xlite', sid, 'route'); else c.set('xlite', sid, 'route', route);
          			c.save('xlite'); c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	block_device: {
          		args: { mac: '', on: false },
          		call: function(req) {
          			let c = uci(), mac = lc(req.args?.mac ?? ''), on = !!req.args?.on;
          			if (!match(mac, /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/))
          				return { ok: false };
          			let l = filter(split(c.get('xlite', 'main', 'blocked_mac') ?? '', ' '), (x) => x != '' && x != mac);
          			if (on) push(l, mac);
          			c.set('xlite', 'main', 'blocked_mac', join(' ', l));
          			c.save('xlite');
          			c.commit('xlite');
          			system(`nft ${on ? 'add' : 'delete'} element inet xlite blocked '{ ${mac} }' > /dev/null 2>&1`);
          			return { ok: true, blocked: l };
          		}
          	},

          	bot_test: {
          		call: function() {
          			let c = uci(), tok = c.get('xlite', 'main', 'bot_token'), chat = c.get('xlite', 'main', 'bot_chat');
          			if (!tok || !chat)
          				return { ok: false, error: chat ? 'حط التوكن' : 'افتح البوت بتلجرام واكتب /start أول' };
          			let f = TMP + '/bot-test.json';
          			writejson(f, { chat_id: chat, text: '✅ رسالة تجربة من XLite' });
          			let socks = +(c.get('xlite', 'main', 'socks_port') ?? 0);
          			let url = "'https://api.telegram.org/bot" + replace(tok, /[^0-9A-Za-z:_-]/g, '') + "/sendMessage'";
          			let out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${socks > 0 ? '--socks5-hostname 127.0.0.1:' + socks : ''} ${url} 2>/dev/null`);
          			if (!match(out, /"ok":true/))
          				out = sh(`curl -s -m 15 -H 'Content-Type: application/json' -d @${f} ${url} 2>/dev/null`);
          			fs.unlink(f);
          			return { ok: !!match(out, /"ok":true/) };
          		}
          	},

          	adblock_update: {
          		call: function() {
          			bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			return { ok: true };
          		}
          	},

          	// backup: the whole /etc/config/xlite (servers, subscriptions, settings, apps, device names)
          	backup: {
          		call: function() {
          			return { name: 'xlite-backup.conf', text: fs.readfile(getenv('XLITE_UCI_DIR') ? getenv('XLITE_UCI_DIR') + '/xlite' : '/etc/config/xlite') ?? '' };
          		}
          	},

          	restore: {
          		args: { text: '' },
          		call: function(req) {
          			let t = req.args?.text ?? '';
          			// only an XLite config: uci syntax, a main section, nothing else on a line
          			if (length(t) > 512000 || !match(t, /config xlite 'main'/))
          				return { ok: false, error: 'هذا مو ملف نسخة احتياطية من XLite' };
          			for (let l in split(t, '\n'))
          				if (!match(l, /^(\s*|\s*(config|option|list) .*|\s*#.*)$/))
          					return { ok: false, error: 'الملف بيه أسطر غريبة' };
          			let tmp = '/tmp/xlite-restore.conf';
          			fs.writefile(tmp, t);
          			let chk = system('uci -q -c /tmp import xlite-check < ' + tmp + ' > /dev/null 2>&1');
          			fs.unlink('/tmp/xlite-check');
          			if (chk != 0) {
          				fs.unlink(tmp);
          				return { ok: false, error: 'الملف خربان' };
          			}
          			system('cp /etc/config/xlite /etc/xlite/config.before-restore 2>/dev/null; mkdir -p /etc/xlite; cp ' + tmp + ' /etc/config/xlite; rm -f ' + tmp);
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	uninstall: {
          		call: function() {
          			bg('sleep 2; /usr/bin/xlite uninstall', '/tmp/xlite-uninstall.log');
          			return { ok: true };
          		}
          	},

          	ports: {
          		call: function() {
          			return port_list(net_cursor());
          		}
          	},

          	// the bonding page: every bonded line (address, gateway, counters, ping through it) and the ports
          	bond_status: {
          		call: function() {
          			let c = net_cursor(), m = c.get_all('xlite', 'main') ?? {};
          			let paused = words2(m.bond_paused), limits = pairs(m.bond_limits), probe = readjson(TMP + '/bond.json') ?? {};
          			let lines = [];
          			for (let i in words2(m.bond_ifaces)) {
          				let j = null;
          				try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          				let dev = j?.l3_device ?? j?.device ?? c.get('network', i, 'device') ?? i, gw = null;
          				for (let r in j?.route ?? [])
          					if (r.target == '0.0.0.0' && r.mask == 0 && r.nexthop != '0.0.0.0') gw = r.nexthop;
          				let kind = is_usb(dev) ? 'usb' : fs.stat('/sys/class/net/' + dev + '/phy80211') ? 'wifi' : (match(i, /^xw_/) ? 'lan' : 'wan');
          				let base = '/sys/class/net/' + dev + '/statistics/', pr = probe[i];
          				let state = (index(paused, i) >= 0) ? 'paused' : (!j?.up || pr?.ok === false) ? 'down' : 'active';
          				push(lines, { iface: i, dev, kind, label: line_label(i, dev, kind), state, ip: j?.['ipv4-address']?.[0]?.address ?? '', gw: gw ?? '',
          					ping: pr?.ok ? pr.ms : null, rx: +trim(fs.readfile(base + 'rx_bytes') ?? '0'), tx: +trim(fs.readfile(base + 'tx_bytes') ?? '0'), limit: limits[i] ?? 0 });
          			}
          			let p = port_list(c);
          			return { on: m.bond == '1', mode: m.bond_mode || 'rr', auto: m.bond_auto != '0', alert: m.bond_alert != '0', lines, ports: p.ports, dsa: p.dsa,
          				now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0] };
          		}
          	},

          	// one change from the bonding page: on/off, mode, a line paused, a line's speed cap, the switches
          	bond_set: {
          		args: { key: '', iface: '', value: '' },
          		call: function(req) {
          			let k = req.args?.key ?? '', i = req.args?.iface ?? '', v = '' + (req.args?.value ?? '');
          			let c = uci();
          			if (i != '' && !match(i, /^[A-Za-z0-9_-]{1,15}$/))
          				return { ok: false };
          			if (k == 'on' || k == 'auto' || k == 'alert') {
          				if (v != '0' && v != '1') return { ok: false };
          				c.set('xlite', 'main', k == 'on' ? 'bond' : 'bond_' + k, v);
          			}
          			else if (k == 'mode') {
          				if (index([ 'rr', 'fast', 'backup' ], v) < 0) return { ok: false };
          				c.set('xlite', 'main', 'bond_mode', v);
          			}
          			else if (k == 'pause') {
          				let l = filter(words2(c.get('xlite', 'main', 'bond_paused')), (x) => x != i);
          				if (v == '1') push(l, i);
          				c.set('xlite', 'main', 'bond_paused', join(' ', l));
          			}
          			else if (k == 'limit') {
          				if (!match(v, /^[0-9]{1,4}$/)) return { ok: false };
          				let l = pairs(c.get('xlite', 'main', 'bond_limits')), out = [];
          				l[i] = +v;
          				for (let n, mb in l) if (mb > 0) push(out, n + ':' + mb);
          				c.set('xlite', 'main', 'bond_limits', join(' ', out));
          			}
          			else
          				return { ok: false };
          			c.save('xlite'); c.commit('xlite');
          			// the alert switch is read by the monitor; everything else rebuilds the core
          			if (k != 'alert' && c.get('xlite', 'main', 'enabled') == '1') restart_bg();
          			return { ok: true };
          		}
          	},

          	// Wi-Fi as a line: the router's radio joins another network (client mode) and that becomes a bonded line
          	wifi_radios: {
          		call: function() {
          			let c = net_cursor(), st = null, r = [];
          			c.load('wireless');
          			try { st = json(sh('ubus call network.wireless status 2>/dev/null')); } catch (e) {}
          			c.foreach('wireless', 'wifi-device', (d) => {
          				let name = d['.name'], s = st?.[name] ?? {}, sta = c.get_all('wireless', 'xw_' + name);
          				let band = d.band ?? (match(d.hwmode ?? '', /a/) ? '5g' : '2g');
          				let ap = null;
          				for (let i in s.interfaces ?? []) if (i.config?.mode == 'ap' && i.ifname) { ap = i; break; }
          				let line = null;
          				if (sta) {
          					let j = null, dev = null;
          					for (let i in s.interfaces ?? []) if (i.section == 'xw_' + name) dev = i.ifname;
          					try { j = json(sh('ubus call network.interface.xw_' + name + ' status 2>/dev/null')); } catch (e) {}
          					line = { ssid: sta.ssid, on: sta.disabled != '1', up: !!j?.up, dev, ip: j?.['ipv4-address']?.[0]?.address ?? '' };
          				}
          				push(r, { radio: name, band, channel: d.channel ?? 'auto', up: !!s.up, ap: ap ? ap.config?.ssid : null, line });
          			});
          			return { radios: r };
          		}
          	},

          	// a scan can take 10 s or more, and rpcd answers one call at a time: it runs in the background (the whole
          	// page froze while it waited), the page asks for the result
          	wifi_scan: {
          		args: { radio: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/))
          				return { ok: false };
          			let st = null, ifn = null;
          			try { st = json(sh('ubus call network.wireless status 2>/dev/null')); } catch (e) {}
          			for (let i in st?.[rd]?.interfaces ?? []) if (i.ifname) { ifn = i.ifname; break; }
          			if (!ifn)
          				return { ok: false, error: 'الراديو مطفي أو ما بيه شبكة شغالة: شغّله من إعدادات الواي فاي أول' };
          			if (!match(ifn, /^[A-Za-z0-9._-]{1,15}$/))
          				return { ok: false };
          			let f = TMP + '/scan-' + rd + '.json';
          			fs.mkdir(TMP);
          			fs.unlink(f);
          			system(`( { command -v timeout > /dev/null 2>&1 && T="timeout 25"; $T ubus -t 25 call iwinfo scan '{"device":"${ifn}"}' > ${f}.tmp 2>/dev/null; } ; mv -f ${f}.tmp ${f} ) > /dev/null 2>&1 &`);
          			return { ok: true, pending: true };
          		}
          	},

          	wifi_scan_result: {
          		args: { radio: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/))
          				return { ok: false };
          			let t = fs.readfile(TMP + '/scan-' + rd + '.json');
          			if (t == null)
          				return { ok: true, pending: true };
          			let j = null;
          			try { j = json(t); } catch (e) {}
          			if (!j?.results)
          				return { ok: false, error: 'الراديو ما رجّع نتيجة: جرب مرة ثانية' };
          			let seen = {}, out = [];
          			for (let n in j.results) {
          				if (!n.ssid || seen[n.ssid] && seen[n.ssid].signal >= n.signal)
          					continue;
          				let e = n.encryption ?? {}, a = e.authentication ?? [], enc = 'none';
          				if (e.enabled) enc = (index(a, 'sae') >= 0) ? (index(a, 'psk') >= 0 ? 'sae-mixed' : 'sae') : (length(e.wpa ?? []) > 1 ? 'psk-mixed' : (index(e.wpa ?? [], 1) >= 0 && length(e.wpa) == 1 ? 'psk' : 'psk2'));
          				seen[n.ssid] = { ssid: n.ssid, bssid: n.bssid, signal: n.signal, quality: n.quality, max: n.quality_max, channel: n.channel, enc };
          			}
          			for (let k, v in seen) push(out, v);
          			out = sort(out, (x, y) => (y.signal ?? -100) - (x.signal ?? -100));
          			return { ok: true, nets: out };
          		}
          	},

          	wifi_connect: {
          		args: { radio: '', ssid: '', key: '', enc: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '', ssid = req.args?.ssid ?? '', key = req.args?.key ?? '', enc = req.args?.enc ?? 'psk2';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/) || length(ssid) < 1 || length(ssid) > 32 || index([ 'none', 'psk', 'psk2', 'psk-mixed', 'sae', 'sae-mixed' ], enc) < 0)
          				return { ok: false, error: 'بيانات غير صحيحة' };
          			if (enc != 'none' && (length(key) < 8 || length(key) > 63))
          				return { ok: false, error: 'الباسورد لازم من 8 إلى 63 حرف' };
          			let c = net_cursor(), iface = 'xw_' + rd, sec = 'xw_' + rd, wz = null;
          			c.load('wireless'); c.load('firewall');
          			if (c.get('wireless', rd) != 'wifi-device')
          				return { ok: false, error: 'ماكو هيج راديو' };
          			c.foreach('firewall', 'zone', (s) => { if (s.name == 'wan') wz = s['.name']; });
          			if (!wz)
          				return { ok: false, error: 'ماكو زون wan بالفايروول' };
          			c.set('wireless', sec, 'wifi-iface');
          			for (let k, v in { device: rd, mode: 'sta', network: iface, ssid, encryption: enc, disabled: '0' }) c.set('wireless', sec, k, v);
          			if (enc == 'none') c.delete('wireless', sec, 'key'); else c.set('wireless', sec, 'key', key);
          			c.set('network', iface, 'interface');
          			c.set('network', iface, 'proto', 'dhcp');
          			let n = 0;
          			c.foreach('network', 'interface', (s) => { if (match(s['.name'], /^xw_/)) n++; });
          			if (!c.get('network', iface, 'metric')) c.set('network', iface, 'metric', '' + (10 + n));
          			let nets = c.get('firewall', wz, 'network') ?? [];
          			if (type(nets) != 'array') nets = split(nets, ' ');
          			if (index(nets, iface) < 0) push(nets, iface);
          			c.set('firewall', wz, 'network', nets);
          			let bond = words2(c.get('xlite', 'main', 'bond_ifaces'));
          			if (!length(bond)) push(bond, 'wan');
          			if (index(bond, iface) < 0) push(bond, iface);
          			c.set('xlite', 'main', 'bond_ifaces', join(' ', bond));
          			c.set('xlite', 'main', 'bond', '1');
          			for (let k in [ 'wireless', 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			system('( sleep 1; /etc/init.d/network reload; wifi reload; /etc/init.d/firewall reload; [ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart ) > /dev/null 2>&1 &');
          			return { ok: true, iface };
          		}
          	},

          	// on / off keeps the network and its password; remove forgets it
          	wifi_set: {
          		args: { radio: '', action: '' },
          		call: function(req) {
          			let rd = req.args?.radio ?? '', act = req.args?.action ?? '';
          			if (!match(rd, /^[A-Za-z0-9_]{1,20}$/) || index([ 'on', 'off', 'remove' ], act) < 0)
          				return { ok: false };
          			let c = net_cursor(), sec = 'xw_' + rd;
          			c.load('wireless'); c.load('firewall');
          			if (c.get('wireless', sec) != 'wifi-iface')
          				return { ok: false, error: 'ما مربوط بشبكة' };
          			if (act == 'remove') {
          				c.delete('wireless', sec);
          				c.delete('network', sec);
          				c.foreach('firewall', 'zone', (s) => {
          					let nets = s.network ?? [];
          					if (type(nets) != 'array') nets = split(nets, ' ');
          					if (index(nets, sec) >= 0) c.set('firewall', s['.name'], 'network', filter(nets, (x) => x != sec));
          				});
          				c.set('xlite', 'main', 'bond_ifaces', join(' ', filter(words2(c.get('xlite', 'main', 'bond_ifaces')), (x) => x != sec)));
          			}
          			else
          				c.set('wireless', sec, 'disabled', act == 'on' ? '0' : '1');
          			for (let k in [ 'wireless', 'network', 'firewall', 'xlite' ]) { c.save(k); c.commit(k); }
          			system('( sleep 1; wifi reload; /etc/init.d/network reload; /etc/init.d/firewall reload; [ "$(uci -q get xlite.main.enabled)" = 1 ] && /etc/init.d/xlite restart ) > /dev/null 2>&1 &');
          			return { ok: true };
          		}
          	},

          	// "why is the internet not working": every link of the chain in order, the first broken one is the answer
          	diagnose: {
          		call: function() {
          			let c = uci(), m = c.get_all('xlite', 'main') ?? {}, st = readjson(RUN + '/state.json') ?? {}, r = [];
          			let add = (id, ok, title, detail, fix) => push(r, { id, ok, title, detail: detail ?? '', fix: fix ?? '' });
          			// 1. the clock: TLS servers refuse a router that lives in another year
