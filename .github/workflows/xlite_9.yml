          /d+si2NZZdYzkPUL6PkC1YUlLJ+R4y+lP/c2ltpG7Ram9KnGHENq0/8D5s7Dr/uPBAA=
          XLITE_FILE_18
          mkdir -p "$(dirname "install.sh.in")"
          cat > "install.sh.in" <<'XLITE_INSTALLER'
          #!/bin/sh
          # XLite installer / updater for OpenWrt 22.03+ (nftables)
          #   wget -O- https://github.com/@REPO@/releases/download/@TAG@/install.sh | sh
          # Installs the LuCI page (Services > XLite), the service and the xray core with the zero-copy download.
          # Settings and servers in /etc/config/xlite are kept on update. v2rayA is left alone until you
          # press "connect" in XLite (then it is stopped and disabled; "xlite uninstall" brings it back).
          REPO='@REPO@'
          TAG='@TAG@'
          VERSION='@VERSION@'
          BUILD='@BUILD@'
          BASE="https://github.com/$REPO/releases/download/$TAG"
          SHARE=/usr/share/xlite
          TMP=$(mktemp -d /tmp/xlite-inst.XXXXXX) || exit 1
          trap 'rm -rf "$TMP"' EXIT

          say() { echo "[XLite] $*"; }
          die() { echo "[XLite] خطأ: $*"; exit 1; }

          fetch() {   # url file
          	if command -v curl > /dev/null 2>&1; then curl -fsSL --retry 2 --connect-timeout 20 -o "$2" "$1"
          	else wget -q -T 30 -O "$2" "$1"; fi
          }

          [ -f /etc/openwrt_release ] || die "هذا مو OpenWrt"
          command -v nft > /dev/null 2>&1 || die "nftables مو موجود: XLite يحتاج OpenWrt 22.03 أو أحدث"
          command -v ucode > /dev/null 2>&1 || die "ucode مو موجود: XLite يحتاج OpenWrt 22.03 أو أحدث"

          if command -v opkg > /dev/null 2>&1; then PM=opkg
          elif command -v apk > /dev/null 2>&1; then PM=apk
          else die "ما لكيت opkg ولا apk"; fi

          have_pkg() {
          	if [ $PM = opkg ]; then opkg status "$1" 2>/dev/null | grep -q '^Status:.* installed'
          	else apk info -e "$1" > /dev/null 2>&1; fi
          }

          updated=0
          pkg_install() {
          	if [ $updated = 0 ]; then
          		say "تحديث قوائم الحزم..."
          		if [ $PM = opkg ]; then opkg update > "$TMP/pm.log" 2>&1; else apk update > "$TMP/pm.log" 2>&1; fi
          		updated=1
          	fi
          	if [ $PM = opkg ]; then opkg install "$@" >> "$TMP/pm.log" 2>&1; else apk add "$@" >> "$TMP/pm.log" 2>&1; fi
          }

          # what XLite needs (most of it is already there with LuCI and fw4)
          need=""
          for p in ucode-mod-fs ucode-mod-uci rpcd-mod-ucode kmod-nft-tproxy curl ca-bundle; do
          	have_pkg "$p" || need="$need $p"
          done
          ip -V 2>&1 | grep -q iproute2 || need="$need ip-full"
          missing=""
          if [ -n "$need" ]; then
          	say "تنصيب المتطلبات:$need"
          	for p in $need; do
          		pkg_install "$p" || missing="$missing $p"
          	done
          fi
          for p in ucode-mod-fs ucode-mod-uci rpcd-mod-ucode; do
          	case " $missing " in *" $p "*) die "ما انصب $p (شوف الإنترنت أو مستودع الحزم)";; esac
          done
          TPROXY=1
          case " $missing " in *" kmod-nft-tproxy "*)
          	TPROXY=0
          	say "تنبيه: kmod-nft-tproxy ما انصب، فالتحويل يكون redirect (TCP بس) لحد ما ينصب"
          	command -v mx2000-kmods > /dev/null 2>&1 && say "على MX2000: شغّل mx2000-kmods ثم opkg install kmod-nft-tproxy";;
          esac

          # the tool
          say "تنزيل XLite $VERSION..."
          fetch "$BASE/xlite.tar.gz" "$TMP/xlite.tar.gz" || die "التنزيل فشل (الإنترنت؟)"
          fetch "$BASE/sha256sums" "$TMP/sha256sums" || die "التنزيل فشل (sha256sums)"
          check() {   # file asset-name
          	command -v sha256sum > /dev/null 2>&1 || return 0
          	want=$(awk -v f="$2" '$2 == f || $2 == "*" f {print $1}' "$TMP/sha256sums")
          	[ -n "$want" ] && [ "$(sha256sum "$1" | cut -d' ' -f1)" = "$want" ]
          }
          check "$TMP/xlite.tar.gz" xlite.tar.gz || die "الملف المنزل تالف (sha256)"

          # the core: the zero-copy xray if the router already has one (the MX2000 firmware does), else ours for this CPU
          ARCH=""
          if [ $PM = opkg ]; then ARCH=$(opkg print-architecture 2>/dev/null | awk '$2 !~ /^(all|noarch)$/ {a = $2} END {print a}')
          else ARCH=$(apk --print-arch 2>/dev/null); fi
          [ -n "$ARCH" ] || ARCH=$(uname -m)
          case "$ARCH" in
          aarch64*|arm64*) CORE=arm64 ;;
          arm_arm1176*|armv6*) CORE=armv6 ;;
          arm_cortex-a*_neon*|arm_cortex-a*_vfp*|armv7*) CORE=armv7 ;;
          arm*) CORE=armv5 ;;
          mipsel_*|mipsle*) CORE=mipsle ;;
          mips64el_*) CORE=mips64le ;;
          mips64_*) CORE=mips64 ;;
          mips_*|mips) CORE=mips ;;
          x86_64*) CORE=amd64 ;;
          i386*|i486*|i586*|i686*|x86) CORE=386 ;;
          riscv64*) CORE=riscv64 ;;
          loongarch64*) CORE=loong64 ;;
          *) CORE="" ;;
          esac

          core_ok() { [ -x "$1" ] && grep -aq 'VLESS downlink splice' "$1"; }
          mkdir -p $SHARE/bin
          CORE_NOTE=""
          if core_ok /usr/bin/xray; then
          	rm -f $SHARE/bin/xray $SHARE/bin/xray.gz
          	CORE_NOTE="النواة المخففة الموجودة بالراوتر (/usr/bin/xray)"
          elif [ -n "$CORE" ] && [ -z "$XLITE_SKIP_CORE" ]; then
          	have=""
          	[ -f $SHARE/bin/core.sum ] && have=$(cat $SHARE/bin/core.sum)
          	want=$(awk -v f="xray-$CORE.gz" '$2 == f {print $1}' "$TMP/sha256sums")
          	if [ -n "$want" ] && [ "$have" = "$want" ] && { [ -x $SHARE/bin/xray ] || [ -s $SHARE/bin/xray.gz ]; }; then
          		CORE_NOTE="النواة المخففة ($CORE) بدون تغيير"
          	else
          		say "تنزيل النواة المخففة ($CORE)..."
