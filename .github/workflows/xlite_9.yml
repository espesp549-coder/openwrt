          UUID=6a3c0e5e-6f1a-4d55-9d2a-8c1f0b2e7d41
          cleanup() { kill $(jobs -p) 2>/dev/null; wait 2>/dev/null; }
          trap cleanup EXIT
          trap 'exit 1' INT TERM   # runs the EXIT trap: no server left on the test ports

          HDR_REQ='{"version":"1.1","method":"GET","path":["/video"],"headers":{"Host":["www.example.com"],"User-Agent":["Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.75 Safari/537.36"],"Accept-Encoding":["gzip, deflate"],"Connection":["keep-alive"],"Pragma":"no-cache"}}'
          HDR_RESP='{"version":"1.1","status":"200","reason":"OK","headers":{"Content-Type":["application/octet-stream","video/mpeg"],"Transfer-Encoding":["chunked"],"Connection":["keep-alive"],"Pragma":"no-cache"}}'
          case $V in
          http|mux) SS='{"network":"tcp","security":"none","tcpSettings":{"header":{"type":"http","request":'$HDR_REQ',"response":'$HDR_RESP'}}}' ;;
          none) SS='{"network":"tcp","security":"none"}' ;;
