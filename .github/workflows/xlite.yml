          var TABS = [ [ 'home', 'الرئيسية' ], [ 'servers', 'السيرفرات' ], [ 'iso', 'العزل' ], [ 'settings', 'الإعدادات' ] ];

          function fmtUp(s) {
          	if (s == null) return '';
          	var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
          	return h > 0 ? h + 'س ' + m + 'د' : m + 'د';
          }

