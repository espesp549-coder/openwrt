name: XLite release

# Builds XLite (the light v2rayA replacement) and publishes it as the release "xlite" of this repo.
# On any OpenWrt 22.03+ router:  wget -O- https://github.com/<this repo>/releases/download/xlite/install.sh | sh
# Every file of the tool is inside this workflow: the repo needs nothing else.

on:
  workflow_dispatch:
    inputs:
      zero_copy:
        description: 'Core with the zero-copy download for VLESS over TCP (patch 900): tested on the runner first, left out by itself if a test fails'
        type: boolean
        default: true

permissions:
  contents: write

env:
  XRAY_VERSION: 25.1.30
  XRAY_HASH: 983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e
  GO_VERSION: 1.23.12
  RELEASE_TAG: xlite
  LIBUBOX_REV: da2d205a5cf3e877c45a2eec488218cbaf452e7d
  UCI_REV: 74f6277aabffc943d026f406df57c22595134c42
  UCODE_REV: aabdeb4f5060c91c5929bf6d7af745c6aabf5ec5

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: "1. XLite files"
        run: |
          mkdir -p out
          echo "# XLite build ${{ github.run_number }}" > out/summary.md
          mkdir -p "$(dirname "src/etc/hotplug.d/iface/90-xlite")"
          cat > "src/etc/hotplug.d/iface/90-xlite" <<'XLITE_FILE_0'
          # XLite: keep the set of the router's own addresses current (they never go through the proxy)
          case "$ACTION" in ifup|ifupdate) [ -x /usr/bin/xlite ] && /usr/bin/xlite refresh_ips ;; esac
          XLITE_FILE_0
          mkdir -p "$(dirname "src/etc/init.d/xlite")"
          cat > "src/etc/init.d/xlite" <<'XLITE_FILE_1'
          #!/bin/sh /etc/rc.common
          # XLite: transparent proxy (xray core + nftables tproxy)
          START=99
          STOP=10
          USE_PROCD=1

          start_service() {
          	local enabled core kv
          	config_load xlite
          	config_get_bool enabled main enabled 0
          	if [ "$enabled" != 1 ]; then
          		/usr/bin/xlite rules_down
          		return 0
          	fi
          	/usr/bin/xlite stop_v2raya
          	if ! /usr/bin/xlite prepare; then
          		logger -t xlite "not started: no valid server (add one in LuCI: Services > XLite)"
          		return 1
          	fi
          	if ! core=$(/usr/bin/xlite core); then
          		logger -t xlite "not started: the core (xray) is missing, run: xlite update"
          		return 1
          	fi
          	/usr/bin/xlite sysctl
          	procd_open_instance xray
          	procd_set_param command "$core" run -c /var/etc/xlite/config.json
          	procd_set_param env XRAY_LOCATION_ASSET=/usr/share/xray
          	for kv in $(cat /var/etc/xlite/env); do
          		[ -n "${kv#*=}" ] && procd_append_param env "$kv"
          	done
          	procd_set_param limits nofile="65535 65535"
          	procd_set_param respawn 3600 5 0
          	procd_set_param stdout 1
          	procd_set_param stderr 1
          	procd_close_instance
          	( /usr/bin/xlite rules_when_ready > /dev/null 2>&1 & )
          }

          stop_service() {
          	/usr/bin/xlite rules_down
          }

          reload_service() {
          	stop
          	start
          }

          service_triggers() {
          	procd_add_reload_trigger "xlite"
          }
          XLITE_FILE_1
          chmod 755 "src/etc/init.d/xlite"
          mkdir -p "$(dirname "src/usr/bin/xlite")"
          cat > "src/usr/bin/xlite" <<'XLITE_FILE_2'
          #!/bin/sh
          # XLite: a light transparent proxy for OpenWrt (xray core + nftables tproxy), managed from LuCI.
          #   xlite start|stop|restart        the proxy (same as /etc/init.d/xlite ...)
          #   xlite status                    is it running, which server, which core
          #   xlite add                       share links on stdin (vless://, vmess://, trojan://, ss://)
          #   xlite ping <server-id>          TCP connect time to a server in ms (-1 = no answer)
          #   xlite update                    install the newest version (settings and servers are kept)
          #   xlite uninstall                 remove XLite (v2rayA is enabled again if it is installed)
          SHARE=/usr/share/xlite
          RUN=/var/etc/xlite
          UC="ucode -L /usr/share/ucode $SHARE/gen.uc"
          TABLE=100
          [ -f $SHARE/release ] && . $SHARE/release   # REPO=owner/name TAG=xlite VERSION=...

          log() { logger -t xlite "$*"; }

          core_path() {
          	local c
          	c=$(uci -q get xlite.main.core)
          	[ -n "$c" ] && [ -x "$c" ] && { echo "$c"; return 0; }
          	for c in $SHARE/bin/xray /usr/bin/xray /tmp/xlite-core/xray; do
          		[ -x "$c" ] && { echo "$c"; return 0; }
          	done
          	# small flash: the core is kept compressed and unpacked to RAM at start
          	if [ -s $SHARE/bin/xray.gz ]; then
          		mkdir -p /tmp/xlite-core && gzip -dc $SHARE/bin/xray.gz > /tmp/xlite-core/xray.new && chmod 755 /tmp/xlite-core/xray.new &&
          			mv /tmp/xlite-core/xray.new /tmp/xlite-core/xray && { echo /tmp/xlite-core/xray; return 0; }
          	fi
          	return 1
          }

          ipv6_rules() { grep -q 'tproxy ip6' $RUN/rules.nft 2>/dev/null; }

          rules_down() {
          	nft delete table inet xlite 2>/dev/null
          	nft delete table inet xlite_nat 2>/dev/null
          	while ip rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip route flush table $TABLE 2>/dev/null
          	while ip -6 rule del fwmark 0x40/0xc0 table $TABLE 2>/dev/null; do :; done
          	ip -6 route flush table $TABLE 2>/dev/null
          	return 0
          }

          rules_up() {
          	[ -s $RUN/rules.nft ] || return 0
          	rules_down
          	if ! nft -f $RUN/rules.nft; then
          		log "nft rules failed to load (see: nft -c -f $RUN/rules.nft)"
          		return 1
          	fi
          	if [ -s $RUN/redirect.nft ]; then
          		nft -f $RUN/redirect.nft || { log "redirect rules failed"; rules_down; return 1; }
          	else
          		ip rule add fwmark 0x40/0xc0 table $TABLE
          		ip route add local 0.0.0.0/0 dev lo table $TABLE
          		if ipv6_rules; then
          			ip -6 rule add fwmark 0x40/0xc0 table $TABLE
          			ip -6 route add local ::/0 dev lo table $TABLE
          		fi
          	fi
          	return 0
          }

          # wait until the core listens, then send the traffic to it
          rules_when_ready() {
          	local port i=0
          	port=$(uci -q get xlite.main.tproxy_port); port=${port:-52345}
          	while [ $i -lt 40 ]; do
          		if netstat -ltn 2>/dev/null | grep -q "[:.]$port "; then
          			rules_up && log "running"
          			return
          		fi
          		i=$((i + 1)); sleep 0.25
          	done
          	log "the core did not start listening on port $port: rules not applied (logread -e xray)"
          }

          sysctl_apply() {
          	local cc fw
          	cc=$(uci -q get xlite.main.tcp_cc)
          	[ -n "$cc" ] && sysctl -q -w net.ipv4.tcp_congestion_control="$cc" > /dev/null 2>&1
          	fw=$(uci -q get xlite.main.ip_forward)
          	[ "$fw" = 1 ] && sysctl -q -w net.ipv4.ip_forward=1 > /dev/null 2>&1
          	return 0
          }

          stop_v2raya() {
          	[ -x /etc/init.d/v2raya ] || return 0
          	if /etc/init.d/v2raya enabled 2>/dev/null || pidof v2raya > /dev/null; then
          		/etc/init.d/v2raya disable 2>/dev/null
          		uci -q set v2raya.config.enabled=0 && uci -q commit v2raya
          		# its own stop can hang (seen on the MX2000): give it 3 s, then kill
          		( /etc/init.d/v2raya stop > /dev/null 2>&1 & ); sleep 3
          		killall -9 v2raya v2ray xray 2>/dev/null
          		nft delete table inet v2raya 2>/dev/null
          		log "v2rayA stopped and disabled (XLite replaces it)"
          	fi
          	return 0
          }

          ping_server() {   # $1 = server section id
          	local hp host port ip uip t
          	hp=$($UC server "$1" 2>/dev/null) || { echo -1; return 1; }
          	host=${hp% *}; port=${hp##* }
          	ip=$($UC resolve "$host" 2>/dev/null | head -n 1)
          	[ -n "$ip" ] && [ -n "$port" ] || { echo -1; return 1; }
          	# the ping must not go through the proxy
          	case "$ip" in
          	*:*) nft add element inet xlite bypass6 "{ $ip }" 2>/dev/null; uip="[$ip]" ;;
          	*) nft add element inet xlite bypass4 "{ $ip }" 2>/dev/null; uip=$ip ;;
          	esac
          	if nft list table inet v2raya > /dev/null 2>&1; then
          		# v2rayA is still running: it would catch a TCP ping, so use ICMP until XLite takes over
          		t=$(ping -c 1 -W 2 "$ip" 2>/dev/null | sed -n 's/.*time=\([0-9.]*\) *ms.*/\1/p' | head -n 1)
          		[ -n "$t" ] || { echo -1; return 1; }
          		awk -v t="$t" 'BEGIN { printf "%d\n", t + 0.5 }'
          		return 0
          	fi
          	t=$(curl -s --noproxy '*' -o /dev/null --connect-timeout 3 -m 4 -w '%{time_connect}' "http://$uip:$port/" 2>/dev/null)
          	case "$t" in ''|0|0.000|0.000000) echo -1; return 1 ;; esac
          	awk -v t="$t" 'BEGIN { printf "%d\n", t * 1000 + 0.5 }'
          }

          fetch() {   # $1 = url, $2 = file
          	if command -v curl > /dev/null; then curl -fsSL --retry 2 --connect-timeout 15 -o "$2" "$1"
          	else wget -q -O "$2" "$1"; fi
          }

          do_update() {
          	local tmp
          	[ -n "$REPO" ] || { echo "update source unknown (reinstall with the install command)"; return 1; }
          	tmp=$(mktemp -d /tmp/xlite-up.XXXXXX) || return 1
          	if ! fetch "https://github.com/$REPO/releases/download/${TAG:-xlite}/install.sh" "$tmp/install.sh"; then
          		rm -rf "$tmp"; echo "download failed (no internet?)"; return 1
          	fi
          	XLITE_UPDATE=1 sh "$tmp/install.sh"
          	local rc=$?
          	rm -rf "$tmp"
          	return $rc
          }

          do_uninstall() {
          	/etc/init.d/xlite stop 2>/dev/null
          	/etc/init.d/xlite disable 2>/dev/null
          	rules_down
          	for f in $(cat $SHARE/files 2>/dev/null); do rm -f "$f"; done
          	rm -rf $SHARE /usr/share/ucode/xlite /www/luci-static/resources/view/xlite $RUN /tmp/xlite-core
          	rm -f /etc/init.d/xlite /usr/bin/xlite /etc/hotplug.d/iface/90-xlite /usr/share/rpcd/ucode/xlite.uc \
          		/usr/share/rpcd/acl.d/luci-app-xlite.json /usr/share/luci/menu.d/luci-app-xlite.json
          	rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
          	/etc/init.d/rpcd reload 2>/dev/null
          	if [ -x /etc/init.d/v2raya ]; then
          		uci -q set v2raya.config.enabled=1 && uci -q commit v2raya
          		/etc/init.d/v2raya enable && /etc/init.d/v2raya start
          		echo "v2rayA is running again"
          	fi
          	echo "XLite removed (settings kept in /etc/config/xlite; delete it by hand if you want)"
          }

          case "$1" in
          prepare)
          	rm -rf $RUN && mkdir -p $RUN
          	$UC build $RUN
          	;;
          rules_up) rules_up ;;
          rules_when_ready) rules_when_ready ;;
          rules_down) rules_down ;;
          sysctl) sysctl_apply ;;
          stop_v2raya) stop_v2raya ;;
          core) core_path ;;
          refresh_ips)
          	# an interface got a new address: refresh the set of the router's own addresses
          	nft list table inet xlite > /dev/null 2>&1 || exit 0
          	nft flush set inet xlite local_ips 2>/dev/null
          	for a in $(ip -4 -o addr show | sed -n 's/.* inet \([0-9.]*\)\/.*/\1/p'); do nft add element inet xlite local_ips "{ $a }" 2>/dev/null; done
          	if nft list set inet xlite local_ips6 > /dev/null 2>&1; then
          		nft flush set inet xlite local_ips6
          		for a in $(ip -6 -o addr show | sed -n 's/.* inet6 \([0-9a-fA-F:]*\)\/.*/\1/p'); do nft add element inet xlite local_ips6 "{ $a }" 2>/dev/null; done
          	fi
          	;;
          start|stop|restart|reload|enable|disable) /etc/init.d/xlite "$1" ;;
          status)
          	echo "version: ${VERSION:-?}"
          	if pidof xray > /dev/null && nft list table inet xlite > /dev/null 2>&1; then echo "state:   running"; else echo "state:   stopped"; fi
          	[ -s $RUN/state.json ] && echo "server:  $(jsonfilter -i $RUN/state.json -e '@.name')"
          	echo "core:    $(core_path 2>/dev/null || echo missing)"
          	c=$(core_path 2>/dev/null) && grep -aq 'VLESS downlink splice' "$c" && echo "zero-copy: built in"
          	;;
          add) $UC add ;;
          ping) ping_server "$2" ;;
          update) do_update ;;
          uninstall) do_uninstall ;;
          *) sed -n '2,9p' "$0" | sed 's/^# \{0,1\}//'; exit 1 ;;
          esac
          XLITE_FILE_2
          chmod 755 "src/usr/bin/xlite"
          mkdir -p "$(dirname "src/usr/share/luci/menu.d/luci-app-xlite.json")"
          cat > "src/usr/share/luci/menu.d/luci-app-xlite.json" <<'XLITE_FILE_3'
          {
          	"admin/services/xlite": {
          		"title": "XLite",
          		"order": 5,
          		"action": { "type": "view", "path": "xlite/main" },
          		"depends": { "acl": [ "luci-app-xlite" ] }
          	}
          }
          XLITE_FILE_3
          mkdir -p "$(dirname "src/usr/share/rpcd/acl.d/luci-app-xlite.json")"
          cat > "src/usr/share/rpcd/acl.d/luci-app-xlite.json" <<'XLITE_FILE_4'
          {
          	"luci-app-xlite": {
          		"description": "XLite proxy",
          		"read": {
          			"ubus": { "xlite": [ "status", "servers", "settings", "ping", "link", "update_state", "log" ] },
          			"uci": [ "xlite" ]
          		},
          		"write": {
          			"ubus": { "xlite": [ "add", "remove", "rename", "edit", "select", "connect", "set_settings", "update" ] },
          			"uci": [ "xlite" ]
          		}
          	}
          }
          XLITE_FILE_4
          mkdir -p "$(dirname "src/usr/share/rpcd/ucode/xlite.uc")"
          cat > "src/usr/share/rpcd/ucode/xlite.uc" <<'XLITE_FILE_5'
          // XLite backend for LuCI (ubus object "xlite")
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';
          import * as lib from 'xlite.lib';

          const RUN = '/var/etc/xlite';
          const SETTINGS = {
          	transparent: [ 'off', 'all' ], impl: [ 'tproxy', 'redirect' ], ip_forward: [ '0', '1' ], port_sharing: [ '0', '1' ],
          	dns: [ 'proxy', 'direct' ], tfo: [ 'default', 'on', 'off' ], sniffing: [ 'off', 'http_tls', 'http_tls_quic' ],
          	mux: [ '0', '1' ], mux_conc: /^([1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$/, splice: [ '0', '1' ], gomaxprocs: /^[0-9]{0,2}$/,
          	gogc: /^[0-9]{0,4}$/, early_exit: [ '0', '1' ], tcp_cc: [ '', 'cubic', 'bbr' ], tproxy_port: /^[0-9]{2,5}$/,
          	socks_port: /^[0-9]{0,5}$/, http_port: /^[0-9]{0,5}$/, ipv6: [ 'auto', '0', '1' ], loglevel: [ 'warning', 'info', 'debug', 'error', 'none' ]
          };

          let splice_cache = {};

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function uci() {
          	let d = getenv('XLITE_UCI_DIR'), c = d ? cursor(d) : cursor();
          	c.load('xlite');
          	return c;
          }

          function restart_bg() {
          	system('( /etc/init.d/xlite restart > /dev/null 2>&1 & )');
          }

          function stop_bg() {
          	system('( /etc/init.d/xlite stop > /dev/null 2>&1 & )');
          }

          function core_pid() {
          	let j = null;
          	try { j = json(sh("ubus call service list '{\"name\":\"xlite\"}' 2>/dev/null")); } catch (e) {}
          	return j?.xlite?.instances?.xray?.running ? j.xlite.instances.xray.pid : null;
          }

          function first_num(s) {
          	let m = match(s ?? '', /([0-9]+)/);
          	return m ? +m[1] : null;
          }

          function cpu_counters() {
          	let r = [];
          	for (let l in split(fs.readfile('/proc/stat') ?? '', '\n')) {
          		let m = match(l, /^cpu([0-9]+) +(.*)$/);
          		if (!m)
          			continue;
          		let v = map(split(m[2], / +/), (x) => +x);
          		let idle = v[3] + (v[4] ?? 0), total = 0;
          		for (let x in v)
          			total += x;
          		push(r, [ total - idle, total ]);
          	}
          	return r;
          }

          function net_counters(dev) {
          	let base = '/sys/class/net/' + replace(dev ?? '', /[^A-Za-z0-9._@-]/g, '') + '/statistics/';
          	return { rx: +(trim(fs.readfile(base + 'rx_bytes') ?? '0')), tx: +(trim(fs.readfile(base + 'tx_bytes') ?? '0')) };
          }

          function splice_built(path) {
          	let st = fs.stat(path);
          	if (!st)
          		return false;
          	let key = path + ':' + st.size + ':' + st.mtime;
          	if (splice_cache[key] == null)
          		splice_cache[key] = (trim(sh("grep -aq 'VLESS downlink splice' '" + replace(path, /'/g, '') + "' && echo y")) == 'y');
          	return splice_cache[key];
          }

          function release() {
          	let r = {};
          	for (let l in split(fs.readfile('/usr/share/xlite/release') ?? '', '\n')) {
          		let m = match(l, /^([A-Z]+)=(.*)$/);
          		if (m)
          			r[lc(m[1])] = m[2];
          	}
          	return r;
          }

          function server_list(c, cur) {
          	let r = [];
          	c.foreach('xlite', 'server', (s) => {
          		let p = lib.parse_link(s.link);
          		push(r, {
          			id: s['.name'], name: s.name || p.name || '?', protocol: p.protocol ?? '?', net: p.net ?? '',
          			header: p.type ?? '', security: p.security ?? '', valid: !p.error, error: p.error, current: s['.name'] == cur
          		});
          	});
          	return r;
          }

          const methods = {
          	status: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {};
          			let st = null;
          			try { st = json(fs.readfile(RUN + '/state.json') ?? 'null'); } catch (e) {}
          			let pid = core_pid(), up = null, mem = null, core = trim(sh('/usr/bin/xlite core 2>/dev/null'));
          			if (pid) {
          				let stat = fs.readfile('/proc/' + pid + '/stat') ?? '';
          				let f = split(substr(stat, rindex(stat, ')') + 2), ' ');
          				let uptime = +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0];
          				up = int(uptime - (+f[19]) / 100);
          				mem = first_num(match(fs.readfile('/proc/' + pid + '/status') ?? '', /VmRSS:[^\n]*/)?.[0]);
          			}
          			let rules = (system('nft list table inet xlite > /dev/null 2>&1') == 0);
          			let wan = st?.wan?.[0] ?? 'wan';
          			let srv = filter(server_list(c, opt.server), (s) => s.current)[0];
          			let mi = {};
          			for (let l in split(fs.readfile('/proc/meminfo') ?? '', '\n')) {
          				let m = match(l, /^(MemTotal|MemAvailable): +([0-9]+)/);
          				if (m) mi[m[1]] = +m[2];
          			}
          			return {
          				enabled: opt.enabled == '1', running: !!pid, rules, uptime: up, core_rss_kb: mem,
          				server: srv ? { id: srv.id, name: srv.name, protocol: srv.protocol, net: srv.net, header: srv.header, security: srv.security } : null,
          				core: core, core_splice: core ? splice_built(core) : false, splice_on: opt.splice != '0',
          				wan, net: net_counters(wan), cpu: cpu_counters(), now: +split(fs.readfile('/proc/uptime') ?? '0', ' ')[0],
          				mem_total_kb: mi.MemTotal, mem_avail_kb: mi.MemAvailable,
          				v2raya: !!fs.stat('/etc/init.d/v2raya'), release: release(), servers: length(server_list(c, opt.server))
          			};
          		}
          	},

          	servers: {
          		call: function() {
          			let c = uci();
          			return { servers: server_list(c, c.get('xlite', 'main', 'server')) };
          		}
          	},

          	add: {
          		args: { links: '' },
          		call: function(req) {
          			let c = uci(), report = [], first = null;
          			for (let l in split(req.args?.links ?? '', /[\r\n ]+/)) {
          				l = trim(l);
          				if (l == '')
          					continue;
          				let p = lib.parse_link(l);
          				if (p.error) {
          					push(report, { ok: false, error: p.error });
          					continue;
          				}
          				let dup = null, key = replace(p.link, /#.*$/, '');
          				c.foreach('xlite', 'server', (s) => { if (replace(s.link ?? '', /#.*$/, '') == key) dup = s['.name']; });
          				if (dup) {
          					push(report, { ok: true, dup: true, name: p.name });
          					continue;
          				}
          				let id = c.add('xlite', 'server');
          				c.set('xlite', id, 'name', p.name);
          				c.set('xlite', id, 'link', p.link);
          				first ??= id;
          				push(report, { ok: true, name: p.name, id });
          			}
          			let restart = false;
          			if (first && !c.get('xlite', 'main', 'server')) {
          				c.set('xlite', 'main', 'server', first);
          				restart = (c.get('xlite', 'main', 'enabled') == '1');
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart)
          				restart_bg();
          			return { report };
          		}
          	},

          	remove: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.delete('xlite', id);
          			let cur = c.get('xlite', 'main', 'server'), restart = false;
          			if (cur == id) {
          				let next = null;
          				c.foreach('xlite', 'server', (s) => { next ??= s['.name']; });
          				if (next)
          					c.set('xlite', 'main', 'server', next);
          				else
          					c.delete('xlite', 'main', 'server');
          				restart = true;
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (restart && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	rename: {
          		args: { id: '', name: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, name = trim(req.args?.name ?? '');
          			if (c.get('xlite', id) != 'server' || name == '' || length(name) > 64)
          				return { ok: false };
          			c.set('xlite', id, 'name', name);
          			c.save('xlite');
          			c.commit('xlite');
          			return { ok: true };
          		}
          	},

          	link: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci();
          			return { link: c.get('xlite', req.args?.id ?? '', 'link') };
          		}
          	},

          	edit: {
          		args: { id: '', link: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id, p = lib.parse_link(req.args?.link ?? '');
          			if (c.get('xlite', id) != 'server')
          				return { ok: false, error: 'السيرفر غير موجود' };
          			if (p.error)
          				return { ok: false, error: p.error };
          			c.set('xlite', id, 'link', p.link);
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'server') == id && c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: true };
          		}
          	},

          	select: {
          		args: { id: '' },
          		call: function(req) {
          			let c = uci(), id = req.args?.id;
          			if (c.get('xlite', id) != 'server')
          				return { ok: false };
          			c.set('xlite', 'main', 'server', id);
          			c.set('xlite', 'main', 'enabled', '1');
          			c.save('xlite');
          			c.commit('xlite');
          			system('/etc/init.d/xlite enable > /dev/null 2>&1');
          			restart_bg();
          			return { ok: true };
          		}
          	},

          	connect: {
          		args: { on: false },
          		call: function(req) {
          			let c = uci(), on = !!req.args?.on;
          			if (on && !c.get('xlite', 'main', 'server')) {
          				let first = null;
          				c.foreach('xlite', 'server', (s) => { first ??= s['.name']; });
          				if (!first)
          					return { ok: false, error: 'ضيف سيرفر أول' };
          				c.set('xlite', 'main', 'server', first);
          			}
          			c.set('xlite', 'main', 'enabled', on ? '1' : '0');
          			c.save('xlite');
          			c.commit('xlite');
          			if (on) {
          				system('/etc/init.d/xlite enable > /dev/null 2>&1');
          				restart_bg();
          			}
          			else
          				stop_bg();
          			return { ok: true };
          		}
          	},

          	ping: {
          		args: { id: '' },
          		call: function(req) {
          			let id = replace(req.args?.id ?? '', /[^A-Za-z0-9_]/g, '');
          			let ms = +trim(sh('/usr/bin/xlite ping ' + id + ' 2>/dev/null') || '-1');
          			return { id, ms };
          		}
          	},

          	settings: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {}, r = {};
          			for (let k in SETTINGS)
          				r[k] = opt[k] ?? '';
          			r.bypass = opt.bypass ?? '';
          			return { settings: r, tcp_cc_now: trim(fs.readfile('/proc/sys/net/ipv4/tcp_congestion_control') ?? ''),
          				tcp_cc_avail: split(trim(fs.readfile('/proc/sys/net/ipv4/tcp_available_congestion_control') ?? ''), ' ') };
          		}
          	},

          	set_settings: {
          		args: { values: {} },
          		call: function(req) {
          			let c = uci(), v = req.args?.values ?? {}, bad = [];
          			for (let k in v) {
          				let rule = SETTINGS[k], val = '' + v[k];
          				if (k == 'bypass') {
          					if (!match(val, /^[0-9A-Fa-f:.\/ ]*$/)) push(bad, k);
          					else c.set('xlite', 'main', k, trim(val));
          					continue;
          				}
          				if (!rule || (type(rule) == 'array' ? index(rule, val) < 0 : !match(val, rule))) {
          					push(bad, k);
          					continue;
          				}
          				c.set('xlite', 'main', k, val);
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			if (c.get('xlite', 'main', 'enabled') == '1')
          				restart_bg();
          			return { ok: !length(bad), bad };
          		}
          	},

          	update: {
          		call: function() {
          			system('( /usr/bin/xlite update > /tmp/xlite-update.log 2>&1; echo "rc=$?" >> /tmp/xlite-update.log ) > /dev/null 2>&1 &');
          			return { ok: true };
          		}
          	},

          	update_state: {
          		call: function() {
          			return { log: fs.readfile('/tmp/xlite-update.log') ?? '' };
          		}
          	},

          	log: {
          		call: function() {
          			return { log: sh("logread 2>/dev/null | grep -E 'xlite|xray' | tail -n 60") };
          		}
          	}
          };

          return { xlite: methods };
          XLITE_FILE_5
          mkdir -p "$(dirname "src/usr/share/ucode/xlite/lib.uc")"
          cat > "src/usr/share/ucode/xlite/lib.uc" <<'XLITE_FILE_6'
          // XLite: share links -> xray outbounds, xray config and the nftables tproxy ruleset.
          'use strict';

          const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

          function b64decode(s) {
          	if (s == null)
          		return null;
          	s = replace(replace(trim('' + s), /-/g, '+'), /_/g, '/');
          	s = replace(s, /[^A-Za-z0-9+\/]/g, '');
          	if (type(b64dec) == 'function') {
          		let pad = s;
          		while (length(pad) % 4)
          			pad += '=';
          		let r = b64dec(pad);
          		if (r != null)
          			return r;
          	}
          	let out = '', bits = 0, nb = 0;
          	for (let i = 0; i < length(s); i++) {
          		let v = index(B64, substr(s, i, 1));
          		if (v < 0)
          			return null;
          		bits = ((bits << 6) | v) & 0xffffff;
          		nb += 6;
          		if (nb >= 8) {
          			nb -= 8;
          			out += chr((bits >> nb) & 0xff);
          		}
          	}
          	return out;
          }

          function urldecode(s) {
          	if (s == null)
          		return null;
          	s = replace('' + s, /\+/g, ' ');
          	return replace(s, /%([0-9A-Fa-f]{2})/g, (m, h) => chr(hex(h)));
          }

          function parse_query(q) {
          	let r = {};
          	for (let kv in split(q ?? '', '&')) {
          		if (kv == '')
          			continue;
          		let i = index(kv, '=');
          		let k = urldecode(i < 0 ? kv : substr(kv, 0, i));
          		r[k] = (i < 0) ? '' : urldecode(substr(kv, i + 1));
          	}
          	return r;
          }

          // scheme://userinfo@host:port?query#fragment  (host may be [v6])
          function parse_url(link) {
          	let m = match(link, /^([A-Za-z0-9+.-]+):\/\/([^#]*)(#(.*))?$/);
          	if (!m)
          		return null;
          	let rest = m[2], frag = urldecode(m[4] ?? '');
          	let q = '', qi = index(rest, '?');
          	if (qi >= 0) {
          		q = substr(rest, qi + 1);
          		rest = substr(rest, 0, qi);
          	}
          	rest = replace(rest, /\/+$/, '');
          	let user = null, at = rindex(rest, '@');
          	if (at >= 0) {
          		user = urldecode(substr(rest, 0, at));
          		rest = substr(rest, at + 1);
          	}
          	let host, port;
          	let hm = match(rest, /^\[([0-9A-Fa-f:.]+)\]:([0-9]+)$/) || match(rest, /^([^:]+):([0-9]+)$/);
          	if (hm) {
          		host = hm[1];
          		port = +hm[2];
          	}
          	else {
          		host = rest;
          		port = null;
          	}
          	return { scheme: lc(m[1]), user, host, port, query: parse_query(q), name: frag };
          }

          function csv(s) {
          	return filter(map(split(s ?? '', ','), (x) => trim(x)), (x) => x != '');
          }

          // One server = the fields of a share link, the same names v2rayA uses.
          export function parse_link(link) {
          	link = trim('' + (link ?? ''));
          	let scheme = lc(match(link, /^([A-Za-z0-9+.-]+):\/\//)?.[1] ?? '');
          	let s;

          	if (scheme == 'vmess') {
          		let j = null;
          		try { j = json(b64decode(substr(link, 8))); } catch (e) { j = null; }
          		if (type(j) != 'object')
          			return { error: 'رابط vmess غير صالح' };
          		s = {
          			protocol: 'vmess', name: j.ps ?? '', address: j.add ?? '', port: +(j.port ?? 0),
          			id: j.id ?? '', aid: +(j.aid ?? 0), scy: j.scy ?? 'auto', net: j.net || 'tcp',
          			type: j.type || 'none', host: j.host ?? '', path: j.path ?? '',
          			security: (j.tls == 'tls' || j.tls == 'reality') ? j.tls : 'none',
          			sni: j.sni ?? '', alpn: j.alpn ?? '', fp: j.fp ?? ''
          		};
          	}
          	else if (scheme == 'vless' || scheme == 'trojan') {
          		let u = parse_url(link);
          		if (!u || !u.port)
          			return { error: 'الرابط ناقص: لازم يكون ' + scheme + '://...@العنوان:البورت' };
          		let q = u.query;
          		s = {
          			protocol: scheme, name: u.name ?? '', address: u.host, port: u.port,
          			id: u.user ?? '', net: q.type || 'tcp', type: q.headerType || 'none',
          			host: q.host ?? '', path: q.path ?? '', security: q.security || (scheme == 'trojan' ? 'tls' : 'none'),
          			sni: q.sni ?? q.peer ?? '', alpn: q.alpn ?? '', fp: q.fp ?? '', pbk: q.pbk ?? '', sid: q.sid ?? '',
          			spx: q.spx ?? '', flow: q.flow ?? '', mode: q.mode ?? '', service: q.serviceName ?? '',
          			insecure: (q.allowInsecure == '1' || q.allowInsecure == 'true' || q.insecure == '1')
          		};
          		if (s.net == 'grpc' && s.service != '')
          			s.path = s.service;
          	}
          	else if (scheme == 'ss') {
          		let u = parse_url(link), method, pass, host, port;
          		if (u && u.user != null && u.port) {
          			let ui = u.user;
          			if (index(ui, ':') < 0)
          				ui = b64decode(ui) ?? '';
          			let c = index(ui, ':');
          			method = substr(ui, 0, c); pass = substr(ui, c + 1);
          			host = u.host; port = u.port;
          		}
          		else {
          			let m = match(link, /^ss:\/\/([^#@?]+)(#(.*))?$/);
          			let d = m ? b64decode(m[1]) : null;
          			let mm = d ? match(d, /^([^:]+):(.*)@([^@]+):([0-9]+)$/) : null;
          			if (!mm)
          				return { error: 'رابط shadowsocks غير صالح' };
          			method = mm[1]; pass = mm[2]; host = replace(mm[3], /^\[|\]$/g, ''); port = +mm[4];
          			u = { name: urldecode(m[3] ?? '') };
          		}
          		s = { protocol: 'shadowsocks', name: u.name ?? '', address: host, port, method, password: pass, net: 'tcp', security: 'none' };
          	}
          	else
          		return { error: 'نوع الرابط غير مدعوم (المدعوم: vless و vmess و trojan و ss)' };

          	if (lc(s.net) == 'raw')
          		s.net = 'tcp';
          	if (!s.address || !(s.port > 0 && s.port < 65536))
          		return { error: 'الرابط ما بيه عنوان أو بورت صحيح' };
          	if (s.name == '')
          		s.name = s.address;
          	s.link = link;
          	return s;
          }

          const UA = [
          	'Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.75 Safari/537.36',
          	'Mozilla/5.0 (iPhone; CPU iPhone OS 10_0_2 like Mac OS X) AppleWebKit/601.1 (KHTML, like Gecko) CriOS/53.0.2785.109 Mobile/14A456 Safari/601.1.46'
          ];

          function stream_settings(s, opt) {
          	let net = lc(s.net ?? 'tcp');
          	let ss = { network: net, security: s.security ?? 'none' };

          	if (net == 'tcp' && lc(s.type ?? '') == 'http') {
          		// the same request/response header v2rayA sends (the server checks the path)
          		let paths = map(csv(s.path), (p) => (substr(p, 0, 1) == '/') ? p : '/' + p);
          		ss.tcpSettings = { header: {
          			type: 'http',
          			request: {
          				version: '1.1', method: 'GET', path: length(paths) ? paths : [ '/' ],
          				headers: {
          					Host: csv(s.host),
          					'User-Agent': UA,
          					'Accept-Encoding': [ 'gzip, deflate' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			},
          			response: {
          				version: '1.1', status: '200', reason: 'OK',
          				headers: {
          					'Content-Type': [ 'application/octet-stream', 'video/mpeg' ],
          					'Transfer-Encoding': [ 'chunked' ],
          					Connection: [ 'keep-alive' ],
          					Pragma: 'no-cache'
          				}
          			}
          		} };
          	}
          	else if (net == 'ws')
          		ss.wsSettings = { path: s.path || '/', headers: (s.host ? { Host: s.host } : {}) };
          	else if (net == 'grpc')
          		ss.grpcSettings = { serviceName: s.path || '', multiMode: (s.mode == 'multi') };
          	else if (net == 'httpupgrade')
          		ss.httpupgradeSettings = { path: s.path || '/', host: s.host ?? '' };
          	else if (net == 'xhttp' || net == 'splithttp')
          		ss.xhttpSettings = { path: s.path || '/', host: s.host ?? '', mode: s.mode || 'auto' };
          	else if (net == 'h2' || net == 'http')
          		ss.httpSettings = { path: s.path || '/', host: csv(s.host) };

          	if (ss.security == 'tls') {
          		ss.tlsSettings = { serverName: s.sni || s.host || s.domain || s.address, allowInsecure: !!s.insecure };
          		if (s.alpn)
          			ss.tlsSettings.alpn = csv(s.alpn);
          		if (s.fp)
          			ss.tlsSettings.fingerprint = s.fp;
          	}
          	else if (ss.security == 'reality')
          		ss.realitySettings = {
          			serverName: s.sni || s.domain || '', fingerprint: s.fp || 'chrome',
          			publicKey: s.pbk ?? '', shortId: s.sid ?? '', spiderX: s.spx ?? ''
          		};
          	else
          		ss.security = 'none';

          	ss.sockopt = { mark: 128 };
          	if (opt.tfo == 'on')
          		ss.sockopt.tcpFastOpen = true;
          	else if (opt.tfo == 'off')
          		ss.sockopt.tcpFastOpen = false;
          	return ss;
          }

          // s.ip: the address already resolved by the caller (a domain would need DNS, and DNS itself goes
          // through the proxy: the outbound always gets an IP)
          export function outbound(s, opt) {
          	opt ??= {};
          	let addr = s.ip || s.address;
          	let o = { tag: 'proxy', protocol: s.protocol };
          	if (addr != s.address)
          		s = { ...s, domain: s.address };

          	if (s.protocol == 'vless')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, encryption: 'none', flow: s.flow ?? '' } ] } ] };
          	else if (s.protocol == 'vmess')
          		o.settings = { vnext: [ { address: addr, port: +s.port, users: [ { id: s.id, alterId: +(s.aid ?? 0), security: s.scy || 'auto' } ] } ] };
          	else if (s.protocol == 'trojan')
          		o.settings = { servers: [ { address: addr, port: +s.port, password: s.id } ] };
          	else if (s.protocol == 'shadowsocks')
          		o.settings = { servers: [ { address: addr, port: +s.port, method: s.method, password: s.password } ] };

          	o.streamSettings = stream_settings(s, opt);
          	if (opt.mux && !s.flow)
          		o.mux = { enabled: true, concurrency: +(opt.mux_conc ?? 8) };
          	return o;
          }

          export const PRIVATE4 = [
          	'0.0.0.0/8', '10.0.0.0/8', '100.64.0.0/10', '127.0.0.0/8', '169.254.0.0/16', '172.16.0.0/12',
          	'192.0.0.0/24', '192.0.2.0/24', '192.88.99.0/24', '192.168.0.0/16', '198.18.0.0/15',
          	'198.51.100.0/24', '203.0.113.0/24', '224.0.0.0/4', '240.0.0.0/4'
          ];
          export const PRIVATE6 = [ '::/127', '::ffff:0:0/96', '64:ff9b::/96', '100::/64', 'fc00::/7', 'fe80::/10', 'ff00::/8' ];

          // opt: the uci "main" section; srv: the server (with .ip); ctx: { ipv6, port }
          export function xray_config(opt, srv, ctx) {
          	let share = (opt.port_sharing == '1');
          	let inb = [];
          	let sniff = { enabled: false };
          	if (opt.sniffing == 'http_tls')
          		sniff = { enabled: true, destOverride: [ 'http', 'tls' ], routeOnly: true };
          	else if (opt.sniffing == 'http_tls_quic')
          		sniff = { enabled: true, destOverride: [ 'http', 'tls', 'quic' ], routeOnly: true };

          	if (opt.transparent != 'off') {
          		let tp = { tproxy: opt.impl == 'redirect' ? 'redirect' : 'tproxy' };
          		push(inb, { tag: 'transparent', listen: (share || opt.impl == 'redirect') ? '0.0.0.0' : '127.0.0.1', port: +ctx.port, protocol: 'dokodemo-door',
          			settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          		if (ctx.ipv6)
          			push(inb, { tag: 'transparent6', listen: '::1', port: +ctx.port, protocol: 'dokodemo-door',
          				settings: { network: 'tcp,udp', followRedirect: true }, streamSettings: { sockopt: tp }, sniffing: sniff });
          	}
          	if (+opt.socks_port > 0)
          		push(inb, { tag: 'socks', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.socks_port, protocol: 'socks',
          			settings: { udp: true }, sniffing: sniff });
          	if (+opt.http_port > 0)
          		push(inb, { tag: 'http', listen: share ? '0.0.0.0' : '127.0.0.1', port: +opt.http_port, protocol: 'http', sniffing: sniff });

          	let mux = (opt.mux == '1');
          	let ob = [ outbound(srv, { tfo: opt.tfo, mux, mux_conc: opt.mux_conc }),
          		{ tag: 'direct', protocol: 'freedom', streamSettings: { sockopt: { mark: 128 } } },
          		{ tag: 'block', protocol: 'blackhole' } ];

          	let rules = [ { type: 'field', ip: [ ...PRIVATE4, '::1/128', 'fc00::/7', 'fe80::/10', 'ff00::/8' ], outboundTag: 'direct' } ];
          	push(rules, { type: 'field', network: 'tcp,udp', outboundTag: 'proxy' });

          	return {
          		log: { loglevel: opt.loglevel || 'warning', access: 'none' },
          		inbounds: inb,
          		outbounds: ob,
          		routing: { domainStrategy: 'AsIs', rules }
          	};
          }

          function nft_set(name, typ, elems) {
          	let s = `\tset ${name} {\n\t\ttype ${typ}\n\t\tflags interval\n\t\tauto-merge\n`;
          	if (length(elems))
          		s += `\t\telements = { ${join(', ', elems)} }\n`;
          	return s + '\t}\n';
          }

          function q(n) {
          	return '"' + replace(n, /[^A-Za-z0-9._@-]/g, '') + '"';
          }

          // ctx: { port, ipv6, wan: [devs], lan: [devs], local4: [], local6: [], bypass4: [], bypass6: [] }
          export function nft_rules(opt, ctx) {
          	let fam = ctx.ipv6 ? 'meta nfproto { ipv4, ipv6 }' : 'meta nfproto ipv4';
          	let early = (opt.early_exit != '0');
          	let r = 'table inet xlite {\n';
          	r += nft_set('whitelist', 'ipv4_addr', PRIVATE4);
          	r += nft_set('whitelist6', 'ipv6_addr', PRIVATE6);
          	r += nft_set('local_ips', 'ipv4_addr', ctx.local4 ?? []);
          	r += nft_set('local_ips6', 'ipv6_addr', ctx.local6 ?? []);
          	r += nft_set('bypass4', 'ipv4_addr', ctx.bypass4 ?? []);
          	r += nft_set('bypass6', 'ipv6_addr', ctx.bypass6 ?? []);

          	r += '\tchain tp_out {\n';
          	if (early)
          		for (let d in ctx.lan ?? [])
          			r += `\t\toifname ${q(d)} return\n`;
          	r += '\t\tmeta mark & 0x80 == 0x80 return\n';
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type local fib daddr type != local jump tp_rule\n';
          	r += '\t}\n';

          	r += '\tchain tp_pre {\n';
          	if (early)
          		for (let d in ctx.wan ?? [])
          			r += `\t\tiifname ${q(d)} return\n`;
          	r += '\t\tiifname "lo" mark & 0xc0 != 0x40 return\n';
          	r += '\t\tmeta l4proto { tcp, udp } fib saddr type != local fib daddr type != local jump tp_rule\n';
          	if (opt.impl != 'redirect') {
          		r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip to 127.0.0.1:${+ctx.port}\n`;
          		if (ctx.ipv6)
          			r += `\t\tmeta l4proto { tcp, udp } mark & 0xc0 == 0x40 tproxy ip6 to [::1]:${+ctx.port}\n`;
          	}
          	r += '\t}\n';

          	r += `\tchain output {\n\t\ttype route hook output priority mangle - 5; policy accept;\n\t\t${fam} jump tp_out\n\t}\n`;
          	r += `\tchain prerouting {\n\t\ttype filter hook prerouting priority mangle - 5; policy accept;\n\t\t${fam} jump tp_pre\n\t}\n`;

          	r += '\tchain tp_rule {\n';
          	r += '\t\tmeta mark set ct mark\n';
          	r += '\t\tmeta mark & 0xc0 == 0x40 return\n';
          	if (opt.dns == 'direct')
          		r += '\t\tmeta l4proto { tcp, udp } th dport 53 return\n';
          	r += '\t\tip daddr @local_ips return\n\t\tip6 daddr @local_ips6 return\n';
          	r += '\t\tip daddr @whitelist return\n\t\tip6 daddr @whitelist6 return\n';
          	r += '\t\tip daddr @bypass4 return\n\t\tip6 daddr @bypass6 return\n';
          	r += '\t\tjump iso\n';
          	r += '\t\tjump tp_mark\n';
          	r += '\t}\n';
          	r += '\tchain iso {\n\t}\n';
          	r += '\tchain tp_mark {\n';
          	r += '\t\ttcp flags & (fin | syn | rst | ack) == syn meta mark set mark | 0x40\n';
          	r += '\t\tmeta l4proto udp ct state new meta mark set mark | 0x40\n';
          	r += '\t\tct mark set mark\n';
          	r += '\t}\n';
          	r += '}\n';
          	return r;
          }

          // redirect mode (no tproxy kernel module): TCP only, like v2rayA's "redirect"
          export function nft_redirect(opt, ctx) {
          	let r = 'table inet xlite_nat {\n';
          	r += '\tchain prerouting {\n\t\ttype nat hook prerouting priority dstnat - 5; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '\tchain output {\n\t\ttype nat hook output priority -105; policy accept;\n';
          	r += `\t\tmeta l4proto tcp meta mark & 0xc0 == 0x40 redirect to :${+ctx.port}\n\t}\n`;
          	r += '}\n';
          	return r;
          }
          XLITE_FILE_6
          mkdir -p "$(dirname "src/usr/share/xlite/defaults")"
          cat > "src/usr/share/xlite/defaults" <<'XLITE_FILE_7'
          # option defaults: added to /etc/config/xlite when missing (install and update)
          enabled=0
          transparent=all
          impl=tproxy
          ip_forward=1
          port_sharing=0
          dns=proxy
          tfo=default
          sniffing=off
          mux=0
          mux_conc=8
          splice=1
          gomaxprocs=1
          gogc=200
          early_exit=1
          tcp_cc=
          tproxy_port=52345
          socks_port=20170
          http_port=20171
          ipv6=auto
          loglevel=warning
          XLITE_FILE_7
          mkdir -p "$(dirname "src/usr/share/xlite/gen.uc")"
          cat > "src/usr/share/xlite/gen.uc" <<'XLITE_FILE_8'
          // XLite helper: ucode /usr/share/xlite/gen.uc <command> [args]
          //   build <outdir>     xray config + nft rules + env for the selected server (exit 1 = nothing to run)
          //   add               share links on stdin (one per line) -> server sections; prints a JSON report
          //   resolve <host>    IPv4 addresses of a host (one per line)
          //   server <id>       "address port" of a server
          'use strict';
          import * as fs from 'fs';
          import { cursor } from 'uci';
          import * as lib from 'xlite.lib';

          const CONFDIR = getenv('XLITE_UCI_DIR');
          const IS_IP4 = /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/;
          const IS_IP6 = /^[0-9A-Fa-f:]+:[0-9A-Fa-f:.]*$/;

          function uci() {
          	let c = CONFDIR ? cursor(CONFDIR) : cursor();
          	c.load('xlite');
          	return c;
          }

          function sh(cmd) {
          	let p = fs.popen(cmd, 'r');
          	if (!p)
          		return '';
          	let out = p.read('all') ?? '';
          	p.close();
          	return out;
          }

          function lines(s) {
          	return filter(map(split(s ?? '', '\n'), (x) => trim(x)), (x) => x != '');
          }

          function shq(s) {
          	return "'" + replace('' + s, /'/g, "'\\''") + "'";
          }

          function resolve(host) {
          	if (match(host, IS_IP4))
          		return [ host ];
          	if (match(host, IS_IP6))
          		return [ host ];
          	let out = sh('nslookup ' + shq(host) + ' 2>/dev/null'), seen = false, ips = [];
          	for (let l in split(out, '\n')) {
          		if (match(l, /^Name:/))
          			seen = true;
          		else if (seen) {
          			let m = match(l, /([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          			if (m && index(ips, m[1]) < 0)
          				push(ips, m[1]);
          		}
          	}
          	return ips;
          }

          function ifdevs(ifaces) {
          	let devs = [];
          	for (let i in ifaces) {
          		let j = null;
          		try { j = json(sh('ubus call network.interface.' + replace(i, /[^A-Za-z0-9_-]/g, '') + ' status 2>/dev/null')); } catch (e) {}
          		for (let d in [ j?.l3_device, j?.device ])
          			if (d && index(devs, d) < 0)
          				push(devs, d);
          	}
          	return devs;
          }

          function zone_networks(c, zname) {
          	let nets = [];
          	c.load('firewall');
          	c.foreach('firewall', 'zone', (z) => {
          		if (z.name == zname)
          			for (let n in (type(z.network) == 'array' ? z.network : split(z.network ?? '', ' ')))
          				if (n != '')
          					push(nets, n);
          	});
          	return nets;
          }

          function local_ips(fam) {
          	let ips = [];
          	for (let l in lines(sh('ip -' + fam + ' -o addr show 2>/dev/null'))) {
          		let m = match(l, fam == 4 ? /inet ([0-9.]+)\// : /inet6 ([0-9a-fA-F:]+)\//);
          		if (m && index(ips, m[1]) < 0)
          			push(ips, m[1]);
          	}
          	return ips;
          }

          function ipv6_on(opt) {
          	if (opt.ipv6 == '0')
          		return false;
          	if (!fs.stat('/proc/net/if_inet6'))
          		return false;
          	if (opt.ipv6 == '1')
          		return true;
          	return length(lines(sh('ip -6 route show default 2>/dev/null'))) > 0;
          }

          function servers(c) {
          	let r = [];
          	c.foreach('xlite', 'server', (s) => {
          		let p = lib.parse_link(s.link);
          		push(r, { id: s['.name'], name: s.name || p.name, link: s.link, parsed: p });
          	});
          	return r;
          }

          function build(outdir) {
          	let c = uci();
          	let opt = c.get_all('xlite', 'main') ?? {};
          	let all = servers(c);
          	let cur = filter(all, (s) => s.id == opt.server)[0] ?? all[0];
          	if (!cur) {
          		warn('xlite: no server: add one first\n');
          		return 1;
          	}
          	if (cur.parsed.error) {
          		warn('xlite: the selected server link is not valid: ' + cur.parsed.error + '\n');
          		return 1;
          	}
          	let srv = { ...cur.parsed };
          	let ips = resolve(srv.address);
          	if (!length(ips)) {
          		warn('xlite: cannot resolve the server address\n');
          		return 1;
          	}
          	srv.ip = ips[0];

          	let ctx = {
          		port: +(opt.tproxy_port || 52345),
          		ipv6: ipv6_on(opt),
          		wan: ifdevs(length(zone_networks(c, 'wan')) ? zone_networks(c, 'wan') : [ 'wan', 'wan6' ]),
          		lan: ifdevs(length(zone_networks(c, 'lan')) ? zone_networks(c, 'lan') : [ 'lan' ]),
          		local4: local_ips(4),
          		local6: local_ips(6),
          		bypass4: [], bypass6: []
          	};
          	// every server goes direct (the core's own connection is marked anyway; this keeps the ping
          	// of the other servers and a server switch away from the proxy)
          	for (let s in all) {
          		if (s.parsed.error)
          			continue;
          		for (let ip in (s.id == cur.id ? ips : resolve(s.parsed.address)))
          			if (match(ip, IS_IP4)) { if (index(ctx.bypass4, ip) < 0) push(ctx.bypass4, ip); }
          			else if (index(ctx.bypass6, ip) < 0) push(ctx.bypass6, ip);
          	}
          	for (let a in split(opt.bypass ?? '', ' '))
          		if (match(a, /^[0-9.\/]+$/)) push(ctx.bypass4, a);
          		else if (match(a, /^[0-9A-Fa-f:.\/]+$/) && index(a, ':') >= 0) push(ctx.bypass6, a);

          	fs.mkdir(outdir);
          	let cfg = lib.xray_config(opt, srv, ctx);
          	fs.writefile(outdir + '/config.json', sprintf('%.2J\n', cfg));
          	fs.writefile(outdir + '/rules.nft', (opt.transparent == 'off') ? '' : lib.nft_rules(opt, ctx));
          	fs.writefile(outdir + '/redirect.nft', (opt.transparent != 'off' && opt.impl == 'redirect') ? lib.nft_redirect(opt, ctx) : '');
          	let env = sprintf("GOMAXPROCS=%s\nGOGC=%s\n", (+opt.gomaxprocs > 0) ? opt.gomaxprocs : '', (+opt.gogc > 0) ? opt.gogc : '');
          	if (opt.splice == '0')
          		env += 'XRAY_VLESS_SPLICE=off\n';
          	fs.writefile(outdir + '/env', env);
          	fs.writefile(outdir + '/state.json', sprintf('%J\n', { server: cur.id, name: cur.name, ip: srv.ip, ipv6: ctx.ipv6, wan: ctx.wan, lan: ctx.lan }));
          	return 0;
          }

          function add() {
          	let c = uci(), report = [], text = fs.stdin.read('all') ?? '';
          	let first = null;
          	for (let l in lines(text)) {
          		let p = lib.parse_link(l);
          		if (p.error) {
          			push(report, { ok: false, error: p.error, link: substr(l, 0, 24) });
          			continue;
          		}
          		let dup = null, key = replace(p.link, /#.*$/, '');
          		c.foreach('xlite', 'server', (s) => { if (replace(s.link ?? '', /#.*$/, '') == key) dup = s['.name']; });
          		if (dup) {
          			push(report, { ok: true, id: dup, name: p.name, dup: true });
          			continue;
          		}
          		let id = c.add('xlite', 'server');
          		c.set('xlite', id, 'name', p.name);
          		c.set('xlite', id, 'link', p.link);
          		first ??= id;
          		push(report, { ok: true, id, name: p.name });
          	}
          	if (first && !c.get('xlite', 'main', 'server'))
          		c.set('xlite', 'main', 'server', first);
          	c.save('xlite');
          	c.commit('xlite');
          	print(sprintf('%J\n', report));
          	return 0;
          }

          let cmd = ARGV[0];
          let rc = 2;
          if (cmd == 'build')
          	rc = build(ARGV[1] ?? '/var/etc/xlite');
          else if (cmd == 'add')
          	rc = add();
          else if (cmd == 'server') {
          	// address and port of one server (for the ping)
          	let c = uci(), l = c.get('xlite', ARGV[1] ?? '', 'link'), p = l ? lib.parse_link(l) : { error: 'no' };
          	if (!p.error) {
          		print(p.address, ' ', p.port, '\n');
          		rc = 0;
          	}
          	else
          		rc = 1;
          }
          else if (cmd == 'resolve') {
          	print(join('\n', resolve(ARGV[1] ?? '')), '\n');
          	rc = 0;
          }
          else
          	warn('usage: gen.uc build <dir> | add | resolve <host>\n');
          exit(rc);
          XLITE_FILE_8
          mkdir -p "$(dirname "src/www/luci-static/resources/view/xlite/main.js")"
          cat > "src/www/luci-static/resources/view/xlite/main.js" <<'XLITE_FILE_9'
          'use strict';
