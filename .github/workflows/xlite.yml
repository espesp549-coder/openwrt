          	'background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;border-radius:18px;padding:16px;margin:0 auto;max-width:980px;box-sizing:border-box;line-height:1.5}',
          	'.xl *{box-sizing:border-box}',
