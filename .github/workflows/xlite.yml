          				txt('gogc', 'GOGC', 'كل ما يزيد يقل شغل تنظيف الذاكرة (الافتراضي 200)', 'number'),
          				sel('loglevel', 'السجل', 'تفاصيل سجل النواة', [ [ 'warning', 'تحذيرات' ], [ 'info', 'معلومات' ], [ 'debug', 'كل شي' ], [ 'error', 'أخطاء بس' ], [ 'none', 'بدون' ] ])
          			]),
