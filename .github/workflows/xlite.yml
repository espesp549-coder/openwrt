          'require rpc';
          'require ui';
          'require poll';

          var callStatus = rpc.declare({ object: 'xlite', method: 'status' });
          var callServers = rpc.declare({ object: 'xlite', method: 'servers' });
          var callAdd = rpc.declare({ object: 'xlite', method: 'add', params: [ 'links' ] });
          var callRemove = rpc.declare({ object: 'xlite', method: 'remove', params: [ 'id' ] });
          var callRename = rpc.declare({ object: 'xlite', method: 'rename', params: [ 'id', 'name' ] });
          var callLink = rpc.declare({ object: 'xlite', method: 'link', params: [ 'id' ] });
          var callEdit = rpc.declare({ object: 'xlite', method: 'edit', params: [ 'id', 'link' ] });
          var callSelect = rpc.declare({ object: 'xlite', method: 'select', params: [ 'id' ] });
          var callConnect = rpc.declare({ object: 'xlite', method: 'connect', params: [ 'on' ] });
          var callPing = rpc.declare({ object: 'xlite', method: 'ping', params: [ 'id' ] });
