          	settings: {
          		call: function() {
          			let c = uci(), opt = c.get_all('xlite', 'main') ?? {}, r = {};
          			for (let k in SETTINGS)
          				r[k] = opt[k] ?? '';
          			r.bypass = opt.bypass ?? '';
          			r.r2_domains = opt.r2_domains ?? '';
          			r.routinga = opt.routinga ?? '';
          			r.server2 = opt.server2 ?? '';
          			return { settings: r, tcp_cc_now: trim(fs.readfile('/proc/sys/net/ipv4/tcp_congestion_control') ?? ''),
          				tcp_cc_avail: split(trim(fs.readfile('/proc/sys/net/ipv4/tcp_available_congestion_control') ?? ''), ' ') };
          		}
          	},

          	set_settings: {
          		args: { values: {} },
          		call: function(req) {
          			let c = uci(), v = req.args?.values ?? {}, bad = [], changed = {};
          			for (let k in v) {
          				let rule = SETTINGS[k], val = '' + v[k];
          				if (k == 'bypass') {
          					if (length(filter(split(trim(val), /[ ]+/), (x) => x != '' && !lib.ip4_ok(x, true) && !lib.ip6_ok(x, true)))) push(bad, k);
          					else { c.set('xlite', 'main', k, trim(val)); changed[k] = true; }
          					continue;
          				}
          				if (k == 'r2_domains') {
          					val = trim(replace(val, /[\r\n\t, ]+/g, ' '));
          					// an entry made of digits (an address) must be a real one, or nft and the core refuse the rules
          					let badip = filter(split(val, ' '), (x) => (match(x, /^[0-9.\/]+$/) && !lib.ip4_ok(x, true)) || (index(x, ':') >= 0 && !lib.ip6_ok(x, true)));
          					if (length(val) > 8000 || !match(val, /^[A-Za-z0-9.:\/*_ -]*$/) || length(badip)) push(bad, k);
          					else { c.set('xlite', 'main', k, val); changed[k] = true; }
          					continue;
          				}
          				if (k == 'routinga') {
          					if (length(val) > 20000 || length(lib.routinga(val).errs)) push(bad, k);
          					else { c.set('xlite', 'main', k, val); changed[k] = true; }
          					continue;
          				}
          				if (!rule || !valid(rule, val)) {
          					push(bad, k);
          					continue;
          				}
          				if (c.get('xlite', 'main', k) != val) {
          					c.set('xlite', 'main', k, val);
          					changed[k] = true;
          				}
          			}
          			c.save('xlite');
          			c.commit('xlite');
          			let restart = false;
          			for (let k in changed) if (!NO_RESTART[k]) restart = true;
          			let on = (c.get('xlite', 'main', 'enabled') == '1');
          			// new exceptions change the DNS lines too: download the list, then restart (one restart for all)
          			if (changed.adblock_allow && on) {
          				sc.pid_t = -100; sc.rules_t = -100; sc.core_t = -100;
          				bg('/usr/bin/xlite adblock; /etc/init.d/xlite restart', TMP + '/ads.log');
          				return { ok: !length(bad), bad, restart: true };
          			}
          			if (changed.adblock_size || changed.adblock_allow)
          				bg('/usr/bin/xlite adblock && /usr/bin/xlite dns_on', TMP + '/ads.log');
          			if (restart && (on || changed.bot_enabled || changed.bot_token))
          				restart_bg();
          			return { ok: !length(bad), bad, restart };
          		}
          	},

