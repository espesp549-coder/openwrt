          					return { ok: false, error: 'هذا آخر منفذ LAN، ما ينحول' };
          				if (index(ports, p) >= 0)
          					c.set('network', br, 'ports', filter(ports, (x) => x != p));
          				// a port listed in a bridge-vlan section of br-lan is put back in the bridge by netifd, whatever the
          				// bridge's own ports say: out of there too, each entry kept to be put back ("lan3:u*")
