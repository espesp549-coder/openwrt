          	// the router's USB ports: what is plugged in, whether it became a network (a line), and the drivers
          	usb_status: {
          		call: function() {
          			let roots = 0, devs = [], kver = trim(sh('uname -r 2>/dev/null'));
          			for (let e in fs.lsdir('/sys/bus/usb/devices') ?? []) {
          				let b = '/sys/bus/usb/devices/' + e + '/';
          				if (match(e, /^usb[0-9]+$/)) { roots++; continue; }
          				if (!match(e, /^[0-9]+-[0-9.]+$/))
          					continue;
          				let cls = trim(fs.readfile(b + 'bDeviceClass') ?? '');
          				if (cls == '09')     // a hub
          					continue;
          				let vid = trim(fs.readfile(b + 'idVendor') ?? ''), pid = trim(fs.readfile(b + 'idProduct') ?? '');
          				let name = trim((fs.readfile(b + 'manufacturer') ?? '') + ' ' + (fs.readfile(b + 'product') ?? ''));
          				let net = null;
          				for (let n in fs.lsdir('/sys/class/net') ?? []) {
          					let l = fs.readlink('/sys/class/net/' + n + '/device') ?? '';
          					if (match(l, regexp('/' + replace(e, /\./g, '\\.') + ':[0-9.]+$'))) { net = n; break; }
          				}
          				// what it is, for the page: a phone (Apple, or anything with an RNDIS / NCM interface), a modem, storage…
          				let ifc = '';
          				for (let x in fs.lsdir('/sys/bus/usb/devices') ?? [])
          					if (index(x, e + ':') == 0) ifc += trim(fs.readfile('/sys/bus/usb/devices/' + x + '/bInterfaceClass') ?? '') + ' ';
          				let kind = vid == '05ac' ? 'iphone' : match(ifc, /\b(e0|ef)\b/) ? 'phone' : match(ifc, /\b02\b/) ? 'modem' : match(ifc, /\b08\b/) ? 'storage' : 'other';
          				push(devs, { path: e, name: name || (vid + ':' + pid), vid, pid, kind, net, speed: trim(fs.readfile(b + 'speed') ?? '') });
          			}
          			let mod = (m) => !!fs.stat('/sys/bus/usb/drivers/' + m) || !!fs.stat('/lib/modules/' + kver + '/' + m + '.ko');
          			let st = fs.readfile(TMP + '/usb.log');
          			return { roots, devices: devs, drivers: { rndis: mod('rndis_host'), ncm: mod('cdc_ncm'), ether: mod('cdc_ether'), ipheth: mod('ipheth'), usbmuxd: !!fs.stat('/usr/sbin/usbmuxd') },
          				installing: st != null && !match(st, /rc=[0-9]/) };
          		}
          	},

          	// the bonding tools (see bond_tools), installed in the background
          	bond_deps: {
          		call: function() {
          			bond_tools_c.t = 0;
          			bg('/usr/bin/xlite bond_deps', TMP + '/bonddeps.log');
          			return { ok: true };
          		}
          	},

          	// where the processor goes: every process and the kernel's packet work (softirq), measured over 2 s,
          	// in % of the whole router (all cores = 100)
          	cpu_top: {
          		call: function() {
          			let snap = () => {
          				let t = { p: {}, all: 0, sirq: 0, idle: 0 };
          				let c = match(fs.readfile('/proc/stat') ?? '', /^cpu +([0-9 ]+)/);
          				if (c) { let v = map(split(trim(c[1]), / +/), (x) => +x); for (let x in v) t.all += x; t.idle = v[3] + (v[4] ?? 0); t.sirq = (v[5] ?? 0) + (v[6] ?? 0); }
          				for (let d in fs.lsdir('/proc') ?? []) {
          					if (!match(d, /^[0-9]+$/)) continue;
          					let s = fs.readfile('/proc/' + d + '/stat');
          					if (!s) continue;
          					let a = index(s, '('), b = rindex(s, ')');
          					let f = split(substr(s, b + 2), ' ');
          					t.p[d] = { n: substr(s, a + 1, b - a - 1), j: +f[11] + +f[12] };
          				}
          				return t;
          			};
          			let a = snap();
          			sleep(2000);
          			let b = snap(), all = (b.all - a.all) || 1, by = {};
          			for (let pid, x in b.p) {
          				let dj = x.j - (a.p[pid]?.j ?? x.j);
          				if (dj > 0) by[x.n] = (by[x.n] ?? 0) + dj;
          			}
          			let top = [];
          			for (let n, j in by) push(top, { name: n, pct: int(1000 * j / all) / 10 });
          			top = slice(sort(top, (x, y) => y.pct - x.pct), 0, 8);
          			return { ok: true, top, softirq: int(1000 * (b.sirq - a.sirq) / all) / 10, idle: int(1000 * (b.idle - a.idle) / all) / 10 };
          		}
          	},

