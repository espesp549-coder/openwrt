          				// a USB modem was never a LAN port
          				if (br && index(ports, p) < 0 && fs.stat('/sys/class/net/' + p) && index(fs.readlink('/sys/class/net/' + p + '/device') ?? '', 'usb') < 0)
          					c.set('network', br, 'ports', [ ...ports, p ]);
          				// back into the bridge-vlan sections it was taken from
          				let rest = [];
          				for (let w in words2(c.get('xlite', 'main', 'vlan_saved'))) {
          					let x = match(w, /^([A-Za-z0-9_]+)\|(.+)$/);
          					if (!x || split(x[2], ':')[0] != p) { push(rest, w); continue; }
          					if (c.get('network', x[1]) != 'bridge-vlan')
          						continue;
          					let vp = c.get('network', x[1], 'ports') ?? [];
          					if (type(vp) != 'array') vp = split(vp, ' ');
          					if (index(vp, x[2]) < 0) c.set('network', x[1], 'ports', [ ...vp, x[2] ]);
          				}
          				if (length(rest)) c.set('xlite', 'main', 'vlan_saved', join(' ', rest));
          				else c.delete('xlite', 'main', 'vlan_saved');
